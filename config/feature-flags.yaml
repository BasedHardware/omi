  - {"key":"SYNC_RECORD_WAIT_MEMO_FIRST","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; consult the unproven-coverage memo before the retained copy and the WAL decode; false/0/off restores the previous request order","fail":"open","owner":"omi-pipeline / SCA-2229","created":"2026-11-14","terminal":"keep","decision":"keep","notes":"Memo key carries the file count and total bytes beside the content id, which already hashes each loaded basename and its bytes, so a different WAL for the same record is still retained. The partial-coordinator wake still runs on a hit. Disabling this switch moves the memo check after the retained copy. Rollback: set false."}
  - {"key":"SYNC_RECORD_DECODE_FAILURE_MEMO","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; repeat a proven deterministic decode failure for the same upload identity for 300 seconds without decoding or staging it again; false/0/off restores a full decode per retry","fail":"open","owner":"omi-pipeline / SCA-2229","created":"2026-11-14","terminal":"keep","decision":"keep","notes":"Only a closed set of decode faults is memoized: the strict WAL decoder messages, the 128-unit bundle bound, and the 400 Audio decode failed that is also raised when no input file is readable at all. Config, Firestore, storage and privacy failures stay retryable, so a transient local fault can hold one repeated 503 for up to 300 seconds. The answer remains the existing 503 byte for byte, so the phone keeps custody. Rollback: set false."}

  - {"key":"EPISODE_COMPOSE_SETTLE_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; gate closed-episode composes on speech, names and membership, with a COMPOSER_SETTLE_SECONDS background quiet window capped at COMPOSER_MAX_SETTLE_SECONDS; foreground reads bypass settling","fail":"open","owner":"auditfix","created":"2026-11-04","terminal":"keep","decision":"keep","notes":"David requested 2026-11-04. Set false/0/off/no to restore full-fingerprint triggering and immediate retries. Full fingerprint, paid-once lease and prompt inputs remain unchanged. Watch omi_episode_compose_total by outcome, composed per close, superseded, settling, and omi_episode_compose_trigger_skipped_total by reason. No attach-path changes. See backend/utils/episodes/composer.py and backend/docs/listen_pusher_pipeline/changes/2026-11-04-episode-compose-settle.md."}
  - {"key":"EPISODE_COMPOSE_LATE_ATTACH_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; a member that joins an already-composed closed episode re-arms that episode's compose through the existing evidence compare","fail":"open","owner":"refactor-lead","created":"2026-11-10","terminal":"keep","decision":"keep","notes":"Fable audit 2026-11-10 class 7 (relay-cl1 f6502a). The settle job already re-arms on a member finalize; a sync intake attach can land after that finalize and be suppressed by the attach memo, so the closed episode kept notes that never saw the member. Its own switch, not EPISODE_COMPOSER_THRIFT: turning the THRIFT cost controls off must not restore the gap. Reuses composer.schedule_for_conversation, which stamps compose_pending_since only when the member changed the evidence and keeps the paid-once lease, so an unchanged fingerprint buys no second paid compose. Set false/0/off/no to restore the previous attach behavior. Watch omi_episode_compose_total by outcome and omi_episode_compose_trigger_skipped_total by reason. See backend/utils/episodes/late_member.py and backend/docs/listen_pusher_pipeline/changes/2026-11-10-episode-late-member-compose.md."}
  - {"key":"EPISODE_COMPOSER_THRIFT","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on unless set off; retain paid compose output, map single-member notes, label triggers and compose deferred episodes on open","fail":"open","owner":"refactor-lead","created":"2026-11-10","terminal":"keep","decision":"keep","notes":"L8b after independent reuse/L1 PR #25073. Normal gates. False/0/off/no restores paid single-member composition, discard/retry and finalize scheduling; detail reads schedule nothing when off. Composed late episodes re-defer on membership drift, with attach-time signal, first-open and seven-day read recovery. Bounded lease includes every paid turn; waiting members preserve paid output. See backend/docs/listen_pusher_pipeline/changes/2026-11-10-composer-thrift-fold.md."}
  - {"key":"ENRICHMENT_MAX_AGE_HOURS","aliases":[],"kind":"env","lifecycle":"config_switch","surfaces":["backend"],"summary":"Default 72 hours: park historical enrichment without deleting its durable obligation; 0 disables new parking","fail":"closed","owner":"auditfix","created":"2026-11-04","terminal":"keep","decision":"keep","notes":"David 2026-11-04: only process the last three days. Either old conversation created_at or old first_pending_at parks unleased work under age_gate_72h. No data is deleted. Increase the window or set 0 before a separately authorized bounded unpark; decreasing a nonzero window parks more work. Existing parked rows remain durable and do not re-wake on mark, sweep or debt repair."}

  - {"key":"ENRICHMENT_FRESH_DEMOTE_AFTER_MIN","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on (the fresh promotion window, 30 minutes); a fresh-queue first-summary delivery whose obligation and conversation finish time are both older is re-bound to the primary enrichment queue and answered 200; 0 disables demotion","fail":"open","owner":"two-lane lead","created":"2026-11-16","terminal":"keep","decision":"keep","notes":"Prod 2026-11-16: enrichment-fresh held 6,800 aged tasks while primary was idle, because a fresh binding was never revisited. Demotion runs only for deliveries whose X-CloudTasks-QueueName is the fresh queue, requires both first_pending_at and the conversation finished_at clock (same as promotion) to be past the threshold, never touches leased, dormant or re-tokened rows, keeps handler/audience/invoker, and marks fresh_demoted so the sweep never re-promotes. 0 restores the previous behaviour; demoted rows simply run on the primary queue. See backend/utils/enrichment/fresh_demotion.py."}

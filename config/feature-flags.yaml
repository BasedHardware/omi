  - {"key":"LISTEN_STT_SAME_TARGET_RETRY_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on unless false; a live STT target that fails at the transport (connect timeout, connection_lost or send_failed before first text) and is neither benched nor circuit-open is retried once, after 0.1-0.5 s jitter, before the chain falls through","fail":"open","owner":"dazheng","created":"2026-10-20","terminal":"keep","decision":"keep","ramp":{"cohorts":["all routed and static listen sessions at deploy (default on)"],"clean_metric":"stt_selection soniox->unavailable and soniox->modulate exhausted hops fall while omi_stt_same_target_retries_total{outcome=served} rises and Soniox provider_429 stays flat","expander":"dazheng (two-lane lead)","done_by":"2026-10-27"},"notes":"Listen env only. One retry per family per session; mid-session retries take the recovery controller's single re-entry grant and the episode budget still bounds dials. Typed rejections (5xx, 429, budget, auth, capacity) never retry. The first failure still counts as a provider-failure vote. False restores immediate fall-through."}
  - {"key":"LISTEN_SESSION_LOCAL_EXCLUSION_RELEASE_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on unless false; a live STT provider that left a session only for replay_ring_overflow becomes selectable again once a successor is adopted, instead of staying excluded for the session","fail":"open","owner":"dazheng","created":"2026-10-20","terminal":"keep","decision":"keep","notes":"Listen env only. The immediate replacement still differs from the overflowed leg; any provider-evidence death of the same family keeps the exclusion, and the recovery dial ledger and episode cap still bound re-dials. omi_stt_session_local_exclusion_releases_total{provider} counts releases. See backend/docs/operational/windowed-live-stt.md."}

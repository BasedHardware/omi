  - {"key":"mobile-wal-delta-index-off","aliases":[],"kind":"posthog","lifecycle":"ops_kill","surfaces":["mobile"],"summary":"True makes the iOS and Android clients save the WAL recording index through the pre-delta full-snapshot writer; false or absent keeps the delta index worker on","fail":"inverted","owner":"auditfix","created":"2026-10-28","terminal":"keep","decision":"keep","posthog":{"row":"expected","role":"kill"},"notes":"Default false: the delta writer ships on for everyone. Read once per app launch through the identity/consent-fenced analytics adapter with a 1 s bound; unavailable/offline/tracking-disabled reads keep the delta writer on. Both writers produce the same version-1 index file, so flipping either way needs no migration and takes effect on the next launch. Registering as a kill role lets scripts/posthog_flag_sync.py --apply-missing-kills pre-arm the row at 0%. No remote row is created or changed by this PR. Rollback: true."}

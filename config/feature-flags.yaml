  - {"key":"PROCESSING_ATTENTION_NON_RETRYABLE_EXPIRY_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; expire unresolved class 11 recovery_structure_unavailable attention items seven days after creation","fail":"open","owner":"refactor-lead","created":"2026-11-10","terminal":"keep","decision":"keep","notes":"Default on for Fable audit class 11 under relay-cl1 ruling f6502a. Listing a recovery_structure_unavailable item whose effective retryable state remains false after retry-claim reconciliation marks it inactive with expired_at and expiry_reason=non_retryable_ttl, a terminal exit; the record is retained. Retryable and newer items are unchanged. Set false to restore the legacy indefinite listing without reactivating items already expired. No client change is required. Runtime base values and matching GKE chart env declare true; set false there and recompose for rollback."}

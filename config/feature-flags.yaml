  - {"key":"BATCH_VENDOR_OVERFLOW_MIN_READY_UNITS","aliases":[],"kind":"env","lifecycle":"config_switch","surfaces":["backend"],"summary":"Default 300; admissible units of the sampled priority that must be waiting in the GPU ring before an old head counts as saturation for vendor overflow and the legacy capacity fallback; saturation ends below half of it (1-100000, else default)","fail":"closed","owner":"two-lane lead","created":"2026-11-01","terminal":"keep","decision":"keep","notes":"Keeps stuck heads from reading as backlog: 2026-11-01 18:01Z the ring held 111 admissible fresh units 42 h old (4 parked owners) while idle. Same count as omi_batch_pipeline_admissible_ready_units. config/batch_pipeline_vendor_overflow.py."}
  - {"key":"BATCH_VENDOR_OVERFLOW_PRIORITIES","aliases":[],"kind":"env","lifecycle":"config_switch","surfaces":["backend"],"summary":"Default fresh; comma-separated fresh|recent|deep priorities eligible for vendor overflow when that priority is saturated; FRESH is always included; unset, empty or malformed lists keep fresh only","fail":"closed","owner":"two-lane lead","created":"2026-11-17","terminal":"keep","decision":"keep","notes":"config/batch_pipeline_vendor_overflow.py; read per admission. fresh,recent explicitly enables RECENT vendor overflow inside the routing cohort with legacy draining or dark. The legacy-sync capacity fallback remains FRESH-only. BATCH_VENDOR_OVERFLOW_ENABLED remains the kill switch. David approved prod enablement 2026-11-16 (L4 stockout): the prod overlay sets fresh,recent on backend-sync, backend-sync-backfill and backend-integration; rollback fresh."}
  - {"key":"BATCH_LEGACY_CAPACITY_FALLBACK_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; while the GPU ring reads saturated (see BATCH_VENDOR_OVERFLOW_MIN_READY_UNITS), a new fresh upload from an owner whose legacy sync is still on stays on legacy sync instead of queueing behind the ring. false queues it on batch as before","fail":"open","owner":"two-lane lead","created":"2026-11-01","terminal":"keep","decision":"keep","notes":"Lead ruling ec4a93 (2026-11-01). Same intake exit as heavy-owner exclusion, before any custody write; counted as omi_fallback_total{component=sync_dispatch,reason=capacity_full}. Never for backfill, a conversation batch already owns, or owners whose legacy is draining or dark."}

  - {"key":"episode_f_join","aliases":[],"kind":"posthog","lifecycle":"rollout","surfaces":["backend"],"summary":"Server-only Omi flag store rule: uids whose uncertain recorded-time episode joins (live owner, 2 to 30 min gap) settle with variant F full-transcript Jev; no answer keeps today's join; absent falls back to EPISODE_F_JOIN_PERCENT (default 0)","fail":"closed","owner":"auditfix","created":"2026-11-05","review_by":"2026-11-19","terminal":"on","decision":"pending","posthog":{"row":"absent","role":"enable"},"ramp":{"cohorts":["5","25","100"],"clean_metric":"omi_jev_decision_total{lane=episode_boundary_f} non-success share and latency, omi_episode_boundary_total f_close/(f_close+f_continue) and f_no_answer, omi_episode_closed_members and omi_episode_closed_span_seconds by arm, closed episodes per arm normalized by percent","expander":"dazheng","done_by":"2026-11-07"},"notes":"David 2026-11-09 (flag rulings): extend; renew review_by from 2026-11-19 to 2026-11-22; owner lead2; ramp done_by 2026-11-07->2026-11-22; review due for: the listen roll and a counted readback, not another ramp. David 2026-11-05: ship F under the $0.5/user/mo cap (est 1.5 cents); ramp 5, 25, 100 as soon as each lookback is clean, overnight included. Ramp: scripts/omi_flags.py set episode_f_join --rollout N. Kill: --inactive (propagates within 15 to 60 s). Server-only: no PostHog row and no client surface.","extension":{"until":"2026-11-22","reason":"ad1268 D: ad1268 (d); n3 2.6: keep at flag-store 100 (v14, David's order); gates are the listen roll + scrape fix, then re-measure","by":"auditfix","granted":"2026-11-08"}}

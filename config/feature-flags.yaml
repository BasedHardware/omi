  - {"key":"receipt_finished_note","aliases":[],"kind":"posthog","lifecycle":"rollout","surfaces":["mobile","backend"],"summary":"With receipt_long_poll. A finished upload job leaves a note in Redis for an hour, written before its wake, and the receipts wait reads job state only for a job a note or a wake names; an expired wait answers without reading anything. The app status-polls a job the wait covers once a minute as a backstop. Absent or false: every start, wake and expiry of a wait re-reads every listed job.","fail":"closed","owner":"Goal: Pipeline","created":"2026-11-25","review_by":"2026-12-09","terminal":"undecided","decision":"pending","posthog":{"row":"absent","role":"enable"},"notes":"Omi flag store rule read by the backend per account (backend/config/reliability_experiments.py, bound in utils/reliability_flags.py) and by the mobile app from GET /v1/flags (app/lib/services/experiments/reliability_flags.dart), so one rule switches both sides. No rule or an inactive rule is off. Rollback: deactivate the rule. Admit an account to receipt_long_poll only together with this flag: without the note the wait reads several times more job documents than status polling. A failed upload leaves no note and no wake; the app's once-a-minute poll finds it. See backend/database/sync_jobs.py leave_receipt_note and backend/routers/sync.py wait_for_sync_receipts.","ramp":{"cohorts":["internal accounts (allow list)","5%","25%","100%"],"clean_metric":"Job-status reads per receipts wait and per upload job on admitted accounts against status polling, upload finished to receipt seen seconds, share of finished uploads found by the backstop poll instead of the wait","expander":"Goal: Pipeline owner","done_by":"2026-12-09"}}

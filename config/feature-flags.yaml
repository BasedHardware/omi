  - {"key":"OMI_LIST_VERSION_EPOCH","aliases":[],"kind":"env","lifecycle":"rollout","surfaces":["backend"],"summary":"Empty by default; unique reader rollout epoch after complete writer-fleet attestation","fail":"closed","owner":"dazheng","created":"2026-10-23","review_by":"2026-10-24","terminal":"on","decision":"pending","notes":"Mixed writers can otherwise miss invalidation. Lead deploys/audits every writer in T2, checks staging synthetic body parity plus update/delete/correction and allowance rollover, then 5 percent reader-enabled revision traffic followed by 100 percent after two clean hours by T3 08:00Z. Clear before any writer rollback; use a fresh epoch after re-audit. Existing clients may opt into If-None-Match; ordinary source queries remain for 200 responses.","ramp":{"cohorts":["complete writer fleet and staging synthetic canary","5% backend traffic","100% backend traffic"],"clean_metric":"staging source-body parity mismatches zero; 5xx and p95 no worse than baseline; origin-attributed net Firestore reads including marker reads and added writes decrease","expander":"two-lane rollout lead","done_by":"2026-10-24"}}

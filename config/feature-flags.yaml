  - {"key":"HOME_TRANSCRIPTION_PRESENTATION_GATE","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; stamped empty completed batch captures show Transcribing until their deadline, then a visible transcription failure title","fail":"open","owner":"auditfix","created":"2026-11-05","terminal":"keep","decision":"keep","notes":"Presentation only at list/detail API exits. Set false/0/off/no to restore stored status/title. Deadline is stamped regardless of lever state; no custody or completion ordering changes."}
  - {"key":"HOME_TRANSCRIPTION_QUEUE_HOLD_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; queued batch captures stay Transcribing for a read-time 24h server-pending wait per upload revision; reads never renew it","fail":"open","owner":"quality-lead","created":"2026-11-15","terminal":"keep","decision":"keep","notes":"Presentation only for conversation and episode reads. HOME_TRANSCRIPTION_MAX_AGE_SECONDS defaults to 86400 per upload revision from the server pending clock, else pending time inferred from the stamped deadline minus HOME_TRANSCRIPTION_DEADLINE_SECONDS, else creation; reads never renew it. Invalid or nonpositive values use 86400. New upload revisions may start new waits; there is no lifetime bound. Rows without any valid server timestamp remain Transcribing; a lifetime guarantee would need a separate immutable admission clock. Heals existing two-hour stamps without writes or extra Firestore reads. Explicit failed status, dead letter and record_upload_failed still fail immediately. Expiry is failed for Activity, hidden on confirmed Home per R-20261110-06. Queued rows suppress summary_retryable. Set false/0/off/no to restore stamped deadlines and the legacy two-hour unstamped fallback. No batch scheduling, custody or completion changes."}

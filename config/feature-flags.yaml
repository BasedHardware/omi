  - {"key":"mobile-speech-analyzer-disabled","aliases":[],"kind":"posthog","lifecycle":"ops_kill","surfaces":["mobile"],"summary":"Force existing iOS freemium fallback to SFSpeech; false or absent selects SpeechAnalyzer on supported iOS 26 devices/locales","fail":"inverted","owner":"auditfix","created":"2026-10-14","terminal":"keep","decision":"keep","posthog":{"row":"expected","role":"kill"},"notes":"Default false: improved engine ships on. True rolls back both availability probing and transcription without a release. Registering as a kill role lets `scripts/posthog_flag_sync.py --apply-missing-kills` pre-arm the row at 0% so the emergency rollback is available before an incident. Read per operation through the existing identity/consent-fenced analytics adapter; unavailable/offline/tracking-disabled flag reads retain the new-engine default. No remote row is created or changed by this PR."}
  - {"key":"mobile-pendant-independent-ring-drain","aliases":[],"kind":"posthog","lifecycle":"ops_kill","surfaces":["mobile"],"summary":"Default-on independent ring drain for pendants on firmware 3.0.20 or later. Explicit false selects the legacy upload-coordinated ring download; missing or unreadable keeps independent drain on.","fail":"open","owner":"Goal: Pipeline","created":"2026-11-26","terminal":"keep","decision":"keep","posthog":{"row":"absent","role":"enable"},"notes":"Current mobile builds resolve this boolean through the authenticated Omi flag store. The app pins the route on launch; relaunch to pick up a change. The store may be absent or active at 100% before fleet telemetry ships. For the first beta containing SCA-4532 and SCA-4753, keep rollout at 100% and set deny_uids to an approved, stable sample of about 10% of eligible beta accounts for three days. Then clear the deny list at 100%. An explicit false for all accounts switches everyone to the legacy schedule. WalSyncs.drainCohort reports the effective route on eligible firmware. Both routes retain the same ring custody implementation."}
  - {"key":"mobile-wal-delta-index-off","aliases":[],"kind":"posthog","lifecycle":"ops_kill","surfaces":["mobile"],"summary":"True makes the iOS and Android clients save the WAL recording index through the pre-delta full-snapshot writer; false or absent keeps the delta index worker on","fail":"inverted","owner":"auditfix","created":"2026-10-28","terminal":"keep","decision":"keep","posthog":{"row":"expected","role":"kill"},"notes":"Default false: the delta writer ships on for everyone. Read once per app launch through the identity/consent-fenced analytics adapter with a 1 s bound; unavailable/offline/tracking-disabled reads keep the delta writer on. Both writers produce the same version-1 index file, so flipping either way needs no migration and takes effect on the next launch. Registering as a kill role lets scripts/posthog_flag_sync.py --apply-missing-kills pre-arm the row at 0%. No remote row is created or changed by this PR. Rollback: true."}

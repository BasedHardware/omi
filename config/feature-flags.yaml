  - {"key":"BATCH_PIPELINE_OWNER_DRAIN_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; a per-process owner drain walks each discovered owner's result log continuously (up to 8 owners at once, 120 s turns, FIFO re-queue) instead of the sweep-shared 30 s walk budget","fail":"open","owner":"backlog-refactor","created":"2026-10-20","terminal":"keep","decision":"keep","notes":"False restores the sweep owner-chain walk with every pre-check; read-ahead (BATCH_PIPELINE_PROJECTION_PREFETCH=0) and the deferred index (BATCH_PIPELINE_PROJECTION_INDEX_DEFERRED_ENABLED=false) have their own switches, and all three off is the pre-drain behaviour. On: the sweep only discovers owners; each walk holds the advisory owner claim for its 15 s step and skips the predecessor/per-part pre-check transactions for rows it reached as the watermark's successor. The assignment transaction's predecessor, privacy and receipt fences stay authoritative; one owner never runs two chains. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"PROJECTION_DRAIN_CLAIM_AWARE","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; read-only fleet claim admission and jittered backoff for redundant claim-busy owner-drain requests","fail":"open","owner":"auditfix","created":"2026-11-05","terminal":"keep","decision":"keep","notes":"Only off (after trimming whitespace and lowercasing) disables this switch; false, 0 and no keep it ON and emit a warning, including when CAPTURE_COVERAGE_MODE=serve. Unknown values also remain on. Initial admissions GET the existing Redis claim and fail open on any error. Backoff applies only to claim_busy turns re-requested through again; productive more=True continuations retain immediate FIFO progress without the peek. See backend/docs/listen_pusher_pipeline.mdx#batch-projection-drain-admission."}
  - {"key":"PROJECTION_PRIVACY_REFUSAL_RESUME","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; retry a projection after its hinted privacy refusal no longer applies, using fenced replay for stored refusals","fail":"open","owner":"auditfix","created":"2026-11-06","terminal":"keep","decision":"keep","notes":"Only off (after trimming whitespace and lowercasing) disables this switch; false, 0 and no keep it ON and emit a warning. Unknown values also remain on. Applicable refusals still hold. Stored refusals use the existing transactional resume; assignments require a durable projection policy and repeat their ordinary privacy fences. Does not alter deletion or tombstone handling."}
  - {"key":"PROJECTION_DRAIN_PRIVACY_BACKOFF","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; defer zero-progress privacy-blocked owner drains until TTL expiry or a head result row change","fail":"open","owner":"auditfix","created":"2026-11-06","terminal":"keep","decision":"keep","notes":"Only off (after trimming whitespace and lowercasing) disables this switch; false, 0 and no keep it ON and emit a warning. Record the blocked head update_time, then use one cheap fail-open result read on incoming wakes and at most 180 seconds between timer checks (PROJECTION_DRAIN_PRIVACY_BACKOFF_SECONDS clamps to 30-900). Unchanged early checks keep their capped timer slot; TTL expiry always releases the owner for another drain turn. Scheduling only; no row writes or privacy guard changes."}
  - {"key":"PROJECTION_DRAIN_LIVE_TARGET_BACKOFF","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; only off disables zero-progress awaiting-live-target owner drain backoff capped at 300 seconds","fail":"open","owner":"omi-pipeline","created":"2026-11-08","terminal":"keep","decision":"keep","notes":"Passive hold since 2026-11-09 (expiry re-admits for the next sweep request, never wakes; an active wake doubled conflicts). 30/60/120/240/300-second per-owner retries; progress or another stop resets bounded process-local attempts. Off restores head_error and ordinary sweep retry. Privacy, deleted/held dispositions and the 24-hour bound are unchanged. Replaces counted dead SYNC_BACKFILL_INFLIGHT_LIMIT: its slot-acquisition primitive had no serving callers after C6 retired v1; legacy slot release and daily caps remain."}
  - {"key":"BATCH_PIPELINE_HELD_TERMINAL_STATUS_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; terminally held batch uploads retain phone custody as processing/batch_unit_held with a five-minute poll hint","fail":"open","owner":"backlog-refactor","created":"2026-10-20","terminal":"keep","decision":"keep","ramp":{"cohorts":["all batch uploads at deploy (default on)"],"clean_metric":"Zero completed status responses for uploads with unresolved held units; projected siblings remain visible and held polls are paced at five minutes","expander":"dazheng (two-lane lead)","done_by":"2026-10-27"},"notes":"Read-only status projection; no ledger, job or retention write. Phones keep their independent WAL copy until actual completion; server artifact retention alone never permits acknowledgement. Open operator intents or in-flight siblings also remain processing. False restores failed/batch_worker_quarantined and still never acknowledges custody. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_RECOVERY_POLICY_REFRESH_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; a quarantined held unit whose recorded recovery policy is disabled and which has no recovery intent (no paid call authorized) re-resolves the recovery setting at sweep or dispatch, and adopts it only when it is now enabled","fail":"open","owner":"backlog-refactor","created":"2026-10-20","terminal":"keep","decision":"keep","ramp":{"cohorts":["all held units at deploy (default on)"],"clean_metric":"recovery sweep outcome=disabled count falls to zero and paid recovery starts stay within the per-owner allowance","expander":"dazheng (two-lane lead)","done_by":"2026-10-27"},"notes":"Spends at most the one at-most-once paid recovery the unit would have had if admitted while recovery was on; the existing allowance/cap gates and RecoveryStore.start fence still apply. An enabled snapshot is never re-resolved or downgraded. False restores the frozen snapshot (outcome=disabled forever). See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_HELD_PARTIAL_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; publish healthy siblings and charge their speech through a partial ledger while unresolved units retain phone custody","fail":"open","owner":"backlog-refactor","created":"2026-10-20","terminal":"keep","decision":"keep","ramp":{"cohorts":["all batch uploads at deploy (default on)"],"clean_metric":"batch_v1 ledgers in processing over 6 h fall to the count with a sibling still recovering, with no new projection_completed regressions and zero paid recovery calls from the scan","expander":"dazheng (two-lane lead)","done_by":"2026-10-27"},"notes":"The ledger remains partial, owned by its batch job, with failed_segments=held_segments. Status polls and duplicate uploads return processing/batch_unit_held with projected IDs and a five-minute poll hint. No provider, job, intent, merge or retention mutation from the scan. Recovery upgrades to completed and charges only remaining speech. False stops new partials; existing partials remain nonterminal and can still upgrade. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_PROJECTION_PREFETCH","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default 4; an owner-chain walk reads the next N rows' successor links, job bindings, result payloads and audio manifests ahead of the chain, and runs the candidate lookup beside context and build","fail":"open","owner":"backlog-refactor","created":"2026-10-20","terminal":"keep","decision":"keep","notes":"0 is the kill switch (every input read on the chain as before); malformed or out-of-range values (above 8) keep 4. Only immutable inputs are read ahead; mutable receipt state is read fresh and every assignment transaction rereads its candidates. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_PROJECTION_FOLLOWUP_BACKOFF_SECONDS","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default 900; each serving process starts async follow-up discovery at a hashed point in the persisted/ready backlog and skips a row it saw blocked, failed, timed out or claimed elsewhere for 60 s doubling up to this many seconds","fail":"open","owner":"backlog-refactor","created":"2026-11-05","terminal":"keep","decision":"keep","notes":"0 is the kill switch (head-first discovery, immediate retry, as before); malformed or out-of-range values (negative, NaN, above 3600) keep 900. The skip is process memory only; targeted and owed wakes bypass it, and the page still wraps to the head, so one cycle visits every row."}
  - {"key":"BATCH_PIPELINE_PROJECTION_FOLLOWUP_SLOTS","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default 4; concurrent async projection follow-ups per serving process","fail":"open","owner":"backlog-refactor","created":"2026-11-05","terminal":"keep","decision":"keep","notes":"Unset, malformed or out-of-range values (below 1, above 16) keep 4. Receipt transactions and per-segment claims fence every slot as before."}
  - {"key":"BATCH_PIPELINE_PROJECTION_INDEX_DEFERRED_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; owner-chain walks converge the Typesense index and people-stats cache after the chain moves on, once per touched conversation per flush, including its donor-lineage deletes","fail":"open","owner":"backlog-refactor","created":"2026-10-20","terminal":"keep","decision":"keep","notes":"False restores the inline index step after every assignment, including the delete of every historic sync_merged_from donor. Fail-open as before: index lag is bounded by one drain step or serving tick (about 20 s) and lost on process exit, like a Typesense outage. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_PROJECTION_PENDING_PAGE_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; the projection sweep's assignment page holds only pending results and a separate persisted/ready page finishes synchronous-policy receipts","fail":"open","owner":"backlog-refactor","created":"2026-10-20","terminal":"keep","decision":"keep","notes":"False restores the single mixed pending/persisted/ready assignment page. Async follow-up discovery keeps its own cursor and a separately controlled finish page; the finish page keeps follow-ups scheduled while any async receipt is open. Same results composite index. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_PROJECTION_FOLLOWUP_PAGE_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; async followup discovery reads the persisted/ready results page plus one pinned-policy job read per row, without duplicate result reads; ready siblings share a completion probe per discovered page","fail":"open","owner":"backlog-refactor","created":"2026-11-01","terminal":"keep","decision":"keep","notes":"False restores the mixed page and per-candidate result/job reads. No version suppression: sibling or destination changes can unblock an unchanged receipt. Quarantine holds atomically settle matching ready siblings using the existing fenced read set. False restores single-row holds. Each discovery page gets a fresh ready completion marker; markers expire when their page drains or a probe fails. Persisted rows and priority/owed recovery work bypass them, including owed rows also discovered or already pending. Recovery/repair and priority/owed wakes retain their bounds. Reuses the results composite index. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_PROJECTION_PAGINATION_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; independently advance assignment and follow-up discovery beyond blocked projection pages","fail":"open","owner":"backlog-refactor","created":"2026-10-18","terminal":"keep","decision":"keep","notes":"False restores oldest-100 discovery for both scanners. Cursor hints reset on restart; durable privacy, predecessor, sibling completion and paid intent fences remain authoritative. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_RECOVERY_TASKS_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Request-backed paid quarantine recovery survives ordinary revision draining","fail":"open","owner":"backlog-refactor","created":"2026-10-18","terminal":"keep","decision":"keep","notes":"Default true. False restores inline sweep. Existing paid intent tokens, privacy checks and artifact reconciliation remain authoritative; never resets uncertain calls. Uses BATCH_PIPELINE_RECOVERY_TASKS_QUEUE (isolated batch-quarantine-recovery on prod integration; SYNC_TASKS_QUEUE fallback elsewhere) and the existing invoker, targeting integration via BATCH_PIPELINE_RECOVERY_TASK_AUDIENCE; dispatch failures fall back inline through the same paid-intent fence. See backend/diarizer/batch_pipeline_runtime.md."}
  - {"key":"BATCH_PIPELINE_RECOVERY_WAKE_LEASE_SECONDS","aliases":[],"kind":"env","lifecycle":"config_switch","surfaces":["backend"],"summary":"One outstanding quarantine-recovery delivery task per paid intent; lease before a lost wake is repaired; default 600, 0 = legacy 120s wake on every sweep","fail":"closed","owner":"backlog-refactor","created":"2026-10-19","terminal":"keep","decision":"keep","notes":"Scheduling metadata only; RecoveryStore.start remains the sole paid-intent fence. Bounds 120..3600; malformed keeps 600. A delivered task that leaves the intent prepared re-arms a 120s wake."}
  - {"key":"BATCH_PIPELINE_MERGE_HEAD_WAIT_SECONDS","aliases":[],"kind":"env","lifecycle":"config_switch","surfaces":["backend"],"summary":"Default 60; once a batch result has waited this long behind an unready earlier-captured merge head, the owner's ready results commit in capture order and the head appends later as late_capture","fail":"closed","owner":"backlog-refactor","created":"2026-10-20","terminal":"keep","decision":"keep","notes":"David ruling 2026-10-20 (catch-up uploads may publish newer parts first, max 60 s wait). off or <=0 restores strict capture order; malformed or >3600 keeps 60. Set on GPU workers and serving hosts; a mismatch is safe because both pass the same owner revision fence. Needs the merge_ready and merge_ready_age job indexes; a missing index logs head_wait_unavailable and keeps strict order. Log event=batch_merge outcome=head_wait_bypass. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_MERGE_CATCH_UP_DEPTH","aliases":[],"kind":"env","lifecycle":"config_switch","surfaces":["backend"],"summary":"Default 16; fresh batch uploads (capture ended at most 10 min before admission) commit ahead of the owner's pending catch-up rows, and catch-up commits wait while the owner already has this many committed rows awaiting projection","fail":"closed","owner":"backlog-refactor","created":"2026-10-20","terminal":"keep","decision":"keep","notes":"David fresh bar 2026-10-20 (fresh p95 <= 2 min, never blocked by an owner's catch-up backlog; transient out-of-order publication approved with Fix C). off or <=0 restores the plain ordered merge; malformed or >1000 keeps 16. Rows admitted before fresh_capture existed keep the plain order; record-lane units are classified like uploads. Privacy erase keeps log_sequence so an erased watermark still counts; a missing watermark row never holds a commit. Held owners are re-offered by owner on every pump maintenance tick and after each serving projection sweep. Needs the merge_fresh job index; a missing index logs fresh_first_unavailable and keeps the plain order. Log event=batch_merge outcome=fresh_first. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_FRESH_GPU_PRIORITY_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on unless false; batch uploads in the 6 h fresh sync lane whose oldest capture is over 10 min old lease GPU at RECENT priority, after fresh uploads","fail":"open","owner":"backlog-refactor","created":"2026-10-20","terminal":"keep","decision":"keep","notes":"The owner's GPU FIFO is per priority, so a catch-up backlog at FRESH queued that owner's fresh uploads behind it. false restores FRESH for the whole fresh lane. Read at admission (backend-sync intake); rows keep the priority they were admitted with. GPU spend admission reads the recorded sync lane, so these rows keep the fresh-lane fair-use checks and never draw on the backfill speech budget."}
  - {"key":"BATCH_PIPELINE_LANGUAGE_ELIGIBILITY_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on unless false; while legacy sync is on, a new sync upload whose conversation-or-user language names a language the batch Parakeet model cannot serve stays on legacy sync instead of batch","fail":"open","owner":"backlog-refactor","created":"2026-10-27","terminal":"keep","decision":"keep","notes":"Lead 41e13b and scope ruling 304254: not English-only admission. Only a known unsupported named language is excluded; blank, multi and unknown languages stay admitted, and the per-unit worker language guard plus independent language recovery are unchanged. Read at backend-sync intake before custody or probe spend; previously admitted batch work is unaffected. Counted as omi_batch_pipeline_language_route_total{surface=intake,language_class=unsupported,route=multilingual} and log event=batch_language_eligibility. false restores batch admission for those uploads."}
  - {"key":"BATCH_PIPELINE_RECOVERY_DISPATCH_INTERVAL_SECONDS","aliases":[],"kind":"env","lifecycle":"rollout","surfaces":["backend"],"summary":"Default 5; batch serving dispatches quarantine recovery on its own loop at this interval, on the maintenance leader only","fail":"closed","owner":"backlog-refactor","created":"2026-10-20","terminal":"keep","decision":"keep","notes":"The serving pass (maintenance, projection sweep, 20 s sleep) put quarantine -> recovery prepared at p50 52 s / p95 97 s in ramp runs 14-16. off or <=0 dispatches only from the serving pass; malformed or outside 1-60 keeps 5. A per-instance lock keeps the pass and the loop from scanning concurrently. See backend/docs/batch-pipeline-serving.md.","review_by":"2026-11-22"}
  - {"key":"BATCH_PIPELINE_SERVING_METRICS_MIN_REFRESH_SECONDS","aliases":[],"kind":"env","lifecycle":"config_switch","surfaces":["backend"],"summary":"Default 30; each batch serving instance refreshes its queue gauges at most once per interval","fail":"closed","owner":"backlog-refactor","created":"2026-11-03","terminal":"keep","decision":"keep","notes":"Every serving instance refreshed the same global gauges on each 20 s tick and scrape; the policy-hold walk in oldest() made that about 1.6M Firestore reads/h at 28 instances. off or <=0 refreshes on every call; malformed or outside 1-60 keeps 30. Capped below the guard blind window (120 s). Workers keep 0."}
  - {"key":"SYNC_FINALIZE_TARGET_RECOVERY_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default-on stale finalize target recovery and nonfatal donor refresh; explicit off restores strict bridge failures","fail":"open","owner":"auditfix","created":"2026-10-18","terminal":"keep","decision":"keep"}
  - {"key":"BATCH_PIPELINE_WORKER_VALIDATION_DISPOSITION_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; strict silence for out-of-buffer VAD frames and first-attempt terminal GPU validation handoff with retained recovery custody","fail":"open","owner":"backlog-refactor","created":"2026-10-18","terminal":"keep","decision":"keep","notes":"Worker-only Helm worker.workerValidationDispositionEnabled=true. False restores bounded GPU retries. Positive or unavailable strict VAD never becomes silence; deterministic failures retain stage/reason and independent fenced recovery. Does not reset paid intents or mutate historical quarantine debt. See backend/diarizer/batch_pipeline_runtime.md."}

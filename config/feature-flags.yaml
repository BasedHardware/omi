  - {"key":"OMI_READ_CACHE_SHADOW_RATE","aliases":[],"kind":"env","lifecycle":"config_switch","surfaces":["backend"],"summary":"Default 0.01; sample episode-members cache hits for fresh-read correctness comparison; 0 disables","fail":"open","owner":"firestore-lead","created":"2026-11-10","terminal":"keep","decision":"keep","notes":"Read-only observation, no response or cache publication changes. Two concurrent comparisons per process, no queue. Saturation counts skipped. Episode members compares extant keys only, cannot see content staleness, and fetches IDs only without preparation/decryption/transcript loads. Five-second RPC deadline and no retries. Finite positive rates clamp to 1; invalid/nonfinite/nonpositive skips silently. Rollback 0. Export omi_read_cache_shadow_total by cache and match/mismatch/error/skipped, without user identifiers or content."}

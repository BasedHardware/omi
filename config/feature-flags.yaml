  - {"key":"SYNC_SAFETY_WAL_DEDUPE_ENABLED","aliases":[],"kind":"env","lifecycle":"rollout","surfaces":["backend"],"summary":"Fleet server safety-WAL interval-confirmed coverage cuts and corroborated transcript dedupe","fail":"open","owner":"dazheng","created":"2026-10-13","review_by":"2026-11-12","decision":"pending","notes":"Code default off; dev/prod sync-intake runtime config on. No UID allowlist or S1 requirement. Every removed six-second tile requires its own non-silent envelope match; unsafe future derivative names keep the original. Live probes and offset are cached once per conversation per job. Text drops require a locked offset or two independent exact lines agreeing within 2s, known compatible speaker identity, one-use live lines, an eight-token floor, exact tokens below twelve tokens and sequence ratio >=0.95 for longer lines. No default-zero offset. Playback merge is unchanged. Kill switch: false/off (any non-on token) on Cloud Run backend, backend-sync, backend-sync-backfill and backend-integration. Batch provider stamping is also disabled by the kill switch. Client 30s edge suppression is a separate follow-up."}

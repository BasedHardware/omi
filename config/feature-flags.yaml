  - {"key":"BATCH_HELD_REDRIVE_COUNTER_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; report a new spent held re-drive transition once per unit; false silences telemetry without changing durable held_redrives accounting or custody","fail":"open","owner":"backlog-refactor","created":"2026-11-08","terminal":"keep","decision":"keep","notes":"Trimmed case-insensitive true enables; other set values fail closed, unset uses the default. Every verified held re-drive always increments held_redrives to bound class 3. held_redrive_budget_spent_at is written once in the winning content/privacy CAS, including with telemetry off; only a new committed transition emits the metric. Staging repairs and input_expiring consume no held grant. See backend/docs/runbooks/backlog-state-machine.md."}
  - {"key":"BATCH_HELD_REDRIVE_BUDGET_ENABLED","aliases":[],"kind":"env","lifecycle":"config_switch","surfaces":["backend"],"summary":"Default off; when trimmed case-insensitive true, a verified held requeue resets attempt to 0 within its durable re-drive budget where the retry cap enforces; independent of the telemetry switch","fail":"closed","owner":"backlog-refactor","created":"2026-11-08","terminal":"keep","decision":"keep","notes":"Class 3 custody change, default off. Same content-owner/privacy CAS on nightly, operator and status-poll held re-drives. Durable accounting bounds grants independently of BATCH_HELD_REDRIVE_COUNTER_ENABLED. Input-expiring and staging repairs grant no reset. Off stops new resets without clawing back grants. Other set values fail closed; unset uses the default. See backend/docs/runbooks/backlog-state-machine.md."}

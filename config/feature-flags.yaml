vate requeue. Assignment expiry rollback: set BATCH_HELD_DEAD_LETTER_ENABLED=false on serving and worker roles to stop new held deadlines/expiry and GPU automatic maintenance; existing projection recovery and manual requeue remain. Neither rollback stops ghost settle."}

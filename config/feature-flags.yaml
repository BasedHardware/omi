  - {"key":"BATCH_PIPELINE_BACKLOG_RELEASE_REACH_SECONDS","aliases":[],"kind":"env","lifecycle":"config_switch","surfaces":["backend"],"summary":"Default zero means unlimited; nonzero reach must be at least 30 days.","fail":"closed","owner":"quality-12h/Q12-BB","created":"2026-11-16","terminal":"keep","decision":"keep","notes":"Disabled by default for mixed-version release safety; enabled only on prod backend-integration. Release owner approved 2026-11-18: four support owners at 60/h in allowlist_only with projection-headroom enforcement, after every committer runs the PR 4 reader; review the first hour of delivery before any change. Separately approved all mode starts at 2/h, then 10-20/h after delivery and projection checks. See backend/docs/listen_pusher_pipeline/changes/2026-11-14-backlog-release-meter.md."}
  - {"key":"BATCH_PIPELINE_BACKLOG_RELEASE_MODE","aliases":[],"kind":"env","lifecycle":"config_switch","surfaces":["backend"],"summary":"Default allowlist_only; exclusive owner rollout or all under the same token budget.","fail":"closed","owner":"quality-12h/Q12-BB","created":"2026-11-16","terminal":"keep","decision":"keep","notes":"Disabled by default for mixed-version release safety; enabled only on prod backend-integration. Release owner approved 2026-11-18: four support owners at 60/h in allowlist_only with projection-headroom enforcement, after every committer runs the PR 4 reader; review the first hour of delivery before any change. Separately approved all mode starts at 2/h, then 10-20/h after delivery and projection checks. See backend/docs/listen_pusher_pipeline/changes/2026-11-14-backlog-release-meter.md."}
  - {"key":"BATCH_PIPELINE_BACKLOG_RELEASE_OWNER_KEYS","aliases":[],"kind":"env","lifecycle":"config_switch","surfaces":["backend"],"summary":"Default empty; at most 100 distinct owner SHA-256 keys, never logged or used as metric labels.","fail":"closed","owner":"quality-12h/Q12-BB","created":"2026-11-16","terminal":"keep","decision":"keep","notes":"Disabled by default for mixed-version release safety; enabled only on prod backend-integration. Release owner approved 2026-11-18: four support owners at 60/h in allowlist_only with projection-headroom enforcement, after every committer runs the PR 4 reader; review the first hour of delivery before any change. Separately approved all mode starts at 2/h, then 10-20/h after delivery and projection checks. See backend/docs/listen_pusher_pipeline/changes/2026-11-14-backlog-release-meter.md."}
  - {"key": "BATCH_RESULT_PROTOCOL_GUARD_ENABLED", "aliases": [], "kind": "env", "lifecycle": "ops_kill", "surfaces": ["backend"], "summary": "Default on result-protocol merge guard; unknown required markers delay before committing an ordered log row", "fail": "open", "owner": "pipeline-driver", "created": "2026-11-17", "terminal": "keep", "decision": "keep", "notes": "False restores legacy copying. Immutable-job recovery for missing supported source markers remains active. No fleet capability inference."}
  - {"key": "BATCH_SOURCE_REUSE_ENABLED", "aliases": [], "kind": "env", "lifecycle": "ops_kill", "surfaces": ["backend"], "summary": "Default on; reuse byte-proven sync source files across upload bundles without paid redispatch or duplicate projection", "fail": "open", "owner": "quality-lead", "created": "2026-11-16", "terminal": "keep", "decision": "keep", "notes": "Only ordinary anonymous sync uploads of at most 64 source files with trustworthy clocks and device identity; excludes native/explicit targets, source-frame trimming and alternate decoders. False stops new source admission aliases; accepted protocol-fenced aliases and single-owner projection fences remain durable. No covered ACK or WAL release. See backend/docs/runbooks/sync-source-reuse.md."}
  - {"key": "DAILY_RECAP_LEARNING_REFS_ENABLED", "aliases": [], "kind": "env", "lifecycle": "ops_kill", "surfaces": ["backend"], "summary": "Default on; resolve stored recap learning references to live feedback targets and omit retracted rows without a unique successor", "fail": "open", "owner": "quality-lead", "created": "2026-11-15", "terminal": "keep", "decision": "keep", "notes": "Set false to restore the stored learning snapshot on authenticated app recap list/search/detail. Follows owner-scoped explicit aliases and unique-target committed source replacements; current text and id travel together. Read-only and response-local; no recap rewrite or deleted-memory recreation. See backend/utils/memory/recap_review.py."}
  - {"key": "HOME_TRANSCRIPTION_SEAL_WAIT_ENABLED", "aliases": [], "kind": "env", "lifecycle": "ops_kill", "surfaces": ["backend"], "summary": "Default on; bound queued-transcription presentation from immutable first seal admission", "fail": "open", "owner": "quality-12h/Q12-AN", "created": "2026-11-15", "terminal": "keep", "decision": "keep", "notes": "Off ignores record_admitted_at and the one-shot legacy queue observation. Original wait stamps are never renewed. Native seal, proof repair and no-job registration bank first admission once. Existing stamped rows need no backfill; legacy retry audio missing clocks uses the bounded dry-run-first operator tool."}
  - {"key": "CONVERSATION_PENDING_TRANSCRIPTION_RETRY_ENABLED", "aliases": [], "kind": "env", "lifecycle": "ops_kill", "surfaces": ["backend"], "summary": "Default on; transcript-pending reprocess never invokes summary models", "fail": "open", "owner": "quality-12h/Q12-AN", "created": "2026-11-15", "terminal": "keep", "decision": "keep", "notes": "Off restores the old reprocess path. Recent pending captures return HTTP200 processing; expired/failed captures return409 transcription_pending. No job mutation or priority changes."}
  - {"key": "HOME_STALE_EMPTY_CAPTURE_NOISE_ENABLED", "aliases": [], "kind": "env", "lifecycle": "ops_kill", "surfaces": ["backend"], "summary": "Default on; expired zero-content in-progress batch placeholders are read-only noise", "fail": "open", "owner": "quality-12h/Q12-AN", "created": "2026-11-15", "terminal": "keep", "decision": "keep", "notes": "Off restores prior wire. No content, audio bounds, active producers, projection, summary debt or curation may be present. Pending stamps must be older than the existing two-hour transcription deadline. Received-only buffers are retained; late content releases the presentation rule. No custody or lifecycle write."}
  - {"key": "HOME_SETTLED_EMPTY_WIRE_ENABLED", "aliases": [], "kind": "env", "lifecycle": "ops_kill", "surfaces": ["backend"], "summary": "Default on; a neutral terminal title stops released clients re-inferring transcription from affirmative settled-empty noise", "fail": "open", "owner": "quality-lead", "created": "2026-11-15", "terminal": "keep", "decision": "keep", "notes": "Off restores the old empty-title wire. Adds No summary only to empty-title affirmative completed noise on conversation list and episode metadata reads; retains home_step=noise, no invented summary, transcript, status change or stored mutation. Both surfaces are required because old clients merge by ID. See backend/utils/conversations/legacy_empty_wire.py."}
  - {"key": "EPISODE_EMPTY_MEMBER_CLEANUP_ENABLED", "aliases": [], "kind": "env", "lifecycle": "config_switch", "surfaces": ["backend"], "summary": "Default off; opt-in atomic episode-reference removal during existing guarded empty-live deletion", "fail": "closed", "owner": "quality-lead", "created": "2026-11-15", "terminal": "keep", "decision": "keep", "notes": "Only transactional episode/fence/reverse-link removal is gated. Dangling-member read tolerance and registered-audio protection are unconditional. Quality lead ramps 1% then 100% of cleanup-serving traffic within 48 hours of this image serving on listen and pusher, watching attach transaction aborts/409 lock timeouts. See backend/docs/listen_pusher_pipeline/changes/2026-11-15-episode-wait-repairs.md."}
  - {"key": "EPISODE_COMPOSE_ANCHORED_WAIT_ENABLED", "aliases": [], "kind": "env", "lifecycle": "ops_kill", "surfaces": ["backend"], "summary": "Default on; preserve each transcript blocker first observation across membership changes", "fail": "open", "owner": "quality-lead", "created": "2026-11-15", "terminal": "keep", "decision": "keep", "notes": "Off restores aggregate wait-start resets and ignores additive compose_transcript_wait_observations. Blocker observations are generation-fenced by pending_at, seeded from legacy starts. Old writers may rewrite aggregate fields without extending a new readers per-blocker cap. See backend/utils/episodes/compose_wait.py."}
  - {"key": "EPISODE_COMPOSE_SETTLED_TERMINAL_ENABLED", "aliases": [], "kind": "env", "lifecycle": "ops_kill", "surfaces": ["backend"], "summary": "Default on; affirmative empty terminal outcomes never start or extend episode transcript waits", "fail": "open", "owner": "quality-lead", "created": "2026-11-15", "terminal": "keep", "decision": "keep", "notes": "Off restores empty-transcript waiting. Uses exhausted-output or settled below-floor classification with no output/debt, never empty text alone. Late transcript receipts and fingerprints still refresh. No persisted terminal state. See backend/utils/episodes/compose_wait.py."}
  - {"aliases": [], "kind": "env", "surfaces": ["backend"], "fail": "closed", "owner": "lane/conversations-v3 / lead2", "created": "2026-11-16", "key": "CONVERSATIONS_V3_FIRST_APP_BUILD", "lifecycle": "config_switch", "summary": "First released v3 mobile build; missing/invalid reports unknown and cannot qualify the episode deletion gate", "terminal": "keep", "decision": "keep", "notes": "Shared runtime source in backend/deploy/runtime_env/_base.yaml. Lead supplies the first v3 X-App-Build before using build-bucket deletion evidence."}
  - {"aliases": [], "kind": "env", "surfaces": ["backend"], "fail": "open", "owner": "lane/conversations-v3 / lead2", "created": "2026-11-16", "key": "CONVERSATIONS_V3", "lifecycle": "ops_kill", "summary": "Default on; off stops marking NEW pendant recordings, while persisted obligations keep draining", "terminal": "keep", "decision": "keep", "notes": "See backend/docs/runbooks/conversations-v3.md. No runtime values changed. Recordings and conversation copies retain their stored layer through rollback. Private creates keep the existing path."}
  - {"aliases": [], "kind": "env", "surfaces": ["backend"], "fail": "closed", "owner": "listen-v3-rotation", "created": "2026-11-18", "key": "CONVERSATIONS_V3_RECORDING_ROTATION", "lifecycle": "rollout", "summary": "Default off; cohort rotates owners in rollout_cohorts v3-recording-rotation, on rotates every v3 owner: listen seals a live v3 recording at a 1.5 s pause after the minimum age, or at the cap", "terminal": "undecided", "decision": "pending", "review_by": "2026-12-02", "ramp": {"cohorts": ["one named canary owner via rollout_cohorts v3-recording-rotation", "named TestFlight owners", "all v3 owners"], "clean_metric": "first derived row within 6 min of speech start, no v3 false splits at rotation boundaries, batch admission latency and queue depth flat", "expander": "lead2", "done_by": "2026-12-02"}, "notes": "backend-listen only; changing the value rolls backend-listen. Membership changes need no roll (60 s cache). Legacy rows never rotate. See backend/docs/runbooks/conversations-v3.md."}
  - {"aliases": [], "kind": "env", "surfaces": ["backend"], "fail": "closed", "owner": "listen-v3-rotation", "created": "2026-11-18", "key": "CONVERSATIONS_V3_ROTATION_MIN_SECONDS", "lifecycle": "config_switch", "summary": "Default 180; minimum age before a v3 recording rotates at a pause; an invalid pair with the cap keeps 180/300", "terminal": "keep", "decision": "keep", "notes": "backend-listen only; inert unless CONVERSATIONS_V3_RECORDING_ROTATION admits the owner."}
  - {"aliases": [], "kind": "env", "surfaces": ["backend"], "fail": "closed", "owner": "listen-v3-rotation", "created": "2026-11-18", "key": "CONVERSATIONS_V3_ROTATION_MAX_SECONDS", "lifecycle": "config_switch", "summary": "Default 300; hard cap that rotates a speaking v3 recording without a pause; stamped on the sealed row for the v3 builder", "terminal": "keep", "decision": "keep", "notes": "backend-listen only; inert unless CONVERSATIONS_V3_RECORDING_ROTATION admits the owner."}
  - {"key": "CONVERSATIONS_V3_CAPTURE_CONTINUITY", "aliases": [], "kind": "env", "lifecycle": "ops_kill", "surfaces": ["backend"], "summary": "Default on; a reconnect gap of up to 10 minutes between two recordings of one capture origin (new session, same device) is not silence for v3 grouping, and a manual-end cut stays a held boundary for up to 5 minutes while the batch transcript of its own or a preceding sealed recording that joins the finished speech has not landed", "fail": "open", "owner": "Goal: Pipeline", "created": "2026-11-25", "terminal": "keep", "decision": "keep", "notes": "Read by the v3 builder (backend-sync live reconciles). Off restores the previous cut and silence rules and skips the predecessor read (one lineage-indexed query of at most 8 metadata documents per fresh unsettled Finish per builder pass, for at most 5 minutes; worst case 168 documents per Finish, usually 2-24). Rows already written keep their boundaries. See backend/docs/listen_pusher_pipeline/changes/2026-11-25-v3-finish-late-predecessor.md."}
  - {"key": "CONVERSATIONS_V3_MANUAL_END_HOME_VISIBLE", "aliases": [], "kind": "env", "lifecycle": "ops_kill", "surfaces": ["backend"], "summary": "Default on; include the derived fragment at an explicit manual cut on Home regardless of media or background classification", "fail": "open", "owner": "Goal: Pipeline", "created": "2026-11-23", "terminal": "keep", "decision": "keep", "notes": "SCA-3024. Off restores classification-based hiding on subsequent projections. Rows already written retain their stored visibility until rebuilt."}
  - {"key": "CONVERSATIONS_V3_BATCH_MANUAL_END", "aliases": [], "kind": "env", "lifecycle": "ops_kill", "surfaces": ["backend"], "summary": "Default on; a user finish of an audio-only v3 recording stores a manual-end request that record admission promotes to the cut for a single-unit recording, so its window closes when the batch transcript lands; off also stops the early admission of a finish inside the first 60 s archive window, which CONVERSATIONS_V3_FAST_FINISH rolls out", "fail": "open", "owner": "Goal: Pipeline", "created": "2026-11-24", "terminal": "keep", "decision": "keep", "notes": "SCA-3024. Read by the finalization worker (backend) when it closes a zero-preview capture and by record admission (backend-integration). Off restores the silence and lock timers for later finishes; markers already stored stay."}
  - {"key": "CONVERSATIONS_V3_FINISH_NO_POINTER", "aliases": [], "kind": "env", "lifecycle": "ops_kill", "surfaces": ["backend"], "summary": "Default on. Let Finish end a live v3 window after the active recording lookup misses.", "fail": "open", "owner": "Goal: Pipeline", "created": "2026-11-24", "terminal": "keep", "decision": "keep", "notes": "Set off on the API service to restore HTTP 404 when the existing lookup misses. Accepted manual-end intents still drain."}
  - {"key": "CONVERSATIONS_V3_FINISH_NEWER_CAPTURE", "aliases": [], "kind": "env", "lifecycle": "ops_kill", "surfaces": ["backend"], "summary": "Default on. A Finish that resolves to a live v3 window also finishes a Listen capture that sealed after the window's last speech and that no window holds yet: instead of the window tail when its speech landed, alongside the tail cut when it is a batch capture still awaiting its transcript.", "fail": "open", "owner": "Goal: Pipeline", "created": "2026-11-26", "terminal": "keep", "decision": "keep", "notes": "SCA-4434. Set off on the API service that serves POST /v1/conversations to restore the window-tail cut and skip the recent-capture read (at most 8 documents per live-window Finish). Cuts already stored stay."}
  - {"key": "CONVERSATIONS_V3_FAST_FINISH", "aliases": [], "kind": "env", "lifecycle": "rollout", "surfaces": ["backend"], "summary": "Default cohort: only members of the v3-fast-finish runtime rollout cohort (empty until someone is added); on admits every v3 owner; off stops it. A manually finished v3 recording is transcribed once through the prerecorded provider when its audio seals and written as a provisional transcript, so notes start before the batch transcript lands. The same switch and cohort admit a user finish inside the first 60 s archive window of a live audio-only recording (before it, that finish was answered as an empty recording); that admission reads the flag on the service that serves POST /v1/conversations.", "fail": "closed", "owner": "Goal: Pipeline", "created": "2026-11-24", "terminal": "undecided", "decision": "pending", "review_by": "2026-12-01", "ramp": {"cohorts": ["the owner account via rollout_cohorts v3-fast-finish", "all v3 owners (on)"], "clean_metric": "omi_conversations_v3_fast_finish_total written share, provider_error and write_error near zero, finish to summary seconds on the owner account, no rise in v3 rewrites or blocked reconciles, provider STT spend per manual finish", "expander": "Goal: Pipeline owner with David", "done_by": "2026-12-01"}, "notes": "SCA-3024. Read by the service that runs batch record admission (backend-integration). Membership changes need no roll (scripts/rollout_cohort.py --add). Adds one provider transcription per manual finish of a recording up to 20 minutes (about 44 minutes, in chunks, for the CONVERSATIONS_V3_FAST_FINISH_LONG_PERCENT canary while CONVERSATIONS_V3_FAST_FINISH_CHUNKED is on). Off stops new passes; provisional segments already written are replaced by the batch record projection as usual. CONVERSATIONS_V3_BATCH_MANUAL_END=off also stops it, because the pass acts only on a stored manual-end request."}
  - {"key": "CONVERSATIONS_V3_FAST_FINISH_LONG_PERCENT", "aliases": [], "kind": "env", "lifecycle": "rollout", "surfaces": ["backend"], "summary": "Default 25; percent of owners (salted uid bucket v3-fast-finish-long) whose manual finishes over 20 minutes take the chunked fast first transcript; the canary for the provider audio that CONVERSATIONS_V3_FAST_FINISH_CHUNKED adds. 0 stops new long passes; invalid values read as 0.", "fail": "closed", "owner": "Goal: Pipeline", "created": "2026-11-26", "terminal": "undecided", "decision": "pending", "review_by": "2026-12-10", "ramp": {"cohorts": ["25% of owners by salted uid bucket", "100%"], "clean_metric": "24 h readback after the first full UTC day at 25%: long-pass latency (first card within 60 s of the Finish), omi_conversations_v3_fast_finish_audio_seconds_total{path=long} and the day's v3_fast_finish:long_audio_seconds key within CONVERSATIONS_V3_FAST_FINISH_LONG_DAILY_SECONDS, long-pass written share at least 70% with deadline plus provider_error plus retry_cap under 20%, chunk queue p95 under 5 s, busy under 5% of passes, no rise in prerecorded provider 429/5xx", "expander": "Goal: Pipeline owner with David", "done_by": "2026-12-10"}, "notes": "SCA-4434. Read by record admission (backend-integration). Changing it needs no code change; finishes up to 20 minutes are unaffected. Ramp: move 25 to 100 after the first 24 h readback of long-pass latency (first card within 60 s) and audio seconds; the daily cap still bounds spend at 100. Rollback: 0, or CONVERSATIONS_V3_FAST_FINISH_CHUNKED=off for the whole chunked path."}
  - {"key": "CONVERSATIONS_V3_FAST_FINISH_LONG_DAILY_SECONDS", "aliases": [], "kind": "env", "lifecycle": "config_switch", "surfaces": ["backend"], "summary": "Default 7200; provider audio seconds (retries, chunk overlaps and the language probe included) of manual finishes over 20 minutes that the whole fleet may send through the chunked fast first transcript per UTC day (one shared Redis counter per day); past it, or when Redis cannot answer, a long pass is skipped as long_cap (or a chunk retry as retry_cap) and batch delivers. Invalid values read as 0.", "fail": "closed", "owner": "Goal: Pipeline", "created": "2026-11-26", "terminal": "keep", "decision": "keep", "notes": "SCA-4434. Fleet bound under the LONG_PERCENT canary, in Redis key v3_fast_finish:long_audio_seconds:<UTC day> (INCRBYFLOAT, 26 h TTL, taken back at once if over the cap). A long pass reserves every chunk once plus a 30 s probe clip at admission; each chunk retry reserves its own seconds on the same key just before it sends, and is skipped (retry_cap, the pass yields to batch) when that does not fit, Redis errors or takes over 1 s, or under 3 s of the deadline is left. No audio is sent unreserved, so the day cannot pass the cap; the pass settles in the background to the audio actually sent. At 7200 about three 30-minute passes fit a day (two while every retry was reserved up front); the bound is unchanged. Fails closed (long_cap) when Redis cannot answer at admission; a pass with under 3 s of its deadline left reserves nothing (deadline). Any raise is David's spend decision."}
  - {"key": "CONVERSATIONS_V3_FAST_FINISH_CHUNKED", "aliases": [], "kind": "env", "lifecycle": "ops_kill", "surfaces": ["backend"], "summary": "Default on; the v3 fast first transcript splits each recording unit into chunks of at most five minutes (at retained-audio silences where possible, otherwise at even offsets with a 3 s overlap), sends them to the prerecorded provider concurrently (four in flight, three for a recording over 20 minutes, six per process) inside a 45 s end-to-end deadline and stitches them in order, for manual finishes of up to nine chunks (about 44 minutes; over 20 minutes only in the CONVERSATIONS_V3_FAST_FINISH_LONG_PERCENT canary); off restores one serial provider request per unit and the 20-minute cap", "fail": "open", "owner": "Goal: Pipeline", "created": "2026-11-25", "terminal": "keep", "decision": "keep", "notes": "SCA-4434. Read by the service that runs batch record admission (backend-integration). Adds provider audio for finishes between 20 minutes and nine chunks that CONVERSATIONS_V3_FAST_FINISH already admits, bounded by CONVERSATIONS_V3_FAST_FINISH_LONG_PERCENT and CONVERSATIONS_V3_FAST_FINISH_LONG_DAILY_SECONDS (spend approved by David 2026-11-25). Off takes effect on the next pass; provisional segments already written are replaced by the batch record projection as usual."}

  - {"key":"BATCH_JOBSTORE_MODE","aliases":[],"kind":"env","terminal":"undecided","lifecycle":"rollout","surfaces":["backend"],"summary":"Default firestore; shadow copies committed job rows and index additionally selects audited discovery hints; Firestore remains the only authority","fail":"closed","owner":"backlog-refactor","created":"2026-10-19","review_by":"2026-11-22","decision":"pending","notes":"David 2026-11-09 (flag rulings): extend; review_by stays 2026-11-22; owner lead2; review due for: A3 staging soak and A5 erasure gates precede any prod-shadow decision. Plan A (backend target architecture). Staging only: Firestore stays the only authority, and the batch_pipeline_prod namespace is refused in code outside the staging database (ruling L02-2). Takes effect only with JOBSTORE_PG_HOST/_DATABASE/_USER set (IAM database auth, no password); any other value or a missing setting keeps plain Firestore. 2026-11-01 review (lead c3d056): keep; the staging shadow is the A3 soak substrate. Prod Cloud SQL prod-jobs serves no traffic (2 system backends, ~108 MB): stop it until prod shadow is approved. Next gates: A3 staging soak of the protocol-parity store (#24221); A5 synchronous Postgres erasure in the batch purge; then a prod-shadow decision with batch-namespace read numbers at batch 25-50%. postgres_primary and postgres are reserved for A7. Rollback: unset, or JOBSTORE_SHADOW_WRITES=off. 2026-11-15 SCA-2288 index preparation: index preserves the existing namespace fence and mirror hooks. Only explicitly selected due leased/retry/result_ready reads use the non-authoritative copy; first and periodic Firestore scans preserve dropped-write discovery. Production factories now require explicit configuration; every copy enforces live canonical-owner sampling, shared rows are excluded, and bounded census retires absent/excluded copies. Runtime rotation/erasure/writer coverage, release activation and settled savings still require the owning packet. David bulk ruling 2026-11-17 (quality ladder flag docket). Ruling: extend. Next step: Staging shadow only and the prod Postgres instance is stopped. Keep dark to 2026-11-22 pending the A3 soak and erasure gates. Next-step due 2026-11-22 (from docket); owner backlog-refactor."}
  - {"key":"JOBSTORE_INDEX_QUERIES","aliases":[],"kind":"env","terminal":"keep","lifecycle":"config_switch","surfaces":["backend"],"summary":"Exact discovery-index query allowlist; default due_leased, supports due_retry and due_result_ready","fail":"closed","owner":"jobstore-index","created":"2026-11-15","decision":"keep","notes":"SCA-2288. Requires index mode and namespace/target admission. Empty/invalid allowlist uses Firestore. Production due remains refused except qualified Scheduler due_leased recovery with explicit valid role_minute_v1 policy, mandatory primary sweeps, candidate feedback and live kills. Retry/result_ready stay refused. Owner-copy BPS is not reader exposure. Root approved the bounded source contract, not runtime eligibility or activation. Existing latency/SLO/custody/erasure gates remain binding."}
  - {"key":"JOBSTORE_INDEX_READS","aliases":[],"kind":"env","terminal":"keep","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on unless 0/false/off/no; kill index discovery while retaining mirror and independent erasure","fail":"open","owner":"jobstore-index","created":"2026-11-15","decision":"keep","notes":"SCA-2288. Effective only in selected index mode. Off or mirror-write kill forces full canonical Firestore, including in-flight hint returns. Qualified due_leased recovery also requires explicit JOBSTORE_INDEX_RECOVERY_POLICY; generic due calls and other production queries remain coverage-refused. Actual scan completion is separate from scrape freshness. No production authority/activation is granted."}
  - {"key":"JOBSTORE_INDEX_RECOVERY_POLICY","aliases":[],"kind":"env","terminal":"keep","lifecycle":"config_switch","surfaces":["backend"],"summary":"Default unset/primary; role_minute_v1:BPS selects logical namespace/caller/UTC-minute hash units for bounded leased recovery hints, BPS0..10000","fail":"closed","owner":"jobstore-index","created":"2026-11-17","decision":"keep","notes":"Source-only SCA-2288. Exact ASCII versioned policy, no whitespace or wildcard. Unset/invalid/stale unit uses canonical primary. Sampling is stable across replicas/restarts for the same namespace/role/minute; not a percentage of jobs, owner copies, invocations or savings. All unselected work uses primary. Root/Release alone admit runtime artifact/callers/retained-copy/erasure/gap/parity/SLO/cost gates. Kill by unsetting, zero BPS, INDEX_READS off or Firestore mode. No durable state or privacy authority changes."}
  - {"key":"JOBSTORE_PRODUCTION_MIRROR","aliases":[],"kind":"env","terminal":"keep","lifecycle":"config_switch","surfaces":["backend"],"summary":"Owner-scoped production-mirror configuration; only exact on opts in","fail":"closed","owner":"jobstore-index","created":"2026-11-15","decision":"keep","notes":"SCA-2288 source preparation only. Factory requires explicit production context and target; every fresh document copy resolves one canonical owner and applies the live sample. Shared rows excluded; captured reads and sampled due-prefix parity use the cohort policy. Bounded primary/copy reconciliation and mode-off erasure are source prerequisites; actual retirement coverage and writer/deletion identity must be verified in the release packet."}

  - {"key":"EPISODE_OUTPUT_LANGUAGE_PIN","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on unless set off (0/false/off/no); pins generated output to a safe language for live episodes, provisional topics, daily recaps, and proactive notifications; multi/auto captures use dominant in-memory segment language","fail":"open","owner":"auditfix","created":"2026-10-28","terminal":"keep","decision":"keep","notes":"Kill switch for the wrong-language live-episode incident: one Vietnamese moment flipped episode notes and prior state kept them Vietnamese. On, every new prompt pin validates an allowlisted language token; episodes verify detected output language before stamping and repair mismatches on a later moment. It also gates the topic, recap, and notification prompt wording so one switch rolls these changes back. Off restores preference-then-capture language resolution, including conversation notes, and the legacy topic/recap/notification prompts. Non-English capture tags without supplied segments retain their legacy fallback. See backend/utils/episodes/output_language.py and backend/utils/llm/output_language.py."}
  - {"key":"EPISODE_HARD_CAP_ACROSS_CONVERSATIONS","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; enforce the strict episode-wide hard cap during attachment and moment rotation, carrying the running summary and unresolved items to the successor","fail":"open","owner":"auditfix","created":"2026-10-29","terminal":"keep","decision":"keep","notes":"Set false/0/off/no to restore the pre-rotation cap check and same-member attachment behavior. The enabled cap starts the successor at the boundary, carries provisional items for that member into it, and preserves the old summary if the update fails quality validation. Independent of the episode-wide EPISODES_ENABLED switch. See backend/utils/episodes/service.py and policy.py."}

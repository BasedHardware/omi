  - {"key":"FSR_MAINTENANCE_COORDINATION_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on in prod independently of read-lever rollback; explicit false restores per-replica maintenance","fail":"open","owner":"dazheng","created":"2026-10-27","terminal":"keep","decision":"keep","notes":"Retains existing Redis lease cadence, ownership fencing, bounded takeover, publisher eligibility and outage fail-open. Non-production including stage-prod staging keeps the legacy singleton_loops cohort unless explicitly overridden. No scan policy or job claims change. Lead owns deployment; verify publisher availability first. See backend/docs/runbooks/firestore-spend-guard.md."}
  - {"key":"BATCH_PIPELINE_LANGUAGE_INHERITANCE_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on unless false; batch pieces inherit a known bound conversation language, else the user language, before per-piece LID","fail":"open","owner":"dazheng","created":"2026-10-27","terminal":"keep","decision":"keep","notes":"Known means a recognized STT language code, excluding multi/auto/und/unknown. Short ambient-dominated WAL clips never override known context. Only when both are unknown does the existing self/vendor LID run. Legacy eligibility, durable custody and unsupported-language worker barriers stay in force. false restores former single-language-preference input. New intakes only; rollback does not rewrite frozen work."}
  - {"key":"BATCH_ADMISSION_LANGUAGE_EXCLUSION_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on unless false; exclude new unsupported-language batch uploads and non-single-language users without a supported conversation language in every legacy mode","fail":"open","owner":"dazheng","created":"2026-10-27","terminal":"keep","decision":"keep","notes":"Lead ruling 6a783e: legacy ON dispatches excluded uploads through legacy; draining/dark retains the existing retry fence, never a dark bypass. Before legacy drain, multilingual and unsupported speech needs a batch provider route (Soniox). Runs before re-home, decode, LID or batch custody; admitted batch receipts and durable conversation owners retain their route. Supported conversation language becomes explicit LID input. False restores the former admission and input selection exactly. Log event=batch_admission_language with bounded reason; existing language-route and shared fallback metrics. Compatible with language inheritance; unsupported inherited codes are excluded."}
  - {"key":"STT_IDLE_REOPEN_COST_RESELECT_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default off after the 2026-10-27 first-text regression; explicit true re-enables managed cost reselection at Soniox idle onset","fail":"open","owner":"dazheng","created":"2026-10-27","terminal":"keep","decision":"keep","notes":"Rolled default-off 2026-10-27: default-on idle reselect retired the serving leg at every idle onset and rebuilt through the full chain, saturating the window cap and terminating sessions (listenlat RCA). True/1/on restores managed reselection with current stages, capability and account admission; false/0/off (default) keeps the stored Soniox factory and the in-place reopen. Planned retirements retain onset PCM and use ordinary capture replay/adoption without spending a failure episode or benching Soniox. Wire and connected seconds carry bounded origin initial|idle_reopened|replacement. Lead owns bundled CR/listen deployment. See backend/docs/listen_pusher_pipeline.mdx."}
  - {"key":"STT_ROUTING_RECOVERY_SAMPLE_GUARD_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; ordinary live STT recovery re-bench needs 100 admitted non-censored outcomes and CUSUM evidence; high-failure fast path needs 20 outcomes and at least 25% failures","fail":"open","owner":"dazheng","created":"2026-10-27","terminal":"keep","decision":"keep","notes":"Every registry target at stage 5/25. Witness fairness retained. Recovery rejection adds two cooldown exponents with a six-hour cap; clean ramp to100 clears strikes. First full-traffic bench/first recovery wait, promotion votes/dwell and bounded trial windows unchanged. False/0/off restores all former rules. Lead rulings b5cc0a,92a89c,feea51. Operator reset: backend/scripts/reset_live_stt_cost_gate.py; see backend/docs/runbooks/live-stt-routing.md."}
  - {"key":"BATCH_PIPELINE_SHADOW_LANGUAGE_ONLY","aliases":[],"kind":"env","lifecycle":"rollout","surfaces":["backend"],"summary":"Default false; classify one canonical batch unit per selected legacy upload instead of entering the idle GPU shadow; no route or publication","fail":"closed","owner":"dazheng","created":"2026-10-26","review_by":"2026-10-29","terminal":"off","decision":"pending","ramp":{"cohorts":["isolated synthetic qualification with zero serving mutations","10% shadow owners with 500 attempted pairs/hour and two concurrent slots","up to 100% shadow owners within the same cap if measured matched rate is below the dated target","off after the 2995-pair qualification and language-cohort ramp"],"clean_metric":"zero dangerous-direction matched pairs; fresh privacy/funding; no duplicate reservations or serving writes; LID queue/normal latency no worse; separate batch_shadow duration/language coverage","expander":"two-lane lead; op1 applies","done_by":"2026-10-27"},"notes":"Lead ruling8b33ec. BATCH_PIPELINE_SHADOW_PERCENT remains the cohort and zero kill switch. This is a temporary no-exposure qualification mode with separately capped company spend, not a default-off user fix. See backend/docs/batch-language-shadow-qualification.md."}
  - {"key":"BATCH_PIPELINE_SHADOW_LANGUAGE_PROBES_PER_HOUR","aliases":[],"kind":"env","lifecycle":"config_switch","surfaces":["backend"],"summary":"Default and maximum 500 fleet-wide pair attempts per UTC hour; zero or malformed denies; minute pacing and two 120-second slots also apply","fail":"closed","owner":"dazheng","created":"2026-10-26","terminal":"keep","decision":"keep","notes":"Durable intent per upload, shared hourly/minute budget, no retry after ambiguous commit. Existing language-shadow mode and cohort must also be on. No user quota or usage mutation; one self and one bounded vendor probe per attempt. See backend/docs/batch-language-shadow-qualification.md."}
  - {"key":"OMI_CANONICAL_DEMAND_WINDOW_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; refill raw canonical list batches to the requested page demand independently of indexed candidate rollout","fail":"open","owner":"dazheng","created":"2026-10-26","terminal":"keep","decision":"keep","notes":"False restores the previous canonical batch sizing. Candidate queries, row authority, lineage, cursor and legacy offset contracts stay unchanged. Lead owns deployment. See backend/docs/runbooks/bundled-reader-reuse.md."}
  - {"key":"OMI_ROLLOUT_MEMBERSHIP_SHARED_CACHE_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; share encrypted cohort observations across replicas within the existing sixty-second source lease","fail":"closed","owner":"dazheng","created":"2026-10-26","terminal":"keep","decision":"keep","notes":"False restores the existing per-process reader. Shared hits retain their original deadline; local reuse cannot renew it. Errors are never shared. No change to cohort policies or the existing maximum revocation delay. Lead owns deployment. See backend/docs/runbooks/bundled-reader-reuse.md."}
  - {"key":"OMI_EXTERNAL_LIST_SINGLE_FLIGHT_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; coalesce simultaneous identical external-list cache misses after each request passes authorization","fail":"open","owner":"dazheng","created":"2026-10-26","terminal":"keep","decision":"keep","notes":"False restores independent origin reads. Bounded process-local futures, one-second follower wait, unchanged cache keys and freshness, writer-version recheck, no waiting on the event loop. Lead owns deployment. See backend/docs/runbooks/bundled-reader-reuse.md."}
  - {"key":"BATCH_PIPELINE_INDEPENDENT_LANGUAGE_RECOVERY_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"On in prod (backend-integration recovery role only), off elsewhere; guarded Modulate failures get one async Soniox attempt with measured receipts","fail":"closed","owner":"dazheng","created":"2026-10-26","terminal":"keep","decision":"keep","notes":"Activated in prod on backend-integration 2026-10-27 02:07Z per lead 5da7dc/ebc45a after the 5% unsupported-language held loop; declared ON with the WordsWithoutVad fix (prod overlay, backend-integration only). Previously: lead ruling404ca5 kept code and CPU/worker deployment defaults off. Existing-key binding approved by David via ce5485, prod recovery role only; op1 pre-binds and verifies existing SA access, no IAM grant approved. Lead owns activation after async-poll review and green CI, one exact-ID epoch-3 canary, clean T1/T2/T4, then approved ten-unit prefix. Hard60s/unit, one submission, no POST retry, company allowance. See backend/docs/runbooks/batch-language-recovery.md."}
  - {"key":"BATCH_PIPELINE_INDEPENDENT_RECOVERY_MAX_SECONDS","aliases":[],"kind":"env","lifecycle":"config_switch","surfaces":["backend"],"summary":"Default 60 seconds; lower the independent-language recovery per-unit duration cap, never exceed the hard 60-second ceiling","fail":"closed","owner":"dazheng","created":"2026-10-26","terminal":"keep","decision":"keep","notes":"Invalid, nonfinite, zero or negative values refuse Soniox spend. At the published $0.10/audio-hour estimate a 60-second call is about $0.001667; actual vendor billing is token-based. Held custody and original measured VAD are preserved. See backend/docs/runbooks/batch-language-recovery.md."}
  - {"key":"SPEAKER_AUTO_ENROLL_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; explicit speaker tags teach an encrypted vector-only roster for retained private-cloud sync users","fail":"closed","owner":"dazheng","created":"2026-10-25","terminal":"keep","decision":"keep","notes":"Off stops publication and use of the auto-enroll pool; correction, deletion and privacy retraction remain active. Requires private-cloud sync retained and save_other_voice_profiles at execution and commit. Five contributions per person, 30-day half-life and 90-day maximum age. No new queue, query or infrastructure. Lead owns merge/deploy. See backend/docs/runbooks/speaker-auto-enroll.md."}
  - {"key":"BATCH_SYNC_OFF_CENTROIDS_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on: temporary encrypted Omi-v2 centroids for sync-off authoritative batch speakers","fail":"open","owner":"dazheng","created":"2026-10-25","terminal":"keep","decision":"keep","notes":"ADR-0004 approved by David 2026-10-25 ~14:45Z. Subordinate to BATCH_CONVERSATION_SPEAKERS_ENABLED; existing batch cohort only. No audio retention; 24h capture TTL shortened to at most 1h after completion, registered erasure and read expiry. See backend/docs/batch-voice-evidence-retention.md."}
  - {"key":"OPEN_LOOPS_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; extract open-loop fields in the notes call, persist them server-only, and run the once-per-day open-loop daily pass","fail":"open","owner":"dazheng","created":"2026-10-26","terminal":"keep","decision":"keep","notes":"Off removes the open-loop prompt rules (flag-off notes schema and prompt bytes stay byte-identical), stops persisting, and skips the daily pass (the recap job sibling step writes nothing; already-stored extractions and loops are left in place). The extraction field is server-only, never on the client wire. See backend/utils/open_loops/."}

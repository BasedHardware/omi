  - {"key":"SUMMARY_PROJECTION_DEBT_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; a batch projection that lands a transcript on a completed untitled row stamps first-summary debt so Home shows Writing notes and the repair can see it","fail":"open","owner":"refactor-lead","created":"2026-11-10","terminal":"keep","decision":"keep","notes":"Only false/0/off/no disables the stamp. Existing due clocks and summaries are preserved; a valid pending-only numeric clock does not prevent arming a missing due time. Curated rows, discards, below-floor clips, blocked rows and local-only rows remain refused. Stamps summary_first_pending_at, summary_due_at and the row-level summary_title_provenance in the projection write; it does not write structured.title_provenance, so is_server_minimum does not suppress apps, goals, memories, folders or vectors on a later reprocess. Rows past the repair age gate get provenance but no debt. A completed batch_live_v1 projection with a landed transcript, an advancing record revision, a retained finalization ID and no completed/output-summary marker conditionally reads that job in the same transaction. Custody requires matching owner/conversation/revision, terminal success, completed fanout and no immutable BYOK obligation; the stored proof is generation-bound. No outbox enqueue or data migration. Flag-off also pauses repair through stored proofs and retains debt metadata; ordinary enrichment continues. Re-enabling restores proof admission while the other eligibility and age guards still pass. See backend/utils/conversations/summary_delivery.py stamp_projection_debt and backend/utils/batch_pipeline/live_projection.py replace_record."}

  - {"key":"EPISODE_F_JOIN_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; off/false/0/no stops every episode-join variant F Jev call (marking and settling) and keeps today's time-only recorded join","fail":"closed","owner":"auditfix","created":"2026-11-05","terminal":"keep","decision":"keep","notes":"David 2026-11-05: ship variant F behind a flag, ramp 5/25/100. The kill switch is evaluated at attach and again at settle, so a marked join settles as today's join once it is off. See backend/utils/episodes/f_join.py settle and admitted, called from backend/utils/episodes/service.py _settle_boundary.","extension":{"until":"2026-11-22","reason":"ad1268 D: ad1268 (d) episode_f_join family (n3 2.6): env kill switch of the kept flag-store rollout","by":"auditfix","granted":"2026-11-08"}}

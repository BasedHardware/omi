  - {"key":"UNLIMITED_V2_BACKFILL_HOURS_CAP_ENABLED","aliases":[],"kind":"env","lifecycle":"config_switch","surfaces":["backend"],"summary":"Default off (prod on); when trimmed case-insensitive true, sync backfill uploads for the unlimited_v2 plan are deferred (retryable 503) once the UTC user-day already has UNLIMITED_V2_BACKFILL_HOURS_CAP_HOURS (default 24) of transcription_seconds, the same user-day basis unit_cost_user_day.tx_sec uses","fail":"closed","owner":"margin","created":"2026-11-14","terminal":"keep","decision":"keep","notes":"Kill switch: false (the default) restores current behavior exactly, including the absence of the plan and daily-meter reads. Only backfill/import admissions are in scope: the sync backfill lane and the batch backfill lane pass the marker; live listen and fresh sync/batch capture never do, so live capture is untouched even on a user-day above the cap. The meter is the total day transcription_seconds (it cannot separate backfill from live seconds); the admission lane is the exact separation for the work being admitted. Only unlimited_v2 is in scope; Free, Plus and the deprecated paid tiers resolve unchanged in both modes. The cap level is a separate setting (UNLIMITED_V2_BACKFILL_HOURS_CAP_HOURS, default 24); non-positive or unparseable levels keep that default and this boolean is the only on/off authority. Enforced only at sync upload admission (2026-11-18, PR #25677): an over-cap backfill upload gets the retryable 503 backfill_capacity with Retry-After to the next UTC day before any audio is consumed, so the phone keeps it; sync segments and batch units never consult the cap, so no server hold is created. Prod on at 24 h since 2026-11-18; rollback is false in one config train. Unreadable plan or meter reads admit transcription rather than inventing a refusal. Activation is a separate owner decision; see docs/runbooks/unlimited-v2-backfill-hours-cap.md. SCA-2152."}

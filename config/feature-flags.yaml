  - {"key":"LISTEN_NONWINDOW_REPLAY_SETTLE_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on unless false; a Soniox/Modulate replacement leg whose provider owes no output settles horizon-aged quiet replay capture instead of failing over with replay_ring_overflow","fail":"open","owner":"dazheng","created":"2026-10-20","terminal":"keep","decision":"keep","notes":"Listen env only. Speech inside the 90 s ring horizon and spans with pending provider output keep their replay obligation; speech sent less than 15 s ago never settles. omi_stt_nonwindow_replay_settles_total{provider} counts episodes. See backend/docs/operational/windowed-live-stt.md."}
  - {"key":"BATCH_PIPELINE_LEADER_LEASE_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on unless false; one batch worker or serving replica per Firestore lease runs periodic recovery, drain, cleanup and quarantine discovery","fail":"open","owner":"dazheng","created":"2026-10-19","terminal":"keep","decision":"keep","notes":"Cost and contention only: every guarded loop is idempotent and transaction-fenced. Lease-store errors fail open to every replica running. False restores per-replica maintenance. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_DIARIZE_SPEECH_ONLY_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on unless false; batch GPU worker diarizes only padded VAD and word evidence and maps turns back to capture clocks","fail":"open","owner":"dazheng","created":"2026-10-19","terminal":"keep","decision":"keep","notes":"Worker-only Helm worker.diarizeSpeechOnlyEnabled=true. ASR words are unchanged; dense units (over 80 percent retained, fallback reason kept_over_80pct), empty compacted output and any compaction or mapping error diarize the full unit (fallback reason other). Decisions and unit versus diarized seconds: omi_batch_pipeline_diarization_decisions_total and omi_batch_pipeline_diarization_audio_seconds_total. False restores full-unit diarization. See backend/diarizer/batch_pipeline_runtime.md."}
  - {"key":"BATCH_PIPELINE_SHORT_SPEECH_SINGLE_ENABLED","aliases":[],"kind":"env","lifecycle":"rollout","surfaces":["backend"],"summary":"Default off; a batch unit whose speech and words form one region of at most 2 s (pauses up to 0.5 s inclusive) takes the existing skipped_single result without diarization","fail":"closed","owner":"dazheng","created":"2026-10-19","review_by":"2026-11-18","terminal":"undecided","decision":"pending","notes":"Outcome 2026-10-20 (two-lane lead, DEC-BTR-001): extend. False on the prod worker. The lead runs the paired pyannote 3533c8cf run by 11-04, then a worker canary at the current admission level for 24 h; graduate if skipped_short agrees with full diarization, otherwise kill, by the review date. Worker-only Helm worker.shortSpeechSingleEnabled=false. Hard-labels SPEAKER_00 with no model check. Enable only after a paired run on prod pyannote revision 3533c8cf8e369892e6b79ff1bf80f7b0286a54ee shows a single full-diarizer speaker on the gate evidence, including two bursts at most 0.5 s apart. Watch omi_batch_pipeline_diarization_decisions_total{decision=skipped_short}. See backend/diarizer/batch_pipeline_runtime.md.","ramp":{"cohorts":["paired pyannote 3533c8cf run","worker canary at current admission for 24 h","all batch units"],"clean_metric":"skipped_short units match a single full-diarizer speaker on the gate evidence","expander":"dazheng (two-lane lead)","done_by":"2026-11-18"}}
  - {"key": "OMI_DEV_MEMORY_REUSE_READ_WINDOWS_ENABLED", "aliases": [], "kind": "env", "lifecycle": "ops_kill", "surfaces": ["backend"], "summary": "Default on unless false; reuse historical metadata prefixes and status checks within one Developer memory list read", "fail": "open", "owner": "dazheng", "created": "2026-10-19", "terminal":"keep","decision": "keep", "notes": "See backend/docs/runbooks/external-list-reads.md. State ends at read return or retry; false restores repeated prefix reads. No production flag change."}
  - {"key":"BATCH_PIPELINE_OWNER_CHAIN_PROJECTION_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; a settled quarantine recovery walks that owner's result log from its projection watermark in chain order and runs its contents' follow-ups first","fail":"open","owner":"dazheng","created":"2026-10-19","terminal":"keep","decision":"keep","notes":"False restores the generic cursor sweep after recovery. Bounded to 64 rows / 30s per wake and fails open to the generic sweep. Transactional predecessor, owner watermark, privacy, receipt replay and sibling completion fences remain authoritative; follow-ups keep the four-slot bound. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_RECOVERED_MERGE_RELEASE_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on unless false; the post-recovery owner wake commits the recovered unit, then its content's ready siblings, at once past an unready merge head (the unit itself also past the catch-up depth hold), so the same wake's chain walk projects them","fail":"open","owner":"dazheng","created":"2026-10-20","terminal":"keep","decision":"keep","ramp":{"cohorts":["5% run 19","25%","50%","100%"],"clean_metric":"hash-cohort quarantine_projection_p95 <= 300 s and event=batch_merge outcome=recovered_release present with no new privacy or chain errors","expander":"two-lane lead session","done_by":"2026-10-24"},"notes":"5% run 18 (2026-10-20): 46 of 54 post-recovery owner wakes advanced no row because the recovered unit, whose ready_at is its settle time, still sat behind a leased head for the 60 s head wait plus a maintenance tick (settled -> commit 65-86 s); projection then waited for the 20 s serving sweep. Only the wake passes a release set (the recovered unit plus up to 32 content siblings); each row must still be the owner's pending, ready job inside the commit transaction, and the commit body, late marking, log chain and projection order are unchanged. false restores the head wait and depth hold for recovered units. Log event=batch_merge outcome=recovered_release (closed labels); results carry recovered_release: true. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_SWEEP_OWNER_CHAIN_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; when the periodic projection sweep advances an owner's chain head it keeps walking that owner's result log in chain order instead of waiting for its cursor to wrap","fail":"open","owner":"dazheng","created":"2026-10-20","terminal":"keep","decision":"keep","notes":"False restores one attempt per page row. One walk per owner per sweep, 64 rows / 30 s each and 30 s per sweep across owners. Every row still takes the owner claim and transactional predecessor, privacy and receipt fences; no new per-owner concurrency. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_OWNER_DRAIN_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; a per-process owner drain walks each discovered owner's result log continuously (up to 8 owners at once, 120 s turns, FIFO re-queue) instead of the sweep-shared 30 s walk budget","fail":"open","owner":"dazheng","created":"2026-10-20","terminal":"keep","decision":"keep","notes":"False restores the sweep owner-chain walk with every pre-check; read-ahead (BATCH_PIPELINE_PROJECTION_PREFETCH=0) and the deferred index (BATCH_PIPELINE_PROJECTION_INDEX_DEFERRED_ENABLED=false) have their own switches, and all three off is the pre-drain behaviour. On: the sweep only discovers owners; each walk holds the advisory owner claim for its 15 s step and skips the predecessor/per-part pre-check transactions for rows it reached as the watermark's successor. The assignment transaction's predecessor, privacy and receipt fences stay authoritative; one owner never runs two chains. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_HELD_TERMINAL_STATUS_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; a batch upload whose failed units are all terminally held (failed_held, no open operator intent, no sibling in flight) answers its status poll and re-upload as completed with an empty result and reason_code=batch_unit_held instead of a looping failed","fail":"open","owner":"dazheng","created":"2026-10-20","terminal":"keep","decision":"keep","ramp":{"cohorts":["all batch uploads at deploy (default on)"],"clean_metric":"batch status polls answering failed/batch_worker_quarantined fall to zero with no new completed-empty WAL acks for uploads holding non-failed_held units","expander":"dazheng (two-lane lead)","done_by":"2026-10-27"},"notes":"Read-only status projection; no ledger, job or retention write. The held units' encrypted artifacts stay server-side for a reviewed operator redrive, so the phone's local copy is not needed for recovery (it deletes synced copies after autoRemoveSyncedCopiesDays). An open speech_redrive/terminal/silence intent or an in-flight sibling reads processing. False restores status=failed with errors=[batch_worker_quarantined]. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_RECOVERY_POLICY_REFRESH_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; a quarantined held unit whose recorded recovery policy is disabled and which has no recovery intent (no paid call authorized) re-resolves the recovery setting at sweep or dispatch, and adopts it only when it is now enabled","fail":"open","owner":"dazheng","created":"2026-10-20","terminal":"keep","decision":"keep","ramp":{"cohorts":["all held units at deploy (default on)"],"clean_metric":"recovery sweep outcome=disabled count falls to zero and paid recovery starts stay within the per-owner allowance","expander":"dazheng (two-lane lead)","done_by":"2026-10-27"},"notes":"Spends at most the one at-most-once paid recovery the unit would have had if admitted while recovery was on; the existing allowance/cap gates and RecoveryStore.start fence still apply. An enabled snapshot is never re-resolved or downgraded. False restores the frozen snapshot (outcome=disabled forever). See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_HELD_PARTIAL_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; a batch upload whose unprojected units are all held with no recovery path left (failed_held, or a recorded recovery-off policy with no paid intent, and no open operator intent) completes as partial on the sync content ledger: projected siblings are published and the held span is counted","fail":"open","owner":"dazheng","created":"2026-10-20","terminal":"keep","decision":"keep","ramp":{"cohorts":["all batch uploads at deploy (default on)"],"clean_metric":"batch_v1 ledgers in processing over 6 h fall to the count with a sibling still recovering, with no new projection_completed regressions and zero paid recovery calls from the scan","expander":"dazheng (two-lane lead)","done_by":"2026-10-27"},"notes":"David ruling 2026-10-20 (held uploads complete as partial on the ledger). Serving maintenance leader scans held/failed_held jobs every 300 s, 32 per page. Ledger status partial with outcome=partial, failed_segments=held_segments; the status poll and re-upload answer completed with reason_code=batch_unit_held and the projected IDs. No provider call, no job, intent, merge or retention write; held audio stays for a reviewed redrive. The partial row stays owned by its batch job, so recovery and operator redrive still run and the ordinary completion upgrades it to completed, charging only the remaining speech. False stops new partials; existing partial rows keep answering completed and still upgrade. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_PROJECTION_PREFETCH","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default 4; an owner-chain walk reads the next N rows' successor links, job bindings, result payloads and audio manifests ahead of the chain, and runs the candidate lookup beside context and build","fail":"open","owner":"dazheng","created":"2026-10-20","terminal":"keep","decision":"keep","notes":"0 is the kill switch (every input read on the chain as before); malformed or out-of-range values (above 8) keep 4. Only immutable inputs are read ahead; mutable receipt state is read fresh and every assignment transaction rereads its candidates. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_PROJECTION_INDEX_DEFERRED_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; owner-chain walks converge the Typesense index and people-stats cache after the chain moves on, once per touched conversation per flush, including its donor-lineage deletes","fail":"open","owner":"dazheng","created":"2026-10-20","terminal":"keep","decision":"keep","notes":"False restores the inline index step after every assignment, including the delete of every historic sync_merged_from donor. Fail-open as before: index lag is bounded by one drain step or serving tick (about 20 s) and lost on process exit, like a Typesense outage. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_PROJECTION_PENDING_PAGE_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; the projection sweep's assignment page holds only pending results and a separate persisted/ready page finishes synchronous-policy receipts","fail":"open","owner":"dazheng","created":"2026-10-20","terminal":"keep","decision":"keep","notes":"False restores the single mixed pending/persisted/ready assignment page. Async follow-up discovery keeps its own mixed page and cursor either way; the finish page keeps follow-ups scheduled while any async receipt is open. Same results composite index. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_PROJECTION_PAGINATION_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; independently advance assignment and follow-up discovery beyond blocked projection pages","fail":"open","owner":"dazheng","created":"2026-10-18","terminal":"keep","decision":"keep","notes":"False restores oldest-100 discovery for both scanners. Cursor hints reset on restart; durable privacy, predecessor, sibling completion and paid intent fences remain authoritative. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_RECOVERY_TASKS_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Request-backed paid quarantine recovery survives ordinary revision draining","fail":"open","owner":"dazheng","created":"2026-10-18","terminal":"keep","decision":"keep","notes":"Default true. False restores inline sweep. Existing paid intent tokens, privacy checks and artifact reconciliation remain authoritative; never resets uncertain calls. Uses BATCH_PIPELINE_RECOVERY_TASKS_QUEUE (isolated batch-quarantine-recovery on prod integration; SYNC_TASKS_QUEUE fallback elsewhere) and the existing invoker, targeting integration via BATCH_PIPELINE_RECOVERY_TASK_AUDIENCE; dispatch failures fall back inline through the same paid-intent fence. See backend/diarizer/batch_pipeline_runtime.md."}
  - {"key":"BATCH_PIPELINE_RECOVERY_WAKE_LEASE_SECONDS","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"One outstanding quarantine-recovery delivery task per paid intent; lease before a lost wake is repaired; default 600, 0 = legacy 120s wake on every sweep","fail":"closed","owner":"dazheng","created":"2026-10-19","terminal":"keep","decision":"keep","notes":"Scheduling metadata only; RecoveryStore.start remains the sole paid-intent fence. Bounds 120..3600; malformed keeps 600. A delivered task that leaves the intent prepared re-arms a 120s wake."}
  - {"key":"BATCH_PIPELINE_MERGE_HEAD_WAIT_SECONDS","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default 60; once a batch result has waited this long behind an unready earlier-captured merge head, the owner's ready results commit in capture order and the head appends later as late_capture","fail":"closed","owner":"dazheng","created":"2026-10-20","terminal":"keep","decision":"keep","notes":"David ruling 2026-10-20 (catch-up uploads may publish newer parts first, max 60 s wait). off or <=0 restores strict capture order; malformed or >3600 keeps 60. Set on GPU workers and serving hosts; a mismatch is safe because both pass the same owner revision fence. Needs the merge_ready and merge_ready_age job indexes; a missing index logs head_wait_unavailable and keeps strict order. Log event=batch_merge outcome=head_wait_bypass. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_MERGE_CATCH_UP_DEPTH","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default 16; fresh batch uploads (capture ended at most 10 min before admission) commit ahead of the owner's pending catch-up rows, and catch-up commits wait while the owner already has this many committed rows awaiting projection","fail":"closed","owner":"dazheng","created":"2026-10-20","terminal":"keep","decision":"keep","notes":"David fresh bar 2026-10-20 (fresh p95 <= 2 min, never blocked by an owner's catch-up backlog; transient out-of-order publication approved with Fix C). off or <=0 restores the plain ordered merge; malformed or >1000 keeps 16. Rows admitted before fresh_capture existed keep the plain order; record-lane units are classified like uploads. Privacy erase keeps log_sequence so an erased watermark still counts; a missing watermark row never holds a commit. Held owners are re-offered by owner on every pump maintenance tick and after each serving projection sweep. Needs the merge_fresh job index; a missing index logs fresh_first_unavailable and keeps the plain order. Log event=batch_merge outcome=fresh_first. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_FRESH_GPU_PRIORITY_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on unless false; batch uploads in the 6 h fresh sync lane whose oldest capture is over 10 min old lease GPU at RECENT priority, after fresh uploads","fail":"open","owner":"dazheng","created":"2026-10-20","terminal":"keep","decision":"keep","notes":"The owner's GPU FIFO is per priority, so a catch-up backlog at FRESH queued that owner's fresh uploads behind it. false restores FRESH for the whole fresh lane. Read at admission (backend-sync intake); rows keep the priority they were admitted with. GPU spend admission reads the recorded sync lane, so these rows keep the fresh-lane fair-use checks and never draw on the backfill speech budget."}
  - {"key":"BATCH_PIPELINE_LANGUAGE_ELIGIBILITY_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on unless false; while legacy sync is on, a new sync upload whose conversation-or-user language names a language the batch Parakeet model cannot serve stays on legacy sync instead of batch","fail":"open","owner":"dazheng","created":"2026-10-27","terminal":"keep","decision":"keep","notes":"Lead 41e13b and scope ruling 304254: not English-only admission. Only a known unsupported named language is excluded; blank, multi and unknown languages stay admitted, and the per-unit worker language guard plus independent language recovery are unchanged. Read at backend-sync intake before custody or probe spend; previously admitted batch work is unaffected. Counted as omi_batch_pipeline_language_route_total{surface=intake,language_class=unsupported,route=multilingual} and log event=batch_language_eligibility. false restores batch admission for those uploads."}
  - {"key":"BATCH_PIPELINE_RECOVERY_DISPATCH_INTERVAL_SECONDS","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default 5; batch serving dispatches quarantine recovery on its own loop at this interval, on the maintenance leader only","fail":"closed","owner":"dazheng","created":"2026-10-20","terminal":"keep","decision":"keep","notes":"The serving pass (maintenance, projection sweep, 20 s sleep) put quarantine -> recovery prepared at p50 52 s / p95 97 s in ramp runs 14-16. off or <=0 dispatches only from the serving pass; malformed or outside 1-60 keeps 5. A per-instance lock keeps the pass and the loop from scanning concurrently. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"SYNC_FINALIZE_TARGET_RECOVERY_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default-on stale finalize target recovery and nonfatal donor refresh; explicit off restores strict bridge failures","fail":"open","owner":"dazheng","created":"2026-10-18","terminal":"keep","decision":"keep"}
  - {"key":"BATCH_PIPELINE_WORKER_VALIDATION_DISPOSITION_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; strict silence for out-of-buffer VAD frames and first-attempt terminal GPU validation handoff with retained recovery custody","fail":"open","owner":"dazheng","created":"2026-10-18","terminal":"keep","decision":"keep","notes":"Worker-only Helm worker.workerValidationDispositionEnabled=true. False restores bounded GPU retries. Positive or unavailable strict VAD never becomes silence; deterministic failures retain stage/reason and independent fenced recovery. Does not reset paid intents or mutate historical quarantine debt. See backend/diarizer/batch_pipeline_runtime.md."}
  - {"key":"BATCH_PIPELINE_HEAD_PRIORITY_ENABLED","aliases":[],"kind":"env","lifecycle":"rollout","surfaces":["backend"],"summary":"Default off; prioritize an eligible queued owner merge head within its existing scheduling class","fail":"closed","owner":"dazheng","created":"2026-10-18","review_by":"2026-11-04","terminal":"on","decision":"graduate","notes":"Outcome 2026-10-20 (two-lane lead, DEC-BTR-001): graduate. True live and in git on all four prod Cloud Run sync hosts and on prod listen; it rides the same ladder. M3 ladder: 5% after Fix B (#22805) and Fix C (merge head wait) about 10-22/23, then 25%/50%/100% plus legacy dark about 10-24, each step held on the record-lane ramp gate (hash-cohort quarantine projection p95 <=300 s, no obligation over 15 min, terminal unrecovered speech <=0.2%); legacy deletion by 10-31 (workstream C). The removal PR after legacy deletion makes it unconditional. Accepted-work drain independent of admission. No lease stealing or order/privacy bypass. Rollback false resumes the same ordinary queues and durable receipts. See backend/docs/batch-pipeline-serving.md."}

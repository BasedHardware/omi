  - {"key":"BATCH_PIPELINE_PROJECTION_GHOST_SETTLE_COHORT","aliases":[],"kind":"env","lifecycle":"config_switch","surfaces":["backend"],"summary":"Marker-only ghost-settle cohort label; default g1, 1-16 ASCII letters/digits/underscore/hyphen; invalid falls back to g1 and counts committed fallbacks","fail":"closed","owner":"uicleanup","created":"2026-11-07","terminal":"keep","decision":"keep","notes":"Written atomically with the ready hint only for flagged ghost repairs. Never read by serving or release decisions. Not an enablement control or per-cohort cap. Existing selector remains default OFF. Cohort total/ready/completed/blocked counts use equality-only COUNT; no new index. Rollback flag OFF stops new markers; existing fields are inert."}

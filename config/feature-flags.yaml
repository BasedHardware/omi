flags:
  - {"key": "APP_ICON_GENERATION_ENABLED", "aliases": [], "kind": "env", "lifecycle": "config_switch", "surfaces": ["backend"], "summary": "Default off; controls mobile app icon generation after the provider retired the only priced image model.", "fail": "closed", "owner": "SCA-4895", "created": "2026-11-27", "terminal": "keep", "decision": "keep", "notes": "Enable only after a supported image model is configured and priced on the gateway. Off returns HTTP 424 with icon_generation_disabled before provider dispatch."}
  - {"key": "MCP_DAILY_ROLLUP_ENABLED", "aliases": [], "kind": "env", "lifecycle": "ops_kill", "surfaces": ["backend"], "summary": "Default on; accumulate hosted MCP successes per uid/client/UTC day in Redis and emit the MCP Daily Activity PostHog snapshot that replaces the per-call MCP Tool Use Succeeded stream; false/off/0/no stops recording and flushing", "fail": "open", "owner": "SCA-3665 / PostHog cost", "created": "2026-11-23", "terminal": "keep", "decision": "keep", "notes": "Fail-open telemetry: the raw MCP Tool Use Succeeded event never depends on Redis. Off stops new rollup writes and the sweeper; keys expire in 3 days. Before turning it off after contracts/analytics/posthog.json drops the raw event at ingestion, re-enable the raw event there, or Omi TV MCP DAU/WAU/MAU go blind. See backend/docs/server-product-telemetry.md."}
  - {"key": "OMI_SUPPORT_CORRECT_PLAN_ENABLED", "aliases": [], "kind": "env", "lifecycle": "ops_kill", "surfaces": ["backend"], "summary": "Default on for manual support plan correction applies. Set false, off, 0 or no in the operator command environment to block plan writes while keeping dry runs available.", "fail": "open", "owner": "support-ops / SCA-3359", "created": "2026-11-22", "terminal": "keep", "decision": "keep", "notes": "Operator CLI only. No deployment environment binding. The command stays dry run unless the operator passes --apply with an attributable ticket and a committed private receipt."}
  - {"key": "LEGAL_HOLD_DEFER_SINGLE_DELETE", "aliases": [], "kind": "env", "lifecycle": "ops_kill", "surfaces": ["backend"], "summary": "Default on; a conversation delete on an account under an active legal hold is accepted for the user (hidden, tombstoned, 204) and physically retained until release. false/off/0/no restores the previous behavior (non-cascade deletes erase; cascade deletes answer 409).", "fail": "open", "owner": "support-ops / SCA-3339", "created": "2026-11-20", "terminal": "keep", "decision": "keep", "notes": "P7 Decision 4: a hold blocks physical disposal, never product access. Turning it off lets a held account's non-cascade delete physically erase the record, audio and frames, which defeats the hold; only for an incident in the held-defer path itself. See backend/docs/runbooks/support-operator-cli.md."}
  - {"key":"PAGER_SENDER_ENABLED","aliases":[],"kind":"env","lifecycle":"config_switch","surfaces":["backend"],"summary":"Default false; permit the dedicated operations pager to dispatch claimed Bark deliveries.","fail":"closed","owner":"Release / SCA-2116","created":"2026-11-20","terminal":"keep","decision":"keep","notes":"Fence the sender by deploying false and pausing the Scheduler job. Firestore receipts survive rollback. Activation requires the separate scoped Release decision in backend/paging/release.yaml."}
  - {"key":"BATCH_ACCOUNT_PRIVACY_WRITER_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; write the account privacy epoch atomically with routed account authority changes. Off restores legacy writer routing and keeps Commit observations.","fail":"open","owner":"batch-custody / lead2","created":"2026-11-18","terminal":"keep","decision":"keep","notes":"Set false/off/0/no on writer-bearing roles to restore the legacy routing. The Commit counter and legacy admission and purge generation remain active. See backend/utils/batch_pipeline/CONTRACT.md."}
  - {"key": "BATCH_PIPELINE_RETAINED_DIGEST_HOLD_ENABLED", "aliases": [], "kind": "env", "lifecycle": "ops_kill", "surfaces": ["backend"], "summary": "Default on; quarantine recovery confirms a pinned retained-source PCM digest mismatch once on the same generation before holding the unit failed_held as retained_digest_changed", "fail": "open", "owner": "Goal: Pipeline", "created": "2026-11-19", "terminal": "keep", "decision": "keep", "notes": "Scoped to the pre-STT recovery fetch only. False restores the legacy single read: a digest mismatch stays a retryable 500 with no hold, confirmation read, state write or metric. Held rows keep their refusal and stay out of automatic nightly and intake-status redrive in every flag mode; a reviewed operator redrive remains available. No deploy env binding in this change. Review by 2026-12-19. See backend/utils/batch_pipeline/CONTRACT.md."}
  - {"key": "CONVERSATION_BATCH_PURGE_COALESCING_ENABLED", "aliases": [], "kind": "env", "lifecycle": "ops_kill", "surfaces": ["backend"], "summary": "Default on; one resumable owner scan for a sealed group of fresh conversation deletion obligations; false/off/0/no restores legacy per-conversation execution", "fail": "open", "owner": "batch-custody / lead2", "created": "2026-11-17", "terminal": "keep", "decision": "keep", "notes": "Approved by David 2026-11-17 as independent deletion-read containment work. Backend-sync purge consumer reads the switch per unit; reconciler and tombstone producers retain existing protocol. The kill switch is the only runtime coalescing gate. The workspace release floor excludes consumers whose completion cannot fence re-arms. Roll out the switch off to all purge consumers and let active groups hand back. Member journals and legacy progress survive handback. See backend/docs/runbooks/conversation-purge-coalescing.md for canary and rollback. No production change authorized by this PR."}
  - {"key":"BATCH_PIPELINE_SILENCE_READ_SKIP_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; skip redundant projection and zero-speech accounting reads for silent uploads; false/off/0 restores full processing; operator repair cohost forces prod off unless --enable-silence-read-skip","fail":"open","owner":"Goal: Margin / Sol","created":"2026-11-12","terminal":"keep","decision":"keep","notes":"David R9, SCA-1757. Live transactional privacy, binding, predecessor, custody, erasure and T2 fences remain. Record-origin/native-record units and mixed/partial speech accounting retain ordinary handling. Audio and retention intervals are unchanged. Prod renders true on backend-integration and backend-sync (#25959). The prod Cloud Run backend pins false for SCA-3555 until the SCA-1824 guard can cover first traffic. Prod also renders false on the projection pump and on listen (SCA-3516: the listen roll preserves live behaviour; listen activation is its own one-key step with a scoped go, guard and readback). No wider rollout until the sync privacy-read rise (SCA-3610) is explained. Rollback false; this PR does not activate prod. Operator cohost backend/scripts/batch_pipeline_projection_repair.py forces the process flag false for --stage prod, even if inherited true; only explicit --enable-silence-read-skip opts that invocation in. No production repair is authorized by this PR. Runbook backend/docs/runbooks/batch-silence-read-skip.md. SCA-3544 pins prod backend-sync-backfill false during catch-up. Backfill exception owner: Margin. Review on 2026-11-24 and revisit when backfill passes its catch-up guard."}
  - {"key":"MCP_CONVERSATION_FETCH_DEFAULT_MAX_SEGMENTS","aliases":[],"kind":"env","lifecycle":"config_switch","surfaces":["backend"],"summary":"Hosted MCP detail default is 500 segments; set 120 to roll back; clamp 1..500, invalid uses 500","fail":"open","owner":"quality-lead / q12-mcp-paging","created":"2026-11-16","terminal":"keep","decision":"keep","notes":"Read at request time; tools/list advertises the effective default. Existing 24k default text, 100k hard text and 120k serialized response limits remain. Quality lead reviews MCP latency, tool errors and response size before and after release; no production setting changed in this PR. Review by 2026-12-15."}
  - {"key": "EPISODE_LIVE_MEMBER_CLOSE_ENABLED", "aliases": [], "kind": "env", "lifecycle": "ops_kill", "surfaces": ["backend"], "summary": "Default on; separate post-gap live captures and compose closed episodes from finished members", "fail": "open", "owner": "quality-lead", "created": "2026-11-16", "terminal": "keep", "decision": "keep", "notes": "Kill switch false restores legacy placement and all-member readiness. Quality lead rolls the same image across backend, listen, pusher, backend-sync, backend-sync-backfill and finalization workers; watch live-member counters, compose waiting/errors and timeline conflicts. Review by 2026-12-15. No audio, custody, billing or phone changes."}
  - {"key":"BATCH_PIPELINE_BACKLOG_RELEASE_WRITER","aliases":[],"kind":"env","lifecycle":"config_switch","surfaces":["backend"],"summary":"Default disabled; enable one fenced serving heartbeat authority after all committers are verified.","fail":"closed","owner":"quality-12h/Q12-BB","created":"2026-11-16","terminal":"keep","decision":"keep","notes":"Disabled by default for mixed-version release safety; enabled only on prod backend-integration. Release owner approved 2026-11-18: four support owners at 60/h in allowlist_only with projection-headroom enforcement, after every committer runs the PR 4 reader; review the first hour of delivery before any change. Separately approved all mode starts at 2/h, then 10-20/h after delivery and projection checks. See backend/docs/listen_pusher_pipeline/changes/2026-11-14-backlog-release-meter.md."}

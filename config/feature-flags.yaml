  - {"key":"BATCH_ALLOWANCE_HOLD_RETRY_SECONDS","aliases":[],"kind":"env","lifecycle":"config_switch","surfaces":["backend"],"summary":"Default 1800; an allowance- or budget-exhausted batch unit parks its re-lease cycle for this window instead of escalating to the 300 s steady cycle; 60 restores the former behaviour","fail":"closed","owner":"backlog-refactor","created":"2026-11-01","terminal":"keep","decision":"keep","notes":"batchdesign 2026-11-01 sections 3 and 9 (PR-1): 62% of 25%-ramp batch leases were exhausted-allowance holds re-leased every 300 s to re-decide a denial only a plan change can lift. Admission returns this window on allowance_exhausted/budget_exhausted; the scheduler escalation ladder treats a policy delay as a floor, so the window survives at every refusal streak. Transient denials keep the 60 s retry; fair-use and daily-ceiling holds keep their own windows; privacy stays checked at every lease and admission read. Rollback 60 (read per decision). See backend/utils/batch_pipeline/admission.py."}

  - {"key":"RECORD_SEAL_UPLOAD_FAILED_REPAIR_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; repair job may atomically clear upload_failed only after full normal proof and unchanged-state fencing","fail":"open","owner":"two-lane lead","created":"2026-10-31","terminal":"keep","decision":"keep","notes":"David 2026-10-31 ruling C. Repair-only explicit opt-in; sweeper and inline finish retain sticky refusal. Chart recordSealRules.uploadFailedRepairEnabled; false restores refusal. Roll all failure-marker writers before enabling repair, or repeated marks from old writers cannot invalidate the plan. Active Jobs retain startup config; stop them for immediate rollback."}
  - {"key":"NOTES_SHORT_CLIP_FLOOR","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; server notes minimum below 4 seconds or 12 English words, independently of notes-v2","fail":"open","owner":"auditfix","created":"2026-10-31","terminal":"keep","decision":"keep","notes":"False/0/off/no restores legacy notes admission outside NOTES_PACKET_V2_MODE serve cohorts, which retain the floor. Explicit English reminders, user-kept/title, photos, existing rich notes and selected summary apps bypass it. Other/unknown languages and non-ASCII scripts use duration only. Server-minimum rows skip memory, automatic summary apps, folder/goal intelligence and summary vectors while creation webhooks remain. Desktop local summarization is out of scope. Watch omi_notes_refactor_results_total{check=short_clip,outcome=minimum}."}

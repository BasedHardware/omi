  - {"key":"PARAKEET_WINDOW_STRANDED_DRIFT_SETTLE_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on unless false; a stranded-flush window answer whose text fell beyond the posted fragment settles like an empty answer instead of holding replay until replay_ring_overflow","fail":"open","owner":"dazheng","created":"2026-10-19","decision":"keep","notes":"Context PCM and the replay copy are retained until capture age, as for answered-empty audio; first-text rescue is unchanged. Watch omi_stt_window_stranded_flushes_total{outcome=settled_unplaced} and omi_fallback_total{reason=replay_ring_overflow}. False restores holding the anchor for a repost. See backend/docs/operational/windowed-live-stt.md."}

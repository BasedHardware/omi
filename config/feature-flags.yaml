  - {"key":"PUSHER_STORAGE_PCM_BUDGET_MB","aliases":[],"kind":"env","lifecycle":"config_switch","surfaces":["backend"],"summary":"Process-wide queued/running custody PCM byte admission; default0 off, MiB with 25 percent reserved for tails","fail":"open","owner":"uicleanup (omi-lifecycle)","created":"2026-11-06","terminal":"keep","decision":"keep","notes":"Custody-risk default-off ruling lead2 09e16f. Enabled minimum27 MiB admits a20 MiB socket window in the75 percent live lane; smaller invalid startup values select off and deployment validation rejects them. Proposed512 MiB; never enable in PR-B. Refusal issues no receipt or ACK and keeps socket buffers/checkpoints for later boundaries. Canary: dev chart then one pod15min, socket kills <=15/15min and memory p99 <75 percent of3.5GiB; lifecycle owner expands within one day of clean canary. Rollback chart0. See backend/docs/runbooks/audio-durable-outbox.md."}

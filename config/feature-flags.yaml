  - {"key":"ENRICHMENT_MAX_AGE_HOURS","aliases":[],"kind":"env","lifecycle":"config_switch","surfaces":["backend"],"summary":"Default 72 hours: park historical enrichment without deleting its durable obligation; 0 disables new parking","fail":"closed","owner":"auditfix","created":"2026-11-04","terminal":"keep","decision":"keep","notes":"David 2026-11-04: only process the last three days. Either old conversation created_at or old first_pending_at parks unleased work under age_gate_72h. No data is deleted. Increase the window or set 0 before a separately authorized bounded unpark; decreasing a nonzero window parks more work. Existing parked rows remain durable and do not re-wake on mark, sweep or debt repair."}

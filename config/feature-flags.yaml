  - {"key":"BATCH_PIPELINE_GUARDED_LONG_RECOVERY_MAX_SECONDS","aliases":[],"kind":"env","lifecycle":"rollout","surfaces":["backend"],"summary":"Default 0; held at 0 in every deployment until newly admitted guarded long captures can accept words with independent acoustic evidence","fail":"closed","owner":"auditfix","created":"2026-11-02","terminal":"keep","decision":"keep","notes":"Planscost lead hold after Luna P1: keep 0. Positive input-bound worker VAD already permits the existing Modulate route; without acoustic evidence the new path only buys calls that remain failed_held. Retain dormant bounded code (hard 7200-second ceiling). Before raising, add and test acceptance of recovered words with independent input-bound acoustic evidence, then obtain lead review. Requires the master recovery flag; invalid/nonfinite values refuse admission. Soniox stays capped at 60 seconds and existing failed_held units never reopen. See backend/docs/runbooks/batch-language-recovery.md.","review_by":"2026-11-22"}

nged, stored transcripts unchanged","expander":"Goal: Pipeline owner","done_by":"2026-12-10"}}
  - {"key":"commit_wake","aliases":[],"kind":"posthog","lifecycle":"rollout","surfaces":["backend"],"summary":"A batch worker that commits a result tells the serving backend which owner it was (POST /v2/batch-pipeline/commit-wake, owner ids only) and the backend writes that owner's result into the conversation without waiting for the next serving sweep. A lost wake is found by the sweep as before. Absent or false: the worker sends nothing for that owner.","fail":"closed","owner":"Goal: Pipeline","created":"2026-11-25","review_by":"2026-12-09","terminal":"undecided","decision":"pending","posthog":{"row":"absent","role":"enable"},"notes":"Server-only Omi flag store rule read per account (backend/config/reliability_experiments.py, bound in utils/reliability_flags.py). No rule or an inactive rule is off. Rollback: deactivate the rule. See backend/utils/batch_pipeline/commit_wake.py. The worker decides per owner, so it needs the flag store configured (OMI_FLAGS_FIRESTORE_PROJECT) before any owner can be admitted there.","ramp":{"cohorts":["internal accounts (allow list)","5%","25%","100%"],"clean_metric":"Result committed to written into the conversation seconds on admitted owners, commit-wake send failures, Firestore reads of the projection walk per committed unit","expander":"Goal: Pipeline owner","done_by":"2026-12-09"}}

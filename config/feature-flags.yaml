  - {"key":"EPISODES_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on unless set to a non-on value; live episodes overlay (per-moment gpt-5-nano update, provisional items, /v1/episodes capability). Off reports enabled=false and apps keep today's per-conversation UI","fail":"open","owner":"auditfix","created":"2026-10-20","terminal":"keep","decision":"keep","notes":"Kill switch. Off stops every episode read, write and model call; conversations, tasks and memories are never written by this feature. Spend is further limited to users whose app calls /v1/episodes (backend/utils/episodes/client_gate.py). See backend/utils/episodes/ARCHITECTURE.md."}

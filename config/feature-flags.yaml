  - {"key":"BATCH_PIPELINE_EMPTY_ASR_SAFETY_NET_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; one context-bearing Parakeet retry, independent fenced recovery and retained positive-VAD empty audio","fail":"closed","owner":"dazheng","created":"2026-10-25","terminal":"keep","decision":"keep","notes":"False rolls back worker retry and positive-VAD terminal-disposal protection on CPU recovery roles. Never changes admission, paid-intent limits or privacy/allowance fences. Measured held VAD receipts persist independently of this switch. See backend/docs/listen_pusher_pipeline.mdx and tests/unit/test_batch_pipeline_empty_safety.py. Lead owns merge, deploy and six-unit historical redrive approval."}

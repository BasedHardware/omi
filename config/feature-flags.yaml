  - {"key":"BATCH_HELD_DEAD_LETTER_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; seven-day held and fourteen-day record barrier deadlines with retained dead letters and bounded held nightly re-drive","fail":"open","owner":"uicleanup","created":"2026-11-06","terminal":"keep","decision":"keep","notes":"False stops new stamps, expiry and GPU automatic maintenance; existing projection nightly re-drive and private OIDC requeue-quarantined remain usable. Legacy rows get seven days at first sweep. Dead letters retain encrypted audio, reason held_expired and all intent/attempt history; no TTL, deletion or conversation writes. Nightly UTC keyset pass on existing serving maintenance leader; 32 rows per five minutes. Stock and rate alert to agent tier. See backend/docs/runbooks/batch-held-dead-letter.md. The 2026-11-07 settle ruling includes assignment-held rows that fail the real-held gate: identity, privacy refusal and open operator intents still fence expiry; missing anchors get a full window, malformed anchors never expire. Use the identical expiry markers and original nightly release gates. The shared switch also controls record barrier deadline stamps, expiry and stock sampling; false preserves ordinary record retries and private OIDC requeue-record. First barrier refusal gives legacy rows a full fourteen days; malformed deadlines never expire. Record dead letters retain reason record_barrier_aged, audio, custody and conversations; no paid replay. Net new env flags: zero (lead2 bus 258db3). See backend/utils/batch_pipeline/CONTRACT.md. Owner for record settlement: omi-pipeline. This switch controls record dead-letter and held/assignment expiry only; ghost settle has its own independent BATCH_PIPELINE_PROJECTION_GHOST_SETTLE_ENABLED switch. Record dead-letter rollback: set BATCH_HELD_DEAD_LETTER_ENABLED=false on record-serving roles to stop record stamps, flips and stock sampling, retaining ordinary retries and private requeue. Assignment expiry rollback: set BATCH_HELD_DEAD_LETTER_ENABLED=false on serving and worker roles to stop new held deadlines/expiry and GPU automatic maintenance; existing projection recovery and manual requeue remain. Neither rollback stops ghost settle."}

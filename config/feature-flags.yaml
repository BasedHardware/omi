  - {"key": "CONVERSATIONS_V3_SILENCE_GAP_SECONDS", "aliases": [], "kind": "env", "lifecycle": "config_switch", "surfaces": ["backend"], "summary": "Default 300 seconds, bounded 120\u20131800; controls the v3 recorded-speech grouping gap; above 300 it also switches on sit-down cutting", "fail": "closed", "owner": "v3-rollout coordinator", "created": "2026-11-19", "terminal": "keep", "decision": "keep", "notes": "Read only when CONVERSATIONS_V3_STRETCH_COHESION is enabled. Invalid values keep 300. Above 300 seconds the outline gets pause markers and a sit-down rule instead of the hard-boundary sentence, neighbouring conversation entries of a stretch join into one card, and each card meets the Home word minimum on its own words. Setting 300 restores the prior behaviour."}

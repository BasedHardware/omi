  - {"key":"BATCH_PIPELINE_OWNER_CHAIN_PROJECTION_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; a settled quarantine recovery walks that owner's result log from its projection watermark in chain order and runs its contents' follow-ups first","fail":"open","owner":"backlog-refactor","created":"2026-10-19","terminal":"keep","decision":"keep","notes":"False disables the request's owner-chain wake; with recovery owner-only on, the durable receipt waits for the periodic generic sweep. Ordinary global reconciliation retains its generic sweep. Bounded to 64 rows / 30s per wake. Transactional predecessor, owner watermark, privacy, receipt replay and sibling completion fences remain authoritative; follow-ups keep the four-slot bound. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_RECOVERY_OWNER_ONLY_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; post-recovery requests drain only the recovered owner and leave global scans/retries to periodic serving; false restores global reconciliation","fail":"open","owner":"two-lane rollout lead","created":"2026-11-03","terminal":"keep","decision":"keep","notes":"Periodic serving supervision retains global maintenance, projection discovery and queue sampling. The owner request retains fenced merge, projection, targeted durable follow-ups and owner-scoped index work. Pending jobs and result receipts remain the durable retry owner after process loss. Watch stage=post_recovery latency, maintenance aborts, prepared/held age and queue slope. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_PROVIDER_FRESH_CAPTURE_LAG_SECONDS","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default 86400; longest capture-to-admission lag at which a provider-route upload is stamped fresh, clamped to 600-86400; 600 restores the 10-minute bar shared with the GPU lane","fail":"open","owner":"provider-stt drain","created":"2026-11-13","terminal":"keep","decision":"keep","notes":"Read at provider admission (backend-sync). While the provider backlog is held, a provider row not stamped fresh is not delivered, so the shared 10-minute bar dropped every late-synced provider upload (2026-11-13: 167 of 1,195 admissions, none committed). Stop action: set to 600 on backend-sync. Does not reclassify rows already admitted. Watch omi_batch_pipeline_provider_admissions_total by lag for a bulk late sync."}
  - {"key":"BATCH_PIPELINE_MERGE_TX_FRESH_GATE_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; select earliest pending and earliest ready fresh rows transactionally with LIMIT 1. False restores the outside-transaction 32-row probe.","fail":"open","owner":"SCA-2015","created":"2026-11-14","terminal":"keep","decision":"keep","notes":"Missing index falls back to the probe for 300 s. See backend/docs/listen_pusher_pipeline/changes/2026-11-14-transactional-fresh-gate.md."}
  - {"key":"BATCH_PIPELINE_MERGE_STALE_HEAD_PROMOTE_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; a blocked ordered merge requeues the owner's due retry heads (allowance holds park) instead of waiting for global oldest-due recovery. False restores waiting for recovery.","fail":"open","owner":"q12-post-seal","created":"2026-11-18","terminal":"keep","decision":"keep","notes":"Only rows whose next attempt is bounded: worker-failure and lease-expiry retries (attempt-charged) and parkable allowance holds; policy holds and unevaluated refusals stay with recovery. Requeued rows keep their admission identity and drop to the capture-age service class. At most 8 rows per merge call, 3 promotions per row, 2/s per process (burst 16). See backend/docs/listen_pusher_pipeline/changes/2026-11-18-merge-promotes-stale-retry-heads.md."}

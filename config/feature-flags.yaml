  - {"key":"no_live_player","aliases":[],"kind":"posthog","lifecycle":"rollout","surfaces":["mobile"],"summary":"The conversation page of a conversation still in progress shows no audio player: its bar is Ask Omi and, where it applies, End Conversation; a tap on a transcript line does not seek and no audio is loaded. The player returns when the conversation ends. Absent or false: the Transcript tab shows the player over the audio saved so far.","fail":"closed","owner":"Goal: Pipeline","created":"2026-11-26","review_by":"2026-12-10","terminal":"undecided","decision":"pending","posthog":{"row":"absent","role":"enable"},"notes":"Omi flag store rule read by the mobile app from GET /v1/flags (app/lib/services/experiments/reliability_flags.dart). Client presentation only. No rule or an inactive rule is off. Rollback: deactivate the rule. See app/lib/widgets/conversation_bottom_bar.dart.","ramp":{"cohorts":["internal accounts (allow list)","5%","25%","100%"],"clean_metric":"No rise in conversation page errors on admitted accounts; playback starts on ended conversations as before","expander":"Goal: Pipeline owner","done_by":"2026-12-10"}}

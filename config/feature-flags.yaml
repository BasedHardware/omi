  - {"key":"RECORD_INTAKE_AGE_PRIORITY_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; native record units finished more than ten minutes ago use existing RECENT or DEEP priority before enqueue","fail":"open","owner":"pipeline quality","created":"2026-11-15","terminal":"keep","decision":"keep","notes":"false/off/0 restores legacy FRESH classification for newly admitted native record units. Full captures and partial pages use the canonical barrier finished_at; missing/invalid clocks cannot take FRESH. Existing admitted units, provider funding/hold policy and all custody/privacy checks remain unchanged. Deploy intake first and verify queue priorities before enabling parallel seal drain."}
  - {"key":"RECORD_SEAL_REPAIR_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; CPU seal workers and retained repair cron use canonical privacy and tail proof with isolated row budgets","fail":"open","owner":"two-lane lead","created":"2026-10-30","terminal":"keep","decision":"keep","notes":"Per-pod control: recordSealWorker.runtimeEnabled sets this env on CPU workers and children; recordSealRepair.runtimeEnabled independently sets it on cron jobs. False idles workers before cloud access; rollout termination reaps children. Rollback pairs worker runtimeEnabled=false with recordSealRepair.suspend=false. Cron is retained suspended by default; first evening peak explicitly unsuspends for overlap before suspension and the peak gate. Shared pods:list RBAC remains while any seal path is enabled. No new seal rules, data deletion or flag-budget exception. See backend/docs/runbooks/record-seal-workers.md."}
  - {"key":"RECORD_SEAL_REPAIR_FRESH_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; reserve existing repair slots for continuous newest-first recent recordings and atomically wake their normal intake after a proven seal","fail":"open","owner":"pipeline quality","created":"2026-11-15","terminal":"keep","decision":"keep","notes":"false/off/0 disables fresh borrowing and admission wakes, and serving intake stops certifying new retry markers. Original urgent/ordinary and conversation discovery allocations remain intact in every mode; idle fresh slots are lent back with 90s bounds. Fresh discovery: enqueue age 60s to 2h, 15s polling, up to half the existing slots after the checkpointed initial group, 90s row limit, 120s retry spacing. Producer, retained-tail and privacy proof stay authoritative. See backend/docs/listen_pusher_pipeline/changes/2026-11-15-fresh-seal-repair.md. Rollback all GKE repair/worker pods with recordSealRepair.freshEnabled=false and all five main.py hosts (four Cloud Run backends plus GKE listen) with RECORD_SEAL_REPAIR_FRESH_ENABLED=false in the environment overlays/chart. BATCH_HELD_DEAD_LETTER_ENABLED remains an independent kill switch. Proven older certified retries wake at available_at=1 after fresh wakes at 0; active claims and unmarked future clocks stay untouched. Cron schedule and shard-count rollback are separate chart values."}
  - {"key":"RECORD_SEAL_REPAIR_JOBS","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; bounded aged record-pending jobs discovery feeds existing producer, tail and privacy proof paths","fail":"open","owner":"two-lane lead","created":"2026-11-05","terminal":"keep","decision":"keep","notes":"Only off disables the jobs-keyed repair leg. Independent encrypted cursor; shares discovery, row and run budgets. Missing-conversation cancellation is revocation-only after seven days. No custody transfer or finalization authority. See backend/deploy/record-seal-repair/README.md."}
  - {"key":"RECORD_SEAL_REPAIR_MODE","aliases":[],"kind":"env","lifecycle":"config_switch","surfaces":["backend"],"summary":"plan or apply; default apply, plan performs canonical proofs without writes","fail":"closed","owner":"two-lane lead","created":"2026-10-30","terminal":"keep","decision":"keep","notes":"Independent repair job only; invalid mode refuses cloud access. Plan does not advance the encrypted maintenance cursor. Apply advances it before proof work, then wraps to revisit refusals. Lead supplies current serving-role flags via chart recordSealRepair.serverFlags and refreshes that CronJob map per ramp rung without changing the worker Deployment."}
  - {"key":"OMI_FLAGS_SOURCE","aliases":[],"kind":"env","lifecycle":"rollout","surfaces":["backend","llm-gateway"],"summary":"Frozen at current values: dual on backend hosts, omi on llm-gateway (lead2 95e1f1); freeze review done_by 2026-11-16, owner cl2-coordkit. Default posthog; dual serves PostHog and compares Omi; omi serves Omi flags","fail":"closed","owner":"cl2-coordkit","created":"2026-10-29","review_by":"2026-11-12","terminal":"on","decision":"pending","ramp":{"cohorts":["Frozen: dual on backend hosts; omi on llm-gateway (lead2 95e1f1); no next-roll expansion","cl2-coordkit freeze review done_by 2026-11-16; retain original registry deadline and existing extension","Rollback per host: OMI_FLAGS_SOURCE=posthog in backend/deploy/runtime_env/prod.overlay.yaml, recompose with python3 backend/deploy/compose_runtime_env.py, apply on the next roll; align GKE chart env; llm-gateway also restores PROACTIVITY_V2_POSTHOG_TOKEN and PROACTIVITY_V2_POSTHOG_HOST"],"clean_metric":"24h gate for every independently inventoried expected dual evaluator (job, service_name): sum by (job, service_name) (increase(omi_flag_dual_read_total{flag=\"proactivity_v2\",outcome=~\"mismatch|omi_absent|omi_error\"}[24h])) == 0 AND sum by (job, service_name) (increase(omi_flag_dual_read_total{flag=\"proactivity_v2\",outcome=\"match\"}[24h])) > 0; both must return every expected target. Every expected scrape instance must have min_over_time(up[24h]) == 1, count_over_time(up[24h]) >= (86400 / configured scrape interval seconds), no cadence gaps, and all four outcome series throughout the window; omi_fallback_total{component=\"feature_flags\"} flat. Missing targets, incomplete windows or zero comparisons block the gate. Exact per-instance PromQL templates and inventory: backend/docs/runbooks/omi-flags.md#24-hour-dual-read-clean-gate","expander":"cl2-coordkit (freeze owner; no expansion authorized)","done_by":"2026-11-12"},"notes":"Frozen by lead2 ruling 95e1f1. Review done_by 2026-11-16; immutable original ramp/review dates and existing extension retained for registry checker compatibility. Frozen target is dual everywhere, omi on llm-gateway. Integration/backfill had no env (posthog default); explicit dual provisioning closes that gap, serving PostHog with Omi compare-only. Re-run the full 24h gate after provisioning and scrape coverage are verified. Rollback per host: OMI_FLAGS_SOURCE=posthog in backend/deploy/runtime_env/prod.overlay.yaml + python3 backend/deploy/compose_runtime_env.py on the next roll; align applicable GKE chart env. Gateway also restores approved PROACTIVITY_V2_POSTHOG_TOKEN and PROACTIVITY_V2_POSTHOG_HOST binding before its roll. Runbook backend/docs/runbooks/omi-flags.md. David bulk ruling 2026-11-17 (quality ladder flag docket). Ruling: extend. Next step: Frozen at dual on backend hosts and omi on the gateway; integration and backfill still lack dual. Move them by 2026-11-23, then graduate. Next-step due 2026-11-23 (from docket); owner cl2-coordkit. Registry due stays 2026-11-22 (the single extension is used or capped at 14 days): ramp, retire or re-decide by then; the later date is the target, not an extension.","extension":{"until":"2026-11-22","reason":"ad1268 C: partial/mixed ramp past due -> ramp to 100 on existing gates via cl2-deploy","by":"auditfix","granted":"2026-11-08"}}

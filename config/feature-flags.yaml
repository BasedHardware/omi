  - {"key":"BATCH_PIPELINE_PROVIDER_MERGE_MEMBERSHIP_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on unless false; provider-route batch units take part in the ordered merge like GPU units: provider admission stamps fresh_capture, provider settle stamps ready_at and wakes one coalesced owner drain, and provider rows admitted before the stamp count as catch-up; false restores the earlier writes and removes the wake","fail":"open","owner":"provider-stt-drain","created":"2026-11-13","terminal":"keep","decision":"keep","notes":"2026-11-13: 1.68M transcribed provider units (98% of result_ready) were unmerged because nothing woke their owner's merge, they had no ready_at for the head wait and no merge class for fresh-first. Rows stamped while on keep their fields after a rollback. Watch the share of provider units settled 1 h earlier that are committed, projection pending, and batch_pipeline_store exhausted contention. See backend/docs/batch-pipeline-serving.md."}

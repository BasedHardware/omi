  - {"key":"BATCH_PIPELINE_PROJECTION_HOLD_RECOVERY_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; age-gate awaiting-writer backfill holds and boundedly release completed targets","fail":"open","owner":"backlog-refactor","created":"2026-11-01","terminal":"keep","decision":"keep","notes":"False restores the lane-only first-failure strike, record-origin-only one-shot release and 32-row/900-second cadence. On: six-hour capture-end threshold, three unsuccessful redrives per episode, 128-row/60-second scan with five-second inter-row budget. Released pending rows keep draining after switch-off; audio and committed results remain retained. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"FIRESTORE_WRITE_PROBE_ENABLED","aliases":["OMI_FIRESTORE_WRITE_PROBE_ENABLED"],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; count committed Firestore writes by collection, op, caller and origin at the GAPIC Commit/BatchWrite boundary","fail":"open","owner":"fswrites","created":"2026-11-01","terminal":"keep","decision":"keep","notes":"A literal false on either the canonical key or its legacy alias skips installing the write probe in that process. Set false on a Cloud Run service whose max scrape is near its GMP sidecar samples limit; observe-only, no data path."}
  - {"key":"RECORD_AUDIO_PARTIAL_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; finish unprovable stored recordings explicitly partial after 30 minutes and admit serial late-audio fills","fail":"open","owner":"two-lane lead","created":"2026-10-31","terminal":"keep","decision":"keep","notes":"ADR 0007; David 2026-10-31 and lead design acceptance 7e2a57. Literal false stops new partial finishes and CPU continuation admissions. Existing accepted worker jobs drain normally. No live-token age expiry, complete-proof relaxation, audio deletion or hard-3 threshold change. Set on repair and CPU drainer hosts for rollback; active repair Jobs retain startup config. Lead applies paired census patch with release."}
  - {"key":"PUSHER_PROJECTION_QUEUE_WAIT_BOUND_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; bound only committed pusher projection queue capacity waits to the existing 300-second receive-liveness budget","fail":"open","owner":"two-lane lead","created":"2026-10-31","terminal":"keep","decision":"keep","notes":"Only literal false restores unbounded queue-capacity waiting for new sockets. Committed receipts retain a single-slot projection owner before ACK and capacity waiting. Queue plus slot must drain before producer clear; normal expired socket drains transfer to the capped process owner. Admission failure keeps the fence. Measurement and ACK departure delivery remain active. No idle reclaim, custody deadline, listen change or token age release. Lead owns pusher deploy and scrape verification."}
  - {"key":"RECORD_SEAL_REFUSED_STAMP_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; persist first producer-pending seal refusal and observe its bounded sweeper age","fail":"open","owner":"omi-lifecycle","created":"2026-11-06","terminal":"keep","decision":"keep","notes":"Phase 1 approved by lead2 bus 430238. False disables refusal stamps and sweeper observations; successful seal still clears an existing stamp. No token, custody or seal-authority change. Existing stamps need no cleanup on rollback."}

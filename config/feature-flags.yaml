  - {"key":"RECORD_AUDIO_PARTIAL_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; finish unprovable stored recordings explicitly partial after 30 minutes and admit serial late-audio fills","fail":"open","owner":"two-lane lead","created":"2026-10-31","terminal":"keep","decision":"keep","notes":"ADR 0007; David 2026-10-31 and lead design acceptance 7e2a57. Literal false stops new partial finishes and CPU continuation admissions. Existing accepted worker jobs drain normally. No live-token age expiry, complete-proof relaxation, audio deletion or hard-3 threshold change. Set on repair and CPU drainer hosts for rollback; active repair Jobs retain startup config. Lead applies paired census patch with release."}
  - {"key":"PUSHER_PROJECTION_QUEUE_WAIT_BOUND_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; bound only committed pusher projection queue capacity waits to the existing 300-second receive-liveness budget","fail":"open","owner":"two-lane lead","created":"2026-10-31","terminal":"keep","decision":"keep","notes":"Only literal false restores unbounded queue-capacity waiting for new sockets. Committed receipts retain a single-slot projection owner before ACK and capacity waiting. Queue plus slot must drain before producer clear; normal expired socket drains transfer to the capped process owner. Admission failure keeps the fence. Measurement and ACK departure delivery remain active. No idle reclaim, custody deadline, listen change or token age release. Lead owns pusher deploy and scrape verification."}

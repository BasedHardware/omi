  - {"key":"mobile-free-tier-on-device-stt-disabled","aliases":[],"kind":"posthog","lifecycle":"ops_kill","surfaces":["mobile"],"summary":"Stop live on-device transcription once a plan's cloud minutes are spent (S17 SttModeResolver); false or absent keeps it on, so at-cap users transcribe on the phone instead of the held Omi socket","fail":"inverted","owner":"free-tier-on-device","created":"2026-11-16","terminal":"keep","decision":"keep","posthog":{"row":"expected","role":"kill"},"notes":"David 2026-11-16: on-phone transcription for every free user past the cap. Default false: on in new clients. True returns new sockets to today's Omi socket (the server holds the audio at the cap) without a release. Read once per socket open with a 1 s bound; unavailable or offline reads keep it on. Whenever the phone cannot transcribe (no allowance snapshot, transient server reason, model not ready, unsupported codec) the client keeps today's Omi socket and prepares the model. Replaces the env/prefs-only OMI_FREE_TIER_ON_DEVICE_STT gate, which stays a local override. See app/lib/services/capture/stt_mode_resolver.dart."}
  - {"key":"mobile-local-preview-disabled","aliases":[],"kind":"posthog","lifecycle":"ops_kill","surfaces":["mobile"],"summary":"Stop the iOS and Android clients declaring local_preview=enabled on /v4/listen; false or absent keeps the on-device live preview request on for batch-lane sessions","fail":"inverted","owner":"auditfix","created":"2026-10-26","terminal":"keep","decision":"keep","posthog":{"row":"expected","role":"kill"},"notes":"Default false: the request ships on and the server (LOCAL_PREVIEW_BATCH_ENABLED plus batch-lane cohort) decides admission. True returns new sockets to today's cloud live transcript without a release. Read once per socket open through the identity/consent-fenced analytics adapter with a 1 s bound; unavailable/offline/tracking-disabled reads keep the request on. Registering as a kill role lets scripts/posthog_flag_sync.py --apply-missing-kills pre-arm the row at 0%. No remote row is created or changed by this PR."}
  - {"key":"mobile-batch-file-cap-smaller","aliases":[],"kind":"posthog","lifecycle":"rollout","surfaces":["mobile"],"summary":"Phone batch files written by the mobile Standard batch route seal at 15 seconds instead of 60; false or absent keeps the 60-second cap","fail":"closed","owner":"Goal: Pipeline","created":"2026-11-24","review_by":"2026-12-08","terminal":"undecided","decision":"pending","posthog":{"row":"absent","role":"enable"},"notes":"Client-evaluated, default off. A batch file already seals two seconds after speech stops; the cap only bounds continuous speech, so the flag shortens how long such speech waits on the phone before upload. Read once per app launch through the identity/consent-fenced analytics adapter with a 2 s bound, without delaying the lane; a missing identity, a failed or late read keeps 60 seconds, and a flip takes effect on the next launch. No frame is dropped or reordered: a shorter cap only moves file boundaries. The retained-file limit scales with the cap (4096 files at 60 s, 16384 at 15 s) so the buffer admits the same span of capture; the byte limit is unchanged. Cost side: more, shorter files mean more upload requests and batch units for the same audio; files sent in one request are still joined into one unit when they are at most 30 s apart. No server change and no remote row is created by this PR. Debug builds can force it with --dart-define=OMI_MOBILE_BATCH_FILE_CAP_SMALLER=true. Rollback: false. See app/lib/services/experiments/mobile_batch_file_cap_gate.dart and app/test/services/wals/mobile_standard_batch_test.dart.","ramp":{"cohorts":["internal devices","1%","10%","50%","100%"],"clean_metric":"Batch units per captured audio hour and Firestore reads and writes per unit stay within the expected rise for the cohort; sync upload refusal share and the phone's stale-file reports (Local WAL Stuck) do not rise; capture end to transcript written into the conversation does not regress.","expander":"Goal: Pipeline owner","done_by":"2026-12-08"}}
  - {"key":"mobile-batch-upload-hold","aliases":[],"kind":"posthog","lifecycle":"rollout","surfaces":["mobile"],"summary":"Hold sealed mobile Standard batch audio for up to 300 seconds in the background or with live preview, and 60 seconds in the foreground without live preview","fail":"closed","owner":"Goal: Margin","created":"2026-11-25","review_by":"2026-12-09","terminal":"undecided","decision":"pending","posthog":{"row":"absent","role":"enable"},"notes":"SCA-4372. Default off. Release provisions the flag for mobile through the existing Omi flag store before the app ramp. Foreground and capture end release held files. Rollback sets the flag false, making held audio eligible on the next client tick after the flag is observed. Held audio stays in the existing WAL journal and index.","ramp":{"cohorts":["0%","5%","25%","100%"],"clean_metric":"SCA-3891 cut guard. Roll back if p90 transcript lateness exceeds the hold window plus five minutes in any state, or on any lost-audio or custody alarm.","expander":"Release owner with Margin GO","done_by":"2026-12-09"}}
  - {"key":"end_open_conversation","aliases":[],"kind":"posthog","lifecycle":"rollout","surfaces":["mobile","backend"],"summary":"Ending a conversation (End, Finish, Wrap Up, record stop, pendant double-tap) seals the phone file being written and sends the End time; the server stores an owner-level cut there, starts a new v3 conversation at it at once, and joins speech recorded before the cut that lands later to the ended conversation. Absent or false keeps the End of the listening session's recording only.","fail":"closed","owner":"Goal: Pipeline","created":"2026-11-25","review_by":"2026-12-09","terminal":"undecided","decision":"pending","posthog":{"row":"absent","role":"enable"},"notes":"Omi flag store rule read by the backend per account (backend/config/reliability_experiments.py, bound in utils/reliability_flags.py) and by the mobile app from GET /v1/flags (app/lib/services/experiments/reliability_flags.dart), so one rule switches both sides. No rule or an inactive rule is off. Rollback: deactivate the rule. See backend/utils/conversations/v3/manual_cuts.py and outline.stretches; an End with a stored cut is not held by the Finish wait of CONVERSATIONS_V3_CAPTURE_CONTINUITY. Can cost a second summary call when late speech joins an ended conversation.","ramp":{"cohorts":["internal accounts (allow list)","5%","25%","100%"],"clean_metric":"Share of Ends answered pending that close at the End time, End to conversation committed seconds, v3 reconcile blocked and raced shares, rewritten summaries per ended conversation","expander":"Goal: Pipeline owner","done_by":"2026-12-09"}}

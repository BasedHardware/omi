  - {"key":"LISTEN_LOOP_METRICS_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on unless false; listen event-loop lag probe, per-frame processing histogram and VAD window counters","fail":"open","owner":"dazheng","created":"2026-10-19","decision":"keep","notes":"Gates the listen HPA retune (D0b). Labels are closed (codec only); no uid or session labels. False/0/off stops the 0.25 s sleep-drift probe at the next pod start and skips frame and VAD timing. See backend/utils/observability/listen_loop.py."}
  - {"key":"BATCH_PIPELINE_LEADER_LEASE_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on unless false; one batch worker or serving replica per Firestore lease runs periodic recovery, drain, cleanup and quarantine discovery","fail":"open","owner":"dazheng","created":"2026-10-19","decision":"keep","notes":"Cost and contention only: every guarded loop is idempotent and transaction-fenced. Lease-store errors fail open to every replica running. False restores per-replica maintenance. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_DIARIZE_SPEECH_ONLY_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on unless false; batch GPU worker diarizes only padded VAD and word evidence and maps turns back to capture clocks","fail":"open","owner":"dazheng","created":"2026-10-19","decision":"keep","notes":"Worker-only Helm worker.diarizeSpeechOnlyEnabled=true. ASR words are unchanged; dense units (over 80 percent retained, fallback reason kept_over_80pct), empty compacted output and any compaction or mapping error diarize the full unit (fallback reason other). Decisions and unit versus diarized seconds: omi_batch_pipeline_diarization_decisions_total and omi_batch_pipeline_diarization_audio_seconds_total. False restores full-unit diarization. See backend/diarizer/batch_pipeline_runtime.md."}
  - {"key":"BATCH_PIPELINE_SHORT_SPEECH_SINGLE_ENABLED","aliases":[],"kind":"env","lifecycle":"rollout","surfaces":["backend"],"summary":"Default off; a batch unit whose speech and words form one region of at most 2 s (pauses up to 0.5 s inclusive) takes the existing skipped_single result without diarization","fail":"closed","owner":"dazheng","created":"2026-10-19","review_by":"2026-11-18","decision":"pending","notes":"Worker-only Helm worker.shortSpeechSingleEnabled=false. Hard-labels SPEAKER_00 with no model check. Enable only after a paired run on prod pyannote revision 3533c8cf8e369892e6b79ff1bf80f7b0286a54ee shows a single full-diarizer speaker on the gate evidence, including two bursts at most 0.5 s apart. Watch omi_batch_pipeline_diarization_decisions_total{decision=skipped_short}. See backend/diarizer/batch_pipeline_runtime.md."}
  - {"key": "OMI_DEV_MEMORY_REUSE_READ_WINDOWS_ENABLED", "aliases": [], "kind": "env", "lifecycle": "ops_kill", "surfaces": ["backend"], "summary": "Default on unless false; reuse historical metadata prefixes and status checks within one Developer memory list read", "fail": "open", "owner": "dazheng", "created": "2026-10-19", "decision": "keep", "notes": "See backend/docs/runbooks/external-list-reads.md. State ends at read return or retry; false restores repeated prefix reads. No production flag change."}
  - {"key":"BATCH_PIPELINE_OWNER_CHAIN_PROJECTION_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; a settled quarantine recovery walks that owner's result log from its projection watermark in chain order and runs its contents' follow-ups first","fail":"closed","owner":"dazheng","created":"2026-10-19","decision":"keep","notes":"False restores the generic cursor sweep after recovery. Bounded to 64 rows / 30s per wake and fails open to the generic sweep. Transactional predecessor, owner watermark, privacy, receipt replay and sibling completion fences remain authoritative; follow-ups keep the four-slot bound. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_PROJECTION_PAGINATION_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on; independently advance assignment and follow-up discovery beyond blocked projection pages","fail":"closed","owner":"dazheng","created":"2026-10-18","decision":"keep","notes":"False restores oldest-100 discovery for both scanners. Cursor hints reset on restart; durable privacy, predecessor, sibling completion and paid intent fences remain authoritative. See backend/docs/batch-pipeline-serving.md."}
  - {"key":"BATCH_PIPELINE_RECOVERY_TASKS_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Request-backed paid quarantine recovery survives ordinary revision draining","fail":"closed","owner":"dazheng","created":"2026-10-18","decision":"keep","notes":"Default true. False restores inline sweep. Existing paid intent tokens, privacy checks and artifact reconciliation remain authoritative; never resets uncertain calls. Uses BATCH_PIPELINE_RECOVERY_TASKS_QUEUE (isolated batch-quarantine-recovery on prod integration; SYNC_TASKS_QUEUE fallback elsewhere) and the existing invoker, targeting integration via BATCH_PIPELINE_RECOVERY_TASK_AUDIENCE; dispatch failures fall back inline through the same paid-intent fence. See backend/diarizer/batch_pipeline_runtime.md."}
  - {"key":"BATCH_PIPELINE_RECOVERY_WAKE_LEASE_SECONDS","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"One outstanding quarantine-recovery delivery task per paid intent; lease before a lost wake is repaired; default 600, 0 = legacy 120s wake on every sweep","fail":"closed","owner":"dazheng","created":"2026-10-19","decision":"keep","notes":"Scheduling metadata only; RecoveryStore.start remains the sole paid-intent fence. Bounds 120..3600; malformed keeps 600. A delivered task that leaves the intent prepared re-arms a 120s wake."}

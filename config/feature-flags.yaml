  - {"key":"ENRICHMENT_EMPTY_OUTPUT_BACKOFF_SECONDS","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default 120; an empty first summary on the enrichment push consumer re-arms the row for its next attempt after this many seconds instead of answering 409 for an immediate Cloud Tasks callback rerun; 0 restores the immediate 409","fail":"open","owner":"Goal: Margin / SCA-3667","created":"2026-11-23","terminal":"keep","decision":"keep","notes":"The legacy sync_handler path already deferred an empty output by LIVE_DEFER_SECONDS (120); the push consumer answered 409 with available_at=now, so each empty-output obligation cost two immediate callback reruns (77,909 unavailable attempts/day on enrichment-fresh + enrichment, 2026-11-22). Bounded 0..3600, invalid values use 120. The strike is fenced to the claimed row version, so an append that lands mid-callback charges no strike. Watch cloudtasks.googleapis.com/queue/task_attempt_count{response_code=unavailable} on both queues, omi_delivery_outcome_total{kind=summary,outcome=failed} and omi_conversation_llm_calls_total. This does not change the empty-output rate itself."}

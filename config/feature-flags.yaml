  - {"key": "CONVERSATIONS_V3_LOCKED_CLOSURE_OWNERS", "aliases": [], "kind": "env", "lifecycle": "rollout", "surfaces": ["backend"], "summary": "Default empty (off). Owner tags (sha256(uid)[:12], or *) whose live v3 closure may hold locked claimants past the derived budget.", "fail": "closed", "owner": "Goal: Pipeline", "created": "2026-11-26", "terminal": "undecided", "decision": "pending", "notes": "SCA-2918. Ships unbound on every loader (code default empty: nobody admitted). Owner tags never go in Git (public repo): admission is a later change after an operator with Secret Manager and IAM rights provisions secret CONVERSATIONS_V3_LOCKED_CLOSURE_OWNERS (version 1 none, secretAccessor for backend-runtime@), then a small PR binds it on backend, backend-integration, backend-sync and backend-sync-backfill and adds v3-locked-closure-owners to the activation manifest, then a roll; each owner after that is a new secret version plus a roll (runbook). Builder passes only; derive and re-derive keep their bounds. Sizes: CONVERSATIONS_V3_LOCKED_DERIVED_ALLOWANCE (rows, default 2048), CONVERSATIONS_V3_LOCKED_DERIVED_BYTES (default 8 MiB), CONVERSATIONS_V3_LOCKED_MAX_BATCHES (default 6; a larger commit writes nothing and retries down the pending and unlocked seed ladder, at most three times, before parking at one seed) and CONVERSATIONS_V3_LOCKED_DAILY_PASSES (default 20 allowance attempts per owner per UTC day, each builder load charged on the builder lease before it reads; an uncharged attempt gets the origin bound). Any of the four numbers at 0, or an empty list, restores the origin bound. Rows are clamped to what the batch cap can commit (6 x (449 - sources), 2,694 at most) (an upper bound: other fixed writes and prepared-byte splits still park at the commit's batch cap) and an allowance load fetches at most 2 x that many derived documents plus one sentinel, repeats included, and at most 400 on-open seed ids, each once (more park before any is read); every listed builder commit with pointer rows preloads them and runs each batch at most three times, inside the origin bound too; each attempt is charged to the pass's own lease token. Ceiling: 20 attempts x about 78k Firestore reads (a load of at most about 5.9k plus a commit whose batches each run at most three transactions), about 1.6M Firestore reads per listed owner per day, plus about 6k lake object GETs per attempt (about one per decoded pointer row, and the commit's preload), about 0.12M per owner per day and none while rows stay inline; measured attempts 6.5k to 22k. Emulator fixture tests/integration/test_conversations_v3_locked_closure_cost_firestore.py.", "review_by": "2026-12-10", "ramp": {"cohorts": ["operator provisions the secret (version 1 none) and accessor grant; a separate PR binds it on the four loaders", "one parked owner with a closure of at most 1,200 rows", "five parked owners (at most about 8M reads a day at the daily budget)", "more than six owners, every v3_derived_budget-parked owner, or *, with a yes from the Firestore cost owner (SCA-2173)"], "clean_metric": "Listed owners unpark; per-attempt Firestore reads at most about 78k and typically 6.5k to 22k, and lake object GETs at most about 6k; at most 20 allowance attempts per owner per day; no lease_lost or source_changed rise; no rise in document_too_large, request_too_large, backend-sync 5xx or OOM", "expander": "Home v3 lead with the release owner", "done_by": "2026-12-10"}}

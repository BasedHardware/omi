  - {"key":"BATCH_PIPELINE_PROJECTION_STRIPING_ENABLED","aliases":[],"kind":"env","lifecycle":"ops_kill","surfaces":["backend"],"summary":"Default on unless off; seed projection discovery at an instance-specific committed_at stripe, then wrap through every row","fail":"open","owner":"omi-pipeline","created":"2026-11-06","terminal":"keep","decision":"keep","notes":"Only off (after trimming whitespace and lowercasing) disables this switch; false, 0 and no keep it ON and emit a warning. 4096 stripes over oldest matching committed_at through startup time. SHA-256(revision:random process seed) selects the lower bound once per process without network I/O. One head read per scanner on startup; no permanent partition, no page-size, tick or claim changes. Sparse timestamps can share a start row. Off restores the exact unseeded cursor; pagination off also bypasses striping. Startup logs record stripe and stripe count."}
  - {"key":"PUSHER_MAX_ABANDON_RECORD_DRAINS","aliases":[],"kind":"env","lifecycle":"config_switch","surfaces":["backend"],"summary":"Per-pod abandon coordinators; default and prod4, clamped0..16","fail":"closed","owner":"two-lane lead","created":"2026-11-05","terminal":"keep","decision":"keep","notes":"Zero refuses all overflow coordination. Full admission logs abandon_overflow and retains the old producer fence for process/pod-death repair. Coordinators wait for actual shared storage_executor futures to settle before attesting stoppage."}

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Omi Unlimited</title>
<style>html,body{margin:0;background:#fff}</style>
<script>
// Picks this reader's paywall version once, remembers it on the device, and opens that page with
// the app's query parameters. `?v=<version>` previews a version without changing the assignment.
// To change the split, edit VERSIONS (weights are relative). Readers keep the version they got.
(function () {
  var VERSIONS = { benefits: 50, steps: 50 };
  var q = new URLSearchParams(location.search);
  function store(key, value) {
    try {
      if (value === undefined) return localStorage.getItem(key);
      localStorage.setItem(key, value);
    } catch (e) {}
    return null;
  }
  var version = q.get('v');
  if (!VERSIONS[version]) {
    version = store('omi_pw_version');
    if (!VERSIONS[version]) {
      var names = Object.keys(VERSIONS), total = 0, i;
      for (i = 0; i < names.length; i++) total += VERSIONS[names[i]];
      var roll = Math.random() * total;
      for (i = 0; i < names.length; i++) { roll -= VERSIONS[names[i]]; if (roll < 0) break; }
      version = names[Math.min(i, names.length - 1)];
      store('omi_pw_version', version);
    }
  }
  q.delete('v');
  var search = q.toString();
  // Vercel serves clean URLs (/steps); the local preview server needs the file name.
  var local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  location.replace('/' + version + (local ? '.html' : '') + (search ? '?' + search : ''));
})();
</script>
</head>
<body></body>
</html>

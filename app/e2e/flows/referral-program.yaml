# E2E Flow: Referral Program page
# Tests: referral browser handoff, launch retry and return to Settings

name: referral-program
description: Settings → Referral Program → system browser signup → return to Omi
covers:
  - app/lib/pages/referral/referral_page.dart
  - app/lib/pages/apps/widgets/omi_external_browser_page.dart
  - app/lib/pages/settings/settings_drawer.dart
prerequisites:
  - auth_ready  # User completed real sign-in (Google/Apple) and onboarding. Android: `bash setup.sh android`. iOS: `bash setup.sh ios`. App must show home screen.
setup: normal

steps:
  - name: Open settings drawer
    press: { type: button, position: rightmost }
    screenshot: settings-drawer

  - name: Scroll to find Referral Program
    scroll: down
    screenshot: settings-scrolled

  - name: Tap Referral Program
    press: { type: gesture, hint: "Referral Program row in settings drawer" }
    screenshot: referral-page

  - name: Verify referral page
    assert:
      interactive_count: { min: 2 }
    note: >
      Omi opens affiliate.omi.me in the system browser. Complete Google signup
      there, then return to Omi. If the browser fails to launch, the Omi page
      shows Try Again; Open remains available after a successful launch.
      Google completion requires a device and a test account; widget captures
      only verify the handoff and retry, not an authenticated signup.

  - name: Back to settings
    back: true

  - name: Close settings
    back: true

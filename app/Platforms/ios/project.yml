name: omi-v5-iOS
options:
  bundleIdPrefix: org.reactjs.native
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  omi:
    # The Swift package lives at the repository root.
    path: ../../..

targets:
  OmiHost:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: omi
        products:
          - OmiKit
          - OmiUI
    info:
      path: Info.plist
      # Real keys live in Info.plist (mirrors react-native/ios/RnRuntime/Info.plist);
      # xcodegen merges the generated defaults around the checked-in file.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.reactjs.native.omi-v5-ios
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: OmiHost.entitlements
        ENABLE_PREVIEWS: true

name: omi-v5-macOS
options:
  bundleIdPrefix: org.reactjs.native
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  omi:
    # The Swift package lives at the repository root.
    path: ../../..

targets:
  OmiHost:
    type: application
    platform: macOS
    sources:
      - Sources
    dependencies:
      - package: omi
        products:
          - OmiKit
          - OmiUI
    info:
      path: Info.plist
      properties:
        NSBluetoothAlwaysUsageDescription: Omi uses Bluetooth to connect to your Omi device and stream its audio.
        NSMicrophoneUsageDescription: Omi records audio for your private transcript when capture is on.
        OMIFirebaseAPIKey: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.reactjs.native.omi-v5-macos
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.10"
        CODE_SIGN_ENTITLEMENTS: OmiHost.entitlements
        ENABLE_PREVIEWS: true
      configs:
        Debug:
          # Inject / InjectionIII. Not applied to Release.
          OTHER_LDFLAGS: "-Xlinker -interposable"
          EMIT_FRONTEND_COMMAND_LINES: YES
        # Single-window policy: WindowGroup hosts exactly one window; the
        # Info.plist carries no secondary window scenes.

id: mute/settings-load-failure-stays-muted
summary: >
  Committee blocker 3. If the omi settings subtree fails to load, a muted
  pendant must stay muted rather than fall back to the unmuted default.
committee: [3]
tags: [baseline-bug]
faults:
  - {op: settings_load, key: omi, rc: -5, boots: [1]}
timeline:
  - {t: 3000, app_mute: 1}
  - {t: 6000, power: cycle}
end: 12000
expect:
  boots:
    - {muted: 1}
    - {muted: 1, should_capture: false, sd_paused: true, log: ["SIM: injected fault"]}
  invariants: [mute-blocks-capture, capture-after-settings]
baseline_bug:
  observed_at: c06b9bcd8749 (3.0.23)
  expect:
    boots:
      - {muted: 1}
      - {muted: 0, should_capture: true, log: ["SIM: injected fault"]}

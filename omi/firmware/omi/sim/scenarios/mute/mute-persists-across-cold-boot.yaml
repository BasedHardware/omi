id: mute/mute-persists-across-cold-boot
summary: An app mute survives a cold boot and keeps SD writes paused (issue 5054).
tags: [guard]
timeline:
  - {t: 3000, app_mute: 1}
  - {t: 6000, power: cycle}
end: 12000
expect:
  boots:
    - {muted: 1, should_capture: false, sd_paused: true}
    - {muted: 1, should_capture: false, sd_paused: true}
  invariants: [mute-blocks-capture, capture-after-settings]

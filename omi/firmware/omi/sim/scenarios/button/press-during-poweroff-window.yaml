id: button/press-during-poweroff-window
summary: 'Graduated from fuzz seed 35. A critical-battery power-off is under way when the button is pressed during
  its final second. 3.0.23 armed the level wake before that second, so the press re-fired the runtime GPIO callback
  continuously: the shutdown thread starved, System OFF never came and only the unstoppable watchdog could end it.
  The wake is now armed as the last step.'
tags: [fix]
initial: {charging: false, off_retains_ram: false}

# Startup plumbing plus the button/power/safe-mode/mute paths. BLE, audio and
# the real storage workers stay stubbed (see README "What is real").
CONFIG_OMI_CODEC_OPUS=y
CONFIG_OMI_ENABLE_OFFLINE_STORAGE=y
CONFIG_OMI_ENABLE_BATTERY=y
CONFIG_OMI_ENABLE_BUTTON=y
CONFIG_OMI_ENABLE_HAPTIC=y
CONFIG_OMI_ENABLE_RFSW_CTRL=n
CONFIG_BT=n
CONFIG_GPIO=y
CONFIG_INPUT=y
# sim_power.c supplies sys_poweroff() as a simulated System OFF.
CONFIG_POWEROFF=n
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_ASSERT=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
# Real raw-ring SD driver over the simulated card (sim_sd.c).
CONFIG_DISK_ACCESS=y
CONFIG_CRC=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# nRF5340 tick rate. native_sim's default 100 Hz rounds every 50 ms poll up
# to 60 ms, which silently stretched the 3 s power-on hold window.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=32768

# Production trial length: simulated time is cheap.
CONFIG_OMI_SAFE_MODE_GOOD_UPTIME_S=60

# Omi CV1 HID dictation PROTOTYPE build overlay.
#
# NOT for production: append to the production omi.conf via
#   west build ... -- -DEXTRA_CONF_FILE=<this file>
# or use scripts/ci/build-cv1-hid-prototype.sh, which wires everything up.
#
# What this changes vs. the stock build:
#  - compiles in the opt-in dictation control-plane + (after an explicit,
#    RAM-only app opt-in) a standard BLE HID keyboard service;
#  - HID characteristics require an encrypted link (standard for HID hosts);
#  - bond storage enabled so a paired HID host can reconnect;
#  - GAP appearance becomes "keyboard" so hosts classify the pendant.
# Stock behavior is unchanged until the app enables the prototype, and a
# power cycle always clears the opt-in (documented recovery path).

CONFIG_OMI_ENABLE_HID_DICTATION=y

CONFIG_BT_HIDS=y
CONFIG_BT_CONN_CTX=y
CONFIG_BT_HIDS_MAX_CLIENT_COUNT=1
CONFIG_BT_HIDS_INPUT_REP_MAX=1
CONFIG_BT_HIDS_OUTPUT_REP_MAX=1
CONFIG_BT_HIDS_DEFAULT_PERM_RW_ENCRYPT=y

CONFIG_BT_GATT_SERVICE_CHANGED=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

CONFIG_BT_DEVICE_APPEARANCE=961

name: omi-oss
# PROD CLOUD posture (ADR-0003/0046): the reference/cloud stack — Firestore + Pinecone + Firebase +
# GCS — instead of the self-hosted on-prem services. This is NOT the hermetic ADR-0001 proof: the
# backend needs EGRESS to reach the cloud providers, so the `omi` network stays non-internal (unlike
# compose.prod.yaml, which sets internal:true). compose.selfhost.yaml is deliberately NOT included, so
# no Mongo/datastore container is run; the reference backends come from backend.env.prod.cloud
# (STORAGE_BACKEND=firestore, VECTOR_STORE_BACKEND=pinecone, AUTH_BACKEND=firebase,
# OBJECT_STORE_BACKEND=gcs). Self-hosted extras (qdrant/rustfs/keycloak/ntfy/inference) are their own
# opt-in profiles and are irrelevant here. Firestore/GCS/Firebase need Google credentials — mount a
# service-account JSON and set GOOGLE_APPLICATION_CREDENTIALS in backend.env.prod.cloud.
#   docker compose -f compose.prod.cloud.yaml up -d
include:
  # Long form: the pins must reach the INCLUDED file, where the `image:` keys live (ADR-0055).
  - path: compose.base.yaml
    env_file:
      - omi.oss.release.pins
services:
  backend:
    env_file:
      - ./backend.env.base
      - ./backend.env.prod.cloud
    volumes:
      # The cloud posture authenticates to Firestore/GCS/Firebase with a Google service-account JSON.
      # backend.env.prod.cloud points GOOGLE_APPLICATION_CREDENTIALS at /secrets/gcp-sa.json; mount the
      # (gitignored) key there so Google ADC finds it — base has no /secrets volume (cubic PR 10887
      # backend.env.prod.cloud.example:21). Drop your SA key at ./secrets/gcp-sa.json before `up`.
      - ./secrets/gcp-sa.json:/secrets/gcp-sa.json:ro

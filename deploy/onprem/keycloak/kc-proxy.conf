# TLS-terminating reverse proxy for the on-prem Keycloak (ADR-0034/0038).
# The mobile OIDC client refuses non-loopback cleartext, so the issuer is served over HTTPS here
# while Keycloak itself runs http-only behind the proxy. The X-Forwarded-* headers (trusted by
# Keycloak via `--proxy-headers=xforwarded`) make it emit https issuer/redirect URLs.
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://keycloak:8090;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  8443;
    }
}

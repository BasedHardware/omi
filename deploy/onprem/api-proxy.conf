# TLS-terminating reverse proxy for the backend API. The mobile app sends the Bearer token to the
# API; over cleartext http that token is exposed on the wire, so the on-prem API is served over HTTPS
# here (same posture as the OIDC issuer). Set the app's API_BASE_URL to this proxy's https URL.
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100m;   # audio/media uploads

    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket support (/v4/listen, agent ws, ...)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}

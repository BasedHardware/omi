# On-prem LLM gateway route overrides (D32, ADR-0035).
# Mounted OVER backend/llm_gateway/config/generated_route_overrides.yaml so the cloud
# config stays untouched. Every chat/product feature is pinned to the SINGLE local model
# your OPENAI_BASE_URL (Ollama/vLLM) serves. Change `model:` below to your served model
# (its /v1/chat/completions name). provider stays `openai` (OpenAI-compatible wire).
generated_route_overrides:
  - feature: app_generator
    primary: {provider: openai, model: qwen2.5:14b}
  - feature: chat_agent
    primary: {provider: openai, model: qwen2.5:14b}
  - feature: chat_extraction
    primary: {provider: openai, model: qwen2.5:14b}

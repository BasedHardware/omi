# TLS-terminating reverse proxy for the ntfy push server (UnifiedPush). The ntfy Android distributor
# refuses a cleartext http server, so the on-prem push server is served over HTTPS here (same posture
# as the OIDC issuer / API). Point the ntfy app's default server at this proxy's https URL.
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://ntfy:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # ntfy uses a long-lived streaming connection for the UnifiedPush distributor.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

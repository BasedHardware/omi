# Omi self-host — WP0 baseline (offline, hermetic by construction).
#
# The `omi` network is `internal: true`: containers have NO route to the internet.
# This IS the proof of "zero external calls" (ADR-0001): the core boots and serves
# with no cloud, by construction. The build (which downloads liblc3, deps, the
# emulator jar) runs on the daemon network, not on this service network, so it works.
#
# Verify (no host port on an internal network -> test from inside):
#   docker compose up -d --build
#   docker compose exec backend curl -fsS http://localhost:8080/v1/health   # {"status":"ok"}
#   docker compose exec backend sh -c 'curl -m3 https://api.openai.com; echo exit=$?'  # must FAIL
#
# To curl from the host (accepts egress), add the override:
#   docker compose -f docker-compose.yml -f docker-compose.expose.override.yml up -d

name: omi-onprem

services:
  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [omi]
    restart: unless-stopped

  firestore-emulator:
    build:
      context: ../../
      dockerfile: deploy/onprem/firestore-emulator/Dockerfile
    healthcheck:
      # the Firestore emulator answers 200 on / once it is ready
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [omi]
    restart: unless-stopped

  # Alternate storage backend (ADR-0002/0004). Opt-in via the `mongo` profile so the default
  # on-prem baseline stays Firestore-only (ADR-0003). To use it:
  #   STORAGE_BACKEND=mongo + MONGO_URI in backend.env, then:
  #   docker compose --profile mongo up -d --build
  # Single-node replica set: transactions (used by the deletion/speech-sample paths) require one.
  mongo:
    image: mongo:latest
    profiles: ["mongo"]
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      # Initiate the one-member replica set on first probe, then report healthy once primary.
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { rs.status() } catch (e) {
          rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }
          db.hello().isWritablePrimary" | grep -q true
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [omi]
    restart: unless-stopped

  # Alternate object-store backend (ADR-0032/0004). Opt-in via the `objstore` profile so the default
  # on-prem baseline stays GCS-shaped (ADR-0003). RustFS is one S3-compatible product; the S3 adapter
  # is generic (MinIO/SeaweedFS/Ceph/AWS work the same by changing S3_ENDPOINT/credentials). To use it:
  #   OBJECT_STORE_BACKEND=s3 + S3_ENDPOINT=http://rustfs:9000 + S3_ACCESS_KEY/S3_SECRET_KEY in backend.env,
  #   then: docker compose --profile objstore up -d --build
  # Buckets are provisioning (ADR-0032 §5): create them out-of-band before first use.
  rustfs:
    image: rustfs/rustfs:latest
    profiles: ["objstore"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
    healthcheck:
      # curl (no -f): any HTTP reply, incl. the 403 S3 AccessDenied, means the S3 API is serving.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:9000/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks: [omi]
    restart: unless-stopped

  backend:
    build:
      context: ../../
      dockerfile: backend/Dockerfile
      args:
        # override the repo's PRIVATE base image with a public one (see SELFHOST_NOTES, Risks)
        PYTHON_BASE_IMAGE: python:3.11-slim
    env_file:
      - ./backend.env
    # create the temp dirs used at runtime (main.py does not create them), then start uvicorn
    command:
      - sh
      - -c
      - mkdir -p _temp _samples _segments _speech_profiles && exec uvicorn main:app --host 0.0.0.0 --port 8080 --loop uvloop
    depends_on:
      valkey:
        condition: service_healthy
      firestore-emulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [omi]
    restart: unless-stopped

networks:
  omi:
    driver: bridge
    internal: true

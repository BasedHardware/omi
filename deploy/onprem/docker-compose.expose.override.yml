# Optional override: exposes the backend to the host for manual curls.
# Makes the network NON-internal (so containers regain egress to the internet):
# use it only for dev convenience, NOT for the hermeticity proof.
#
#   docker compose -f docker-compose.yml -f docker-compose.expose.override.yml up -d --build
#   curl -fsS http://localhost:8000/v1/health

services:
  backend:
    ports:
      - "8000:8080"

networks:
  omi:
    internal: false

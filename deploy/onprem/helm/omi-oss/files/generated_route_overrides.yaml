# On-prem LLM gateway route overrides (D32, ADR-0035).
# Mounted OVER backend/llm_gateway/config/generated_route_overrides.yaml so the cloud
# config stays untouched. Every chat/product feature is pinned to the SINGLE local model
# your OPENAI_BASE_URL (Ollama/vLLM) serves. Change `model:` below to your served model
# (its /v1/chat/completions name). provider stays `openai` (OpenAI-compatible wire).
#
# COVERAGE IS THE POINT (ADR-0067). The gateway synthesises a lane for EVERY configured feature, and a
# feature with no entry here keeps its **cloud** model/provider from the QoS table — so an omission is not
# "unconfigured", it is a live route to a vendor through our own gateway. Measured before this file was
# completed: 8 of 45 configured features were uncovered (6 -> gemini, 1 -> perplexity, 1 -> openrouter),
# `translation` among them, and they answered 503 invalid_config only because no credentials for those
# providers exist here. check_oss_llm_gateway_route_coverage.py now ratchets this file against the
# configured-feature set — which is the right base: comparing it against upstream's own override file
# (37 entries) reported "37/37 covered" while eight lanes were open.
#
# `web_search` is the ONE deliberate omission: it is Perplexity-only, i.e. a search PRODUCT, not an LLM
# lane. Pinning it to a local chat model would return invented "Web Search Results" complete with a
# "Sources:" section. Its caller fails soft on a non-200 ("Web search is temporarily unavailable"), which is
# the honest on-prem answer. The guard's baseline records that decision instead of hiding it.
generated_route_overrides:
  - feature: app_generator
    primary: {provider: openai, model: qwen2.5:14b}
  - feature: app_integration
    primary: {provider: openai, model: qwen2.5:14b}
  - feature: chat_agent
    primary: {provider: openai, model: qwen2.5:14b}
  - feature: chat_extraction
    primary: {provider: openai, model: qwen2.5:14b}

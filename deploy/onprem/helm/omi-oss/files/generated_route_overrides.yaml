    primary: {provider: openai, model: qwen2.5:14b}
  - feature: chat_responses
    primary: {provider: openai, model: qwen2.5:14b}
  - feature: conv_action_items
    primary: {provider: openai, model: qwen2.5:14b}
  - feature: conv_app_result
    primary: {provider: openai, model: qwen2.5:14b}
  - feature: conv_app_select
    primary: {provider: openai, model: qwen2.5:14b}
  - feature: conv_discard

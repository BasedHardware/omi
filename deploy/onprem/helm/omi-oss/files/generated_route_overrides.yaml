  # Arrived with upstream (wake-word adjudication for conversation capture). Upstream routes it to a
  # cloud model with `reasoning_effort: high`; the option is dropped here because the local
  # OpenAI-compatible servers do not take it, and an unpinned lane would have kept the CLOUD route.
  - feature: wake_word_adjudication
    primary: {provider: openai, model: qwen2.5:14b}
  - feature: what_matters_now
    primary: {provider: openai, model: qwen2.5:14b}

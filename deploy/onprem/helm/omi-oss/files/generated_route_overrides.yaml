  # Chat with an attached file, split by kind. `file_chat_vision` sends the IMAGE itself — same
  # multimodal shape as screen_frame_judge — so the single served model must be vision-capable;
  # `file_chat_documents` sends extracted text. Both arrived with upstream's +192 and default to
  # gpt-5.6-luna/openai in the QoS table, which is a live vendor lane through our own gateway: a
  # user's attachment would leave the box. Pinned like every other feature.
  - feature: file_chat_documents
    primary: {provider: openai, model: qwen3-vl:8b-instruct}
  - feature: file_chat_vision
    primary: {provider: openai, model: qwen3-vl:8b-instruct}
  - feature: fair_use
    primary: {provider: openai, model: qwen3-vl:8b-instruct}
  - feature: followup
    primary: {provider: openai, model: qwen3-vl:8b-instruct}
  - feature: goals
    primary: {provider: openai, model: qwen3-vl:8b-instruct}
  - feature: goals_advice
    primary: {provider: openai, model: qwen3-vl:8b-instruct}
  - feature: knowledge_graph
    primary: {provider: openai, model: qwen3-vl:8b-instruct}
  - feature: learnings
    primary: {provider: openai, model: qwen3-vl:8b-instruct}
  - feature: memories
    primary: {provider: openai, model: qwen3-vl:8b-instruct}
  - feature: memory_category
    primary: {provider: openai, model: qwen3-vl:8b-instruct}
  - feature: memory_conflict
    primary: {provider: openai, model: qwen3-vl:8b-instruct}
  # The three *_flex features are long-running extraction calls: the cloud config sets request_timeout_ms:
  # 900000 (config_loader defaults would otherwise cap them at 30s non-streaming / 120s streaming). On a
  # locally served model they run at least as long, so preserve the explicit 900s timeout (cubic 10887).
  - feature: memory_conflict_flex
    primary: {provider: openai, model: qwen3-vl:8b-instruct}
    request_timeout_ms: 900000
  - feature: memory_l2_flex
    primary: {provider: openai, model: qwen3-vl:8b-instruct}
    request_timeout_ms: 900000
  - feature: onboarding
    primary: {provider: openai, model: qwen3-vl:8b-instruct}
  - feature: screen_frame_judge
    primary: {provider: openai, model: qwen3-vl:8b-instruct}
  - feature: session_titles
    primary: {provider: openai, model: qwen3-vl:8b-instruct}
  - feature: translation
    primary: {provider: openai, model: qwen3-vl:8b-instruct}
  - feature: trends
    primary: {provider: openai, model: qwen3-vl:8b-instruct}
  - feature: wrapped_analysis

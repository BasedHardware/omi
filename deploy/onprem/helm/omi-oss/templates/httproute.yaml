{{- if and .Values.ingress.enabled (eq .Values.ingress.type "gateway") }}
# Route the edge to the backend API. Hostname-agnostic for now (the auth/TLS phase adds hostnames +
# HTTPS listeners for the app API, the Keycloak issuer, and ntfy).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: omi-backend
  labels:
    {{- include "omi-oss.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: omi-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: backend
          port: {{ .Values.backend.service.port }}
{{- if .Values.auth.enabled }}
---
# Keycloak issuer + endpoints. More specific prefixes than the backend's "/" so they win by Gateway API
# path-precedence; attaches to every listener (incl. HTTPS), so the issuer https://<host>/realms/omi works.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  labels:
    {{- include "omi-oss.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: omi-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /realms
        - path:
            type: PathPrefix
            value: /resources
        - path:
            type: PathPrefix
            value: /admin
      backendRefs:
        - name: keycloak
          port: 8090
{{- end }}
{{- end }}

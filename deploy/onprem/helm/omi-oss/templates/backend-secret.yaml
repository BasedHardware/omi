{{- if .Values.secrets.create }}
# The chart-managed Secret (dev). In prod set `secrets.create: false` and provide a Secret named
# `backend-secret` out-of-band (External Secrets Operator / Sealed Secrets / a vault) with the same keys
# the enabled profiles need (ENCRYPTION_SECRET, and per-profile S3_*/KC_ADMIN_PASSWORD/OPENAI_API_KEY/
# OMI_EMBEDDINGS_API_KEY) — every Deployment/StatefulSet references it by name, so nothing else changes.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  labels:
    {{- include "omi-oss.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  # Required. Dev overlay sets a throwaway value; prod injects a real secret (or an external SecretRef).
  ENCRYPTION_SECRET: {{ required "backend.encryptionSecret is required (set it in values-<env>.yaml or --set)" .Values.backend.encryptionSecret | quote }}
  {{- if .Values.objstore.enabled }}
  # S3 credentials shared by the RustFS server, the bucket-init Job, and the backend client (one value).
  S3_ACCESS_KEY: {{ required "objstore.accessKey is required when objstore.enabled" .Values.objstore.accessKey | quote }}
  S3_SECRET_KEY: {{ required "objstore.secretKey is required when objstore.enabled" .Values.objstore.secretKey | quote }}
  {{- end }}
  {{- if .Values.auth.enabled }}
  # Keycloak bootstrap admin password (used by the keycloak StatefulSet, not the backend).
  KC_ADMIN_PASSWORD: {{ required "auth.adminPassword is required when auth.enabled" .Values.auth.adminPassword | quote }}
  {{- if eq .Values.auth.keycloak.db "postgres" }}
  # Postgres password shared by keycloak-postgres and Keycloak's KC_DB_PASSWORD (B5).
  KC_DB_PASSWORD: {{ required "auth.keycloak.postgres.password is required when db=postgres" .Values.auth.keycloak.postgres.password | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.inference.enabled }}
  # API keys for the external OpenAI-compatible endpoint(s) (inference profile).
  {{- with .Values.inference.openai.apiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.inference.embeddings.apiKey }}
  OMI_EMBEDDINGS_API_KEY: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}

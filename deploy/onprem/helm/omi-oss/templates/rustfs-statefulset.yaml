{{- if .Values.objstore.enabled }}
# Self-hosted S3 object store (ADR-0032), the on-prem alternative to GCS. Opt-in via the `objstore`
# profile (compose parity). Credentials come from backend-secret (S3_ACCESS_KEY/S3_SECRET_KEY) so the
# server and the backend client always share one value. Buckets are provisioned by rustfs-buckets-init.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
  labels:
    {{- include "omi-oss.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
spec:
  serviceName: rustfs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: rustfs
  template:
    metadata:
      labels:
        {{- include "omi-oss.labels" . | nindent 8 }}
        app.kubernetes.io/component: rustfs
    spec:
      containers:
        - name: rustfs
          image: {{ .Values.objstore.rustfs.image }}
          imagePullPolicy: {{ .Values.objstore.rustfs.imagePullPolicy }}
          env:
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: S3_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: S3_SECRET_KEY
          ports:
            - name: s3
              containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /data
          # RustFS answers the S3 API with 403 (AccessDenied) on an unauthenticated GET /, which an
          # httpGet probe would treat as failure — so gate readiness on the port being open (the
          # bucket-init Job + backend client retry the actual S3 calls).
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 15
            periodSeconds: 15
          {{- with .Values.objstore.rustfs.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.objstore.rustfs.storage }}
{{- end }}

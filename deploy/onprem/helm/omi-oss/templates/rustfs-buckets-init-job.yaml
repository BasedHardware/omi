{{- if .Values.objstore.enabled }}
# Provision the S3 buckets the backend uses (ADR-0032 §5: buckets are created out-of-band, not by the
# app). Idempotent (`mc mb --ignore-existing`); a regular resource so `helm install --wait` waits for it
# alongside rustfs. Named per revision + ttl (same rationale as mongo-rs-init) so upgrades create a fresh
# Job instead of patching this immutable one. A minio/mc client speaks S3 to RustFS.
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-buckets-init-r{{ .Release.Revision }}
  labels:
    {{- include "omi-oss.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs-buckets-init
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 20
  template:
    metadata:
      labels:
        {{- include "omi-oss.labels" . | nindent 8 }}
        app.kubernetes.io/component: rustfs-buckets-init
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: OnFailure
      containers:
        - name: init
          image: {{ .Values.objstore.mcImage }}
          imagePullPolicy: {{ .Values.objstore.rustfs.imagePullPolicy }}
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: S3_SECRET_KEY
          command:
            - sh
            - -c
            - |
              set -eu
              echo "waiting for the S3 endpoint to accept credentials..."
              until mc alias set rustfs http://rustfs:9000 "$S3_ACCESS_KEY" "$S3_SECRET_KEY" >/dev/null 2>&1; do
                sleep 3
              done
              for b in {{ range $k, $v := .Values.objstore.buckets }}{{ $v }} {{ end }}; do
                mc mb --ignore-existing "rustfs/$b"
              done
              # Anonymous read on the MARKETPLACE ASSET buckets only (ADR-0087). RustFS does not honour a
              # per-object ACL — measured: an object uploaded with public-read answers 403 to an anonymous
              # GET — so a bucket policy is the only mechanism that works. It is applied HERE and only
              # here, to logos and thumbnails: those are public by definition. The buckets holding user
              # audio deliberately get NO policy; their URLs are signed and time-limited instead, because
              # "make public_url work" on a recording would create the exposure rather than close it.
              for b in {{ .Values.objstore.buckets.PLUGINS_LOGOS }} {{ .Values.objstore.buckets.APP_THUMBNAILS }}; do
                mc anonymous set download "rustfs/$b"
              done
              echo "buckets provisioned (anonymous read on the marketplace asset buckets only)."
{{- end }}

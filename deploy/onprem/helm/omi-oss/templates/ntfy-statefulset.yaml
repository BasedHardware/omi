{{- if .Values.push.enabled }}
# Self-hosted UnifiedPush server (ADR-0011/ADR-0041), the on-prem push channel instead of FCM. Opt-in
# via the `push` profile. ntfy stays internal — the backend POSTs to it via UNIFIEDPUSH_INTERNAL_BASE_URL
# (http://ntfy:80). The device-facing TLS proxy + host base-url land with the ingress phase (Gateway API).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ntfy
  labels:
    {{- include "omi-oss.labels" . | nindent 4 }}
    app.kubernetes.io/component: ntfy
spec:
  serviceName: ntfy
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: ntfy
  template:
    metadata:
      labels:
        {{- include "omi-oss.labels" . | nindent 8 }}
        app.kubernetes.io/component: ntfy
    spec:
      containers:
        - name: ntfy
          image: {{ .Values.push.ntfy.image }}
          imagePullPolicy: {{ .Values.push.ntfy.imagePullPolicy }}
          # args (not command): the image ENTRYPOINT is `ntfy`; "serve" is its subcommand. Using
          # `command` would replace the entrypoint and fail with `exec: "serve" not found`.
          args: ["serve"]
          env:
            - name: NTFY_LISTEN_HTTP
              value: ":80"
            # Public URL the phone's distributor uses — set to the real device-facing host once the
            # ingress/TLS proxy exists; internal-only for the core validation.
            - name: NTFY_BASE_URL
              value: {{ .Values.push.baseUrl | quote }}
            # Durable message cache (SQLite on the PVC): survives restarts so an unfetched notification
            # is not lost (same reason as compose).
            - name: NTFY_CACHE_FILE
              value: /var/cache/ntfy/cache.db
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: cache
              mountPath: /var/cache/ntfy
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          {{- with .Values.push.ntfy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: cache
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.push.ntfy.storage }}
{{- end }}

# NVIDIA device plugin for k0s WITH GPU time-slicing, so several inference pods share one physical GPU
# (a plain install advertises nvidia.com/gpu=1 = one exclusive pod; on a single-GPU node that means only
# ONE of whisper/diarizer/nllb could schedule). `replicas: 4` advertises nvidia.com/gpu=4 — four pods may
# request 1 unit each and share the card by time-slicing. Raise/lower to match how many GPU services you
# run at once and how much VRAM they need together (whisper int8 ~1.5G + nllb ~1G + diarizer ~1-2G fit in
# 16G). Prereq: the NVIDIA container runtime is the containerd default (see /etc/k0s/containerd.d/nvidia.toml).
#
# Apply:  kubectl apply -f nvidia-device-plugin-k0s.yaml
# Verify: kubectl get node <node> -o jsonpath='{.status.allocatable.nvidia\.com/gpu}'   # -> 4
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-device-plugin-config
  namespace: kube-system
data:
  config.yaml: |
    version: v1
    sharing:
      timeSlicing:
        resources:
          - name: nvidia.com/gpu
            replicas: 4
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      priorityClassName: system-node-critical
      containers:
        - name: nvidia-device-plugin-ctr
          image: nvcr.io/nvidia/k8s-device-plugin:v0.18.2
          args:
            - --config-file=/etc/nvidia/config.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: config
              mountPath: /etc/nvidia
      volumes:
        - name: device-plugin
          hostPath: { path: /var/lib/kubelet/device-plugins, type: Directory }
        - name: config
          configMap: { name: nvidia-device-plugin-config }

apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-health
  labels:
    {{- include "omi-onprem.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: health
      image: curlimages/curl:8.10.1
      # /v1/health is unauthenticated even with auth on; hit the backend Service directly (internal HTTP).
      command:
        - sh
        - -c
        - curl -fsS --max-time 10 http://backend:8080/v1/health | grep -q '"status":"ok"'

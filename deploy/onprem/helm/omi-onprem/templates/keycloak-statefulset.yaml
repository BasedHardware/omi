{{- if .Values.auth.enabled }}
# Keycloak (OIDC issuer, ADR-0034). HTTP-only internally (:8090); the Gateway terminates TLS and is the
# public HTTPS issuer (KC_HOSTNAME). --hostname-backchannel-dynamic=false makes the discovery doc's
# backchannel endpoints use KC_HOSTNAME too. The backend does NOT use the discovery doc — it validates
# iss == OIDC_ISSUER (the public URL) and fetches keys from OIDC_JWKS_URL (internal keycloak:8090),
# which decouples the issuer string from the jwks fetch (no edge hairpin from inside the cluster).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  labels:
    {{- include "omi-onprem.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  serviceName: keycloak
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: keycloak
  template:
    metadata:
      labels:
        {{- include "omi-onprem.labels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak
    spec:
      containers:
        - name: keycloak
          image: {{ .Values.auth.keycloak.image }}
          imagePullPolicy: {{ .Values.auth.keycloak.imagePullPolicy }}
          args:
            - start
            - --db=dev-file
            - --http-enabled=true
            - --http-port=8090
            - --proxy-headers=xforwarded
            - --hostname={{ .Values.auth.hostname }}
            - --hostname-backchannel-dynamic=false
            - --import-realm
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.auth.adminUser | quote }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: KC_ADMIN_PASSWORD
          ports:
            - name: http
              containerPort: 8090
          volumeMounts:
            - name: data
              mountPath: /opt/keycloak/data
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          # Ready once the realm is served. Import + boot is slow, so gate behind a generous startup probe.
          startupProbe:
            httpGet:
              path: /realms/omi
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /realms/omi
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          {{- with .Values.auth.keycloak.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.auth.keycloak.storage }}
{{- end }}

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  labels:
    {{- include "omi-onprem.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  serviceName: valkey
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: valkey
  template:
    metadata:
      labels:
        {{- include "omi-onprem.labels" . | nindent 8 }}
        app.kubernetes.io/component: valkey
    spec:
      containers:
        - name: valkey
          image: {{ .Values.valkey.image }}
          imagePullPolicy: {{ .Values.valkey.imagePullPolicy }}
          # AOF persistence + a PVC: durable app state (username ownership / webhook / subscription),
          # not pure cache — same as compose.base.yaml.
          command: ["valkey-server", "--appendonly", "yes", "--dir", "/data"]
          ports:
            - name: valkey
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          {{- with .Values.valkey.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.valkey.storage }}

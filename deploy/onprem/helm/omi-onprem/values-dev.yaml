# Dev overlay (Kind). Use with:
#   helm install omi ./omi-onprem -n omi-dev --create-namespace -f omi-onprem/values-dev.yaml
# All images are `kind load`-ed, so imagePullPolicy stays Never (no registry, no egress from the node).

backend:
  encryptionSecret: "dev-encryption-secret-not-for-production-32c"
  env:
    # Real OIDC auth (auth profile is on below), so NO dev-auth bypass — the backend validates real
    # Keycloak tokens. Set "true" only for an auth-off stack to accept "Bearer dev".
    LOCAL_DEVELOPMENT: "false"

# chat profile: bring up the on-prem vector store (Qdrant). Full RAG also needs an embeddings endpoint
# (external, ADR-0035) + the LLM gateway; here we validate the Qdrant vector-store path itself.
chat:
  enabled: true

# objstore profile: on-prem S3 object store (RustFS) + bucket provisioning. Throwaway dev credentials.
objstore:
  enabled: true
  accessKey: "rustfsadmin"
  secretKey: "rustfsadmin"

# push profile: on-prem UnifiedPush server (ntfy). Reached internally by the backend at http://ntfy:80.
push:
  enabled: true

# edge: Gateway API via Envoy Gateway (prerequisite installed separately). The proxy is a NodePort on
# 30080 -> host 8080 (kind-cluster.yaml), so `curl http://localhost:8080/v1/health` reaches the backend.
# With auth on, the HTTPS listener is on 30443 -> host 8443 (the OIDC issuer).
ingress:
  enabled: true

# auth profile: Keycloak OIDC issuer. Requires the omi-tls Secret (run gen-certs.sh first) for the
# Gateway HTTPS listener. Throwaway dev admin password.
auth:
  enabled: true
  adminPassword: "admin"

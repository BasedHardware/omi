apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  {{- if .Values.intake.enabled }}
  annotations:
    iam.gke.io/gcp-service-account: {{ required "intake.firestoreServiceAccount is required" (trim .Values.intake.firestoreServiceAccount) | quote }}
  {{- end }}
automountServiceAccountToken: false

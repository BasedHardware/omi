{{- if not (kindIs "bool" .Values.intake.enabled) }}
{{- fail "intake.enabled: expected a boolean" }}
{{- end }}
{{- if .Values.intake.enabled }}
{{- $hostname := required "intake.hostname is required" .Values.intake.hostname }}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$" $hostname) }}
{{- fail "intake.hostname must be an exact DNS hostname" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-intake
spec:
  type: ClusterIP
  selector:
    {{- include "workerd.labels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: health
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ .Release.Name }}-intake
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_FIXED_PORT
        port: 8080
        requestPath: /ready
  targetRef:
    group: ""
    kind: Service
    name: {{ .Release.Name }}-intake
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}-intake
spec:
  gatewayClassName: gke-l7-rilb
  addresses:
    - type: NamedAddress
      value: {{ required "intake.addressName is required" .Values.intake.addressName | quote }}
  listeners:
    - name: https
      hostname: {{ $hostname | quote }}
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ required "intake.tlsSecretName is required" .Values.intake.tlsSecretName | quote }}
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-intake
spec:
  hostnames:
    - {{ $hostname | quote }}
  parentRefs:
    - name: {{ .Release.Name }}-intake
      sectionName: https
  rules:
    - matches:
        - path:
            type: Exact
            value: /internal/finalization/episode-intake
      backendRefs:
        - name: {{ .Release.Name }}-intake
          port: 8080
{{- end }}

# Lint contract for backend-go. Every rule here exists to keep a property that agents
# cannot hold in memory between sessions; docs/patterns.md says which rule guards what.
# Suppressions are not available: `//nolint` is rejected by tools/archcheck.
version: "2"
run:
  timeout: 10m
  tests: true
formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/BasedHardware/omi/backend-go]
linters:
  default: none
  enable:
    # correctness
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - contextcheck
    - containedctx
    - copyloopvar
    - durationcheck
    - errorlint
    - errname
    - fatcontext
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - reassign
    - recvcheck
    - rowserrcheck
    - sqlclosecheck
    - musttag
    - gosec
    - unqueryvet
    # closed types
    - exhaustive
    - gochecksumtype
    # explicit side effects
    - depguard
    - forbidigo
    - gochecknoglobals
    - gochecknoinits
    # size and shape
    - cyclop
    - funlen
    - gocognit
    - nestif
    - interfacebloat
    - nakedret
    - lll
    # hygiene
    - gocritic
    - misspell
    - modernize
    - nolintlint
    - predeclared
    - revive
    - thelper
    - tparallel
    - unparam
    - usestdlibvars
  settings:
    exhaustive:
      check: [switch, mapliteral, typeswitch]
      default-signifies-exhaustive: false
    govet:
      enable-all: true
      disable: [fieldalignment]
    errcheck:
      check-type-assertions: true
      check-blank: true
    funlen:
      lines: 70
      statements: 45
    cyclop:
      max-complexity: 14
    gocognit:
      min-complexity: 20
    nestif:
      min-complexity: 5
    interfacebloat:
      max: 6
    lll:
      line-length: 130
    revive:
      rules:
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T"
        - name: exported
        - name: package-comments
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: receiver-naming
        - name: var-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: superfluous-else
        - name: unused-parameter
        - name: blank-imports
        - name: dot-imports
        - name: increment-decrement
        - name: range
        - name: time-naming
        - name: errorf
        - name: empty-block
        - name: redefines-builtin-id
    nolintlint:
      require-explanation: true
      require-specific: true
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^time\.(Now|Since|Until|After|Sleep|Tick|NewTimer|NewTicker|AfterFunc)$
          msg: "take a clock.Clock; only internal/platform/clock and cmd may read the wall clock"
        - pattern: ^os\.(Getenv|LookupEnv|Environ|Setenv|Exit)$
          msg: "configuration is read once in cmd/*/config.go and passed in as a typed value"
        - pattern: ^(fmt\.Print.*|print|println)$
          msg: "use the injected *slog.Logger"
        - pattern: ^log\.
          msg: "use the injected *slog.Logger"
        - pattern: ^http\.(DefaultClient|DefaultTransport|Get|Post|Head|PostForm)$
          msg: "use the injected client so timeouts, retries and faults are typed"
        - pattern: ^context\.(Background|TODO)$
          msg: "accept a context from the caller; only cmd and tests create a root context"
        - pattern: ^panic$
          msg: "return an error; a panic crosses function boundaries invisibly"
    depguard:
      rules:
        banned-everywhere:
          deny:
            - pkg: database/sql
              desc: "use pgx directly with plain SQL and typed rows"
            - pkg: gorm.io
              desc: "no ORM: plain SQL with typed rows"
            - pkg: entgo.io
              desc: "no ORM: plain SQL with typed rows"
            - pkg: github.com/uptrace/bun
              desc: "no ORM: plain SQL with typed rows"
            - pkg: github.com/jmoiron/sqlx
              desc: "use pgx directly with plain SQL and typed rows"
            - pkg: log$
              desc: "use log/slog through the injected logger"
            - pkg: io/ioutil
              desc: "deprecated: use io and os"
            - pkg: math/rand$
              desc: "use math/rand/v2 for jitter or crypto/rand for identifiers"
            - pkg: unsafe
              desc: "no unsafe"
            - pkg: reflect
              desc: "reflection hides control flow; write the types out"
            - pkg: github.com/stretchr/testify
              desc: "use the standard testing package and pgregory.net/rapid"
        queue-is-generic:
          files: ["**/internal/queue/**", "!$test"]
          deny:
            - pkg: github.com/BasedHardware/omi/backend-go/internal/batchunit
              desc: "the queue knows no job kind; a kind depends on the queue, never the reverse"
            - pkg: github.com/BasedHardware/omi/backend-go/internal/conformance
              desc: "the queue knows no job kind or adapter"
            - pkg: github.com/BasedHardware/omi/backend-go/cmd
              desc: "packages never import a binary"
        platform-is-a-leaf:
          files: ["**/internal/platform/**"]
          deny:
            - pkg: github.com/BasedHardware/omi/backend-go/internal/queue
              desc: "platform packages are leaves: they import nothing from this module but each other"
            - pkg: github.com/BasedHardware/omi/backend-go/internal/batchunit
              desc: "platform packages are leaves"
            - pkg: github.com/BasedHardware/omi/backend-go/internal/conformance
              desc: "platform packages are leaves"
        kinds-declare-ports:
          files: ["**/internal/batchunit/**"]
          deny:
            - pkg: github.com/BasedHardware/omi/backend-go/internal/conformance
              desc: "a kind declares the ports it needs; the binary passes the adapter in"
            - pkg: github.com/BasedHardware/omi/backend-go/internal/platform/httpx
              desc: "a kind calls out through a port, not an HTTP client"
            - pkg: net/http
              desc: "a kind calls out through a port, not an HTTP client"
        rules-are-pure:
          files: ["**/rules/**", "!$test"]
          deny:
            - pkg: net
              desc: "rules packages decide; they do no I/O. Do the I/O in the caller and pass the result in"
            - pkg: os
              desc: "rules packages decide; they do no I/O"
            - pkg: io
              desc: "rules packages decide; they do no I/O"
            - pkg: context
              desc: "a pure decision needs no context; if it does, it is doing I/O"
            - pkg: sync
              desc: "rules packages hold no shared state"
            - pkg: log/slog
              desc: "rules packages return values; the caller logs"
            - pkg: github.com/jackc/pgx
              desc: "rules packages decide; they do no I/O"
            - pkg: github.com/BasedHardware/omi/backend-go/internal/platform/wire
              desc: "rules packages decide; they do no I/O"
            - pkg: github.com/BasedHardware/omi/backend-go/internal/platform/clock
              desc: "pass the current time in as a value"
  exclusions:
    rules:
      - path: _test\.go
        linters: [funlen, gocognit, cyclop, gochecknoglobals, lll, gosec, containedctx, nestif]
      - path: _test\.go
        text: "context\\.(Background|TODO)|time\\.(Now|Since|Until|After|Sleep|NewTimer|NewTicker)|os\\.(Getenv|LookupEnv)"
        linters: [forbidigo]
      # Binaries and tools are where the environment is read and the process ends.
      - path: (^|/)(cmd|tools)/
        linters: [forbidigo, gochecknoglobals]
      # archcheck reads the tree it is pointed at; that is its job.
      - path: (^|/)tools/
        linters: [gosec]
      - path: internal/platform/clock/
        linters: [forbidigo]
      # The conformance port keeps the correctness linters and drops the shape and
      # documentation ones: it is replaced by the real family, not grown. See README.md.
      - path: (^|/)(internal/conformance|cmd/jobd)/
        linters: [funlen, gocognit, cyclop, nestif, lll, revive, containedctx, errname, gocritic, unparam]
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

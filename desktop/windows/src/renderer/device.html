<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>omi</title>
    <!-- Slim entry for the hidden device window (#/device). Same <head> (incl.
         CSP) as capture.html so socket/auth behavior is identical, but it loads
         deviceEntry.tsx — only the wearable host tree (WebBluetooth transport,
         BLE audio decode, listen lane). Chromium exposes navigator.bluetooth to
         a renderer only, which is why the device stack lives in a window at all.
         The decoder is WASM, so 'wasm-unsafe-eval' in the inherited CSP is
         load-bearing here. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https: https://*.googleusercontent.com;
        font-src 'self' data:;
        media-src 'self' blob:;
        connect-src 'self'
          https://identitytoolkit.googleapis.com
          https://securetoken.googleapis.com
          https://www.googleapis.com
          https://*.firebaseapp.com
          https://*.firebaseio.com
          https://firebase.googleapis.com
          https://api.omi.me
          wss://api.omi.me
          https://desktop-backend-hhibjajaja-uc.a.run.app
          https://api.openai.com
          wss://api.openai.com
          https://generativelanguage.googleapis.com
          wss://generativelanguage.googleapis.com
          https://api.deepgram.com
          wss://api.deepgram.com
          https://accounts.google.com
          https://us.i.posthog.com
          https://cdn.jsdelivr.net;
        frame-src 'self';
        worker-src 'self' blob:;
      "
    />
  </head>

  <body style="background: transparent">
    <div id="root" style="background: transparent"></div>
    <script type="module" src="/src/deviceEntry.tsx"></script>
  </body>
</html>

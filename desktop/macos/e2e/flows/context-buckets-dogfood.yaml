version: 2
name: context-buckets-dogfood
tier: manual
description: >
  Flag-on dogfood of the real context-bucket lifecycle: context identity, visit rollup,
  privacy purge, unified director delivery, candidate graduation, and task resurfacing.
  Run it after the facade is deployed to the dev-beta backend with a normal signed-in
  dogfood account and a named non-production bundle. It does not seed eligibility or
  substitute model responses through the automation bridge, and it is not a CI gate.
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Assistants/Insight/InsightAssistant.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/JITAmbientPacingPolicy.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/JITDerivedWatchlist.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/ContextDwellRefreshPolicy.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/AsyncFirstResolved.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Assistants/TaskExtraction/ScreenCandidateAdapter.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Assistants/TaskExtraction/TaskDeduplicationService.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Assistants/TaskExtraction/TaskPrioritizationService.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/ProactiveAssistantsPlugin+RewindCapture.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/CandidateSink.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/ContextBucketRollup.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/ContextBucketSchema.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/ContextBucketStore.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/ContextWorkstreamPooling.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/ContextWorkstreamReconciler.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/ContextBucketsFeature.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/ContextDeliveryAuthority.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/ContextDestinationKey.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/ContextDetection.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/ContextDirectorRetrieval.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/ContextFactWritePolicy.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/JITProactivityCoordinator.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/JITProactivityDelivery.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/JITProactivityReservationClient.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/JITProactivityRuntime.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/JITTriggerFeedbackClient.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/JITTriggerMirror.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/KnowledgeLedgerMirrorSnapshot.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/ContextProactivityEngine.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/EnvironmentalSpeakerContext.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/ContextSubjectBindingService.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/ContextTitleNormalizer.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/ContextVisitCoordinator.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/WorkHistoryHandle.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/WorkHistoryHandleExtractor.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/WorkHistoryIndex.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/InsightSQLPrivacy.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Services/NotificationSettingsSyncCoordinator.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Services/TaskContextualResurfacingService.swift
  - desktop/macos/Desktop/Sources/Rewind/Core/RewindCaptureExclusion.swift
  - desktop/macos/Desktop/Sources/Rewind/Core/StagedTaskStorage.swift
  - desktop/macos/Desktop/Sources/Rewind/Services/RewindIndexer+CaptureExclusion.swift
preconditions:
  - signed_in_dogfood_account
  - context_buckets_feature_enabled
  - jit_proactivity_rollout_enabled
  - screen_recording_enabled
  - notifications_enabled

steps:
  - id: S1
    name: Create and revisit distinct numbered contexts
    do: >
      Open two documents in the same app whose titles differ only by a meaningful number
      (for example "Issue (123)" and "Issue (456)"). Spend at least ten seconds in each,
      switch to a third app between visits, then revisit both documents. Confirm the app
      remains responsive and the two documents do not share context-specific details.

  - id: S2
    name: Exercise rollup and the unified director
    do: >
      Work in one revisited context long enough to create a concrete, timely fact, then
      switch away and back. If the director chooses to notify, confirm the card describes
      that context, contains no text from the other numbered document, and is delivered at
      most once for the visit. Silence is valid when no fact is notification-worthy.

  - id: S3
    name: Exercise task binding and candidate graduation
    do: >
      In the same context, create or complete a task whose wording is visible on screen,
      then leave and revisit the context several times while the visible wording varies by
      a harmless paraphrase. Confirm the repeated observations reconcile to one Suggested
      candidate, while a distinct identifier produces a separate candidate. Any resurfaced
      task or graduated candidate must remain attributed to the same signed-in account and
      context. Queued or dismissed cards must not be recorded as delivered or graduate a
      candidate before presentation.

  - id: S4
    name: Verify excluded-app privacy
    do: >
      Add the current app to the excluded-app list, wait for purge to finish, and ask an
      Insight question that would otherwise retrieve its screen text. Confirm no excluded
      OCR text, image, video frame, frozen bucket narrative, or notification is returned.
      Remove the exclusion only after this check.

  - id: S5
    name: Verify account and sleep boundaries
    do: >
      Begin another context transition, then lock and unlock the Mac and sign out before a
      pending director result can present. Sign back in and confirm no notification, task
      binding, delivery, or candidate from the prior authorization session appears.

  - id: S6
    name: Ask chat for the document by handle
    do: >
      After revisiting one of the numbered documents from S1, ask chat where that document
      is. Confirm get_work_context returns a visit or workstream brief whose handle is the
      document URL or file path, not only a Rewind screenshot. Switching browsers on the
      same URL must stay one workstream.

  - id: S7
    name: Verify planned trigger wins over ambient proactivity
    do: >
      Create a standing trigger with a narrow condition and agent prompt through the supported
      memory path, then enter a context that satisfies it and also contains a novel actionable
      fact. Confirm exactly one proactive result is presented, it follows the planned prompt,
      and no ambient result appears for the same context version. Revisit without changing the
      context and confirm neither lane delivers again.

  - id: S8
    name: Verify bounded ambient fallback for an unplanned change
    do: >
      Enter a materially changed, locally novel context that matches no standing trigger and
      contains one clear next-action opportunity. Confirm at most one ambient result is presented;
      a task result must enter Suggested through the candidate sink. Repeat with only the words
      remember, history, before, or previously added and confirm those words alone do not change
      admission. Silence is valid when bounded triage rejects the candidate.

  - id: S9
    name: Logs are clean
    log.expect:
      absent:
        - "ContextBucketRollup:"
        - "ContextProactivityEngine:"
        - "ContextVisitCoordinator:"
        - "DesktopAutomationBridge: failed"

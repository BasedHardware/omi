version: 2
name: onboarding-flow
tier: manual
description: >
  Scenario onboarding: six beats (hello, see, card, talk, write, ready). Each permission is asked right
  before the payoff that needs it; the app opens two bundled pages in the default browser, fires a real
  notch card, runs the real push-to-talk demo, and writes a memory + task from the note the user sends.
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/Onboarding/OnboardingFlow.swift
  - desktop/macos/Desktop/Sources/Onboarding/OnboardingAnswerWriteGate.swift
  - desktop/macos/Desktop/Sources/Onboarding/OnboardingPromptSuggestions.swift
  - desktop/macos/Desktop/Sources/Onboarding/SecondBrain/SBOnboardingView.swift
  - desktop/macos/Desktop/Sources/Onboarding/SecondBrain/SBOnboardingModel.swift
  - desktop/macos/Desktop/Sources/Onboarding/SecondBrain/SBOnboardingModel+Steps.swift
  - desktop/macos/Desktop/Sources/Onboarding/SecondBrain/SBOnboardingModel+Scenario.swift
  - desktop/macos/Desktop/Sources/Onboarding/SecondBrain/SBOnboardingIntroGate.swift
  - desktop/macos/Desktop/Sources/Onboarding/SecondBrain/SBOnboardingPermissionRuntime.swift
  - desktop/macos/Desktop/Sources/Onboarding/SecondBrain/SBPostOnboardingGuidance.swift
  - desktop/macos/Desktop/Sources/Onboarding/SecondBrain/OnboardingOpenerComposer.swift
  - desktop/macos/Desktop/Sources/Onboarding/Scenario/OnboardingScenarioPages.swift
  - desktop/macos/Desktop/Sources/Onboarding/Scenario/OnboardingScenarioSeams.swift
  - desktop/macos/Desktop/Sources/Onboarding/Scenario/OnboardingScenarioWrites.swift
  - desktop/macos/Desktop/Sources/Onboarding/Scenario/OnboardingDemoNote.swift
  - desktop/macos/Desktop/Sources/Onboarding/Scenario/AnalyticsManager+OnboardingBeats.swift
  - desktop/macos/Desktop/Sources/MainWindow/OnboardingOpenerView.swift
  - desktop/macos/Desktop/Sources/Onboarding/Cinematic/OmiCinematicDirector.swift
  - desktop/macos/Desktop/Sources/Onboarding/Cinematic/OmiCinematicMark.swift
  - desktop/macos/Desktop/Sources/Onboarding/Cinematic/OmiCinematicSequence.swift
  - desktop/macos/Desktop/Sources/Onboarding/Cinematic/OmiCinematicWindowArt.swift
  - desktop/macos/Desktop/Sources/Onboarding/Cinematic/OmiCinematicWindows.swift
  - desktop/macos/Desktop/Sources/Onboarding/Cinematic/OmiOnboardingCinematic.swift
  - desktop/macos/Desktop/Sources/Onboarding/Cinematic/OmiOnboardingSound.swift
  - desktop/macos/Desktop/Sources/MainWindow/ActiveDisplay.swift
  - desktop/macos/Desktop/Sources/FloatingControlBar/FirstRunNotchCards.swift
  - desktop/macos/Desktop/Sources/AnalyticsManager.swift
preconditions:
  - automation_bridge_ready

steps:
  - id: S1
    name: Reset into onboarding
    do: "Run bridge action reset_onboarding, wait for the app to restart, then reconnect the automation bridge."
    expect:
      text_visible:
        - "What should I call you"

  - id: S2
    name: Hello
    do: "Type a name and continue. The next Omi line asks for Screen Recording and names the payoff (a page opens in your browser)."
    expect:
      text_visible:
        - "Screen Recording"

  - id: S3
    name: See — the permission answer does not leave Omi
    do: "Allow Screen Recording (or Skip for now). Nothing opens yet: Omi says what will happen in the browser and that it will bring you back, and offers one button."
    expect:
      text_visible:
        - "Open the order page"

  - id: S4
    name: See — the page opens on the click
    do: "Press 'Open the order page'. The default browser opens 'Omi Welcome · Order confirmed · Norrland Goods' with real dates and a cue line saying a card is on its way. Within a poll of the page becoming frontmost (or ~3 s timed fallback without Screen Recording) a persistent card is at the notch ('Aurora desk lamp' / return window)."
    expect:
      text_visible:
        - "Look up. The card is at the top of your screen."

  - id: S5
    name: Card — Remind me brings you back
    do: "Press Remind me on the notch card. Omi's window comes back to the front by itself with 'Remind me' in the thread, a TASK row that stays visible, a '✓ Reminder set' card at the notch, and the Notifications ask. If the card is left alone for 90 s it retracts and Omi still comes back, saying so."
    expect:
      text_visible:
        - "Notifications"

  - id: S6
    name: Talk — microphone, chord, push-to-talk
    do: "Answer the Notifications ask. Allow Microphone, pick a talk chord, then hold it and ask 'when does this arrive?'. Omi answers at the notch, grounded on the order page; Continue appears only after the answer."
    expect:
      text_visible:
        - "Continue"

  - id: S7
    name: Write — the note to Sam
    do: "Omi describes the drafted note and offers 'Open the note' and 'Skip for now'; nothing opens until the click. Press 'Open the note', then Send in the browser (edit the text first if you like). Omi's window comes back on its own with MEMORY and TASK rows from the note, then 'Looks right' / 'Fix something'. 'Open it again' and 'Skip for now' stay on screen the whole time the browser is up."
    expect:
      text_visible:
        - "Looks right"

  - id: S8
    name: Ready — capture choice ends onboarding
    do: "Choose Only Meetings or Always On. Onboarding completes, Home appears, and the first-run guide chip appears at the notch ('Open something you're working on')."
    expect:
      interactive_count: { min: 1 }

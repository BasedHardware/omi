version: 2
name: capture-client-refactor
tier: manual
description: Verify continuation uploads preserve speaker identity and long recording segments against a local fixture backend
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/AppState/AppState+ListenEvents.swift
  - desktop/macos/Desktop/Sources/CaptureRefactor/ClientRefactorFlags.swift
  - desktop/macos/Desktop/Sources/CaptureRefactor/LegacySegmentCompaction.swift
  - desktop/macos/Desktop/Sources/CaptureRefactor/SegmentContinuationUpload.swift
  - desktop/macos/Desktop/Sources/CaptureRefactor/TranscriptionStorage+SpeakerLabels.swift
preconditions:
  - auth_ready
  - backend_reachable
steps:
  - id: S1
    name: Configure an isolated client cohort
    do: "Use a named omi-* test bundle with a local fixture backend and synthetic account. Resolve clients_from_segments_chunks true for that test identity, and the fixture continuation mode serve. Run xcrun swift test --package-path Desktop --filter ClientCaptureRefactor as the hermetic prerequisite. Do not use production accounts or change a production cohort."
  - id: S2
    name: Preserve a local speaker assignment
    do: "Assign a speaker to a named person during a synthetic capture, then refresh the saved recording. Verify that the local assignment remains visible after refresh."
  - id: S4
    name: Retry a long recording without losing speakers
    do: "Finalize a synthetic local recording with 1201 alternating-speaker segments. Inspect fixture requests: chunk sizes 500, 500, 201, indices 0, 1, 2 and one client_session_id. Fail a chunk, retry, and verify one deterministic conversation with all segment timings and speaker identities. No MIXED compaction occurs. Switching accounts between chunks must stop the upload."
  - id: S6
    name: Prove rollback and fail-closed upload behavior
    do: "Resolve the chunk flag false or unreadable and repeat a short capture: legacy compaction behavior remains. With client chunking on and server continuation off, the fixture returns 409 and the local recording remains retryable. This catalogued manual flow is separate from the hermetic XCTest receipt; record a named-bundle run before expanding a real cohort."

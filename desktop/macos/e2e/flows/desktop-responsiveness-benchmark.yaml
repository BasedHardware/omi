  - id: S8
    name: Settings
    bridge.navigate:
      target: settings
      activateApp: false
      waitForVisibility: false
    wait:
      state.chatFirstRoute: more.settings
  - id: S8a
    name: Settings acknowledges input within 100 ms
    trace.expect:
      latest: true
      trace.path: /navigate
      trace.statusCode: 200
      trace.durationMs:
        max: 100

  - id: S9
    name: Return to Dashboard
    bridge.navigate:
      target: dashboard
      activateApp: false
      waitForVisibility: false
    wait:
      state.chatFirstRoute: more.dashboard
  - id: S9a
    name: Return to Dashboard acknowledges input within 100 ms
    trace.expect:
      latest: true
      trace.path: /navigate
      trace.statusCode: 200
      trace.durationMs:

version: 2
name: apps
tier: manual
description: Apps/Integrations marketplace flow — browse apps, filter by category, search, view app details
app: com.omi.computer-macos
covers:
  - desktop/macos/Desktop/Sources/Services/APIClient/APIClient+Apps.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/AppsPage.swift
  # S5b is the only place either of these is exercised where it can actually fail. `AppsPage`
  # presents its connector sheet with `.dismissableSheet`, which mounts a `ShellModalScrim`; Apps
  # rides on `PageGlassLane`'s panel, so the bounds it inherits are `.ownSurface` — the tightest
  # paint bound there is, and therefore the one with the most wallpaper left outside it to click.
  - desktop/macos/Desktop/Sources/MainWindow/Pages/DismissableSheet.swift
  - desktop/macos/Desktop/Sources/MainWindow/ShellModalScrim.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/AppsPageHeaderControls.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/Settings/Components/SearchableDropdown.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/ManualInstallationDisclosure.swift
  - desktop/macos/Desktop/Sources/ConferencingApps.swift
  - desktop/macos/Desktop/Sources/ConnectorBrandIcon.swift
preconditions:
  - auth_ready

steps:
  - id: S1
    name: Navigate to Apps page
    do: "Click the Apps pill in the top bar (accessibility identifier top-navigation-8; the sidebar this step used to name no longer exists). Verify the marketplace loads with app cards, search bar, category filter, and Installed/Create App buttons."
    expect:
      interactive_count: { min: 10 }
      text_visible:
        - Apps

  - id: S2
    name: Filter by category
    do: "Click the 'Category' menu button to open the category dropdown. Select a category (e.g., 'Productivity' or 'Memory') to filter the app list."
    expect:
      interactive_count: { min: 5 }

  - id: S3
    name: Search for an app
    do: "Click the search text field at the top of the Apps page. Type 'note' to search for note-taking apps. Verify the app list filters to matching results."
    expect:
      interactive_count: { min: 3 }

  - id: S4
    name: View Installed apps
    do: "Click the 'Installed' button to switch to the installed apps view. Verify the view shows currently installed/enabled integrations."
    expect:
      interactive_count: { min: 3 }

  - id: S5
    name: Return to all apps
    do: "Click 'All' or navigate back to the full app marketplace listing. Verify all app cards are visible again."
    expect:
      interactive_count: { min: 5 }

  - id: S5b
    name: Clicking bare wallpaper outside the panel dismisses the sheet
    # The assertion nothing hermetic can make, and the reason this step exists rather than a unit
    # test. `ShellModalScrim` splits a modal in two: an invisible barrier at the *host's* full size
    # that swallows clicks and carries the dismiss gesture, and a *painted* dim bounded to the
    # surface `PageGlassLane` published. Delete the barrier and a sheet still dismisses everywhere
    # the paint reaches, so only a click on wallpaper the dim never covers can prove it survived
    # being bounded. An `NSHostingView.hitTest` test cannot make it: the hosting view claims any
    # in-bounds point whether or not any content accepts it, so it passes with the barrier removed.
    do: "With the Apps page open, click a connector row (e.g. Gmail) so its import sheet is presented. Verify the dim is a rounded rectangle that stops at the Apps panel's own edges — the desktop around the panel must be undimmed, with no hard-edged dark rectangle stamped on it. Then click bare wallpaper well outside the panel: level with the sheet, beyond the panel's left or right edge, on a point that is visibly undimmed. The sheet must close."
    expect:
      interactive_count: { min: 3 }

  - id: S5c
    name: The dismiss came from the scrim's host-scale barrier
    # Names the item-based modifier specifically: the connector sheet is presented by
    # `.dismissableSheet(item:)`, and only its background tap logs this line.
    log.expect:
      contains:
        - "DISMISSABLE_SHEET: Background tapped, dismissing item"

  - id: S6
    name: Return to Home
    do: "Click the Home pill in the top bar (accessibility identifier top-navigation-0) to leave Apps. Verify the query surface loads with the top bar visible."
    expect:
      interactive_count: { min: 5 }
      text_visible:
        - Home

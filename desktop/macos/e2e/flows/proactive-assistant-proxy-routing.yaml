version: 2
name: proactive-assistant-proxy-routing
tier: 1
description: Proactive model clients resolve through the non-production desktop backend policy.
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/JITProactivityPolicy.swift
  - desktop/macos/Desktop/Sources/Chat/KnowledgeLedgerPromptProjection.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/GeminiClient.swift
  - desktop/macos/Desktop/Sources/Services/SubscriptionEntitlementService.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/KnowledgeLedgerTriggerObservationAdapters.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/KnowledgeLedgerTriggerProjection.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/KnowledgeLedgerTriggerRuntime.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/KnowledgeLedgerTriggerWatchlist.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/ProactiveLaneClient.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Services/EmbeddingService.swift
  - desktop/macos/Desktop/Sources/Rewind/Core/MemoryLedgerMetadata.swift
  - desktop/macos/Desktop/Sources/DesktopAutomationOpenOmiShortcutQA.swift
preconditions:
  - automation_bridge_ready

steps:
  - id: S1
    name: Resolve proactive-assistant proxy clients
    bridge.action:
      name: proactive_assistant_proxy_routes
    expect:
      result.detail.gemini_proxy_base_url: https://desktop-backend-dt5lrfkkoa-uc.a.run.app/
      result.detail.embedding_proxy_base_url: https://desktop-backend-dt5lrfkkoa-uc.a.run.app/
      result.detail.proactivity_base_url: https://desktop-backend-dt5lrfkkoa-uc.a.run.app/

  - id: S2
    name: Exercise pure knowledge-ledger foundation contracts
    bridge.action:
      name: knowledge_ledger_foundation_contracts
    expect:
      result.detail.prompt_contains_profile_fact: "true"
      result.detail.trigger_metadata_roundtrip: "true"
      result.detail.trigger_projection_count: "1"
      result.detail.trigger_projection_quarantine_count: "1"
      result.detail.trigger_runtime_status: evaluated
      result.detail.trigger_runtime_next_lane: planned_trigger
      result.detail.trigger_runtime_match_count: "1"
      result.detail.trigger_status: match
      result.detail.trigger_wakeups_used: "1"

  - id: S3
    name: Logs are clean
    log.expect:
      absent:
        - "DesktopAutomationBridge: failed"

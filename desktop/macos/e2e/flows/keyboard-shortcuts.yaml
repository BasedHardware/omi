version: 2
name: keyboard-shortcuts
tier: 2
description: Top-bar navigation via Cmd+1..4 and Cmd+, shortcut bridge actions
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/MainWindow/Components/FindCommandRouter.swift
  - desktop/macos/Desktop/Sources/OmiApp.swift
  - desktop/macos/Desktop/Sources/MainWindow/DesktopHomeView.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/ShortcutsSettingsSection.swift
preconditions:
  - automation_bridge_ready

steps:
  - id: S1
    name: Navigate Chat via Cmd+1 equivalent
    bridge.action:
      name: navigate_via_shortcut
      params:
        shortcut: "1"
    wait:
      state.chatFirstRoute: chat

  - id: S2
    name: Navigate Memories via Cmd+2 equivalent
    bridge.action:
      name: navigate_via_shortcut
      params:
        shortcut: "2"
    wait:
      state.chatFirstRoute: memories

  - id: S3
    name: Navigate Settings via Cmd+, equivalent
    bridge.action:
      name: navigate_via_shortcut
      params:
        shortcut: ","
    wait:
      state.chatFirstRoute: more.settings

  - id: S4
    name: Logs clean
    log.expect:
      absent:
        - "DesktopAutomationBridge: failed"

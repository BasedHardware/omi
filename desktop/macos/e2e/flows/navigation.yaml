version: 2
name: navigation
tier: manual
description: Top navigation bar smoke — the flat destination row (Home, Activity, Tasks, Rewind, Apps), Activity's navigating chip row into the hub's other three pages and the "‹ Activity" control back off each of them, the Settings gear and Rewind all reach their real pages with no menu and nothing opening on hover
app: com.omi.computer-macos
covers:
  - desktop/macos/Desktop/Sources/MainWindow/ShellClickThrough.swift
  - desktop/macos/Desktop/Sources/OmiApp.swift
  - desktop/macos/Desktop/Sources/Sound/OmiUISound.swift
  - desktop/macos/Desktop/Sources/MainWindow/SidebarView.swift
  - desktop/macos/Desktop/Sources/MainWindow/SidebarNavItem.swift
  - desktop/macos/Desktop/Sources/MainWindow/DesktopHomeView.swift
  - desktop/macos/Desktop/Sources/MainWindow/PageGlassLane.swift
  - desktop/macos/Desktop/Sources/MainWindow/QueryShell/ActivityDestinationChip.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/ConversationsDestinationView.swift
  - desktop/macos/Desktop/Sources/MainWindow/DesktopTopBar.swift
  - desktop/macos/Desktop/Sources/MainWindow/TopNavigationDestinations.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/ActivityBackButton.swift
  - desktop/macos/Desktop/Sources/MainWindow/ShellWindowChrome.swift
  - desktop/macos/Desktop/Sources/MainWindow/ShellSummon.swift
  - desktop/macos/Desktop/Sources/MainWindow/ActiveDisplay.swift
  - desktop/macos/Desktop/Sources/MainWindow/QueryShell/ShellStatusIcons.swift
  - desktop/macos/Desktop/Sources/MainWindow/QueryShell/OmiQueryDotMark.swift
  - desktop/macos/Desktop/Sources/MainWindow/EscapeKeyHandler.swift
  - desktop/macos/Desktop/Sources/MainWindow/SettingsSidebar.swift
preconditions:
  - auth_ready

steps:
  - id: S1
    name: Verify Home tab loads
    do: "Verify the app is on the search surface. The top bar shows the flat row of destinations — Home, Activity, Tasks, Rewind, Apps — with nothing that opens a menu and no Omi mark duplicated out of the query bar; the right cluster is three wordless icons with state dots (microphone, screen capture, settings). Home content is a query bar above a separate results panel."
    expect:
      interactive_count: { min: 8 }
      text_visible:
        - Home
        - Activity
        - Tasks
        - Rewind
        - Apps

  - id: S2
    name: Navigate to Activity and reach the hub's other three pages from its chip row
    do: >-
      Click the Activity button in the top nav bar (agent-swift find text 'Activity' click).
      Verify the Activity spine loads and that a single row of chips — Activity,
      Conversations, Memories, Brain Map — sits on the page itself, not in the top bar,
      with Activity shown as the current one. There is exactly one such row: no second
      row of look-alike chips underneath it that narrows the list in place. Click each of
      the other three in turn and confirm the page actually changes — the conversations
      list, the memories list, then the Brain Map — and that each of those pages carries
      a "‹ Activity" control on its leading edge (accessibility identifier
      activity-back-button) that returns to the spine, with the chip row back with it. No
      menu opens at any point, and nothing opens on hover.
    expect:
      text_visible:
        - Activity
        - Memories
        - Conversations
        - Brain Map

  - id: S2a
    name: Return Home with Escape
    do: "Press Escape while an Activity page is visible. Verify the app returns to Home and the top navigation bar remains visible."
    expect:
      text_visible:
        - Home

  - id: S3
    name: Navigate to Tasks
    do: "Click the Tasks button in the top nav bar (agent-swift find text 'Tasks' click). Verify Tasks page loads with search bar and task list."
    expect:
      text_visible:
        - Tasks

  - id: S4
    name: Navigate to Apps
    do: "Click the Apps button in the top nav bar (agent-swift find text 'Apps' click). Verify Apps page loads with Imports and Exports sections."
    expect:
      text_visible:
        - Apps
        - Imports

  - id: S5
    name: Open Settings via gear icon
    do: "Click the Settings gear icon (agent-swift find text 'gearshape' click). Verify Settings page opens showing section names: General, Account & Plan, Transcription, Floating Bar, Notifications & Privacy, Rewind, Shortcuts, Advanced, About."
    expect:
      interactive_count: { min: 9 }
      text_visible:
        - Settings
        - General

  - id: S5a
    name: Reach Permissions and Help from the Settings list
    do: >-
      In Settings, the section list ends with two rows the glass shell previously had no way to
      open at all: Permissions and Help. Click Permissions and verify the real permissions page
      loads — Microphone, Screen Recording, System Audio and Notifications, each with its status
      word and, where the permission is denied or stale, its reset/recovery steps. Then click Help
      and verify the founder support thread loads in the pane. If unread founder replies are
      waiting, the Help row carries their count as a badge before you open it, and the badge is
      gone after.
    expect:
      text_visible:
        - Permissions
        - Help
        - Microphone
        - Screen Recording

  - id: S6
    name: Return to Home from Settings
    do: "Click the Back button (agent-swift find text 'Back' click) to return from Settings. Verify the Home tab loads with top nav bar visible."
    expect:
      text_visible:
        - Home

  - id: S7
    name: Open Rewind from the bar
    do: "Click the Rewind button in the top nav bar (agent-swift find text 'Rewind' click); the View menu item and ⌘⌥R must still reach the same place. Verify Rewind appears with search bar, date picker, and either timeline content or 'Screen Recording Permission Required' gate."
    expect:
      text_visible:
        - Rewind

  - id: S8
    name: Return to Home
    do: "Close the Rewind overlay and verify the Home tab is visible with the top nav bar. Click Home in the top nav bar if needed."
    expect:
      text_visible:
        - Home

  - id: S9
    name: Verify legacy Home Conversations tab
    do: "In Settings > Advanced, enable Use old Home design, return to Home, and verify the left sidebar shows Conversations as a separate destination from Memories. Click Conversations."
    expect:
      text_visible:
        - Conversations

  - id: S10
    name: Verify the window has no chrome and is still closable, minimisable and movable
    do: >-
      The main window has no title bar buttons: capture the whole desktop
      (screencapture -x -o) and verify there are no red/yellow/green circles at the
      window's top-left — the nav bar's glass and the desktop are all that is there.
      Then verify nothing was lost with them. Drag the window by an empty part of the
      top navigation bar and confirm its position changed by the drag delta; drag it
      by the transparent title-bar band above the nav bar and confirm the same. Drag
      inside the results list and confirm the window did NOT move (the scroll view
      owns that gesture) and that the wheel still scrolls it. Press ⌘M and confirm the
      window minimises, restore it, then press ⌘W and confirm the window closes while
      the menu-bar app keeps running. Reopen it and confirm the re-summoned window
      also has no buttons.
    expect:
      text_visible:
        - Home
        - Activity
        - Tasks
        - Apps

  - id: S11
    name: Summon and dismiss the shell like a popup
    do: >-
      The shell is a summoned panel, not a managed window. From Home, press Escape and
      confirm the whole shell disappears (capture the desktop with screencapture -x -o —
      the wallpaper is uncovered) while the menu-bar icon is still there. Press ⌃⌘O and
      confirm it comes back on the display the pointer is on. Click into the query field,
      type a few characters, press Escape, and confirm the shell dismisses from the text
      field too. Summon again, click on another application, and confirm the shell puts
      itself away with no close button pressed. Summon once more, drag it somewhere
      deliberate, dismiss, re-summon, and confirm it returns exactly where you left it —
      and on a second display, that each display keeps its own placement. Finally open the
      menu-bar icon and confirm both Open Omi and Quit still work.
    expect:
      text_visible:
        - Home
        - Activity
        - Tasks
        - Apps

version: 2
name: navigation
tier: 1
description: Top navigation bar smoke — verify all 4 tabs + Settings + Rewind load via bridge (v0.12.119+ redesign)
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/OmiApp.swift
  - desktop/macos/Desktop/Sources/MainWindow/SidebarView.swift
  - desktop/macos/Desktop/Sources/MainWindow/DesktopHomeView.swift
  - desktop/macos/Desktop/Sources/MainWindow/DesktopTopBar.swift
preconditions:
  - automation_bridge_ready

steps:
  - id: S1
    name: Navigate to Home
    bridge.navigate:
      target: dashboard
      activateApp: false
    wait:
      state.selectedTabIndex: 0

  - id: S2
    name: Navigate to Memories
    bridge.navigate:
      target: memories
      activateApp: false
    wait:
      state.selectedTabIndex: 3

  - id: S3
    name: Navigate to Tasks
    bridge.navigate:
      target: tasks
      activateApp: false
    wait:
      state.selectedTabIndex: 4

  - id: S4
    name: Navigate to Apps
    bridge.navigate:
      target: apps
      activateApp: false
    wait:
      state.selectedTabIndex: 8

  - id: S5
    name: Navigate to Settings
    bridge.navigate:
      target: settings
      activateApp: false
    wait:
      state.selectedTabIndex: 9

  - id: S6
    name: Return to Home from Settings
    bridge.navigate:
      target: dashboard
      activateApp: false
    wait:
      state.selectedTabIndex: 0

  - id: S7
    name: Navigate to Rewind
    bridge.navigate:
      target: rewind
      activateApp: false
    wait:
      state.selectedTabIndex: 7

  - id: S8
    name: Return to Home
    bridge.navigate:
      target: dashboard
      activateApp: false
    wait:
      state.selectedTabIndex: 0

  - id: S9
    name: Logs clean
    log.expect:
      absent:
        - "DesktopAutomationBridge: failed"

version: 2
name: navigation
tier: manual
description: Top navigation bar smoke — verify all 4 tabs + Settings gear + Rewind overlay load correctly (v0.12.119+ redesign)
app: com.omi.computer-macos
covers:
  - desktop/macos/Desktop/Sources/OmiApp.swift
  - desktop/macos/Desktop/Sources/Sound/OmiUISound.swift
  - desktop/macos/Desktop/Sources/MainWindow/SidebarView.swift
  - desktop/macos/Desktop/Sources/MainWindow/SidebarNavItem.swift
  - desktop/macos/Desktop/Sources/MainWindow/DesktopHomeView.swift
  - desktop/macos/Desktop/Sources/MainWindow/PageGlassLane.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/ConversationsDestinationView.swift
  - desktop/macos/Desktop/Sources/MainWindow/DesktopTopBar.swift
  - desktop/macos/Desktop/Sources/MainWindow/ShellWindowChrome.swift
  - desktop/macos/Desktop/Sources/MainWindow/QueryShell/ShellStatusIcons.swift
  - desktop/macos/Desktop/Sources/MainWindow/QueryShell/OmiQueryDotMark.swift
  - desktop/macos/Desktop/Sources/MainWindow/EscapeKeyHandler.swift
preconditions:
  - auth_ready

steps:
  - id: S1
    name: Verify Home tab loads
    do: "Verify the app is on the search surface. The top bar shows the Omi mark, Library and Apps; the right cluster is three wordless icons with state dots (microphone, screen capture, settings). Home content is a query bar above a separate results panel."
    expect:
      interactive_count: { min: 8 }
      text_visible:
        - Omi
        - Library
        - Apps

  - id: S2
    name: Navigate to Memory
    do: "Click the Library button in the top nav bar (agent-swift find text 'Library' click). Verify the Memory hub loads with 3 sub-tabs: Memories, Conversations, Brain Map."
    expect:
      text_visible:
        - Memories
        - Conversations
        - Brain Map

  - id: S2a
    name: Return Home with Escape
    do: "Press Escape while the Memory page is visible. Verify the app returns to Home and the top navigation bar remains visible."
    expect:
      text_visible:
        - Home

  - id: S3
    name: Navigate to Tasks
    do: "Click the Tasks button in the top nav bar (agent-swift find text 'Tasks' click). Verify Tasks page loads with search bar and task list."
    expect:
      text_visible:
        - Tasks

  - id: S4
    name: Navigate to Apps
    do: "Click the Apps button in the top nav bar (agent-swift find text 'Apps' click). Verify Apps page loads with Imports and Exports sections."
    expect:
      text_visible:
        - Apps
        - Imports

  - id: S5
    name: Open Settings via gear icon
    do: "Click the Settings gear icon (agent-swift find text 'gearshape' click). Verify Settings page opens showing section names: General, Account & Plan, Transcription, Floating Bar, Notifications & Privacy, Rewind, Shortcuts, Advanced, About."
    expect:
      interactive_count: { min: 9 }
      text_visible:
        - Settings
        - General

  - id: S6
    name: Return to Home from Settings
    do: "Click the Back button (agent-swift find text 'Back' click) to return from Settings. Verify the Home tab loads with top nav bar visible."
    expect:
      text_visible:
        - Home

  - id: S7
    name: Open Rewind via View menu
    do: "Open Rewind via View menu (agent-swift press on View > Rewind menu item, or use keyboard shortcut ⌘⌥R). Verify Rewind overlay appears with search bar, date picker, and either timeline content or 'Screen Recording Permission Required' gate."
    expect:
      text_visible:
        - Rewind

  - id: S8
    name: Return to Home
    do: "Close the Rewind overlay and verify the Home tab is visible with the top nav bar. Click Home in the top nav bar if needed."
    expect:
      text_visible:
        - Home

  - id: S9
    name: Verify legacy Home Conversations tab
    do: "In Settings > Advanced, enable Use old Home design, return to Home, and verify the left sidebar shows Conversations as a separate destination from Memories. Click Conversations."
    expect:
      text_visible:
        - Conversations

  - id: S10
    name: Verify the window has no chrome and is still closable, minimisable and movable
    do: >-
      The main window has no title bar buttons: capture the whole desktop
      (screencapture -x -o) and verify there are no red/yellow/green circles at the
      window's top-left — the nav bar's glass and the desktop are all that is there.
      Then verify nothing was lost with them. Drag the window by an empty part of the
      top navigation bar and confirm its position changed by the drag delta; drag it
      by the transparent title-bar band above the nav bar and confirm the same. Drag
      inside the results list and confirm the window did NOT move (the scroll view
      owns that gesture) and that the wheel still scrolls it. Press ⌘M and confirm the
      window minimises, restore it, then press ⌘W and confirm the window closes while
      the menu-bar app keeps running. Reopen it and confirm the re-summoned window
      also has no buttons.
    expect:
      text_visible:
        - Omi
        - Library
        - Apps

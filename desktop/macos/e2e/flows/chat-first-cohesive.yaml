version: 2
name: chat-first-cohesive
tier: manual
description: "Manual local/offline fixture flow for the mounted Chat-first goal-link, focus, task, capture, and ordinary Chat response path."
app: non-prod
# Setup is server-owned and must precede this flow:
# PROVIDER_MODE=offline make dev-up
# make seed-memory-scenario SCENARIO=happy_path
# make chat-first-e2e-fixture CHAT_FIRST_E2E_ACTION=prepare CHAT_FIRST_E2E_CASE=enabled
# make desktop-run-local DESKTOP_APP_NAME=omi-chat-first-e2e DESKTOP_USER=omi-local-emulator-chat-first-enabled-v1
# Run with --lane ui --bundle-id com.omi.omi-chat-first-e2e for AX steps.
covers:
  - desktop/macos/Desktop/Sources/Providers/ChatToolExecutor+ScreenTextFallback.swift
  - desktop/macos/Desktop/Sources/DesktopAutomationBridge.swift
  # S1a exercises the real Node -> authorized Swift tool dispatch, backend
  # validation, and journal append; it is not a local card-insertion mapping.
  - desktop/macos/agent/src/protocol.ts
  - desktop/macos/agent/src/runtime/kernel-core.ts
  - desktop/macos/agent/src/index.ts
  - desktop/macos/Desktop/Sources/Chat/AgentRuntimeProcess.swift
  - desktop/macos/Desktop/Sources/Chat/AgentRuntimeProcess+JITKnowledgeToolsGate.swift
  # S1a's authorized executor result is projected through this store before
  # the fixture card becomes visible at S1b.
  - desktop/macos/Desktop/Sources/Chat/AgentRuntimeStatusStore.swift
  - desktop/macos/Desktop/Sources/Chat/AgentBridge+ChatFirst.swift
  - desktop/macos/Desktop/Sources/Chat/AgentClient.swift
  - desktop/macos/Desktop/Sources/Providers/ChatToolExecutor.swift
  # save_knowledge_graph discovery_text resolves through backend KG extract SSOT.
  - desktop/macos/Desktop/Sources/Services/KnowledgeGraphToolSupport.swift
  - desktop/macos/Desktop/Sources/Providers/ChatFirstBlockToolExecutor.swift
  # The one renderer every Chat surface hands a grouped rich block to.
  - desktop/macos/Desktop/Sources/MainWindow/ChatFirst/Blocks/ChatFirstRichBlockGroupView.swift
  - desktop/macos/Desktop/Sources/Chat/ChatFirstBlockValidation.swift
  # S14-S22 prove a capture is staged as a typed, removable composer reference,
  # persists on the accepted user turn after the composer clears, and reopens
  # the same canonical hub-owned detail as every other conversation entry.
  - desktop/macos/Desktop/Sources/Chat/ChatComposerReference.swift
  - desktop/macos/Desktop/Sources/Chat/ChatResource.swift
  - desktop/macos/Desktop/Sources/Providers/ChatProvider.swift
  - desktop/macos/Desktop/Sources/Providers/ChatProvider+AutomationSnapshot.swift
  - desktop/macos/Desktop/Sources/Chat/AgentQueryResult.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/ChatBubble.swift
  # Every rendered assistant row mounts this file's popover anchor. The flow
  # covers that mount and teardown; the selectable text view's own behaviour
  # (selectable, not editable, one view across rebuilds) is asserted
  # hermetically in ChatSelectableTextSurfaceTests, not here.
  - desktop/macos/Desktop/Sources/MainWindow/Components/ChatSelectableProse.swift
  # The prose parse and measured height this file caches are exercised by the
  # same mounts the flow drives; the cache changes no visible behaviour.
  - desktop/macos/Desktop/Sources/MainWindow/Components/ChatProseRenderCache.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/StableChatCardHeader.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/ChatConversationReferencePill.swift
  # S8 drives the Tasks-page closure, including its bounded attempt/terminal telemetry.
  - desktop/macos/Desktop/Sources/Chat/ChatFirstAnalytics.swift
  - desktop/macos/Desktop/Sources/MainWindow/ChatFirst/ChatFirstAutomationRuntime.swift
  - desktop/macos/Desktop/Sources/MainWindow/ChatFirst/Blocks/ChatFirstContentBlockViews.swift
  # S2/S3 prove the enabled main Chat rendered and operated the rich-block context.
  - desktop/macos/Desktop/Sources/MainWindow/ChatFirst/Blocks/ChatFirstRichBlockContext.swift
  # S2 and S12 activate the real task card's Omi-capture badge. The local
  # fixture uses only transcription:omi provenance, so the policy's
  # fail-closed branch is part of the mounted path rather than a paper cover.
  - desktop/macos/Desktop/Sources/MainWindow/ChatFirst/ChatFirstCaptureLinkPolicy.swift
  - desktop/macos/Desktop/Sources/MainWindow/ChatFirst/ChatFirstGoalsPage.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/TasksPage.swift
  - desktop/macos/Desktop/Sources/Stores/TasksStore+CanonicalTask.swift
  # S3-S6 load canonical goals, acknowledge focus, and mutate focused-goal state.
  - desktop/macos/Desktop/Sources/MainWindow/ChatFirst/CanonicalGoalsStore.swift
  - desktop/macos/Desktop/Sources/Services/APIClient/APIClient+TaskCatalog.swift
  # S12/S13 load the canonical conversation detail and prepare its playback through typed audio APIs.
  - desktop/macos/Desktop/Sources/MainWindow/ChatFirst/CaptureArchiveRepository.swift
  - desktop/macos/Desktop/Sources/MainWindow/ChatFirst/CapturePlayback.swift
  - desktop/macos/Desktop/Sources/MainWindow/ChatFirst/CapturePlaybackAPI.swift
  - desktop/macos/Desktop/Sources/MainWindow/ChatFirst/ChatFirstShell.swift
  - desktop/macos/Desktop/Sources/MainWindow/MemoryHubPage.swift
  # S22a-S22c seed a recap, open it through the slim Chat pill, and prove the dedicated recap
  # page mounts in its sheet — the one surface that carries recap badges and actions.
  - desktop/macos/Desktop/Sources/MainWindow/Dashboard/ChatDailyRecapRow.swift
  - desktop/macos/Desktop/Sources/MainWindow/Dashboard/DailyRecapPage.swift
  - desktop/macos/Desktop/Sources/Automation/MemoryReviewFixture.swift
preconditions:
  - automation_bridge_ready
  - named_non_production_bundle_ui_lane
  - provider_mode_offline
  - chat_first_e2e_fixture_case_enabled_prepared_by_make_helper
  - desktop_user_omi_chat_first_e2e_enabled
  - chat_first_daily_opener_materialized_in_mounted_main_chat

steps:
  - id: S1
    name: Navigate to the mounted Chat surface that owns the real rich goal link
    bridge.navigate:
      target: chat
      activateApp: false
      settleMs: 750

  - id: S1a
    name: Dispatch the fixture task card through the real authorized Chat-first block executor
    bridge.action:
      name: chat_first_render_fixture_task_card
    expect:
      result.detail.executor_invoked: "true"
      result.detail.validated: "true"
      result.detail.journal_block_rendered: "true"

  - id: S1b
    name: Verify the executor-rendered fixture task card is visible through Accessibility
    ax.expect:
      identifiers_visible:
        - chat-first-task-chat-first-e2e-task-v1-toggle

  - id: S2
    name: Verify the materialized rich Goal link and Omi-capture task badge are exposed through Accessibility
    ax.expect:
      identifiers_visible:
        - chat-first-goal-chat-first-e2e-goal-v1-open
        - chat-first-task-chat-first-e2e-task-v1-capture-chat-first-e2e-capture-v1

  - id: S3
    name: Open the Goal through its real mounted rich-link control
    ax.activate:
      identifier: chat-first-goal-chat-first-e2e-goal-v1-open
    timeout_seconds: 10
    wait:
      state.shellVariant: chat_first
      state.visibleChatFirstRoute: goals
      state.isFocusedEntityAcknowledged: true

  - id: S4
    name: Confirm the Goal destination acknowledged the focused entity
    bridge.action:
      name: chat_first_runtime_snapshot
    expect:
      result.detail.route: goals
      result.detail.route_visible: "true"
      result.detail.focus_acknowledged: "true"
      result.detail.focused_goal_available: "true"

  - id: S5
    name: Set the server-seeded alternate active Goal as focus through the mounted Goals page
    bridge.action:
      name: chat_first_set_focus
    expect:
      result.detail.focus_updated: "true"

  - id: S6
    name: Open the selected Goal's related Tasks through the mounted Goals page
    bridge.action:
      name: chat_first_open_related_tasks
    expect:
      result.detail.related_tasks_opened: "true"

  - id: S7
    name: Confirm the mounted Tasks page acknowledged the related Goal focus
    bridge.action:
      name: chat_first_runtime_snapshot
    expect:
      result.detail.route: tasks
      result.detail.route_visible: "true"
      result.detail.focus_acknowledged: "true"

  - id: S8
    name: Toggle and reconcile the seeded task through the shared Tasks store
    bridge.action:
      name: chat_first_toggle_task
    expect:
      result.detail.task_reconciled: "true"

  - id: S9
    name: Confirm the actual Tasks owner retained the reconciled completion count
    bridge.action:
      name: chat_first_runtime_snapshot
    expect:
      result.detail.completed_visible_task_count: "1"

  - id: S10
    name: Return to mounted Chat and preserve the shared-store reconciliation
    bridge.navigate:
      target: chat
      activateApp: false
      settleMs: 750

  - id: S11
    name: Confirm Chat sees the same reconciled Tasks-store shape
    bridge.action:
      name: chat_first_runtime_snapshot
    expect:
      result.detail.route: chat
      result.detail.route_visible: "true"
      result.detail.completed_visible_task_count: "1"

  - id: S12
    name: Open the fixture's Omi capture through the real mounted task-card badge
    ax.activate:
      identifier: chat-first-task-chat-first-e2e-task-v1-capture-chat-first-e2e-capture-v1
    timeout_seconds: 10
    wait:
      state.shellVariant: chat_first
      state.visibleChatFirstRoute: memories
      state.isFocusedEntityAcknowledged: true

  - id: S13
    name: Confirm the task-originated capture detail is mounted without returning capture content
    bridge.action:
      name: chat_first_runtime_snapshot
    expect:
      result.detail.route: memories
      result.detail.route_visible: "true"
      result.detail.capture_detail_visible: "true"

  - id: S14
    name: Seed a draft before discussing the selected capture
    bridge.action:
      name: set_chat_drafts
      params:
        main: "Keep this draft while attaching the conversation"
    expect:
      result.detail.main: "Keep this draft while attaching the conversation"

  - id: S15
    name: Stage the selected capture through the normal main-Chat composer owner
    bridge.action:
      name: chat_first_discuss_capture
    expect:
      result.detail.capture_reference_staged: "true"
      result.detail.composer_reference_count: "1"

  - id: S16
    name: Confirm staging preserved the user's draft
    bridge.action:
      name: chat_drafts_snapshot
    expect:
      result.detail.main: "Keep this draft while attaching the conversation"

  - id: S17
    name: Send the draft with its staged conversation reference
    bridge.action:
      name: ask_main_chat
      params:
        query: "Acknowledge this attached conversation."
    expect:
      result.detail.sent: "Acknowledge this attached conversation."

  - id: S18
    name: Wait for the accepted turn to finish
    bridge.action:
      name: wait_main_chat_idle
      params:
        timeoutMs: "120000"
    expect:
      result.detail.idle: "true"

  - id: S19
    name: Confirm the sent user turn retained the typed conversation resource
    bridge.action:
      name: main_chat_snapshot
      params:
        limit: "4"
    expect:
      result.detail.is_sending: "false"
      result.detail.is_streaming: "false"
      result.detail.messages_json:
        contains: "reference:conversation:chat-first-e2e-capture-v1"

  - id: S20
    name: Confirm Chat stayed mounted and only the composer copy cleared
    bridge.action:
      name: chat_first_runtime_snapshot
    expect:
      result.detail.route: chat
      result.detail.route_visible: "true"
      result.detail.composer_reference_count: "0"
      result.detail.completed_visible_task_count: "1"

  - id: S21
    name: Reopen the persisted conversation attachment through the real Chat pill
    ax.activate:
      identifier: chat-conversation-reference-chat-first-e2e-capture-v1-open
    timeout_seconds: 10
    wait:
      state.shellVariant: chat_first
      state.visibleChatFirstRoute: memories

  - id: S22
    name: Confirm the Chat attachment reused the canonical hub-owned conversation detail
    bridge.action:
      name: chat_first_runtime_snapshot
    expect:
      result.detail.route: memories
      result.detail.route_visible: "true"
      result.detail.capture_detail_visible: "true"

  - id: S22a
    name: Seed a recap so the Chat pill has a record to open
    # `seed_memory_review_fixture` writes the day's summary the way the nightly job would, through
    # the store's own refresh. Shape-only check first: a day with no recap has no pill, and S22b
    # would click nothing.
    bridge.action:
      name: seed_memory_review_fixture
      params:
        count: "2"
        timeoutMs: "15000"
    expect:
      result.detail.createdCount: "2"
      result.detail.memoriesLearned: "2"

  - id: S22b
    name: Open the dedicated recap page through the slim recap pill
    ax.activate:
      identifier: chat-daily-recap-row
    timeout_seconds: 10
    wait:
      state.visibleChatFirstRoute: daily-recap

  - id: S22c
    name: The recap page is mounted in its sheet
    ax.expect:
      identifiers_visible:
        - daily-recap-page

  - id: S23
    name: Confirm the bridge recorded no route failure
    log.expect:
      absent:
        - "DesktopAutomationBridge: failed"
        - "navigation_target_not_visible"

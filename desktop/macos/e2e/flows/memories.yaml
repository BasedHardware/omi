version: 2
name: memories
tier: 2
description: Memory tab — navigate, snapshot memories, check conversations list (v0.12.119+ redesign)
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/MainWindow/Pages/MemoriesPage.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/MemoryGraph/MemoryGraphPage.swift
preconditions:
  - automation_bridge_ready

steps:
  - id: S1
    name: Navigate to Memories
    bridge.navigate:
      target: memories
      activateApp: false
    wait:
      state.selectedTabIndex: 3

  - id: S2
    name: Memories snapshot
    bridge.action:
      name: memories_snapshot
    expect:
      ok: true
      result.detail.is_signed_in: "true"

  - id: S3
    name: Navigate to Conversations
    bridge.navigate:
      target: conversations
      activateApp: false
    wait:
      state.selectedTabIndex: 1

  - id: S4
    name: Conversations list snapshot
    bridge.action:
      name: conversation_list_snapshot
    expect:
      ok: true

  - id: S5
    name: Memory graph snapshot
    bridge.action:
      name: memory_graph_snapshot
    expect:
      ok: true

  - id: S6
    name: Return to Memories
    bridge.navigate:
      target: memories
      activateApp: false
    wait:
      state.selectedTabIndex: 3

  - id: S7
    name: Logs clean
    log.expect:
      absent:
        - "DesktopAutomationBridge: failed"

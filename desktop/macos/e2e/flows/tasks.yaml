version: 2
name: tasks
tier: 2
description: Tasks tab — navigate, snapshot tasks list (v0.12.119+ redesign)
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/MainWindow/Pages/TasksPage.swift
  - desktop/macos/Desktop/Sources/MainWindow/Tasks/SuggestedTasksSection.swift
  - desktop/macos/Desktop/Sources/Stores/TasksStore.swift
preconditions:
  - automation_bridge_ready

steps:
  - id: S1
    name: Navigate to Tasks
    bridge.navigate:
      target: tasks
      activateApp: false
    wait:
      state.selectedTabIndex: 4

  - id: S2
    name: Tasks snapshot
    bridge.action:
      name: tasks_snapshot
    expect:
      ok: true

  - id: S3
    name: Return to Home
    bridge.navigate:
      target: dashboard
      activateApp: false
    wait:
      state.selectedTabIndex: 0

  - id: S4
    name: Logs clean
    log.expect:
      absent:
        - "DesktopAutomationBridge: failed"

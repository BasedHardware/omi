version: 2
name: device-tool-surface
tier: 2
description: On-device tool surface probe — absent Messages and Mail stores classify deterministically, an empty send is rejected before Messages.app is contacted, compose proposals refuse a bare name, an empty draft or an address the person never gave before any window opens, and osascript receives untrusted values as argv
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/Services/MessagesReaderService.swift
  - desktop/macos/Desktop/Sources/Services/AppleMailReaderService.swift
  - desktop/macos/Desktop/Sources/Services/FullDiskAccessProbe.swift
  - desktop/macos/Desktop/Sources/Services/MessagesSenderService.swift
  - desktop/macos/Desktop/Sources/Services/AppleScriptRunner.swift
  - desktop/macos/Desktop/Sources/Services/ContactsReaderService.swift
  - desktop/macos/Desktop/Sources/Services/DeviceToolsProbe.swift
  - desktop/macos/Desktop/Sources/Providers/ChatToolExecutor+DeviceTools.swift
  - desktop/macos/Desktop/Sources/Providers/ChatToolExecutor+DeviceToolPermissions.swift
  - desktop/macos/Desktop/Sources/Providers/ChatToolExecutor+ComposeProposals.swift
  - desktop/macos/Desktop/Sources/Services/ComposeProposalService.swift
  - desktop/macos/Desktop/Sources/Services/ComposeProposalCoordinator.swift
  - desktop/macos/Desktop/Sources/Services/ComposeRecipientGrounding.swift
  - desktop/macos/Desktop/Sources/Services/ComposeProposalRequest.swift
preconditions:
  - automation_bridge_ready

steps:
  - id: S1
    name: Device tool surface probe
    # A bogus messagesDbPath fails openReadOnlyStore's existence check on every
    # machine, so store_not_found is hermetic whether or not this Mac has
    # Messages signed in or Full Disk Access granted.
    bridge.action:
      name: device_tools_probe
      params:
        messagesDbPath: "/nonexistent/omi-e2e-messages-fixture.db"
    expect:
      ok: true
      result.detail.messagesRead: "false"
      result.detail.messagesClassification: "store_not_found"
      # store_not_found is not a permission problem, so no permission is named.
      result.detail.messagesRequiredPermission: ""
      # The Mail index classifies the same way against the same absent path.
      result.detail.mailRead: "false"
      result.detail.mailClassification: "store_not_found"
      result.detail.mailRequiredPermission: ""
      # An empty body must be rejected by validation, never forwarded to
      # Messages.app — this is what keeps the probe non-sending.
      result.detail.sendValidation: "empty_body"
      # A name is never turned into an address, and an empty draft is never
      # shown: both are refused before a compose window could open.
      result.detail.proposeNameValidation: "recipient_needs_lookup"
      result.detail.proposeBodyValidation: "empty_body"
      # An address the person never gave is sent back for confirmation.
      result.detail.proposeGrounding: "needs_confirmation"
      # Untrusted text reaches osascript as argv: the marker comes back byte
      # for byte instead of being compiled as AppleScript.
      result.detail.appleScriptOk: "true"
      result.detail.appleScriptEchoedArgv: "true"

  - id: S2
    name: Logs clean
    log.expect:
      forbid:
        - "Fatal error"

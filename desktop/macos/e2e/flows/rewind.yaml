version: 2
name: rewind
tier: 2
description: Rewind — navigate via bridge, snapshot settings (v0.12.119+ redesign — Rewind is overlay via View menu but navigable via bridge)
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/Rewind/UI/RewindPage.swift
  - desktop/macos/Desktop/Sources/Rewind/UI/RewindViewModel.swift
  - desktop/macos/Desktop/Sources/Rewind/UI/RewindSearchBar.swift
preconditions:
  - automation_bridge_ready

steps:
  - id: S1
    name: Navigate to Rewind
    bridge.navigate:
      target: rewind
      activateApp: false
    wait:
      state.selectedTabIndex: 7

  - id: S2
    name: Rewind settings snapshot
    bridge.action:
      name: rewind_settings_snapshot
    expect:
      ok: true

  - id: S3
    name: Return to Home
    bridge.navigate:
      target: dashboard
      activateApp: false
    wait:
      state.selectedTabIndex: 0

  - id: S4
    name: Logs clean
    log.expect:
      absent:
        - "DesktopAutomationBridge: failed"

version: 2
name: home-stage
tier: 2
description: >-
  The Home stage (hub / chat / connect) driven through the automation bridge. The stage is rendered
  by DashboardPage, which the chat-first shell mounts on its Chat route — hence the cohort
  precondition. The legacy shell's Home is the query surface and has no stage at all, so this flow
  asserts the shell before it asserts a mode.
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/MainWindow/Components/ChatMessagesView.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/DashboardPage.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/HomeAskBarControls.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/HomePresentationTokens.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/HomeStagePresentation.swift
  - desktop/macos/Desktop/Sources/MainWindow/Dashboard/HomeSuggestionsStore.swift
  - desktop/macos/Desktop/Sources/MainWindow/Dashboard/HomeKnowsComposer.swift
  - desktop/macos/Desktop/Sources/MainWindow/MainChatNavigationRequest.swift
  - desktop/macos/Desktop/Sources/DesktopAutomationBridge.swift
  # S1 is the guard: these decide whether a stage exists at all, and therefore whether
  # `state.homeMode` is a reading or a fabrication.
  - desktop/macos/Desktop/Sources/MainWindow/DesktopShellPresentationPolicy.swift
  - desktop/macos/Desktop/Sources/MainWindow/DesktopHomeView.swift
  - desktop/macos/Desktop/Sources/MainWindow/ChatFirst/ChatFirstShell.swift
preconditions:
  - automation_bridge_ready
  - auth_ready
  # DashboardPage — and so the stage — is mounted only by the chat-first shell. Prepare the bundle
  # the same way `chat-first.yaml` does; on a legacy bundle S1 fails immediately and says why.
  - chat_first_cohort_named_bundle

steps:
  - id: S0
    name: Reset main chat for flow isolation
    bridge.action:
      name: reset_main_chat
    expect:
      result.detail.reset: "true"

  - id: S1
    name: Mount the shell that owns the stage
    # Deliberately `chat`, not `dashboard`. `dashboard` resolves to the More/Dashboard route, where
    # DashboardPage is handed an `onOpenPrimaryChat` and `home_open_chat` navigates away to the Chat
    # route instead of opening the inline chat — S3 would then assert against a page it had left.
    bridge.navigate:
      target: chat
      activateApp: false
    wait:
      state.shellVariant: chat_first
      state.chatFirstRoute: chat

  - id: S2
    name: Collapse to the empty-history resting hub
    bridge.action:
      name: home_close_panel
    wait:
      state.homeMode: hub

  - id: S3
    name: Open inline chat
    bridge.action:
      name: home_open_chat
    wait:
      state.homeMode: chat

  - id: S4
    name: Home ask stub (no LLM wait)
    bridge.action:
      name: home_ask
      params:
        query: "[[MARKER:home-stage-stub]]"
    expect:
      result.detail.sent: "[[MARKER:home-stage-stub]]"
    wait:
      state.homeMode: chat

  - id: S5
    name: Toggle connect tray
    bridge.action:
      name: home_connect_toggle
    wait:
      state.homeMode: connect

  - id: S6
    name: Collapse back to loaded-history chat
    bridge.action:
      name: home_close_panel
    wait:
      state.homeMode: chat

  - id: S7
    name: Leaving the stage stops reporting a mode
    # The field describes a mounted surface. Navigating away must clear it rather than leave the last
    # mode standing — a stale `connect` here is the same class of lie as the `hub` the legacy shell
    # used to report for a Home that had no stage.
    bridge.navigate:
      target: tasks
      activateApp: false
    wait:
      state.chatFirstRoute: tasks
      state.homeMode: { exists: false }

  - id: S8
    name: Logs clean
    log.expect:
      absent:
        - "DesktopAutomationBridge: failed"

version: 2
name: account-cutover-gate
tier: 2
description: Verify signed-in desktop home installs the account-cutover control refresh and fail-closed overlays before product traffic
app: com.omi.desktop-dev
covers:
  - desktop/macos/Desktop/Sources/AccountCutover/APIClient+AccountCutover.swift
  - desktop/macos/Desktop/Sources/AccountCutover/AccountCutoverBlockingOverlay.swift
  - desktop/macos/Desktop/Sources/AccountCutover/AccountCutoverControl.swift
  - desktop/macos/Desktop/Sources/MainWindow/Tasks/SuggestedTasksStore.swift
  - desktop/macos/Desktop/Sources/MainWindow/DesktopHomeView.swift
  - desktop/macos/Desktop/Sources/Services/OmiHTTPTransport.swift
preconditions:
  - signed_in
  - onboarding_completed

steps:
  - id: S1
    name: Launch signed-in home
    do: "Launch a named non-prod bundle already signed in and onboarded. Confirm DesktopHomeView reaches the signed-in shell."

  - id: S2
    name: Confirm cutover control refresh
    do: "On home appear / app activation, confirm AccountCutoverControlManager refreshes GET /v1/account/cutover/control. With a legacy default projection, confirm product traffic remains available and no blocking overlay is shown."

  - id: S3
    name: Confirm force-upgrade overlay reuses update prompt
    do: "Inject or stub a cutover control with client_action=force_upgrade. Confirm the required-update prompt surface blocks the home shell and the CTA opens the existing desktop download URL path."

  - id: S4
    name: Confirm migration maintenance quarantines offline work
    do: "Inject or stub a migrating control with offline_queue_instruction=quarantine. Confirm the migration-maintenance overlay blocks product traffic and SuggestedTasksStore / offline queue upload paths respect quarantine."

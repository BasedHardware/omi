version: 2
name: local-hybrid-search
tier: manual
description: Headless synthetic local hybrid retrieval benchmark via the automation bridge. Apple NLCE assets are OS-managed; a Mac without them must report local_engine_unavailable (FTS-only) rather than calling Gemini.
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/LocalInference/LocalEmbeddingService.swift
  - desktop/macos/Desktop/Sources/LocalInference/LocalEmbeddingRuntime.swift
  - desktop/macos/Desktop/Sources/LocalInference/LocalEmbeddingKillSwitches.swift
  - desktop/macos/Desktop/Sources/LocalInference/LocalEmbeddingProbeCache.swift
  - desktop/macos/Desktop/Sources/LocalInference/AppleNLContextualEmbeddingEngine.swift
  - desktop/macos/Desktop/Sources/LocalInference/LocalEmbeddingBenchmark.swift
  - desktop/macos/Desktop/Sources/LocalInference/TranscriptChunker.swift
  - desktop/macos/Desktop/Sources/Rewind/Core/LocalEmbeddingStore.swift
  - desktop/macos/Desktop/Sources/Rewind/Services/LocalHybridSearch.swift
  - desktop/macos/Desktop/Sources/Rewind/Services/LocalEmbeddingIndexer.swift
  - desktop/macos/Desktop/Sources/Providers/ChatLocalHybridTool.swift
preconditions:
  - automation_bridge_ready

steps:
  - id: S1
    name: Run the synthetic local embedding benchmark
    do: "On a non-production named bundle, run `./scripts/omi-ctl action local_embedding_benchmark`. If Apple NLContextualEmbedding assets are on the machine, verify the JSON report has kind=local_embedding_benchmark, fixture=synthetic, and metric_count of 9 (name_heavy/paraphrase/date_bounded × fts/vector/hybrid). If the action returns error=local_engine_unavailable, that is the fail-closed probe and this step still passes — search stays keyword-only, never Gemini."
    bridge.action:
      name: local_embedding_benchmark
    expect:
      interactive_count: { min: 0 }

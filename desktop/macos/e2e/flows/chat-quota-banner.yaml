version: 2
name: chat-quota-banner
tier: 2
description: >-
  The chat-quota warning appears above the composer at 75%, 90% and 100% of the plan
  allowance, states the count and the reset, and says the right thing for the plan's
  exhaustion policy. The same run proves the send gate: an overage plan past its
  allowance is still allowed to send, because the backend serves and bills it, while a
  hard-capped plan past its allowance is blocked.
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/MainWindow/Components/ChatQuotaBanner.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/ChatQuotaBannerView.swift
  - desktop/macos/Desktop/Sources/FloatingControlBar/FloatingBarUsageLimiter.swift
preconditions:
  - automation_bridge_ready

steps:
  - id: S1
    name: Below the first threshold the composer carries no warning
    bridge.action:
      name: apply_usage_quota
      params:
        used: "370"
        limit: "500"
        plan: Operator
        unit: questions
        is_overage_plan: "true"
    expect:
      result.detail.applied: "true"

  - id: S2
    name: No banner at 74%
    bridge.action:
      name: usage_limiter_snapshot
    expect:
      result.detail.banner_threshold: "none"

  - id: S3
    name: Crossing 75% raises the first warning with the count
    bridge.action:
      name: apply_usage_quota
      params:
        used: "375"
        limit: "500"
        plan: Operator
        unit: questions
        is_overage_plan: "true"

  - id: S4
    name: The 75% banner names the plan and the count
    bridge.action:
      name: usage_limiter_snapshot
    expect:
      result.detail.banner_threshold: "75"
      result.detail.banner_title: "75% of your monthly limit"
      result.detail.banner_message:
        contains: "375 of 500 Operator questions used"

  - id: S5
    name: Crossing 90% replaces it with the second warning
    bridge.action:
      name: apply_usage_quota
      params:
        used: "450"
        limit: "500"
        plan: Operator
        unit: questions
        is_overage_plan: "true"

  - id: S6
    name: The 90% banner is showing
    bridge.action:
      name: usage_limiter_snapshot
    expect:
      result.detail.banner_threshold: "90"
      result.detail.banner_title: "90% of your monthly limit"

  - id: S7
    name: At the allowance an overage plan is told it is now billing, not blocked
    bridge.action:
      name: apply_usage_quota
      params:
        used: "500"
        limit: "500"
        plan: Operator
        unit: questions
        is_overage_plan: "true"

  - id: S8
    name: The overage plan keeps sending past its allowance
    bridge.action:
      name: usage_limiter_snapshot
    expect:
      result.detail.banner_threshold: "100"
      result.detail.banner_title: "Now billing overage"
      result.detail.is_limit_reached: "false"

  - id: S9
    name: A hard-capped plan at its allowance is told to upgrade
    bridge.action:
      name: apply_usage_quota
      params:
        used: "30"
        limit: "30"
        plan: Free
        unit: questions
        is_overage_plan: "false"

  - id: S10
    name: The hard-capped plan is blocked, and says so
    bridge.action:
      name: usage_limiter_snapshot
    expect:
      result.detail.banner_threshold: "100"
      result.detail.banner_title: "Monthly limit reached"
      result.detail.banner_message:
        contains: "Upgrade to keep chatting"
      result.detail.is_limit_reached: "true"

  - id: S11
    name: Restore an unexhausted quota so the bundle is left usable
    bridge.action:
      name: reset_usage_limiter
    expect:
      result.detail.reset: "true"

version: 2
name: chat-quota-banner
tier: 2
description: >-
  The chat-quota warning appears at 90% and 100% of the plan allowance, states the
  count and the reset, and says the right thing for the plan's exhaustion policy. Steps
  assert both what the model derives and what the mounted banner actually rendered. The
  run also reads the pre-send gate's own verdict for each seeded plan -- allowed past
  the allowance on an overage plan, blocked on a hard-capped one -- without sending a
  query itself; the send paths are covered by FloatingBarUsageLimiterTests.
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/MainWindow/Components/ChatQuotaBanner.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/ChatQuotaBannerView.swift
  - desktop/macos/Desktop/Sources/FloatingControlBar/FloatingBarUsageLimiter.swift
preconditions:
  - automation_bridge_ready

steps:
  - id: S1
    name: Below the first threshold the composer carries no warning
    bridge.action:
      name: apply_usage_quota
      params:
        used: "440"
        limit: "500"
        plan: Operator
        unit: questions
        is_overage_plan: "true"
    expect:
      result.detail.applied: "true"

  - id: S2
    name: No banner at 88%
    bridge.action:
      name: usage_limiter_snapshot
    expect:
      result.detail.banner_threshold: "none"

  - id: S3
    name: Crossing 90% raises the first warning with the count
    bridge.action:
      name: apply_usage_quota
      params:
        used: "460"
        limit: "500"
        plan: Operator
        unit: questions
        is_overage_plan: "true"

  - id: S4
    name: The 90% banner names the approach and the count
    bridge.action:
      name: usage_limiter_snapshot
    expect:
      result.detail.banner_threshold: "90"
      result.detail.banner_title: "Almost at your monthly limit"
      result.detail.banner_message:
        contains: "460 of 500 Operator questions used"
      # The mounted view, not just the arithmetic behind it.
      result.detail.rendered_banner_threshold: "90"
      result.detail.rendered_banner_title: "Almost at your monthly limit"

  - id: S5
    name: Crossing 100% replaces it with the exhaustion warning
    bridge.action:
      name: apply_usage_quota
      params:
        used: "500"
        limit: "500"
        plan: Operator
        unit: questions
        is_overage_plan: "true"

  - id: S6
    name: The overage plan keeps sending past its allowance
    bridge.action:
      name: usage_limiter_snapshot
    expect:
      result.detail.banner_threshold: "100"
      result.detail.banner_title: "Now billing overage"
      result.detail.rendered_banner_threshold: "100"
      result.detail.rendered_banner_title: "Now billing overage"
      result.detail.is_limit_reached: "false"

  - id: S7
    name: A hard-capped plan at its allowance is told to upgrade
    bridge.action:
      name: apply_usage_quota
      params:
        used: "30"
        limit: "30"
        plan: Free
        unit: questions
        is_overage_plan: "false"

  - id: S8
    name: The hard-capped plan is blocked, and says so
    bridge.action:
      name: usage_limiter_snapshot
    expect:
      result.detail.banner_threshold: "100"
      result.detail.banner_title: "Monthly limit reached"
      result.detail.rendered_banner_title: "Monthly limit reached"
      result.detail.banner_message:
        contains: "Upgrade to keep chatting"
      result.detail.is_limit_reached: "true"

  - id: S9
    name: Restore an unexhausted quota so the bundle is left usable
    bridge.action:
      name: reset_usage_limiter
    expect:
      result.detail.reset: "true"

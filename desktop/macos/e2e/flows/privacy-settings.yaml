version: 2
name: privacy-settings
tier: 2
description: Hermetic privacy settings and complete account export through the loopback data backend
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/MainWindow/Pages/Settings/Sections/SettingsContentView+NotificationsPrivacy.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/Settings/DataExport/AccountDataExportModel.swift
  - desktop/macos/Desktop/Sources/Services/APIClient/APIClient+DataExport.swift
preconditions:
  - automation_bridge_ready

steps:
  - id: S1
    name: Open Settings Privacy section
    bridge.navigate:
      target: settings
      settingsSection: Privacy
      activateApp: false
    wait:
      state.selectedSettingsSection: Privacy

  - id: S2
    name: Privacy settings snapshot
    bridge.action:
      name: settings_privacy_snapshot
    expect:
      ok: true

  - id: S3
    name: Download and validate a complete account export from the loopback fixture
    bridge.action:
      name: settings_export_data_fixture
    expect:
      result.detail.completed: "true"

  - id: S4
    name: Logs clean
    log.expect:
      absent:
        - "DesktopAutomationBridge: failed"

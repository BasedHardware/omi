version: 2
name: settings-basic
tier: 2
description: Settings navigation smoke — navigate all 9 sections via bridge (v0.12.119+ redesign)
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/MainWindow/Pages/SettingsPage.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/Settings/Sections/SettingsContentView+General.swift
  - desktop/macos/Desktop/Sources/MainWindow/SettingsSidebar.swift
preconditions:
  - automation_bridge_ready

steps:
  - id: S1
    name: Navigate to Settings
    bridge.navigate:
      target: settings
      activateApp: false
    wait:
      state.selectedTabIndex: 9

  - id: S2
    name: General section
    bridge.navigate:
      target: settings
      settingsSection: General
      activateApp: false
    wait:
      state.selectedSettingsSection: General

  - id: S3
    name: Account section
    bridge.navigate:
      target: settings
      settingsSection: Account
      activateApp: false
    wait:
      state.selectedSettingsSection: Account

  - id: S4
    name: Transcription section
    bridge.navigate:
      target: settings
      settingsSection: Transcription
      activateApp: false
    wait:
      state.selectedSettingsSection: Transcription

  - id: S5
    name: Floating Bar section
    bridge.navigate:
      target: settings
      settingsSection: Floating Bar
      activateApp: false
    wait:
      state.selectedSettingsSection: Floating Bar

  - id: S6
    name: Notifications section
    bridge.navigate:
      target: settings
      settingsSection: Notifications
      activateApp: false
    wait:
      state.selectedSettingsSection: Notifications

  - id: S7
    name: Rewind section
    bridge.navigate:
      target: settings
      settingsSection: Rewind
      activateApp: false
    wait:
      state.selectedSettingsSection: Rewind

  - id: S8
    name: Shortcuts section
    bridge.navigate:
      target: settings
      settingsSection: Shortcuts
      activateApp: false
    wait:
      state.selectedSettingsSection: Shortcuts

  - id: S9
    name: Advanced section
    bridge.navigate:
      target: settings
      settingsSection: Advanced
      activateApp: false
    wait:
      state.selectedSettingsSection: Advanced

  - id: S10
    name: About section
    bridge.navigate:
      target: settings
      settingsSection: About
      activateApp: false
    wait:
      state.selectedSettingsSection: About

  - id: S11
    name: Return to Home
    bridge.navigate:
      target: dashboard
      activateApp: false
    wait:
      state.selectedTabIndex: 0

  - id: S12
    name: Logs clean
    log.expect:
      absent:
        - "DesktopAutomationBridge: failed"

version: 2
name: chat-first
tier: 2
description: "Cohort-gated mounted-shell route contract. It never fabricates Chat-first data or proves agent manifests."
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/DesktopAutomationBridge.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/ChatSessionsSidebar.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/ChatErrorCard.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/DailyTaskCreationSheet.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/TasksPage.swift
  # Every bridge.navigate step waits for the requested Chat-first route to
  # mount through the split visibility policy before returning success.
  - desktop/macos/Desktop/Sources/DesktopAutomationBridge+ChatFirst.swift
  # S1 observes the shell only after its server-sampled capability projection admits it.
  - desktop/macos/Desktop/Sources/Chat/ChatFirstCapabilityProjection.swift
  - desktop/macos/Desktop/Sources/MainWindow/ChatFirst/ChatFirstAutomationRuntime.swift
  - desktop/macos/Desktop/Sources/MainWindow/ChatFirst/ChatFirstRoute.swift
  - desktop/macos/Desktop/Sources/MainWindow/ChatFirst/ChatFirstShell.swift
  # The opt-in switch-latency logger stamps exactly the spans this flow drives:
  # route select, destination teardown, transcript mount, and the settled restore.
  - desktop/macos/Desktop/Sources/MainWindow/ChatFirst/ChatSwitchPerfLog.swift
  - desktop/macos/Desktop/Sources/MainWindow/DesktopHomeView.swift
  - desktop/macos/Desktop/Sources/MainWindow/MemoryHubPage.swift
  # The first-48h activation surfaces (#12608). `home-stage.yaml` drove these
  # through `DashboardPage`; that page is gone, and the Chat route is where they
  # live now — the summary card is transcript chrome and the prefilled draft
  # lands in the one composer.
  - desktop/macos/Desktop/Sources/Automation/DesktopAutomationActivationActions.swift
  # The recap is a thin pill above the transcript that opens the dedicated recap page
  # in a sheet; the full-card view it replaced is retired.
  - desktop/macos/Desktop/Sources/MainWindow/Dashboard/ChatDailyRecapRow.swift
  - desktop/macos/Desktop/Sources/MainWindow/Dashboard/DailyRecapPage.swift
  - desktop/macos/Desktop/Sources/MainWindow/Dashboard/ChatDailySummaryCoordinator.swift
  - desktop/macos/Desktop/Sources/MainWindow/Dashboard/ChatDailySummaryPresentation.swift
  - desktop/macos/Desktop/Sources/MainWindow/Dashboard/AnalyticsManager+DailySummary.swift
  - desktop/macos/Desktop/Sources/MainWindow/Dashboard/HomeDailySummaryStatsRow.swift
  - desktop/macos/Desktop/Sources/MainWindow/Dashboard/HomeDailySummaryStore.swift
  - desktop/macos/Desktop/Sources/Services/APIClient/APIClient+DailySummaries.swift
  - desktop/macos/Desktop/Sources/MainWindow/Dashboard/DayZeroChips.swift
  - desktop/macos/Desktop/Sources/MainWindow/Dashboard/HomeSuggestionsStore.swift
  - desktop/macos/Desktop/Sources/MainWindow/MainChatNavigationRequest.swift
  - desktop/macos/Desktop/Sources/MainWindow/QueryShell/QueryShellHome.swift
preconditions:
  - automation_bridge_ready
  - auth_ready
  - chat_first_cohort_named_bundle

steps:
  - id: S1
    name: Navigate the enabled shell to its canonical Chat route
    bridge.navigate:
      target: chat
      activateApp: false
    wait:
      state.shellVariant: chat_first
      state.chatFirstRoute: chat

  - id: S2
    name: Read mounted Chat-first runtime state without fixture content
    bridge.action:
      name: chat_first_runtime_snapshot
    expect:
      result.detail.route: chat
      result.detail.route_visible: "true"

  - id: S3
    name: Assert stable sidebar accessibility order and VoiceOver labels
    ax.expect:
      identifiers_visible:
        - chat-first-sidebar-chat
        - chat-first-sidebar-conversations
        - chat-first-sidebar-tasks
        - chat-first-sidebar-goals
        - chat-first-sidebar-memories
      focus_order:
        - chat-first-sidebar-chat
        - chat-first-sidebar-conversations
        - chat-first-sidebar-tasks
        - chat-first-sidebar-goals
        - chat-first-sidebar-memories
      voiceover_labels:
        chat-first-sidebar-chat: Chat
        chat-first-sidebar-conversations: Conversations
        chat-first-sidebar-tasks: Tasks
        chat-first-sidebar-goals: Goals
        chat-first-sidebar-memories: Memories

  - id: S4
    name: Activate Goals by its stable accessibility identifier
    ax.activate:
      identifier: chat-first-sidebar-goals

  - id: S5
    name: Navigate from Chat to canonical Goals
    bridge.navigate:
      target: goals
      activateApp: false
    wait:
      state.shellVariant: chat_first
      state.chatFirstRoute: goals

  - id: S6
    name: Prove the mounted Goals surface is visible to the semantic runtime
    bridge.action:
      name: chat_first_runtime_snapshot
    expect:
      result.detail.route: goals
      result.detail.route_visible: "true"

  - id: S7
    name: Navigate from Goals to the shared Tasks surface
    bridge.navigate:
      target: tasks
      activateApp: false
    wait:
      state.shellVariant: chat_first
      state.chatFirstRoute: tasks

  - id: S8
    name: Prove the mounted Tasks surface is visible to the semantic runtime
    bridge.action:
      name: chat_first_runtime_snapshot
    expect:
      result.detail.route: tasks
      result.detail.route_visible: "true"

  - id: S9
    name: Navigate from Tasks to the Omi-device capture archive
    bridge.navigate:
      target: conversations
      activateApp: false
    wait:
      state.shellVariant: chat_first
      state.chatFirstRoute: memories

  - id: S10
    name: Prove the mounted Conversations surface is visible to the semantic runtime
    bridge.action:
      name: chat_first_runtime_snapshot
    expect:
      result.detail.route: memories
      result.detail.route_visible: "true"

  - id: S11
    name: Return to the canonical Chat route
    bridge.navigate:
      target: chat
      activateApp: false
    wait:
      state.shellVariant: chat_first
      state.chatFirstRoute: chat

  # The first-48h activation surfaces, on the route that now owns them. These
  # were `home-stage.yaml` S9-S12; that flow asserted `state.homeMode` first,
  # which only `DashboardPage` ever published, so it went with the page.
  - id: S11a
    name: A prefilled chat request lands in the composer unsent
    # The first-real-app card and the daily-summary follow-up both enter through
    # this one seam (`openMainAppChat(prefilledDraft:)`), which `QueryShellHome`
    # consumes on the Chat route. Nothing may be sent.
    bridge.action:
      name: open_chat_prefilled
      params:
        query: "Summarize what's on my screen"
    expect:
      ok: true

  - id: S11b
    name: The draft is the composer text
    bridge.action:
      name: chat_drafts_snapshot
    expect:
      result.detail.main: "Summarize what's on my screen"

  - id: S11c
    name: Daily summary store answers shape-only
    # Day 0 and quiet days legitimately have no summary; the action must answer either way.
    bridge.action:
      name: daily_summary_snapshot
    expect:
      ok: true
      result.detail.hasSummary: { exists: true }

  - id: S12
    name: Assert the bridge did not report a route failure
    log.expect:
      absent:
        - "DesktopAutomationBridge: failed"
        - "unsupported_route"

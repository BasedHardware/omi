version: 2
name: jit-bounded-proactivity
tier: manual
description: >
  Qualify bounded JIT proactivity through a named non-production app and the
  isolated QA gateway. This is a manual acceptance procedure, not executed CI
  evidence. Retain the serving source SHA, run IDs, and actual gateway receipts.
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/JITProactivityBudget.swift
  - desktop/macos/Desktop/Sources/ProactiveAssistants/Core/JITProactivitySourceProjection.swift
preconditions:
  - reviewed_isolated_qa_cloud_receipt
  - signed_in_allowlisted_qa_account
  - jit_cloud_qa_budget_capability_enabled
  - screen_recording_enabled
  - notifications_enabled
steps:
  - id: S1
    name: Admit a real proactive instruction
    do: "In Chat, create a standing instruction tied to a synthetic document. Read it back and verify the canonical trigger exists for this account. Record the account generation and the QA rollout capability response."
  - id: S2
    name: Produce context and observe delivery
    do: "Open the synthetic document and let the normal context capture producer observe its matching evidence. Retain the event capture time, evaluation time, profile timezone, and execution ID. Verify the private run input contains the source owned legacy, Nano, and final prompt projection with the admitted snapshot hash, and that the content free Nano receipt records the actual request outcome. Observe the actual notification; do not inject a card or reset quotas. Confirm its time-sensitive claim agrees with the captured evidence and evaluation clock."
  - id: S3
    name: Reconcile every provider attempt
    do: "Join the execution to gateway receipts across every tool round. Confirm no more than three provider attempts, output limits of 2048 tokens per attempt, the 32768-byte UTF-8 input envelope, and no more than 50000 micro-USD of estimated provider cost. Compare the gateway attempt IDs and totals with the terminal Pi and Swift provenance. Missing usage must remain unknown and must not appear as zero cost."
  - id: S4
    name: Observe interruption and suppression
    do: "In a separately identified QA run, interrupt a provider request after it starts. Verify the durable reservation prevents a further paid attempt while usage is unknown. Revisit the original context and confirm duplicate notifications remain suppressed under the unchanged daily caps. Keep this result distinct from the successful delivery run."

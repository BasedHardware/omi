version: 2
name: ask-omi-open-benchmark
tier: 3
description: Repeated cursor-free Ask Omi input-feedback gate for the chat-first main-window composer.
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/Automation/DesktopAutomationAskOmiActions.swift
  - desktop/macos/Desktop/Sources/Automation/DesktopAutomationActivationActions.swift
  - desktop/macos/Desktop/Sources/DesktopAutomationBridge.swift
  - desktop/macos/Desktop/Sources/MainWindow/DesktopHomeView.swift
  - desktop/macos/Desktop/Sources/MainWindow/QueryShell/QueryShellHome.swift
  - desktop/macos/Desktop/Sources/MainWindow/QueryShell/QueryShellModel.swift
  - desktop/macos/Desktop/Sources/FloatingControlBar/FloatingControlBarWindow.swift
preconditions:
  - automation_bridge_ready

steps:
  - id: S1
    name: Reset Ask Omi
    bridge.action:
      name: close_ask_omi

  - id: S2
    name: Open Ask Omi 1
    bridge.action:
      name: open_ask_omi
      reset: true
    expect:
      result.detail.target: "main_chat"
      result.detail.elapsedMs:
        max: 100
    wait:
      state.askOmiOpen: true

  - id: S3
    name: Close Ask Omi 1
    bridge.action:
      name: close_ask_omi

  - id: S4
    name: Open Ask Omi 2
    bridge.action:
      name: open_ask_omi
      reset: true
    expect:
      result.detail.target: "main_chat"
      result.detail.elapsedMs:
        max: 100
    wait:
      state.askOmiOpen: true

  - id: S5
    name: Close Ask Omi 2
    bridge.action:
      name: close_ask_omi

  - id: S6
    name: Open Ask Omi 3
    bridge.action:
      name: open_ask_omi
      reset: true
    expect:
      result.detail.target: "main_chat"
      result.detail.elapsedMs:
        max: 100
    wait:
      state.askOmiOpen: true

  - id: S7
    name: Capture Ask Omi Visual
    visual.export:
      name: ask-omi-open
      target: main

  - id: S8
    name: Assert Ask Omi State
    state.expect:
      state.askOmiOpen: true

  - id: S9
    name: Assert Logs Are Clean
    log.expect:
      absent:
        - "DesktopAutomationBridge: failed"
        - "unsupported_route"

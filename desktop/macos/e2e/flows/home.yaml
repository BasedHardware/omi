version: 2
name: home
tier: 2
description: Home tab — verify dashboard state, chat snapshot, settings round-trip (v0.12.119+ redesign)
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/MainWindow/DesktopHomeView.swift
  - desktop/macos/Desktop/Sources/MainWindow/DesktopTopBar.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/FocusPage.swift
preconditions:
  - automation_bridge_ready

steps:
  - id: S1
    name: Navigate to Home
    bridge.navigate:
      target: dashboard
      activateApp: false
    wait:
      state.selectedTabIndex: 0

  - id: S2
    name: Snapshot main chat
    bridge.action:
      name: main_chat_snapshot
      params:
        limit: "5"
    expect:
      ok: true

  - id: S3
    name: Verify auth state
    bridge.action:
      name: auth_token_status
    expect:
      result.detail.signed_in: "true"

  - id: S4
    name: Navigate to Settings and back
    bridge.navigate:
      target: settings
      activateApp: false
    wait:
      state.selectedTabIndex: 9

  - id: S5
    name: Return to Home
    bridge.navigate:
      target: dashboard
      activateApp: false
    wait:
      state.selectedTabIndex: 0

  - id: S6
    name: Logs clean
    log.expect:
      absent:
        - "DesktopAutomationBridge: failed"

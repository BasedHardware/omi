version: 2
name: home
tier: manual
description: Home tab — chat-first panel under the always-on search bar, plus its header controls and Capture/Listening status (v0.12.119+ redesign; the only Home flow since dashboard.yaml was retired with DashboardPage)
app: com.omi.computer-macos
covers:
  - desktop/macos/Desktop/Sources/MainWindow/DesktopHomeView.swift
  - desktop/macos/Desktop/Sources/MainWindow/DesktopTopBar.swift
  - desktop/macos/Desktop/Sources/MainWindow/TopNavigationDestinations.swift
  - desktop/macos/Desktop/Sources/MainWindow/DesktopWindowLayoutPolicy.swift
  - desktop/macos/Desktop/Sources/MainWindow/QueryShell/QueryShellHome.swift
  - desktop/macos/Desktop/Sources/MainWindow/QueryShell/QueryShellModel.swift
  # The four home_* bridge actions this surface observes. (The fifth,
  # home_connect_toggle, refuses here: nothing renders a Connect tray any more.)
  - desktop/macos/Desktop/Sources/Automation/DesktopAutomationHomeStageActions.swift
  - desktop/macos/Desktop/Sources/MainWindow/QueryShell/QueryHeroBar.swift
  - desktop/macos/Desktop/Sources/MainWindow/QueryShell/QuerySearchBar.swift
  - desktop/macos/Desktop/Sources/Analytics/SearchAnalytics.swift
  - desktop/macos/Desktop/Sources/Analytics/AnalyticsManager+Search.swift
  - desktop/macos/Desktop/Sources/MainWindow/QueryShell/QueryResultsPanel.swift
  - desktop/macos/Desktop/Sources/MainWindow/QueryShell/QueryAnswerThread.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/ChatMessagesView.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/ChatPromptTimeline.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/ChatPromptTimelineModel.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/ChatScrollPositionDetector.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/ChatTranscriptGeometry.swift
  - desktop/macos/Desktop/Sources/MainWindow/QueryShell/QueryChatCapability.swift
  - desktop/macos/Desktop/Sources/Chat/ChatCitation.swift
preconditions:
  - auth_ready

steps:
  - id: S1
    name: Verify Home tab is active
    do: "Verify the app opens on the conversation. The top bar shows Home, Memories, Tasks, Rewind and Apps pills. Below it, a search bar with the placeholder 'Search what you've seen and heard…' sits above the chat panel, whose own composer ('Ask a follow-up…') is pinned under the transcript. Typing in the search bar swaps the panel to live-narrowing results; clearing it returns to the chat."
    expect:
      interactive_count: { min: 6 }
      text_visible:
        - Chat

  - id: S2
    name: Verify the two inputs are distinct
    do: "Verify the search bar above the panel is pure search (magnifying glass, no send control) and the chat composer inside the panel carries the conversation controls: text field, paperclip (Attach files), microphone, and the send disc."
    expect:
      interactive_count: { min: 4 }

  - id: S2b
    name: Ask, then stop
    do: "Type a question in the chat composer and press ⏎. The answer streams into the transcript. While it is still streaming, verify the send disc has been replaced by a Stop control in the same slot, and click it. The turn ends without an error card."
    expect:
      interactive_count: { min: 2 }

  - id: S2c
    name: Conversation menu and the way back
    do: "Open the '…' menu in the panel's corner and verify it offers Copy conversation, Clear conversation and AI settings. Type in the search bar and verify the panel shows live-narrowing results; clear it (or press esc) and verify the same conversation returns with no duplicated turns."
    expect:
      interactive_count: { min: 2 }

  - id: S2d
    name: Inline citations preview and open their exact source
    do: "Ask a question grounded in at least one task, memory, or conversation and request citations. After the answer settles, verify its bracketed citation markers are individual focusable controls rather than plain text and no duplicate source rail appears below the answer. Hover a marker and verify an anchored preview shows the source type, title, and bounded summary without moving the transcript. Activate the marker with the pointer, then repeat with Tab and Return; verify the app opens the exact cited task, memory, or conversation rather than the generic destination. Return to Chat and verify the citation remains interactive after journal replay."
    expect:
      interactive_count: { min: 2 }

  - id: S3
    name: Verify Capture and Listening status
    do: "Verify the top-right area shows Capture status (may say 'Capture Blocked' if permission not granted) and Listening status (should show 'Listening On' state). Both should be clickable buttons."
    expect:
      interactive_count: { min: 2 }

  - id: S4
    name: Reach the Brain Map from the panel's filter row
    do: "In results mode, verify the panel header carries a 'Brain Map ›' control beside 'Filter ›' — in the header, not among the All / Conversations / Memories / Rewind chips, which only narrow the list in place. Click it and verify the app lands on the hub's Brain Map page, and that the page carries the '‹ Activity' control (accessibility identifier activity-back-button) back to the spine. Press Escape to return Home."
    expect:
      text_visible:
        - Brain Map

  - id: S5
    name: Verify Settings gear accessible
    do: "Click the Settings gear icon (label 'gearshape') in the top-right area. Verify Settings page opens. Then click Back to return to Home."
    expect:
      text_visible:
        - Settings

  - id: S6
    name: Prompt rail and older messages
    do: "In a long conversation, hover the trailing-edge hairline marks and verify a preview shows the prompt, the start of the reply, and a timestamp. Click a mark and verify the transcript jumps to that prompt. Scroll to the top, click Show older messages or Load earlier messages, and verify the same rows stay in view rather than jumping to the newly loaded oldest message."
    expect:
      interactive_count: { min: 2 }

name: omi_device_first_prototype
description: >-
  Clickable design prototype of a device-first onboarding flow that ends in a
  soft trial paywall, in two visual directions (Graphite and Aurora).
  Self-contained: depends only on Flutter, no backend, Firebase or flavors.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

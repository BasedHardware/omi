{{- if and .Values.enabled .Values.batch.cloudRunRollbackEnabled }}
{{- if or (ne .Values.namespace "prod-omi-backend") (ne .Release.Namespace .Values.namespace) }}
{{- fail "batch rollback is approved only in prod-omi-backend" }}
{{- end }}
{{- if ne .Values.batch.gcpServiceAccount "omi-batch-rollback-guard@based-hardware.iam.gserviceaccount.com" }}
{{- fail "batch rollback requires the dedicated approved GSA" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-batch
  namespace: {{ .Values.namespace }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.batch.gcpServiceAccount | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-batch-state
  namespace: {{ .Values.namespace }}
data:
  state: '{}'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-batch
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ .Release.Name }}-batch-state]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-batch
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-batch
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-batch
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-batch
  namespace: {{ .Values.namespace }}
spec:
  schedule: '*/5 * * * *'
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 840
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: incluster-batch-guard
        spec:
          serviceAccountName: {{ .Release.Name }}-batch
          restartPolicy: Never
          tolerations: []
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: cloud.google.com/gke-accelerator
                        operator: DoesNotExist
                      - key: service
                        operator: NotIn
                        values: [parakeet, batch-pipeline]
                      - key: cloud.google.com/gke-nodepool
                        operator: NotIn
                        values: [parakeet-pool, parakeet-pool-v2, batch-pipeline-pool]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: batch-guard
              image: {{ .Values.image | quote }}
              command: [python3, /guard/batch_guard.py]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 25m
                  memory: 48Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: DRY_RUN
                  value: {{ .Values.dryRun | quote }}
                - name: NAMESPACE
                  value: {{ .Values.namespace | quote }}
                - name: STATE_NAME
                  value: {{ printf "%s-batch-state" .Release.Name | quote }}
              volumeMounts:
                - name: script
                  mountPath: /guard
                  readOnly: true
                - name: safety
                  mountPath: /safety
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: {{ .Release.Name }}-script
            - name: safety
              configMap:
                name: {{ .Values.batch.safetyConfigMap | quote }}
                optional: true
{{- end }}

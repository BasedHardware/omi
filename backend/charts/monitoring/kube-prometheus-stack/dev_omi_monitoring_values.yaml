grafana:
  enabled: true
  serviceAccount:
    create: true
    annotations:
      iam.gke.io/gcp-service-account: "dev-omi-grafana-gsa@based-hardware-dev.iam.gserviceaccount.com"
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: "gce"
      kubernetes.io/ingress.global-static-ip-name: "dev-omi-grafana-alb-ip-address"
      networking.gke.io/managed-certificates: "dev-omi-grafana-alb-cert"
      kubernetes.io/ingress.allow-http: "false"
    hosts:
      - monitor.omiapi.com
    path: /
  persistence:
    enabled: true
    type: sts
    storageClassName: standard-rwo
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    finalizers:
      - kubernetes.io/pvc-protection
  imageRenderer:
    enabled: true
  grafana.ini:
    # Grafana v12.1.0 conf/defaults.ini [database] and
    # pkg/services/sqlstore/database_config.go (https://github.com/grafana/grafana/tree/v12.1.0).
    # 2026-10-12 prod lock bursts: 03:02Z (11 lines), 09:02Z (67 lines);
    # evaluation ticks dropped, API 500/502 (32.7s GET), probes failed.
    # SQLite-only wal/query_retries/transaction_retries; defaults false/0/5.
    # Keep the existing sqlite3 type, grafana.db path and PVC. No busy_timeout INI option.
    database:
      wal: true
      query_retries: 10
      transaction_retries: 10
    rendering:
      server_url: http://dev-kube-prometheus-stack-grafana-image-renderer:8081/render
      callback_url: http://dev-kube-prometheus-stack-grafana:80/
    # Alert screenshots off (2026-10-13): renders call back into Grafana, so a slow
    # dashboard query stalled HTTP handlers and the external health check flapped 502.
    # Telegram notifications carry dashboard/panel links instead.
    unified_alerting.screenshots:
      capture: false
    server:
      root_url: https://monitor.omiapi.com/
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: service
                operator: In
                values:
                  - monitoring
              - key: env
                operator: In
                values:
                  - dev

prometheus:
  enabled: true
  prometheusSpec:
    secrets:
      - metrics-scrape-token
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Delete
    # Define metrics retention period
    retention: 10d
    resources:
      requests:
        cpu: "1"
        memory: 2G
      limits:
        cpu: "2"
        memory: 4Gi
    storageSpec:
    # Using PersistentVolumeClaim
      volumeClaimTemplate:
        spec:
          storageClassName: standard-rwo
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    additionalScrapeConfigs:
      # Additional scrape configs for Deepgram Engine metrics
      - job_name: "dg_engine_metrics"
        scrape_interval: "2s"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - "dev-omi-dg-self-hosted"
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: "(.*)-metrics"
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: "metrics"
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: gpu-metrics
        scrape_interval: 1s
        metrics_path: /metrics
        scheme: http
        kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
            - gke-managed-system
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_node_name]
          action: replace
          target_label: kubernetes_node
      - job_name: backend-listen-metrics
        scrape_interval: 15s
        metrics_path: /metrics
        scheme: http
        authorization:
          type: Bearer
          credentials_file: /etc/prometheus/secrets/metrics-scrape-token/token
        kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
              - dev-omi-backend
        relabel_configs:
          # Scope the development Prometheus instance to development targets
          # even if a future discovery change widens its Kubernetes RBAC.
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: dev-omi-backend
          - source_labels: [__meta_kubernetes_pod_label_env]
            action: keep
            regex: dev
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: backend-listen
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_label_env]
            target_label: environment
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: pusher-metrics
        scrape_interval: 15s
        metrics_path: /metrics
        scheme: http
        authorization:
          type: Bearer
          credentials_file: /etc/prometheus/secrets/metrics-scrape-token/token
        kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
              - dev-omi-backend
        relabel_configs:
          # The development job must never discover a production Pusher pod.
          # Namespace and immutable dev workload-label checks are deliberately
          # both retained as independent isolation boundaries.
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: dev-omi-backend
          - source_labels: [__meta_kubernetes_pod_label_env]
            action: keep
            regex: dev
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: pusher
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_label_env]
            target_label: environment
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: llm-gateway-metrics
        scrape_interval: 15s
        metrics_path: /metrics
        scheme: http
        authorization:
          type: Bearer
          credentials_file: /etc/prometheus/secrets/metrics-scrape-token/token
        kubernetes_sd_configs:
        - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: llm-gateway
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: prometheus-stackdriver-metrics
        scrape_interval: 1s
        metrics_path: /metrics
        scheme: http
        kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
              - "dev-omi-monitoring"
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: "(.*)-prometheus-stackdriver-exporter"
            action: keep
      # Two exporter releases feed this one job (GMP cluster=__run__):
      # dev-omi-cloud-run-metrics-exporter imports every omi_* family from the
      # non-sync Cloud Run services; dev-omi-cloud-run-sync-metrics-exporter
      # imports only the consumed families from the sync services. Keeping one job
      # name keeps every job="cloud-run-application-metrics" query, min(up) and
      # max(stackdriver_monitoring_last_scrape_error) covering both.
      - job_name: cloud-run-application-metrics
        # A prod scrape is ~28MB and takes 6-10s because the exporter queries
        # Cloud Monitoring inline. The default 10s scrape_timeout cut every
        # collection off mid-flight and recorded 0 samples, so the budget has to
        # exceed a slow scrape, and the interval has to exceed the budget.
        scrape_interval: 60s
        scrape_timeout: 45s
        metrics_path: /metrics
        scheme: http
        kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
              - "dev-omi-monitoring"
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: "dev-omi-cloud-run-(sync-)?metrics-exporter"
            action: keep
        metric_relabel_configs:
          # The Stackdriver exporter mangles every imported name into
          # stackdriver_<resource>_<metric type>_<value type>. Left alone, Cloud
          # Run would deliver omi_journey_accepted_total as
          # stackdriver_prometheus_target_prometheus_googleapis_com_omi_journey_accepted_total_counter
          # and every existing alert, recording rule, and dashboard would keep
          # matching nothing — metrics arriving while alerts stay unfirable is
          # the exact failure this whole ingestion path exists to end.
          # Rewrite back to the plain name so GKE-sourced and Cloud Run-sourced
          # series are one metric, distinguished by their service_name label.
          - source_labels: [__name__]
            regex: "stackdriver_prometheus_target_prometheus_googleapis_com_(omi_.+?)_(counter|gauge|histogram|summary|untyped|unknown)(_bucket|_sum|_count)?"
            target_label: __name__
            replacement: "${1}${3}"
          # Aggregates written through the Cloud Monitoring custom-metric API
          # (omi_sync_phase_* from backend-sync) arrive as
          # stackdriver_generic_task_custom_googleapis_com_<name>, with no value-type
          # suffix. Same rewrite, same plain namespace.
          - source_labels: [__name__]
            regex: "stackdriver_generic_task_custom_googleapis_com_(omi_.+)"
            target_label: __name__
            replacement: "${1}"
          # Prometheus client libraries emit a _created timestamp gauge beside every
          # counter. They survive the rewrite above as omi_*_created and are 36% of
          # everything this job imports (19,087 of 52,607 prod series) while
          # answering no question any alert or dashboard asks. Drop them after the
          # rename so the rule reads in the plain namespace people query.
          - source_labels: [__name__]
            regex: "omi_.*_created"
            action: drop
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: service
                  operator: In
                  values:
                    - monitoring
                - key: env
                  operator: In
                  values:
                    - dev

kube-state-metrics:
  enabled: true
  metricLabelsAllowlist:
    - namespaces=[{{ .Release.Namespace }}],deployments=[app]

nodeExporter:
  enabled: true

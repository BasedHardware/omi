## GKE manages the Kubernetes control plane; these customer-cluster scrape
## targets do not exist and their default "down" alerts would page forever.
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false

# 2026-10-13 cost audit: no committed consumer or live recording/alert rule
# reads feature inventories, REST-client byte sizes, or probe duration histograms.
# Keep probe result counters and all kubelet latency/error signals in use.
kubelet:
  serviceMonitor:
    metricRelabelings:
      # Preserve chart 75.15.1's default: Helm replaces this entire list.
      - action: drop
        sourceLabels: [__name__, le]
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
      - action: drop
        sourceLabels: [__name__]
        regex: kubernetes_feature_enabled|rest_client_(request|response)_size_bytes_(bucket|sum|count)
    probesMetricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: prober_probe_duration_seconds_(bucket|sum|count)

# Grafana owns alert evaluation. In pinned chart 75.15.1 these groups contain
# only alerts. Keep defaultRules.create and every recording-rule group enabled;
# all 81 recording rules used by bundled dashboards/downstream queries remain.
defaultRules:
  rules:
    alertmanager: false
    configReloaders: false
    etcd: false
    general: false
    kubeApiserverSlos: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeStateMetrics: false
    kubernetesApps: false
    kubernetesResources: false
    kubernetesStorage: false
    kubernetesSystem: false
    network: false
    nodeExporterAlerting: false
    prometheus: false
    prometheusOperator: false

# Native Prometheus alerts are disabled above; Grafana routes directly to
# Telegram/Instatus. Live Loki 3.5.2 has no Alertmanager URL (empty means no
# notifier destinations), so the legacy Alertmanager has no remaining producer.
# Its live data volume is emptyDir; no Alertmanager PVC exists.
alertmanager:
  enabled: false

grafana:
  enabled: true
  # Canvas raw SVG field icons require 13.x; match the board owner's tested host.
  image:
    tag: 13.1.3
  # Chart75's plugins key emits GF_INSTALL_PLUGINS, ignored by13 unless forced.
  # Use the supported synchronous installer (also exercised in local13 QA).
  env:
    GF_PLUGINS_PREINSTALL_SYNC: yesoreyeram-infinity-datasource@4.1.1
  # Grafana 13 refuses to start with the default [rendering] renderer_token in
  # production (2026-10-16 crash loop). Secret grafana-renderer-token is created
  # out of band; the renderer reads the same value as AUTH_TOKEN.
  envValueFrom:
    GF_RENDERING_RENDERER_TOKEN:
      secretKeyRef:
        name: grafana-renderer-token
        key: token
  # Server admin (user 1, omi_admin_prod) lives in an out-of-band secret so a
  # helm upgrade with --reuse-values cannot overwrite it with the chart default.
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  # Parent bootstrap supplies the allocated org ID; never default to monitoring.
  service:
    annotations:
      cloud.google.com/backend-config: '{"default":"grafana-private-embed"}'
  envFromConfigMaps:
    - name: grafana-business-runtime
  datasources:
    business.yaml:
      apiVersion: 1
      datasources:
        - name: Omi Admin Stats
          uid: omi-admin-api
          orgId: ${OMI_GRAFANA_BUSINESS_ORG_ID}
          type: yesoreyeram-infinity-datasource
          access: proxy
          url: http://127.0.0.1:8899
          editable: false
          jsonData:
            auth_method: none
            timeoutInSeconds: 420
            allowedHosts: [http://127.0.0.1:8899]
  extraConfigmapMounts:
    - name: stats-proxy
      mountPath: /opt/omi-stats
      configMap: grafana-stats-proxy
      readOnly: true
  extraContainers: |
      - name: stats-proxy
        image: python:3.13.12-slim-bookworm@sha256:a58daefb915e1e03ad48f3ca4df8832065412c5c35cacb9d39f4229184de12b6
        command: [python, -B, /opt/omi-stats/stats_proxy.py]
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 25m
            memory: 48Mi
          limits:
            cpu: 200m
            memory: 192Mi
        volumeMounts:
          - name: stats-proxy
            mountPath: /opt/omi-stats
            readOnly: true
        readinessProbe:
          exec:
            command: [python, -c, "import socket; socket.create_connection(('127.0.0.1',8899),2).close()"]
          periodSeconds: 15
          timeoutSeconds: 3
  sidecar:
    datasources:
      alertmanager:
        enabled: false
  # Do not prune existing SQLite datasource records during this retirement.
  # 2026-10-14: Grafana ran with no requests/limits (BestEffort) on the ~1.93
  # allocatable-core monitoring node while Prometheus sustained 1.5-2.2 cores
  # and pinned it for hours, so kubelet probes and Grafana's own HTTP server
  # starved: /api/health returned 502 externally and alert provisioning timed
  # out. Requests give the alerting UI a guaranteed CPU share; sized from
  # measured peaks (214m CPU, 241Mi during the 2026-10-14 evaluation storm).
  # Grafana 13 was OOMKilled at 1Gi three times on 2026-10-16 (15:18, 15:19,
  # 15:51Z), each at the end of an internet scanner burst (~300 unauthenticated
  # .env/secrets probes in ~70s) while steady-state working set stays ~260-510Mi.
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 2Gi
  serviceAccount:
    create: true
    annotations:
      iam.gke.io/gcp-service-account: "prod-omi-grafana-gsa@based-hardware.iam.gserviceaccount.com"
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: "gce"
      kubernetes.io/ingress.global-static-ip-name: "prod-omi-grafana-alb-ip-address"
      networking.gke.io/managed-certificates: "prod-omi-grafana-alb-cert"
      kubernetes.io/ingress.allow-http: "false"
    hosts:
      - monitor.omi.me
    path: /
  persistence:
    enabled: true
    type: sts
    storageClassName: standard-rwo
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    finalizers:
      - kubernetes.io/pvc-protection
  imageRenderer:
    enabled: true
    envValueFrom:
      AUTH_TOKEN:
        secretKeyRef:
          name: grafana-renderer-token
          key: token
  grafana.ini:
    # Grafana v13.1.3 conf/defaults.ini [database] and
    # pkg/services/sqlstore/database_config.go (https://github.com/grafana/grafana/tree/v13.1.3).
    # 2026-10-12 prod lock bursts: 03:02Z (11 lines), 09:02Z (67 lines);
    # evaluation ticks dropped, API 500/502 (32.7s GET), probes failed.
    # SQLite-only wal/query_retries/transaction_retries; defaults false/0/10.
    # Keep the existing sqlite3 type, grafana.db path and PVC. No busy_timeout INI option.
    database:
      wal: true
      query_retries: 10
      transaction_retries: 10
    rendering:
      server_url: http://prod-omi-kube-prometheus-stack-grafana-image-renderer:8081/render
      callback_url: http://prod-omi-kube-prometheus-stack-grafana:80/
    # Alert screenshots off (2026-10-13): renders call back into Grafana, so a slow
    # dashboard query stalled HTTP handlers and the external health check flapped 502.
    # Telegram notifications carry dashboard/panel links instead.
    unified_alerting.screenshots:
      capture: false
    auth.anonymous:
      enabled: false
    auth.jwt:
      enabled: true
      header_name: X-Omi-Grafana-JWT
      url_login: true
      auto_sign_up: true
      username_claim: sub
      email_claim: email
      jwk_set_url: https://admin.omi.me/api/grafana/jwks
      cache_ttl: 1m
      expect_claims: '{"iss":"https://admin.omi.me","aud":"https://monitor.omi.me","purpose":"omi-business-embed"}'
      org_attribute_path: orgs
      org_mapping: 'business:${OMI_GRAFANA_BUSINESS_ORG_ID}:Viewer'
      role_attribute_strict: true
      allow_assign_grafana_admin: false
    security:
      allow_embedding: true
      cookie_secure: true
      cookie_samesite: none
      content_security_policy: true
      # Preserve v13.1.3 defaults.ini CSP; INI triple quotes retain semicolon-separated directives.
      content_security_policy_template: >-
        """script-src 'self' 'unsafe-eval' 'unsafe-inline' 'strict-dynamic' $NONCE;
        object-src 'none';font-src 'self';style-src 'self' 'unsafe-inline' blob:;
        img-src * data:;base-uri 'self';
        connect-src 'self' grafana.com ws://$ROOT_PATH wss://$ROOT_PATH;
        manifest-src 'self';media-src 'none';form-action 'self' $FORM_ACTION_ADDITIONAL_HOSTS;
        frame-ancestors https://admin.omi.me;"""
    server:
      root_url: https://monitor.omi.me/
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: service
                operator: In
                values:
                  - monitoring
              - key: env
                operator: In
                values:
                  - prod

# 2026-10-14: the operator ran BestEffort on the monitoring node and was
# SIGTERM-killed by its own liveness probe 48 times in 31h whenever Prometheus
# pinned the node's CPU. Requests buy it a guaranteed share (measured use:
# 2-25m CPU, 25Mi). Probe timeout stays at the chart default. The chart key is
# prometheusOperator; a top-level "operator:" key is silently ignored.
prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

prometheus:
  enabled: true
  # Stage 1: keep query traffic on the existing history while replica 1 warms.
  # Chart 75.15.1 has no Service selector override; extraManifests below owns
  # the SAME Service identity. Restore the native Service in a separate change
  # only after >=7d continuous history and per-replica active-query parity.
  service:
    enabled: false
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  prometheusSpec:
    replicas: 2
    # Custom affinity below combines required node separation and preferred zone
    # separation. The existing monitoring-pool has only us-central1-a nodes;
    # required zone anti-affinity would leave replica 1 Pending.
    podAntiAffinity: ""
    secrets:
      - metrics-scrape-token
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
    # Define metrics retention period
    retention: 10d
    # Preserve the live cap within the existing 100Gi PVC.
    retentionSize: 80GB
    resources:
      requests:
        cpu: "1"
        # 2026-10-21: request matches steady-state use (5.4-7.8Gi) so the
        # scheduler accounts for it; both e2-highmem-4 monitoring nodes fit it.
        memory: 8Gi
      limits:
        # 2026-10-14 review: keep "2". Prometheus load is sustained, not
        # bursty - 1.5-2.2 cores across 14h with the node pinned near its
        # 1930m allocatable, 0% CFS throttling, and the apparent ~2.9-core
        # spikes were an artifact of kubelet scrapes timing out mid-sample.
        # A lower cap (1600m was attempted and reverted in review) would
        # throttle evaluation of the already-timeout-prone Prometheus-backed
        # rules (omi-stt-fallback-leg-dead, omi-stt-leg-lifecycle-gap) and
        # stall the adapter's custom-metrics reads behind every HPA. Node
        # starvation is fixed with requests (Grafana/operator below, adapter
        # and Loki read path in their values files) plus the 4-vCPU pool
        # resize runbook in the monitoring README - not by shrinking this.
        # 2026-10-21: raised to "3". At 2.25M head series replica 0 ran at
        # 1.73 cores and rules with 6h-7d ranges hit Grafana's 30s evaluation
        # limit (omi-stt-fallback-leg-dead, omi-slo-chat-warning,
        # omi-slo-live-warning). The pool is now e2-highmem-4 (3920m allocatable).
        cpu: "3"
        # 2026-09-28: Prometheus restored 2.56M head series from 24 WAL segments,
        # then OOM-killed shortly after replay completed at the 4Gi limit. The
        # request stays 2G because the monitoring node's requests are ~94% committed.
        # 2026-10-21: head series reached 2.25M (Cloud Run bridge 835k,
        # backend-sync 456k) with RSS at 7.8Gi of 8Gi, the same edge as 09-28.
        # 14Gi leaves WAL-replay headroom on the 28.9Gi e2-highmem-4 nodes.
        memory: 14Gi
    storageSpec:
    # Using PersistentVolumeClaim
      volumeClaimTemplate:
        spec:
          storageClassName: standard-rwo
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              # Match the already-expanded production PVC and StatefulSet claim.
              storage: 100Gi
    additionalScrapeConfigs:
      # HPA adapter reads THIS Prometheus, not GMP. Scrape each batch pod once
      # and carry the Kubernetes resource labels expected by custom.metrics.
      - job_name: diarizer-batch-metrics
        scrape_interval: 15s
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [prod-omi-backend]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            regex: prod-omi-diarizer-batch
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: http
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      # Additional scrape configs for Deepgram Engine metrics
      - job_name: "dg_engine_metrics"
        scrape_interval: "2s"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - "prod-omi-dg-self-hosted"
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: "(.*)-metrics"
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: "metrics"
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: gpu-metrics
        scrape_interval: 1s
        metrics_path: /metrics
        scheme: http
        kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
            - gke-managed-system
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_node_name]
          action: replace
          target_label: kubernetes_node
      - job_name: backend-listen-metrics
        scrape_interval: 15s
        metrics_path: /metrics
        scheme: http
        authorization:
          type: Bearer
          credentials_file: /etc/prometheus/secrets/metrics-scrape-token/token
        kubernetes_sd_configs:
        - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: backend-listen
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          # Keep canary telemetry, but distinguish it from main HPA input.
          - source_labels: [__meta_kubernetes_pod_label_track]
            target_label: listen_track
      - job_name: pusher-metrics
        scrape_interval: 15s
        metrics_path: /metrics
        scheme: http
        authorization:
          type: Bearer
          credentials_file: /etc/prometheus/secrets/metrics-scrape-token/token
        kubernetes_sd_configs:
        - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: pusher
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: llm-gateway-metrics
        scrape_interval: 15s
        metrics_path: /metrics
        scheme: http
        authorization:
          type: Bearer
          credentials_file: /etc/prometheus/secrets/metrics-scrape-token/token
        kubernetes_sd_configs:
        - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: llm-gateway
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: prometheus-stackdriver-metrics
        # LB and Firestore source metrics resolve at 60s. HPA rate/average
        # windows are 5m; Firestore alert windows are 1h/6h. The exporter's
        # 3m query interval and 1m offset remain unchanged for ingestion lag.
        scrape_interval: 60s
        metrics_path: /metrics
        scheme: http
        kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
              - "prod-omi-monitoring"
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: "(.*)-prometheus-stackdriver-exporter"
            action: keep
      # Two exporter releases feed this one job (GMP cluster=__run__):
      # prod-omi-cloud-run-metrics-exporter imports every omi_* family from the
      # non-sync Cloud Run services; prod-omi-cloud-run-sync-metrics-exporter
      # imports only the consumed families from the sync services. Keeping one job
      # name keeps every job="cloud-run-application-metrics" query, min(up) and
      # max(stackdriver_monitoring_last_scrape_error) covering both.
      - job_name: cloud-run-application-metrics
        # A prod scrape is ~28MB and takes 6-10s because the exporter queries
        # Cloud Monitoring inline. The default 10s scrape_timeout cut every
        # collection off mid-flight and recorded 0 samples, so the budget has to
        # exceed a slow scrape, and the interval has to exceed the budget.
        # Every scrape is a full timeSeries.list of each imported family, billed per
        # time series returned (SKU 6E35-67F5-C3C6, "Time series billed count"), and
        # both Prometheus replicas scrape independently. At 60s this cost ~$50/day on
        # 2026-10-16 for data Cloud Run only writes every 60s anyway. 120s halves the
        # bill; no rule reads these families over a window shorter than 5m, which
        # still holds 2-3 samples. Do not drop below 120s without re-pricing.
        scrape_interval: 120s
        scrape_timeout: 45s
        metrics_path: /metrics
        scheme: http
        kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
              - "prod-omi-monitoring"
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: "prod-omi-cloud-run-(sync-)?metrics-exporter"
            action: keep
        metric_relabel_configs:
          # The Stackdriver exporter mangles every imported name into
          # stackdriver_<resource>_<metric type>_<value type>. Left alone, Cloud
          # Run would deliver omi_journey_accepted_total as
          # stackdriver_prometheus_target_prometheus_googleapis_com_omi_journey_accepted_total_counter
          # and every existing alert, recording rule, and dashboard would keep
          # matching nothing — metrics arriving while alerts stay unfirable is
          # the exact failure this whole ingestion path exists to end.
          # Rewrite back to the plain name so GKE-sourced and Cloud Run-sourced
          # series are one metric, distinguished by their service_name label.
          - source_labels: [__name__]
            regex: "stackdriver_prometheus_target_prometheus_googleapis_com_(omi_.+?)_(counter|gauge|histogram|summary|untyped|unknown)(_bucket|_sum|_count)?"
            target_label: __name__
            replacement: "${1}${3}"
          # Aggregates written through the Cloud Monitoring custom-metric API
          # (omi_sync_phase_* from backend-sync) arrive as
          # stackdriver_generic_task_custom_googleapis_com_<name>, with no value-type
          # suffix. Same rewrite, same plain namespace.
          - source_labels: [__name__]
            regex: "stackdriver_generic_task_custom_googleapis_com_(omi_.+)"
            target_label: __name__
            replacement: "${1}"
          # Prometheus client libraries emit a _created timestamp gauge beside every
          # counter. They survive the rewrite above as omi_*_created and are 36% of
          # everything this job imports (19,087 of 52,607 prod series) while
          # answering no question any alert or dashboard asks. Drop them after the
          # rename so the rule reads in the plain namespace people query.
          - source_labels: [__name__]
            regex: "omi_.*_created"
            action: drop
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus
                operator.prometheus.io/name: prod-omi-kube-prometheus-s-prometheus
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: prometheus
                  operator.prometheus.io/name: prod-omi-kube-prometheus-s-prometheus
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: service
                  operator: In
                  values:
                    - monitoring
                - key: env
                  operator: In
                  values:
                    - prod

kube-state-metrics:
  enabled: true
  metricLabelsAllowlist:
    - namespaces=[{{ .Release.Namespace }}],deployments=[app]

nodeExporter:
  enabled: true

# Temporary warm-up pin. Helm matches kind/name/namespace, so moving the native
# Service into extraManifests preserves its ClusterIP and both consumer URLs.
# Stage 2 removes both temporary Services AND restores prometheus.service.enabled: true.
extraManifests:
  prometheusWarmupService: |
    apiVersion: v1
    kind: Service
    metadata:
      name: {{ template "kube-prometheus-stack.fullname" . }}-prometheus
      namespace: {{ template "kube-prometheus-stack.namespace" . }}
      labels:
        app: {{ template "kube-prometheus-stack.name" . }}-prometheus
        # Query routing is pinned; self-scrapes use the unpinned Service below.
        self-monitor: "false"
        {{- include "kube-prometheus-stack.labels" . | nindent 4 }}
    spec:
      type: ClusterIP
      ports:
        - name: {{ .Values.prometheus.prometheusSpec.portName }}
          port: 9090
          targetPort: 9090
        - name: reloader-web
          appProtocol: http
          port: 8080
          targetPort: reloader-web
      publishNotReadyAddresses: false
      sessionAffinity: None
      selector:
        app.kubernetes.io/name: prometheus
        operator.prometheus.io/name: {{ template "kube-prometheus-stack.prometheus.crname" . }}
        statefulset.kubernetes.io/pod-name: prometheus-prod-omi-kube-prometheus-s-prometheus-0

  prometheusSelfMonitorService: |
    apiVersion: v1
    kind: Service
    metadata:
      name: {{ template "kube-prometheus-stack.fullname" . }}-prometheus-selfmonitor
      namespace: {{ template "kube-prometheus-stack.namespace" . }}
      labels:
        app: {{ template "kube-prometheus-stack.name" . }}-prometheus
        self-monitor: "true"
        {{- include "kube-prometheus-stack.labels" . | nindent 4 }}
    spec:
      type: ClusterIP
      ports:
        - name: {{ .Values.prometheus.prometheusSpec.portName }}
          port: 9090
          targetPort: 9090
        - name: reloader-web
          appProtocol: http
          port: 8080
          targetPort: reloader-web
      publishNotReadyAddresses: false
      selector:
        app.kubernetes.io/name: prometheus

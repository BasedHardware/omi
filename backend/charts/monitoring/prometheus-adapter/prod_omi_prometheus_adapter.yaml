prometheus:
  url: http://prod-omi-kube-prometheus-s-prometheus.{{ .Release.Namespace }}.svc
# 2026-10-14: the adapter ran BestEffort on the monitoring node and its liveness
# probe timed out 35 times in 31h whenever Prometheus pinned the node's CPU,
# breaking HPA custom-metrics reads on every restart. Requests buy a guaranteed
# CPU share; sized generously over measured use (9m CPU, 35Mi at rest).
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
rules:
  default: false
  external:
    - name:
        as: "backend_listen_active_ws_connections_per_pod"
      # Unlabeled main pods remain eligible; coordinator canaries use track=canary.
      seriesQuery: 'backend_listen_active_ws_connections{listen_track!="canary"}'
      metricsQuery: 'avg(backend_listen_active_ws_connections{job="backend-listen-metrics",listen_track!="canary"})'
      resources:
        overrides:
          namespace: { resource: "namespace" }
    - name:
        as: "pusher_active_ws_connections_per_pod"
      seriesQuery: 'pusher_active_ws_connections'
      metricsQuery: 'avg(pusher_active_ws_connections{job="pusher-metrics"})'
      resources:
        overrides:
          namespace: { resource: "namespace" }
    # p99 VAD request latency from the internal HTTPS LB histogram for HPA
    - name:
        as: "vad_request_latency_p99"
      seriesQuery: 'stackdriver_internal_http_lb_rule_loadbalancing_googleapis_com_https_internal_backend_latencies_bucket{backend_target_name="k8s1-5245918b-prod-omi-backend-prod-omi-vad-8080-cb5bc8b7"}'
      metricsQuery: 'histogram_quantile(0.99, sum by (le) (rate(stackdriver_internal_http_lb_rule_loadbalancing_googleapis_com_https_internal_backend_latencies_bucket{backend_target_name="k8s1-5245918b-prod-omi-backend-prod-omi-vad-8080-cb5bc8b7"}[5m])))'
      resources:
        overrides:
          namespace: { resource: "namespace" }
    # p99 Diarizer request latency from the internal HTTPS LB histogram for HPA
    - name:
        as: "diarizer_request_latency_p99"
      seriesQuery: 'stackdriver_internal_http_lb_rule_loadbalancing_googleapis_com_https_internal_backend_latencies_bucket{backend_target_name="k8s1-5245918b-prod-omi-backend-prod-omi-diarizer-8080-cb654677"}'
      metricsQuery: 'histogram_quantile(0.99, sum by (le) (rate(stackdriver_internal_http_lb_rule_loadbalancing_googleapis_com_https_internal_backend_latencies_bucket{backend_target_name="k8s1-5245918b-prod-omi-backend-prod-omi-diarizer-8080-cb654677"}[5m])))'
      resources:
        overrides:
          namespace: { resource: "namespace" }
    - name:
        as: "backend_listen_response_code_500"
      seriesQuery: 'stackdriver_https_lb_rule_loadbalancing_googleapis_com_https_backend_request_count{backend_target_name="custom-domains-api-omi-me-backend-listen-49a4-be"}'
      metricsQuery: 'avg(stackdriver_https_lb_rule_loadbalancing_googleapis_com_https_backend_request_count{response_code="500", backend_target_name="custom-domains-api-omi-me-backend-listen-49a4-be"}) or vector(0)'
      resources:
        overrides:
          namespace: { resource: "namespace" }
    - name:
        as: "backend_listen_requests_per_pod"
      seriesQuery: 'stackdriver_https_lb_rule_loadbalancing_googleapis_com_https_backend_request_count{backend_target_name="custom-domains-api-omi-me-backend-listen-49a4-be"}'
      metricsQuery: 'avg_over_time((sum(stackdriver_https_lb_rule_loadbalancing_googleapis_com_https_backend_request_count{backend_target_name="custom-domains-api-omi-me-backend-listen-49a4-be"})/sum(kube_deployment_status_replicas{deployment="prod-omi-backend-listen"}))[5m:])'
      resources:
        overrides:
          namespace: { resource: "namespace" }
    - name:
        as: "engine_active_requests_stt_streaming"
      seriesQuery: 'engine_active_requests{kind="stream"}'
      metricsQuery: 'avg(engine_active_requests{kind="stream"})'
      resources:
        overrides:
          namespace: { resource: "namespace" }
          pod: { resource: "pod" }
          service: { resource: "service" }
    - name:
        as: "engine_active_requests_stt_batch"
      seriesQuery: 'engine_active_requests{kind="batch"}'
      metricsQuery: 'avg(engine_active_requests{kind="batch"})'
      resources:
        overrides:
          namespace: { resource: "namespace" }
          pod: { resource: "pod" }
          service: { resource: "service" }
    - name:
        as: "engine_active_requests_tts_batch"
      seriesQuery: 'engine_active_requests{kind="tts"}'
      metricsQuery: 'avg(engine_active_requests{kind="tts"})'
      resources:
        overrides:
          namespace: { resource: "namespace" }
          pod: { resource: "pod" }
          service: { resource: "service" }
    - name:
        as: "engine_estimated_stream_capacity"
      seriesQuery: 'engine_active_requests{kind="stream"}'
      metricsQuery: 'avg_over_time((sum(engine_active_requests{kind="stream"}) / sum(engine_estimated_stream_capacity))[1m:1m])'
      resources:
        overrides:
          namespace: { resource: "namespace" }
          pod: { resource: "pod" }
          service: { resource: "service" }
    - name:
        as: "engine_requests_active_to_max_ratio"
      seriesQuery: "engine_max_active_requests"
      metricsQuery: "avg_over_time((sum(engine_active_requests) / sum(engine_max_active_requests))[1m:1m])"
      resources:
        overrides:
          namespace: { resource: "namespace" }
          pod: { resource: "pod" }
          service: { resource: "service" }
    - metricsQuery: histogram_quantile(0.99, sum(rate(parakeet_request_duration_seconds_bucket{<<.LabelMatchers>>}[2m])) by (le))
      name:
        as: parakeet_request_latency_p99
      resources:
        overrides:
          namespace:
            resource: namespace
      seriesQuery: parakeet_request_duration_seconds_bucket{namespace!=""}
    - metricsQuery: avg(avg_over_time(DCGM_FI_DEV_GPU_UTIL{container="parakeet",<<.LabelMatchers>>}[1m]))
      name:
        as: parakeet_gpu_utilization
      resources:
        overrides:
          namespace:
            resource: namespace
      seriesQuery: DCGM_FI_DEV_GPU_UTIL{container="parakeet",namespace!=""}
    # Keep for the prod NLLB chart's concurrency HPA, even while live is CPU-only.
    - name:
        as: "nllb_active_requests_total"
      seriesQuery: 'nllb_active_requests{namespace!=""}'
      metricsQuery: 'sum(nllb_active_requests{<<.LabelMatchers>>})'
      resources:
        overrides:
          namespace: { resource: "namespace" }
  custom:
    # Queue ages are refreshed by the GPU owner, independent of pressure polls.
    - seriesQuery: 'parakeet_batch_lane_oldest_pending_seconds{namespace!="",pod!="",lane="live"}'
      resources:
        overrides:
          namespace: {resource: namespace}
          pod: {resource: pod}
      name:
        as: parakeet_live_queue_age_seconds
      metricsQuery: 'max(parakeet_batch_lane_oldest_pending_seconds{<<.LabelMatchers>>,lane="live"}) by (<<.GroupBy>>)'
    # Queue ages are refreshed by the GPU owner, independent of pressure polls.
    - seriesQuery: 'parakeet_batch_lane_oldest_pending_seconds{namespace!="",pod!="",lane="backfill"}'
      resources:
        overrides:
          namespace: {resource: namespace}
          pod: {resource: pod}
      name:
        as: parakeet_backfill_queue_age_seconds
      metricsQuery: 'max(parakeet_batch_lane_oldest_pending_seconds{<<.LabelMatchers>>,lane="backfill"}) by (<<.GroupBy>>)'
    # Direct pod scrape below owns namespace/pod labels; do not aggregate the
    # batch queue into one global value or silently fall back to zero.
    - seriesQuery: 'omi_diarization_v2_queue_depth{namespace="prod-omi-backend",pod!="",job="diarizer-batch-metrics"}'
      resources:
        overrides:
          namespace: { resource: namespace }
          pod: { resource: pod }
      name:
        as: omi_diarization_v2_queue_depth
      metricsQuery: 'max(omi_diarization_v2_queue_depth{<<.LabelMatchers>>,job="diarizer-batch-metrics"}) by (<<.GroupBy>>)'
    - metricsQuery: sum(parakeet_active_streams{<<.LabelMatchers>>}) by (<<.GroupBy>>)
      name:
        as: parakeet_active_streams
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      seriesQuery: parakeet_active_streams{namespace!="",pod!=""}
    - metricsQuery: sum(parakeet_active_batch_requests{<<.LabelMatchers>>}) by (<<.GroupBy>>)
      name:
        as: parakeet_active_batch_requests
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      seriesQuery: parakeet_active_batch_requests{namespace!="",pod!=""}
    - metricsQuery: (sum(parakeet_active_streams{<<.LabelMatchers>>}) by (<<.GroupBy>>) + sum(parakeet_active_batch_requests{<<.LabelMatchers>>}) by (<<.GroupBy>>))
      name:
        as: parakeet_active_requests_total
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      seriesQuery: parakeet_active_streams{namespace!="",pod!=""}
extraArguments:
  - --metrics-max-age=5m

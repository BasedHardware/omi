prometheus:
  url: http://dev-kube-prometheus-stack-prometheus.{{ .Release.Namespace }}.svc
rules:
  default: false
  external:
    - name:
        as: "backend_listen_active_ws_connections_per_pod"
      seriesQuery: 'backend_listen_active_ws_connections'
      metricsQuery: 'avg(backend_listen_active_ws_connections{job="backend-listen-metrics"})'
      resources:
        overrides:
          namespace: { resource: "namespace" }
    - name:
        as: "pusher_active_ws_connections_per_pod"
      seriesQuery: 'pusher_active_ws_connections'
      metricsQuery: 'avg(pusher_active_ws_connections{job="pusher-metrics"})'
      resources:
        overrides:
          namespace: { resource: "namespace" }
    # p99 VAD request latency from the internal HTTPS LB histogram for HPA
    - name:
        as: "vad_request_latency_p99"
      seriesQuery: 'stackdriver_internal_http_lb_rule_loadbalancing_googleapis_com_https_internal_backend_latencies_bucket{backend_target_name="k8s1-ffeea2fe-dev-omi-backend-dev-omi-vad-8080-b32ae1f2"}'
      metricsQuery: 'histogram_quantile(0.99, sum by (le) (rate(stackdriver_internal_http_lb_rule_loadbalancing_googleapis_com_https_internal_backend_latencies_bucket{backend_target_name="k8s1-ffeea2fe-dev-omi-backend-dev-omi-vad-8080-b32ae1f2"}[5m])))'
      resources:
        overrides:
          namespace: { resource: "namespace" }
    # p99 Diarizer request latency from the internal HTTPS LB histogram for HPA
    - name:
        as: "diarizer_request_latency_p99"
      seriesQuery: 'stackdriver_internal_http_lb_rule_loadbalancing_googleapis_com_https_internal_backend_latencies_bucket{backend_target_name="k8s1-ffeea2fe-dev-omi-backend-dev-omi-diarizer-8080-48c29aca"}'
      metricsQuery: 'histogram_quantile(0.99, sum by (le) (rate(stackdriver_internal_http_lb_rule_loadbalancing_googleapis_com_https_internal_backend_latencies_bucket{backend_target_name="k8s1-ffeea2fe-dev-omi-backend-dev-omi-diarizer-8080-48c29aca"}[5m])))'
      resources:
        overrides:
          namespace: { resource: "namespace" }
    - name:
        as: "backend_listen_response_code_500"
      seriesQuery: 'stackdriver_https_lb_rule_loadbalancing_googleapis_com_https_backend_request_count{backend_target_name="dev-backend-listen"}'
      metricsQuery: 'avg(stackdriver_https_lb_rule_loadbalancing_googleapis_com_https_backend_request_count{response_code="500", backend_target_name="dev-backend-listen"}) or vector(0)'
      resources:
        overrides:
          namespace: { resource: "namespace" }
    - name:
        as: "backend_listen_requests_per_pod"
      seriesQuery: 'stackdriver_https_lb_rule_loadbalancing_googleapis_com_https_backend_request_count{backend_target_name="dev-backend-listen"}'
      metricsQuery: '(sum(stackdriver_https_lb_rule_loadbalancing_googleapis_com_https_backend_request_count{backend_target_name="dev-backend-listen",response_code="101"})/sum(kube_deployment_status_replicas{deployment="dev-omi-backend-listen"}))'
      resources:
        overrides:
          namespace: { resource: "namespace" }
    - name:
        as: "engine_active_requests_stt_streaming"
      seriesQuery: 'engine_active_requests{kind="stream"}'
      metricsQuery: 'avg(engine_active_requests{kind="stream"})'
      resources:
        overrides:
          namespace: { resource: "namespace" }
          pod: { resource: "pod" }
          service: { resource: "service" }
    - name:
        as: "engine_active_requests_stt_batch"
      seriesQuery: 'engine_active_requests{kind="batch"}'
      metricsQuery: 'avg(engine_active_requests{kind="batch"})'
      resources:
        overrides:
          namespace: { resource: "namespace" }
          pod: { resource: "pod" }
          service: { resource: "service" }
    - name:
        as: "engine_active_requests_tts_batch"
      seriesQuery: 'engine_active_requests{kind="tts"}'
      metricsQuery: 'avg(engine_active_requests{kind="tts"})'
      resources:
        overrides:
          namespace: { resource: "namespace" }
          pod: { resource: "pod" }
          service: { resource: "service" }
    - name:
        as: "engine_estimated_stream_capacity"
      seriesQuery: 'engine_active_requests{kind="stream"}'
      metricsQuery: 'avg_over_time((sum(engine_active_requests{kind="stream"}) / sum(engine_estimated_stream_capacity))[1m:1m])'
      resources:
        overrides:
          namespace: { resource: "namespace" }
          pod: { resource: "pod" }
          service: { resource: "service" }
    - name:
        as: "engine_requests_active_to_max_ratio"
      seriesQuery: "engine_max_active_requests"
      metricsQuery: "avg_over_time((sum(engine_active_requests) / sum(engine_max_active_requests))[1m:1m])"
      resources:
        overrides:
          namespace: { resource: "namespace" }
          pod: { resource: "pod" }
          service: { resource: "service" }
    # Total active NLLB translation requests for HPA (concurrency-based autoscaling)
    - name:
        as: "nllb_active_requests_total"
      seriesQuery: 'nllb_active_requests{namespace!=""}'
      metricsQuery: 'sum(nllb_active_requests{<<.LabelMatchers>>})'
      resources:
        overrides:
          namespace: { resource: "namespace" }
  custom:
  - seriesQuery: parakeet_active_streams{namespace!="",pod!=""}
    resources:
      overrides:
        namespace:
          resource: namespace
        pod:
          resource: pod
    name:
      as: parakeet_active_streams
    metricsQuery: sum(parakeet_active_streams{<<.LabelMatchers>>}) by (<<.GroupBy>>)
  - seriesQuery: parakeet_active_batch_requests{namespace!="",pod!=""}
    resources:
      overrides:
        namespace:
          resource: namespace
        pod:
          resource: pod
    name:
      as: parakeet_active_batch_requests
    metricsQuery: sum(parakeet_active_batch_requests{<<.LabelMatchers>>}) by (<<.GroupBy>>)
  - seriesQuery: parakeet_active_streams{namespace!="",pod!=""}
    resources:
      overrides:
        namespace:
          resource: namespace
        pod:
          resource: pod
    name:
      as: parakeet_active_requests_total
    metricsQuery: (sum(parakeet_active_streams{<<.LabelMatchers>>}) by (<<.GroupBy>>)
      + sum(parakeet_active_batch_requests{<<.LabelMatchers>>}) by (<<.GroupBy>>))
  - seriesQuery: parakeet_batch_lane_oldest_pending_seconds{namespace!="",pod!="",lane="live"}
    resources:
      overrides:
        namespace:
          resource: namespace
        pod:
          resource: pod
    name:
      as: parakeet_live_queue_age_seconds
    metricsQuery: max(parakeet_batch_lane_oldest_pending_seconds{<<.LabelMatchers>>,lane="live"})
      by (<<.GroupBy>>)
  - seriesQuery: parakeet_batch_lane_oldest_pending_seconds{namespace!="",pod!="",lane="backfill"}
    resources:
      overrides:
        namespace:
          resource: namespace
        pod:
          resource: pod
    name:
      as: parakeet_backfill_queue_age_seconds
    metricsQuery: max(parakeet_batch_lane_oldest_pending_seconds{<<.LabelMatchers>>,lane="backfill"})
      by (<<.GroupBy>>)

extraArguments:
  - --metrics-max-age=5m

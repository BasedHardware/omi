loki_anchors:
  chunkBucketName: &chunkBucketName prod-omi-loki-chunks
  rulerBucketName: &rulerBucketName prod-omi-loki-ruler
  nodeSelector: &nodeSelector
    service: monitoring
    env: prod
  # 2026-10-14: the Loki read path (ingester, querier, index-gateway, ruler)
  # ran BestEffort on the monitoring nodes and was first in line for CPU
  # starvation whenever Prometheus pinned the node (Grafana 502 incident).
  # Modest requests move them to Burstable with a guaranteed share, sized over
  # measured use: ingester 128-210m/231Mi, querier 21-45m/115Mi,
  # index-gateway 5m/69Mi, ruler 9m/88Mi. Limits stay unset - log ingestion
  # and querying must never be CPU-throttled below demand.
  #
  # Requests arithmetic on the two 1930m-allocatable pool nodes (2026-10-14
  # live listing, nominal replica spread):
  #   jzv7: 1373m (system daemons 373m + Prometheus request 1000m)
  #         + grafana 250m + operator 50m + adapter 100m
  #         + ingester 50m + querier 50m + index-gateway 20m + ruler 20m
  #         = 1913m <= 1930m
  #   mczx: 1368m (incl. the two 500m memcached caches)
  #         + ingester 50m + querier 50m + index-gateway 20m = 1488m <= 1930m
  # Replica spread is scheduler-chosen, not anti-affinity-pinned: a replica
  # that does not fit jzv7's 17m remainder schedules onto mczx instead. The
  # durable fix for the pool is the 4-vCPU resize runbook in the monitoring
  # README.
  readPathRequests: &readPathRequests
    requests:
      cpu: 50m
      memory: 256Mi
  smallReadPathRequests: &smallReadPathRequests
    requests:
      cpu: 20m
      memory: 128Mi

loki:
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: gcs
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage_config:
    gcs:
      bucket_name: *chunkBucketName # Your actual gcs bucket name, for example, loki-gcp-chunks
  ingester:
    chunk_encoding: snappy
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 360h # 15 days retention
  compactor:
    retention_enabled: true
    delete_request_store: gcs
  ruler:
    enable_api: true
    storage_config:
      type: gcs
      gcs_storage_config:
        region: us-central1 # The GCS region, for example europe-west4
        bucketnames: *rulerBucketName # Your actual gcs bucket name, for example, loki-gcp-ruler
      alertmanager_url: http://prod-kube-prometheus-stack-alertmanager:9093 # The URL of the Alertmanager to send alerts (Prometheus, Mimir, etc.)
  querier:
    max_concurrent: 4
  storage:
    type: gcs
    bucketNames:
      chunks: *chunkBucketName # Your actual gcs bucket name, for example, loki-gcp-chunks
      ruler: *rulerBucketName # Your actual gcs bucket name, for example, loki-gcp-ruler

serviceAccount:
  create: false
  name: prod-omi-loki-ksa

deploymentMode: Distributed

ingester:
  replicas: 2
  zoneAwareReplication:
    enabled: false
  nodeSelector:
    <<: *nodeSelector
  resources: *readPathRequests

querier:
  replicas: 2
  maxUnavailable: 2
  nodeSelector:
    <<: *nodeSelector
  resources: *readPathRequests

queryFrontend:
  replicas: 2
  maxUnavailable: 1
  nodeSelector:
    <<: *nodeSelector

queryScheduler:
  replicas: 2
  nodeSelector:
    <<: *nodeSelector

distributor:
  replicas: 2
  maxUnavailable: 2
  nodeSelector:
    <<: *nodeSelector

compactor:
  replicas: 1
  nodeSelector:
    <<: *nodeSelector

indexGateway:
  replicas: 2
  maxUnavailable: 1
  nodeSelector:
    <<: *nodeSelector
  resources: *smallReadPathRequests

ruler:
  replicas: 1
  maxUnavailable: 1
  nodeSelector:
    <<: *nodeSelector
  resources: *smallReadPathRequests

# This exposes the Loki gateway so it can be written to and queried externaly
gateway:
  service:
    type: ClusterIP
  basicAuth:
    enabled: true
    existingSecret: loki-basic-auth
  # Gateway access lines (nginx -> stderr, billed at ERROR severity) ran ~1.9
  # GiB/day with no consumer; 4xx/5xx still log when verboseLogging is false.
  verboseLogging: false
  nodeSelector:
    <<: *nodeSelector

memcached:
  nodeSelector:
    <<: *nodeSelector

# Since we are using basic auth, we need to pass the username and password to the canary
lokiCanary:
  extraArgs:
    - -pass=$(LOKI_PASS)
    - -user=$(LOKI_USER)
  extraEnv:
    - name: LOKI_PASS
      valueFrom:
        secretKeyRef:
          name: canary-basic-auth
          key: password
    - name: LOKI_USER
      valueFrom:
        secretKeyRef:
          name: canary-basic-auth
          key: username
  nodeSelector:
    <<: *nodeSelector

# Enable minio for storage
minio:
  enabled: false

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

singleBinary:
  replicas: 0

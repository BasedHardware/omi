# Merge under rules.external in the existing Prometheus Adapter configuration.
# Worker exports worker_release and Kubernetes namespace on age + freshness.
# Preserve namespace + pod labels on both metrics. Empty/stale samples must be
# unavailable (never replace with zero); HPA then retains capacity and alerts.
external:
  - seriesQuery: 'omi_batch_pipeline_ready_age_seconds{namespace!="",worker_release!="",priority!=""}'
    resources:
      overrides:
        namespace: {resource: namespace}
    name:
      matches: '^omi_batch_pipeline_ready_age_seconds$'
      as: omi_batch_pipeline_ready_age_seconds
    metricsQuery: >-
      max by (namespace, worker_release, priority) (
        omi_batch_pipeline_ready_age_seconds{<<.LabelMatchers>>}
        and on (namespace, worker_release, pod)
        (time() - omi_batch_pipeline_metrics_refreshed_at_seconds < 60)
      )
  - seriesQuery: 'omi_batch_pipeline_admissible_ready_units{namespace!="",worker_release!="",priority=~"fresh|recent|deep"}'
    resources:
      overrides:
        namespace: {resource: namespace}
    name:
      matches: '^omi_batch_pipeline_admissible_ready_units$'
      as: omi_batch_pipeline_admissible_ready_units
    # Workers report the same global queue. Max before summing priorities avoids
    # multiplying demand by replica count. All three fresh classes are required.
    metricsQuery: |-
      sum by (namespace, worker_release) (
        max by (namespace, worker_release, priority) (
          omi_batch_pipeline_admissible_ready_units{<<.LabelMatchers>>}
          and on (namespace, worker_release, pod)
          (time() - omi_batch_pipeline_capacity_refreshed_at_seconds < 60)
        )
      )
      and on (namespace, worker_release) (
        count by (namespace, worker_release) (
          max by (namespace, worker_release, priority) (
            omi_batch_pipeline_admissible_ready_units{<<.LabelMatchers>>}
            and on (namespace, worker_release, pod)
            (time() - omi_batch_pipeline_capacity_refreshed_at_seconds < 60)
          )
        ) == 3
      )
  # Demand for the exclusive GPU chain: fleet worker_flight busy seconds per
  # second. The HPA sizes on workers being productively busy, so a claim-chain
  # wedge (units ready but unleasable) no longer buys idle replicas, while real
  # chain load scales up immediately. Stage timers carry only the stage label
  # (no worker_release), so scope by namespace and gate freshness per pod:
  # only pods whose queue sampler is fresh contribute. Stale samples stay
  # unavailable, never zero.
  - seriesQuery: 'omi_batch_pipeline_stage_seconds_sum{namespace!="",stage="worker_flight"}'
    resources:
      overrides:
        namespace: {resource: namespace}
    name:
      matches: '^omi_batch_pipeline_stage_seconds_sum$'
      as: omi_batch_pipeline_gpu_chain_busy_seconds
    metricsQuery: |-
      sum by (namespace) (
        rate(omi_batch_pipeline_stage_seconds_sum{<<.LabelMatchers>>,stage="worker_flight"}[2m])
        and on (namespace, pod)
        (time() - omi_batch_pipeline_metrics_refreshed_at_seconds{<<.LabelMatchers>>} < 60)
      )

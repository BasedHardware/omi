enabled: true
image:
  repository: gcr.io/based-hardware/batch-pipeline-worker
  # gcp_diarizer.yml builds the prod image and supplies its immutable digest.
  digest: ""
serviceAccountName: batch-pipeline-worker
gcpServiceAccount: batch-pipeline-worker@based-hardware.iam.gserviceaccount.com
bucket: based-hardware-batch-pipeline-staging
dataPlaneProject: based-hardware
stage: prod
namespace: batch_pipeline_prod
secretName: prod-omi-backend-secrets
# Preserve the approved four-worker floor on image-only Helm rolls. Each
# replica requests one L4; actual ready capacity still gates admission.
# Higher ladder steps must explicitly reconcile their desired replica count
# after a roll: the node-pool maximum alone does not create worker demand.
# Leases, ordered merge and privacy fences stay durable per segment/owner.
replicaCount: 4
autoscaling:
  enabled: false
# The null drops the base chart's pool pin: batch-pipeline-pool and its Spot
# sibling share the service/env labels and omi.ai taints, so the autoscaler
# can place replicas on Spot first while the on-demand pool stays the fallback.
nodeSelector:
  cloud.google.com/gke-nodepool: null
  service: batch-pipeline
  env: prod
tolerations:
  - key: omi.ai/batch-pipeline
    operator: Equal
    value: "true"
    effect: NoSchedule
  - key: nvidia.com/gpu
    operator: Equal
    value: present
    effect: NoSchedule
worker:
  shadowRecoveryApiUrl: "https://backend-integration-hhibjajaja-uc.a.run.app"
  apiUrl: https://backend-sync-hhibjajaja-uc.a.run.app
  audience: https://backend-sync-hhibjajaja-uc.a.run.app
  emptyAsrRecoveryEnabled: true
  emptyAsrDispositionEnabled: true
  headPriorityEnabled: true
  workerSilenceDispositionEnabled: true
  correctnessMetricsEnabled: true

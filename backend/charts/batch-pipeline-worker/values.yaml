# Rendering defaults creates no resources. Enabling this release only drains
# durable admitted work; the lead separately controls backend admission cohorts.
enabled: false
image:
  repository: ""
  digest: ""
serviceAccountName: ""
gcpServiceAccount: ""
namespace: batch_pipeline_prod
stage: prod
dataPlaneProject: ""
bucket: ""
secretName: ""
replicaCount: 1
# Operator-managed L4 (g2-standard-8) pool; never share the live diarizer pool.
nodeSelector:
  cloud.google.com/gke-nodepool: batch-pipeline-pool
  service: batch-pipeline
tolerations:
  - key: omi.ai/batch-pipeline
    operator: Equal
    value: "true"
    effect: NoSchedule
  - key: nvidia.com/gpu
    operator: Equal
    value: present
    effect: NoSchedule
worker:
  # null preserves the runtime's stage-dependent profiling default.
  stageProfilingEnabled: null
  # Same original-lane/owner policy as CPU admission. Non-live widening is
  # blocked by #22352 and needs separate approval; these defaults are inert.
  capDispatchEnforcement: false
  capDispatchCohort: ""
  capDispatchLanes: live
  ladderBudgetEnforcement: false
  # HTTPS policy host and exact OIDC audience; admission remains on CPU hosts.
  apiUrl: ""
  audience: ""
  batchSize: 8
  # Ship-on pump pipelining (1-4). Set 1 to restore the serial pump.
  pipelineDepth: 2
  shadowPercent: 0
  shadowPaidRecoveryPerHour: 200
  shadowRecoveryApiUrl: ""
  unitSeconds: 3600
  paddedSeconds: 272
  # Pack pyannote segmentation/embedding forwards across one flight's units.
  # Dark until the L4 paired run passes (diarizer/batch_pipeline_flight_qualify.py).
  flightBatchingEnabled: false
  flightBatchSeconds: 1800
  emptyAsrRecoveryEnabled: false
  # Activation follows the CPU role's separately approved secret-access change.
  independentLanguageRecoveryEnabled: false
  emptyAsrDispositionEnabled: false
  # Kill switch for context retry and positive-VAD custody; ship on.
  emptyAsrSafetyNetEnabled: true
  headPriorityEnabled: false
  workerSilenceDispositionEnabled: false
  workerValidationDispositionEnabled: true
  # Ship-on speech-only diarization; false restores full-unit diarization.
  diarizeSpeechOnlyEnabled: true
  # Default off until a paired run on the prod pyannote revision qualifies it
  # (see backend/diarizer/batch_pipeline_runtime.md).
  shortSpeechSingleEnabled: false
  correctnessMetricsEnabled: false
resources:
  # Dev L4 batch-8 one-hour compute receipt: 9.795Gi cgroup lifetime peak.
  # Round peak + max(1Gi, 20%) / max(2Gi, 40%) up for request / limit.
  requests:
    cpu: "4"
    memory: 12Gi
    nvidia.com/gpu: "1"
  limits:
    cpu: "8"
    memory: 14Gi
    nvidia.com/gpu: "1"
autoscaling:
  # Enable only after scoped admissible-count series/adapter and target qualify.
  enabled: false
  minReplicas: 1
  maxReplicas: 6
  # Total min/max above are divided equally between pool-pinned HPAs when on.
  # The original deployment name stays on OD; a -spot deployment shares its
  # queue metric scope but has a distinct pod selector and PodMonitoring.
  # Superseded as the cutover shape 10-28 (lead f05065): the qualified path is
  # a single OD-pinned HPA (prod 3/16); balanced stays machinery-only.
  balancedPools:
    enabled: false
    onDemandNodePool: batch-pipeline-pool
    spotNodePool: batch-pipeline-pool-spot
  # External metrics from the supplied Prometheus adapter rules must be installed
  # and freshly sampled. A failed/stale metric prevents unsafe HPA scale-down.
  # PROVISIONAL development target: slot bound only, NOT throughput evidence.
  # Qualify useful throughput/queue latency before the production apply.
  targetQueuedUnitsPerWorker: 16
podMonitoring:
  enabled: true

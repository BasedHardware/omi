# Rendering defaults creates no resources. Enabling this release only drains
# durable admitted work; the lead separately controls backend admission cohorts.
enabled: false
# Part A only. All repair children inherit a stable release epoch; 0 is
# dormant while off. The release owner pins the epoch with the shadow flip,
# then retains it across restarts and later ramp steps.
recordTokenLease:
  mode: "off"
  servePercent: 0
  seconds: 3600
  deployedAt: 0
podLabels:
  service_name: batch-pipeline-worker
recordSealRules:
  partialEnabled: true
  overlapTrimEnabled: true
  uploadFailedRepairEnabled: true
image:
  repository: ""
  digest: ""
serviceAccountName: ""
gcpServiceAccount: ""
namespace: batch_pipeline_prod
stage: prod
dataPlaneProject: ""
bucket: ""
secretName: ""
replicaCount: 1
# Operator-managed L4 (g2-standard-8) pool; never share the live diarizer pool.
nodeSelector:
  cloud.google.com/gke-nodepool: batch-pipeline-pool
  service: batch-pipeline
tolerations:
  - key: omi.ai/batch-pipeline
    operator: Equal
    value: "true"
    effect: NoSchedule
  - key: nvidia.com/gpu
    operator: Equal
    value: present
    effect: NoSchedule
# Borrow idle on-demand L4 nodes from other pools (L4 stockout, l4capacity
# 2026-11-01). When on, a separate `<release>-borrow` Deployment with its own
# HPA (min 1, max maxReplicas, same queue metric) runs only on `pools`, at a
# negative PriorityClass so the owning workload (default priority 0) preempts
# it, with a short grace so the owner gets the GPU back in minutes, not the OD
# worker's 1500s drain. A freed node then passes straight to a borrower instead
# of returning to GCE. The OD deployment, its HPA and its drain are unchanged.
# Each pool must be on-demand g2-standard-8 + L4 whose only taint the worker
# tolerates. Outside a stockout the min-1 borrower can make the autoscaler buy
# one owner-pool node, so turn this off once OD scale-ups succeed again.
borrowedNodePools:
  enabled: false
  pools: []
  maxReplicas: 3
  # A preempted borrower stops within this bound; its leases retry elsewhere.
  terminationGracePeriodSeconds: 120
  # In [-10, 0): below pods without a class (0), and not below the cluster
  # autoscaler's expendable cutoff (-10), so a Pending borrower is not ignored.
  priority: -1
worker:
  heldDeadLetterEnabled: true
  inputExpiringEnabled: true
  # Match the serving hosts; prod overrides this below the 120s guard blind window.
  servingMetricsMinRefreshSeconds: 30
  # Control-loop defaults; rollback independently with 64 / false / 2 / {}.
  controlCandidateFanout: 16
  admissionParallelCalls: true
  idlePollMaxSeconds: 10
  firestoreReadLevers: '{}'
  # Fenced per-shard pulls and worker affinity; false restores legacy selection.
  shardSpreadEnabled: true
  # One shard transaction leases up to the pull batch; false leases one per transaction.
  pullMultiLeaseEnabled: true
  # Ship-on: a pump's non-first lanes take recent/deep backfill when every fresh
  # shard is claimed by another puller; lane 0 stays fresh-first. false restores
  # strict fresh-first on every lane.
  pullBusyBorrowEnabled: true
  # Ship-on bounded Firestore transaction retry; false restores legacy behavior.
  contentionRetryEnabled: true
  # null preserves the runtime's stage-dependent profiling default.
  stageProfilingEnabled: null
  # Same original-lane/owner policy as CPU admission. Non-live widening is
  # blocked by #22352 and needs separate approval; these defaults are inert.
  capDispatchEnforcement: false
  capDispatchCohort: ""
  capDispatchLanes: live
  # Default-off unlimited_v2 backfill/import daily transcribed-hours cap (see
  # utils/backfill_hours_cap.py). false restores current behavior exactly.
  unlimitedV2BackfillHoursCapEnabled: false
  unlimitedV2BackfillHoursCapHours: "24"
  # HTTPS policy host and exact OIDC audience; admission remains on CPU hosts.
  apiUrl: ""
  audience: ""
  batchSize: 8
  # Ship-on pump pipelining (1-4). Set 1 to restore the serial pump.
  pipelineDepth: 2
  # Independent pump processes sharing the pod's GPU (1-3), each with its own
  # model chain, leases and pump depth; 1 runs one process with no supervisor.
  # Counts above 1 take pod resources from processResources. Two lifted the
  # 3-CPU T4 bench 33.8 -> 45.4 audio-h/GPU-h but added nothing on top of the
  # shared embedding trunk there. The 8-vCPU dev L4 run (2026-11-04) gave
  # 112.6 -> 172.8; prod sets 2, the chart default stays 1.
  processes: 1
  # Shared artifact IO pool, including first decode before the GPU lock.
  # 1 disables preparation and restores serial artifact IO.
  ioConcurrency: 5
  # A waiting lane prepares every leading unit of its flight that fits the
  # shared 1800-audio-second decode budget, not only the first, so the GPU
  # section does not wait on artifact fetches. false restores first-only.
  prepareFlightEnabled: true
  shadowPercent: 0
  shadowPaidRecoveryPerHour: 200
  shadowRecoveryApiUrl: ""
  # CPU strict-VAD shadow sampling percent; 0 disables the shadow, 100
  # restores full sampling (the silence qualification reads this evidence).
  strictVadShadowPercent: 10
  unitSeconds: 3600
  paddedSeconds: 272
  # Pack pyannote segmentation/embedding forwards across one flight's units.
  # Dark until the L4 paired run passes (diarizer/batch_pipeline_flight_qualify.py).
  flightBatchingEnabled: false
  flightBatchSeconds: 1800
  # Kill switch: one speaker-embedding trunk forward per 10s chunk of a unit,
  # pooled per local speaker. Ship on; false restores pyannote's per-pair forward.
  sharedEmbeddingTrunkEnabled: true
  # Serial chain: a unit diarized at full length takes the raw segmentation
  # scores its own VAD pass computed (same model, chunking and forward batch,
  # so identical scores) instead of a second segmentation forward. Compacted
  # speech-only waveforms still segment themselves. false restores the
  # second forward.
  vadSegmentationReuseEnabled: true
  # CUDA graph TDT decoding (same label-looping algorithm and words as eager;
  # fewer kernel launches). The chosen mode is asserted around every call.
  # L4 paired run 2026-11-02: ASR stage -26%, identical words. false restores
  # asserted eager decoding.
  asrCudaGraphsEnabled: true
  emptyAsrRecoveryEnabled: false
  # Activation follows the CPU role's separately approved secret-access change.
  independentLanguageRecoveryEnabled: false
  # Parakeet window flags: every backend host sets these (deploy contract
  # reader-split); per-env values files override to match their hosts.
  parakeetWindowAllocationPercent: 0
  parakeetWindowReplicaRecoveryEnabled: ""
  emptyAsrDispositionEnabled: false
  # Kill switch for context retry and positive-VAD custody; ship on.
  emptyAsrSafetyNetEnabled: true
  headPriorityEnabled: false
  workerSilenceDispositionEnabled: false
  workerValidationDispositionEnabled: true
  # Ship-on speech-only diarization; false restores full-unit diarization.
  diarizeSpeechOnlyEnabled: true
  # Default off until a paired run on the prod pyannote revision qualifies it
  # (see backend/diarizer/batch_pipeline_runtime.md).
  correctnessMetricsEnabled: false
resources:
  # Dev L4 batch-8 one-hour compute receipt: 9.795Gi cgroup lifetime peak.
  # Round peak + max(1Gi, 20%) / max(2Gi, 40%) up for request / limit.
  requests:
    cpu: "4"
    memory: 12Gi
    nvidia.com/gpu: "1"
  limits:
    cpu: "8"
    memory: 14Gi
    nvidia.com/gpu: "1"
# Pod resources per worker.processes above 1; a count without an entry fails
# the render. Each process repeats the one-process host peak (models, CUDA
# context, decoded audio), so the sizing is the single-process rule times the
# count, held inside g2-standard-8 allocatable (~28Gi, ~7.9 vCPU) minus daemons.
# Three processes (~29Gi of host peak) do not fit this machine shape.
processResources:
  "2":
    requests:
      cpu: "6"
      memory: 24Gi
      nvidia.com/gpu: "1"
    limits:
      cpu: "8"
      memory: 26Gi
      nvidia.com/gpu: "1"
autoscaling:
  # Enable only after scoped admissible-count series/adapter and target qualify.
  enabled: false
  minReplicas: 1
  maxReplicas: 6
  # Total min/max above are divided equally between pool-pinned HPAs when on.
  # The original deployment name stays on OD; a -spot deployment shares its
  # queue metric scope but has a distinct pod selector and PodMonitoring.
  # Superseded as the cutover shape 10-28 (lead f05065): the qualified path is
  # a single OD-pinned HPA (prod 4/16); balanced stays machinery-only.
  balancedPools:
    enabled: false
    onDemandNodePool: batch-pipeline-pool
    spotNodePool: batch-pipeline-pool-spot
  # External metrics must be freshly sampled; a failed metric blocks scale-down.
  # Max-of-two: ready backlog protects claim-bound work; worker_flight wall time
  # protects healthy drains whose ready backlog is low. This is serialized chain
  # occupancy (including host work/executor wait), not CUDA/ASR utilization. The
  # pump acquires its GPU slot before timing a flight, so pipelineDepth=2 does
  # not double-count time waiting for that slot. Keep stage profiling enabled.
  # Frontier: 41 is the largest integer ready target passing the unchanged
  # sustained-step wait bound; 42 fails. 0.56 preserves zero starvation in the
  # older 24h replay; 0.561 already starves. With the stockout policy below,
  # current 3h replay mean/max = 4.34/5 (no hot minutes); synthetic 3.7x volume
  # = 11.46/16 with 6 hot minutes, so full-volume capacity remains unqualified.
  # See docs/batch-pipeline-hpa-frontier.md; the reverted 40/0.6 starved 35 min.
  targetQueuedUnitsPerWorker: 41
  targetChainBusyPerWorker: "0.56"
  # Preserve stockout protection: the older replay does not faithfully model
  # the downscale period. The chart still sheds at most 1 pod per 600 seconds.
  scaleDownStabilizationSeconds: 1800
# L4 stockout fallback. Renders <release>-t4 pinned to a T4 pool (operator-made,
# same labels and taints as the L4 pool), with no HPA. The same image runs there
# (emulated BF16): the 2026-11-01 public-corpus bench gave identical VAD and
# diarization, words within FP16/BF16 noise, ~0.48x L4 throughput. Scale it with
# kubectl only while L4 workers are Pending; Helm upgrades keep the live count.
t4Fallback:
  enabled: false
  nodePool: batch-pipeline-t4-pool
  replicas: 0
  # Worker processes on the T4 sibling, independent of worker.processes: two
  # model chains are not qualified on 16 GB of T4 VRAM / n1-standard-8.
  processes: 1
  # Pump lanes per process on the T4 sibling, independent of worker.pipelineDepth:
  # the slower T4 chain keeps the default 2 so fresh work waits at most one extra chain.
  pipelineDepth: 2
podMonitoring:
  enabled: true
recordSealRepair:
  # Independent CPU CronJob: never extends or consumes the sweeper's 240s loop.
  enabled: true
  # Retained for evening overlap and rollback; lead overrides false for the first peak.
  suspend: true
  runtimeEnabled: true
  jobsDiscovery: "on"
  projectionDebtDurableEnabled: true
  mode: apply
  workers: 8
  rowSeconds: 270
  # CPU-only repair pod placement. The old affinity excluded the batch-pipeline
  # pool, so repair landed on the monitoring pool at 101% CPU and received ~2 of
  # its 4-core limit; the batch-pipeline pool sits at 8-19% CPU. Empty nodePool
  # restores the old exclusion (and empty tolerations the old no-toleration pod).
  # g2-standard-8 allocatable is ~7.8 vCPU and the GPU worker requests 4, so a
  # 4-CPU request does not co-schedule with a worker: the pool autoscaler adds a
  # node. Lower cpuRequest to "3" to share a worker's node instead.
  nodePool: batch-pipeline-pool
  tolerations:
    - key: omi.ai/batch-pipeline
      operator: Equal
      value: "true"
      effect: NoSchedule
    - key: nvidia.com/gpu
      operator: Equal
      value: present
      effect: NoSchedule
  # 2 -> 4 (== the unchanged limit) so 16 row workers are not starved to ~2 cores.
  cpuRequest: "4"
  # Lead supplies current serving-role policy flags; absent/invalid refuses IO.
  # Refresh this map per ramp rung with --reuse-values; no worker restart.
  serverFlags: {}
recordSealWorker:
  enabled: true
  # Ship-on kill switch: false idles slots without removing the rollback cron.
  runtimeEnabled: true
  # Same policy map as repair; refresh both during an overlap ramp.
  serverFlags: {}
  # One sixteenth of repair's 16-slot CPU/memory ceiling, per pod.
  # At max 16: requests 1CPU/2Gi, limits 4CPU/8Gi, as repair today.
  maxReplicas: 16
  targetBacklogPerWorker: 4
recordSealSweeper:
  # Ship on with the worker release; false removes the CronJob and its pods-list RBAC.
  enabled: true
  # Runtime kill switch affects new Jobs; terminate an active Job for an immediate stop.
  runtimeEnabled: true
  # Lead can observe one in-cluster plan cycle before the apply train.
  mode: apply

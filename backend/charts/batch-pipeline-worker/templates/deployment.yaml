{{- if .Values.enabled }}
{{- if eq .Values.stage "prod" }}
{{- if or (not (regexMatch "^https://[^/]+/?$" .Values.worker.apiUrl)) (ne .Values.worker.audience .Values.worker.apiUrl) }}
{{- fail "production worker requires an HTTPS service base and matching OIDC audience" }}
{{- end }}
{{- end }}
{{- if lt (int .Values.replicaCount) 1 }}
{{- fail "queue sampling runs in workers: replicaCount must be >=1" }}
{{- end }}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.image.digest) }}
{{- fail "image.digest must pin a qualified joint GPU image" }}
{{- end }}
{{- if or (lt (int .Values.worker.unitSeconds) 1) (gt (int .Values.worker.unitSeconds) 7200) }}
{{- fail "dedicated batch units must be in [1,7200] seconds" }}
{{- end }}
{{- /*
The on-demand baseline always renders first and keeps the release name,
selector and full-flight SIGTERM drain. With spot.enabled a second Deployment,
<release>-spot, pins the Spot pool (guards and its PodMonitoring/HPA live in
spot.yaml), gets its own instance label so selectors never overlap, and returns
leases inside the preemption budget. BATCH_PIPELINE_WORKER_RELEASE stays the
release name on both so they sample one queue-age series.
*/}}
{{- $root := . }}
{{- $variants := list false }}
{{- if .Values.spot.enabled }}
{{- $variants = append $variants true }}
{{- end }}
{{- range $spot := $variants }}
{{- $v := $root.Values }}
{{- $name := ternary (printf "%s-spot" $root.Release.Name) $root.Release.Name $spot }}
{{- $scale := ternary $v.spot $v $spot }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  # L4 scale-from-zero, image pull and joint model startup exceeded 600s in dev.
  progressDeadlineSeconds: 1800
  {{- if not $scale.autoscaling.enabled }}
  replicas: {{ $scale.replicaCount }}
  {{- end }}
  # Never allocate surge GPUs or co-locate a second chain on one device.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: batch-pipeline-worker
      app.kubernetes.io/instance: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: batch-pipeline-worker
        app.kubernetes.io/instance: {{ $name }}
    spec:
      serviceAccountName: {{ required "dedicated Workload Identity serviceAccountName required" $v.serviceAccountName }}
      {{- if $spot }}
      # Spot preemption gives regular pods ~15s regardless of this value;
      # rollouts and scale-down then use the same bounded release path.
      terminationGracePeriodSeconds: {{ $v.spot.terminationGracePeriodSeconds }}
      {{- else }}
      terminationGracePeriodSeconds: 1500
      {{- end }}
      nodeSelector:
        {{- if $spot }}
        {{- toYaml (merge (dict "cloud.google.com/gke-nodepool" $v.spot.nodePool "cloud.google.com/gke-spot" "true") (omit $v.nodeSelector "cloud.google.com/gke-nodepool")) | nindent 8 }}
        {{- else }}
        {{- toYaml $v.nodeSelector | nindent 8 }}
        {{- end }}
      tolerations:
        {{- toYaml $v.tolerations | nindent 8 }}
        {{- if $spot }}
        - {key: cloud.google.com/gke-spot, operator: Equal, value: "true", effect: NoSchedule}
        {{- end }}
      containers:
        - name: worker
          image: "{{ required "image.repository required" $v.image.repository }}@{{ $v.image.digest }}"
          command: [python, -m, diarizer.batch_pipeline_runtime]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: BATCH_PIPELINE_WORKER_RELEASE, value: {{ $root.Release.Name | quote }}}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - {name: BATCH_PIPELINE_API_URL, value: {{ $v.worker.apiUrl | quote }}}
            - {name: BATCH_PIPELINE_WORKER_AUDIENCE, value: {{ $v.worker.audience | quote }}}
            - {name: BATCH_PIPELINE_WORKER_SILENCE_DISPOSITION_ENABLED, value: {{ $v.worker.workerSilenceDispositionEnabled | quote }}}
            - {name: BATCH_PIPELINE_WORKER_VALIDATION_DISPOSITION_ENABLED, value: {{ $v.worker.workerValidationDispositionEnabled | quote }}}
            - {name: BATCH_PIPELINE_EMPTY_ASR_DISPOSITION_ENABLED, value: {{ $v.worker.emptyAsrDispositionEnabled | quote }}}
            - {name: BATCH_PIPELINE_EMPTY_ASR_RECOVERY_ENABLED, value: {{ $v.worker.emptyAsrRecoveryEnabled | quote }}}
            - {name: BATCH_PIPELINE_CORRECTNESS_METRICS_ENABLED, value: {{ $v.worker.correctnessMetricsEnabled | quote }}}
            - {name: BATCH_PIPELINE_HEAD_PRIORITY_ENABLED, value: {{ $v.worker.headPriorityEnabled | quote }}}
            - {name: BATCH_PIPELINE_WORKER_ENABLED, value: "true"}
            - {name: BATCH_PIPELINE_ENABLED, value: "false"}
            - {name: BATCH_PIPELINE_PERCENT, value: "0"}
            - {name: BATCH_PIPELINE_UID_ALLOWLIST, value: ""}
            - {name: BATCH_PIPELINE_SHARED_LIVE_ENABLED, value: "false"}
            - {name: BATCH_PIPELINE_POOL_KIND, value: dedicated_batch}
            - {name: BATCH_PIPELINE_WORDS_PROVIDER, value: parakeet}
            - {name: BATCH_PIPELINE_DIARIZER, value: pyannote}
            - {name: OMI_FIRESTORE_DATA_PLANE_PROJECT, value: {{ required "explicit customer data plane project required" $v.dataPlaneProject | quote }}}
            - {name: OMI_ENV_STAGE, value: {{ $v.stage | quote }}}
            - {name: BATCH_PIPELINE_NAMESPACE, value: {{ $v.namespace | quote }}}
            - {name: BUCKET_BATCH_PIPELINE, value: {{ required "dedicated staging bucket required" $v.bucket | quote }}}
            # Shared by Parakeet windows and pyannote segmentation, embedding and VAD inference.
            - {name: BATCH_PIPELINE_MODEL_BATCH_SIZE, value: {{ $v.worker.batchSize | quote }}}
            - {name: BATCH_PIPELINE_UNIT_SECONDS, value: {{ $v.worker.unitSeconds | quote }}}
            - {name: BATCH_PIPELINE_PADDED_SECONDS, value: {{ $v.worker.paddedSeconds | quote }}}
            {{- if $spot }}
            # After SIGTERM, wait this long for the GPU flight, then return its
            # leases uncharged and exit inside the Spot budget.
            - {name: BATCH_PIPELINE_RELEASE_ON_STOP_SECONDS, value: {{ $v.spot.releaseOnStopSeconds | quote }}}
            {{- end }}
            - name: ENCRYPTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "secretName required" $v.secretName }}
                  key: ENCRYPTION_SECRET
            - name: HUGGINGFACE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $v.secretName }}
                  key: HUGGINGFACE_TOKEN
          startupProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          volumeMounts:
            - {name: model-cache, mountPath: /cache}
      volumes:
        - name: model-cache
          emptyDir: {sizeLimit: 30Gi}
{{- end }}
{{- end }}

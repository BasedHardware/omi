{{- if .Values.enabled }}
{{- if eq .Values.stage "prod" }}
{{- if or (not (regexMatch "^https://[^/]+/?$" .Values.worker.apiUrl)) (ne .Values.worker.audience .Values.worker.apiUrl) }}
{{- fail "production worker requires an HTTPS service base and matching OIDC audience" }}
{{- end }}
{{- end }}
{{- if lt (int .Values.replicaCount) 1 }}
{{- fail "queue sampling runs in workers: replicaCount must be >=1" }}
{{- end }}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.image.digest) }}
{{- fail "image.digest must pin a qualified joint GPU image" }}
{{- end }}
{{- if or (lt (int .Values.worker.unitSeconds) 1) (gt (int .Values.worker.unitSeconds) 7200) }}
{{- fail "dedicated batch units must be in [1,7200] seconds" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  # L4 scale-from-zero, image pull and joint model startup exceeded 600s in dev.
  # Recreate also waits for old pods to drain (terminationGracePeriodSeconds 1500)
  # before new ones start, so the deadline covers drain plus startup.
  progressDeadlineSeconds: 2400
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  # Never allocate surge GPUs or co-locate a second chain on one device.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: batch-pipeline-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: batch-pipeline-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ required "dedicated Workload Identity serviceAccountName required" .Values.serviceAccountName }}
      terminationGracePeriodSeconds: 1500
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ required "image.repository required" .Values.image.repository }}@{{ .Values.image.digest }}"
          command: [python, -m, diarizer.batch_pipeline_runtime]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: STT_CAP_DISPATCH_ENFORCEMENT, value: {{ .Values.worker.capDispatchEnforcement | quote }}}
            - {name: STT_CAP_DISPATCH_COHORT, value: {{ .Values.worker.capDispatchCohort | quote }}}
            - {name: STT_CAP_DISPATCH_LANES, value: {{ .Values.worker.capDispatchLanes | quote }}}
            - {name: LADDER_V1_BUDGET_ENFORCEMENT_ENABLED, value: {{ .Values.worker.ladderBudgetEnforcement | quote }}}
            - {name: BATCH_PIPELINE_WORKER_RELEASE, value: {{ .Release.Name | quote }}}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - {name: BATCH_PIPELINE_API_URL, value: {{ .Values.worker.apiUrl | quote }}}
            - {name: BATCH_PIPELINE_WORKER_AUDIENCE, value: {{ .Values.worker.audience | quote }}}
            - {name: BATCH_PIPELINE_WORKER_SILENCE_DISPOSITION_ENABLED, value: {{ .Values.worker.workerSilenceDispositionEnabled | quote }}}
            - {name: BATCH_PIPELINE_WORKER_VALIDATION_DISPOSITION_ENABLED, value: {{ .Values.worker.workerValidationDispositionEnabled | quote }}}
            - {name: BATCH_PIPELINE_DIARIZE_SPEECH_ONLY_ENABLED, value: {{ .Values.worker.diarizeSpeechOnlyEnabled | quote }}}
            - {name: BATCH_PIPELINE_SHORT_SPEECH_SINGLE_ENABLED, value: {{ .Values.worker.shortSpeechSingleEnabled | quote }}}
            - {name: BATCH_PIPELINE_EMPTY_ASR_DISPOSITION_ENABLED, value: {{ .Values.worker.emptyAsrDispositionEnabled | quote }}}
            - {name: BATCH_PIPELINE_EMPTY_ASR_RECOVERY_ENABLED, value: {{ .Values.worker.emptyAsrRecoveryEnabled | quote }}}
            - {name: BATCH_PIPELINE_CORRECTNESS_METRICS_ENABLED, value: {{ .Values.worker.correctnessMetricsEnabled | quote }}}
            - {name: BATCH_PIPELINE_HEAD_PRIORITY_ENABLED, value: {{ .Values.worker.headPriorityEnabled | quote }}}
            # Pump flights per GPU: claim and publication overlap the exclusive chain; "1" is the serial kill switch.
            - {name: BATCH_PIPELINE_WORKER_PIPELINE_DEPTH, value: {{ .Values.worker.pipelineDepth | default 2 | quote }}}
            - {name: BATCH_PIPELINE_WORKER_ENABLED, value: "true"}
            - {name: BATCH_PIPELINE_ENABLED, value: "false"}
            - {name: BATCH_PIPELINE_PERCENT, value: "0"}
            - {name: BATCH_PIPELINE_SHADOW_PERCENT, value: {{ .Values.worker.shadowPercent | quote }}}
            - {name: BATCH_PIPELINE_SHADOW_PAID_RECOVERY_PER_HOUR, value: {{ .Values.worker.shadowPaidRecoveryPerHour | quote }}}
            - {name: BATCH_PIPELINE_SHADOW_RECOVERY_API_URL, value: {{ .Values.worker.shadowRecoveryApiUrl | quote }}}
            - {name: BATCH_PIPELINE_UID_ALLOWLIST, value: ""}
            - {name: BATCH_PIPELINE_SHARED_LIVE_ENABLED, value: "false"}
            - {name: BATCH_PIPELINE_POOL_KIND, value: dedicated_batch}
            - {name: BATCH_PIPELINE_WORDS_PROVIDER, value: parakeet}
            - {name: BATCH_PIPELINE_DIARIZER, value: pyannote}
            - {name: OMI_FIRESTORE_DATA_PLANE_PROJECT, value: {{ required "explicit customer data plane project required" .Values.dataPlaneProject | quote }}}
            - {name: OMI_ENV_STAGE, value: {{ .Values.stage | quote }}}
            - {name: BATCH_PIPELINE_NAMESPACE, value: {{ .Values.namespace | quote }}}
            - {name: BUCKET_BATCH_PIPELINE, value: {{ required "dedicated staging bucket required" .Values.bucket | quote }}}
            # Shared by Parakeet windows and pyannote segmentation, embedding and VAD inference.
            - {name: BATCH_PIPELINE_MODEL_BATCH_SIZE, value: {{ .Values.worker.batchSize | quote }}}
            - {name: BATCH_PIPELINE_UNIT_SECONDS, value: {{ .Values.worker.unitSeconds | quote }}}
            - {name: BATCH_PIPELINE_PADDED_SECONDS, value: {{ .Values.worker.paddedSeconds | quote }}}
            - {name: BATCH_PIPELINE_FLIGHT_BATCHING_ENABLED, value: {{ .Values.worker.flightBatchingEnabled | quote }}}
            - {name: BATCH_PIPELINE_FLIGHT_BATCH_SECONDS, value: {{ .Values.worker.flightBatchSeconds | quote }}}
            - name: ENCRYPTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "secretName required" .Values.secretName }}
                  key: ENCRYPTION_SECRET
            - name: HUGGINGFACE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: HUGGINGFACE_TOKEN
          startupProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: model-cache, mountPath: /cache}
      volumes:
        - name: model-cache
          emptyDir: {sizeLimit: 30Gi}
{{- end }}

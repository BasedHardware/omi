{{- define "batch-pipeline-worker.hpa" -}}
{{- if and .Values.enabled .Values.autoscaling.enabled }}
{{- if lt (int .instance.minReplicas) 1 }}
{{- fail "queue sampling runs in workers: minReplicas must be >=1; scale-to-zero needs an independent sampler" }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .instance.name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .instance.name }}
  minReplicas: {{ .instance.minReplicas }}
  maxReplicas: {{ .instance.maxReplicas }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - {type: Pods, value: 2, periodSeconds: 60}
    scaleDown:
      # L4 stockouts run weekly-to-biweekly (vendor-routing runbook): a node
      # released by a scale-down may be unobtainable for hours. Shed slowly and
      # hold the warm fleet; the minReplicas floor stays standing regardless.
      stabilizationWindowSeconds: {{ .instance.scaleDownStabilizationSeconds }}
      policies:
        - {type: Pods, value: 1, periodSeconds: 600}
  metrics:
    - type: External
      external:
        metric:
          name: omi_batch_pipeline_gpu_chain_busy_seconds
          selector:
            matchLabels:
              worker_release: {{ .Release.Name }}
              namespace: {{ .Release.Namespace }}
        target:
          # Fleet worker_flight busy seconds per second, i.e. demand for the
          # exclusive GPU chain each replica exists to hold. The 0.5 average
          # is ~89% of the measured healthy per-worker chain ceiling (0.56,
          # hpafit 2026-11-01 replay: 0 starved minutes over 24h; the prior
          # ready-backlog metric thrashed 10-16 replicas during a stockout
          # while GPU demand stayed under 3 GPU-equivalents).
          type: AverageValue
          averageValue: {{ .instance.chainTarget | quote }}
{{- end }}
{{- end }}
{{- if and .Values.enabled .Values.autoscaling.enabled }}
{{- $root := . }}
{{- range $instance := (include "batch-pipeline-worker.instances" . | fromYamlArray) }}
{{ include "batch-pipeline-worker.hpa" (dict "Values" $root.Values "Release" $root.Release "instance" $instance) }}
---
{{- end }}
{{- end }}

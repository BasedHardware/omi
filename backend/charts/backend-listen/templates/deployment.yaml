{{- if .Values.workloadIdentityOnly }}
{{- $keyCredentialNames := list "SERVICE_ACCOUNT_JSON" "GOOGLE_APPLICATION_CREDENTIALS" }}
{{- range .Values.env }}
{{- if has .name $keyCredentialNames }}
{{- fail "workloadIdentityOnly forbids key credential environment variables" }}
{{- end }}
{{- end }}
{{- range $name, $_ := (.Values.privateEnv | default dict) }}
{{- if has $name $keyCredentialNames }}
{{- fail "workloadIdentityOnly forbids key credential environment variables" }}
{{- end }}
{{- end }}
{{- range ((.Values.privateSecretEnv | default dict).keys | default list) }}
{{- if has . $keyCredentialNames }}
{{- fail "workloadIdentityOnly forbids key credential environment variables" }}
{{- end }}
{{- end }}
{{- end }}
{{- /*
privateSecretEnv declares the NAMES of private env values (e.g. a cohort uid
list) whose values live only in Secret Manager. The backend-secrets chart syncs
them into secretName through External Secrets; this chart renders one
secretKeyRef per name, so a deploy render never carries a private value and the
drift gate compares references, not payloads. Once it is set, the retired
privateEnv overlay must stay empty: a value change is a new Secret Manager
version plus a rollout restart, never a code deploy.
*/}}
{{- $secretEnv := .Values.privateSecretEnv | default dict }}
{{- $secretKeys := $secretEnv.keys | default list }}
{{- if $secretKeys }}
{{- if not $secretEnv.secretName }}
{{- fail "privateSecretEnv.secretName is required when privateSecretEnv.keys is set" }}
{{- end }}
{{- if ne (len $secretKeys) (len (uniq $secretKeys)) }}
{{- fail "privateSecretEnv.keys has a duplicate name" }}
{{- end }}
{{- if (.Values.privateEnv | default dict) }}
{{- fail "privateEnv is retired once privateSecretEnv is set: add the value to the Secret Manager document instead" }}
{{- end }}
{{- range $secretKeys }}
{{- if not (regexMatch "^[A-Z][A-Z0-9_]*$" .) }}
{{- fail "privateSecretEnv.keys has a name that is not an env var name" }}
{{- end }}
{{- /* A secretKeyRef would silently replace a chart-derived value or a workflow_dispatch --set override. */}}
{{- if has . (list "GOOGLE_CLOUD_PROJECT" "OMI_LLM_GATEWAY_FEATURE_MODE" "OMI_LLM_CHAT_AGENT_ROUTE" "OMI_LLM_GATEWAY_ALLOW_DIRECT_MODEL_EXCEPTION" "STT_SERVICE_MODELS" "TRANSLATION_SERVICE_MODELS") }}
{{- fail (printf "privateSecretEnv.keys cannot name %s: it is chart-derived or a workflow_dispatch override" .) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend-listen.fullname" . }}
  labels:
    {{- include "backend-listen.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  # A 12-60 HPA replica rollout paced by node autoscaler routinely needs >600s
  # (the k8s default); the deploy CLI already waits 1800s. Keep these aligned so
  # a healthy-but-slow rollout finishes instead of failing at the k8s deadline.
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds | default 1800 }}
  selector:
    matchLabels:
      {{- include "backend-listen.selectorLabels" . | nindent 6 }}
  {{- with .Values.strategy}}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "backend-listen.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "backend-listen.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.terminationGracePeriodSeconds}}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ required "image.repository is required" .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ required "image.tag is required" .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- $v3StartupEnv := .Values.conversationsV3StartupEnv | default dict }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- /*
          privateEnv (NAME: string) comes from a values file the prod workflow
          renders from a protected-environment secret. Each name is emitted
          exactly once: a privateEnv key replaces the env entry of the same
          name, because duplicate names break strategic-merge upgrades.
          */}}
          {{- $privateEnv := .Values.privateEnv | default dict }}
          env:
            # Immutable rollout exporter identity, including supervised GPU children.
            - name: ROLLOUT_POD_TEMPLATE_HASH
              valueFrom:
                fieldRef: {fieldPath: "metadata.labels['pod-template-hash']"}
            {{- if (.Values.parakeetShapeCanary | default dict).enabled }}
            - name: PARAKEET_SHAPE_CANARY_FILE
              value: /var/run/parakeet-shape/route.json
            {{- end }}
            {{- range .Values.env }}
            {{- if not (or (hasKey $privateEnv .name) (has .name $secretKeys) (hasKey $v3StartupEnv .name)) }}
            - name: {{ .name }}
              {{- if eq .name "GOOGLE_CLOUD_PROJECT" }}
              value: {{ required "runtimeGcpProjectId is required" $.Values.runtimeGcpProjectId | quote }}
              {{- else if hasKey . "value" }}
              value: {{ .value | quote }}
              {{- else if hasKey . "valueFrom" }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- if $v3StartupEnv }}
            {{- include "backend-listen.conversationsV3StartupEnv" . | nindent 12 }}
            {{- end }}
            {{- range $name, $value := $privateEnv }}
            {{- if hasKey $v3StartupEnv $name }}
            {{- fail "privateEnv cannot override a conversationsV3StartupEnv key" }}
            {{- end }}
            {{- if not (regexMatch "^[A-Z][A-Z0-9_]*$" $name) }}
            {{- fail "privateEnv has a key that is not an env var name" }}
            {{- end }}
            {{- if not (kindIs "string" $value) }}
            {{- fail (printf "privateEnv.%s must be a string" $name) }}
            {{- end }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $secretKeys }}
            {{- if hasKey $v3StartupEnv . }}
            {{- fail "privateSecretEnv cannot override a conversationsV3StartupEnv key" }}
            {{- end }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv.secretName }}
                  key: {{ . }}
                  optional: false
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.volumeMounts (.Values.parakeetShapeCanary | default dict).enabled }}
          volumeMounts:
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if (.Values.parakeetShapeCanary | default dict).enabled }}
            - name: parakeet-shape-route
              mountPath: /var/run/parakeet-shape
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.volumes (.Values.parakeetShapeCanary | default dict).enabled }}
      volumes:
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if (.Values.parakeetShapeCanary | default dict).enabled }}
        - name: parakeet-shape-route
          configMap:
            name: parakeet-shape-route
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

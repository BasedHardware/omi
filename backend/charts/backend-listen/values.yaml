# Measurement restore; requires the GMP CRD and a namespace-local
# metrics-scrape-token Secret (key: token) supplied by the backend-secrets chart.
podMonitoring:
  enabled: true
  interval: 15s
# The backend unit fixture (tests/unit/test_live_capture_retention_limits.py)
# pins every *values.yaml declaration; base files carry the kill-switches off.
podLabels:
  service_name: backend-listen
env:
  - name: RECORD_TOKEN_LEASE_MODE
    valueFrom:
      configMapKeyRef: {name: dev-omi-backend-config, key: RECORD_TOKEN_LEASE_MODE}
  - name: RECORD_TOKEN_LEASE_MODE_SERVE_PERCENT
    valueFrom:
      configMapKeyRef: {name: dev-omi-backend-config, key: RECORD_TOKEN_LEASE_MODE_SERVE_PERCENT}
  - name: RECORD_TOKEN_LEASE_SECONDS
    valueFrom:
      configMapKeyRef: {name: dev-omi-backend-config, key: RECORD_TOKEN_LEASE_SECONDS}
  - name: RECORD_TOKEN_LEASE_DEPLOYED_AT
    valueFrom:
      configMapKeyRef: {name: dev-omi-backend-config, key: RECORD_TOKEN_LEASE_DEPLOYED_AT}
  - name: LIVE_CAPTURE_WINDOW_MERGE_PRESERVATION
    value: "false"
  - name: LIVE_CAPTURE_WINDOW_MERGE_UNION
    value: "false"

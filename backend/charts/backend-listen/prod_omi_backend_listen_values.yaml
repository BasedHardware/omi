resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  requests:
    cpu: 1
    memory: 1.5Gi
  limits:
    cpu: 2
    memory: 3.5Gi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /v1/health
    port: 8080
  failureThreshold: 5
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /v1/health
    port: 8080
  failureThreshold: 3
  periodSeconds: 10
  timeoutSeconds: 5

startupProbe:
  httpGet:
    path: /v1/health
    port: 8080
  failureThreshold: 30
  periodSeconds: 10
  timeoutSeconds: 5

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: true
  minReplicas: 40
  maxReplicas: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Percent
        value: 20
        periodSeconds: 300
      - type: Pods
        value: 1
        periodSeconds: 120
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 50
        periodSeconds: 15
      - type: Pods
        value: 5
        periodSeconds: 15
      selectPolicy: Max
  # D0b: CPU is the primary signal. The HPA takes the max across metrics and
  # ignores ratios within 10% of target, so 55% acts above ~60% mean CPU. On the
  # 2026-10-19 incident, mean listen CPU peaked at 0.56-0.65 of request while
  # the hottest pods saturated, so a 60-70% target would never have fired.
  targetCPUUtilizationPercentage: 55
  # targetMemoryUtilizationPercentage: 70
  # failedResponseCode: 10
  # Socket guards stay as secondary metrics so a CPU dip cannot strand
  # sockets on too few pods. Raised 10->16 and 22->35 together (D0b plan) so
  # they bind only on connection surges, not at ordinary load.
  requestsPerPod: 16
  activeConnectionsPerPod: 35

podDisruptionBudget:
  minAvailable: "80%"
  # maxUnavailable: "20%"

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 2

terminationGracePeriodSeconds: 120
lifecycle:
  preStop:
    exec:
      command: ["sh", "-c", "sleep 15"]

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# Placement uses service/env labels, not pool names or CPU family.
# New N4 and qualified N2 fallback pools retain the affinity labels below.
nodeSelector: {}

tolerations: []

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: service
              operator: In
              values:
                - backend-listen
            - key: env
              operator: In
              values:
                - prod
            - key: type
              operator: In
              values:
                - high-cpu

progressDeadlineSeconds: 1800
# Default values for backend-listen.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: gcr.io/based-hardware-dev/backend
  # This sets the pull policy for images.
  pullPolicy: Always
  # Build-specific; CI/manual deploy must pass --set-string image.tag=<short-sha>.
  tag: ""

# GKE host / image project. Chart defaults keep GOOGLE_CLOUD_PROJECT aligned with
# composed runtime_env gke.backend-listen (compute). Customer Firestore must not
# rely on this env: database/_client.py pins SERVICE_ACCOUNT_JSON + its
# project_id (based-hardware). Deploy may still --set runtimeGcpProjectId from
# vars.RUNTIME_GCP_PROJECT_ID (manifest runtime_gcp_project = based-hardware).
gcpProjectId: based-hardware-dev
runtimeGcpProjectId: based-hardware-dev

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  # Development-only parity-pack exporter GSA (WI). Customer-data Firestore and
  # Firebase Admin must use nik-164 via SERVICE_ACCOUNT_JSON — never this pack
  # WI identity. Both have objectAdmin on the pack bucket for cassette export.
  annotations:
    iam.gke.io/gcp-service-account: dev-omi-listen-parity-pack@based-hardware-dev.iam.gserviceaccount.com
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels:
  env: dev
  # Reconnect and circuit-breaker aggregates are emitted by backend-listen.
  # Keep those scrape targets in the same development-only evidence plane as
  # the Pusher targets.

podSecurityContext:
  # The image runs as omi:omi (10001:10001). Kubernetes mounts emptyDir as
  # root-owned, so the parity-pack cassette root needs this supplemental group
  # before the non-root listener can create its cassettes/ directory.
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8080
  annotations:
    cloud.google.com/neg: '{"exposed_ports": {"8080":{"name": "dev-backend-listen-neg"}}}'

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local


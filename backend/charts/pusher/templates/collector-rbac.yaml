{{- /*
The release that owns the shared ServiceAccount also owns the collector's read grant on
metrics-scrape-token. An isolated prod canary (serviceAccount.create=false) borrows that release's
identity, and the shared Role already covers the same collector and secret in this namespace; the CI
deployer cannot create RBAC, so a per-canary Role would fail every prod Pusher promotion.
*/}}
{{- if and .Values.podMonitoring.enabled .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pusher.fullname" . }}-metrics-scrape
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pusher.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["metrics-scrape-token"]
    # resourceNames requires a metadata.name field selector for list/watch; plain list is denied, and the live collector needs watch (it failed with "watch unknown" before).
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pusher.fullname" . }}-metrics-scrape
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pusher.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "pusher.fullname" . }}-metrics-scrape
subjects:
  - kind: ServiceAccount
    name: collector
    namespace: gmp-system
{{- end }}

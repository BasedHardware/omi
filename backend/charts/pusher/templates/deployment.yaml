apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pusher.fullname" . }}
  labels:
    {{- include "pusher.labels" . | nindent 4 }}
spec:
  {{- if not (hasKey .Values "minReadySeconds") }}
  {{- fail "minReadySeconds is required" }}
  {{- end }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  progressDeadlineSeconds: {{ required "progressDeadlineSeconds is required" .Values.progressDeadlineSeconds }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pusher.selectorLabels" . | nindent 6 }}
  {{- with .Values.strategy}}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "pusher.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pusher.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.terminationGracePeriodSeconds}}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $repository := required "image.repository is required" .Values.image.repository }}
          {{- $digest := .Values.image.digest }}
          {{- if $digest }}
          {{- if not (regexMatch "^sha256:[a-f0-9]{64}$" $digest) }}{{- fail (printf "image.digest must be sha256:<64 lowercase hex characters>, got %q" $digest) }}{{- end }}
          {{- if .Values.image.tag }}{{- fail "image.tag must be empty when image.digest pins the release (digest is the content address)" }}{{- end }}
          {{- if ne .Values.image.pullPolicy "IfNotPresent" }}{{- fail "image.pullPolicy must be IfNotPresent for a digest-pinned release (the digest is the content address; Always only adds a registry round-trip)" }}{{- end }}
          {{- end }}
          image: "{{ if $digest }}{{ $repository }}@{{ $digest }}{{ else }}{{ $repository }}:{{ required "image.tag is required when image.digest is absent" .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- $runtimeConfigMapName := required "runtimeConfigMapName is required" .Values.runtimeConfigMapName }}
          envFrom:
            - configMapRef:
                name: {{ $runtimeConfigMapName | quote }}
          {{- /*
          privateEnv (NAME: string) comes from a values file the prod workflow renders from the protected-environment
          secret PUSHER_PRIVATE_VALUES_YAML, the same pattern as backend-listen. Each name is emitted exactly once: a
          privateEnv key replaces the env entry of the same name, because duplicate names break strategic-merge upgrades.
          */}}
          {{- $privateEnv := .Values.privateEnv | default dict }}
          {{- if or .Values.env $privateEnv }}
          env:
            {{- range .Values.env }}
            {{- if not (hasKey $privateEnv .name) }}
            {{- $entry := deepCopy . }}
            {{- $valueFrom := get $entry "valueFrom" }}
            {{- if and (kindIs "map" $valueFrom) (hasKey $valueFrom "configMapKeyRef") }}
            {{- $configMapKeyRef := get $valueFrom "configMapKeyRef" }}
            {{- if kindIs "map" $configMapKeyRef }}
            {{- $_ := set $configMapKeyRef "name" $runtimeConfigMapName }}
            {{- end }}
            {{- end }}
            {{- toYaml (list $entry) | nindent 12 }}
            {{- end }}
            {{- end }}
          {{- range $name, $value := $privateEnv }}
            {{- if ne $name "MEDIA_NOISE_MODE_SERVE_UID_SHA256S" }}
            {{- fail "pusher privateEnv allows only MEDIA_NOISE_MODE_SERVE_UID_SHA256S; runtime settings stay ConfigMap-owned" }}
            {{- end }}
            {{- if not (regexMatch "^[A-Z][A-Z0-9_]*$" $name) }}
            {{- fail "privateEnv has a key that is not an env var name" }}
            {{- end }}
            {{- if not (kindIs "string" $value) }}
            {{- fail (printf "privateEnv.%s must be a string" $name) }}
            {{- end }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

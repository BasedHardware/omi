resources:
  # Right-sized 2026-10-26 from 7d prod telemetry (172 pods, 5m steps, ro-prod
  # Prometheus): working set fleet p50/p99 = 0.68/1.18Gi, worst-pod p99 1.38Gi,
  # fleet max 2.27Gi; CPU fleet p50/p99 = 220/495m, per-pod max 694m; zero
  # container restarts or OOM kills in 30d. Memory request = 1.44x worst-pod
  # p99; limit 3.5Gi = 1.54x fleet max and keeps the sum of three co-located
  # limits (10.5Gi) plus ~0.6Gi of DaemonSet requests under the node's 12.87Gi
  # allocatable, so correlated spikes cannot reach kubelet node-pressure
  # eviction (lead ruling 2026-10-26: three pods per node, not four). CPU
  # request 450m yields exactly three pods per n4-highmem-2 node — 3x450m =
  # 1350m of ~1530m allocatable after ~358m of DaemonSet requests, while
  # 4x450m = 1800m can never fit — and aggregate p99 usage (3x495m = 1485m)
  # stays under the node's 1930m allocatable. The HPA is unaffected: it
  # scales on the external pusher_active_ws_connections_per_pod metric, not
  # resource utilization.
  # CPU limit raised 0.7 -> 1.0 on 2026-10-27: with the 0.7 limit the pusher
  # container was CFS-throttled in 22% of periods (steady over 1h and 6h)
  # while its p99 usage was only 409m, so sub-100ms bursts on the live audio
  # path were hitting the cap. Scheduling uses requests, so packing (three
  # pods per node) and node count are unchanged; under node contention CFS
  # still shares CPU by request weight.
  requests:
    cpu: 0.45
    memory: 2Gi
  limits:
    cpu: 1.0
    memory: 3.5Gi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /health
    port: 8080
  failureThreshold: 5
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  failureThreshold: 3
  initialDelaySeconds: 0
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5

startupProbe:
  httpGet:
    path: /health
    port: 8080
  failureThreshold: 60
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: true
  minReplicas: 12
  maxReplicas: 40
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Percent
        value: 20
        periodSeconds: 300
      - type: Pods
        value: 1
        periodSeconds: 120
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
      - type: Percent
        value: 30
        periodSeconds: 60
      - type: Pods
        value: 5
        periodSeconds: 60
      selectPolicy: Max
  # targetCPUUtilizationPercentage: 60
  # targetMemoryUtilizationPercentage: 60
  # Intentionally higher than backend-listen (22): pusher's WebSocket
  # handling profile sustains 30 concurrent connections per pod, while
  # backend-listen does not. Keep the two values independently tuned (#6752).
  activeConnectionsPerPod: 30

podDisruptionBudget:
  minAvailable: "80%"
  # maxUnavailable: "20%"

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 2

terminationGracePeriodSeconds: 120
lifecycle:
  preStop:
    exec:
      # preStop flips readiness (via Lane A /__internal/drain) so the kubelet removes the endpoint
      # early; sleep covers NEG->backend-service->ALB reprogram convergence before SIGTERM.
      command: ["sh", "-c", "curl -sf -m 5 -X POST http://localhost:8080/__internal/drain || true; sleep 15"]

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# Placement uses service/env labels, not pool names or CPU family.
# New N4 and qualified N2 fallback pools retain the affinity labels below.
nodeSelector: {}

tolerations: []

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: service
              operator: In
              values:
                - pusher
            - key: env
              operator: In
              values:
                - prod
            - key: version
              operator: In
              values:
                - v3

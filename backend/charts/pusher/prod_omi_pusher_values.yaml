# Default values for pusher.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# At the 40-pod HPA ceiling, Pusher needs fourteen waves. The committed probe
# and availability settings make that a 8960s healthy-rollout budget; retain
# one 640s per-pod allowance of scheduler headroom above it. CI recalculates
# this bound from the chart whenever any rollout input changes.
minReadySeconds: 0
progressDeadlineSeconds: 9600

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: gcr.io/based-hardware/pusher
  # This sets the pull policy for images.
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  # Build-once promotion: set `digest: sha256:<64 lowercase hex>` (and clear
  # `tag`, set `pullPolicy: IfNotPresent`) to promote the exact dev-qualified
  # image by content address. Malformed/ambiguous identity is rejected at
  # render time. See backend/scripts/verify_pusher_rollout_gate.py.

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: false
  # Annotations to add to the service account.
  # Keyless runtime identity (Workload Identity). The pod mounts no service-account key:
  # Firestore, Firebase Auth, FCM, Cloud Tasks and GCS all run as this account.
  annotations:
    iam.gke.io/gcp-service-account: pusher-runtime@based-hardware.iam.gserviceaccount.com
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 10001
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  backendConfig: prod-pusher-backend-config
  port: 8080
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "prod-pusher-backend-config"}'  # Link to BackendConfig

# BackendConfig connectionDraining: bounds how long the LB waits before cutting
# in-flight WS on endpoint removal (must be <= terminationGracePeriodSeconds 120).
backendConfig:
  connectionDraining:
    drainingTimeoutSec: 60

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: true
  className: ""
  annotations:
    kubernetes.io/ingress.class: "gce-internal"
    kubernetes.io/ingress.regional-static-ip-name: "prod-pusher-ilb-ip-address"
    kubernetes.io/ingress.allow-http: "true"
  hosts:
    - host: pusher.omi.me
      paths:
        - path: /
          pathType: Prefix

  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local


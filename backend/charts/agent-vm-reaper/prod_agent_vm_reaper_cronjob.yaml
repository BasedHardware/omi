---
# Reaper for leaked `omi-agent-*` GCE VMs (desktop agent sandboxes).
#
# Why this exists: the Agent VM reconciler owns release convergence, safe
# idle-stop, and owner-fenced lifecycle repair.  This CronJob remains the
# terminal cleanup backstop for TERMINATED instances whose Firestore owner is
# already gone or whose grace period has elapsed.
#
# This CronJob bounds the fleet hourly (see backend/scripts/agent_vm_reaper.py):
#   - delete TERMINATED omi-agent VMs whose lastStopTimestamp is older than
#     REAP_TERMINATED_MIN_AGE_HOURS (grace so same-day resume can still
#     start_stopped_vm; after grace the status NOT_FOUND path clears Firestore
#     and AgentVMService re-provisions + re-uploads the DB).
#
# RUNNING VMs are intentionally NOT reaped: agent-proxy session leases and the
# reconciler's drain state are the authority for active work.
#
# Install / IAM / ConfigMap sync (refuse-by-default):
#   AGENT_VM_REAPER_APPLY=1 bash backend/scripts/apply-agent-vm-reaper.sh
# Enable deletes after reviewing dry-run job logs:
#   AGENT_VM_REAPER_APPLY=1 AGENT_VM_REAPER_LIVE=1 bash backend/scripts/apply-agent-vm-reaper.sh
#
# The reconciler is deployed as a Cloud Run Job and triggered every five
# minutes; see backend/scripts/apply-agent-vm-reconciler-scheduler.sh.
#
# Checked-in default is DRY_RUN=true so a bare `kubectl apply -f` is log-only.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: prod-agent-vm-reaper
  namespace: prod-omi-backend
spec:
  schedule: "0 * * * *"  # hourly
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  timeZone: UTC
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: prod-agent-vm-reaper-sa
          restartPolicy: OnFailure
          containers:
          - name: reaper
            image: google/cloud-sdk:slim
            env:
            - name: GCE_PROJECT
              value: "based-hardware"
            - name: REAP_TERMINATED_MIN_AGE_HOURS
              value: "12"
            # Safe default: log-only. Flip via apply-agent-vm-reaper.sh LIVE=1.
            - name: DRY_RUN
              value: "true"
            # Required together with DRY_RUN=false for the Python live gate.
            - name: AGENT_VM_REAPER_LIVE
              value: "1"
            volumeMounts:
            - name: reaper-script
              mountPath: /scripts
              readOnly: true
            command: ["python3"]
            args: ["/scripts/agent_vm_reaper.py"]
          volumes:
          - name: reaper-script
            configMap:
              name: prod-agent-vm-reaper-script
              defaultMode: 0555
---
# Workload-identity KSA. GSA + IAM bindings are created by
# backend/scripts/apply-agent-vm-reaper.sh (node default SA only has compute.viewer
# and cannot delete instances).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prod-agent-vm-reaper-sa
  namespace: prod-omi-backend
  annotations:
    iam.gke.io/gcp-service-account: agent-vm-reaper@based-hardware.iam.gserviceaccount.com

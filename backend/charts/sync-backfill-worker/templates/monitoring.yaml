{{- if .Values.podMonitoring.enabled }}
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: {{ .Release.Name }}
spec:
  targetLabels:
    fromPod:
      - {from: service_name, to: service_name}
  selector:
    matchLabels: {app.kubernetes.io/name: sync-backfill-worker, app.kubernetes.io/instance: {{ .Release.Name }}}
  endpoints:
    - {port: http, path: /metrics, interval: 15s}
{{- end }}

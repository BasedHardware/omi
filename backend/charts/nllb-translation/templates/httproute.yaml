{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-gw" (include "nllb-translation.fullname" . | trunc 60 | trimSuffix "-") }}
  labels:
    {{- include "nllb-translation.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ required "gateway.name is required when gateway.enabled=true" .Values.gateway.name | quote }}
      sectionName: {{ .Values.gateway.listenerName | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.pathPrefix | quote }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ printf "%s-gw" (include "nllb-translation.fullname" . | trunc 60 | trimSuffix "-") }}
          port: {{ .Values.service.port }}
{{- end }}

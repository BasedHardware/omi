{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "diarizer.fullname" . }}
  labels:
    {{- include "diarizer.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "diarizer.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  {{- if .Values.autoscaling.behavior }}
  behavior:
    {{- toYaml .Values.autoscaling.behavior | nindent 4 }}
  {{- end }}
  metrics:
    {{- if .Values.autoscaling.queueDepthAverageValue }}
    - type: Pods
      pods:
        metric:
          name: omi_diarization_v2_queue_depth
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.queueDepthAverageValue | quote }}
    {{- end }}
    {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
    {{- if .Values.autoscaling.requestLatencyP99 }}
    - type: External
      external:
        metric:
          name: diarizer_request_latency_p99
        target:
          type: Value
          value: {{ .Values.autoscaling.requestLatencyP99 }}
    {{- end }}
{{- end }}

# David-only floor 1; lift to 6 after cohort qualification (max 18).
# Separate release only: -f prod_omi_diarizer_values.yaml -f this file.
# Lead-owned opt-in deployment; never install over prod-omi-diarizer.
fullnameOverride: prod-omi-diarizer-batch
command: [uvicorn, "batch_main:app", "--host", "0.0.0.0", "--port", "8080", "--loop", uvloop]
replicaCount: 1
# New batch release uses the shared Gateway; it has no legacy callers to retain.
ingress:
  enabled: false
gateway:
  enabled: true
  name: prod-omi-internal-gateway
  pathPrefix: /diarizer-batch
  timeoutSeconds: 900
# Replace the inherited embedding affinity entirely. Both label and taint
# isolate batch capacity from existing embedding and other GPU workloads.
affinity: null
# No cloud.google.com/gke-nodepool pin: diarizer-batch-pool and its Spot
# sibling share the service/env labels and omi.ai taints, so the autoscaler
# can place replicas on Spot first while the on-demand pool stays the fallback.
nodeSelector:
  service: diarizer-batch
  env: prod
tolerations:
  - key: omi.ai/diarizer-batch
    operator: Equal
    value: "true"
    effect: NoSchedule
  - key: nvidia.com/gpu
    operator: Equal
    value: present
    effect: NoSchedule
env:
  - name: DIARIZATION_V2_ENABLED
    value: "true"
  - name: HUGGINGFACE_TOKEN
    valueFrom:
      secretKeyRef:
        name: prod-omi-backend-secrets
        key: HUGGINGFACE_TOKEN
podMonitoring:
  enabled: false
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 18
  requestLatencyP99: null
  # 2026-11-01 (marginfleet): raised 1 -> 3. Target 1 provisioned one T4 node
  # per queued item while the 7d queue was p50=0, max=4, fleet avg 0.53 and the
  # fleet idled at ~3 T4 nodes (n1-standard-8 + T4 ~= $0.65/h each) with most
  # pods at zero GPU engine activity. Target 3 lets each pod absorb a small
  # backlog before scale-out; burst latency cost is minutes on a batch-path
  # service whose consumers (first-summary p95 121s) tolerate it. Scale-up
  # behavior is unchanged (0s stabilization, +3 pods/60s), so Monday bursts
  # still get capacity; scale-down keeps the 900s window.
  queueDepthAverageValue: 3
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 3
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 900
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
backendConfig:
  name: prod-omi-diarizer-batch-backend-config
  timeoutSeconds: 900

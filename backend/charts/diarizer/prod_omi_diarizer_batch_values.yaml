# Autoscaled burst release; a separate on-demand release supplies one warm pod.
# Combined serving ceiling is 18 (17 here + 1 fallback).
# Separate release only: -f prod_omi_diarizer_values.yaml -f this file.
# Lead-owned opt-in deployment; never install over prod-omi-diarizer.
fullnameOverride: prod-omi-diarizer-batch
command: [uvicorn, "batch_main:app", "--host", "0.0.0.0", "--port", "8080", "--loop", uvloop]
replicaCount: 1
# New batch release uses the shared Gateway; it has no legacy callers to retain.
ingress:
  enabled: false
gateway:
  enabled: true
  name: prod-omi-internal-gateway
  pathPrefix: /diarizer-batch
  timeoutSeconds: 900
# Replace the inherited embedding affinity entirely. Both label and taint
# isolate batch capacity from existing embedding and other GPU workloads.
affinity:
  nodeAffinity:
    # Helm merges maps with prod values: remove the embedding-only requirement.
    requiredDuringSchedulingIgnoredDuringExecution: null
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: cloud.google.com/gke-spot
              operator: In
              values: ["true"]
# No cloud.google.com/gke-nodepool pin: diarizer-batch-pool and its Spot
# sibling share the service/env labels and omi.ai taints, so the autoscaler
# can place replicas on Spot first while the on-demand pool stays the fallback.
nodeSelector:
  service: diarizer-batch
  env: prod
# Both batch releases serve through the existing ClusterIP and Gateway Service.
# Deployment selectors retain their release instance, so controllers cannot overlap.
podLabels:
  omi.ai/diarizer-batch-route: prod
service:
  selectorLabels:
    app.kubernetes.io/name: diarizer
    omi.ai/diarizer-batch-route: prod
tolerations:
  - key: omi.ai/diarizer-batch
    operator: Equal
    value: "true"
    effect: NoSchedule
  - key: nvidia.com/gpu
    operator: Equal
    value: present
    effect: NoSchedule
env:
  - name: DIARIZATION_V2_ENABLED
    value: "true"
  - name: HUGGINGFACE_TOKEN
    valueFrom:
      secretKeyRef:
        name: prod-omi-backend-secrets
        key: HUGGINGFACE_TOKEN
podMonitoring:
  enabled: false
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 17
  requestLatencyP99: null
  queueDepthAverageValue: 1
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 3
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 900
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
backendConfig:
  name: prod-omi-diarizer-batch-backend-config
  timeoutSeconds: 900

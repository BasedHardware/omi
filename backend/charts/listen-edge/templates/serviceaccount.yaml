{{/*
The edge talks to backend-listen over plain websockets and reads nothing from
Kubernetes or GCP, so its service account mounts no token and binds no
workload identity.
*/}}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "listen-edge.serviceAccountName" . }}
  labels:
    {{- include "listen-edge.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}

{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "parakeet.fullname" . }}
  labels:
    {{- include "parakeet.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "parakeet.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  {{- if .Values.autoscaling.behavior }}
  behavior:
    {{- toYaml .Values.autoscaling.behavior | nindent 4 }}
  {{- end }}
  metrics:
    {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
    {{- if .Values.autoscaling.streamsPerPod }}
    - type: Pods
      pods:
        metric:
          name: parakeet_active_streams
        target:
          type: AverageValue
          averageValue: "{{ .Values.autoscaling.streamsPerPod }}"
    {{- end }}
    {{- if .Values.autoscaling.requestsPerPod }}
    - type: Pods
      pods:
        metric:
          name: parakeet_active_requests_total
        target:
          type: AverageValue
          averageValue: "{{ .Values.autoscaling.requestsPerPod }}"
    {{- end }}
    {{- if and .Values.autoscaling.targetGPUUtilization (not .Values.autoscaling.demand.enabled) }}
    - type: External
      external:
        metric:
          name: parakeet_gpu_utilization
        target:
          type: Value
          value: "{{ .Values.autoscaling.targetGPUUtilization }}"
    {{- end }}
    {{- if and .Values.autoscaling.requestLatencyP99 (not .Values.autoscaling.workloadOnly) (not .Values.autoscaling.demand.enabled) }}
    - type: External
      external:
        metric:
          name: parakeet_request_latency_p99
        target:
          type: Value
          value: "{{ .Values.autoscaling.requestLatencyP99 }}"
    {{- end }}
    {{- if .Values.autoscaling.demand.enabled }}
    {{- range $lane, $target := dict "live" .Values.autoscaling.demand.liveQueueAgeSeconds "backfill" .Values.autoscaling.demand.backfillQueueAgeSeconds }}
    - type: Pods
      pods:
        metric:
          name: parakeet_{{ $lane }}_queue_age_seconds
        target:
          type: AverageValue
          averageValue: "{{ $target }}"
    {{- end }}
    {{- end }}
{{- end }}

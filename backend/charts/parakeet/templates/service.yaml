{{- if .Values.backendConfig.enabled }}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ include "parakeet.backendConfigName" . }}
spec:
  timeoutSec: {{ .Values.backendConfig.timeoutSec }}
  connectionDraining:
    drainingTimeoutSec: {{ .Values.backendConfig.drainingTimeoutSec }}
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 5
    port: {{ .Values.service.port }}
    type: HTTP
    requestPath: /health  # Ensure this path returns 200 OK
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "parakeet.fullname" . }}
  labels:
    {{- include "parakeet.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.service.neg.enabled }}
    cloud.google.com/neg: '{"ingress": true}'
    {{- end }}
    {{- if .Values.backendConfig.enabled }}
    cloud.google.com/backend-config: {{ printf "{\"default\": \"%s\"}" (include "parakeet.backendConfigName" .) | quote }}
    {{- end }}
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "parakeet.selectorLabels" . | nindent 4 }}

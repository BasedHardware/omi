        flags:
          --service-account: backend-jobs-runtime@based-hardware.iam.gserviceaccount.com
        env:
          OMI_CUSTOMER_DATA_PROJECT:
            value: based-hardware
          BASE_API_URL:
            value: https://api.omi.me
          # EXP-001 is live in prod only (David, 2026-09-25). Dev stays 'false':

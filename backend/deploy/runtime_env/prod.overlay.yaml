    jobs:
      notifications-job:
        # Keyless (credential hygiene D4): run as the jobs runtime identity. Job deploys pass secrets
        # with --set-secrets (full replacement), so the undeclared nik-164 key ref is dropped by that;
        # --remove-secrets cannot be combined with it.
        flags:
          --service-account: backend-jobs-runtime@based-hardware.iam.gserviceaccount.com
        env:
          OMI_CUSTOMER_DATA_PROJECT:
            value: based-hardware
          PINECONE_INDEX_NAME:
            value: memories-backend
      x-connector-sync-job:
        # backend-runtime already mounts the X OAuth and RapidAPI secrets on the
        # Cloud Run API. backend-jobs-runtime does not, so this job cannot use
        # the notifications identity without a new secret grant.
        flags:
          --service-account: backend-runtime@based-hardware.iam.gserviceaccount.com
        secrets:
          REDIS_DB_PASSWORD:
            secret: REDIS_DB_PASSWORD
            version: latest
        env:
          REDIS_DB_HOST:
            value: redis-13151.c1.us-central1-2.gce.redns.redis-cloud.com
          REDIS_DB_PORT:
            value: '13151'
          # The canonical intake fence reads MEMORY_ENABLED; without it the job's
          # memory writes 503 with 'globally paused'.
          MEMORY_ENABLED:
            value: 'on'
          OMI_CUSTOMER_DATA_PROJECT:
            value: based-hardware
          PINECONE_INDEX_NAME:
            value: memories-backend
      memory-maintenance-job:
        secrets:

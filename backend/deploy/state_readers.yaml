# Durable batch-state custody, seeded after SCA-1894 (2026-11-13).
# Collection templates expand {namespace} to batch_pipeline_dev/prod (or the
# configured staging namespace). No document IDs, settings or live versions.
# Readers are a conservative deployment envelope: each can execute shared
# pipeline code, even when its local admission gate is off. Never remove the
# independently released GPU worker because Cloud Run admission is disabled.
# Minimum versions are source commits, NOT claims about currently served images.
# A semantics change must update every affected reader's required commit in the
# PR (an introducing ancestor or immutable release), and name its rollout order.
# Literal coverage is field-name based; computed/nested fields, queue names and
# object layouts still need explicit review. YAML anchors share custody metadata,
# not state entries. Add one collection.field, queue, prefix or flag per entry.
schema_version: 1
custody:
  pipeline: &pipeline
    writers: &pipeline_writers
      - cloud_run/backend
      - cloud_run/backend-sync
      - cloud_run/backend-sync-backfill
      - cloud_run/backend-integration
      - gke/backend-listen
      - desktop_backend
      - helm/batch-pipeline-worker
    readers: &pipeline_readers
      cloud_run/backend: "f3902ec5435809d95ac7c15f6be7e9f056564d3d"
      cloud_run/backend-sync: "f3902ec5435809d95ac7c15f6be7e9f056564d3d"
      cloud_run/backend-sync-backfill: "f3902ec5435809d95ac7c15f6be7e9f056564d3d"
      cloud_run/backend-integration: "f3902ec5435809d95ac7c15f6be7e9f056564d3d"
      gke/backend-listen: "f3902ec5435809d95ac7c15f6be7e9f056564d3d"
      desktop_backend: "f3902ec5435809d95ac7c15f6be7e9f056564d3d"
      helm/batch-pipeline-worker: "f3902ec5435809d95ac7c15f6be7e9f056564d3d"
    kill_switch:
      flag: BATCH_PIPELINE_WORKER_ENABLED
      service: helm/batch-pipeline-worker
    containment: Stops GPU worker startup/pulls after rollout; API maintenance needs its own serving switch.
  serving: &serving
    writers: *pipeline_writers
    readers: *pipeline_readers
    kill_switch:
      flag: BATCH_PIPELINE_SERVING_ENABLED
      service: cloud_run/backend-integration
    containment: Stops this host's serving supervisor after rollout; apply on each serving reader that must stop.
  cursor: &cursor
    writers: [cloud_run/backend-integration]
    readers:
      cloud_run/backend-integration: "f3902ec5435809d95ac7c15f6be7e9f056564d3d"
    kill_switch:
      flag: RECORD_SEAL_REPAIR_ENABLED
      service: cloud_run/backend-integration
    containment: Gates the automatic repair tick on this host; explicit operator repair is separately authorized.

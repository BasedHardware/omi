# Only backend-sync, backend-sync-backfill and backend-integration use this
# revision-local config env. Backend/listen retain their existing scrape profile.
apiVersion: monitoring.googleapis.com/v1beta
kind: RunMonitoring
metadata:
  # The name becomes GMP job: preserve existing direct-query selectors.
  name: omi-cloud-run-application-metrics
spec:
  endpoints:
    - port: 9090
      path: /metrics
      interval: 60s
      timeout: 10s
      metricRelabeling:
        # Sync exporter: sync/resilience, journey SLO, owner recognition,
        # Core Features, Firestore amplification and queue-age consumers.
        # Sentinel: batch_metrics.py and completion_telemetry.py also query GMP
        # directly (batch, accept-to-summary, summary debt/terminal, live outcome).
        # Cost: Parakeet request seconds by caller size the GPU pool floor.
        # Keep the tier counter alongside caller/origin: all three observe the same reads.
        # Read-cache correctness shadows also run on sync/integration workers.
        # Firestore reads loop (avo/firestore-reads): billed reads by caller/origin
        # attribute ~55% of fleet reads and the leader-lease counter gates
        # singleton_loops. #22118 dropped them; the loop then misgraded a healthy
        # backend-sync lease holder as starvation (2026-10-20).
        # Firestore writes (fswrites): billed writes by collection/caller/origin size the
        # ~$57/day write bill (by_origin stays off sync to respect the samples limit).
        # Held content (#22840): the cap-hold redrive sweep runs only on backend-sync
        # and publishes the fleet snapshot gauges the held-content ramp gates on.
        # Legacy dark (contract (h)): drain_census and the 12h soak gates read
        # omi_legacy_sync_mode / _admissions_total / _dark_ack_total / _mode_read_total.
        # A2 job-store shadow (lane 12): parity_read.sh reads omi_jobstore_shadow_parity_total.
        # P58 language gate: legacy sync makes ~99.8% of the prerecorded probes, so the shadow
        # and enforce readouts and the Phase 0 vendor burn/breaker metrics must leave sync.
        # Cap enforcement (#23388): the dispatch decision and provider audio counters
        # are that fix's watch readout (stt-cap-dispatch.md) — closed enum labels only.
        # Batch ramp gates (batchdesign 2026-11-01 §7.1): the per-upload intake outcome
        # counter is the gate reading for every 25->100% ramp step; closed enum labels.
        # C5 exact-input reuse (2026-10-26): the dedupe hit/miss/checkpoint counters
        # are the soak readout for backend-sync/backfill/backend-integration.
        # error_class_* (errclass PR): sentinel sweep outcome counter + firing
        # gauge read by the omi-error-class-firing / -sweep-silent Grafana rules.
        # Bridge measurement: sync_.* includes absorbed and published-row counters.
        # Pinecone: bounded query/read-unit counters attribute retrieval spend on workers.
        # Enrichment early abort and repeat-supersede streak (2026-11-05, #24662/#24676): backend-integration
        # runs the enrichment consumer; both were invisible here until allowlisted (about 15 series).
        # Quiet checks (2026-11-10): the finalization route runs on backend-sync, so the
        # arm/empty-exit counters are born here; they predate the omi_ prefix and were
        # dropped by this keep rule. Keep them explicitly (see the shared profile too).
        # Shared timeliness leadership can move to backend-integration; keep every
        # sampler family so both direct GMP and the Prometheus bridge see its result.
        # Enrichment LLM cost/usage (SCA-2067, 2026-11-13): backend-integration runs
        # the enrichment consumer, but this keep rule dropped the in-process families
        # a release owner needs to measure the SCA-1960 guardrail regression. SCA-2057
        # proved the blind spot: attributable calls, shaped input tokens, notes-agent
        # cost and episode-moment cost were all absent from the integration scrape.
        # Every family below is emitted by one module with closed label enums; the
        # cost families stay estimates (the gateway ledger is authoritative), never
        # billed dollars. Explicit names, not a prefix catch-all, so a new family
        # needs its own consumer before it is scraped. ~250 series per instance.
        - action: keep
          sourceLabels:
            - __name__
          regex: 'omi_(backlog_state_transitions_total|record_token_late_append_total|record_token_lease_.*|runtime_percent(_source|_read_error_seconds)?|finalization_pair_.*|enrichment_summary_repair_.*|batch_record_pending_.*|record_seal_nojob_.*|enrichment_obligation_.*|enrichment_early_abort_total|enrichment_supersede_streak(_bucket|_count|_sum)?|finalization_byok_.*|conversation_finalization_dead_letter_total|listen_server_batch_suppression_total|listen_preview_batch_custody_total|delivery_outcome_total|people_scan_dedupe_total|pinecone_.*|playback_writes_total|sync_.*|journey_.*|client_journey_.*|owner_recognition_conversations_total|conversation_duration_seconds(_.*)?|conversation_relevance_decision_total|conversation_summary_vector_upserts_total|conversation_relevance_decision_total|firestore_documents_per_operation(_.*)?|capture_finalization_.*|queue_oldest_ready_.*|batch_pipeline_.*|batch_timeliness_.*|batch_allowance_held_units|batch_held_oldest_age_seconds|batch_projection_drain_oldest_age_seconds|batch_staged_input_clock_invalid_total|batch_held_expired_(total|units|observed_at_seconds)|batch_record_dead_letter_(total|units|observed_at_seconds)|batch_projection_drains_skipped_total|batch_projection_finish_(reads|completed)_total|batch_projection_claim_busy_backoffs_total|batch_projection_privacy_blocked_stops_total|batch_projection_privacy_backoffs_total|batch_projection_live_target_backoffs_total|batch_projection_privacy_row_changed_total|batch_projection_privacy_resumes_attempted_total|batch_projection_privacy_resumes_succeeded_total|batch_projection_privacy_fallthroughs_total|batch_projection_privacy_still_refused_total|batch_projection_page_collapsed_rows_total|batch_projection_drain_head_requeues_total|batch_intake_outcome_total|batch_admission_sample_window_total|batch_ramp_heavy_owner_excluded_total|batch_shadow_.*|accept_to_summary_seconds(_.*)?|summary_terminal_total|summary_debt_.*|live_session_transcript_outcome_total|fallback_total|parakeet_request_seconds(_.*)?|firestore_billed_reads(_by_(caller|origin))?_total|read_cache_shadow_total|firestore_caller_label_overflow_total|firestore_billed_writes(_by_caller)?_total|firestore_write_caller_label_overflow_total|firestore_ambiguous_commit_writes_total|firestore_noop_writes_by_caller_total|memory_released_projection_total|fsr_leader_lease_total|held_content_.*|held_recovery_pacing_.*|stt_cap_recovery_reconciliation_total|stt_cap_recovery_cohort_narrowed|stt_cap_cohort_.*|stt_cap_launch_config_errors.*|stt_cap_dispatch_decisions_total|stt_cap_provider_audio_seconds_total|legacy_sync_.*|legacy_dark_.*|jobstore_.*|capture_coverage_.*|capture_dedupe_shadow_total|capture_retry_cap_total|speaker_evidence_.*|speaker_evidence_confident_owner_total|lifecycle_refactor_shadow_total|executor_task_(active|queued)|clients_refactor_shadow_total|notes_refactor_shadow_total|notes_refactor_results_total|stt_language_gate_.*|prerecorded_vendor_.*|episode_compose_.*|error_class_.*|transcription_final_pass_total|transcription_final_pass_(total|unit_skips_total)|transcription_final_pass_(total|unit_skips_total|(agreement|latency_seconds|owner_delta_ratio)_(bucket|sum|count))|transcription_final_pass_(total|unit_skips_total|retry_terminal_(total|observed_at_seconds)|(agreement|latency_seconds|owner_delta_ratio)_(bucket|sum|count)))|conversation_llm_input_dedupe_.*|privacy_(checks|check_calls|check_reads|decision_mismatch|shadow_checks|memo_requests|memo_ineligible|ttl_cache|negative_lookup)_total|listen_quiet_check_.*|omi_conversation_llm_calls_total|omi_shaped_agent_input_tokens_total|omi_notes_agent_(runs|forced_runs|decisions|tool_use|refused_lookups|duplicate_lookups|repairs|tokens|transport_skips)_total|omi_notes_agent_(tool_calls|turns|estimated_cost_usd|cache_hit_ratio|latency_seconds)(_bucket|_count|_sum)?|omi_episode_moment_(cost_usd_total|tokens_total|updates_total)'
        # These eagerly initialized live-STT combinations dominate empty series
        # on sync workers. Keep fallbacks from sync/summary/storage components.
        - action: drop
          sourceLabels:
            - __name__
            - component
          regex: 'omi_fallback_total;(stt_live_session|stt_selection)'
  targetLabels:
    metadata:
      - service
  # Match the shared profile: adding the bounded tier family needs headroom;
  # GMP drops the entire scrape above this ceiling, not just excess samples.
  limits:
    samples: 15000
    labels: 30
    labelNameLength: 100
    labelValueLength: 256

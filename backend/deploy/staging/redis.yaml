# Staging Redis (decision S2: in-cluster, no Memorystore spend). Namespace `staging` on dev-omi-gke.
# Reached from staging Cloud Run by Direct VPC egress through an internal passthrough LoadBalancer;
# the LB's private IP becomes REDIS_DB_HOST (deploy.sh reads it). Password: k8s Secret
# staging/staging-redis (created by bootstrap_iam.sh from Secret Manager staging-redis-password).
# No persistence: staging state is disposable. Applied by deploy.sh on dev-operator.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: staging-redis
  namespace: staging
  labels: {app: staging-redis, env: staging}
spec:
  serviceName: staging-redis
  replicas: 1
  selector:
    matchLabels: {app: staging-redis}
  template:
    metadata:
      labels: {app: staging-redis, env: staging}
    spec:
      # No nodeSelector: default-pool is at its max size; any untainted CPU node fits 100m/512Mi.
      containers:
        - name: redis
          image: redis:7.2.5-alpine
          args:
            - --requirepass
            - $(REDIS_PASSWORD)
            - --maxmemory
            - 768mb
            - --maxmemory-policy
            - noeviction
            - --save
            - ''
            - --appendonly
            - 'no'
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: staging-redis, key: password}
          ports:
            - {name: redis, containerPort: 6379}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 1Gi}
          readinessProbe:
            tcpSocket: {port: 6379}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: staging-redis
  namespace: staging
  labels: {app: staging-redis, env: staging}
  annotations:
    networking.gke.io/load-balancer-type: Internal
spec:
  type: LoadBalancer
  selector: {app: staging-redis}
  ports:
    - {name: redis, port: 6379, targetPort: 6379}

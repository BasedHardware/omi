version: 1
environments:
  dev:
    project: based-hardware-dev
    jobs:
      - name: day3-reengagement-email-daily
        region: us-central1
        schedule: "0 15 * * *"
        time_zone: Etc/UTC
        state: ENABLED
        target:
          type: http
          uri: https://run.googleapis.com/v2/projects/based-hardware-dev/locations/us-central1/jobs/day3-reengagement-email-job:run
          method: POST
          oauth:
            service_account: memory-maintenance-scheduler@based-hardware-dev.iam.gserviceaccount.com
            scope: https://www.googleapis.com/auth/cloud-platform
        retry:
          max_backoff: 3600s
          max_doublings: 5
          max_retry: 0s
          min_backoff: 5s
        attempt_deadline: 180s
        owner: .github/workflows/gcp_day3_reengagement_email_job*.yml
      - name: knowledge-ledger-drain-hourly
        region: us-central1
        schedule: "0 * * * *"
        time_zone: Etc/UTC
        state: ENABLED
        target:
          type: http
          uri: https://run.googleapis.com/v2/projects/based-hardware-dev/locations/us-central1/jobs/knowledge-ledger-drain-job:run
          method: POST
          oauth:
            service_account: memory-maintenance-scheduler@based-hardware-dev.iam.gserviceaccount.com
            scope: https://www.googleapis.com/auth/cloud-platform
        retry:
          max_backoff: 3600s
          max_doublings: 5
          max_retry: 0s
          min_backoff: 5s
        attempt_deadline: 180s
        owner: .github/workflows/gcp_daily_memory_sweep_job_auto_dev.yml
      - name: sync-backfill-uid-sequencer
        region: us-central1
        schedule: "*/2 * * * *"
        time_zone: UTC
        # Dev shares prod Firestore and Redis: its sweeper claimed and failed prod
        # jobs (2026-09-28). Keep paused until sequencer state is environment-scoped.
        state: PAUSED
        target:
          type: http
          uri: https://backend-sync-dt5lrfkkoa-uc.a.run.app/v2/sync-backfill-sequencer/sweep
          method: POST
          oidc:
            service_account: sync-tasks-invoker@based-hardware-dev.iam.gserviceaccount.com
            audience: https://backend-sync-dt5lrfkkoa-uc.a.run.app/v2/sync-jobs/run
        retry:
          max_backoff: 3600s
          max_doublings: 5
          max_retry: 0s
          min_backoff: 5s
        attempt_deadline: 180s
        owner: .github/actions/sync-backfill-lifecycle/action.yml
      - name: memory-maintenance-hourly
        region: us-central1
        schedule: "0 * * * *"
        time_zone: Etc/UTC
        state: ENABLED
        target:
          type: http
          uri: https://run.googleapis.com/v2/projects/based-hardware-dev/locations/us-central1/jobs/memory-maintenance-job:run
          method: POST
          oauth:
            service_account: memory-maintenance-scheduler@based-hardware-dev.iam.gserviceaccount.com
            scope: https://www.googleapis.com/auth/cloud-platform
        retry:
          max_backoff: 3600s
          max_doublings: 5
          max_retry: 0s
          min_backoff: 5s
        attempt_deadline: 180s
        owner: .github/workflows/gcp_memory_maintenance_job_auto_dev.yml
      - name: daily-memory-sweep-hourly
        region: us-central1
        schedule: "0 * * * *"
        time_zone: Etc/UTC
        state: ENABLED
        target:
          type: http
          uri: https://run.googleapis.com/v2/projects/based-hardware-dev/locations/us-central1/jobs/daily-memory-sweep-job:run
          method: POST
          oauth:
            service_account: memory-maintenance-scheduler@based-hardware-dev.iam.gserviceaccount.com
            scope: https://www.googleapis.com/auth/cloud-platform
        retry:
          max_backoff: 3600s
          max_doublings: 5
          max_retry: 0s
          min_backoff: 5s
        attempt_deadline: 180s
        owner: .github/workflows/gcp_daily_memory_sweep_job_auto_dev.yml
      - name: frame-request-retention-hourly
        lifecycle: planned
        region: us-central1
        schedule: "0 * * * *"
        time_zone: Etc/UTC
        state: ENABLED
        target:
          type: http
          uri: https://run.googleapis.com/v2/projects/based-hardware-dev/locations/us-central1/jobs/frame-request-retention-job:run
          method: POST
          oauth:
            service_account: frame-retention-scheduler@based-hardware-dev.iam.gserviceaccount.com
            scope: https://www.googleapis.com/auth/cloud-platform
        retry:
          max_backoff: 3600s
          max_doublings: 5
          max_retry: 0s
          min_backoff: 5s
        attempt_deadline: 180s
        owner: .github/workflows/gcp_frame_request_retention_job.yml
  prod:
    project: based-hardware
    jobs:
      - name: day3-reengagement-email-daily

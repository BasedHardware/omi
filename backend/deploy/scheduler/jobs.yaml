          min_backoff: 5s
        attempt_deadline: 180s
        owner: .github/workflows/gcp_frame_request_retention_job.yml
      - name: omi-tv-rollup-daily
        lifecycle: planned
        region: us-central1
        schedule: "15 2 * * *"
        time_zone: Etc/UTC
        state: PAUSED
        target:
          type: http

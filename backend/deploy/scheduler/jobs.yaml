          method: POST
          oauth:
            service_account: finops-unit-cost-scheduler@based-hardware.iam.gserviceaccount.com
            scope: https://www.googleapis.com/auth/cloud-platform
        retry:
          max_backoff: 3600s
          max_doublings: 5
          max_retry: 0s
          min_backoff: 5s
        attempt_deadline: 180s
        owner: unassigned; manually created; David decision required
      - name: frame-request-retention-hourly
        lifecycle: planned
        region: us-central1
        schedule: "0 * * * *"
        time_zone: Etc/UTC
        state: ENABLED
        target:
          type: http
          uri: https://run.googleapis.com/v2/projects/based-hardware/locations/us-central1/jobs/frame-request-retention-job:run
          method: POST
          oauth:
            service_account: frame-retention-scheduler@based-hardware.iam.gserviceaccount.com
            scope: https://www.googleapis.com/auth/cloud-platform
        retry:
          max_backoff: 3600s

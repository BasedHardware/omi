version: 1
environments:
  dev:
    project: based-hardware-dev
    jobs:
      - name: dream-agent-canary-half-hourly
        region: us-central1
        schedule: "*/30 * * * *"
        time_zone: UTC
        state: PAUSED
        target:
          type: http
          uri: https://backend-sync-dt5lrfkkoa-uc.a.run.app/v2/dream-agent/canary
          method: POST
          oidc:
            service_account: sync-tasks-invoker@based-hardware-dev.iam.gserviceaccount.com
            audience: https://backend-sync-dt5lrfkkoa-uc.a.run.app/v2/sync-jobs/run
        retry:
          max_backoff: 3600s
          max_doublings: 5
          max_retry: 0s
          min_backoff: 5s
        attempt_deadline: 1740s
        owner: backend/docs/runbooks/dream-agent.md
      - name: day3-reengagement-email-daily
        region: us-central1
        schedule: "0 15 * * *"
        time_zone: Etc/UTC
        state: ENABLED
        target:
          type: http
          uri: https://run.googleapis.com/v2/projects/based-hardware-dev/locations/us-central1/jobs/day3-reengagement-email-job:run
          method: POST
          oauth:
            service_account: memory-maintenance-scheduler@based-hardware-dev.iam.gserviceaccount.com
            scope: https://www.googleapis.com/auth/cloud-platform
        retry:
          max_backoff: 3600s
          max_doublings: 5
          max_retry: 0s
          min_backoff: 5s
        attempt_deadline: 180s
        owner: .github/workflows/gcp_day3_reengagement_email_job*.yml
      - name: sync-backfill-uid-sequencer
        region: us-central1
        schedule: "*/2 * * * *"
        time_zone: UTC
        # Dev shares prod Firestore and Redis: its sweeper claimed and failed prod
        # jobs (2026-09-28). Keep paused until sequencer state is environment-scoped.
        state: PAUSED
        target:
          type: http
          uri: https://backend-sync-dt5lrfkkoa-uc.a.run.app/v2/sync-backfill-sequencer/sweep
          method: POST
          oidc:
            service_account: sync-tasks-invoker@based-hardware-dev.iam.gserviceaccount.com
            audience: https://backend-sync-dt5lrfkkoa-uc.a.run.app/v2/sync-jobs/run
        retry:
          max_backoff: 3600s
          max_doublings: 5
          max_retry: 0s
          min_backoff: 5s
        attempt_deadline: 180s
        owner: .github/actions/sync-backfill-lifecycle/action.yml
      - name: enrichment-maintenance
        lifecycle: planned
        region: us-central1
        schedule: "*/2 * * * *"
        time_zone: UTC
        state: PAUSED
        target:
          type: http
          uri: https://backend-integration-dt5lrfkkoa-uc.a.run.app/v2/enrichment/sweep
          method: POST
          oidc:
            service_account: sync-tasks-invoker@based-hardware-dev.iam.gserviceaccount.com
            audience: https://backend-integration-dt5lrfkkoa-uc.a.run.app/v2/enrichment/run
        retry:
          max_backoff: 3600s
          max_doublings: 5
          max_retry: 0s
          min_backoff: 5s
        attempt_deadline: 180s
        owner: backend/routers/enrichment.py
      - name: frame-request-retention-hourly
        lifecycle: planned
        region: us-central1
        schedule: "0 * * * *"
        time_zone: Etc/UTC
        state: ENABLED
        target:
          type: http
          uri: https://run.googleapis.com/v2/projects/based-hardware-dev/locations/us-central1/jobs/frame-request-retention-job:run
          method: POST
          oauth:
            service_account: frame-retention-scheduler@based-hardware-dev.iam.gserviceaccount.com
            scope: https://www.googleapis.com/auth/cloud-platform
        retry:
          max_backoff: 3600s
          max_doublings: 5
          max_retry: 0s
          min_backoff: 5s
        attempt_deadline: 180s
        owner: .github/workflows/gcp_frame_request_retention_job.yml
  prod:
    project: based-hardware
    jobs:
      - name: messaging-maintenance-hourly
        region: us-central1
        schedule: "17 * * * *"
        time_zone: Etc/UTC
        state: ENABLED
        target:
          type: http
          uri: https://run.googleapis.com/v2/projects/based-hardware/locations/us-central1/jobs/messaging-maintenance-job:run
          method: POST
          oauth:
            service_account: msg-maintenance-scheduler@based-hardware.iam.gserviceaccount.com
            scope: https://www.googleapis.com/auth/cloud-platform
        retry:
          max_backoff: 3600s
          max_doublings: 5
          max_retry: 0s
          min_backoff: 5s
        attempt_deadline: 180s
        owner: backend/docs/runbooks/messaging-channels.md
      - name: day3-reengagement-email-daily
        region: us-central1
        schedule: "0 15 * * *"
        time_zone: Etc/UTC
        state: ENABLED
        target:
          type: http
          uri: https://run.googleapis.com/v2/projects/based-hardware/locations/us-central1/jobs/day3-reengagement-email-job:run
          method: POST
          oauth:
            service_account: memory-maintenance-scheduler@based-hardware.iam.gserviceaccount.com
            scope: https://www.googleapis.com/auth/cloud-platform
        retry:
          max_backoff: 3600s
          max_doublings: 5
          max_retry: 0s
          min_backoff: 5s
        attempt_deadline: 180s
        owner: .github/workflows/gcp_day3_reengagement_email_job.yml
      - name: notifications-job-scheduler-trigger
        region: us-central1
        # Local delivery is configured by hour. Include :15/:30/:45 UTC for
        # quarter-/half-hour offsets and give the bounded sweep tail retries.
        schedule: "*/15 * * * *"
        time_zone: Etc/UTC
        state: ENABLED
        target:
          type: http
          uri: https://us-central1-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/based-hardware/jobs/notifications-job:run
          method: POST
          oauth:
            # Dedicated invoker: run.invoker on notifications-job only. The owner
            # workflow identity (omi-gha-notif-job-prod) holds serviceAccountUser on it.
            service_account: notifications-job-scheduler@based-hardware.iam.gserviceaccount.com
            scope: https://www.googleapis.com/auth/cloud-platform
        retry:
          max_backoff: 3600s
          max_doublings: 5
          max_retry: 0s
          min_backoff: 5s
        attempt_deadline: 180s
        owner: .github/workflows/gcp_notifications_job.yml
      - name: sync-backfill-uid-sequencer
        region: us-central1
        schedule: "*/2 * * * *"
        time_zone: UTC
        state: ENABLED
        target:
          type: http
          uri: https://backend-sync-hhibjajaja-uc.a.run.app/v2/sync-backfill-sequencer/sweep
          method: POST
          oidc:
            service_account: sync-tasks-invoker@based-hardware.iam.gserviceaccount.com
            audience: https://backend-sync-hhibjajaja-uc.a.run.app/v2/sync-jobs/run
        retry:
          max_backoff: 3600s
          max_doublings: 5
          max_retry: 0s
          min_backoff: 5s
        attempt_deadline: 180s
        owner: .github/actions/sync-backfill-lifecycle/action.yml
      - name: enrichment-maintenance
        lifecycle: planned
        region: us-central1
        schedule: "*/2 * * * *"
        time_zone: UTC
        state: ENABLED
        target:
          type: http
          uri: https://backend-integration-hhibjajaja-uc.a.run.app/v2/enrichment/sweep
          method: POST
          oidc:
            service_account: sync-tasks-invoker@based-hardware.iam.gserviceaccount.com
            audience: https://backend-integration-hhibjajaja-uc.a.run.app/v2/enrichment/run
        retry:
          max_backoff: 3600s
          max_doublings: 5
          max_retry: 0s
          min_backoff: 5s
        attempt_deadline: 180s
        owner: backend/routers/enrichment.py
      - name: dream-agent-sweep-hourly
        region: us-central1
        schedule: "0 * * * *"
        time_zone: UTC
        state: ENABLED
        target:
          type: http
          uri: https://backend-sync-hhibjajaja-uc.a.run.app/v2/dream-agent/sweep
          method: POST
          oidc:
            service_account: sync-tasks-invoker@based-hardware.iam.gserviceaccount.com
            audience: https://backend-sync-hhibjajaja-uc.a.run.app/v2/sync-jobs/run
        retry:
          max_backoff: 3600s
          max_doublings: 5
          max_retry: 0s
          min_backoff: 5s
        # 1680s full drain, 1710s backend HTTP bound, plus Scheduler transport headroom.
        attempt_deadline: 1740s
        owner: backend/docs/runbooks/dream-agent.md
      - name: candidate-integration-sweep
        # Prod only. Dev's data plane is production Firestore, so this job is
        # not declared for based-hardware-dev at all.
        region: us-central1
        schedule: "*/15 * * * *"
        time_zone: UTC
        state: ENABLED
        target:
          type: http
          uri: https://backend-sync-hhibjajaja-uc.a.run.app/v2/candidate-integrations/sweep
          method: POST
          oidc:
            service_account: sync-tasks-invoker@based-hardware.iam.gserviceaccount.com
            audience: https://backend-sync-hhibjajaja-uc.a.run.app/v2/sync-jobs/run
        retry:
          max_backoff: 3600s
          max_doublings: 5
          max_retry: 0s
          min_backoff: 5s
        attempt_deadline: 120s
        owner: backend/utils/task_intelligence/candidate_integration_sweeper.py
      - name: dream-agent-canary-half-hourly
        region: us-central1
        schedule: "*/30 * * * *"
        time_zone: UTC
        state: ENABLED
        target:
          type: http
          uri: https://backend-sync-hhibjajaja-uc.a.run.app/v2/dream-agent/canary
          method: POST
          oidc:
            service_account: sync-tasks-invoker@based-hardware.iam.gserviceaccount.com
            audience: https://backend-sync-hhibjajaja-uc.a.run.app/v2/sync-jobs/run
        retry:
          max_backoff: 3600s
          max_doublings: 5
          max_retry: 0s
          min_backoff: 5s
        attempt_deadline: 1740s
        owner: backend/docs/runbooks/dream-agent.md
      - name: omi-admin-stats-precompute
        region: us-central1
        schedule: "*/30 * * * *"
        time_zone: Etc/UTC
        state: ENABLED
        target:
          type: http
          uri: https://admin.omi.me/api/internal/precompute
          method: POST
          headers:
            x-cron-secret:
              secret: WEB_ADMIN_CRON_SECRET
              version: latest
        retry:
          max_backoff: 3600s
          max_doublings: 5
          max_retry: 0s
          min_backoff: 5s
        attempt_deadline: 1800s
        owner: .github/workflows/gcp_scheduler_reconcile.yml
      - name: finops-unit-cost-daily

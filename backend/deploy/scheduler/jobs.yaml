        time_zone: Etc/UTC
        state: ENABLED
        target:
          type: http
          uri: https://us-central1-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/based-hardware/jobs/notifications-job:run
          method: POST
          oauth:
            service_account: 208440318997-compute@developer.gserviceaccount.com
            scope: https://www.googleapis.com/auth/cloud-platform
        retry:
          max_backoff: 3600s
          max_doublings: 5
          max_retry: 0s
          min_backoff: 5s
        attempt_deadline: 180s
        owner: .github/workflows/gcp_notifications_job.yml
      - name: sync-backfill-uid-sequencer
        region: us-central1
        schedule: "*/2 * * * *"

# Prod live-only settings: on the serving Cloud Run revisions, absent from source
# (runtime_env, deploy flags, deploy/ops/prod.yaml). Inventory 2026-10-20 (lessons 8-9).
#
# A ratchet for scripts/ops/drift_check.py `source`: listed (service, key) pairs are
# explained; a new live-only key fails, and a listed key that is no longer live fails
# until its entry is removed. Names only, never values. Add nothing here without review:
# an intended setting goes into source instead (ops file for plain ops flags, runtime_env
# for secrets and environment-specific values).

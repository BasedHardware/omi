# Production ops values (B4). Applied only by the config-train
# (.github/workflows/config_train.yml -> backend/scripts/ops_train.py).
#
# Ownership: every value here is `owner: ops`. A backend train must honor
# these values, and an out-of-band edit is break-glass followed by a same-day PR
# to this file. Cohorts, percents and allowlists never live here; they live in
# Firestore `rollout_cohorts` (ruling #8).
#
# Schema (validated by ops_train.py; unknown keys are rejected):
#   cloud_run.<service>.env.<KEY>: string        ops-owned env value on the serving revision
#   cloud_run.<service>.memory: Mi or Gi limit    ingress container memory
#   cloud_run.<service>.max_instances: int        service-level run.googleapis.com/maxScale
#     or {owner: <controller>, floor: int, ceiling: int}
#                                                 a live controller owns the value; the
#                                                 config-train only enforces the bounds
#   cloud_run.<service>.min_instances: int        service-level run.googleapis.com/minScale
#   cloud_tasks.<queue>: {max_concurrent_dispatches, max_dispatches_per_second,
#                         max_attempts (-1 = unlimited), min_backoff, max_backoff,
#                         max_doublings, log_sampling_ratio, enabled}
#     Omitted fields are not managed. enabled: false declares a queue that the
#     config-train must neither create nor update yet.
#
# Every env or memory change creates a revision from the service template and routes 100%
# of traffic to that named revision explicitly: backend-sync-backfill pins
# traffic to a named revision, so an unrouted env update never serves (10-19
# 04:52Z). The config-train refuses when the template differs from the serving
# revision (a failed no-traffic deploy left it), so it can never promote an
# unqualified image.
schema: omi.ops/v1
environment: prod
project: based-hardware
region: us-central1

# Keys below a "live-only" comment were set on prod by hand and existed nowhere in
# source; a declarative deploy (staging's deploy.sh, a fresh service) dropped them.
# Values are the serving revisions' on 2026-10-20 (drift_check.py inventory,
# lesson 9). Secret and environment-specific live-only keys are listed in
# live_only.yaml instead; they belong in runtime_env.
cloud_run:
  backend:
    memory: 4Gi
    env:
      # live-only, 2026-10-20 inventory
      AUDIO_MERGE_DISPATCH_MODE: cloud_tasks
      FAIR_USE_ENABLED: 'true'
      HTTP_AUDIO_MERGE_RUN_TIMEOUT: '600'
      HTTP_DEFAULT_TIMEOUT: '600'
      HTTP_GET_TIMEOUT: '30'
      HTTP_POST_TIMEOUT: '600'
      LANGCHAIN_TRACING_V2: 'false'
      LANGSMITH_TRACING: 'false'
      MEMORY_MODE: 'false'
      OMI_LANGSMITH_AGENTIC_PROMPT_NAME: agentic-chat-main
      OMI_LANGSMITH_PROMPT_CACHE_TTL_SECONDS: '3600'
      TYPESENSE_HOST_PORT: '443'
  backend-sync:
    memory: 6Gi
    env:
      # 10-18 18:59Z stall: sync-jobs went into Cloud Tasks system backoff after
      # fast 500s. Root fix is the 409 retry contract (#22371).
      SYNC_TASKS_QUEUE: sync-jobs-fresh
      # 10-19 04:52Z stall, same cause.
      SYNC_BACKFILL_TASKS_QUEUE: sync-backfill-fresh
      # live-only, 2026-10-20 inventory
      AUDIO_MERGE_DISPATCH_MODE: cloud_tasks
      FAIR_USE_ENABLED: 'true'
      HTTP_AUDIO_MERGE_RUN_TIMEOUT: '600'
      HTTP_DEFAULT_TIMEOUT: '600'
      HTTP_POST_TIMEOUT: '600'
      HTTP_SYNC_JOBS_RUN_TIMEOUT: '1500'
      LANGCHAIN_TRACING_V2: 'false'
      MEMORY_MODE: 'off'
    # 2026-10-24 costcut (live 22:48Z): cap 80 -> 50; warm floor 1 -> 5 so the sync
    # pump keeps conversation-finalization headroom (min 5 x concurrency 20, the
    # shape deploy-backend-stack sizes its queue against).
    # SCA-3552: retain the live cap of 50 to preserve fresh-sync headroom.
    # 2026-11-02 margin G1 dropped (cap 30 never applied): after #24264 removed the
    # short deferred re-polls, sync runs long jobs at concurrency p95 18-20 of 20 on
    # ~33 instances, so a lower cap would queue work rather than trim idle capacity.
    # 2026-11-04 legacy-dark (David e53a35, rev 56 17:55Z): warm floor 5 -> 0. The long
    # in-request legacy pipeline is gone and uploads arrive continuously, so the floor
    # only bit when idle. Live service-level min applied 19:13Z by cl2-deploy. Rollback: 5.
    max_instances: 50
    min_instances: 0
  backend-sync-backfill:
    env:
      SYNC_TASKS_QUEUE: sync-backfill-fresh
      SYNC_BACKFILL_TASKS_QUEUE: sync-backfill-fresh
      # live-only, 2026-10-20 inventory
      AUDIO_MERGE_DISPATCH_MODE: cloud_tasks
      DREAM_AGENT_HUNT_INTERVAL_HOURS: '2'
      DREAM_AGENT_MANUAL_RUNS_PER_DAY: '3'
      DREAM_AGENT_PASSES_PER_DAY: '48'  # main #23016 (6 -> 48 on the 3.8 reservation)
      FAIR_USE_ENABLED: 'true'
      HTTP_AUDIO_MERGE_RUN_TIMEOUT: '600'
      HTTP_DEFAULT_TIMEOUT: '600'
      HTTP_POST_TIMEOUT: '600'
      HTTP_SYNC_JOBS_RUN_TIMEOUT: '1500'
      LANGCHAIN_TRACING_V2: 'false'
      LISTEN_FINALIZATION_DURABLE_ATTEMPT_CAP_ENABLED: 'true'
      LISTEN_FINALIZATION_RECOVERY_MINIMUM_TERMINAL_ENABLED: 'true'
      MEETING_NOTES_EVIDENCE_WAIT_SECONDS: '25'
      MEMORY_MODE: 'off'
      TYPESENSE_HOST_PORT: '443'
    # redis_guard.sh moves this between 8 and 40 from Redis memory. It is
    # deleted with the sequencer (C10); until then the config-train only
    # enforces the bounds.
    max_instances: {owner: redis_guard, floor: 8, ceiling: 40}
  backend-integration:
    env:
      # Margin-40 O1 inverse, 2026-11-17: preserve restored cadence; O3 stays 16.
      # The former 100/20 source is held. A new lead/Release ruling must supersede this.
      BATCH_PIPELINE_SERVING_SWEEP_PAGE_ROWS: '200'
      BATCH_PIPELINE_SERVING_TICK_SECONDS: '10'
      # SCA-3120/SCA-4084, 2026-11-26: slots stay at 4. The 20:46-21:46Z window of
      # slots 3 + tick 20 s breached the completion guard (completions per input
      # unit -8%, limit -5%), and Release returned serving to 4. A further step
      # needs a new proposal on SCA-4454 with an explicit drain-rate guard.
      BATCH_PIPELINE_PROJECTION_FOLLOWUP_SLOTS: '4'
      BATCH_PROJECTION_FINISH_CLASSIFY_PAGE_LIMIT: '16'
      SYNC_TASKS_QUEUE: sync-jobs-fresh
      # C4 (lane 9): enrichment-maintenance targets backend-integration.
      # 2026-11-09 David (relay 3e764e): enable until the long-term fix.
      # Keep aligned with runtime_env/prod.overlay.yaml; backend-sync stays disabled.
      SUMMARY_DEBT_REPAIR_ENABLED: 'true'
      # lead2 8b9c8f (2026-11-10): keep the spend cap aligned; rollback 10.
      SUMMARY_DEBT_REPAIR_ADMISSION_LIMIT: '8'
      # live-only, 2026-10-20 inventory
      FAIR_USE_ENABLED: 'true'
      HTTP_DEFAULT_TIMEOUT: '600'
      HTTP_GET_TIMEOUT: '30'
      LANGCHAIN_TRACING_V2: 'false'
      MEMORY_MODE: 'off'
      TYPESENSE_HOST_PORT: '443'
    # 2026-10-24: 3, matching the deploy flag (prod && 3); the old 1 fought every
    # train and idled the projection pump between config-train applies.
    min_instances: 3

cloud_tasks:
  batch-quarantine-recovery:
    # 10-19 01:27Z: 4/4 left recovery p95 just over five minutes at the 5% ramp.
    max_concurrent_dispatches: 16
    max_dispatches_per_second: 8
    max_attempts: 5
    min_backoff: 5s
    max_backoff: 60s
  conversations-v3:
    # Isolate outline/summary latency from capture STT and finalization dispatch.
    # 2026-11-18 incident: 8 slots held ~60 s each (outline + notes inline) let depth reach ~9.5k at beta.
    max_concurrent_dispatches: 64
    max_dispatches_per_second: 20
    max_attempts: 10
    min_backoff: 30s
    max_backoff: 300s
    log_sampling_ratio: 0.1
  conversations-v3-backfill:
    # Operator-planned per-owner v3 backfill/repair steps (utils/conversations/v3/backfill.py). One
    # dispatch at a time keeps historical outline/notes work off the live conversations-v3 queue
    # and bounds it to one owner partition; a 503 (owner busy) retries after a minute.
    max_concurrent_dispatches: 1
    max_dispatches_per_second: 1
    max_attempts: 5
    min_backoff: 60s
    max_backoff: 600s
  sync-jobs-fresh:
    # Five attempts: sync's 409 leaves the retry to the queue (routers/sync.py), and
    # utils/cloud_tasks.py get_sync_tasks_max_attempts mirrors it. The config-train is
    # the only writer of this cap now that trains skip the ops-owned queues.
    max_concurrent_dispatches: 160
    # SCA-3552: keep live dispatch capacity for fresh uploads while restoring five attempts.
    max_dispatches_per_second: 25
    max_attempts: 5
    min_backoff: 60s
    max_backoff: 300s
    # No alert, logs-based metric, or runbook reads task_operations_log entries;
    # queue depth/age alerting uses platform metrics, so 10% dispatch records suffice.
    log_sampling_ratio: 0.1
  sync-backfill-fresh:
    # Same rate and retry as sync-backfill (train ceiling 90 = 15 x 6 bounded by
    # the worker cap x concurrency 6). Attempts and doublings are unmanaged
    # until the first config-train plan reads them.
    max_concurrent_dispatches: 90
    max_dispatches_per_second: 15
    max_attempts: 5
    min_backoff: 5s
    max_backoff: 60s
    log_sampling_ratio: 0.1
  enrichment:
    # Contract (a)/(d), lane 9: plan C3's queue for new sr- obligations (ENRICHMENT_ROUTE=enrichment_queue).
    # Created by the config-train before the backend roll that sets the route (planc, Plan C prod activation).
    # 2026-11-10 ruling 008024: reconcile primary live drift to 300/25 independently
    # of fresh tuning; a fresh-only rollback must preserve this primary capacity.
    max_concurrent_dispatches: 300
    max_dispatches_per_second: 25
    max_attempts: -1
    min_backoff: 10s
    max_backoff: 300s
  enrichment-fresh:
    # 2026-11-10 ruling 008024: permanent 30/10 for first-summary catch-up.
    # The operational Firestore-pressure guard may temporarily lower live concurrency
    # to 15 (rate stays 10); Git stays 30. cl2-deploy alone applies prod changes.
    # Re-evaluate the 168h age gate after the backlog drains; this changes no admission policy.
    max_concurrent_dispatches: 30
    max_dispatches_per_second: 10
    max_attempts: -1
    min_backoff: 10s
    max_backoff: 300s
  provider-stt:
    # Plan C8: provider-STT wakes for BYOK and non-Parakeet units, served by backend-integration. Idle while
    # legacy_sync=on (the provider route needs draining/dark); it must exist before draining
    # (DRAINING_PRECONDITIONS provider_stt_live). At 100% about 205k units/day take this route (2.4/s mean);
    # SCA-3552: retain live provider capacity for fresh work. The outbox intent enforces one paid call per unit.
    max_concurrent_dispatches: 96
    max_dispatches_per_second: 20
    max_attempts: -1
    min_backoff: 10s
    max_backoff: 300s

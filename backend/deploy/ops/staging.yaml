# Staging ops values (B4), contract (i). Mirrors prod.yaml; the differences are
# names (the `-staging` services and `staging-` queues in based-hardware-dev)
# and the bounded backfill controller, which staging does not run. Intentional
# queue-capacity divergence: enrichment stays 50/25 and enrichment-fresh stays 5/2.
# test_config_train.py asserts every prod key has a staging counterpart.
schema: omi.ops/v1
environment: staging
project: based-hardware-dev
region: us-central1

cloud_run:
  backend-staging:
    memory: 4Gi
    env:
      # live-only on prod, 2026-10-20 inventory (see prod.yaml)
      AUDIO_MERGE_DISPATCH_MODE: cloud_tasks
      FAIR_USE_ENABLED: 'true'
      HTTP_AUDIO_MERGE_RUN_TIMEOUT: '600'
      HTTP_DEFAULT_TIMEOUT: '600'
      HTTP_GET_TIMEOUT: '30'
      HTTP_POST_TIMEOUT: '600'
      LANGCHAIN_TRACING_V2: 'false'
      LANGSMITH_TRACING: 'false'
      MEMORY_MODE: 'false'
      OMI_LANGSMITH_AGENTIC_PROMPT_NAME: agentic-chat-main
      OMI_LANGSMITH_PROMPT_CACHE_TTL_SECONDS: '3600'
      TYPESENSE_HOST_PORT: '443'
  backend-sync-staging:
    memory: 6Gi
    env:
      SYNC_TASKS_QUEUE: staging-sync-jobs-fresh
      SYNC_BACKFILL_TASKS_QUEUE: staging-sync-backfill-fresh
      # live-only on prod, 2026-10-20 inventory (see prod.yaml)
      AUDIO_MERGE_DISPATCH_MODE: cloud_tasks
      FAIR_USE_ENABLED: 'true'
      HTTP_AUDIO_MERGE_RUN_TIMEOUT: '600'
      HTTP_DEFAULT_TIMEOUT: '600'
      HTTP_POST_TIMEOUT: '600'
      HTTP_SYNC_JOBS_RUN_TIMEOUT: '1500'
      LANGCHAIN_TRACING_V2: 'false'
      MEMORY_MODE: 'off'
    # Replica counts are on contract (i)'s staging allowlist: lane 2's deploy.sh sizes staging.
    max_instances: 20
  backend-sync-backfill-staging:
    env:
      SYNC_TASKS_QUEUE: staging-sync-backfill-fresh
      SYNC_BACKFILL_TASKS_QUEUE: staging-sync-backfill-fresh
      # live-only on prod, 2026-10-20 inventory (see prod.yaml)
      AUDIO_MERGE_DISPATCH_MODE: cloud_tasks
      DREAM_AGENT_HUNT_INTERVAL_HOURS: '2'
      DREAM_AGENT_MANUAL_RUNS_PER_DAY: '3'
      DREAM_AGENT_PASSES_PER_DAY: '48'  # main #23016 (6 -> 48 on the 3.8 reservation)
      FAIR_USE_ENABLED: 'true'
      HTTP_AUDIO_MERGE_RUN_TIMEOUT: '600'
      HTTP_DEFAULT_TIMEOUT: '600'
      HTTP_POST_TIMEOUT: '600'
      HTTP_SYNC_JOBS_RUN_TIMEOUT: '1500'
      LANGCHAIN_TRACING_V2: 'false'
      LISTEN_FINALIZATION_DURABLE_ATTEMPT_CAP_ENABLED: 'true'
      LISTEN_FINALIZATION_RECOVERY_MINIMUM_TERMINAL_ENABLED: 'true'
      MEETING_NOTES_EVIDENCE_WAIT_SECONDS: '25'
      MEMORY_MODE: 'off'
      TYPESENSE_HOST_PORT: '443'
    max_instances: {owner: none, floor: 8, ceiling: 40}
  backend-integration-staging:
    env:
      # SCA-4928: staging retains its 200/10/class16 cadence.
      BATCH_PIPELINE_SERVING_SWEEP_PAGE_ROWS: '200'
      BATCH_PIPELINE_SERVING_TICK_SECONDS: '10'
      # SCA-3120/SCA-4084, 2026-11-26: slots stay at 4. The 20:46-21:46Z window of
      # slots 3 + tick 20 s breached the completion guard (completions per input
      # unit -8%, limit -5%), and Release returned serving to 4. A further step
      # needs a new proposal on SCA-4454 with an explicit drain-rate guard.
      BATCH_PIPELINE_PROJECTION_FOLLOWUP_SLOTS: '4'
      BATCH_PROJECTION_FINISH_CLASSIFY_PAGE_LIMIT: '16'
      SYNC_TASKS_QUEUE: staging-sync-jobs-fresh
      SUMMARY_DEBT_REPAIR_ENABLED: 'true'
      # live-only on prod, 2026-10-20 inventory (see prod.yaml)
      FAIR_USE_ENABLED: 'true'
      HTTP_DEFAULT_TIMEOUT: '600'
      HTTP_GET_TIMEOUT: '30'
      LANGCHAIN_TRACING_V2: 'false'
      MEMORY_MODE: 'off'
      TYPESENSE_HOST_PORT: '443'

cloud_tasks:
  staging-batch-quarantine-recovery:
    max_concurrent_dispatches: 16
    max_dispatches_per_second: 8
    max_attempts: 5
    min_backoff: 5s
    max_backoff: 60s
  staging-conversations-v3:
    # Isolate outline/summary latency from capture STT and finalization dispatch.
    max_concurrent_dispatches: 64
    max_dispatches_per_second: 20
    max_attempts: 10
    min_backoff: 30s
    max_backoff: 300s
    log_sampling_ratio: 0.1
  staging-conversations-v3-backfill:
    # Operator-planned per-owner v3 backfill/repair steps (utils/conversations/v3/backfill.py). One
    # dispatch at a time keeps historical outline/notes work off the live conversations-v3 queue
    # and bounds it to one owner partition; a 503 (owner busy) retries after a minute.
    max_concurrent_dispatches: 1
    max_dispatches_per_second: 1
    max_attempts: 5
    min_backoff: 60s
    max_backoff: 600s
  staging-sync-jobs-fresh:
    # Five attempts: sync's 409 leaves the retry to the queue (routers/sync.py), and
    # utils/cloud_tasks.py get_sync_tasks_max_attempts mirrors it. The config-train is
    # the only writer of this cap now that trains skip the ops-owned queues.
    max_concurrent_dispatches: 160
    max_dispatches_per_second: 15
    max_attempts: 5
    min_backoff: 60s
    max_backoff: 300s
    log_sampling_ratio: 0.1
  staging-sync-backfill-fresh:
    max_concurrent_dispatches: 90
    max_dispatches_per_second: 15
    max_attempts: 5
    min_backoff: 5s
    max_backoff: 60s
    log_sampling_ratio: 0.1
  staging-enrichment:
    # Intentional staging capacity: 50/25; prod's 300/25 live-drift reconciliation is prod-only.
    max_concurrent_dispatches: 50
    max_dispatches_per_second: 25
    max_attempts: -1
    min_backoff: 10s
    max_backoff: 300s
  staging-enrichment-fresh:
    # Intentional staging capacity: 5/2; prod's permanent 30/10 catch-up setting is prod-only.
    max_concurrent_dispatches: 5
    max_dispatches_per_second: 2
    max_attempts: -1
    min_backoff: 10s
    max_backoff: 300s
  staging-enrichment-first-week:
    # Mirrors prod 4/2: a new payer's open first-week summary gets its own slots,
    # never a share of staging-enrichment-fresh.
    max_concurrent_dispatches: 4
    max_dispatches_per_second: 2
    max_attempts: -1
    min_backoff: 10s
    max_backoff: 300s
  staging-provider-stt:
    # Staging keeps its lower dispatch capacity (SCA-3552).
    max_concurrent_dispatches: 48
    max_dispatches_per_second: 10
    max_attempts: -1
    min_backoff: 10s
    max_backoff: 300s

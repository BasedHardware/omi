apiVersion: monitoring.googleapis.com/v1beta
kind: RunMonitoring
metadata:
  name: omi-cloud-run-application-metrics
spec:
  endpoints:
    - port: 9090
      path: /metrics
      interval: 30s
      timeout: 10s
      metricRelabeling:
        - action: keep
          sourceLabels:
            - __name__
          regex: omi_.*|conversation_llm_input_dedupe_.*
  targetLabels:
    metadata:
      - service
  # Backend Cloud Run peaked at 9,873 samples per scrape (24h max, 2026-11-01) against the
  # old 10,000 cap; over the cap GMP drops the instance's whole scrape. 15,000 restores
  # headroom. Ingestion is billed per sample emitted, not by this ceiling.
  limits:
    samples: 15000
    labels: 30
    labelNameLength: 100
    labelValueLength: 256

# S7 columns (10 §1.6): each row is one user-triggerable surface =
# (surface, entrypoint, feature, plan_gating, funding_owner, fallback_on_deny).
# plan_gating reuses S1 DECISION_REASONS, plus unified_chat_quota for realtime.
# fallback_on_deny=none_unwired means authorize_managed_compute is not at this
# entrypoint today — recorded, not repaired (cut list).
# call_sites is the exact-set pin: a managed get_llm / LLM REST host absent
# from this list fails CI.
schema_version: llm_model_endpoint_inventory.v1
scope:
  in_scope: backend chat/completion/generation/model calls, including streaming, tool calling, image generation, file chat,
    realtime relay, provider web search, and embeddings
  out_of_scope: none
out_of_scope_surfaces: []
model_config_features:
  status: gateway_lane_generated_from_model_config
  source_of_truth: backend/utils/llm/model_config.py
  gateway_lane: omi:auto:<feature-with-underscores-as-hyphens>
  code_paths:
  - backend/utils/llm/clients.py:get_llm
  - backend/llm_gateway/gateway/config_loader.py:_generated_feature_route_items
  request_shapes:
    plain_chat:
    - conv_action_items
    - wake_word_adjudication
    - conv_app_result
    - conv_discard
    - conv_folder
    - conv_structure
    - daily_summary
    - daily_summary_simple
    - followup
    - goals
    - goals_advice
    - knowledge_graph
    - learnings
    - memories
    - memory_category
    - memory_conflict
    - memory_conflict_flex
    - memory_l1
    - memory_l2_flex
    - notifications
    - onboarding
    - openglass
    - persona_chat
    - persona_chat_premium
    - persona_clone
    - session_titles
    - smart_glasses
    - wrapped_analysis
    - x_memory_extraction_flex
    - app_generator
    - app_integration
    structured_output:
    - chat_extraction
    - conv_app_select
    - desktop_proactive_extraction
    - desktop_proactive_reasoning
    - external_structure
    - proactive_notification
    - screen_frame_judge
    - translation
    - trends
    - what_matters_now
    streaming:
    - chat_responses
    - chat_graph
    - persona_chat
    - persona_chat_premium
    tool_calling:
    - chat_agent
    - memory_l2
    file_chat:
    - file_chat_vision
    - file_chat_documents
    provider_search:
    - web_search
    pinned:
    - fair_use
  gateway_capability_needed: OpenAI-compatible chat-completions lane with provider refs for openai, native Vertex Gemini,
    openrouter, perplexity, and anthropic; OpenAI-compatible /v1/embeddings surface with openai and native Vertex :predict
    adapters.
  migration_status: get_llm centrally switches Omi-managed feature traffic to generated gateway lanes with OMI_LLM_GATEWAY_FEATURE_MODE=gateway
    and does not retain a direct-provider fallback; gateway Gemini uses native Vertex generateContent authenticated by GKE
    Workload Identity; Gemini BYOK remains unsupported and fails closed.
  test_guardrail_coverage:
  - backend/tests/unit/test_llm_gateway_coverage_guardrails.py::test_every_model_config_feature_has_inventory_and_gateway_lane
  - backend/tests/unit/test_llm_gateway_client_config.py::test_get_llm_feature_gateway_mode_uses_generated_auto_lane
surfaces:
- surface: desktop_context_proactivity
  code_path: backend/routers/desktop_proactivity.py:proactive_completion
  entrypoint: POST desktop proactivity completion
  feature: desktop_proactive_reasoning
  plan_gating: basic_not_entitled
  funding_owner: omi
  fallback_on_deny: none_unwired
  call_sites:
  - routers/desktop_proactivity.py::host:api.openai.com
  current_provider_model: gateway lanes desktop_proactive_extraction and desktop_proactive_reasoning; direct OpenAI only when
    OMI_ENV_STAGE is dev or local and the gateway URL is absent
  request_shape: non-streaming strict structured output with optional explicit prompt caching on reasoning
  gateway_lane_capability_needed: OpenAI-compatible structured-output lanes with explicit-cache support for reasoning
  migration_status: acknowledged_direct_dev_recovery_surface; production remains gateway-only and fails closed, while dev
    and local record shared fallback telemetry when recovering through direct OpenAI
  test_guardrail_coverage: backend/tests/unit/test_desktop_proactivity.py and backend/tests/unit/test_llm_gateway_coverage_guardrails.py

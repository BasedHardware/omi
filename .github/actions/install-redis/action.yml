name: Install Redis server
description: Install redis-server with bounded apt timeouts and retries so a slow Ubuntu mirror fails fast instead of riding the job timeout.

runs:
  using: composite
  steps:
    - name: Install Redis server
      shell: bash
      run: |
        set -euo pipefail
        # Composite steps do not support timeout-minutes; bound apt with GNU timeout
        # and let each caller also set timeout-minutes on the uses: step.
        timeout 90 sudo apt-get update \
          -o Acquire::Retries=3 \
          -o Acquire::http::Timeout=10 \
          -o Acquire::https::Timeout=10
        timeout 90 sudo apt-get install --yes \
          -o Acquire::Retries=3 \
          -o Acquire::http::Timeout=10 \
          -o Acquire::https::Timeout=10 \
          redis-server

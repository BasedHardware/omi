name: Sync Backfill Lifecycle
description: Deploy and provision the bounded backend-sync-backfill worker lane

inputs:
  mode:
    description: 'worker (deploy backfill revision), platform (queue/IAM/TTL/alerts), or dispatch (queue reconciliation + dispatch-abort alert only)'
    required: true
  project_id:
    description: GCP project ID
    required: true
  firestore_project_id:
    description: GCP project ID for Firestore sync ledger TTL (mode=platform)
    required: false
    default: ''
  region:
    description: Cloud Run / Cloud Tasks region
    required: true
    default: us-central1
  service:
    description: Base Cloud Run service name (backend)
    required: true
    default: backend
  image:
    description: Container image for the backfill worker (mode=worker)
    required: false
    default: ''
  revision_suffix:
    description: Cloud Run revision suffix (mode=worker)
    required: false
    default: ''
  cloud_run_flags:
    description: Shared Cloud Run network/runtime flags (mode=worker)
    required: false
    default: ''
  backfill_env_vars:
    description: Manifest-rendered backend-sync-backfill env overlay (mode=worker)
    required: false
    default: ''
  backfill_secrets:
    description: Manifest-rendered backend-sync-backfill secrets overlay (mode=worker)
    required: false
    default: ''
  candidate_tag:
    description: Stable no-traffic candidate tag (mode=worker)
    required: false
    default: ''
  provision_sync_ledger_ttl:
    description: Provision and verify Firestore sync_content_ledger TTL (mode=platform)
    required: false
    default: 'true'
  provision_budget_alerts:
    description: Provision routed backfill budget alerts (mode=platform, prod only)
    required: false
    default: 'false'
  alert_notification_channels:
    description: Monitoring notification channel IDs for budget alerts
    required: false
    default: ''

outputs:
  service_url:
    description: Predicted backend-sync-backfill Cloud Run URL
    value: ${{ steps.backfill-service.outputs.url }}
  revision:
    description: backend-sync-backfill revision name for this deploy
    value: ${{ steps.capture-backend-sync-backfill-revision.outputs.revision }}
  sync_backfill_env_vars:
    description: SYNC_BACKFILL_* overlay for the backend-sync admission deploy
    value: ${{ steps.backfill-service.outputs.sync_backfill_env_vars }}

runs:
  using: composite
  steps:
    - name: Resolve backfill service URL
      if: ${{ inputs.mode == 'worker' }}
      id: backfill-service
      shell: bash
      run: |
        PROJECT_NUMBER="$(gcloud projects describe "${{ inputs.project_id }}" --format='value(projectNumber)')"
        URL="https://${{ inputs.service }}-sync-backfill-${PROJECT_NUMBER}.${{ inputs.region }}.run.app"
        echo "url=${URL}" >> "$GITHUB_OUTPUT"
        {
          echo "sync_backfill_env_vars<<EOF"
          echo "SYNC_BACKFILL_TASKS_QUEUE=sync-backfill"
          echo "SYNC_BACKFILL_TASKS_HANDLER_URL=${URL}/v2/sync-jobs/run"
          echo "SYNC_BACKFILL_TASKS_OIDC_AUDIENCE=${URL}/v2/sync-jobs/run"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Clone complete backend-sync runtime contract for backfill worker
      if: ${{ inputs.mode == 'worker' }}
      id: backfill-runtime
      shell: bash
      env:
        ENV_OVERLAY: |-
          ${{ inputs.backfill_env_vars }}
          SYNC_TASKS_QUEUE=sync-backfill
          SYNC_TASKS_HANDLER_URL=${{ steps.backfill-service.outputs.url }}/v2/sync-jobs/run
          SYNC_TASKS_OIDC_AUDIENCE=${{ steps.backfill-service.outputs.url }}/v2/sync-jobs/run
        SECRET_OVERLAY: ${{ inputs.backfill_secrets }}
        REMOVE_ENV_VARS: HOSTED_PUSHER_API_URL,MEMORY_ENABLED_USERS,MEMORY_CANONICAL_PROMOTION_CRON_ENABLED,MEMORY_CANONICAL_PROMOTION_CRON_INTERVAL_HOURS,MEMORY_CANONICAL_PROMOTION_FAST_TRACK_ENABLED,BASIC_TIER_MINUTES_LIMIT_PER_MONTH,BASIC_TIER_WORDS_TRANSCRIBED_LIMIT_PER_MONTH,BASIC_TIER_INSIGHTS_GAINED_LIMIT_PER_MONTH,BASIC_TIER_MEMORIES_CREATED_LIMIT_PER_MONTH
      run: |
        DEPLOY_CONTROL_SCRIPT_DIR="${DEPLOY_CONTROL_SCRIPTS:-backend/scripts}"
        gcloud run services describe backend-sync \
          --region=${{ inputs.region }} \
          --project=${{ inputs.project_id }} \
          --format=json > /tmp/backend-sync-live.json
        python3 "$DEPLOY_CONTROL_SCRIPT_DIR/render_cloud_run_clone_env.py" \
          --source-json /tmp/backend-sync-live.json >> "$GITHUB_OUTPUT"

    - name: Render optional candidate tag
      if: ${{ inputs.mode == 'worker' }}
      id: candidate-tag
      shell: bash
      run: |
        if [[ -n "${{ inputs.candidate_tag }}" ]]; then
          echo "flag=--tag=${{ inputs.candidate_tag }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Deploy ${{ inputs.service }}-sync-backfill to Cloud Run
      if: ${{ inputs.mode == 'worker' }}
      id: deploy-backend-sync-backfill
      uses: google-github-actions/deploy-cloudrun@v3
      with:
        service: ${{ inputs.service }}-sync-backfill
        region: ${{ inputs.region }}
        project_id: ${{ inputs.project_id }}
        image: ${{ inputs.image }}
        no_traffic: true
        flags: >-
          --revision-suffix=${{ inputs.revision_suffix }}
          ${{ steps.candidate-tag.outputs.flag }}
          --min-instances=1
          --max-instances=30
          --concurrency=1
          --remove-env-vars=HOSTED_PUSHER_API_URL,MEMORY_ENABLED_USERS,MEMORY_CANONICAL_PROMOTION_CRON_ENABLED,MEMORY_CANONICAL_PROMOTION_CRON_INTERVAL_HOURS,MEMORY_CANONICAL_PROMOTION_FAST_TRACK_ENABLED,BASIC_TIER_MINUTES_LIMIT_PER_MONTH,BASIC_TIER_WORDS_TRANSCRIBED_LIMIT_PER_MONTH,BASIC_TIER_INSIGHTS_GAINED_LIMIT_PER_MONTH,BASIC_TIER_MEMORIES_CREATED_LIMIT_PER_MONTH
          ${{ inputs.cloud_run_flags }}
        env_vars: ${{ steps.backfill-runtime.outputs.env_vars }}
        secrets: ${{ steps.backfill-runtime.outputs.secrets }}

    - name: Capture ${{ inputs.service }}-sync-backfill revision
      if: ${{ inputs.mode == 'worker' }}
      id: capture-backend-sync-backfill-revision
      shell: bash
      run: |
        echo "revision=backend-sync-backfill-${{ inputs.revision_suffix }}" >> "$GITHUB_OUTPUT"

    - name: Bind backend-sync invoker to backfill worker
      if: ${{ inputs.mode == 'platform' }}
      shell: bash
      run: |
        INVOKER_SA="$(
          gcloud run services describe backend-sync \
            --region=${{ inputs.region }} \
            --project=${{ inputs.project_id }} \
            --format=json \
            | jq -r '.spec.template.spec.containers[0].env[] | select(.name == "SYNC_TASKS_INVOKER_SA") | .value'
        )"
        test -n "$INVOKER_SA"
        gcloud run services add-iam-policy-binding backend-sync-backfill \
          --region=${{ inputs.region }} \
          --project=${{ inputs.project_id }} \
          --member="serviceAccount:${INVOKER_SA}" \
          --role=roles/run.invoker \
          --quiet

    - name: Reconcile bounded sync backfill queue
      if: ${{ inputs.mode == 'platform' || inputs.mode == 'dispatch' }}
      shell: bash
      run: |
        # Dispatch concurrency must match the worker's --max-instances above.
        # Offering more than the worker can admit makes Cloud Run reject the
        # surplus with "no available instance", and Cloud Tasks then retries
        # each rejection with exponential backoff. At the previous four-worker
        # sizing that compounded until queued recordings were scheduled almost
        # a day out. The bounded backoff keeps a transient rejection from
        # stranding a recording for hours.
        if gcloud tasks queues describe sync-backfill --location=${{ inputs.region }} --project=${{ inputs.project_id }} >/dev/null 2>&1; then
          gcloud tasks queues update sync-backfill \
            --location=${{ inputs.region }} \
            --project=${{ inputs.project_id }} \
            --max-concurrent-dispatches=30 \
            --max-dispatches-per-second=30 \
            --min-backoff=5s \
            --max-backoff=60s
        else
          gcloud tasks queues create sync-backfill \
            --location=${{ inputs.region }} \
            --project=${{ inputs.project_id }} \
            --max-concurrent-dispatches=30 \
            --max-dispatches-per-second=30 \
            --min-backoff=5s \
            --max-backoff=60s
        fi

    - name: Reconcile backfill UID sequencer sweep
      if: ${{ inputs.mode == 'platform' || inputs.mode == 'dispatch' }}
      shell: bash
      run: |
        set -euo pipefail
        # The task invoker already has run.invoker on backend-sync. Reuse its
        # audience/identity; no new service account or queue is needed.
        SERVICE_JSON="$(gcloud run services describe '${{ inputs.service }}-sync' \
          --region='${{ inputs.region }}' --project='${{ inputs.project_id }}' \
          --format='json(status.url,spec.template.spec.containers[0].env)')"
        SERVICE_URL="$(jq -r '.status.url // empty' <<< "$SERVICE_JSON")"
        INVOKER_SA="$(jq -r '[.spec.template.spec.containers[0].env[]? | select(.name == "SYNC_TASKS_INVOKER_SA") | .value] | first // empty' <<< "$SERVICE_JSON")"
        test -n "$SERVICE_URL"
        test -n "$INVOKER_SA"
        JOB='sync-backfill-uid-sequencer'
        COMMON=(
          --location='${{ inputs.region }}'
          --project='${{ inputs.project_id }}'
          --schedule='*/2 * * * *'
          --time-zone='UTC'
          --uri="${SERVICE_URL}/v2/sync-backfill-sequencer/sweep"
          --http-method='POST'
          --oidc-service-account-email="$INVOKER_SA"
          --oidc-token-audience="${SERVICE_URL}/v2/sync-jobs/run"
          --attempt-deadline='180s'
        )
        if gcloud scheduler jobs describe "$JOB" --location='${{ inputs.region }}' --project='${{ inputs.project_id }}' >/dev/null 2>&1; then
          gcloud scheduler jobs update http "$JOB" "${COMMON[@]}"
        else
          gcloud scheduler jobs create http "$JOB" "${COMMON[@]}"
        fi

    - name: Provision and verify sync ledger TTL
      if: ${{ inputs.mode == 'platform' && inputs.provision_sync_ledger_ttl == 'true' }}
      shell: bash
      env:
        FIRESTORE_PROJECT_ID: ${{ inputs.firestore_project_id != '' && inputs.firestore_project_id || inputs.project_id }}
      run: |
        gcloud firestore fields ttls update expires_at \
          --collection-group=sync_content_ledger \
          --database='(default)' \
          --project="$FIRESTORE_PROJECT_ID" \
          --enable-ttl \
          --quiet
        gcloud firestore fields ttls list \
          --collection-group=sync_content_ledger \
          --database='(default)' \
          --project="$FIRESTORE_PROJECT_ID" \
          --format='value(name)' | grep '/fields/expires_at$'

    - name: Provision routed backfill budget alerts
      if: ${{ inputs.mode == 'platform' && inputs.provision_budget_alerts == 'true' }}
      shell: bash
      env:
        ALERT_CHANNELS: ${{ inputs.alert_notification_channels }}
      run: |
        set -euo pipefail
        test -n "$ALERT_CHANNELS"
        for THRESHOLD in 70 90; do
          METRIC="sync_backfill_budget_${THRESHOLD}"
          DISPLAY_NAME="Sync backfill daily budget ${THRESHOLD}%"
          LOG_FILTER="resource.type=\"cloud_run_revision\" resource.labels.service_name=\"backend-sync-backfill\" \"sync_backfill_budget_threshold threshold=${THRESHOLD}\""
          CONDITION_FILTER="metric.type=\"logging.googleapis.com/user/${METRIC}\" AND resource.type=\"cloud_run_revision\""
          if gcloud logging metrics describe "$METRIC" --project=${{ inputs.project_id }} >/dev/null 2>&1; then
            gcloud logging metrics update "$METRIC" \
              --project=${{ inputs.project_id }} \
              --description="$DISPLAY_NAME threshold crossing" \
              --log-filter="$LOG_FILTER"
          else
            gcloud logging metrics create "$METRIC" \
              --project=${{ inputs.project_id }} \
              --description="$DISPLAY_NAME threshold crossing" \
              --log-filter="$LOG_FILTER"
          fi

          POLICY="$(
            gcloud monitoring policies list \
              --project=${{ inputs.project_id }} \
              --filter="displayName=\"${DISPLAY_NAME}\"" \
              --format='value(name)'
          )"
          if [[ "$POLICY" == *$'\n'* ]]; then
            echo "Duplicate ${DISPLAY_NAME} alert policies; reconcile manually" >&2
            exit 1
          fi
          if [[ -z "$POLICY" ]]; then
            POLICY="$(
              gcloud monitoring policies create \
                --project=${{ inputs.project_id }} \
                --display-name="$DISPLAY_NAME" \
                --condition-display-name="$DISPLAY_NAME" \
                --condition-filter="$CONDITION_FILTER" \
                --duration=0s \
                --if='> 0' \
                --trigger-count=1 \
                --combiner=OR \
                --notification-channels="$ALERT_CHANNELS" \
                --documentation="Backfill has crossed ${THRESHOLD}% of the 555-hour UTC-day allowance." \
                --format='value(name)'
            )"
          fi
          test -n "$POLICY"
          gcloud monitoring policies describe "$POLICY" \
            --project=${{ inputs.project_id }} \
            --format=json | python3 "$DEPLOY_CONTROL_SCRIPTS/verify_sync_backfill_alert_policy.py" \
              --condition=threshold --filter="$CONDITION_FILTER" --duration-seconds=0 --channels="$ALERT_CHANNELS"
        done

    - name: Provision sync-backfill dispatch-abort alert
      if: ${{ (inputs.mode == 'platform' || inputs.mode == 'dispatch') && inputs.provision_budget_alerts == 'true' }}
      shell: bash
      env:
        ALERT_CHANNELS: ${{ inputs.alert_notification_channels }}
      run: |
        set -euo pipefail
        test -n "$ALERT_CHANNELS"
        METRIC="sync_backfill_dispatch_abort"
        DISPLAY_NAME="Sync backfill dispatch abort"
        LOG_FILTER="resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"backend-sync-backfill\" AND \"The request was aborted because there was no available instance\""
        CONDITION_FILTER="metric.type=\"logging.googleapis.com/user/${METRIC}\" AND resource.type=\"cloud_run_revision\""
        if gcloud logging metrics describe "$METRIC" --project=${{ inputs.project_id }} >/dev/null 2>&1; then
          gcloud logging metrics update "$METRIC" \
            --project=${{ inputs.project_id }} \
            --description="$DISPLAY_NAME" \
            --log-filter="$LOG_FILTER"
        else
          gcloud logging metrics create "$METRIC" \
            --project=${{ inputs.project_id }} \
            --description="$DISPLAY_NAME" \
            --log-filter="$LOG_FILTER"
        fi

        POLICY="$(
          gcloud monitoring policies list \
            --project=${{ inputs.project_id }} \
            --filter="displayName=\"${DISPLAY_NAME}\"" \
            --format='value(name)'
        )"
        if [[ "$POLICY" == *$'\n'* ]]; then
          echo "Duplicate ${DISPLAY_NAME} alert policies; reconcile manually" >&2
          exit 1
        fi
        if [[ -z "$POLICY" ]]; then
          POLICY="$(
            gcloud monitoring policies create \
              --project=${{ inputs.project_id }} \
              --display-name="$DISPLAY_NAME" \
              --condition-display-name="$DISPLAY_NAME" \
              --condition-filter="$CONDITION_FILTER" \
              --duration=0s \
              --if='> 0' \
              --trigger-count=1 \
              --combiner=OR \
              --notification-channels="$ALERT_CHANNELS" \
              --documentation="backend-sync-backfill rejected a Cloud Tasks request because no instance was available (cold-start / scale-up abort)." \
              --format='value(name)'
          )"
        fi
        test -n "$POLICY"
        gcloud monitoring policies describe "$POLICY" \
          --project=${{ inputs.project_id }} \
          --format=json | python3 "$DEPLOY_CONTROL_SCRIPTS/verify_sync_backfill_alert_policy.py" \
            --condition=threshold --filter="$CONDITION_FILTER" --duration-seconds=0 --channels="$ALERT_CHANNELS"

    - name: Provision routed backfill sequencer stall alert
      if: ${{ (inputs.mode == 'platform' || inputs.mode == 'dispatch') && inputs.provision_budget_alerts == 'true' }}
      shell: bash
      env:
        ALERT_CHANNELS: ${{ inputs.alert_notification_channels }}
      run: |
        set -euo pipefail
        test -n "$ALERT_CHANNELS"
        METRIC='sync_backfill_uid_sequencer_stall'
        DISPLAY_NAME='Sync backfill UID sequencer stalled'
        LOG_FILTER='resource.type="cloud_run_revision" AND (resource.labels.service_name="backend-sync" OR resource.labels.service_name="backend-sync-backfill") AND ("event=sync_uid_sequencer action=wait_alert" OR "event=sync_uid_sequencer action=sweep outcome=error")'
        CONDITION_FILTER="metric.type=\"logging.googleapis.com/user/${METRIC}\" AND resource.type=\"cloud_run_revision\""
        if gcloud logging metrics describe "$METRIC" --project=${{ inputs.project_id }} >/dev/null 2>&1; then
          gcloud logging metrics update "$METRIC" --project=${{ inputs.project_id }} --description="$DISPLAY_NAME" --log-filter="$LOG_FILTER"
        else
          gcloud logging metrics create "$METRIC" --project=${{ inputs.project_id }} --description="$DISPLAY_NAME" --log-filter="$LOG_FILTER"
        fi
        POLICY="$(gcloud monitoring policies list --project=${{ inputs.project_id }} --filter="displayName=\"${DISPLAY_NAME}\"" --format='value(name)')"
        if [[ "$POLICY" == *$'\n'* ]]; then
          echo "Duplicate ${DISPLAY_NAME} alert policies; reconcile manually" >&2
          exit 1
        fi
        if [[ -z "$POLICY" ]]; then
          POLICY="$(gcloud monitoring policies create \
            --project=${{ inputs.project_id }} \
            --display-name="$DISPLAY_NAME" \
            --condition-display-name="$DISPLAY_NAME" \
            --condition-filter="$CONDITION_FILTER" \
            --duration=0s --if='> 0' --trigger-count=1 --combiner=OR \
            --notification-channels="$ALERT_CHANNELS" \
            --documentation='A backfill job has waited 12 hours, or the UID reconciler failed; investigate before the 24-hour Redis job and staged-audio expiry.' \
            --format='value(name)')"
        fi
        test -n "$POLICY"
        gcloud monitoring policies describe "$POLICY" --project=${{ inputs.project_id }} --format=json \
          | python3 "$DEPLOY_CONTROL_SCRIPTS/verify_sync_backfill_alert_policy.py" \
              --condition=threshold --filter="$CONDITION_FILTER" --duration-seconds=0 --channels="$ALERT_CHANNELS"

    - name: Provision backfill sequencer Scheduler execution alerts
      if: ${{ (inputs.mode == 'platform' || inputs.mode == 'dispatch') && inputs.provision_budget_alerts == 'true' }}
      shell: bash
      env:
        ALERT_CHANNELS: ${{ inputs.alert_notification_channels }}
      run: |
        set -euo pipefail
        test -n "$ALERT_CHANNELS"
        for KIND in failure heartbeat; do
          METRIC="sync_backfill_uid_sequencer_scheduler_${KIND}"
          if [[ "$KIND" == failure ]]; then
            DISPLAY_NAME='Sync backfill UID sequencer Scheduler execution failed'
            LOG_FILTER='resource.type="cloud_scheduler_job" AND resource.labels.job_id="sync-backfill-uid-sequencer" AND severity>=ERROR AND jsonPayload."@type"="type.googleapis.com/google.cloud.scheduler.logging.AttemptFinished"'
            CONDITION_FILTER="metric.type=\"logging.googleapis.com/user/${METRIC}\" AND resource.type=\"cloud_scheduler_job\""
            CONDITION='> 0'
            DURATION='0s'
          else
            DISPLAY_NAME='Sync backfill UID sequencer Scheduler heartbeat missing'
            LOG_FILTER='resource.type="cloud_run_revision" AND resource.labels.service_name="backend-sync" AND "event=sync_uid_sequencer action=sweep_summary outcome=done"'
            CONDITION_FILTER="metric.type=\"logging.googleapis.com/user/${METRIC}\" AND resource.type=\"cloud_run_revision\""
            CONDITION='absent'
            DURATION='10min'
          fi
          if gcloud logging metrics describe "$METRIC" --project=${{ inputs.project_id }} >/dev/null 2>&1; then
            gcloud logging metrics update "$METRIC" --project=${{ inputs.project_id }} --description="$DISPLAY_NAME" --log-filter="$LOG_FILTER"
          else
            gcloud logging metrics create "$METRIC" --project=${{ inputs.project_id }} --description="$DISPLAY_NAME" --log-filter="$LOG_FILTER"
          fi
          POLICY="$(gcloud monitoring policies list --project=${{ inputs.project_id }} --filter="displayName=\"${DISPLAY_NAME}\"" --format='value(name)')"
          if [[ "$POLICY" == *$'\n'* ]]; then
            echo "Duplicate ${DISPLAY_NAME} alert policies; reconcile manually" >&2
            exit 1
          fi
          if [[ -z "$POLICY" ]]; then
            POLICY="$(python3 "$DEPLOY_WORKFLOW_ROOT/.github/scripts/ensure_monitoring_metric_alert_policy.py" \
              --project='${{ inputs.project_id }}' \
              --display-name="$DISPLAY_NAME" \
              --metric-type="logging.googleapis.com/user/${METRIC}" \
              --condition-display-name="$DISPLAY_NAME" \
              --condition-filter="$CONDITION_FILTER" \
              --duration="$DURATION" \
              --comparison="$CONDITION" \
              --combiner=OR \
              --notification-channels="$ALERT_CHANNELS" \
              --documentation='The two-minute sync-backfill-uid-sequencer sweep failed or stopped. Admission and normal completion still dispatch; investigate crash recovery and pending age.')"
          fi
          test -n "$POLICY"
          if [[ "$KIND" == heartbeat ]]; then
            CONDITION_KIND=absent
            DURATION_SECONDS=600
          else
            CONDITION_KIND=threshold
            DURATION_SECONDS=0
          fi
          gcloud monitoring policies describe "$POLICY" --project=${{ inputs.project_id }} --format=json \
            | python3 "$DEPLOY_CONTROL_SCRIPTS/verify_sync_backfill_alert_policy.py" \
                --condition="$CONDITION_KIND" --filter="$CONDITION_FILTER" \
                --duration-seconds="$DURATION_SECONDS" --channels="$ALERT_CHANNELS"
        done

name: Sync Backfill Lifecycle
description: Deploy and provision the bounded backend-sync-backfill worker lane

inputs:
  mode:
    description: 'worker (deploy backfill revision), platform (queue/IAM/TTL/alerts), or dispatch (queue reconciliation + dispatch-abort alert only)'
    required: true
  project_id:
    description: GCP project ID
    required: true
  firestore_project_id:
    description: GCP project ID for Firestore sync ledger TTL (mode=platform)
    required: false
    default: ''
  region:
    description: Cloud Run / Cloud Tasks region
    required: true
    default: us-central1
  service:
    description: Base Cloud Run service name (backend)
    required: true
    default: backend
  image:
    description: Container image for the backfill worker (mode=worker)
    required: false
    default: ''
  revision_suffix:
    description: Cloud Run revision suffix (mode=worker)
    required: false
    default: ''
  cloud_run_flags:
    description: Shared Cloud Run network/runtime flags (mode=worker)
    required: false
    default: ''
  identity_flags:
    description: >-
      Manifest-rendered runtime identity flags for backend-sync-backfill (mode=worker). When set, the
      worker runs as that service account and the cloned backend-sync contract drops key-credential refs.
    required: false
    default: ''
  forbidden_env_names:
    description: Manifest forbidden env keys to exclude from the live clone (mode=worker)
    required: false
    default: DEEPGRAM_SELF_HOSTED_ENABLED,DEEPGRAM_SELF_HOSTED_URL
  remove_env_extra:
    description: >-
      Manifest forbidden env keys the worker deploy's literal --remove-env-vars list lacks, each with a
      leading comma (mode=worker). gcloud rejects a key named twice.
    required: false
    default: ''
  backfill_env_vars:
    description: Manifest-rendered backend-sync-backfill env overlay (worker env; platform and dispatch read its SYNC_BACKFILL_TASKS_QUEUE)
    required: false
    default: ''
  backfill_secrets:
    description: Manifest-rendered backend-sync-backfill secrets overlay (mode=worker)
    required: false
    default: ''
  candidate_tag:
    description: Stable no-traffic candidate tag (mode=worker)
    required: false
    default: ''
  provision_sync_ledger_ttl:
    description: Provision and verify Firestore sync_content_ledger TTL (mode=platform)
    required: false
    default: 'true'
  provision_budget_alerts:
    description: Provision routed backfill budget alerts (mode=platform, prod only)
    required: false
    default: 'false'
  alert_notification_channels:
    description: Monitoring notification channel IDs for budget alerts
    required: false
    default: ''

outputs:
  service_url:
    description: Predicted backend-sync-backfill Cloud Run URL
    value: ${{ steps.backfill-service.outputs.url }}
  revision:
    description: backend-sync-backfill revision name for this deploy
    value: ${{ steps.capture-backend-sync-backfill-revision.outputs.revision }}
  sync_backfill_env_vars:
    description: SYNC_BACKFILL_* overlay for the backend-sync admission deploy
    value: ${{ steps.backfill-service.outputs.sync_backfill_env_vars }}

runs:
  using: composite
  steps:
    - name: Resolve ops-owned backfill queues
      if: ${{ inputs.mode == 'worker' }}
      id: ops-queues
      shell: bash
      env:
        BACKFILL_ENV: ${{ inputs.backfill_env_vars }}
      run: |
        set -euo pipefail
        # B4: the live backfill queue is an ops value (backend/deploy/ops/prod.yaml), read from the
        # reviewed deploy-control source, so a train never re-points backfill at a queue an operator
        # retired (10-19 04:52Z sync-backfill stall). Prod fails closed if the ops file has no value.
        # Non-prod: the manifest's values win (main #22460), sync-backfill only when it declares none.
        backfill_queue="$(sed -n 's/^SYNC_BACKFILL_TASKS_QUEUE=//p' <<<"${BACKFILL_ENV:-}" | tail -n 1)"
        worker_queue="$(sed -n 's/^SYNC_TASKS_QUEUE=//p' <<<"${BACKFILL_ENV:-}" | tail -n 1)"
        backfill_queue="${backfill_queue:-sync-backfill}"
        worker_queue="${worker_queue:-sync-backfill}"
        if [[ '${{ inputs.project_id }}' == 'based-hardware' ]]; then
          python3 -m pip install -q PyYAML==6.0.1
          DEPLOY_CONTROL_SCRIPT_DIR="${DEPLOY_CONTROL_SCRIPTS:-backend/scripts}"
          ops_env="$(python3 "$DEPLOY_CONTROL_SCRIPT_DIR/ops_train.py" render-env --env prod \
            --service '${{ inputs.service }}-sync-backfill')"
          backfill_queue="$(sed -n 's/^SYNC_BACKFILL_TASKS_QUEUE=//p' <<<"$ops_env")"
          worker_queue="$(sed -n 's/^SYNC_TASKS_QUEUE=//p' <<<"$ops_env")"
          if [[ -z "$backfill_queue" || -z "$worker_queue" ]]; then
            echo "ops file declares no backfill queues for ${{ inputs.service }}-sync-backfill" >&2
            exit 1
          fi
        fi
        echo "Backfill queues: SYNC_BACKFILL_TASKS_QUEUE=$backfill_queue SYNC_TASKS_QUEUE=$worker_queue"
        echo "backfill_queue=$backfill_queue" >> "$GITHUB_OUTPUT"
        echo "worker_queue=$worker_queue" >> "$GITHUB_OUTPUT"

    - name: Resolve backfill service URL
      if: ${{ inputs.mode == 'worker' }}
      id: backfill-service
      shell: bash
      env:
        BACKFILL_QUEUE: ${{ steps.ops-queues.outputs.backfill_queue }}
      run: |
        PROJECT_NUMBER="$(gcloud projects describe "${{ inputs.project_id }}" --format='value(projectNumber)')"
        URL="https://${{ inputs.service }}-sync-backfill-${PROJECT_NUMBER}.${{ inputs.region }}.run.app"
        echo "url=${URL}" >> "$GITHUB_OUTPUT"
        {
          echo "sync_backfill_env_vars<<EOF"
          echo "SYNC_BACKFILL_TASKS_QUEUE=${BACKFILL_QUEUE}"
          echo "SYNC_BACKFILL_TASKS_HANDLER_URL=${URL}/v2/sync-jobs/run"
          echo "SYNC_BACKFILL_TASKS_OIDC_AUDIENCE=${URL}/v2/sync-jobs/run"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Clone complete backend-sync runtime contract for backfill worker
      if: ${{ inputs.mode == 'worker' }}
      id: backfill-runtime
      shell: bash
      env:
        ENV_OVERLAY: |-
          ${{ inputs.backfill_env_vars }}
          SYNC_TASKS_QUEUE=${{ steps.ops-queues.outputs.worker_queue }}
          SYNC_TASKS_HANDLER_URL=${{ steps.backfill-service.outputs.url }}/v2/sync-jobs/run
          SYNC_TASKS_OIDC_AUDIENCE=${{ steps.backfill-service.outputs.url }}/v2/sync-jobs/run
        SECRET_OVERLAY: ${{ inputs.backfill_secrets }}
        REMOVE_ENV_VARS: HOSTED_PUSHER_API_URL,MEMORY_ENABLED_USERS,MEMORY_CANONICAL_PROMOTION_CRON_ENABLED,MEMORY_CANONICAL_PROMOTION_CRON_INTERVAL_HOURS,MEMORY_CANONICAL_PROMOTION_FAST_TRACK_ENABLED,BASIC_TIER_MINUTES_LIMIT_PER_MONTH,BASIC_TIER_WORDS_TRANSCRIBED_LIMIT_PER_MONTH,BASIC_TIER_INSIGHTS_GAINED_LIMIT_PER_MONTH,BASIC_TIER_MEMORIES_CREATED_LIMIT_PER_MONTH,CONVERSATION_RELEVANCE_JEV_ENABLED,CONVERSATION_RELEVANCE_JEV_SHADOW_PERCENT,CONVERSATION_RELEVANCE_JEV_SHADOW_DAILY_CAP,CONVERSATION_RELEVANCE_JEV_UID_ALLOWLIST,CONVERSATION_RELEVANCE_KEEP_ALL_PERCENT,CONVERSATION_RELEVANCE_JEV_RESCUE,MEMORY_OWNER_JEV_FLIP_ENABLED,MEMORY_OWNER_JEV_FLIP_PERCENT,MEMORY_OWNER_JEV_SHADOW_PERCENT,MEMORY_OWNER_JEV_SHADOW_DAILY_CAP,CONVERSATION_SMART_MERGE_UID_ALLOWLIST,CONVERSATION_SMART_MERGE_WALLCLOCK_GAP_MODE,DESKTOP_PENDANT_CALL_LINK_MODE,DESKTOP_PENDANT_CALL_LINK_PERCENT,MEETING_NOTES_EPISODE_SELECTION,MEETING_NOTES_EPISODE_JEV_THRESHOLD,MEETING_NOTES_EPISODE_SELECTION_EFFORT,MEETING_NOTES_EPISODE_SELECTION_TIMEOUT_SECONDS
        FORBIDDEN_ENV_NAMES: ${{ inputs.forbidden_env_names }}
        IDENTITY_FLAGS: ${{ inputs.identity_flags }}
      run: |
        DEPLOY_CONTROL_SCRIPT_DIR="${DEPLOY_CONTROL_SCRIPTS:-backend/scripts}"
        # Drop forbidden live bindings before overlays can reintroduce them after gcloud removal.
        REMOVE_ENV_VARS="${REMOVE_ENV_VARS},${FORBIDDEN_ENV_NAMES}"
        export REMOVE_ENV_VARS
        # A worker pinned to its own runtime identity cannot read backend-sync's key secret, and
        # gcloud applies --update-secrets after --remove-secrets, so the clone itself must drop it.
        if [[ -n "$IDENTITY_FLAGS" ]]; then
          REMOVE_ENV_VARS="${REMOVE_ENV_VARS},SERVICE_ACCOUNT_JSON,GOOGLE_APPLICATION_CREDENTIALS"
          export REMOVE_ENV_VARS
        fi
        gcloud run services describe backend-sync \
          --region=${{ inputs.region }} \
          --project=${{ inputs.project_id }} \
          --format=json > /tmp/backend-sync-live.json
        # The worker's own live identity decides whether backend-sync's key-credential refs may be
        # cloned: a worker already moved to a dedicated runtime SA cannot read them. A first deploy
        # has no live worker, so nothing is dropped.
        target_args=()
        if gcloud run services describe ${{ inputs.service }}-sync-backfill \
          --region=${{ inputs.region }} \
          --project=${{ inputs.project_id }} \
          --format=json > /tmp/backend-sync-backfill-live.json 2>/dev/null; then
          target_args=(--target-json /tmp/backend-sync-backfill-live.json)
        fi
        python3 "$DEPLOY_CONTROL_SCRIPT_DIR/render_cloud_run_clone_env.py" \
          --source-json /tmp/backend-sync-live.json "${target_args[@]}" >> "$GITHUB_OUTPUT"

    - name: Render optional candidate tag
      if: ${{ inputs.mode == 'worker' }}
      id: candidate-tag
      shell: bash
      run: |
        if [[ -n "${{ inputs.candidate_tag }}" ]]; then
          echo "flag=--tag=${{ inputs.candidate_tag }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Resolve live sync-backfill maxScale
      id: live-max-scale
      shell: bash
      env:
        CLOUD_RUN_SERVICE: ${{ inputs.service }}-sync-backfill
        CLOUD_RUN_PROJECT: ${{ inputs.project_id }}
        CLOUD_RUN_REGION: ${{ inputs.region }}
      run: |
        set -euo pipefail
        # Service-level caps are the live ops control; older services may only have a revision cap.
        # Listing distinguishes a fresh service from an API/auth failure, which must stop deployment.
        MAX_SCALE="$(gcloud run services list \
          --project="$CLOUD_RUN_PROJECT" --region="$CLOUD_RUN_REGION" \
          --filter="metadata.name=$CLOUD_RUN_SERVICE" \
          --format='json(metadata.name,metadata.annotations,spec.template.metadata.annotations)' \
          | jq -er --arg service "$CLOUD_RUN_SERVICE" '
            [.[] | select(.metadata.name == $service)]
            | if length > 1 then error("Duplicate Cloud Run service") else
                (.[0].metadata.annotations["run.googleapis.com/maxScale"]
                 // .[0].spec.template.metadata.annotations["autoscaling.knative.dev/maxScale"]
                 // "40") end
            | if type == "string" and test("^[1-9][0-9]*$") then .
              else error("Invalid Cloud Run maxScale") end
            # Bound digits before shell arithmetic; oversized annotations use the fresh-service default.
            | if length > 3 then "40"
              elif tonumber > 500 then "40" else . end')"
        echo "max_scale=$MAX_SCALE" >> "$GITHUB_OUTPUT"
        # Resolve in worker AND platform/dispatch invocations, which reconcile the queue separately.
        DISPATCH_LIMIT=$((MAX_SCALE * 6))
        if (( DISPATCH_LIMIT > 90 )); then DISPATCH_LIMIT=90; fi
        if (( DISPATCH_LIMIT < 1 )); then DISPATCH_LIMIT=1; fi
        echo "max_concurrent_dispatches=$DISPATCH_LIMIT" >> "$GITHUB_OUTPUT"

    - name: Deploy ${{ inputs.service }}-sync-backfill to Cloud Run
      if: ${{ inputs.mode == 'worker' }}
      id: deploy-backend-sync-backfill
      uses: google-github-actions/deploy-cloudrun@v3
      with:
        service: ${{ inputs.service }}-sync-backfill
        region: ${{ inputs.region }}
        project_id: ${{ inputs.project_id }}
        image: ${{ inputs.image }}
        no_traffic: true
        flags: >-
          --revision-suffix=${{ inputs.revision_suffix }}-base
          ${{ steps.candidate-tag.outputs.flag }}
          --min-instances=0
          --max-instances=${{ steps.live-max-scale.outputs.max_scale }}
          --max=${{ steps.live-max-scale.outputs.max_scale }}
          --concurrency=6
          --cpu=2
          --memory=${{ inputs.project_id == 'based-hardware' && '4Gi' || '8Gi' }}
          --remove-env-vars=HOSTED_PUSHER_API_URL,MEMORY_ENABLED_USERS,MEMORY_CANONICAL_PROMOTION_CRON_ENABLED,MEMORY_CANONICAL_PROMOTION_CRON_INTERVAL_HOURS,MEMORY_CANONICAL_PROMOTION_FAST_TRACK_ENABLED,BASIC_TIER_MINUTES_LIMIT_PER_MONTH,BASIC_TIER_WORDS_TRANSCRIBED_LIMIT_PER_MONTH,BASIC_TIER_INSIGHTS_GAINED_LIMIT_PER_MONTH,BASIC_TIER_MEMORIES_CREATED_LIMIT_PER_MONTH,CONVERSATION_RELEVANCE_JEV_UID_ALLOWLIST,CONVERSATION_RELEVANCE_JEV_ENABLED,CONVERSATION_RELEVANCE_JEV_SHADOW_PERCENT,CONVERSATION_RELEVANCE_JEV_SHADOW_DAILY_CAP,CONVERSATION_RELEVANCE_KEEP_ALL_PERCENT,CONVERSATION_RELEVANCE_JEV_RESCUE,MEMORY_OWNER_JEV_FLIP_ENABLED,MEMORY_OWNER_JEV_FLIP_PERCENT,MEMORY_OWNER_JEV_SHADOW_PERCENT,MEMORY_OWNER_JEV_SHADOW_DAILY_CAP,CONVERSATION_SMART_MERGE_UID_ALLOWLIST,CONVERSATION_SMART_MERGE_WALLCLOCK_GAP_MODE,DESKTOP_PENDANT_CALL_LINK_MODE,DESKTOP_PENDANT_CALL_LINK_PERCENT,MEETING_NOTES_EPISODE_SELECTION,MEETING_NOTES_EPISODE_JEV_THRESHOLD,MEETING_NOTES_EPISODE_SELECTION_EFFORT,MEETING_NOTES_EPISODE_SELECTION_TIMEOUT_SECONDS,CONVERSATION_CALENDAR_CONTEXT_READ_ENABLED,CONVERSATION_OCR_CONTEXT_ENABLED,MEETING_NOTES_SCREEN_FRAMES_CONTEXT_ENABLED,SCREEN_FRAME_EGRESS_ENABLED,MEMORY_BELIEF_MODEL_ENABLED,FREE_TIER_MEMORY_SUPPRESSION,FREE_TIER_MEMORY_SUPPRESSION_COHORT,KNOWLEDGE_LEDGER_DRAIN_ENABLED,KNOWLEDGE_LEDGER_DRAIN_UID_ALLOWLIST,MEMORY_DAILY_MEMORY_SWEEP_ENABLED,MEMORY_DAILY_MEMORY_SWEEP_KILL_SWITCH,MEMORY_DAILY_MEMORY_SWEEP_MODEL_ENABLED,MEMORY_DAILY_MEMORY_SWEEP_MODEL_NAME,MEMORY_DAILY_MEMORY_SWEEP_MAX_MODEL_CANDIDATES,MEMORY_DAILY_MEMORY_SWEEP_MAX_MODEL_COST_USD,MEMORY_DAILY_MEMORY_SWEEP_COHORT_ENABLED,MEMORY_DAILY_MEMORY_SWEEP_COHORT_FLAG,MEMORY_DAILY_MEMORY_SWEEP_COHORT_NAME,MEMORY_DAILY_MEMORY_SWEEP_COHORT_TIMEOUT_SECONDS,MEMORY_DAILY_MEMORY_SWEEP_TIMEZONE_RECONCILIATION_ENABLED,MEMORY_DAILY_MEMORY_SWEEP_STAGGER_SECONDS,DEEPGRAM_SELF_HOSTED_ENABLED,DEEPGRAM_SELF_HOSTED_URL${{ inputs.remove_env_extra }}
          ${{ inputs.cloud_run_flags }}
          ${{ inputs.identity_flags }}
        env_vars: ${{ steps.backfill-runtime.outputs.env_vars }}
        secrets: ${{ steps.backfill-runtime.outputs.secrets }}

    - name: Capture ${{ inputs.service }}-sync-backfill revision
      if: ${{ inputs.mode == 'worker' }}
      id: capture-backend-sync-backfill-revision
      shell: bash
      run: |
        echo "revision=backend-sync-backfill-${{ inputs.revision_suffix }}" >> "$GITHUB_OUTPUT"

    - name: Bind backend-sync invoker to backfill worker
      if: ${{ inputs.mode == 'platform' }}
      shell: bash
      run: |
        INVOKER_SA="$(
          gcloud run services describe backend-sync \
            --region=${{ inputs.region }} \
            --project=${{ inputs.project_id }} \
            --format=json \
            | jq -r '.spec.template.spec.containers[0].env[] | select(.name == "SYNC_TASKS_INVOKER_SA") | .value'
        )"
        test -n "$INVOKER_SA"
        gcloud run services add-iam-policy-binding backend-sync-backfill \
          --region=${{ inputs.region }} \
          --project=${{ inputs.project_id }} \
          --member="serviceAccount:${INVOKER_SA}" \
          --role=roles/run.invoker \
          --quiet

    - name: Reconcile bounded sync backfill queue
      if: ${{ inputs.mode == 'platform' || inputs.mode == 'dispatch' }}
      shell: bash
      env:
        BACKFILL_MAX_CONCURRENT_DISPATCHES: ${{ steps.live-max-scale.outputs.max_concurrent_dispatches }}
        BACKFILL_ENV: ${{ inputs.backfill_env_vars }}
      run: |
        set -euo pipefail
        # B4: in prod the live backfill queue's name and rates are ops values
        # (backend/deploy/ops/prod.yaml cloud_tasks), applied and verified only by the
        # config-train, so a train never rewrites them (one source, not train + ops file).
        if [[ '${{ inputs.project_id }}' == 'based-hardware' ]]; then
          echo "prod backfill queue is owned by the ops file and config-train; train does not reconcile it"
          exit 0
        fi
        # Elsewhere reconcile the queue the manifest routes backfill to, defaulting to sync-backfill.
        BACKFILL_QUEUE="$(sed -n 's/^SYNC_BACKFILL_TASKS_QUEUE=//p' <<<"${BACKFILL_ENV:-}" | tail -n 1)"
        BACKFILL_QUEUE="${BACKFILL_QUEUE:-sync-backfill}"
        # Keep the train ceiling of 90, bounded by the live worker cap x concurrency 6.
        # The 15/s rate caps starts, not in-flight work; the concurrency limit below
        # independently prevents dispatch beyond worker capacity, including bursts.
        # One owner per UID. 2026-10-24 right-sizing: prod worker 8->4 GiB and
        # min-instances 3->0 (live 06:06Z); dev keeps 8 GiB. Later operator steps
        # require latency/retry/GPU/Firestore/Redis gates and a follow-up config train.
        # Dispatch concurrency must not exceed the worker's capacity:
        # --max-instances x --concurrency (service-level --max above; the
        # service cap wins when it is lower).
        # Offering more than the worker can admit makes Cloud Run reject the
        # surplus with "no available instance", and Cloud Tasks then retries
        # each rejection with exponential backoff. At the previous four-worker
        # sizing that compounded until queued recordings were scheduled almost
        # a day out. The bounded backoff keeps a transient rejection from
        # stranding a recording for hours.
        # --max-attempts must mirror utils/cloud_tasks.py
        # get_sync_tasks_max_attempts() (default 5): omitted queue fields keep
        # Google's default of 100, so a handler-budget deferral chain that has
        # spent its attempt contract and ended through the 409 would keep
        # retrying long after the preserved run lock expired, re-running
        # whole-budget pipelines the code-side bound already gave up on.
        if gcloud tasks queues describe "$BACKFILL_QUEUE" --location=${{ inputs.region }} --project=${{ inputs.project_id }} >/dev/null 2>&1; then
          gcloud tasks queues update "$BACKFILL_QUEUE" \
            --location=${{ inputs.region }} \
            --project=${{ inputs.project_id }} \
            --max-attempts=5 \
            --max-concurrent-dispatches="$BACKFILL_MAX_CONCURRENT_DISPATCHES" \
            --max-dispatches-per-second=15 \
            --min-backoff=5s \
            --max-backoff=60s
        else
          gcloud tasks queues create "$BACKFILL_QUEUE" \
            --location=${{ inputs.region }} \
            --project=${{ inputs.project_id }} \
            --max-attempts=5 \
            --max-concurrent-dispatches="$BACKFILL_MAX_CONCURRENT_DISPATCHES" \
            --max-dispatches-per-second=15 \
            --min-backoff=5s \
            --max-backoff=60s
        fi
        # The fresh lane and the fallback route in _enqueue_sync_job_routed
        # deliver through the main sync-jobs queue (SYNC_TASKS_QUEUE), whose
        # throughput limits another team owns; update-only reconciliation
        # here still caps attempts so a deferral chain ended through the 409
        # cannot outlive the code-side contract the same way. Without this
        # the queue keeps Google's default of 100 attempts.
        if gcloud tasks queues describe sync-jobs --location=${{ inputs.region }} --project=${{ inputs.project_id }} >/dev/null 2>&1; then
          gcloud tasks queues update sync-jobs \
            --location=${{ inputs.region }} \
            --project=${{ inputs.project_id }} \
            --max-attempts=5
        fi

    - name: Reconcile backfill UID sequencer sweep
      if: ${{ inputs.mode == 'platform' || inputs.mode == 'dispatch' }}
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install -q PyYAML==6.0.1 google-auth==2.32.0 requests==2.33.1
        DEPLOY_CONTROL_SCRIPT_DIR="${DEPLOY_CONTROL_SCRIPTS:-backend/scripts}"
        ENVIRONMENT=dev
        if [[ '${{ inputs.project_id }}' == 'based-hardware' ]]; then ENVIRONMENT=prod; fi
        python3 "$DEPLOY_CONTROL_SCRIPT_DIR/scheduler_reconcile.py" \
          --environment "$ENVIRONMENT" --project '${{ inputs.project_id }}' \
          --apply --jobs sync-backfill-uid-sequencer
        python3 "$DEPLOY_CONTROL_SCRIPT_DIR/scheduler_reconcile.py" \
          --environment "$ENVIRONMENT" --project '${{ inputs.project_id }}' \
          --check --jobs sync-backfill-uid-sequencer

    - name: Provision and verify sync ledger TTL
      if: ${{ inputs.mode == 'platform' && inputs.provision_sync_ledger_ttl == 'true' }}
      shell: bash
      env:
        FIRESTORE_PROJECT_ID: ${{ inputs.firestore_project_id != '' && inputs.firestore_project_id || inputs.project_id }}
      run: |
        gcloud firestore fields ttls update expires_at \
          --collection-group=sync_content_ledger \
          --database='(default)' \
          --project="$FIRESTORE_PROJECT_ID" \
          --enable-ttl \
          --quiet
        gcloud firestore fields ttls list \
          --collection-group=sync_content_ledger \
          --database='(default)' \
          --project="$FIRESTORE_PROJECT_ID" \
          --format='value(name)' | grep '/fields/expires_at$'

    - name: Provision routed backfill budget alerts
      if: ${{ inputs.mode == 'platform' && inputs.provision_budget_alerts == 'true' }}
      shell: bash
      env:
        ALERT_CHANNELS: ${{ inputs.alert_notification_channels }}
      run: |
        set -euo pipefail
        test -n "$ALERT_CHANNELS"
        for THRESHOLD in 70 90; do
          METRIC="sync_backfill_budget_${THRESHOLD}"
          DISPLAY_NAME="Sync backfill daily budget ${THRESHOLD}%"
          LOG_FILTER="resource.type=\"cloud_run_revision\" resource.labels.service_name=\"backend-sync-backfill\" \"sync_backfill_budget_threshold threshold=${THRESHOLD}\""
          CONDITION_FILTER="metric.type=\"logging.googleapis.com/user/${METRIC}\" AND resource.type=\"cloud_run_revision\""
          if gcloud logging metrics describe "$METRIC" --project=${{ inputs.project_id }} >/dev/null 2>&1; then
            gcloud logging metrics update "$METRIC" \
              --project=${{ inputs.project_id }} \
              --description="$DISPLAY_NAME threshold crossing" \
              --log-filter="$LOG_FILTER"
          else
            gcloud logging metrics create "$METRIC" \
              --project=${{ inputs.project_id }} \
              --description="$DISPLAY_NAME threshold crossing" \
              --log-filter="$LOG_FILTER"
          fi

          POLICY="$(
            gcloud monitoring policies list \
              --project=${{ inputs.project_id }} \
              --filter="displayName=\"${DISPLAY_NAME}\"" \
              --format='value(name)'
          )"
          if [[ "$POLICY" == *$'\n'* ]]; then
            echo "Duplicate ${DISPLAY_NAME} alert policies; reconcile manually" >&2
            exit 1
          fi
          if [[ -z "$POLICY" ]]; then
            POLICY="$(
              gcloud monitoring policies create \
                --project=${{ inputs.project_id }} \
                --display-name="$DISPLAY_NAME" \
                --condition-display-name="$DISPLAY_NAME" \
                --condition-filter="$CONDITION_FILTER" \
                --duration=0s \
                --if='> 0' \
                --trigger-count=1 \
                --combiner=OR \
                --notification-channels="$ALERT_CHANNELS" \
                --documentation="Backfill has crossed ${THRESHOLD}% of the 555-hour UTC-day allowance." \
                --format='value(name)'
            )"
          fi
          test -n "$POLICY"
          python3 "$DEPLOY_CONTROL_SCRIPTS/reconcile_sync_backfill_alert_policy.py" \
            --project='${{ inputs.project_id }}' --policy="$POLICY" \
            --display-name="$DISPLAY_NAME" --condition=threshold \
            --filter="$CONDITION_FILTER" --duration-seconds=0 --channels="$ALERT_CHANNELS"
          gcloud monitoring policies describe "$POLICY" \
            --project=${{ inputs.project_id }} \
            --format=json | python3 "$DEPLOY_CONTROL_SCRIPTS/verify_sync_backfill_alert_policy.py" \
              --condition=threshold --filter="$CONDITION_FILTER" --duration-seconds=0 --channels="$ALERT_CHANNELS"
        done

    - name: Provision sync-backfill dispatch-abort alert
      if: ${{ (inputs.mode == 'platform' || inputs.mode == 'dispatch') && inputs.provision_budget_alerts == 'true' }}
      shell: bash
      env:
        ALERT_CHANNELS: ${{ inputs.alert_notification_channels }}
      run: |
        set -euo pipefail
        test -n "$ALERT_CHANNELS"
        METRIC="sync_backfill_dispatch_abort"
        DISPLAY_NAME="Sync backfill dispatch abort"
        LOG_FILTER="resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"backend-sync-backfill\" AND \"The request was aborted because there was no available instance\""
        CONDITION_FILTER="metric.type=\"logging.googleapis.com/user/${METRIC}\" AND resource.type=\"cloud_run_revision\""
        # Cloud Tasks retries every abort, so one abort is a delay, not a loss.
        # Alert on a sustained rate: more than 30 in a rolling 30 minutes.
        THRESHOLD=30
        WINDOW=1800s
        AGGREGATION="{\"alignmentPeriod\":\"${WINDOW}\",\"perSeriesAligner\":\"ALIGN_SUM\",\"crossSeriesReducer\":\"REDUCE_SUM\"}"
        if gcloud logging metrics describe "$METRIC" --project=${{ inputs.project_id }} >/dev/null 2>&1; then
          gcloud logging metrics update "$METRIC" \
            --project=${{ inputs.project_id }} \
            --description="$DISPLAY_NAME" \
            --log-filter="$LOG_FILTER"
        else
          gcloud logging metrics create "$METRIC" \
            --project=${{ inputs.project_id }} \
            --description="$DISPLAY_NAME" \
            --log-filter="$LOG_FILTER"
        fi

        POLICY="$(
          gcloud monitoring policies list \
            --project=${{ inputs.project_id }} \
            --filter="displayName=\"${DISPLAY_NAME}\"" \
            --format='value(name)'
        )"
        if [[ "$POLICY" == *$'\n'* ]]; then
          echo "Duplicate ${DISPLAY_NAME} alert policies; reconcile manually" >&2
          exit 1
        fi
        if [[ -z "$POLICY" ]]; then
          POLICY="$(
            gcloud monitoring policies create \
              --project=${{ inputs.project_id }} \
              --display-name="$DISPLAY_NAME" \
              --condition-display-name="$DISPLAY_NAME" \
              --condition-filter="$CONDITION_FILTER" \
              --duration=0s \
              --if="> ${THRESHOLD}" \
              --aggregation="$AGGREGATION" \
              --trigger-count=1 \
              --combiner=OR \
              --notification-channels="$ALERT_CHANNELS" \
              --documentation="backend-sync-backfill rejected more than ${THRESHOLD} Cloud Tasks requests in 30 minutes because no instance was available. Cloud Tasks retries each one, so recordings are delayed rather than lost. Check that the service-level max instances matches the queue max-concurrent-dispatches, then instance quota and cold-start time." \
              --format='value(name)'
          )"
        fi
        test -n "$POLICY"
        python3 "$DEPLOY_CONTROL_SCRIPTS/reconcile_sync_backfill_alert_policy.py" \
          --project='${{ inputs.project_id }}' --policy="$POLICY" \
          --display-name="$DISPLAY_NAME" --condition=threshold \
          --filter="$CONDITION_FILTER" --duration-seconds=0 --channels="$ALERT_CHANNELS" \
          --threshold-value="$THRESHOLD" --alignment-period="$WINDOW"
        gcloud monitoring policies describe "$POLICY" \
          --project=${{ inputs.project_id }} \
          --format=json | python3 "$DEPLOY_CONTROL_SCRIPTS/verify_sync_backfill_alert_policy.py" \
            --condition=threshold --filter="$CONDITION_FILTER" --duration-seconds=0 --channels="$ALERT_CHANNELS" \
            --threshold-value="$THRESHOLD" --alignment-period="$WINDOW"

    - name: Provision routed backfill sequencer stall alert
      if: ${{ (inputs.mode == 'platform' || inputs.mode == 'dispatch') && inputs.provision_budget_alerts == 'true' }}
      shell: bash
      env:
        ALERT_CHANNELS: ${{ inputs.alert_notification_channels }}
      run: |
        set -euo pipefail
        test -n "$ALERT_CHANNELS"
        METRIC='sync_backfill_uid_sequencer_stall'
        DISPLAY_NAME='Sync backfill UID sequencer stalled'
        LOG_FILTER='resource.type="cloud_run_revision" AND (resource.labels.service_name="backend-sync" OR resource.labels.service_name="backend-sync-backfill") AND ("event=sync_uid_sequencer action=wait_alert" OR "event=sync_uid_sequencer action=sweep outcome=error")'
        CONDITION_FILTER="metric.type=\"logging.googleapis.com/user/${METRIC}\" AND resource.type=\"cloud_run_revision\""
        if gcloud logging metrics describe "$METRIC" --project=${{ inputs.project_id }} >/dev/null 2>&1; then
          gcloud logging metrics update "$METRIC" --project=${{ inputs.project_id }} --description="$DISPLAY_NAME" --log-filter="$LOG_FILTER"
        else
          gcloud logging metrics create "$METRIC" --project=${{ inputs.project_id }} --description="$DISPLAY_NAME" --log-filter="$LOG_FILTER"
        fi
        POLICY="$(gcloud monitoring policies list --project=${{ inputs.project_id }} --filter="displayName=\"${DISPLAY_NAME}\"" --format='value(name)')"
        if [[ "$POLICY" == *$'\n'* ]]; then
          echo "Duplicate ${DISPLAY_NAME} alert policies; reconcile manually" >&2
          exit 1
        fi
        if [[ -z "$POLICY" ]]; then
          POLICY="$(gcloud monitoring policies create \
            --project=${{ inputs.project_id }} \
            --display-name="$DISPLAY_NAME" \
            --condition-display-name="$DISPLAY_NAME" \
            --condition-filter="$CONDITION_FILTER" \
            --duration=0s --if='> 0' --trigger-count=1 --combiner=OR \
            --notification-channels="$ALERT_CHANNELS" \
            --documentation='A backfill job has waited 12 hours, or the UID reconciler failed; investigate before the 24-hour Redis job and staged-audio expiry.' \
            --format='value(name)')"
        fi
        test -n "$POLICY"
        python3 "$DEPLOY_CONTROL_SCRIPTS/reconcile_sync_backfill_alert_policy.py" \
          --project='${{ inputs.project_id }}' --policy="$POLICY" \
          --display-name="$DISPLAY_NAME" --condition=threshold \
          --filter="$CONDITION_FILTER" --duration-seconds=0 --channels="$ALERT_CHANNELS"
        gcloud monitoring policies describe "$POLICY" --project=${{ inputs.project_id }} --format=json \
          | python3 "$DEPLOY_CONTROL_SCRIPTS/verify_sync_backfill_alert_policy.py" \
              --condition=threshold --filter="$CONDITION_FILTER" --duration-seconds=0 --channels="$ALERT_CHANNELS"

    - name: Provision backfill sequencer Scheduler execution alerts
      if: ${{ (inputs.mode == 'platform' || inputs.mode == 'dispatch') && inputs.provision_budget_alerts == 'true' }}
      shell: bash
      env:
        ALERT_CHANNELS: ${{ inputs.alert_notification_channels }}
      run: |
        set -euo pipefail
        test -n "$ALERT_CHANNELS"
        for KIND in failure heartbeat; do
          METRIC="sync_backfill_uid_sequencer_scheduler_${KIND}"
          if [[ "$KIND" == failure ]]; then
            DISPLAY_NAME='Sync backfill UID sequencer Scheduler execution failed'
            LOG_FILTER='resource.type="cloud_scheduler_job" AND resource.labels.job_id="sync-backfill-uid-sequencer" AND severity>=ERROR AND jsonPayload."@type"="type.googleapis.com/google.cloud.scheduler.logging.AttemptFinished"'
            CONDITION_FILTER="metric.type=\"logging.googleapis.com/user/${METRIC}\" AND resource.type=\"cloud_scheduler_job\""
            CONDITION='> 0'
            # Sustained failure for 10 minutes (about five sweeps) pages; one failed
            # two-minute sweep does not. Matches the live policy set by the alert owner.
            DURATION='600s'
          else
            DISPLAY_NAME='Sync backfill UID sequencer Scheduler heartbeat missing'
            LOG_FILTER='resource.type="cloud_run_revision" AND resource.labels.service_name="backend-sync" AND "event=sync_uid_sequencer action=sweep_summary outcome=done"'
            CONDITION_FILTER="metric.type=\"logging.googleapis.com/user/${METRIC}\" AND resource.type=\"cloud_run_revision\""
            CONDITION='absent'
            DURATION='600s'
          fi
          if gcloud logging metrics describe "$METRIC" --project=${{ inputs.project_id }} >/dev/null 2>&1; then
            gcloud logging metrics update "$METRIC" --project=${{ inputs.project_id }} --description="$DISPLAY_NAME" --log-filter="$LOG_FILTER"
          else
            gcloud logging metrics create "$METRIC" --project=${{ inputs.project_id }} --description="$DISPLAY_NAME" --log-filter="$LOG_FILTER"
          fi
          POLICY="$(gcloud monitoring policies list --project=${{ inputs.project_id }} --filter="displayName=\"${DISPLAY_NAME}\"" --format='value(name)')"
          if [[ "$POLICY" == *$'\n'* ]]; then
            echo "Duplicate ${DISPLAY_NAME} alert policies; reconcile manually" >&2
            exit 1
          fi
          if [[ -z "$POLICY" ]]; then
            POLICY="$(python3 "$DEPLOY_WORKFLOW_ROOT/.github/scripts/ensure_monitoring_metric_alert_policy.py" \
              --project='${{ inputs.project_id }}' \
              --display-name="$DISPLAY_NAME" \
              --metric-type="logging.googleapis.com/user/${METRIC}" \
              --condition-display-name="$DISPLAY_NAME" \
              --condition-filter="$CONDITION_FILTER" \
              --duration="$DURATION" \
              --comparison="$CONDITION" \
              --combiner=OR \
              --notification-channels="$ALERT_CHANNELS" \
              --documentation='The two-minute sync-backfill-uid-sequencer sweep failed or stopped. Admission and normal completion still dispatch; investigate crash recovery and pending age.')"
          fi
          test -n "$POLICY"
          if [[ "$KIND" == heartbeat ]]; then
            CONDITION_KIND=absent
            DURATION_SECONDS=600
          else
            CONDITION_KIND=threshold
            DURATION_SECONDS=600
          fi
          python3 "$DEPLOY_CONTROL_SCRIPTS/reconcile_sync_backfill_alert_policy.py" \
            --project='${{ inputs.project_id }}' --policy="$POLICY" \
            --display-name="$DISPLAY_NAME" --condition="$CONDITION_KIND" \
            --filter="$CONDITION_FILTER" --duration-seconds="$DURATION_SECONDS" \
            --channels="$ALERT_CHANNELS"
          gcloud monitoring policies describe "$POLICY" --project=${{ inputs.project_id }} --format=json \
            | python3 "$DEPLOY_CONTROL_SCRIPTS/verify_sync_backfill_alert_policy.py" \
                --condition="$CONDITION_KIND" --filter="$CONDITION_FILTER" \
                --duration-seconds="$DURATION_SECONDS" --channels="$ALERT_CHANNELS"
        done

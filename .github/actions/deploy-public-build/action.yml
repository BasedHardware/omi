name: Deploy public build
description: Build, validate, and promote one browser application through a Cloud Run candidate; existing services use no-traffic and first creates receive initial traffic.
inputs:
  target:
    description: Canonical public-build target name declared in config/public-build-contract.json.
    required: true
  environment:
    description: Deployment environment declared by the public-build contract.
    required: true
  project_id:
    description: Google Cloud project that owns the Cloud Run service.
    required: true
  gcp_credentials:
    description: Google Cloud credentials used only by the deploy actions.
    required: true
  service_account:
    description: Optional Cloud Run service identity supplied by the owning workflow.
    required: false
    default: ""
  runtime_env_vars:
    description: Optional newline-delimited runtime environment entries supplied by the owning workflow.
    required: false
    default: ""
  require_gateway_url:
    description: Require a non-empty HTTP(S) OMI_LLM_GATEWAY_URL in runtime_env_vars.
    required: false
    default: "false"
  network:
    description: Optional Cloud Run direct-VPC network required by internal services.
    required: false
    default: ""
  subnet:
    description: Optional Cloud Run direct-VPC subnet required by internal services.
    required: false
    default: ""
outputs:
  service:
    description: Cloud Run service deployed from the checked-in target contract.
    value: ${{ steps.contract.outputs.service }}
  region:
    description: Cloud Run region deployed from the checked-in target contract.
    value: ${{ steps.contract.outputs.region }}
  revision:
    description: Exact candidate revision promoted by this action; existing services start with no traffic and first creates receive initial traffic.
    value: ${{ steps.candidate.outputs.revision }}
  image:
    description: Immutable image reference promoted by this action.
    value: ${{ steps.candidate.outputs.image }}
runs:
  using: composite
  steps:
    - name: Resolve checked deployment contract
      id: contract
      shell: bash
      run: |
        set -euo pipefail
        contract=config/public-build-contract.json
        target='${{ inputs.target }}'
        environment='${{ inputs.environment }}'
        target_json="$(jq -ce --arg target "$target" '.targets[$target]' "$contract")"
        output_string() {
          local key="$1"
          local filter="$2"
          printf '%s=%s\n' "$key" "$(jq -er "$filter" <<<"$target_json")" >> "$GITHUB_OUTPUT"
        }
        output_string service '.service'
        output_string dockerfile '.dockerfile'
        output_string region '.deployment.region'
        output_string build_context '.deployment.build_context'
        {
          echo 'platforms<<EOF'
          jq -er '.deployment.platforms[]' <<<"$target_json"
          echo EOF
          printf 'flags=%s\n' "$(
            jq -r --arg env "$environment" '
              .deployment.flags as $flags
              | if ($flags | type) == "object" then [($flags[$env] // [])[]?] | join(" ")
                else [$flags[]?] | join(" ")
                end
            ' <<<"$target_json"
          )"
          echo 'runtime_secrets<<EOF'
          jq -r '.deployment.runtime_secrets | to_entries[]? | "\(.key)=\(.value)"' <<<"$target_json"
          echo EOF
          echo 'runtime_env_vars<<EOF'
          jq -r '(.deployment.runtime_env_vars // {}) | to_entries[]? | "\(.key)=\(.value)"' <<<"$target_json"
          echo EOF
          printf 'remove_runtime_secrets=%s\n' "$(
            jq -r '(.deployment.remove_runtime_secrets // []) | if length == 0 then "" else "--remove-secrets=" + join(",") end' \
              <<<"$target_json"
          )"
          printf 'remove_runtime_env_vars=%s\n' "$(
            jq -r '(.deployment.remove_runtime_env_vars // []) | if length == 0 then "" else "--remove-env-vars=" + join(",") end' \
              <<<"$target_json"
          )"
          # preserve_runtime_secrets are validated by the runtime preflight. The
          # explicit merge strategy below retains their live secret references.
        } >> "$GITHUB_OUTPUT"

    - name: Prepare reviewed public build inputs
      id: public-build
      uses: ./.github/actions/prepare-public-build
      with:
        target: ${{ inputs.target }}
        environment: ${{ inputs.environment }}

    - name: Google Auth
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ inputs.gcp_credentials }}

    - name: Preflight declared Cloud Run runtime
      id: runtime-preflight
      shell: bash
      run: |
        set -euo pipefail
        if [[ -n '${{ inputs.network }}' && -z '${{ inputs.subnet }}' ]] ||
           [[ -z '${{ inputs.network }}' && -n '${{ inputs.subnet }}' ]]; then
          echo "network and subnet must be supplied together" >&2
          exit 1
        fi
        if [[ '${{ inputs.require_gateway_url }}' == 'true' ]]; then
          gateway_url="$(printf '%s\n' '${{ inputs.runtime_env_vars }}' | sed -n 's/^OMI_LLM_GATEWAY_URL=//p')"
          if [[ ! "$gateway_url" =~ ^https?://[^[:space:]]+$ ]]; then
            echo "OMI_LLM_GATEWAY_URL must be a non-empty HTTP(S) URL when gateway mode is required" >&2
            exit 1
          fi
        fi
        python3 .github/scripts/preflight_public_build_runtime.py \
          --target "${{ inputs.target }}" \
          --project-id "${{ inputs.project_id }}" \
          --github-output "$GITHUB_OUTPUT" \
          --service-account "${{ inputs.service_account }}"

    - name: Fail closed for a production first create
      shell: bash
      run: |
        set -euo pipefail
        if [[ '${{ inputs.environment }}' != 'development' && '${{ steps.runtime-preflight.outputs.service_exists }}' != 'true' ]]; then
          echo "refusing to create a public Cloud Run service outside development" >&2
          exit 1
        fi

    - name: Compute immutable candidate identity
      id: candidate
      shell: bash
      run: |
        set -euo pipefail
        short_sha="${GITHUB_SHA::7}"
        revision_suffix="${short_sha}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        service='${{ steps.contract.outputs.service }}'
        {
          echo "sha=${GITHUB_SHA}"
          echo "short_sha=${short_sha}"
          echo "revision_suffix=${revision_suffix}"
          echo "revision=${service}-${revision_suffix}"
          echo "tag=public-${{ inputs.target }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "image=gcr.io/${{ inputs.project_id }}/${service}:${short_sha}"
        } >> "$GITHUB_OUTPUT"

    - name: Configure Docker authentication
      shell: bash
      run: gcloud auth configure-docker --quiet

    - name: Build and push immutable Docker image
      uses: docker/build-push-action@v7
      with:
        context: ${{ steps.contract.outputs.build_context }}
        file: ${{ steps.contract.outputs.dockerfile }}
        push: true
        platforms: ${{ steps.contract.outputs.platforms }}
        tags: ${{ steps.candidate.outputs.image }}
        build-args: |
          ${{ steps.public-build.outputs.build_args }}
          NEXT_PUBLIC_OMI_BUILD_SHA=${{ steps.candidate.outputs.sha }}

    - name: Deploy candidate revision
      uses: google-github-actions/deploy-cloudrun@v3
      with:
        service: ${{ steps.contract.outputs.service }}
        region: ${{ steps.contract.outputs.region }}
        image: ${{ steps.candidate.outputs.image }}
        # Cloud Run rejects --no-traffic when it creates a service. Development
        # first creates therefore receive the platform's initial traffic; every
        # existing service remains an isolated no-traffic candidate.
        no_traffic: ${{ steps.runtime-preflight.outputs.service_exists == 'true' }}
        flags: >-
          --revision-suffix=${{ steps.candidate.outputs.revision_suffix }}
          --tag=${{ steps.candidate.outputs.tag }}
          ${{ inputs.environment == 'development' && '--allow-unauthenticated' || '' }}
          ${{ inputs.service_account != '' && format('--service-account={0}', inputs.service_account) || '' }}
          ${{ inputs.network != '' && format('--network={0}', inputs.network) || '' }}
          ${{ inputs.subnet != '' && format('--subnet={0}', inputs.subnet) || '' }}
          ${{ inputs.network != '' && inputs.subnet != '' && '--vpc-egress=private-ranges-only' || '' }}
          ${{ steps.contract.outputs.remove_runtime_secrets }}
          ${{ steps.contract.outputs.remove_runtime_env_vars }}
          ${{ steps.contract.outputs.flags }}
        env_vars: |-
          ${{ steps.contract.outputs.runtime_env_vars }}
          ${{ inputs.runtime_env_vars }}
        env_vars_update_strategy: merge
        secrets: |-
          ${{ steps.contract.outputs.runtime_secrets }}
          ${{ steps.runtime-preflight.outputs.fallback_runtime_secrets }}
        secrets_update_strategy: merge

    - name: Promote browser-accepted candidate
      uses: ./.github/actions/public-build-candidate-promotion
      with:
        target: ${{ inputs.target }}
        environment: ${{ inputs.environment }}
        service: ${{ steps.contract.outputs.service }}
        project_id: ${{ inputs.project_id }}
        region: ${{ steps.contract.outputs.region }}
        revision: ${{ steps.candidate.outputs.revision }}
        tag: ${{ steps.candidate.outputs.tag }}
        sha: ${{ steps.candidate.outputs.sha }}

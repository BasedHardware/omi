name: Notify Telegram
description: Sends deployment status details to Telegram when notification credentials are configured.

inputs:
  telegram_bot_token:
    description: Telegram bot token used to send the notification.
    required: false
  telegram_chat_id:
    description: Telegram chat ID that receives the notification.
    required: false
  environment:
    description: Deployment environment to show in the Telegram message.
    required: true
  release_version:
    description: Optional release version to show in the Telegram message.
    required: false
    default: ''
  status:
    description: Deployment status to show in the Telegram message.
    required: true

runs:
  using: composite
  steps:
    - id: configuration
      name: Check Telegram notification configuration
      shell: bash
      env:
        TELEGRAM_BOT_TOKEN: ${{ inputs.telegram_bot_token }}
        TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
      run: bash "$GITHUB_ACTION_PATH/check-configuration.sh"

    - name: Set deploy status
      if: steps.configuration.outputs.enabled == 'true'
      shell: bash
      env:
        INPUT_STATUS: ${{ inputs.status }}
      run: |
        if [ "$INPUT_STATUS" == "success" ]; then
          echo "ICON=✅" >> $GITHUB_ENV
          echo "STATUS=Success" >> $GITHUB_ENV
        else
          echo "ICON=❌" >> $GITHUB_ENV
          echo "STATUS=Failed" >> $GITHUB_ENV
        fi

    - name: Notify Telegram
      if: steps.configuration.outputs.enabled == 'true'
      shell: bash
      env:
        TELEGRAM_BOT_TOKEN: ${{ inputs.telegram_bot_token }}
        TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
        RUN_NUMBER: ${{ github.run_number }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW: ${{ github.workflow }}
        REF_NAME: ${{ github.ref_name }}
        TRIGGER_ACTOR: ${{ github.actor }}
      run: |
        WORKFLOW_NAME="$WORKFLOW"
        ENVIRONMENT="$INPUT_ENVIRONMENT"
        DEPLOY_BRANCH="$REF_NAME"
        DEPLOY_TAG="${GITHUB_SHA::7}"
        [[ -n "$INPUT_RELEASE_VERSION" ]] && RELEASE_VERSION="$INPUT_RELEASE_VERSION" || RELEASE_VERSION="release-$(date +'%Y%m%d')-${RUN_NUMBER}"
        ACTOR="$TRIGGER_ACTOR"
        FINISH_TIME="$(date -u '+%Y-%m-%d %H:%M UTC')"
        GITHUB_URL="https://github.com/BasedHardware/omi"
        DEPLOY_SUMMARY_URL="${GITHUB_URL}/actions/runs/${RUN_ID}"
        MESSAGE="🚀 <b>$WORKFLOW_NAME</b>: $ICON $STATUS

        ⚡️ <b>Environment:</b> $ENVIRONMENT
        🌿 <b>Branch:</b> $DEPLOY_BRANCH
        📦 <b>Release version:</b> $RELEASE_VERSION
        🏷️ <b>Tag:</b> $DEPLOY_TAG
        👤 <b>Triggered by:</b> $ACTOR
        🕐 <b>Finished at:</b> $FINISH_TIME

        📝 <a href=\"$DEPLOY_SUMMARY_URL\">Deployment Summary</a>"

        curl -s --fail -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d parse_mode="HTML" \
          -d disable_web_page_preview=true \
          --data-urlencode text="$MESSAGE"

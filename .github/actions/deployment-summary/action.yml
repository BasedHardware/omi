name: Deployment Summary
description: Writes a deployment summary table to the GitHub Step Summary

inputs:
  environment:
    description: Deployment environment (e.g. development, prod)
    required: true
  status:
    description: Job status (success, failure, cancelled)
    required: true
  release_version:
    description: Optional release version
    required: false
    default: ''
  service:
    description: Name of the service being deployed (e.g. backend, pusher)
    required: true

runs:
  using: composite
  steps:
    - name: Write deployment summary
      shell: bash
      env:
        INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
        INPUT_SERVICE: ${{ inputs.service }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_STATUS: ${{ inputs.status }}
        RUN_NUMBER: ${{ github.run_number }}
        WORKFLOW: ${{ github.workflow }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        [[ -n "$INPUT_RELEASE_VERSION" ]] && RELEASE_VERSION="$INPUT_RELEASE_VERSION" || RELEASE_VERSION="release-$(date +'%Y%m%d')-${RUN_NUMBER}"
        SERVICE="$INPUT_SERVICE"
        WORKFLOW_NAME="$WORKFLOW"
        ENVIRONMENT="$INPUT_ENVIRONMENT"
        DEPLOY_BRANCH="$REF_NAME"
        DEPLOY_TAG="${GITHUB_SHA::7}"
        STATUS="$INPUT_STATUS"

        {
          echo "### Deployment Summary"
          echo ""
          echo "| Service | $SERVICE |"
          echo "|---|---|"
          echo "| **Name** | $WORKFLOW_NAME |"
          echo "| **Environment** | \`$ENVIRONMENT\` |"
          echo "| **Release version** | \`$RELEASE_VERSION\` |"
          echo "| **Branch** | \`$DEPLOY_BRANCH\` |"
          echo "| **Tag** | \`$DEPLOY_TAG\` |"
          [[ $STATUS == "success" ]] && echo "| **Status** | ${STATUS^} ✅ |" || echo "| **Status** | ${STATUS^} ❌ |"
        } >> "$GITHUB_STEP_SUMMARY"

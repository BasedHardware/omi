<content>
# This file lists all checks that should be run on the repository.
# Each check should have a unique name and a command to run it.
# The command will be executed in the root directory of the repository.

checks:
  - name: python-lint
    command: |
      python -m flake8 plugins/omi-arxiv-app
    level: error

  - name: arxiv-limit-and-author-coercion-tests
    command: |
      python -m unittest plugins/omi-arxiv-app/test_limit_and_author_coercion.py
    level: error
</content>
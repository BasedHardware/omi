self-hosted-runner:
  labels:
    - macos
    # GitHub-hosted public preview label; actionlint's built-in list lags the image rollout.
    - xcode-27

config-variables: null

paths:
  ".github/workflows/ui-author-approval.yml":
    ignore:
      # GitHub supports concurrency.queue; actionlint 1.7.12 does not.
      # https://github.com/rhysd/actionlint/issues/657
      - '^unexpected key "queue" for "concurrency" section\.'

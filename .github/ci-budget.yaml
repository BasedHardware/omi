  "workflows": {
    "backend-checks.yml": {
      "name": "Backend Checks",
      "owner": "CI maintainers",
      "rationale": "Initial workflow inventory P18 adds one daily reusable nightly call; PR triggers and test commands stay unchanged.",
      "triggers": {
        "pull_request": {
          "branches": "main"
        },
        "push": {
          "branches": "main"
        },
        "workflow_call": {
          "inputs": {
            "nightly_main_sha": {
              "default": "",
              "description": "Main SHA pinned by the unfiltered nightly caller",
              "required": "false",
              "type": "string"
            }
          }
        }
      }
    },
    "backend-edge.yml": {
      "name": "Backend Edge (Rust)",
      "owner": "Backend realtime (plan D listen-edge)",
      "rationale": "2026-10-21 D1: build, clippy and test for the listen-edge Rust crate only on backend/edge/** changes; workflow change named by David 2026-10-20 P18 adds one daily reusable nightly call; PR triggers and test commands stay unchanged.",
      "triggers": {
        "pull_request": {
          "paths": [
            "backend/edge/**",
            ".github/workflows/backend-edge.yml"
          ]
        },
        "push": {
          "branches": [
            "main"
          ],
          "paths": [
            "backend/edge/**",
            ".github/workflows/backend-edge.yml"
          ]
        },
        "workflow_call": {
          "inputs": {
            "nightly_main_sha": {
              "default": "",
              "description": "Main SHA pinned by the unfiltered nightly caller",
              "required": "false",
              "type": "string"
            }
          }
        }
      }
    },
    "backend-emulator-proofs.yml": {
      "name": "Backend Emulator Proofs",
      "owner": "CI maintainers",
      "rationale": "Run canonical-memory and task recovery proofs when their production owners, runner or direct emulator tests change; the two task-test paths close the unexecuted recovery/expiry guard gap. P18 adds one daily reusable nightly call; PR triggers and test commands stay unchanged.",
      "triggers": {
        "pull_request": {
          "paths": [
            "backend/utils/memory/**",
            "backend/database/**",
            "backend/models/memory_apply.py",
            "backend/models/daily_sweep_dispatch.py",
            "backend/utils/llm/memories.py",
            "backend/models/product_memory.py",
            "backend/scripts/*_emulator_test.py",
            "backend/scripts/run-emulator-proofs.sh",
            "backend/tests/integration/test_summary_task_promotion_emulator.py",
            "backend/tests/integration/test_candidate_accept_expiry_emulator.py",
            "backend/pylock.toml",
            "firebase.json",
            "firestore.rules",
            ".github/workflows/backend-emulator-proofs.yml"
          ]
        },
        "push": {
          "branches": [
            "main"
          ],
          "paths": [
            "backend/utils/memory/**",
            "backend/database/**",
            "backend/models/memory_apply.py",
            "backend/models/daily_sweep_dispatch.py",
            "backend/utils/llm/memories.py",
            "backend/models/product_memory.py",
            "backend/scripts/*_emulator_test.py",
            "backend/scripts/run-emulator-proofs.sh",
            "backend/tests/integration/test_summary_task_promotion_emulator.py",
            "backend/tests/integration/test_candidate_accept_expiry_emulator.py",
            "backend/pylock.toml",
            "firebase.json",
            "firestore.rules",
            ".github/workflows/backend-emulator-proofs.yml"
          ]
        },
        "workflow_call": {
          "inputs": {
            "nightly_main_sha": {
              "default": "",
              "description": "Main SHA pinned by the unfiltered nightly caller",
              "required": "false",
              "type": "string"
            }
          }
        }
      }
    },
    "backend-hermetic-e2e.yml": {
      "name": "Backend Hermetic E2E",
      "owner": "CI maintainers",
      "rationale": "Initial workflow inventory P18 adds one daily reusable nightly call; PR triggers and test commands stay unchanged.",
      "triggers": {
        "merge_group": {
          "types": [
            "checks_requested"
          ]
        },
        "pull_request": {
          "branches": "main"
        },
        "push": {
          "branches": "main"
        },
        "schedule": [
          {
            "cron": "53 4 * * *"
          }
        ],
        "workflow_call": {
          "inputs": {
            "nightly_main_sha": {
              "default": "",
              "description": "Main SHA pinned by the unfiltered nightly caller",
              "required": "false",
              "type": "string"
            }
          }
        },

    "gcp_diarizer.yml": {
      "name": "Deploy Diarizer to GKE",
      "owner": "CI maintainers",
      "rationale": "B5 prod-train lock and worker digest promotion (2026-10-19): break_glass_lock and image_digest dispatch inputs added. 2026-10-24: diarizer-batch service option added so the prod-omi-diarizer-batch Helm release has a CI deploy path (W1); triggers otherwise unchanged; SCA-2149 adds opt-in preserve_live_worker and admitted worker_live_baseline dispatch inputs; manual-only trigger and runner unchanged; SCA-2160 adds the guarded worker_rollback_receipt dispatch input; rollback reuses the existing prod environment and shared writer; SCA-2944 (David 2026-11-19) adds the worker_dry_run input: a server-dry-run-only preserve-live run under the same prod-train lock that never writes, builds or pushes; SCA-3276 adds a production-only depth mode with separate manual plan and apply dispatches under the existing prod-train lock. Both use the same deploy job and runner. There are no new automatic triggers.",
      "triggers": {
        "workflow_dispatch": {
          "inputs": {
            "branch": {
              "default": "main",
              "description": "Branch to deploy from",
              "required": "true"
            },
            "break_glass_lock": {
              "default": "false",
              "description": "Break-glass: skip the shared prod-train lock (still serialized per target; the actor is recorded)",
              "required": "false",
              "type": "boolean"
            },
            "depth_operation": {
              "default": "plan",
              "description": "Worker depth mode only: server rehearsal (plan), or rehearse and roll (apply)",
              "options": [
                "plan",
                "apply"
              ],
              "type": "choice"
            },
            "environment": {
              "default": "development",
              "description": "Select the environment to deploy to",
              "options": [
                "development",
                "prod"
              ],
              "required": "true",
              "type": "choice"
            },
            "expected_current_depth": {
              "description": "Worker depth mode only: live literal depth (3 or 4)",
              "type": "string"
            },
            "expected_worker_digest": {
              "description": "Worker depth mode only: exact serving sha256 digest",
              "type": "string"
            },
            "expected_worker_resource_version": {
              "description": "Worker depth mode only: live primary Deployment resourceVersion",
              "type": "string"
            },
            "expected_worker_uid": {
              "description": "Worker depth mode only: live primary Deployment UID",
              "type": "string"
            },
            "image_digest": {
              "default": "",
              "description": "batch-pipeline-worker only: deploy this already-built gcr.io digest (sha256:...) instead of rebuilding; its omi.release.tree label must equal the source tree",
              "required": "false"
            },
            "mode": {
              "default": "standard",
              "description": "Use worker-depth-only for a production batch worker depth CAS",
              "options": [
                "standard",
                "worker-depth-only"
              ],
              "type": "choice"
            },
            "preserve_live_worker": {
              "default": "false",
              "description": "Prod batch-pipeline-worker only: CAS image-only update, preserving the entire live runtime spec; siblings are verified but never rolled",
              "required": "false",
              "type": "boolean"
            },
            "release_version": {
              "default": "",
              "description": "Release version (optional)",
              "required": "false"
            },
            "service": {
              "default": "diarizer",
              "description": "Select the GPU service to deploy",
              "options": [
                "diarizer",
                "diarizer-batch",
                "batch-pipeline-worker"
              ],
              "required": "true",
              "type": "choice"
            },
            "target_depth": {
              "description": "Worker depth mode only: target literal depth (3 or 4)",
              "type": "string"
            },
            "worker_dry_run": {
              "default": "false",
              "description": "Preserve-live only, under the shared lock; never writes, builds or pushes. Without a rollback receipt: forward admission plus a no-op prior-image admission (inverse not verified). With worker_rollback_receipt: server dry-run of the real inverse CAS",
              "required": "false",
              "type": "boolean"
            },
            "worker_live_baseline": {
              "default": "",
              "description": "Preserve-live only: admitted JSON from worker_image_only.py inventory (target identity/spec hash and all shared-image consumer bindings)",
              "required": "false"
            },
            "worker_rollback_receipt": {
              "default": "",
              "description": "Preserve-live rollback only: saved safe receipt; requires its exact prior digest and full merged source SHA at or above f3902ec",
              "required": "false"
            }
          }
        }
      }
    },

    "firestore_read_reconcile.yml": {
      "name": "Firestore read ledger reconcile",
      "owner": "CI maintainers",
      "rationale": "Daily read-only reconcile of billed Firestore read ops against the in-process ledger. Schedule plus manual dispatch. 2026-10-07: job bound to the new no-approval cron environment (prod WIF condition also accepts assertion.environment == 'cron') and default scored day moved to D-2 for a settled bill; trigger input description updated accordingly. Does not deploy or change audit config.",

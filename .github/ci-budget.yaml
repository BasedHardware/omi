      "rationale": "Manual-only backend deploy workflow. 2026-10-20 adds mode=build-only (image build and push, no deploy) alongside deploy and repair-traffic-only; no automatic trigger.. 2026-10-21 plan B B2 (named by David 2026-10-21): service_images input for mode=deploy role-image opt-in, and build-only also publishes the role images (build-role-images job). B5 (2026-10-19) adds the break_glass_lock dispatch input. 2026-10-26 dispatchtag adds the required requested_by dispatch input. 2026-11-15 SCA-2225: typed Cloud Run service selection narrows the existing manual deploy route; global serialization, schedule, jobs, runners, matrix, expected frequencies and global caps remain unchanged; job p50 forecasts are conservatively updated below for the dispatch-input inventory rule. No parallel activation or dispatch-frequency increase is authorized. 2026-11-16 David-approved operator-qualify-publish mode extends this existing manual-only workflow; no automatic or PR trigger added. The one-minute budget headroom change satisfies the reviewed dispatch-input inventory boundary; it is planning allowance, not observed extra runtime. Existing job conditions and forecast run counts are unchanged. 2026-11-19 SCA-3120 (David-approved .github change): the cloud_run_service choice gains the explicit-only backend-projection-pump selection, served by the new deploy-projection-pump job; the stack deploy job skips it and `all` still expands to the four existing services. Conservative +1-minute p50 forecast for the changed dispatch surface per the SCA-2225 convention; frequencies, timeouts, runners, caps and activation of existing jobs are unchanged. SCA-3120 recovery adds manual inputs for the reviewed pump control SHA and Release disposition. The dispatch-input inventory uses the existing one-minute p50 planning allowance per job. SCA-3318 adds a one-time manual pump-only recovery mode. No automatic or PR trigger. 2026-11-20 SCA-2225 adds the admitted rollback revision to named manual deploys. The CI inventory carries the existing one-minute dispatch-input planning allowance. Job frequencies, execution ceilings, runners, and caps are unchanged. SCA-3549 adds a manual production workerd image-only mode using the existing normal release admission and protected prod environment. 2026-11-24 SCA-3883: mode=workerd-install and mode=workerd-rollback, the CI route for the prod workerd chart (migrate, helm install bound to the release identity, rollout and /ready checks, helm rollback). SCA-4395 adds a manual build-only release_branch input while keeping the main dispatch ref. One minute of p50 planning headroom per job follows the existing dispatch-input inventory convention. Job frequencies, caps, and execution limits stay at their existing values. SCA-5006 adds two opt-in inputs to the existing manual Backend deploy for the bound split plan. The guarded deploy can hold the existing runner through its settled comparison windows. The operator route remains qualification-gated. SCA-4897 adds the approved one-off manual app-icon containment probe. Existing jobs carry one minute of planning headroom for the dispatch-input inventory change.",
      "triggers": {
        "workflow_dispatch": {
          "inputs": {
            "app_icon_candidate_revision": {
              "default": "",

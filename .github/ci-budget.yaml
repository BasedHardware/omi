      "rationale": "Existing main/manual workflow validates alert sources as well as dashboards, selects one environment, and requires explicit protected prod dispatch for alerts and the Ops boards; every push to main that matches the trigger paths applies prod Ops dashboards through provision-prod-ops-dashboards (prod MONITOR_GRAFANA_TOKEN from the grafana-dashboards-prod environment with no required reviewers, approved by David 2026-11-09); the Business TV boards apply from the same no-reviewer job once BUSINESS_GRAFANA_TOKEN is added to the grafana-dashboards-prod environment and stay on the gated prod path until then (David 2026-11-12); the prod-only Business API step reuses the existing job, no new workflow or PR matrix. #24942 adds the omi-tv-funnel.json path and allowlist entry; push runs resolve to dev, and the prod alert step is dispatch-gated.",
      "triggers": {
        "push": {
          "branches": [
            "main"
          ],
          "paths": [
            "backend/charts/monitoring/dashboards/**",
            "backend/charts/monitoring/alerts/**",
            "backend/charts/monitoring/alert-rules.json",
            "backend/scripts/provision_monitoring_alerts.py",
            "backend/scripts/provision_grafana_dashboards.py",
            ".github/workflows/grafana_dashboard_provisioning.yml",
            ".github/scripts/provision_grafana_dashboards.py",
            ".github/scripts/grafana_business.py",
            "web/admin/grafana/dashboards/omi-tv-v2.json",
            "web/admin/grafana/dashboards/omi-tv-funnel.json"
          ]
        },
        "workflow_dispatch": {
          "inputs": {
            "environment": {
              "default": "prod",
              "description": "Select the Grafana to provision",
              "options": [
                "prod",
                "dev"
              ],
              "required": "true",
              "type": "choice"
            }
          }
        }
      }
    },

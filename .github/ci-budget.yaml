    "mobile_daily_train.yml": {
      "name": "Mobile daily train",
      "owner": "CI maintainers",
      "rationale": "Daily mobile train dispatch is owned by the operator-side release gate (audits candidates against the live baseline, dispatches only on a green verdict; see .github/agent-docs/mobile-release-process.md). The fixed 14:00 UTC schedule was removed 2026-10-14 so an ungated train can no longer fire on a bad candidate; manual workflow_dispatch (dry_run) remains. 2026-10-14: optional pin_ios/pin_android dispatch inputs carry the gate's audited candidate identifiers; they add no runs (same single gated dispatch per day). 2026-10-20: optional capture_health_override input lets one run's rollout hops past a capture-health HOLD (rare manual dispatch).",
      "triggers": {
        "workflow_dispatch": {
          "inputs": {
            "capture_health_override": {
              "default": "",
              "description": "Reason to let THIS run's rollout hops past a capture-health HOLD (mobile_capture_health.py); empty = no override",
              "type": "string"
            },
            "dry_run": {
              "default": "false",
              "description": "Read store state and print the plan without submitting or drafting",
              "type": "boolean"
            },
            "pin_android": {
              "default": "",
              "description": "Audited Android candidate (X.Y.Z/build, or none = audited no-candidate) from the operator release gate; empty = no pin",
              "type": "string"
            },
            "pin_ios": {
              "default": "",
              "description": "Audited iOS candidate (X.Y.Z/build, or none = audited no-candidate) from the operator release gate; empty = no pin",
              "type": "string"
            }
          }
        }
      }
    },

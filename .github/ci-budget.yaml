    "mobile_rollout_watch.yml": {
      "name": "Mobile rollout watch",
      "owner": "CI maintainers",
      "rationale": "Intraday half of the self-driving mobile release lane (see .github/agent-docs/mobile-release-process.md): every 4h dispatches the Codemagic mobile-rollout-advance workflow, which moves only ALREADY-RELEASED rollouts along the agreed 12h exposure profile (iOS phased jump to 100% after its 12h observation window, Android staged ladder hop 1->10->50->100% per 4h window). Dispatch-only ubuntu runner (~seconds), no build; 2026-10-17, operator-approved posture. 2026-10-20: manual workflow_dispatch with a capture_health_override input for a one-shot advance past a capture-health HOLD. 2026-11-15: a frozen ladder now fails the scheduled run instead of reporting a green no-op, and a gate_freeze_override input is the documented recovery path when the dispatcher is paused on purpose.",
      "triggers": {
        "schedule": [
          {
            "cron": "0 1,5,9,13,17,21 * * *"
          }
        ],
        "workflow_dispatch": {
          "inputs": {
            "capture_health_override": {
              "default": "",
              "description": "Reason to advance past a capture-health HOLD for this run only; empty = no override",
              "type": "string"
            },
            "gate_freeze_override": {
              "default": "",
              "description": "Reason to advance although no daily train succeeded in the last 26h; empty = stay frozen",
              "type": "string"
            }
          }
        }
      }
    },

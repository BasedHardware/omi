# Modes (workflow_dispatch input `mode`):
#   deploy               Build, admit, and promote the backend stack for an exact,
#                        Release Eligibility-proven main SHA (release_sha).
#   build-only           Same boundary validation, Release Eligibility admission,
#                        and break-glass audit as deploy, then build, smoke, and push
#                        gcr.io/<project>/backend:<sha7> only. It deploys nothing: no
#                        Cloud Run, GKE, traffic, or runtime env change, and it never
#                        moves :latest or re-pushes an existing <sha7> tag. Use it so
#                        gcp_backend_listen_helm.yml image_tag=<sha7> can roll a
#                        listen-only fix without a full backend train. The push runs
#                        in the same GitHub Environment as deploy, so the prod
#                        registry keeps the prod approval and WIF binding.
#   workerd-image-only  Publish only the admitted prod workerd image.
#   workerd-install     Migrate and helm-install prod workerd at workerd_digest from the admitted
#                       SHA. Refuses unless release-identity.sh prints exactly workerd_identity.
#   workerd-rollback    helm rollback prod workerd to workerd_helm_revision.
#   repair-traffic-only  Restore Cloud Run traffic to the serving revisions.
#   recover-pump-cap    SCA-3318 one-time service-level cap correction on the dark pump.

name: Deploy Backend to Cloud RUN

run-name: >-
  ${{ inputs.selected_split_binding && format('Holdback {0}/{1} sha={2} by {3} plan={4}',
    inputs.environment, inputs.cloud_run_service, inputs.release_sha, inputs.requested_by, inputs.selected_split_binding) ||
    inputs.selected_rollback_revision && format('Select {0}/{1}/{2} sha={3} lock={4} img={5} elig={6} by {7} inverse={8}',
    inputs.environment, inputs.mode, inputs.cloud_run_service, inputs.release_sha,
    github.event.inputs.break_glass_lock == 'true' && 'break-glass' || 'prod-train',
    inputs.service_images == '' && 'default' || 'override',
    github.event.inputs.skip_eligibility_proof == 'true' && 'bypass' || 'proof',
    inputs.requested_by, inputs.selected_rollback_revision) ||
    format('Deploy Backend ({0} {1} service={2} source={3} lock={4} images={5} eligibility={6}) by {7}',
      inputs.environment || github.event_name,
      inputs.mode || github.event_name,
      inputs.cloud_run_service || 'all',
      inputs.release_sha || '',
      github.event.inputs.break_glass_lock == 'true' && 'break-glass' || 'prod-train',
      inputs.service_images == '' && 'default' || 'override',
      github.event.inputs.skip_eligibility_proof == 'true' && 'bypass' || 'proof',
      inputs.requested_by || github.actor) }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - prod
      requested_by:
        description: 'lane label or session that requested this dispatch (e.g. op1, train:<name>)'
        required: true
        type: string
      release_sha:
        description: 'Exact SHA with a successful Release Eligibility proof (main by default)'
        required: false
        default: ''
      release_branch:
        description: 'Build-only from main: release/* source branch whose current head equals release_sha'
        required: false
        default: ''
      release_version:
        description: 'Release version (optional)'
        required: false
        default: ''
      mode:
        description: 'Workflow mode'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - build-only
          - workerd-image-only
          - workerd-install
          - workerd-rollback
          - repair-traffic-only
          - operator-qualify-publish
          - recover-pump-cap
      deploy_targets:
        description: 'Deploy all backend surfaces or Cloud Run only'
        required: true
        default: 'cloud-run-only'
        type: choice
        options:
          - all
          - cloud-run-only
      cloud_run_service:
        description: 'Cloud Run deploy target; all retains the existing four-service path; backend-projection-pump is explicit-only (SCA-3120)'
        required: false
        default: 'all'
        type: choice
        options: [all, backend, backend-sync, backend-sync-backfill, backend-integration, backend-projection-pump]
      selected_rollback_revision:
        description: 'Named standard deploy only. Exact revision admitted at 100% serving before dispatch.'
        required: false
        default: ''
      selected_split_plan:
        description: 'Named production deploy only. Canonical hold-back plan.'
        required: false
        default: ''
        type: string
      selected_split_binding:
        description: 'SHA-256 of selected_split_plan.'
        required: false
        default: ''
        type: string
      deploy_gateway:
        description: 'Development only: deploy the LLM gateway binary with the backend stack (requires deploy_targets=all)'
        required: true
        default: false
        type: boolean
      # Plan B B2 opt-in; blank changes nothing. See backend/docs/runbooks/role-image-cutover.md.
      service_images:
        description: 'mode=deploy only: service=<role image>@sha256 pairs from a build-only run of this release_sha (blank = every service keeps its current image)'
        required: false
        default: ''
      pump_control_sha:
        description: 'Projection pump only. Full reviewed SHA of the workflow and deploy controls on main.'
        required: false
        default: ''
      pump_release_disposition:
        description: 'Existing projection pump only. Release comment UUID, serving revision, source SHA, digest-pinned image (space-separated).'
        required: false
        default: ''
      pump_recovery_etag:
        description: 'SCA-3318 cap recovery only. Fresh Cloud Run v2 service etag from Release readback.'
        required: false
        default: ''
      workerd_digest:
        description: 'workerd-install only. sha256 digest of gcr.io/based-hardware/workerd to install.'
        required: false
        default: ''
      workerd_identity:
        description: 'workerd-install only. Exact release-identity.sh JSON object the RELEASE_GO names.'
        required: false
        default: ''
      workerd_helm_revision:
        description: 'workerd-rollback only. Helm revision of prod-omi-workerd to restore.'
        required: false
        default: ''
      # Break-glass: the eligibility proof requires a *successful* Release
      # Eligibility push-run on this exact SHA. A flaky or red check therefore
      # poisons that SHA permanently -- rerunning does not retroactively make
      # the original run succeed, so the only other recovery is pushing a new
      # commit to main and waiting for a full green run. That is unacceptable
      # for a hotfix, so this hatch exists.
      #
      # It does NOT relax the property that matters: the SHA must still be an
      # ancestor of main, so unreviewed code can never reach production.
      skip_eligibility_proof:
        description: 'Break-glass: deploy without a Release Eligibility proof (still requires a merged main SHA)'
        required: false
        default: false
        type: boolean
      break_glass_confirm:
        description: 'Type deploy-without-proof when skip_eligibility_proof is set'
        required: false
        default: ''
      break_glass_reason:
        description: 'Why the eligibility proof is unavailable (required with skip_eligibility_proof)'
        required: false
        default: ''
      break_glass_lock:
        description: 'Break-glass: skip the shared prod-train lock (still serialized per target; the actor is recorded)'
        required: false
        default: false
        type: boolean

# Cloud Run revision promotion/traffic repair and the shared backend GKE resources
# are one environment-scoped mutation domain across the backend deploy workflows.
# B5 (named by David, 2026-10-19 fourth round #9): every prod deploy writer shares the
# prod-train lock, so trains, config-trains and GPU/listen deploys never overlap and the
# ramp controller can refuse while one runs (backend/scripts/prod_train_lock.py).
# Break-glass keeps the pre-B5 per-target lock. Development groups are unchanged.
concurrency:
  group: ${{ github.event.inputs.environment == 'prod' && github.event.inputs.break_glass_lock != 'true' && 'prod-train' || format('deploy-backend-stack-{0}', github.event.inputs.environment) }}
  cancel-in-progress: false

env:
  # Abort a git HTTP transfer that stays under 1 KB/s for 60 s, so actions/checkout
  # retries instead of hanging 7-10 min until the TCP reset (#22890).
  GIT_HTTP_LOW_SPEED_LIMIT: "1000"
  GIT_HTTP_LOW_SPEED_TIME: "60"
  SERVICE: backend
  REGION: us-central1
  # Development keeps its existing tagged no-traffic candidate probe. Production
  # instead validates the exact serving release after its rollback-safe shift.
  TRANSCRIPTION_CANDIDATE_TAG: stt-gate-${{ github.run_id }}-${{ github.run_attempt }}
  CLOUD_RUN_VPC_NETWORK: ${{ vars.CLOUD_RUN_VPC_NETWORK }}
  CLOUD_RUN_VPC_SUBNET: ${{ vars.CLOUD_RUN_VPC_SUBNET }}
  CONVERSATION_SUMMARIZED_APP_IDS: ${{ vars.CONVERSATION_SUMMARIZED_APP_IDS }}
  GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
  GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
  LLM_GATEWAY_GSA: ${{ vars.LLM_GATEWAY_GSA }}
  MCP_AUTHORIZATION_SERVER_URL: ${{ vars.MCP_AUTHORIZATION_SERVER_URL }}
  MCP_OAUTH_CHATGPT_CLIENT_ID: ${{ vars.MCP_OAUTH_CHATGPT_CLIENT_ID }}
  MCP_OAUTH_CHATGPT_REDIRECT_URIS: ${{ vars.MCP_OAUTH_CHATGPT_REDIRECT_URIS }}
  MCP_OAUTH_CLAUDE_CLIENT_ID: ${{ vars.MCP_OAUTH_CLAUDE_CLIENT_ID }}
  MCP_OAUTH_CLAUDE_CLIENT_NAME: ${{ vars.MCP_OAUTH_CLAUDE_CLIENT_NAME }}
  MCP_OAUTH_CLAUDE_REDIRECT_URIS: ${{ vars.MCP_OAUTH_CLAUDE_REDIRECT_URIS }}
  MCP_OAUTH_PUBLIC_CLIENT_ID: ${{ vars.MCP_OAUTH_PUBLIC_CLIENT_ID }}
  MCP_OAUTH_PUBLIC_REDIRECT_URIS: ${{ vars.MCP_OAUTH_PUBLIC_REDIRECT_URIS }}
  MCP_RESOURCE_URL: ${{ vars.MCP_RESOURCE_URL }}
  PUBLIC_SHARED_CONVERSATION_CHAT_FRONTEND_AUDIENCE: ${{ vars.PUBLIC_SHARED_CONVERSATION_CHAT_FRONTEND_AUDIENCE }}
  PUBLIC_SHARED_CONVERSATION_CHAT_FRONTEND_INVOKER_SA: ${{ vars.PUBLIC_SHARED_CONVERSATION_CHAT_FRONTEND_INVOKER_SA }}
  RAPID_API_HOST: ${{ vars.RAPID_API_HOST }}
  REDIS_DB_HOST: ${{ vars.REDIS_DB_HOST }}
  STT_PRERECORDED_MODEL: ${{ vars.STT_PRERECORDED_MODEL }}
  STT_SERVICE_MODELS: ${{ vars.STT_SERVICE_MODELS }}
  SYNC_LEDGER_FENCE_MODE: ${{ vars.SYNC_LEDGER_FENCE_MODE || 'legacy' }}
  TYPESENSE_HOST: ${{ vars.TYPESENSE_HOST }}
  TWILIO_ACCOUNT_SID: ${{ vars.TWILIO_ACCOUNT_SID }}
  TWILIO_API_KEY_SID: ${{ vars.TWILIO_API_KEY_SID }}
  TWILIO_TWIML_APP_SID: ${{ vars.TWILIO_TWIML_APP_SID }}
  X_OAUTH_CLIENT_ID: ${{ vars.X_OAUTH_CLIENT_ID }}
  X_OAUTH_REDIRECT_URI: ${{ vars.X_OAUTH_REDIRECT_URI }}

jobs:
  validate-production-boundary:
    outputs:
      integration_only: ${{ steps.boundary.outputs.integration_only }}
      integration_image: ${{ steps.boundary.outputs.integration_image }}
      post_wrap_guard: ${{ steps.boundary.outputs.post_wrap_guard }}
      rollback_revision: ${{ steps.boundary.outputs.rollback_revision }}
    if: >-
      github.event.inputs.mode == 'deploy' ||
      github.event.inputs.mode == 'build-only' ||
      github.event.inputs.mode == 'workerd-image-only' ||
      github.event.inputs.mode == 'workerd-install' ||
      github.event.inputs.mode == 'workerd-rollback' ||
      github.event.inputs.mode == 'recover-pump-cap'
    runs-on: ubuntu-latest
    steps:
      - name: Reject unsupported production deployment boundary before side effects
        if: inputs.mode != 'recover-pump-cap'
        id: boundary
        env:
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment }}
          DEPLOY_TARGETS: ${{ github.event.inputs.deploy_targets }}
          WORKFLOW_MODE: ${{ github.event.inputs.mode }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
          CLOUD_RUN_SERVICE: ${{ github.event.inputs.cloud_run_service || 'all' }}
          SERVICE_IMAGES: ${{ github.event.inputs.service_images }}
          SELECTED_ROLLBACK_REVISION: ${{ inputs.selected_rollback_revision }}
          SELECTED_SPLIT_PLAN: ${{ inputs.selected_split_plan }}
          SELECTED_SPLIT_BINDING: ${{ inputs.selected_split_binding }}
          REQUESTED_BY: ${{ github.event.inputs.requested_by }}
          RELEASE_SHA: ${{ github.event.inputs.release_sha }}
          SKIP_ELIGIBILITY: ${{ github.event.inputs.skip_eligibility_proof }}
          BREAK_GLASS_LOCK: ${{ github.event.inputs.break_glass_lock }}
          PUMP_CONTROL_SHA: ${{ inputs.pump_control_sha }}
          PUMP_RELEASE_DISPOSITION: ${{ inputs.pump_release_disposition }}
          WORKFLOW_CONTROL_SHA: ${{ github.workflow_sha }}
          DEPLOY_GATEWAY: ${{ github.event.inputs.deploy_gateway }}
        run: |
          set -euo pipefail
          # Reserved digest caller format: train-digest-v1:<workflow-sha>:<requester>.
          if [[ "$WORKFLOW_MODE" == deploy &&
                ( "${REQUESTED_BY:-}" == train-digest-v1 || "${REQUESTED_BY:-}" == train-digest-v1:* ) ]]; then
            if [[ ! "$REQUESTED_BY" =~ ^train-digest-v1:([0-9a-f]{40}):[a-zA-Z0-9_.@/-]+$ ]]; then
              echo '::error::Digest promotion requires the verified workflow commit and requester.' >&2
              exit 1
            fi
            promotion_control_sha=${BASH_REMATCH[1]}
            if [[ "$promotion_control_sha" == 0000000000000000000000000000000000000000 ||
                  "$promotion_control_sha" != "$WORKFLOW_CONTROL_SHA" ||
                  "$promotion_control_sha" != "$GITHUB_SHA" ]]; then
              echo '::error::Digest promotion requires the verified workflow commit.' >&2
              exit 1
            fi
            if [[ "$DEPLOY_ENVIRONMENT" != prod || "$DEPLOY_TARGETS" != cloud-run-only ||
                  "$CLOUD_RUN_SERVICE" != all || "$SERVICE" != backend || "$DEPLOY_GATEWAY" != false ||
                  -n "$SERVICE_IMAGES" || -n "$SELECTED_ROLLBACK_REVISION" ||
                  "$SKIP_ELIGIBILITY" != false || "$BREAK_GLASS_LOCK" != false ]]; then
              echo '::error::Digest promotion requires the four-service Cloud Run scope and normal admission.' >&2
              exit 1
            fi
          fi
          if [[ -n "${RELEASE_BRANCH:-}" && "$WORKFLOW_MODE" != "build-only" ]]; then
            echo "release_branch applies only to mode=build-only." >&2
            exit 1
          fi
          CLOUD_RUN_SERVICE="${CLOUD_RUN_SERVICE:-all}"
          SELECTED_ROLLBACK_REVISION="${SELECTED_ROLLBACK_REVISION:-}"
          case "$CLOUD_RUN_SERVICE" in all|backend|backend-sync|backend-sync-backfill|backend-integration|backend-projection-pump) ;; *) exit 1 ;; esac
          if [[ "$CLOUD_RUN_SERVICE" != all ]]; then
            [[ "$WORKFLOW_MODE" == deploy && "$DEPLOY_TARGETS" == cloud-run-only && "$DEPLOY_ENVIRONMENT" == prod && "$BREAK_GLASS_LOCK" != true && "$SKIP_ELIGIBILITY" != true ]] || exit 1
          fi
          # SCA-3120: the projection pump ships the admitted fat image only, never a role-image opt-in.
          if [[ "$CLOUD_RUN_SERVICE" == backend-projection-pump ]]; then
            if [[ -n "${SERVICE_IMAGES//[[:space:],]/}" ]]; then
              echo 'backend-projection-pump takes no service_images.' >&2
              exit 1
            fi
            if [[ ! "$PUMP_CONTROL_SHA" =~ ^[0-9a-f]{40}$ ||
                  "$PUMP_CONTROL_SHA" != "$WORKFLOW_CONTROL_SHA" ||
                  "$WORKFLOW_CONTROL_SHA" != "$GITHUB_SHA" ]]; then
              echo 'backend-projection-pump requires the reviewed workflow control SHA.' >&2
              exit 1
            fi
            # Publish the actual inputs before the prod environment approval so the
            # approver can compare the recovery disposition with the Release order.
            {
              echo '### Projection pump approval inputs'
              echo '```json'
              jq -n --arg control "$WORKFLOW_CONTROL_SHA" --arg source "$RELEASE_SHA" \
                --arg disposition "$PUMP_RELEASE_DISPOSITION" \
                '{dispatch_control: $control, requested_source: $source, release_disposition: $disposition}'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$WORKFLOW_MODE" == workerd-* ]]; then
            if [[ "$DEPLOY_ENVIRONMENT" != prod || "$SKIP_ELIGIBILITY" == true || "$BREAK_GLASS_LOCK" == true ]]; then
              echo "$WORKFLOW_MODE requires prod and normal release admission." >&2
              exit 1
            fi
          fi
          INTEGRATION_ONLY=false
          INTEGRATION_IMAGE=''
          POST_WRAP_GUARD=internal
          ROLLBACK_REVISION=backend-integration-provfix-off1114
          if [[ "$SERVICE_IMAGES" == integration-canary=* ]]; then
            INTEGRATION_IMAGE="${SERVICE_IMAGES#integration-canary=}"
            if [[ "$INTEGRATION_IMAGE" == *,rollback_revision=* ]]; then
              ROLLBACK_REVISION="${INTEGRATION_IMAGE##*,rollback_revision=}"
              INTEGRATION_IMAGE="${INTEGRATION_IMAGE%,rollback_revision=*}"
            fi
            [[ "$ROLLBACK_REVISION" =~ ^backend-integration-[a-z0-9]([a-z0-9-]*[a-z0-9])?$ && ${#ROLLBACK_REVISION} -le 63 ]] || exit 1
            if [[ "$INTEGRATION_IMAGE" == *,post_wrap_guard=* ]]; then
              POST_WRAP_GUARD="${INTEGRATION_IMAGE##*,post_wrap_guard=}"
              INTEGRATION_IMAGE="${INTEGRATION_IMAGE%,post_wrap_guard=*}"
            fi
            [[ "$DEPLOY_ENVIRONMENT" == prod && "$WORKFLOW_MODE" == deploy &&
               "$DEPLOY_TARGETS" == cloud-run-only && "$SKIP_ELIGIBILITY" != true &&
               "$BREAK_GLASS_LOCK" != true && "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ &&
               "$INTEGRATION_IMAGE" =~ ^gcr\.io/based-hardware/(backend|backend-workers)@sha256:[0-9a-f]{64}$ &&
               ("$POST_WRAP_GUARD" == internal || "$POST_WRAP_GUARD" == external) ]] || {
              echo 'Integration-only requires exact admitted source/digest and normal production gates.' >&2
              exit 1
            }
            [[ "$CLOUD_RUN_SERVICE" == all || "$CLOUD_RUN_SERVICE" == backend-integration ]] || exit 1
            INTEGRATION_ONLY=true
          fi
          if [[ -n "${SELECTED_SPLIT_PLAN:-}" || -n "${SELECTED_SPLIT_BINDING:-}" ]]; then
            IFS=';' read -r version donor _ <<< "${SELECTED_SPLIT_PLAN:-}"
            if [[ "$WORKFLOW_MODE" != deploy || "$DEPLOY_ENVIRONMENT" != prod ||
                  "$DEPLOY_TARGETS" != cloud-run-only || "$CLOUD_RUN_SERVICE" == all ||
                  "$CLOUD_RUN_SERVICE" == backend-projection-pump || "$INTEGRATION_ONLY" != false ||
                  "$BREAK_GLASS_LOCK" != false || "$SKIP_ELIGIBILITY" != false ||
                  "${DEPLOY_GATEWAY:-}" != false || -n "$SERVICE_IMAGES" ||
                  -n "$SELECTED_ROLLBACK_REVISION" || ! "$REQUESTED_BY" =~ ^selection:[0-9a-f]{32}$ ||
                  ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ || "$RELEASE_SHA" == 0714c5198be8f0183c8fd7dd3810d53c91af17a4 ||
                  "${GITHUB_RUN_ATTEMPT:-}" != 1 || "${GITHUB_REF:-}" != refs/heads/main ||
                  "$version" != holdback-v1 || ! "$donor" =~ ^${CLOUD_RUN_SERVICE}-[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ||
                  ${#donor} -gt 63 || "$SELECTED_SPLIT_PLAN" != *';5;7200' ||
                  ! "${SELECTED_SPLIT_BINDING:-}" =~ ^[0-9a-f]{64}$ ||
                  "$(printf %s "$SELECTED_SPLIT_PLAN" | sha256sum | cut -d ' ' -f 1)" != "$SELECTED_SPLIT_BINDING" ]]; then
              echo '::error::Hold-back requires a bound 5-point, two-hour plan for a named production deploy with normal admission.'
              exit 1
            fi
            ROLLBACK_REVISION="$donor"
          elif [[ "$CLOUD_RUN_SERVICE" != all && "$CLOUD_RUN_SERVICE" != backend-projection-pump && "$INTEGRATION_ONLY" != true ]]; then
            if [[ ! "$SELECTED_ROLLBACK_REVISION" =~ ^${CLOUD_RUN_SERVICE}-[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ||
                  ${#SELECTED_ROLLBACK_REVISION} -gt 63 ]]; then
              echo 'Named deploy requires the admitted selected_rollback_revision.' >&2
              exit 1
            fi
            ROLLBACK_REVISION="$SELECTED_ROLLBACK_REVISION"
          elif [[ -n "$SELECTED_ROLLBACK_REVISION" ]]; then
            echo 'selected_rollback_revision applies only to a named standard deploy.' >&2
            exit 1
          fi
          printf 'integration_only=%s\nintegration_image=%s\npost_wrap_guard=%s\nrollback_revision=%s\n' "$INTEGRATION_ONLY" "$INTEGRATION_IMAGE" "$POST_WRAP_GUARD" "$ROLLBACK_REVISION" >> "$GITHUB_OUTPUT"
          if [[ "$DEPLOY_ENVIRONMENT" == prod && "$WORKFLOW_MODE" == deploy &&
                "$RELEASE_SHA" == 0714c5198be8f0183c8fd7dd3810d53c91af17a4 ]]; then
            [[ "$DEPLOY_TARGETS" == cloud-run-only && "$SKIP_ELIGIBILITY" != true &&
               "$BREAK_GLASS_LOCK" != true ]] || {
              echo 'The ruled integration canary requires normal cloud-run-only admission and lock.' >&2
              exit 1
            }
          fi
          if [[ "$DEPLOY_ENVIRONMENT" != "development" && "$DEPLOY_ENVIRONMENT" != "prod" ]]; then
            echo "Invalid environment: $DEPLOY_ENVIRONMENT. Must be 'development' or 'prod'." >&2
            exit 1
          fi
          if [[ "$DEPLOY_TARGETS" != "all" && "$DEPLOY_TARGETS" != "cloud-run-only" ]]; then
            echo "Invalid deploy_targets: $DEPLOY_TARGETS. Must be 'all' or 'cloud-run-only'." >&2
            exit 1
          fi
          if [[ "$DEPLOY_ENVIRONMENT" == "prod" && "$DEPLOY_TARGETS" == "all" ]]; then
            echo "environment=prod, deploy_targets=all is unsupported; use cloud-run-only." >&2
            exit 1
          fi
          if [[ "$DEPLOY_ENVIRONMENT" == "prod" ]]; then
            if [[ -z "${REQUESTED_BY//[[:space:]]/}" ]]; then
              echo "::error::prod dispatches must name their requester: pass -f requested_by=<lane label or session> (e.g. op1, train:<name>)."
              exit 1
            fi
            echo "requested_by=${REQUESTED_BY}"
          fi
          if [[ "${{ github.event.inputs.deploy_gateway }}" == "true" && "$DEPLOY_ENVIRONMENT" == "prod" ]]; then
            echo "environment=prod, deploy_gateway=true is unsupported; use the standalone manual LLM gateway workflow." >&2
            exit 1
          fi
          if [[ "${{ github.event.inputs.deploy_gateway }}" == "true" && "$DEPLOY_TARGETS" != "all" ]]; then
            echo "deploy_gateway=true requires deploy_targets=all." >&2
            exit 1
          fi
          if [[ "$WORKFLOW_MODE" == "build-only" && "${{ github.event.inputs.deploy_gateway }}" == "true" ]]; then
            echo "mode=build-only builds only the backend image; deploy_gateway=true is unsupported." >&2
            exit 1
          fi
          if [[ "$WORKFLOW_MODE" != "deploy" && -n "${SERVICE_IMAGES//[[:space:],]/}" ]]; then
            echo "service_images applies only to mode=deploy." >&2
            exit 1
          fi

      - name: Bind SCA-3318 recovery approval inputs
        if: inputs.mode == 'recover-pump-cap'
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_TARGETS: ${{ inputs.deploy_targets }}
          CLOUD_RUN_SERVICE: ${{ inputs.cloud_run_service }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          CONTROL_SHA: ${{ inputs.pump_control_sha }}
          WORKFLOW_CONTROL_SHA: ${{ github.workflow_sha }}
          APPROVED_ETAG: ${{ inputs.pump_recovery_etag }}
        run: |
          set -euo pipefail
          jq -e '.inputs |
            .break_glass_lock == "false" and .skip_eligibility_proof == "false" and
            .deploy_gateway == "false" and
            ([.service_images, .pump_release_disposition, .break_glass_confirm,
              .break_glass_reason, .release_version, .selected_rollback_revision,
              .selected_split_plan, .selected_split_binding] | all(. == "" or . == null)) and
            (.requested_by | test("[^[:space:]]"))' "$GITHUB_EVENT_PATH" >/dev/null
          # Cloud Run v2 can return literal outer quotes as part of the etag.
          etag_pattern='^([A-Za-z0-9_+/=-]{1,200}|"[A-Za-z0-9_+/=-]{1,200}")$'
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main &&
             "$GITHUB_REPOSITORY" == BasedHardware/omi && "$GITHUB_RUN_ATTEMPT" == 1 &&
             "$DEPLOY_ENVIRONMENT" == prod && "$DEPLOY_TARGETS" == cloud-run-only &&
             "$CLOUD_RUN_SERVICE" == backend-projection-pump &&
             "$CONTROL_SHA" =~ ^[0-9a-f]{40}$ && "$CONTROL_SHA" == "$WORKFLOW_CONTROL_SHA" &&
             "$WORKFLOW_CONTROL_SHA" == "$GITHUB_SHA" &&
             "$RELEASE_SHA" == f7060aa1a0c9e3481790d497140096ae99f9b062 &&
             "$APPROVED_ETAG" =~ $etag_pattern ]]
          jq -n --arg control "$CONTROL_SHA" --arg etag "$APPROVED_ETAG" --arg source "$RELEASE_SHA" \
            '{issue:"SCA-3318", service:"backend-projection-pump", control:$control, etag:$etag,
              base_source:$source, forward_max:4, inverse_max:20}' >> "$GITHUB_STEP_SUMMARY"

  repair-traffic:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.inputs.mode == 'repair-traffic-only'
    environment: ${{ github.event.inputs.environment == 'prod' && 'prod' || 'development' }}
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Environment Input
        env:
          CLOUD_RUN_SERVICE: ${{ github.event.inputs.cloud_run_service || 'all' }}
          REQUESTED_BY: ${{ github.event.inputs.requested_by }}
          SELECTED_SPLIT_PLAN: ${{ inputs.selected_split_plan }}
          SELECTED_SPLIT_BINDING: ${{ inputs.selected_split_binding }}
        run: |
          [[ -z "$SELECTED_SPLIT_PLAN" && -z "$SELECTED_SPLIT_BINDING" ]] || exit 1
          [[ "${CLOUD_RUN_SERVICE:-all}" == all ]] || { echo "::error::repair does not accept a service selector" >&2; exit 1; }
          if [[ "${{ github.event.inputs.environment }}" != "development" && "${{ github.event.inputs.environment }}" != "prod" ]]; then
            echo "Invalid environment: ${{ github.event.inputs.environment }}. Must be 'development' or 'prod'."
            exit 1
          fi
          if [[ "${{ github.event.inputs.environment }}" == "prod" ]]; then
            if [[ -z "${REQUESTED_BY//[[:space:]]/}" ]]; then
              echo "::error::prod dispatches must name their requester: pass -f requested_by=<lane label or session> (e.g. op1, train:<name>)."
              exit 1
            fi
            echo "requested_by=${REQUESTED_BY}"
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Traffic repair changes no source-derived runtime state. It stays a
          # separate recovery path and does not consume a release proof.
          ref: main
          fetch-depth: 0

      # Prod: GitHub WIF as omi-ci-deployer-prod@ (credential-hygiene WS-C,
      # plan v2 Phase E). Development keeps its JSON lane.
      - name: Google Auth (prod WIF)
        id: auth-wif
        if: github.event.inputs.environment == 'prod' && (github.event.inputs.cloud_run_service == '' || github.event.inputs.cloud_run_service == 'all')
        uses: 'google-github-actions/auth@v3'
        with:
          workload_identity_provider: projects/208440318997/locations/global/workloadIdentityPools/omi-gha-deploy-prod/providers/github
          service_account: omi-ci-deployer-prod@based-hardware.iam.gserviceaccount.com

      - name: Google Auth
        id: auth
        if: github.event.inputs.environment != 'prod'
        uses: 'google-github-actions/auth@v3'
        with:
          # Development: GitHub WIF as the dev deployer, no JSON key (credential hygiene WS-D).
          workload_identity_provider: projects/1031333818730/locations/global/workloadIdentityPools/omi-gha-deploy-dev/providers/github
          service_account: omi-ci-deployer-dev@based-hardware-dev.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Restore Cloud Run traffic spec to currently serving revisions
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python3 backend/scripts/repair_cloud_run_traffic.py \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --repair \
            --release-floor-check .github/scripts/verify_backend_release_floor.py

      - name: Cloud Run deploy status report
        if: always()
        run: |
          python3 backend/scripts/deploy_status_report.py \
            --env ${{ vars.ENV }} \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --include-cloud-run \
            --cloud-run-service backend \
            --cloud-run-service backend-sync \
            --cloud-run-service backend-sync-backfill \
            --cloud-run-service backend-integration || true

  # Source admission is shared by deploy and image-only modes so they enforce the
  # one Release Eligibility proof (and break-glass audit) for the exact SHA.
  firestore_readiness:
    needs: validate-production-boundary
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event.inputs.mode == 'deploy' || github.event.inputs.mode == 'build-only' || github.event.inputs.mode == 'workerd-image-only' || github.event.inputs.mode == 'workerd-install' || github.event.inputs.mode == 'workerd-rollback')
    environment: ${{ github.event.inputs.environment == 'prod' && 'prod' || 'development' }}
    permissions:
      actions: 'read'
      contents: 'read'
      # Keyless index check (2026-11-01): the readiness composite now mints its
      # OIDC token through the same deploy pool build-image/deploy auth uses, so
      # this boundary job needs id-token: write. The token still impersonates
      # only omi-ci-index-check@ (ciFirestoreIndexReader), never the deployer.
      id-token: 'write'
    runs-on: ubuntu-latest
    outputs:
      admitted_sha: ${{ steps.admitted_source.outputs.admitted_sha }}
      break_glass: ${{ steps.admitted_source.outputs.break_glass }}
    steps:
      - name: Validate Firestore readiness inputs
        env:
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment }}
          WORKFLOW_MODE: ${{ github.event.inputs.mode }}
          REQUESTED_BY: ${{ github.event.inputs.requested_by }}
          DEPLOY_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          RUNTIME_PROJECT: ${{ vars.RUNTIME_GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          # Resolve environment-scoped project variables before the index check can authenticate.
          if [[ "${WORKFLOW_MODE:-}" == deploy &&
                ( "${REQUESTED_BY:-}" == train-digest-v1 || "${REQUESTED_BY:-}" == train-digest-v1:* ) ]]; then
            if [[ "$DEPLOY_PROJECT" != based-hardware || "$RUNTIME_PROJECT" != based-hardware ]]; then
              echo '::error::Digest promotion requires the reviewed production project.' >&2
              exit 1
            fi
            if [[ "$REGION" != us-central1 ]]; then
              echo '::error::Digest promotion requires the reviewed Cloud Run region.' >&2
              exit 1
            fi
            # Keep the guard active without handing digest promotion to the legacy rebuild.
            echo '::error::Digest promotion is disabled until the no-rebuild path is wired.' >&2
            exit 1
          fi
          if [[ "$DEPLOY_ENVIRONMENT" != "development" && "$DEPLOY_ENVIRONMENT" != "prod" ]]; then
            echo "Invalid environment: $DEPLOY_ENVIRONMENT. Must be 'development' or 'prod'."
            exit 1
          fi
      - name: Checkout current main for source admission
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact admitted main source
        id: admitted_source
        env:
          DEPLOY_SHA: ${{ github.event.inputs.release_sha }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
          WORKFLOW_MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ github.token }}
          SKIP_PROOF: ${{ github.event.inputs.skip_eligibility_proof }}
          BREAK_GLASS_CONFIRM: ${{ github.event.inputs.break_glass_confirm }}
          BREAK_GLASS_REASON: ${{ github.event.inputs.break_glass_reason }}
        run: |
          set -euo pipefail
          RELEASE_BRANCH="${RELEASE_BRANCH:-}"
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ || "$DEPLOY_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "ERROR: release_sha must be one non-zero, lowercase, full commit SHA."
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          main_sha="$(git rev-parse --verify 'origin/main^{commit}')"
          if [[ -n "$RELEASE_BRANCH" ]]; then
            if [[ "$WORKFLOW_MODE" != "build-only" || "${SKIP_PROOF:-false}" == "true" ||
                  "$RELEASE_BRANCH" != release/?* ]] || ! git check-ref-format "refs/heads/$RELEASE_BRANCH"; then
              echo "ERROR: release_branch requires a valid release/* branch, build-only mode and normal proof." >&2
              exit 1
            fi
            git fetch --no-tags origin "refs/heads/$RELEASE_BRANCH"
            if [[ "$(git rev-parse --verify FETCH_HEAD)" != "$DEPLOY_SHA" ]]; then
              echo "ERROR: release_sha must equal the current release branch head." >&2
              exit 1
            fi
            # Only trust a proof generated by the reviewed workflow on main.
            if ! git diff --quiet "$main_sha" "$DEPLOY_SHA" -- .github/workflows/release-eligibility.yml; then
              echo "ERROR: release branch must carry the reviewed Release Eligibility workflow from main." >&2
              exit 1
            fi
          fi

          # git 2.54 regressed "<full-sha>^{commit}" peeling (ambiguous argument);
          # a plain object-type check is version-proof and identical in effect.
          [ "$(git cat-file -t "${DEPLOY_SHA}" 2>/dev/null)" = "commit" ]

          if [[ -z "$RELEASE_BRANCH" ]] && ! git merge-base --is-ancestor "$DEPLOY_SHA" "$main_sha"; then
            echo "ERROR: release_sha is not an ancestor of origin/main; only merged code may deploy."
            exit 1
          fi

          python3 .github/scripts/verify_backend_release_floor.py --sha "$DEPLOY_SHA"

          if [[ "${SKIP_PROOF:-false}" == "true" ]]; then
            if [[ "$BREAK_GLASS_CONFIRM" != "deploy-without-proof" ]]; then
              echo "ERROR: skip_eligibility_proof requires break_glass_confirm=deploy-without-proof." >&2
              exit 1
            fi
            if [[ -z "${BREAK_GLASS_REASON// }" ]]; then
              echo "ERROR: skip_eligibility_proof requires a non-empty break_glass_reason." >&2
              exit 1
            fi
            echo "::warning::Release Eligibility proof skipped for ${DEPLOY_SHA}: ${BREAK_GLASS_REASON}"
            printf 'break_glass=true\n' >> "$GITHUB_OUTPUT"
          elif [[ -n "$RELEASE_BRANCH" ]]; then
            proof_path="${RUNNER_TEMP}/release-eligibility-${DEPLOY_SHA}.json"
            gh api --method GET -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/release-eligibility.yml/runs" \
              -f event=workflow_dispatch -f branch="$RELEASE_BRANCH" -f status=completed \
              -f head_sha="$DEPLOY_SHA" -F per_page=100 > "$proof_path"
            python3 .github/scripts/verify_backend_release_admission.py \
              --sha "$DEPLOY_SHA" \
              --repository "$GITHUB_REPOSITORY" \
              --release-branch "$RELEASE_BRANCH" \
              --workflow-runs "$proof_path"
            printf 'break_glass=false\n' >> "$GITHUB_OUTPUT"
          else
            proof_path="${RUNNER_TEMP}/release-eligibility-${DEPLOY_SHA}.json"
            gh api -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/release-eligibility.yml/runs?event=push&branch=main&status=completed&head_sha=${DEPLOY_SHA}&per_page=100" \
              > "$proof_path"
            python3 .github/scripts/verify_backend_release_admission.py \
              --sha "$DEPLOY_SHA" \
              --repository "$GITHUB_REPOSITORY" \
              --workflow-runs "$proof_path"
            printf 'break_glass=false\n' >> "$GITHUB_OUTPUT"
          fi
          printf 'admitted_sha=%s\n' "$DEPLOY_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout admitted Firestore source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.admitted_source.outputs.admitted_sha }}

      - name: Checkout immutable Firestore gate controls
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .github/firestore-workflow
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            .github/actions/firestore-readiness
            backend/scripts
            backend/database

      - name: Verify serving Firestore indexes
        uses: ./.github/firestore-workflow/.github/actions/firestore-readiness
        with:
          source_sha: ${{ steps.admitted_source.outputs.admitted_sha }}
          project_id: ${{ vars.RUNTIME_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ github.event.inputs.environment == 'prod' && 'projects/208440318997/locations/global/workloadIdentityPools/omi-gha-deploy-prod/providers/github' || 'projects/1031333818730/locations/global/workloadIdentityPools/omi-gha-deploy-dev/providers/github' }}
          service_account: omi-ci-index-check@based-hardware.iam.gserviceaccount.com

  # Kept out of firestore_readiness on purpose: that job is a least-privilege
  # release-proof boundary (actions:read/contents:read plus the id-token the
  # keyless index check needs), so the audit side effect gets its own job
  # rather than widening it.
  record_break_glass:
    needs: firestore_readiness
    if: ${{ needs.firestore_readiness.outputs.break_glass == 'true' }}
    permissions:
      contents: 'read'
      issues: 'write'
    runs-on: ubuntu-latest
    steps:
      - name: Record that the eligibility proof was bypassed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ needs.firestore_readiness.outputs.admitted_sha }}
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment }}
          BREAK_GLASS_REASON: ${{ github.event.inputs.break_glass_reason }}
        run: |
          set -euo pipefail
          # A missing release-gate-failure label made gh issue create fail hard,
          # so the audit issue was never filed (see #10301 / #10389). Ensure the
          # label exists first — idempotent, so a concurrent run cannot race it.
          # Only tolerate the explicit "already exists" case; fail loudly on
          # any other label-creation error (permissions, rate limits, etc.).
          label_output="$(gh label create release-gate-failure \
              --repo "$REPO" \
              --description "Release Eligibility gate was bypassed (break-glass audit trail)" \
              --color "b60205" 2>&1)" || {
            if ! grep -qi 'already exists' <<< "$label_output"; then
              echo "::error::Failed to ensure release-gate-failure label: $label_output" >&2
              exit 1
            fi
          }
          gh issue create --repo "$REPO" \
            --title "Release Eligibility bypassed for ${DEPLOY_SHA:0:10} (${DEPLOY_ENVIRONMENT})" \
            --label release-gate-failure \
            --body "$(printf '%s\n' \
              "Backend deploy ran without a Release Eligibility proof." \
              "" \
              "- SHA: \`${DEPLOY_SHA}\` (verified ancestor of main)" \
              "- Environment: ${DEPLOY_ENVIRONMENT}" \
              "- Operator: @${GITHUB_ACTOR}" \
              "- Reason: ${BREAK_GLASS_REASON}" \
              "- Run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}" \
              "" \
              "The gate being unusable is the defect. Fix the gate, then close this.")"

  # build-only: publish the admitted backend image without deploying it, so
  # gcp_backend_listen_helm.yml image_tag=<sha7> can ship a listen-only fix. It
  # shares deploy's boundary, admission, and break-glass jobs and runs in the
  # same Environment (prod approval and prod WIF binding for the prod registry).
  # It has no Cloud Run, GKE, traffic, or runtime env step, never moves :latest,
  # and never re-pushes an existing <sha7> tag that a serving workload may pull.
  build-image:
    needs: [validate-production-boundary, firestore_readiness, record_break_glass]
    if: >-
      always() && !cancelled() &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.mode == 'build-only' &&
      needs.validate-production-boundary.result == 'success' &&
      needs.firestore_readiness.result == 'success' &&
      (needs.record_break_glass.result == 'success' || needs.record_break_glass.result == 'skipped')
    environment: ${{ github.event.inputs.environment == 'prod' && 'prod' || 'development' }}
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image-tag.outputs.image }}
      digest: ${{ steps.image-digest.outputs.digest }}
    steps:
      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - name: Checkout admitted runtime source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.firestore_readiness.outputs.admitted_sha }}
          # Full history so the short tag disambiguates exactly as
          # gcp_backend_listen_helm.yml resolves it.
          fetch-depth: 0

      - name: Checkout immutable image-contract controls
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .deploy-control
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            .github
            backend

      - name: Google Auth (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ github.event.inputs.environment == 'prod' && 'projects/208440318997/locations/global/workloadIdentityPools/omi-gha-deploy-prod/providers/github' || 'projects/1031333818730/locations/global/workloadIdentityPools/omi-gha-deploy-dev/providers/github' }}
          service_account: ${{ github.event.inputs.environment == 'prod' && 'omi-ci-deployer-prod@based-hardware.iam.gserviceaccount.com' || 'omi-ci-deployer-dev@based-hardware-dev.iam.gserviceaccount.com' }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Login to GCR
        run: gcloud auth configure-docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve admitted image tag
        id: image-tag
        env:
          ADMITTED_SHA: ${{ needs.firestore_readiness.outputs.admitted_sha }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [[ -z "$ADMITTED_SHA" || "$head_sha" != "$ADMITTED_SHA" ]]; then
            echo "ERROR: checked-out source ${head_sha} is not the admitted SHA '${ADMITTED_SHA}'." >&2
            exit 1
          fi
          short_sha="$(git rev-parse --short=7 HEAD)"
          image="gcr.io/${PROJECT_ID}/${SERVICE}:${short_sha}"
          # Fail closed: only gcloud's not-found diagnostic for this exact image
          # means the tag is free. Any other describe error must not be read as
          # absence and overwrite a tag.
          if existing_digest="$(gcloud container images describe "$image" --format='value(image_summary.digest)' 2>"$RUNNER_TEMP/describe.err")" && [[ -n "$existing_digest" ]]; then
            exists=true
          elif grep -qF "[${image}] is not found or is not a valid name" "$RUNNER_TEMP/describe.err"; then
            exists=false
          else
            echo "ERROR: could not determine whether ${image} already exists:" >&2
            cat "$RUNNER_TEMP/describe.err" >&2
            exit 1
          fi
          {
            printf 'short_sha=%s\n' "$short_sha"
            printf 'image=%s\n' "$image"
            printf 'exists=%s\n' "$exists"
          } >> "$GITHUB_OUTPUT"
          if [[ "$exists" == "true" ]]; then
            # build-only labels its images with the admitted revision; deploy-mode
            # images carry no label, so provenance then rests on the SHA tag.
            if ! revision="$(docker buildx imagetools inspect "$image" --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}')"; then
              echo "ERROR: could not read the revision label of existing ${image}." >&2
              exit 1
            fi
            if [[ -n "$revision" && "$revision" != "<no value>" && "$revision" != "$ADMITTED_SHA" ]]; then
              echo "ERROR: ${image} is labelled revision ${revision}, not the admitted SHA ${ADMITTED_SHA}." >&2
              exit 1
            fi
            echo "::notice::${image} already exists (${existing_digest}); build-only will not rebuild or re-push it."
          fi

      - name: Install Python deps for image contract scripts
        if: steps.image-tag.outputs.exists == 'false'
        run: python3 -m pip install -q pyyaml

      - name: Build runtime image
        if: steps.image-tag.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: |
            ${{ steps.image-tag.outputs.image }}
          labels: |
            org.opencontainers.image.revision=${{ needs.firestore_readiness.outputs.admitted_sha }}
          # Read the shared cache but never write it: build-only moves no mutable tag.
          cache-from: type=registry,ref=gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:buildcache

      - name: Verify built runtime image before publish
        if: steps.image-tag.outputs.exists == 'false'
        env:
          IMAGE: ${{ steps.image-tag.outputs.image }}
        run: |
          set -euo pipefail
          python3 .deploy-control/backend/scripts/runtime_image_contracts.py smoke --dockerfile backend/Dockerfile --image "$IMAGE"

      - name: Push verified runtime image
        if: steps.image-tag.outputs.exists == 'false'
        env:
          IMAGE: ${{ steps.image-tag.outputs.image }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"

      - name: Record published image digest
        id: image-digest
        env:
          ADMITTED_SHA: ${{ needs.firestore_readiness.outputs.admitted_sha }}
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment }}
          EXISTED: ${{ steps.image-tag.outputs.exists }}
          IMAGE: ${{ steps.image-tag.outputs.image }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
          SHORT_SHA: ${{ steps.image-tag.outputs.short_sha }}
        run: |
          set -euo pipefail
          digest="$(gcloud container images describe "$IMAGE" --format='value(image_summary.digest)')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: registry returned no digest for ${IMAGE}." >&2
            exit 1
          fi
          if [[ "$EXISTED" == "false" ]]; then
            repo_digests="$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE")"
            if ! grep -qF "@${digest}" <<< "$repo_digests"; then
              echo "ERROR: registry digest ${digest} is not among the pushed digests: ${repo_digests}" >&2
              exit 1
            fi
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Backend image (build-only)"
            echo ""
            echo "- Admitted SHA: \`${ADMITTED_SHA}\`"
            echo "- Image: \`${IMAGE}\`"
            echo "- Digest: \`${digest}\`"
            echo "- Published by this run: $([[ "$EXISTED" == "false" ]] && echo yes || echo 'no (tag already existed)')"
            echo ""
            if [[ -z "$RELEASE_BRANCH" ]]; then
              echo "Nothing was deployed. Roll backend-listen to this image with:"
              echo ""
              echo "\`gh workflow run gcp_backend_listen_helm.yml --ref main -f environment=${DEPLOY_ENVIRONMENT} -f branch=main -f mode=deploy -f image_tag=${SHORT_SHA}\`"
            else
              echo "Release-branch source: \`${RELEASE_BRANCH}\`. Use the separately reviewed Listen rollout route."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish-workerd:
    name: Build and publish workerd production image
    needs: [validate-production-boundary, firestore_readiness]
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'workerd-image-only' &&
      inputs.environment == 'prod' &&
      needs.firestore_readiness.outputs.break_glass == 'false'
    environment: prod
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout admitted workerd source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.firestore_readiness.outputs.admitted_sha }}
          persist-credentials: false

      - name: Google Auth (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/208440318997/locations/global/workloadIdentityPools/omi-gha-deploy-prod/providers/github
          service_account: omi-ci-deployer-prod@based-hardware.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Publish admitted workerd image
        env:
          ADMITTED_SHA: ${{ needs.firestore_readiness.outputs.admitted_sha }}
        run: |
          set -euo pipefail
          [[ "$ADMITTED_SHA" =~ ^[a-f0-9]{40}$ && "$(git rev-parse HEAD)" == "$ADMITTED_SHA" ]]
          repository="gcr.io/based-hardware/workerd"
          image="$repository:${ADMITTED_SHA:0:7}"
          # SCA-3883: the build context is backend-go/ only, so its git tree identifies the
          # image. A later admitted SHA with the same tree reuses the published digest instead
          # of rebuilding, and a Release go-ahead bound to {digest, backend_go_tree} survives
          # main moving. The tree also covers the chart and values-prod.yaml. The build
          # invocation below is outside the tree: bump recipe when it changes, so old images
          # are not reused for a new recipe.
          recipe=v1
          tree="$(git rev-parse "$ADMITTED_SHA:backend-go")"
          [[ "$tree" =~ ^[a-f0-9]{40}$ ]]
          tree_image="$repository:tree-$recipe-${tree:0:20}"

          describe() {
            gcloud container images describe "$1" --format='value(image_summary.digest)' 2>"$RUNNER_TEMP/workerd-describe.err"
          }
          missing() {
            grep -qF "[$1] is not found or is not a valid name" "$RUNNER_TEMP/workerd-describe.err"
          }
          label() {
            # A failed read is fatal and named, never mistaken for a mismatch.
            if ! docker buildx imagetools inspect "$repository@$1" \
                --format "{{ index .Image.Config.Labels \"$2\" }}" 2>"$RUNNER_TEMP/workerd-label.err"; then
              echo "::error::Could not read the $2 label of the workerd image." >&2
              cat "$RUNNER_TEMP/workerd-label.err" >&2
              return 1
            fi
          }

          outcome=''
          if digest="$(describe "$tree_image")"; then
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            recorded_tree="$(label "$digest" omi.workerd.backend-go-tree)"
            if [[ "$recorded_tree" != "$tree" ]]; then
              echo "::error::Existing workerd tree tag has a different backend-go tree."
              exit 1
            fi
            # Keep the per-SHA tag reachable for this admitted SHA too.
            if [[ -z "$(describe "$image")" ]]; then
              missing "$image" || { cat "$RUNNER_TEMP/workerd-describe.err" >&2; exit 1; }
              gcloud container images add-tag --quiet "$repository@$digest" "$image"
            fi
            outcome=reused
          elif ! missing "$tree_image"; then
            cat "$RUNNER_TEMP/workerd-describe.err" >&2
            exit 1
          elif digest="$(describe "$image")"; then
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            revision="$(label "$digest" org.opencontainers.image.revision)"
            if [[ "$revision" != "$ADMITTED_SHA" ]]; then
              echo "::error::Existing workerd tag has a different source revision."
              exit 1
            fi
            # An image published before tree labels has none ("<no value>") and stays usable for
            # its own SHA only. A present label must match, and then the tree tag is added.
            recorded_tree="$(label "$digest" omi.workerd.backend-go-tree)"
            if [[ "$recorded_tree" == "$tree" ]]; then
              gcloud container images add-tag --quiet "$repository@$digest" "$tree_image"
            elif [[ -n "$recorded_tree" && "$recorded_tree" != '<no value>' ]]; then
              echo "::error::Existing workerd SHA tag has a different backend-go tree."
              exit 1
            fi
            outcome=existing
          elif missing "$image"; then
            docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$ADMITTED_SHA" \
              --label "omi.workerd.backend-go-tree=$tree" \
              --tag "$image" --file backend-go/Dockerfile backend-go
            docker push "$image"
            digest="$(gcloud container images describe "$image" --format='value(image_summary.digest)')"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            gcloud container images add-tag --quiet "$repository@$digest" "$tree_image"
            outcome=built
          else
            cat "$RUNNER_TEMP/workerd-describe.err" >&2
            exit 1
          fi

          image_revision="$(label "$digest" org.opencontainers.image.revision)"
          {
            echo "### Workerd production image published"
            echo "- Admitted SHA: \`$ADMITTED_SHA\`"
            echo "- Image revision: \`$image_revision\` ($outcome)"
            echo "- backend-go tree: \`$tree\`"
            echo "- Image: \`$repository@$digest\`"
            echo "- Release identity: \`backend-go/deploy/workerd/release-identity.sh --digest $digest --ref $ADMITTED_SHA --verify-image $repository --check-worktree\` plus the same \`-f\` files as the install"
          } >> "$GITHUB_STEP_SUMMARY"

  # SCA-3883: the CI route for the workerd chart (no direct Helm, permission audit K3).
  # workerd-install binds to the release identity the RELEASE_GO names: it refuses unless
  # release-identity.sh, run here on the admitted checkout with the pinned helm, prints
  # exactly workerd_identity. It migrates first, then installs, then checks rollout and
  # /ready, and helm-rolls back to the prior revision if any post-install check fails.
  workerd-helm:
    name: Install or roll back prod workerd
    needs: [validate-production-boundary, firestore_readiness]
    if: >-
      github.ref == 'refs/heads/main' &&
      (inputs.mode == 'workerd-install' || inputs.mode == 'workerd-rollback') &&
      inputs.environment == 'prod' &&
      needs.firestore_readiness.outputs.break_glass == 'false'
    environment: prod
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NAMESPACE: prod-omi-backend
      RELEASE: prod-omi-workerd
      REPOSITORY: gcr.io/based-hardware/workerd
    steps:
      - name: Checkout admitted workerd source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.firestore_readiness.outputs.admitted_sha }}
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          # The release identity binds the helm version; change it only with a new identity.
          version: v4.2.4

      - name: Google Auth (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/208440318997/locations/global/workloadIdentityPools/omi-gha-deploy-prod/providers/github
          service_account: omi-ci-deployer-prod@based-hardware.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ env.REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Record current release
        id: before
        run: |
          set -euo pipefail
          if ! status_err="$(helm -n "$NAMESPACE" status "$RELEASE" 2>&1 >/dev/null)"; then
            # A first install has nothing to restore; any other read failure refuses.
            if [[ "$status_err" == *"release: not found"* && "${{ inputs.mode }}" == workerd-install ]]; then
              echo "revision=0" >> "$GITHUB_OUTPUT"
              { echo "### Prod workerd before"; echo "- No Helm release: first install"; } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::Cannot read the $RELEASE Helm release: $status_err" >&2
            exit 1
          fi
          revision="$(helm -n "$NAMESPACE" history "$RELEASE" --max 1 -o json | jq -r '.[-1].revision')"
          [[ "$revision" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Cannot read the current $RELEASE revision." >&2; exit 1; }
          image="$(kubectl -n "$NAMESPACE" get "deployment/$RELEASE" -o jsonpath='{.spec.template.spec.containers[0].image}')"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          { echo "### Prod workerd before"; echo "- Helm revision: \`$revision\`"; echo "- Image: \`$image\`"; } >> "$GITHUB_STEP_SUMMARY"
          helm -n "$NAMESPACE" history "$RELEASE" --max 5
          # This job carries values-prod.yaml only. With private intake live, an install would
          # silently withdraw the route and a rollback could too, while the Cloud Run notifier
          # still points at it. Intake changes follow the README's ordered procedure instead.
          live_intake="$(helm -n "$NAMESPACE" get values "$RELEASE" --all -o json | jq -r '.intake.enabled // false')"
          if [[ "$live_intake" != false ]]; then
            echo "::error::$RELEASE has intake.enabled=$live_intake; refusing ${{ inputs.mode }} while private intake is live." >&2
            exit 1
          fi

      - name: Verify release identity
        if: inputs.mode == 'workerd-install'
        env:
          ADMITTED_SHA: ${{ needs.firestore_readiness.outputs.admitted_sha }}
          WORKERD_DIGEST: ${{ inputs.workerd_digest }}
          EXPECTED_IDENTITY: ${{ inputs.workerd_identity }}
        run: |
          set -euo pipefail
          [[ "$WORKERD_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo '::error::workerd_digest must be sha256:<64 hex>.' >&2; exit 1; }
          identity="$(bash backend-go/deploy/workerd/release-identity.sh --digest "$WORKERD_DIGEST" \
            --ref "$ADMITTED_SHA" --verify-image "$REPOSITORY" --check-worktree)"
          { echo "### Workerd release identity"; echo '```'; echo "$identity"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$identity" != "$EXPECTED_IDENTITY" ]]; then
            echo "::error::Release identity differs from workerd_identity; refusing to install." >&2
            printf 'computed: %s\nexpected: %s\n' "$identity" "$EXPECTED_IDENTITY" >&2
            exit 1
          fi

      - name: Run migration Job
        if: inputs.mode == 'workerd-install'
        env:
          WORKERD_DIGEST: ${{ inputs.workerd_digest }}
        run: |
          set -euo pipefail
          chart=backend-go/deploy/workerd
          job="$RELEASE-migrate"
          if kubectl -n "$NAMESPACE" get "job/$job" >/dev/null 2>&1; then
            kubectl -n "$NAMESPACE" delete "job/$job" --wait=true
          fi
          helm template "$RELEASE" "$chart" --namespace "$NAMESPACE" -f "$chart/values-prod.yaml" \
            --set-string "image.digest=$WORKERD_DIGEST" --set migration.enabled=true \
            --show-only templates/migration.yaml | kubectl -n "$NAMESPACE" create -f -
          if ! kubectl -n "$NAMESPACE" wait --for=condition=complete "job/$job" --timeout=150s; then
            kubectl -n "$NAMESPACE" describe "job/$job" || true
            kubectl -n "$NAMESPACE" logs "job/$job" --tail=50 || true
            echo "::error::Workerd migration did not complete; the Deployment is unchanged." >&2
            exit 1
          fi
          echo "- Migration: \`job/$job\` complete" >> "$GITHUB_STEP_SUMMARY"

      - name: Install chart
        id: install
        if: inputs.mode == 'workerd-install'
        env:
          WORKERD_DIGEST: ${{ inputs.workerd_digest }}
        run: |
          set -euo pipefail
          chart=backend-go/deploy/workerd
          helm upgrade --install "$RELEASE" "$chart" --namespace "$NAMESPACE" \
            -f "$chart/values-prod.yaml" --set-string "image.digest=$WORKERD_DIGEST"

      - name: Roll back to requested revision
        id: rollback
        if: inputs.mode == 'workerd-rollback'
        env:
          REVISION: ${{ inputs.workerd_helm_revision }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[1-9][0-9]*$ ]] || { echo '::error::workerd_helm_revision must be a Helm revision number.' >&2; exit 1; }
          # Rollback restores the worker only. Private intake has its own approval and must
          # never come back through a rollback, so refuse a target revision with it enabled.
          intake="$(helm -n "$NAMESPACE" get values "$RELEASE" --revision "$REVISION" --all -o json | jq -r '.intake.enabled // false')"
          if [[ "$intake" != false ]]; then
            echo "::error::Helm revision $REVISION has intake.enabled=$intake; refusing a rollback that would enable private intake." >&2
            exit 1
          fi
          helm -n "$NAMESPACE" rollback "$RELEASE" "$REVISION" --wait --timeout 5m

      - name: Verify rollout and readiness
        id: verify
        env:
          WORKERD_DIGEST: ${{ inputs.workerd_digest }}
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" rollout status "deployment/$RELEASE" --timeout=5m
          kubectl -n "$NAMESPACE" port-forward "deployment/$RELEASE" 18080:8080 >"$RUNNER_TEMP/pf.log" 2>&1 &
          pf=$!
          trap 'kill "$pf" 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do curl -fsS -m 3 http://127.0.0.1:18080/ready >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS -m 5 http://127.0.0.1:18080/ready
          image="$(kubectl -n "$NAMESPACE" get "deployment/$RELEASE" -o jsonpath='{.spec.template.spec.containers[0].image}')"
          ready="$(kubectl -n "$NAMESPACE" get "deployment/$RELEASE" -o jsonpath='{.status.readyReplicas}/{.spec.replicas}')"
          if [[ "${{ inputs.mode }}" == workerd-install && "$image" != "$REPOSITORY@$WORKERD_DIGEST" ]]; then
            echo "::error::Deployment serves $image, not $REPOSITORY@$WORKERD_DIGEST." >&2
            exit 1
          fi
          [[ "${ready%/*}" == "${ready#*/}" ]] || { echo "::error::Only $ready workerd replicas are ready." >&2; exit 1; }
          revision="$(helm -n "$NAMESPACE" history "$RELEASE" --max 1 -o json | jq -r '.[-1].revision')"
          {
            echo "### Prod workerd after (${{ inputs.mode }})"
            echo "- Helm revision: \`$revision\` (before: \`${{ steps.before.outputs.revision }}\`)"
            echo "- Image: \`$image\`"
            echo "- Ready: \`$ready\`, \`/ready\` 200"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore prior revision after a failed install
        if: failure() && inputs.mode == 'workerd-install' && steps.install.outcome != 'skipped'
        env:
          REVISION: ${{ steps.before.outputs.revision }}
        run: |
          set -euo pipefail
          if [[ "$REVISION" == 0 ]]; then
            # First install: nothing to restore. Leave the failed release for inspection.
            echo "- **First install failed; no prior revision to restore.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          intake="$(helm -n "$NAMESPACE" get values "$RELEASE" --revision "$REVISION" --all -o json | jq -r '.intake.enabled // false')"
          if [[ "$intake" != false ]]; then
            echo "::error::Helm revision $REVISION has intake.enabled=$intake; not restoring it automatically." >&2
            exit 1
          fi
          helm -n "$NAMESPACE" rollback "$RELEASE" "$REVISION" --wait --timeout 5m
          kubectl -n "$NAMESPACE" rollout status "deployment/$RELEASE" --timeout=5m
          {
            echo "- **Install failed; restored Helm revision \`$REVISION\`.**"
            echo "- The migration already applied stays. If the restored image rejects the current migration checksums, fix forward."
          } >> "$GITHUB_STEP_SUMMARY"

  # Plan B B2 release train: build-only from main also publishes every role image
  # (backend/Dockerfile.roles targets and listen-edge) from the admitted SHA,
  # stamped OMI_RELEASE_SHA and labelled with that revision, on the private base.
  # It deploys nothing: a later mode=deploy opts services in through
  # service_images, by the digests this job prints.
  build-role-images:
    needs: [validate-production-boundary, firestore_readiness, record_break_glass]
    if: >-
      always() && !cancelled() &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.mode == 'build-only' &&
      inputs.release_branch == '' &&
      needs.validate-production-boundary.result == 'success' &&
      needs.firestore_readiness.result == 'success' &&
      (needs.record_break_glass.result == 'success' || needs.record_break_glass.result == 'skipped')
    environment: ${{ github.event.inputs.environment == 'prod' && 'prod' || 'development' }}
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ADMITTED_SHA: ${{ needs.firestore_readiness.outputs.admitted_sha }}
      # Written after the docker builds, so it never enters a build context.
      MANIFEST: role-images.json
    steps:
      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - name: Checkout admitted runtime source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.firestore_readiness.outputs.admitted_sha }}

      - name: Checkout immutable image-contract controls
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .deploy-control
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            .github
            backend

      - name: Google Auth (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ github.event.inputs.environment == 'prod' && 'projects/208440318997/locations/global/workloadIdentityPools/omi-gha-deploy-prod/providers/github' || 'projects/1031333818730/locations/global/workloadIdentityPools/omi-gha-deploy-dev/providers/github' }}
          service_account: ${{ github.event.inputs.environment == 'prod' && 'omi-ci-deployer-prod@based-hardware.iam.gserviceaccount.com' || 'omi-ci-deployer-dev@based-hardware-dev.iam.gserviceaccount.com' }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Login to GCR
        run: gcloud auth configure-docker

      # No setup-buildx-action here: the runner's default docker builder loads each
      # image into the local store for the docker run probes, and pushes plain
      # single-platform manifests whose config `imagetools inspect` reads at deploy.
      - name: Build role images from backend/Dockerfile.roles and backend/edge/Dockerfile
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ADMITTED_SHA"
          # --baseline also builds today's backend/Dockerfile so the report compares sizes.
          python3 .deploy-control/backend/scripts/role_images.py build \
            --sha "$ADMITTED_SHA" --registry "gcr.io/${PROJECT_ID}" --baseline --context . --manifest "$MANIFEST"

      - name: Smoke role images before publish
        # runtime_image_contracts.py smoke --dockerfile backend/Dockerfile.roles --target <t>
        # per Python role image; listen-edge gets its HTTP health, identity and drain probe.
        run: python3 .deploy-control/backend/scripts/role_images.py verify --manifest "$MANIFEST"

      - name: Measure role image size and cold start
        run: python3 .deploy-control/backend/scripts/role_images.py measure --manifest "$MANIFEST"

      - name: Publish verified role images
        run: python3 .deploy-control/backend/scripts/role_images.py publish --manifest "$MANIFEST"

      - name: Record role-image release vector
        if: always()
        run: |
          set -euo pipefail
          test -f "$MANIFEST" || exit 0
          python3 .deploy-control/backend/scripts/role_images.py summary --manifest "$MANIFEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload role-image release vector
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: role-images-${{ github.event.inputs.environment }}
          path: role-images.json
          if-no-files-found: ignore

  deploy:
    needs: [validate-production-boundary, firestore_readiness, record_break_glass]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.mode == 'deploy' &&
      github.event.inputs.cloud_run_service != 'backend-projection-pump' &&
      needs.validate-production-boundary.result == 'success' &&
      needs.firestore_readiness.result == 'success' &&
      (needs.record_break_glass.result == 'success' || needs.record_break_glass.result == 'skipped')
    environment: ${{ github.event.inputs.environment == 'prod' && 'prod' || 'development' }}
    permissions:
      contents: 'read'
      id-token: 'write'

    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow dispatch surface for composite action
        uses: actions/checkout@v7

      - name: Deploy backend stack
        timeout-minutes: ${{ needs.firestore_readiness.outputs.admitted_sha == '0714c5198be8f0183c8fd7dd3810d53c91af17a4' && 90 || 360 }}
        uses: ./.github/actions/deploy-backend-stack
        env:
          LADDER_V1_PLUS_MONTH_PRICE_ID: ${{ vars.LADDER_V1_PLUS_MONTH_PRICE_ID }}
          LADDER_V1_PLUS_YEAR_PRICE_ID: ${{ vars.LADDER_V1_PLUS_YEAR_PRICE_ID }}
          LADDER_V1_PRO_MONTH_PRICE_ID: ${{ vars.LADDER_V1_PRO_MONTH_PRICE_ID }}
          LADDER_V1_PRO_YEAR_PRICE_ID: ${{ vars.LADDER_V1_PRO_YEAR_PRICE_ID }}
          LADDER_V1_ARCHITECT_MONTH_PRICE_ID: ${{ vars.LADDER_V1_ARCHITECT_MONTH_PRICE_ID }}
          LADDER_V1_ARCHITECT_YEAR_PRICE_ID: ${{ vars.LADDER_V1_ARCHITECT_YEAR_PRICE_ID }}
        with:
          deploy_profile: manual
          # SCA-2283 captain ruling 01a1dca2: finite exact-source path only.
          integration_canary: ${{ github.event.inputs.environment == 'prod' && (needs.validate-production-boundary.outputs.integration_only == 'true' || needs.firestore_readiness.outputs.admitted_sha == '0714c5198be8f0183c8fd7dd3810d53c91af17a4') && 'true' || 'false' }}
          integration_only: ${{ needs.validate-production-boundary.outputs.integration_only || 'false' }}
          integration_image: ${{ needs.validate-production-boundary.outputs.integration_image }}
          post_wrap_guard: ${{ needs.validate-production-boundary.outputs.post_wrap_guard || 'internal' }}
          rollback_revision: ${{ needs.validate-production-boundary.outputs.rollback_revision || 'backend-integration-provfix-off1114' }}
          selected_split_plan: ${{ inputs.selected_split_plan }}
          selected_split_binding: ${{ inputs.selected_split_binding }}
          # 2026-10-24 costcut (live 22:45Z): prod backend-sync runs 6Gi; dev keeps 8Gi.
          backend_sync_memory: ${{ vars.BACKEND_SYNC_MEMORY || (github.event.inputs.environment == 'prod' && '6Gi' || '8Gi') }}
          # Read only for a development dispatch, so a production run never carries it.
          admitted_sha: ${{ needs.firestore_readiness.outputs.admitted_sha }}
          environment: ${{ github.event.inputs.environment }}
          deploy_targets: ${{ github.event.inputs.deploy_targets }}
          cloud_run_service: ${{ github.event.inputs.cloud_run_service || 'all' }}
          deploy_gateway: ${{ github.event.inputs.deploy_gateway }}
          service_images: ${{ github.event.inputs.service_images }}
          release_version: ${{ github.event.inputs.release_version }}
          # Prod: GitHub WIF as omi-ci-deployer-prod@ (no Owner, no key; WS-C).
          # Development: GitHub WIF as omi-ci-deployer-dev@ (WS-D). No JSON key.
          workload_identity_provider: ${{ github.event.inputs.environment == 'prod' && 'projects/208440318997/locations/global/workloadIdentityPools/omi-gha-deploy-prod/providers/github' || 'projects/1031333818730/locations/global/workloadIdentityPools/omi-gha-deploy-dev/providers/github' }}
          workload_identity_service_account: ${{ github.event.inputs.environment == 'prod' && 'omi-ci-deployer-prod@based-hardware.iam.gserviceaccount.com' || 'omi-ci-deployer-dev@based-hardware-dev.iam.gserviceaccount.com' }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          runtime_gcp_project_id: ${{ vars.RUNTIME_GCP_PROJECT_ID }}
          # The known-audio gate runs only for development, where the Firebase
          # auth project (based-hardware) is not this lane's deploy project. The
          # probe token is signed through IAM signJwt as the no-role signer named
          # by this development variable; no signer key is passed.
          firebase_probe_signer_service_account: ${{ vars.FIREBASE_PROBE_SIGNER_SERVICE_ACCOUNT }}
          runtime_env: ${{ vars.ENV }}
          region: ${{ env.REGION }}
          service: ${{ env.SERVICE }}
          transcription_candidate_tag: ${{ github.event.inputs.environment == 'development' && env.TRANSCRIPTION_CANDIDATE_TAG || '' }}
          sync_backfill_budget_alerts: ${{ github.event.inputs.environment == 'prod' && 'true' || 'false' }}
          sync_backfill_alert_channels: ${{ vars.SYNC_BACKFILL_ALERT_NOTIFICATION_CHANNELS }}
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Provision backend route and request storm alerts
        id: backend-route-alert
        if: github.event.inputs.environment == 'prod' && (github.event.inputs.cloud_run_service == '' || github.event.inputs.cloud_run_service == 'all')
        continue-on-error: true
        timeout-minutes: 15
        env:
          ALERT_CHANNELS: ${{ vars.SYNC_BACKFILL_ALERT_NOTIFICATION_CHANNELS }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_WORKFLOW_ROOT:-}" || {
            echo "DEPLOY_WORKFLOW_ROOT is not set; cannot run the workflow-owned route alert script." >&2
            exit 1
          }
          test -f "$DEPLOY_WORKFLOW_ROOT/.github/scripts/ensure_backend_route_5xx_alert.py" || {
            echo "Workflow-owned route alert script not found under $DEPLOY_WORKFLOW_ROOT/.github/scripts." >&2
            exit 1
          }
          POLICY="$(python3 "$DEPLOY_WORKFLOW_ROOT/.github/scripts/ensure_backend_route_5xx_alert.py" \
            --project "$PROJECT_ID" \
            --notification-channels "$ALERT_CHANNELS")"
          STORM_POLICIES="$(python3 "$DEPLOY_WORKFLOW_ROOT/.github/scripts/ensure_request_storm_alerts.py" \
            --project "$PROJECT_ID" \
            --notification-channels "$ALERT_CHANNELS")"
          {
            echo "### Request storm alerts"
            echo ""
            echo "Provisioned edge 429 and sync upload 409-share policies:"
            echo "$STORM_POLICIES"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "### Backend route 5xx alert"
            echo ""
            echo "Provisioned \`${POLICY}\` for metric \`backend_route_5xx\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report backend alert provisioning failure
        if: always() && github.event.inputs.environment == 'prod' && steps.backend-route-alert.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "::warning title=Backend route 5xx alert::Provisioning failed; the deploy is unaffected but the per-route 5xx or request-storm alert policies may be missing or stale. Follow backend/docs/runbooks/backend-route-5xx.md and backend/docs/runbooks/request-storm-alerts.md."
          {
            echo "### Backend route 5xx alert"
            echo ""
            echo "**Provisioning failed.** The deployment remains successful, but the \`backend_route_5xx\` metric or its alert policy, or the edge 429 / sync 409-share policies, may be missing or stale."
            echo ""
            echo "Re-run the deploy to retry provisioning, then follow the [runbook](https://github.com/BasedHardware/omi/blob/main/backend/docs/runbooks/backend-route-5xx.md)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Provision Firestore missing-index alert
        if: github.event.inputs.environment == 'prod' && (github.event.inputs.cloud_run_service == '' || github.event.inputs.cloud_run_service == 'all')
        env:
          ALERT_CHANNELS: ${{ vars.SYNC_BACKFILL_ALERT_NOTIFICATION_CHANNELS }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_WORKFLOW_ROOT:-}" || {
            echo "DEPLOY_WORKFLOW_ROOT is not set; cannot run the workflow-owned missing-index alert script." >&2
            exit 1
          }
          test -f "$DEPLOY_WORKFLOW_ROOT/.github/scripts/ensure_firestore_missing_index_alert.py" || {
            echo "Workflow-owned missing-index alert script not found under $DEPLOY_WORKFLOW_ROOT/.github/scripts." >&2
            exit 1
          }
          python3 "$DEPLOY_WORKFLOW_ROOT/.github/scripts/ensure_firestore_missing_index_alert.py" \
            --project "$PROJECT_ID" \
            --notification-channels "$ALERT_CHANNELS"

  # SCA-3120: the dedicated projection pump is a fifth Cloud Run service with its own
  # composite. It runs only for an explicit manual prod cloud-run-only selection, under
  # the same prod-train concurrency group, admission and break-glass jobs as deploy; the
  # deploy job above never runs for it, so the four-service stack is untouched.
  deploy-projection-pump:
    needs: [validate-production-boundary, firestore_readiness, record_break_glass]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.mode == 'deploy' &&
      github.event.inputs.environment == 'prod' &&
      github.event.inputs.cloud_run_service == 'backend-projection-pump' &&
      needs.validate-production-boundary.result == 'success' &&
      needs.firestore_readiness.result == 'success' &&
      (needs.record_break_glass.result == 'success' || needs.record_break_glass.result == 'skipped')
    environment: prod
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout workflow dispatch surface for composite action
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}

      - name: Deploy backend projection pump
        uses: ./.github/actions/deploy-projection-pump
        with:
          admitted_sha: ${{ needs.firestore_readiness.outputs.admitted_sha }}
          reviewed_control_sha: ${{ inputs.pump_control_sha }}
          release_disposition: ${{ inputs.pump_release_disposition }}
          environment: ${{ github.event.inputs.environment }}
          runtime_env: ${{ vars.ENV }}
          workload_identity_provider: projects/208440318997/locations/global/workloadIdentityPools/omi-gha-deploy-prod/providers/github
          workload_identity_service_account: omi-ci-deployer-prod@based-hardware.iam.gserviceaccount.com
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ env.REGION }}
          release_version: ${{ github.event.inputs.release_version }}

  recover-projection-pump-cap:
    needs: validate-production-boundary
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'recover-pump-cap' &&
      inputs.environment == 'prod' &&
      inputs.cloud_run_service == 'backend-projection-pump' &&
      !inputs.break_glass_lock &&
      !inputs.skip_eligibility_proof &&
      needs.validate-production-boundary.result == 'success'
    environment: prod
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact reviewed recovery controls
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify recovery control checkout
        env:
          CONTROL_SHA: ${{ inputs.pump_control_sha }}
        run: test "$(git rev-parse HEAD)" = "$CONTROL_SHA"
      - name: Authenticate existing production workflow identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/208440318997/locations/global/workloadIdentityPools/omi-gha-deploy-prod/providers/github
          service_account: omi-ci-deployer-prod@based-hardware.iam.gserviceaccount.com
      - name: Set up existing gcloud client
        uses: google-github-actions/setup-gcloud@v3
      - name: Validate, correct and read back only the pump service cap
        env:
          APPROVED_ETAG: ${{ inputs.pump_recovery_etag }}
        run: python3 backend/scripts/recover_projection_pump_cap.py --etag="$APPROVED_ETAG"

  # SOURCE-ONLY PROPOSAL: contract remains closed until approved ingress IDs
  # and existing repository authorization evidence are reviewed and committed.
  operator-qualify-publish:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.environment == 'prod' &&
      github.event.inputs.mode == 'operator-qualify-publish'
    environment: prod
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      # Draft release visibility requires push access. This ephemeral write
      # scope is proposed explicitly, never replaced with a new PAT/secret.
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Checkout immutable workflow controls
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check operator publication controls without external services
        run: python3 -m unittest discover -s backend/scripts/jobstore_operator/tests -v
      - name: Validate mode, protected source, and available scratch
        env:
          REQUESTED_SOURCE: ${{ inputs.release_sha }}
          SKIP_PROOF: ${{ inputs.skip_eligibility_proof }}
          BREAK_GLASS_LOCK: ${{ inputs.break_glass_lock }}
          SERVICE_IMAGES: ${{ inputs.service_images }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          SELECTED_SPLIT_PLAN: ${{ inputs.selected_split_plan }}
          SELECTED_SPLIT_BINDING: ${{ inputs.selected_split_binding }}
        run: |
          set -euo pipefail
          [[ -z "$SELECTED_SPLIT_PLAN" && -z "$SELECTED_SPLIT_BINDING" ]] || exit 1
          test "$SKIP_PROOF" = false
          test "$BREAK_GLASS_LOCK" = false
          test -z "$SERVICE_IMAGES"
          python3 backend/scripts/jobstore_operator/preflight.py
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          for source in "$REQUESTED_SOURCE" "$GITHUB_WORKFLOW_SHA"; do
            git merge-base --is-ancestor "$source" origin/main
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release-eligibility.yml/runs?event=push&branch=main&status=completed&head_sha=${source}&per_page=100" > "$RUNNER_TEMP/operator-proof.json"
            python3 .github/scripts/verify_backend_release_admission.py --sha "$source" --repository "$GITHUB_REPOSITORY" --workflow-runs "$RUNNER_TEMP/operator-proof.json"
          done
      - name: Fetch only approved private draft asset identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 backend/scripts/jobstore_operator/operator_ingress.py --contract backend/scripts/jobstore_operator/artifact-contract.json --directory "$RUNNER_TEMP/operator-input"
      - name: Qualify the exact image on the native AMD64 runner
        env:
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          python3 backend/scripts/jobstore_operator/qualify_operator.py --contract backend/scripts/jobstore_operator/artifact-contract.json --directory "$RUNNER_TEMP/operator-input" --output "$RUNNER_TEMP/operator-native-qualification.json"
      - name: Google Auth only after native qualification (existing WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/208440318997/locations/global/workloadIdentityPools/omi-gha-deploy-prod/providers/github
          service_account: omi-ci-deployer-prod@based-hardware.iam.gserviceaccount.com
      - name: Set up existing gcloud client
        uses: google-github-actions/setup-gcloud@v3
      - name: Preserve and verify the dedicated operator digest
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          python3 backend/scripts/jobstore_operator/publish_operator.py --contract backend/scripts/jobstore_operator/artifact-contract.json --directory "$RUNNER_TEMP/operator-input" --qualification "$RUNNER_TEMP/operator-native-qualification.json" --output "$RUNNER_TEMP/operator-publication.json"
      - name: Retain only bounded qualification and publication receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jobstore-operator-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/operator-native-qualification.json
            ${{ runner.temp }}/operator-native-qualification.log
            ${{ runner.temp }}/operator-native-qualification.failure.json
            ${{ runner.temp }}/operator-native-qualification.failure.log
            ${{ runner.temp }}/operator-native-qualification.cleanup.json
            ${{ runner.temp }}/operator-publication.json
            ${{ runner.temp }}/operator-proof.json

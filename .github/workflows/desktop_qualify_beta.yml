name: Qualify Desktop Beta Candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Newest v*-macos candidate tag to qualify on the M1 Studio'
        required: true
        type: string

run-name: Qualify desktop beta ${{ inputs.release_tag }}
permissions:
  contents: read

env:
  DEVELOPMENT_GCP_PROJECT_ID: based-hardware-dev
  FIREBASE_AUTH_PROJECT_ID: based-hardware

concurrency:
  group: desktop-beta-qualification-m1
  cancel-in-progress: false

jobs:
  qualify-m1-studio:
    environment: beta
    runs-on: [self-hosted, macos, omi-desktop-qualification, omi-qual-m1-studio]
    timeout-minutes: 250
    permissions:
      contents: write
    outputs:
      qualified: ${{ steps.publish.outputs.qualified }}
    steps:
      - name: Create run-isolated qualification staging
        working-directory: ${{ runner.temp }}
        env:
          QUALIFICATION_STAGE: ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/desktop-beta-qualification/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$QUALIFICATION_STAGE" = "$expected"
          test ! -e "$QUALIFICATION_STAGE" || { echo "Refusing reused qualification staging directory" >&2; exit 1; }
          (umask 077; mkdir -p "$QUALIFICATION_STAGE/assets")
          test ! -L "$QUALIFICATION_STAGE"
          test "$(python3 -c 'import os, stat, sys; print(oct(stat.S_IMODE(os.stat(sys.argv[1]).st_mode))[2:])' "$QUALIFICATION_STAGE")" = 700
      - name: Checkout cache reclaim authority from exact candidate
        working-directory: ${{ runner.temp }}
        env:
          QUALIFICATION_STAGE: ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ref: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          source_dir="$QUALIFICATION_STAGE/source"
          test -d "$QUALIFICATION_STAGE"
          test ! -e "$source_dir"
          test -n "$ref"
          test "$ref" = "$RELEASE_TAG"
          git init --quiet "$source_dir"
          git -C "$source_dir" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -C "$source_dir" sparse-checkout init --no-cone
          git -C "$source_dir" sparse-checkout set \
            desktop/macos/scripts/qualification-cache-reclaim.py \
            desktop/macos/scripts/qualification-runner-self-clean.py \
            desktop/macos/scripts/qualification-watchdog.py \
            scripts/dev-harness/dev_harness
          GIT_TERMINAL_PROMPT=0 git -C "$source_dir" fetch --force --depth=1 --filter=blob:none origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git -C "$source_dir" checkout --quiet --detach "refs/tags/$RELEASE_TAG"
          test -x "$source_dir/desktop/macos/scripts/qualification-cache-reclaim.py"
      - name: Reclaim idle qualification cache and enforce runner capacity
        working-directory: ${{ runner.temp }}
        env:
          QUALIFICATION_STAGE: ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}
          OMI_QUALIFICATION_MINIMUM_FREE_KIB: 33554432
          OMI_QUALIFICATION_MINIMUM_FREE_INODES: 65536
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/desktop-beta-qualification/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$QUALIFICATION_STAGE" = "$expected"
          test -d "$QUALIFICATION_STAGE/source"
          cache_root="${OMI_QUALIFICATION_SWIFT_CACHE_ROOT:-$HOME/Library/Caches/OmiDesktop/qualification-swiftpm-v2}"
          lease_root="${OMI_QUALIFICATION_LEASE_ROOT:-${TMPDIR:-/tmp}/omi-desktop-qualification}"
          python3 "$QUALIFICATION_STAGE/source/desktop/macos/scripts/qualification-watchdog.py" \
            --label runner-self-clean \
            --heartbeat-seconds 45 \
            --timeout-seconds 1200 \
            -- python3 "$QUALIFICATION_STAGE/source/desktop/macos/scripts/qualification-runner-self-clean.py" \
            --repo-root "$QUALIFICATION_STAGE/source" \
            --cache-root "$cache_root" \
            --qualification-lease-root "$lease_root" \
            --stage-root "$RUNNER_TEMP/desktop-beta-qualification" \
            --fault-temp-root "${TMPDIR:-$RUNNER_TEMP}" \
            --capacity-path "$RUNNER_TEMP" \
            --current-run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --minimum-free-kib "${OMI_QUALIFICATION_MINIMUM_FREE_KIB:-33554432}" \
            --minimum-free-inodes "${OMI_QUALIFICATION_MINIMUM_FREE_INODES:-65536}" \
            --minimum-age-seconds 3600 \
            --max-entries 16 \
            --max-reclaim-kib 134217728 \
            --report "$QUALIFICATION_STAGE/runner-hygiene.json"
      - name: Expand exact candidate checkout
        working-directory: ${{ runner.temp }}
        env:
          QUALIFICATION_STAGE: ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          source_dir="$QUALIFICATION_STAGE/source"
          test -d "$source_dir/.git"
          GIT_TERMINAL_PROMPT=0 git -C "$source_dir" fetch --force --prune --tags --filter=blob:none origin
          git -C "$source_dir" sparse-checkout disable
          git -C "$source_dir" checkout --quiet --detach "refs/tags/$RELEASE_TAG"
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.OMI_BOT_APP_ID }}
          private-key: ${{ secrets.OMI_BOT_PRIVATE_KEY }}
      - name: Bind tag and checkout to the same immutable commit
        id: candidate
        working-directory: ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}/source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch --force origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          TARGET_SHA=$(git rev-parse "$RELEASE_TAG^{commit}")
          test "$TARGET_SHA" = "$(git rev-parse 'HEAD^{commit}')"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
      - name: Verify live desktop-backend chat compatibility
        env:
          QUALIFICATION_STAGE: ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 \
            https://api.omiapi.com/v1/health \
            > "$QUALIFICATION_STAGE/python-backend-health.json"
          jq -e '.status == "ok"' "$QUALIFICATION_STAGE/python-backend-health.json" >/dev/null
          curl -fsS --max-time 15 \
            https://desktop-backend-dt5lrfkkoa-uc.a.run.app/health \
            > "$QUALIFICATION_STAGE/desktop-backend-health.json"
          jq -e '
            .status == "healthy"
            and .service == "omi-desktop-backend"
            and .chat_contract_version == "1"
          ' "$QUALIFICATION_STAGE/desktop-backend-health.json" >/dev/null
          jq '{
            chat_contract_version,
            python_status: "ok",
            schema_version: 1,
            service,
            status
          }' "$QUALIFICATION_STAGE/desktop-backend-health.json" \
            > "$QUALIFICATION_STAGE/desktop-backend-compatibility.json"
          rm -f "$QUALIFICATION_STAGE/python-backend-health.json"
          rm -f "$QUALIFICATION_STAGE/desktop-backend-health.json"
      - name: Authenticate release probe for production Firebase continuity
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      - name: Stage production Firebase probe signer
        env:
          FIREBASE_PROBE_SIGNER_B64: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          QUALIFICATION_STAGE: ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          signer_file="$QUALIFICATION_STAGE/firebase-probe-signer.json"
          test ! -e "$signer_file"
          printf '%s' "$FIREBASE_PROBE_SIGNER_B64" | base64 --decode > "$signer_file"
          chmod 600 "$signer_file"
      - name: Prove production Firebase UID continuity on Beta development authorities
        working-directory: ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}/source
        env:
          QUALIFICATION_STAGE: ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          token_file="$QUALIFICATION_STAGE/firebase-probe-token"
          test ! -e "$token_file"
          umask 077
          : > "$token_file"
          python3 backend/scripts/firebase_release_probe_token.py \
            --secret-project "$DEVELOPMENT_GCP_PROJECT_ID" \
            --firebase-project "$FIREBASE_AUTH_PROJECT_ID" \
            --signer-credentials-file="$QUALIFICATION_STAGE/firebase-probe-signer.json" \
            --token-output "$token_file"
          python3 backend/scripts/probe_beta_uid_continuity.py \
            --bearer-token-file "$token_file" \
            --evidence "$QUALIFICATION_STAGE/beta-uid-continuity.json"
          rm -f "$token_file"
      - name: Fetch candidate release inputs into this run only
        working-directory: ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}/source
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          QUALIFICATION_STAGE: ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$REPO" --json tagName,body,isDraft,isPrerelease,publishedAt,assets > "$QUALIFICATION_STAGE/release.json"
          gh release download "$RELEASE_TAG" --repo "$REPO" --pattern desktop-smoke-result.json --dir "$QUALIFICATION_STAGE"
          if jq -e '[.assets[].name] | index("desktop-smoke-result-beta.json")' "$QUALIFICATION_STAGE/release.json" >/dev/null; then
            gh release download "$RELEASE_TAG" --repo "$REPO" --pattern desktop-smoke-result-beta.json --dir "$QUALIFICATION_STAGE"
          fi
          gh release download "$RELEASE_TAG" --repo "$REPO" --pattern Omi.zip --pattern omi.dmg --dir "$QUALIFICATION_STAGE/assets"
          if jq -e '[.assets[].name] | index("Omi.Beta.zip") and index("omi-beta.dmg")' "$QUALIFICATION_STAGE/release.json" >/dev/null; then
            gh release download "$RELEASE_TAG" --repo "$REPO" --pattern Omi.Beta.zip --pattern omi-beta.dmg --dir "$QUALIFICATION_STAGE/assets"
          fi
      - name: Validate candidate evidence
        working-directory: ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}/source
        env:
          QUALIFICATION_STAGE: ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_SHA: ${{ steps.candidate.outputs.target_sha }}
        run: |
          set -euo pipefail
          LATEST_TAG=$(git for-each-ref --count=1 --sort=-v:refname --format='%(refname:strip=2)' 'refs/tags/v*-macos')
          python3 .github/scripts/check-desktop-auto-beta-candidate.py --release-json "$QUALIFICATION_STAGE/release.json" --smoke-result "$QUALIFICATION_STAGE/desktop-smoke-result.json" --beta-smoke-result "$QUALIFICATION_STAGE/desktop-smoke-result-beta.json" --release-tag "$RELEASE_TAG" --latest-tag "$LATEST_TAG" --tag-sha "$TARGET_SHA" --checkout-sha "$TARGET_SHA" --output "$QUALIFICATION_STAGE/candidate-gate.json"
      - name: Qualify exact candidate on the M1 Studio hermetic stack
        id: qualify
        timeout-minutes: 245
        working-directory: ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}/source
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          QUALIFICATION_STAGE: ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}
          OMI_QUALIFICATION_CLEANUP_CONTEXT: ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}/lease-context.json
          OMI_QUALIFICATION_TIMINGS_FILE: ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}/phase-timings.json
          OMI_QUALIFICATION_FAULT_PREFLIGHT_REPORT: ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}/fault-listener-preflight.json
        run: |
          set -euo pipefail
          python3 desktop/macos/scripts/qualification-watchdog.py \
            --label m1-desktop-qualification \
            --heartbeat-seconds 45 \
            --timeout-seconds 14400 \
            -- desktop/macos/scripts/qualify-desktop-beta.sh \
              --automatic \
              --github-actions-artifact \
              --signed-smoke-result "$QUALIFICATION_STAGE/desktop-smoke-result.json" \
              --candidate-gate-result "$QUALIFICATION_STAGE/candidate-gate.json" \
              "$RELEASE_TAG"
      - name: Create immutable qualification evidence
        id: evidence
        working-directory: ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}/source
        env:
          QUALIFICATION_STAGE: ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_SHA: ${{ steps.candidate.outputs.target_sha }}
        run: |
          set -euo pipefail
          BETA_ASSETS=()
          if [ -f "$QUALIFICATION_STAGE/assets/Omi.Beta.zip" ] && [ -f "$QUALIFICATION_STAGE/assets/omi-beta.dmg" ]; then
            BETA_ASSETS=(--asset Omi.Beta.zip="$QUALIFICATION_STAGE/assets/Omi.Beta.zip" --asset omi-beta.dmg="$QUALIFICATION_STAGE/assets/omi-beta.dmg")
          fi
          python3 .github/scripts/desktop_qualification_evidence.py build --release-json "$QUALIFICATION_STAGE/release.json" --release-tag "$RELEASE_TAG" --source-sha "$TARGET_SHA" --candidate-gate "$QUALIFICATION_STAGE/candidate-gate.json" --qualification-run-id "$GITHUB_RUN_ID" --asset Omi.zip="$QUALIFICATION_STAGE/assets/Omi.zip" --asset omi.dmg="$QUALIFICATION_STAGE/assets/omi.dmg" "${BETA_ASSETS[@]}" --beta-uid-continuity-evidence "$QUALIFICATION_STAGE/beta-uid-continuity.json" --evidence "$QUALIFICATION_STAGE/qualification-evidence.json"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-qualification-evidence-${{ inputs.release_tag }}-m1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}/qualification-evidence.json
          if-no-files-found: error
          overwrite: false
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-qualification-backend-compatibility-${{ inputs.release_tag }}-m1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}/desktop-backend-compatibility.json
          if-no-files-found: error
          overwrite: false
      - name: Attach immutable qualification evidence
        id: publish
        working-directory: ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}/source
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          QUALIFICATION_STAGE: ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.candidate.outputs.target_sha }}
        run: |
          set -euo pipefail
          digest=$(shasum -a 256 "$QUALIFICATION_STAGE/qualification-evidence.json" | awk '{print $1}')
          asset="qualification-evidence-${TARGET_SHA}-${digest}.json"
          if ! gh release view "$RELEASE_TAG" --repo "$REPO" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
            gh release upload "$RELEASE_TAG" --repo "$REPO" "$QUALIFICATION_STAGE/qualification-evidence.json#$asset"
          fi
          echo "qualified=true" >> "$GITHUB_OUTPUT"
      - name: Finalize only this authenticated qualification lease
        if: always()
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        env:
          QUALIFICATION_STAGE: ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          rm -f "$QUALIFICATION_STAGE/firebase-probe-signer.json" "$QUALIFICATION_STAGE/firebase-probe-token"
          expected="$RUNNER_TEMP/desktop-beta-qualification/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test -n "$QUALIFICATION_STAGE"
          test "$QUALIFICATION_STAGE" = "$expected"
          test -d "$QUALIFICATION_STAGE"
          test ! -L "$QUALIFICATION_STAGE"
          context="$QUALIFICATION_STAGE/lease-context.json"
          cleanup="$QUALIFICATION_STAGE/cleanup-evidence.json"
          if [ -f "$context" ]; then
            worktree=$(jq -r .worktree "$context"); lease_id=$(jq -r .lease_id "$context"); token=$(jq -r .token "$context")
            retained=$(jq -r .retained_runs "$context"); age=$(jq -r .retention_age_seconds "$context")
            cache_sha=$(jq -r .cache_source_sha "$context"); cache_lease_id=$(jq -r .cache_lease_id "$context")
            cache_owner_pid=$(jq -r .cache_owner_pid "$context"); cache_token=$(jq -r .cache_token "$context")
            echo "::add-mask::$token"
            echo "::add-mask::$cache_token"
            # Best-effort: authenticated release now skips unproven listeners rather
            # than failing the job after green behavioral qualification (#10779).
            if OMI_HARNESS_OWNERSHIP_TOKEN="$token" "$worktree/desktop/macos/scripts/qualification-lease-command.sh" release "$worktree" "$lease_id" "$token" "$retained" "$age"; then
              release_status=released
            else
              release_status=release-failed
              echo "lease finalize release failed (non-gating): status=$release_status" >&2
            fi
            if "$worktree/desktop/macos/scripts/qualification-swift-cache.sh" release "$cache_sha" "$cache_lease_id" "$cache_owner_pid" "$cache_token"; then
              :
            else
              echo "cache finalize release failed (non-gating)" >&2
              if [ "$release_status" = released ]; then
                release_status=cache-release-failed
              fi
            fi
            jq -n --arg lease_id "$lease_id" --arg cleanup_status "$release_status" \
              '{lease_id: $lease_id, cleanup_status: $cleanup_status}' > "$cleanup"
          else
            printf '%s\n' '{"cleanup_status":"no-lease-acquired"}' > "$cleanup"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-qualification-cleanup-${{ inputs.release_tag }}-m1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}/runner-hygiene.json
            ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}/cleanup-evidence.json
            ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}/fault-listener-preflight.json
            ${{ runner.temp }}/desktop-beta-qualification/${{ github.run_id }}-${{ github.run_attempt }}/phase-timings.json
          if-no-files-found: error
          overwrite: false

  verdict:
    needs: qualify-m1-studio
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require M1 Studio qualification evidence
        env:
          M1_QUALIFIED: ${{ needs.qualify-m1-studio.outputs.qualified }}
        run: test "$M1_QUALIFIED" = true

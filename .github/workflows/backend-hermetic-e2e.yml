name: Backend Hermetic E2E

on:
  # Nightly calls run these same jobs against one immutable main snapshot.
  workflow_call:
    inputs:
      nightly_main_sha:
        description: Main SHA pinned by the unfiltered nightly caller
        type: string
        required: false
        default: ''
  pull_request:
    branches: main
  push:
    branches: main
  schedule:
    - cron: '53 4 * * *'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  # PRs cancel their own older runs. Main pushes share one ref-keyed group
  # with cancel-in-progress false: the running gauntlet finishes and only the
  # newest pending main SHA runs next, so a burst of merges no longer queues
  # a full superseded suite for every intermediate SHA. The daily cron,
  # manual dispatches and merge-queue attempts keep per-run groups: sharing
  # the push group would let a cron evict the newest pending push run (or a
  # push evict the day's gauntlet), and a cancelled push check fails
  # scripts/pre_push_ci_verified.py for that SHA.
  group: backend-hermetic-e2e-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && github.ref) || format('run-{0}', github.run_id) }}-${{ inputs.nightly_main_sha != '' && format('nightly-{0}', github.run_id) || 'normal' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Abort a stalled git HTTP transfer instead of hanging. Hosted-runner fetches
  # from github.com intermittently stop receiving data for 7-10 minutes before
  # the connection resets (Backend Hermetic E2E run 39435458398 spent 498 s in
  # "Checkout code" and hit its 10-minute cap). With these set, git aborts any
  # transfer that stays under 1 KB/s for 60 s, and actions/checkout retries the
  # fetch (its built-in 3 attempts); a healthy depth-1 fetch takes ~20 s.
  # Applies to every git network call in the workflow, including script steps.
  GIT_HTTP_LOW_SPEED_LIMIT: "1000"
  GIT_HTTP_LOW_SPEED_TIME: "60"

jobs:
  scope:
    name: Detect Hermetic Backend Scope
    runs-on: ubuntu-latest
    # Checkout only the event SHA, then fetch one blobless base history for
    # name-only scope diffs against the live base. Fetching every branch and
    # tag made the old all-refs checkout exceed its five-minute step cap.
    # The job cap bounds checkout plus the targeted base fetch below.
    timeout-minutes: 10
    outputs:
      applies: ${{ inputs.nightly_main_sha != '' && 'true' || (steps.scope.outputs.applies) }}
      full_ci: ${{ inputs.nightly_main_sha != '' && 'true' || (steps.scope.outputs.full_ci) }}
      run_listen: ${{ inputs.nightly_main_sha != '' && 'true' || (steps.scope.outputs.run_listen) }}
      run_sync: ${{ inputs.nightly_main_sha != '' && 'true' || (steps.scope.outputs.run_sync) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          ref: ${{ inputs.nightly_main_sha || github.sha }}
          filter: blob:none

      - name: Fetch hermetic scope base history
        if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group'
        timeout-minutes: 3
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          # Clear HEAD's shallow boundary so three-dot diffs can find a merge base.
          case "$EVENT_NAME" in
            pull_request) git fetch --unshallow --filter=blob:none --no-tags --prune origin \
                "+refs/heads/${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}" ;;
            merge_group)  git fetch --unshallow --filter=blob:none --no-tags origin "$MERGE_GROUP_BASE_SHA" ;;
            push)         git fetch --unshallow --filter=blob:none --no-tags origin "${PUSH_BEFORE:-HEAD^}" ;;
          esac

      - name: Resolve current CI tier
        id: tier
        uses: ./.github/actions/ci-tier

      - name: Decide whether hermetic backend coverage applies
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_CI: ${{ steps.tier.outputs.full_ci }}
          # Resolve the PR base live against the checkout (matching
          # detect-changes) rather than the event-payload base.sha, which can be
          # stale for a queued run (FC-stale-event-payload-diff-base, #10785).
          PR_BASE_REF: origin/${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          echo "full_ci=$FULL_CI" >> "$GITHUB_OUTPUT"

          case "$EVENT_NAME" in
            pull_request) base_sha="$PR_BASE_REF" ;;
            merge_group) base_sha="$MERGE_GROUP_BASE_SHA" ;;
            push) base_sha="${PUSH_BEFORE:-HEAD^}" ;;
            schedule|workflow_dispatch)
              echo "applies=true" >> "$GITHUB_OUTPUT"
              echo "run_listen=true" >> "$GITHUB_OUTPUT"
              echo "run_sync=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "Unsupported event for hermetic backend scope: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          # Fail closed: if the scope base cannot be resolved (missing event sha,
          # shallow/failed no-blob history fetch, or on-demand missing object),
          # fail the job rather than silently treating the repo as out of scope.
          # A silent `applies=false` would skip the hermetic backend gate.
          if [[ -z "$base_sha" ]] || ! git cat-file -e "${base_sha}^{commit}"; then
            echo "Cannot resolve hermetic backend scope base: ${base_sha:-<empty>}" >&2
            exit 1
          fi

          # set -euo pipefail aborts here if the (partial-clone) history fetch
          # fails mid-diff; a failed diff must never yield empty -> applies=false.
          changed_files="$(git diff --name-only "$base_sha"...HEAD)"
          printf '%s\n' "$changed_files"
          hermetic_applies=false
          if grep -Eq '^(backend/|package\.json$|package-lock\.json$|\.github/workflows/backend-hermetic-e2e\.yml$)' <<<"$changed_files"; then
            hermetic_applies=true
            echo "applies=true" >> "$GITHUB_OUTPUT"
          else
            echo "applies=false" >> "$GITHUB_OUTPUT"
          fi
          # Both contract gauntlets follow the full hermetic scope: every PR the
          # scope admits runs both suites. The previous per-suite path filters
          # matched only selected integration owners, so #23919 (sync
          # processing under backend/utils/sync/**, backend/database/) skipped
          # the Sync Cloud Tasks gauntlet and the break reached main unseen
          # behind a green "skipped" verdict in the merge gate. Cost: the two
          # gauntlets add ~8.3 + ~7.0 runner-minutes to a backend PR that
          # previously matched neither (see .github/ci-budget.yaml).
          echo "run_listen=$hermetic_applies" >> "$GITHUB_OUTPUT"
          echo "run_sync=$hermetic_applies" >> "$GITHUB_OUTPUT"

  hermetic-e2e:
    name: Hermetic Backend E2E
    runs-on: ubuntu-latest
    # 10 minutes for setup + tests, plus the 10-minute checkout backstop below,
    # so a slow-but-recovering checkout no longer eats the test budget.
    timeout-minutes: 20
    needs: scope
    if: needs.scope.outputs.applies == 'true' && needs.scope.outputs.full_ci == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.nightly_main_sha || github.sha }}
        # Healthy checkout is ~25 s. The workflow-level GIT_HTTP_LOW_SPEED_*
        # env retries transfers below 1 KB/s, but a trickling fetch can take
        # longer than five minutes (498s observed). Bound it at ten minutes.
        timeout-minutes: 10

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        # astral-sh/setup-uv v7, pinned to an immutable commit for CI supply-chain stability.
        uses: astral-sh/setup-uv@ecd24dd710f2fb0dca1693a67af11fc4a5c5ec84
        with:
          # Exact version resolves locally; an unset version means "latest",
          # which fetches the astral-sh/versions manifest and has hard-failed
          # CI on that network call. Matches backend/Dockerfile UV_VERSION.
          version: "0.11.13"
          enable-cache: true
          cache-dependency-glob: backend/pylock*.toml

      - name: Install backend and e2e dependencies
        working-directory: backend
        run: uv pip sync pylock.toml --system

      - name: Restore tokenizer cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tiktoken-cache
          key: tiktoken-${{ runner.os }}-${{ hashFiles('backend/pylock.toml') }}

      - name: Prewarm tokenizer cache
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken-cache
        run: python backend/scripts/prewarm_tiktoken_cache.py

      - name: Run hermetic backend e2e harness
        env:
          E2E_PYTEST_TIMEOUT: 120s
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken-cache
        run: bash backend/testing/e2e/run.sh -q --tb=short

  listen-pusher-stack-gauntlet:
    name: Listen Pusher Stack Gauntlet
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: scope
    if: needs.scope.outputs.applies == 'true' && needs.scope.outputs.full_ci == 'true' && needs.scope.outputs.run_listen == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.nightly_main_sha || github.sha }}
        timeout-minutes: 10

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@ecd24dd710f2fb0dca1693a67af11fc4a5c5ec84
        with:
          # Exact version resolves locally; an unset version means "latest",
          # which fetches the astral-sh/versions manifest and has hard-failed
          # CI on that network call. Matches backend/Dockerfile UV_VERSION.
          version: "0.11.13"
          enable-cache: true
          cache-dependency-glob: backend/pylock*.toml

      - name: Install backend dependencies in the gauntlet virtualenv
        working-directory: backend
        run: |
          uv venv .venv
          uv pip sync pylock.toml --python .venv/bin/python

      - name: Set up Node.js for the Firestore emulator
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned Firebase CLI dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci --ignore-scripts --prefer-offline --no-audit --fund=false; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "Pinned Firebase CLI dependency install failed after 3 attempts." >&2
              npm cache verify || true
              exit 1
            fi
            echo "npm ci failed on attempt $attempt/3; verifying cache before bounded retry." >&2
            npm cache verify
            sleep "$attempt"
          done

      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Redis server
        # The harness spawns its own `redis-server` binary per test on an
        # ephemeral port (see backend/testing/*/run.py), so this needs the
        # actual package installed, not a `services:` container.
        #
        # apt against the default Azure-mirror apt source on hosted runners
        # can silently stall (connects but never completes the transfer)
        # instead of failing, which previously let this step hang until the
        # job's 20-minute timeout killed it with an opaque "operation was
        # canceled". Bound each apt network attempt and retry a few times so
        # a stalled mirror fails over quickly, and cap the step itself as a
        # backstop.
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 install --yes redis-server

      - name: Run listen to pusher stack gauntlet
        run: npm run test:listen-pusher-stack:emulator -- --state-dir "$RUNNER_TEMP/listen-pusher-stack"

      - name: Show listen gauntlet process diagnostics on failure
        if: failure()
        run: |
          state_dir="$RUNNER_TEMP/listen-pusher-stack"
          if [[ -d "$state_dir" ]]; then
            find "$state_dir" -type f \( -name '*.log' -o -name '*.jsonl' \) -print -exec tail -n 160 {} \;
          else
            echo "Listen gauntlet state directory was not retained."
          fi

  sync-cloud-tasks-stack-gauntlet:
    name: Sync Cloud Tasks Stack Gauntlet
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: scope
    if: needs.scope.outputs.applies == 'true' && needs.scope.outputs.full_ci == 'true' && needs.scope.outputs.run_sync == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.nightly_main_sha || github.sha }}
        timeout-minutes: 10

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@ecd24dd710f2fb0dca1693a67af11fc4a5c5ec84
        with:
          # Exact version resolves locally; an unset version means "latest",
          # which fetches the astral-sh/versions manifest and has hard-failed
          # CI on that network call. Matches backend/Dockerfile UV_VERSION.
          version: "0.11.13"
          enable-cache: true
          cache-dependency-glob: backend/pylock*.toml

      - name: Install backend dependencies in the gauntlet virtualenv
        working-directory: backend
        run: |
          uv venv .venv
          uv pip sync pylock.toml --python .venv/bin/python

      - name: Set up Node.js for the Firestore emulator
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned Firebase CLI dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci --ignore-scripts --prefer-offline --no-audit --fund=false; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "Pinned Firebase CLI dependency install failed after 3 attempts." >&2
              npm cache verify || true
              exit 1
            fi
            echo "npm ci failed on attempt $attempt/3; verifying cache before bounded retry." >&2
            npm cache verify
            sleep "$attempt"
          done

      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Redis server
        # The harness spawns its own `redis-server` binary per test on an
        # ephemeral port (see backend/testing/*/run.py), so this needs the
        # actual package installed, not a `services:` container.
        #
        # apt against the default Azure-mirror apt source on hosted runners
        # can silently stall (connects but never completes the transfer)
        # instead of failing, which previously let this step hang until the
        # job's 20-minute timeout killed it with an opaque "operation was
        # canceled". Bound each apt network attempt and retry a few times so
        # a stalled mirror fails over quickly, and cap the step itself as a
        # backstop.
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 install --yes redis-server

      - name: Run Sync Cloud Tasks stack gauntlet
        run: npm run test:sync-cloud-tasks-stack:emulator

  # Advisory (not in the merge gate, branch protection or any ruleset): the pipeline lab's committed
  # capture -> Finish -> Home scenarios on a local Firestore emulator and Redis, STT from committed
  # cassettes (--stt replay), LLM answers from the lab's fake gateway; no secrets, no network peers
  # beyond loopback.
  # Runs on every pull request and merge-queue run and always reports, failing closed:
  # - it skips the scenarios only when the scope job succeeded and said exactly applies=false (no change
  #   under backend/, package.json, package-lock.json or this workflow); the summary and a notice say so
  #   ("not run", never "passed"). A failed, cancelled or skipped scope job, or an empty or unexpected
  #   output, runs the full suite and warns.
  # - a run passes only when every committed scenario (every scenario/scenarios/*.json, found at run
  #   time, so a new file is covered without editing this job) ran twice and evaluated its checks
  #   (`scenario summary --require-committed`); a run that executed nothing is a failure.
  # The run directory is uploaded so anyone can download it and open
  # `python -m testing.pipeline_lab scenario view DIR` locally.
  pipeline-lab-scenarios:
    name: Pipeline Lab Scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: scope
    if: ${{ !cancelled() }}
    # The lab starts its own Firestore emulator (multi-project, one project per run) and uses this Redis
    # (one leased database per run; scenario/stack.py), so no apt install is needed.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    steps:
      - name: Decide whether scenarios apply
        id: applies
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCOPE_APPLIES: ${{ needs.scope.outputs.applies }}
        run: |
          # Fail closed: only a successful scope that answered exactly "false" skips the scenarios.
          if [[ "$SCOPE_RESULT" == 'success' && "$SCOPE_APPLIES" == 'false' ]]; then
            reason='no change under backend/, package.json, package-lock.json or this workflow'
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pipeline lab scenarios not run::${reason}; no scenario executed."
            echo "**Pipeline lab scenarios: not run** (${reason}). No scenario executed; this is not a pass." \
              >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$SCOPE_RESULT" == 'success' && "$SCOPE_APPLIES" == 'true' ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            note="Hermetic scope result '${SCOPE_RESULT}', applies '${SCOPE_APPLIES}': running the full suite."
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Pipeline lab scope unknown::${note}"
            echo "**Pipeline lab scope unknown.** ${note}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout code
        if: steps.applies.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.nightly_main_sha || github.sha }}
        timeout-minutes: 10

      - name: Set up Python
        if: steps.applies.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        if: steps.applies.outputs.run == 'true'
        uses: astral-sh/setup-uv@ecd24dd710f2fb0dca1693a67af11fc4a5c5ec84
        with:
          version: "0.11.13"
          enable-cache: true
          cache-dependency-glob: backend/pylock*.toml

      - name: Install backend dependencies
        if: steps.applies.outputs.run == 'true'
        working-directory: backend
        run: |
          uv venv .venv
          uv pip sync pylock.toml --python .venv/bin/python

      - name: Set up Node.js for the Firestore emulator
        if: steps.applies.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned Firebase CLI dependencies
        if: steps.applies.outputs.run == 'true'
        run: |
          for attempt in 1 2 3; do
            if npm ci --ignore-scripts --prefer-offline --no-audit --fund=false; then
              echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "Pinned Firebase CLI dependency install failed after 3 attempts." >&2
              npm cache verify || true
              exit 1
            fi
            echo "npm ci failed on attempt $attempt/3; verifying cache before bounded retry." >&2
            npm cache verify
            sleep "$attempt"
          done

      - name: Set up Java for the Firestore emulator
        if: steps.applies.outputs.run == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Run pipeline lab scenarios
        if: steps.applies.outputs.run == 'true'
        id: scenarios
        working-directory: backend
        env:
          RUN_DIR: ${{ runner.temp }}/pipeline-lab-scenarios
          OMI_PIPELINE_LAB_REDIS: 127.0.0.1:6379
        run: |
          set +e
          .venv/bin/python -m testing.pipeline_lab scenario run --jobs 4 --repeat 2 --json --stt replay \
            --keep "$RUN_DIR" > "$RUNNER_TEMP/pipeline-lab-verdict.json"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          coverage=1
          if [[ -f "$RUN_DIR/verdict.json" ]]; then
            # Exit 1 unless every committed scenario ran x2 and evaluated its checks (no silent green).
            set +e
            .venv/bin/python -m testing.pipeline_lab scenario summary "$RUN_DIR" --require-committed --repeat 2 \
              >> "$GITHUB_STEP_SUMMARY"
            coverage=$?
            set -e
            echo "Download the pipeline-lab-scenarios artifact and run \`scenario view\` on it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Pipeline lab scenarios: no verdict** (exit $code)" >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/pipeline-lab-verdict.json" >> "$GITHUB_STEP_SUMMARY" || true
          fi
          echo "coverage=$coverage" >> "$GITHUB_OUTPUT"

      - name: Upload the scenario run directory
        if: ${{ !cancelled() && steps.applies.outputs.run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-lab-scenarios
          path: ${{ runner.temp }}/pipeline-lab-scenarios
          retention-days: 14
          if-no-files-found: warn

      # Always runs (unless cancelled) and is the job's verdict: a skip passes only when decided above;
      # a run passes only with exit 0 and full coverage; anything else (setup failed before a verdict, a
      # missing output) fails.
      - name: Report the scenario verdict
        if: ${{ !cancelled() }}
        env:
          RUN: ${{ steps.applies.outputs.run }}
          CODE: ${{ steps.scenarios.outputs.code }}
          COVERAGE: ${{ steps.scenarios.outputs.coverage }}
        run: |
          if [[ "$RUN" == 'false' ]]; then
            echo "Pipeline lab scenarios not run: no change in scope (see the notice)."
            exit 0
          fi
          if [[ "$RUN" != 'true' || -z "$CODE" ]]; then
            echo "Pipeline lab scenarios gave no verdict (run '$RUN', exit '$CODE'): a step before them failed." >&2
            echo "**Pipeline lab scenarios: no verdict** (a setup step failed before the scenarios ran)." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$CODE" != '0' ]]; then
            echo "Pipeline lab scenarios did not pass (exit $CODE); see the job summary and the artifact." >&2
            exit 1
          fi
          if [[ "$COVERAGE" != '0' ]]; then
            echo "Pipeline lab scenarios did not cover every committed scenario; see the job summary." >&2
            exit 1
          fi

  merge-gate:
    name: Backend Hermetic Merge Gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # `!cancelled()` rather than `always()`: with cancel-in-progress above, a
    # superseding push cancels this run mid-flight, and under `always()` the
    # gate still executed against `cancelled` upstream results and reported a
    # hard red with no code cause (3 of the last 4 re-run-to-green cycles on
    # this workflow were exactly that). A cancelled run's verdict belongs to
    # the superseding run, so the gate must go neutral, not red.
    if: ${{ !cancelled() }}
    needs: [scope, hermetic-e2e, listen-pusher-stack-gauntlet, sync-cloud-tasks-stack-gauntlet]
    steps:
      - name: Fail closed on selected hermetic checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCOPE_APPLIES: ${{ needs.scope.outputs.applies }}
          FULL_CI: ${{ needs.scope.outputs.full_ci }}
          RUN_LISTEN: ${{ needs.scope.outputs.run_listen }}
          RUN_SYNC: ${{ needs.scope.outputs.run_sync }}
          HERMETIC_E2E_RESULT: ${{ needs.hermetic-e2e.result }}
          LISTEN_PUSHER_RESULT: ${{ needs.listen-pusher-stack-gauntlet.result }}
          SYNC_CLOUD_TASKS_RESULT: ${{ needs.sync-cloud-tasks-stack-gauntlet.result }}
        run: |
          # Belt to the `!cancelled()` suspenders: a partially-cancelled run
          # (one upstream job cancelled without the gate itself being
          # cancelled) is still superseded work, not a failure.
          for result_name in SCOPE_RESULT HERMETIC_E2E_RESULT LISTEN_PUSHER_RESULT SYNC_CLOUD_TASKS_RESULT; do
            if [[ "${!result_name}" == 'cancelled' ]]; then
              echo "$result_name was cancelled by a superseding run; deferring to that run's gate."
              exit 0
            fi
          done

          if [[ "$SCOPE_RESULT" != 'success' ]]; then
            echo "Hermetic backend scope failed with result: $SCOPE_RESULT" >&2
            exit 1
          fi

          case "$SCOPE_APPLIES" in
            true) required_result='success' ;;
            false) required_result='skipped' ;;
            *)
              echo "Hermetic backend scope produced an invalid result: ${SCOPE_APPLIES:-<empty>}" >&2
              exit 1
              ;;
          esac

          if [[ "$SCOPE_APPLIES" == 'true' && "$FULL_CI" != 'true' ]]; then
            required_result=skipped
            notice='fork PR — a maintainer adds label ci:full, then Re-run all jobs'
            echo "::notice title=Heavy CI deferred::$notice"
            echo "Heavy CI deferred: $notice" >> "$GITHUB_STEP_SUMMARY"
          fi

          failed=0
          [[ "$HERMETIC_E2E_RESULT" == "$required_result" ]] || failed=1
          if [[ "$SCOPE_APPLIES" == 'true' && "$RUN_LISTEN" == 'false' ]]; then
            listen_required=skipped
          else
            listen_required="$required_result"
          fi
          if [[ "$SCOPE_APPLIES" == 'true' && "$RUN_SYNC" == 'false' ]]; then
            sync_required=skipped
          else
            sync_required="$required_result"
          fi
          [[ "$LISTEN_PUSHER_RESULT" == "$listen_required" ]] || failed=1
          [[ "$SYNC_CLOUD_TASKS_RESULT" == "$sync_required" ]] || failed=1
          if [[ "$failed" != 0 ]]; then
            printf 'Hermetic E2E=%s (want %s), Listen=%s (want %s), Sync=%s (want %s)\n' \
              "$HERMETIC_E2E_RESULT" "$required_result" "$LISTEN_PUSHER_RESULT" "$listen_required" \
              "$SYNC_CLOUD_TASKS_RESULT" "$sync_required" >&2
          fi
          exit "$failed"

  post-merge-failure-issues:
    name: Post-merge hermetic failure issues
    needs: [scope, hermetic-e2e, listen-pusher-stack-gauntlet, sync-cloud-tasks-stack-gauntlet]
    if: ${{ always() && inputs.nightly_main_sha == '' && (github.event_name == 'push' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update one issue per failed suite
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          E2E: ${{ needs.hermetic-e2e.result }}
          LISTEN: ${{ needs.listen-pusher-stack-gauntlet.result }}
          SYNC: ${{ needs.sync-cloud-tasks-stack-gauntlet.result }}
          SCOPE: ${{ needs.scope.result }}
          APPLIES: ${{ needs.scope.outputs.applies }}
        run: |
          set -euo pipefail
          [[ "$SCOPE" == success && "$APPLIES" == false ]] && exit 0
          failed=0
          for spec in "Hermetic scope detection:$SCOPE" "Hermetic Backend E2E:$E2E" "Listen Pusher Stack Gauntlet:$LISTEN" "Sync Cloud Tasks Stack Gauntlet:$SYNC"; do
            suite="${spec%%:*}"
            result="${spec#*:}"
            [[ "$SCOPE" != success && "$result" == skipped ]] && continue
            [[ "$result" == success ]] && continue
            failed=1
            title="CI post-merge failure: $suite"
            issue_number="$(gh issue list --repo "$REPO" --state open --search "\"$title\" in:title" --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
            printf 'The %s suite was %s on a main or nightly run.\n\nEvidence: %s\n' "$suite" "$result" "$RUN_URL" > /tmp/ci-suite-issue.md
            if [[ -n "$issue_number" ]]; then
              gh issue edit "$issue_number" --repo "$REPO" --body-file /tmp/ci-suite-issue.md
            else
              gh issue create --repo "$REPO" --title "$title" --body-file /tmp/ci-suite-issue.md
            fi
          done
          exit "$failed"

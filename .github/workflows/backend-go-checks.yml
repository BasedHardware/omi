name: Backend Go Checks

# Runs `make check` for backend-go: vet, lint, structural rules and every test
# with the race detector against Postgres 16 and the Firestore emulator. Also
# refuses edits to migrations already applied on the base branch.
on:
  # Nightly calls run the same check job against one immutable main snapshot.
  workflow_call:
    inputs:
      nightly_main_sha:
        description: Main SHA pinned by the unfiltered nightly caller
        type: string
        required: false
        default: ''
  pull_request:
    paths:
      - "backend-go/**"
      - "backend/**/*.py"
      - "backend/testing/finalization_replay/**"
      - ".github/scripts/go_port_tasks.py"
      - ".github/scripts/test_go_port_tasks.py"
      - ".github/workflows/backend-go-checks.yml"
  # Inspect every main push so a path filter cannot hide large Python PRs.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Main pushes each own a distinct range of PRs and must not cancel one another.
  group: backend-go-checks-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && format('push-{0}', github.run_id) || (inputs.nightly_main_sha != '' && format('nightly-{0}', github.run_id) || 'normal') }}
  cancel-in-progress: true

env:
  # Abort a git HTTP transfer that stays under 1 KB/s for 60 s, so actions/checkout
  # retries instead of hanging until the TCP reset (#22890).
  GIT_HTTP_LOW_SPEED_LIMIT: "1000"
  GIT_HTTP_LOW_SPEED_TIME: "60"

jobs:
  port-tasks:
    if: github.event_name == 'push' && inputs.nightly_main_sha == ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      pull-requests: read
      issues: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    outputs:
      go_changed: ${{ steps.scope.outputs.go_changed }}
      has_candidates: ${{ steps.scope.outputs.has_candidates }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install port task dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Find mapped Python PRs in first-parent merges
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BEFORE" "$AFTER"
          range="$BEFORE..$AFTER"
          git log --first-parent --diff-merges=first-parent --format= --name-only -z "$range" \
            > "$RUNNER_TEMP/changed-paths.nul"
          python - "$RUNNER_TEMP/changed-paths.nul" "$RUNNER_TEMP/changed-files.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          raw = Path(sys.argv[1]).read_bytes()
          paths = raw.decode("utf-8", errors="surrogateescape").split("\0")
          records = [{"filename": path} for path in paths if path]
          Path(sys.argv[2]).write_text(json.dumps(records), encoding="utf-8")
          PY
          go_changed=$(python .github/scripts/go_port_tasks.py --scope-only < "$RUNNER_TEMP/changed-files.json")
          if [[ "$go_changed" == true ]]; then
            echo "go_changed=true" >> "$GITHUB_OUTPUT"
          fi
          git rev-list --first-parent --merges --reverse "$range" > "$RUNNER_TEMP/port-merges"
          : > "$RUNNER_TEMP/port-candidates.ndjson"
          while IFS= read -r sha; do
            prs=$(gh api --paginate --slurp "repos/$REPO/commits/$sha/pulls?per_page=100" |
              jq -r --arg sha "$sha" '
                add | .[] | select(.base.ref == "main" and .merged_at and .merge_commit_sha == $sha) | .number
              ')
            while IFS= read -r pr; do
              [[ -n "$pr" ]] || continue
              pr_data=$(gh api "repos/$REPO/pulls/$pr")
              changed_count=$(jq -r '.changed_files' <<< "$pr_data")
              merge_sha=$(jq -r '.merge_commit_sha' <<< "$pr_data")
              title=$(jq -r '.title' <<< "$pr_data")
              [[ "$merge_sha" == "$sha" ]] || { echo "PR #$pr merge SHA does not match $sha" >&2; exit 1; }
              files_path="$RUNNER_TEMP/pr-$pr-files.json"
              gh api --paginate --slurp "repos/$REPO/pulls/$pr/files?per_page=100" | jq 'add' > "$files_path"
              mapped=$(python .github/scripts/go_port_tasks.py --mapped-only --changed-files "$changed_count" < "$files_path")
              if jq -e 'length > 0' <<< "$mapped" > /dev/null; then
                jq -cn --arg pr "$pr" --arg sha "$sha" --arg title "$title" \
                  --argjson changed_count "$changed_count" \
                  '{pr: ($pr | tonumber), merge_sha: $sha, title: $title, changed_files: $changed_count}' \
                  >> "$RUNNER_TEMP/port-candidates.ndjson"
              fi
            done <<< "$prs"
          done < "$RUNNER_TEMP/port-merges"
          python - "$RUNNER_TEMP/port-candidates.ndjson" "$RUNNER_TEMP/port-candidates.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          candidates = [json.loads(line) for line in lines if line]
          Path(sys.argv[2]).write_text(json.dumps(candidates), encoding="utf-8")
          if candidates:
              print(f"Found {len(candidates)} mapped Python PR(s) to replay")
          PY
          if [[ -s "$RUNNER_TEMP/port-candidates.ndjson" ]]; then
            echo "has_candidates=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test the port generator and mapped paths
        run: python -m unittest discover -s .github/scripts -p test_go_port_tasks.py -v
      - uses: actions/setup-go@v7
        if: steps.scope.outputs.has_candidates == 'true'
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - uses: actions/setup-java@v5
        if: steps.scope.outputs.has_candidates == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - name: Install firebase-tools
        if: steps.scope.outputs.has_candidates == 'true'
        run: npm install -g firebase-tools@15
      - uses: astral-sh/setup-uv@ecd24dd710f2fb0dca1693a67af11fc4a5c5ec84
        if: steps.scope.outputs.has_candidates == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: backend/pylock.toml
      - name: Run the replay oracle at each merge commit and open tasks
        if: steps.scope.outputs.has_candidates == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          set -euo pipefail
          existing_tasks="$RUNNER_TEMP/existing-go-port-tasks.json"
          gh api --paginate --slurp "repos/$REPO/issues?state=all&labels=task&per_page=100" > "$existing_tasks"
          worktree=""
          cleanup_worktree() {
            if [[ -n "$worktree" ]]; then
              git worktree remove --force "$worktree" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_worktree EXIT
          while IFS= read -r candidate; do
            pr=$(jq -r '.pr' <<< "$candidate")
            sha=$(jq -r '.merge_sha' <<< "$candidate")
            title=$(jq -r '.title' <<< "$candidate")
            changed_count=$(jq -r '.changed_files' <<< "$candidate")
            pr_files="$RUNNER_TEMP/pr-$pr-task-files.json"
            gh api --paginate --slurp "repos/$REPO/pulls/$pr/files?per_page=100" | jq 'add' > "$pr_files"
            worktree="$RUNNER_TEMP/omi-merge-$sha-$pr-$GITHUB_RUN_ID"
            reports="$RUNNER_TEMP/go-port-replay-$sha-$pr-$GITHUB_RUN_ID"
            task_file="$RUNNER_TEMP/go-port-tasks-$sha-$pr.json"
            git worktree add --quiet --detach "$worktree" "$sha"
            (cd "$worktree/backend" && ./scripts/sync-python-deps.sh)
            (
              cd "$worktree/backend-go"
              export REPLAY_TASK_OUTPUT_DIR="$reports"
              export TEST_DATABASE_URL
              ./tools/replay/test.sh
            )
            generator="$GITHUB_WORKSPACE/.github/scripts/go_port_tasks.py"
            python "$generator" --pr "$pr" --pr-title "$title" --merge-sha "$sha" \
              --changed-files "$changed_count" \
              --oracle-report "$reports/parity.json" \
              --oracle-report "$reports/gaps.json" \
              < "$pr_files" > "$task_file"
            while IFS= read -r task; do
              marker=$(jq -r '.marker' <<< "$task")
              issue_number=$(jq -r --arg marker "$marker" \
                '.[][] | select(.pull_request == null and ((.body // "") | contains($marker))) | .number' \
                "$existing_tasks" | head -n 1)
              if [[ -n "$issue_number" ]]; then
                echo "Port task already exists as issue #$issue_number ($marker)"
                continue
              fi
              issue_title=$(jq -r '.title' <<< "$task")
              issue_body="$RUNNER_TEMP/go-port-task-$pr-$(jq -r '.family' <<< "$task").md"
              jq -r '.body' <<< "$task" > "$issue_body"
              gh issue create --repo "$REPO" --title "$issue_title" --label task --body-file "$issue_body"
            done < <(jq -c '.[]' "$task_file")
            git worktree remove --force "$worktree"
            worktree=""
          done < "$RUNNER_TEMP/port-candidates.ndjson"

  port-task-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go_changed: ${{ steps.scope.outputs.go_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install port task dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Scope the PR to Go behavior
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          changed_count=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .changed_files)
          gh api --paginate --slurp "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" | jq 'add' > "$RUNNER_TEMP/pr-files.json"
          go_changed=$(python .github/scripts/go_port_tasks.py --scope-only --changed-files "$changed_count" < "$RUNNER_TEMP/pr-files.json")
          if [[ "$go_changed" == true ]]; then
            echo "go_changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test the port generator and mapped paths
        run: python -m unittest discover -s .github/scripts -p test_go_port_tasks.py -v

  check:
    needs: [port-tasks, port-task-tests]
    if: >-
      ${{ !cancelled() && (
        github.event_name == 'workflow_call' ||
        (github.event_name == 'push' && needs.port-tasks.outputs.go_changed == 'true') ||
        (github.event_name == 'pull_request' && needs.port-task-tests.outputs.go_changed == 'true')
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend-go
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.nightly_main_sha || github.sha }}
          persist-credentials: false
          # The frozen-migrations step compares against the base branch.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install firebase-tools
        run: npm install -g firebase-tools@15
      - name: Applied migrations are not edited
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/migrations-frozen.sh "$BASE_SHA"
      - name: make check
        env:
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
          TEST_FIRESTORE_REQUIRED: "1"
        run: make check
      - uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version
      - uses: astral-sh/setup-uv@ecd24dd710f2fb0dca1693a67af11fc4a5c5ec84
        with:
          enable-cache: true
          cache-dependency-glob: backend/pylock.toml
      - name: Install locked Python replay dependencies
        working-directory: backend
        run: |
          ./scripts/sync-python-deps.sh
          .venv/bin/python -c "import tiktoken; tiktoken.encoding_for_model('text-embedding-3-large')"
      - name: Replay Python and Go finalization
        env:
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
        run: ./tools/replay/test.sh

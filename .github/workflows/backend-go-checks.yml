name: Backend Go Checks

# Runs `make check` for backend-go: vet, the lint contract, the structural rules and every test
# with the race detector, against Postgres 16 and the Firestore emulator. Neither set of tests
# may skip here. Also refuses an edit to a migration that already exists on the base branch.
on:
  # Nightly calls run this same job against one immutable main snapshot.
  workflow_call:
    inputs:
      nightly_main_sha:
        description: Main SHA pinned by the unfiltered nightly caller
        type: string
        required: false
        default: ''
  pull_request:
    paths:
      - "backend-go/**"
      - ".github/workflows/backend-go-checks.yml"
  push:
    branches: [main]
    paths:
      - "backend-go/**"
      - ".github/workflows/backend-go-checks.yml"

permissions:
  contents: read

concurrency:
  group: backend-go-checks-${{ github.event.pull_request.number || github.ref }}-${{ inputs.nightly_main_sha != '' && format('nightly-{0}', github.run_id) || 'normal' }}
  cancel-in-progress: true

env:
  # Abort a git HTTP transfer that stays under 1 KB/s for 60 s, so actions/checkout
  # retries instead of hanging until the TCP reset (#22890).
  GIT_HTTP_LOW_SPEED_LIMIT: "1000"
  GIT_HTTP_LOW_SPEED_TIME: "60"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend-go
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.nightly_main_sha || github.sha }}
          persist-credentials: false
          # The frozen-migrations step compares against the base branch.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install firebase-tools
        run: npm install -g firebase-tools@15
      - name: Applied migrations are not edited
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/migrations-frozen.sh "$BASE_SHA"
      - name: make check
        env:
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
          TEST_FIRESTORE_REQUIRED: "1"
        run: make check

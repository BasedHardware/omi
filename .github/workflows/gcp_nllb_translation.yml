name: Deploy NLLB Translation to GKE

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - prod
      branch:
        description: 'Branch to deploy from'
        required: true
        default: 'main'
      rollback_digest:
        description: 'Replay the recorded prior serving sha256 digest without rebuilding historical source'
        required: false
        default: ''
      release_version:
        description: 'Release version (optional)'
        required: false
        default: ''

# Serialize Helm writers to this environment's NLLB translation release.
concurrency:
  group: deploy-gke-nllb-translation-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  # Abort a git HTTP transfer that stays under 1 KB/s for 60 s, so actions/checkout
  # retries instead of hanging 7-10 min until the TCP reset (#22890).
  GIT_HTTP_LOW_SPEED_LIMIT: "1000"
  GIT_HTTP_LOW_SPEED_TIME: "60"
  SERVICE: nllb-translation
  SERVICE_UNDERSCORE: nllb_translation
  REGION: us-central1

jobs:
  deploy:
    environment: ${{ github.event.inputs.environment == 'prod' && 'prod' || 'development' }}
    permissions:
      contents: 'read'
      id-token: 'write'

    runs-on: ubuntu-latest
    steps:
      - name: Validate Environment Input
        run: |
          if [[ "${{ github.event.inputs.environment }}" != "development" && "${{ github.event.inputs.environment }}" != "prod" ]]; then
            echo "Invalid environment: ${{ github.event.inputs.environment }}. Must be 'development' or 'prod'."
            exit 1
          fi

      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.rollback_digest != '' && 'main' || github.event.inputs.branch }}

      # Prod: GitHub WIF as omi-ci-deployer-prod@ (credential-hygiene WS-C, plan v2 Phase E).
      # Development keeps its JSON lane.
      - name: Google Auth (prod WIF)
        id: auth-wif
        if: github.event.inputs.environment == 'prod'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/208440318997/locations/global/workloadIdentityPools/omi-gha-deploy-prod/providers/github
          service_account: omi-ci-deployer-prod@based-hardware.iam.gserviceaccount.com

      - name: Google Auth
        id: auth
        if: github.event.inputs.environment != 'prod'
        uses: google-github-actions/auth@v3
        with:
          # Development: GitHub WIF as the dev deployer, no JSON key (credential hygiene WS-D).
          workload_identity_provider: projects/1031333818730/locations/global/workloadIdentityPools/omi-gha-deploy-dev/providers/github
          service_account: omi-ci-deployer-dev@based-hardware-dev.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - run: gcloud auth configure-docker

      - name: Compute image tag from checked-out HEAD
        id: vars
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker image
        if: github.event.inputs.rollback_digest == ''
        run: |
          build_context=$(python3 -c 'import json; print(next(image["build_context"] for image in json.load(open("backend/runtime_images.json"))["images"] if image["name"] == "nllb-translation"))')
          docker build -t gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${{ steps.vars.outputs.short_sha }} -f backend/${{ env.SERVICE_UNDERSCORE }}/Dockerfile "$build_context"
          python3 backend/scripts/runtime_image_contracts.py smoke \
            --dockerfile backend/nllb_translation/Dockerfile \
            --image gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${{ steps.vars.outputs.short_sha }}
          docker push gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${{ steps.vars.outputs.short_sha }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ env.REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Record serving image and validate rollback receipt
        env:
          ROLLBACK_DIGEST: ${{ github.event.inputs.rollback_digest }}
          SOURCE_TAG: ${{ steps.vars.outputs.short_sha }}
        run: |
          set -euo pipefail
          kubectl -n ${{ vars.ENV }}-omi-backend get deployment ${{ vars.ENV }}-omi-${{ env.SERVICE }} --ignore-not-found -o json > /tmp/nllb-deployment.json
          kubectl -n ${{ vars.ENV }}-omi-backend get pods -l app.kubernetes.io/instance=${{ vars.ENV }}-omi-${{ env.SERVICE }} -o json > /tmp/nllb-pods.json
          candidate_digest=''
          if [[ -z "$ROLLBACK_DIGEST" ]]; then
            candidate_digest=$(gcloud container images describe "gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:$SOURCE_TAG" --format='value(image_summary.digest)')
          fi
          python3 backend/scripts/nllb_release_image.py \
            --deployment /tmp/nllb-deployment.json --pods /tmp/nllb-pods.json \
            --repository gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }} \
            --tag "$SOURCE_TAG" --rollback-digest "$ROLLBACK_DIGEST" --candidate-digest "$candidate_digest" --output /tmp/nllb-release-values.json
          if [[ -n "$ROLLBACK_DIGEST" ]]; then
            actual=$(gcloud container images describe "gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}@$ROLLBACK_DIGEST" --format='value(image_summary.digest)')
            [[ "$actual" == "$ROLLBACK_DIGEST" ]]
          fi

      - name: Deploy NLLB Translation to GKE cluster using Helm
        run: |
          helm -n ${{ vars.ENV }}-omi-backend upgrade --install ${{ vars.ENV }}-omi-${{ env.SERVICE }} ./backend/charts/${{ env.SERVICE }} -f ./backend/charts/${{ env.SERVICE }}/${{ vars.ENV }}_omi_${{ env.SERVICE_UNDERSCORE }}_values.yaml -f /tmp/nllb-release-values.json --set-string "image.tag=${{ steps.vars.outputs.short_sha }}"

      - name: Verify rollout
        run: |
          if ! kubectl -n ${{ vars.ENV }}-omi-backend rollout status deploy/${{ vars.ENV }}-omi-${{ env.SERVICE }} --timeout=1800s; then
            python3 backend/scripts/deploy_status_report.py --env ${{ vars.ENV }} --include-gke --gke-service ${{ env.SERVICE }} || true
            exit 1
          fi
          python3 backend/scripts/deploy_status_report.py --env ${{ vars.ENV }} --include-gke --gke-service ${{ env.SERVICE }}

      - name: Generate deployment summary
        if: always() && github.event.inputs.environment == 'prod'
        uses: BasedHardware/omi/.github/actions/deployment-summary@979b573718fd74b31edab3530adf2ed6082622dc
        with:
          deployment_tag: ${{ github.event.inputs.rollback_digest || steps.vars.outputs.short_sha || 'unadmitted' }}
          environment: ${{ github.event.inputs.environment }}
          release_version: ${{ github.event.inputs.release_version }}
          status: ${{ job.status }}
          service: ${{ env.SERVICE }}

      - name: Notify deployment status on Telegram
        if: always() && github.event.inputs.environment == 'prod'
        uses: BasedHardware/omi/.github/actions/deployment-notifier@979b573718fd74b31edab3530adf2ed6082622dc
        with:
          deployment_tag: ${{ github.event.inputs.rollback_digest || steps.vars.outputs.short_sha || 'unadmitted' }}
          environment: ${{ github.event.inputs.environment }}
          release_version: ${{ github.event.inputs.release_version }}
          status: ${{ job.status }}
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

name: Main Nightly Full

# All path-filtered PR test workflows, using their own runners, commands and caps.
# main.yml is issue sync and intentionally absent. Deploy/release/live-eval and
# firmware workflows are outside this offline test run. No secrets are inherited.
on:
  schedule:
    - cron: '7 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: main-nightly-full-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_HTTP_LOW_SPEED_LIMIT: '1000'
  GIT_HTTP_LOW_SPEED_TIME: '60'

jobs:
  source:
    name: Pin main source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      main_sha: ${{ steps.source.outputs.main_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - id: source
        shell: bash
        run: echo "main_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  backend-checks:
    needs: source
    uses: ./.github/workflows/backend-checks.yml
    with:
      nightly_main_sha: ${{ needs.source.outputs.main_sha }}

  backend-edge:
    needs: source
    uses: ./.github/workflows/backend-edge.yml
    with:
      nightly_main_sha: ${{ needs.source.outputs.main_sha }}

  backend-emulator-proofs:
    needs: source
    uses: ./.github/workflows/backend-emulator-proofs.yml
    with:
      nightly_main_sha: ${{ needs.source.outputs.main_sha }}

  backend-hermetic-e2e:
    needs: source
    uses: ./.github/workflows/backend-hermetic-e2e.yml
    with:
      nightly_main_sha: ${{ needs.source.outputs.main_sha }}
    permissions:
      contents: read
      actions: read
      issues: write

  backend-unit-tests:
    needs: source
    uses: ./.github/workflows/backend-unit-tests.yml
    with:
      nightly_main_sha: ${{ needs.source.outputs.main_sha }}

  desktop-backend-contracts:
    needs: source
    uses: ./.github/workflows/desktop-backend-contracts.yml
    with:
      nightly_main_sha: ${{ needs.source.outputs.main_sha }}

  desktop-checks:
    needs: source
    uses: ./.github/workflows/desktop-checks.yml
    with:
      nightly_main_sha: ${{ needs.source.outputs.main_sha }}

  desktop-swift-ci:
    needs: source
    uses: ./.github/workflows/desktop-swift-ci.yml
    with:
      nightly_main_sha: ${{ needs.source.outputs.main_sha }}
    permissions:
      contents: read
      actions: read
      issues: write

  desktop-windows-ci:
    needs: source
    uses: ./.github/workflows/desktop-windows-ci.yml
    with:
      nightly_main_sha: ${{ needs.source.outputs.main_sha }}

  mobile-app-checks:
    needs: source
    uses: ./.github/workflows/mobile-app-checks.yml
    with:
      nightly_main_sha: ${{ needs.source.outputs.main_sha }}
    permissions:
      contents: read
      actions: read
      issues: write

  openapi-contract:
    needs: source
    uses: ./.github/workflows/openapi-contract.yml
    with:
      nightly_main_sha: ${{ needs.source.outputs.main_sha }}

  opentofu-development-wif-pilot-validate:
    needs: source
    uses: ./.github/workflows/opentofu-development-wif-pilot-validate.yml
    with:
      nightly_main_sha: ${{ needs.source.outputs.main_sha }}

  opentofu-foundation-validate:
    needs: source
    uses: ./.github/workflows/opentofu-foundation-validate.yml
    with:
      nightly_main_sha: ${{ needs.source.outputs.main_sha }}

  public-build-config-preflight:
    needs: source
    uses: ./.github/workflows/public-build-config-preflight.yml
    with:
      nightly_main_sha: ${{ needs.source.outputs.main_sha }}

  python-cli-ci:
    needs: source
    uses: ./.github/workflows/python-cli-ci.yml
    with:
      nightly_main_sha: ${{ needs.source.outputs.main_sha }}

  repo-checks:
    needs: source
    uses: ./.github/workflows/repo-checks.yml
    with:
      nightly_main_sha: ${{ needs.source.outputs.main_sha }}

  role_images:
    needs: source
    uses: ./.github/workflows/role_images.yml
    with:
      nightly_main_sha: ${{ needs.source.outputs.main_sha }}

  runtime_image_contracts:
    needs: source
    uses: ./.github/workflows/runtime_image_contracts.yml
    with:
      nightly_main_sha: ${{ needs.source.outputs.main_sha }}
    permissions:
      contents: read
      id-token: write

  sdk-cpp:
    needs: source
    uses: ./.github/workflows/sdk-cpp.yml
    with:
      nightly_main_sha: ${{ needs.source.outputs.main_sha }}

  sdk-rust:
    needs: source
    uses: ./.github/workflows/sdk-rust.yml
    with:
      nightly_main_sha: ${{ needs.source.outputs.main_sha }}

  web-checks:
    needs: source
    uses: ./.github/workflows/web-checks.yml
    with:
      nightly_main_sha: ${{ needs.source.outputs.main_sha }}

  windows-preflight-portability:
    needs: source
    uses: ./.github/workflows/windows-preflight-portability.yml
    with:
      nightly_main_sha: ${{ needs.source.outputs.main_sha }}

  report:
    name: Nightly failure summary
    if: ${{ always() && !cancelled() && needs.source.result == 'success' }}
    needs:
      - source
      - backend-checks
      - backend-edge
      - backend-emulator-proofs
      - backend-hermetic-e2e
      - backend-unit-tests
      - desktop-backend-contracts
      - desktop-checks
      - desktop-swift-ci
      - desktop-windows-ci
      - mobile-app-checks
      - openapi-contract
      - opentofu-development-wif-pilot-validate
      - opentofu-foundation-validate
      - public-build-config-preflight
      - python-cli-ci
      - repo-checks
      - role_images
      - runtime_image_contracts
      - sdk-cpp
      - sdk-rust
      - web-checks
      - windows-preflight-portability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Reporting code comes from the workflow revision, including branch validation;
      # every test checkout above uses the independently pinned main source.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Collect completed job failures and previous green main SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          MAIN_SHA: ${{ needs.source.outputs.main_sha }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python3 scripts/ci/nightly_main_report.py
          --repo "$REPO" --run-id "$RUN_ID" --main-sha "$MAIN_SHA"
          --needs-json "$NEEDS_JSON" --out "$RUNNER_TEMP/nightly-main"
      - name: Attach failure receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: nightly-main-report
          overwrite: true
          path: ${{ runner.temp }}/nightly-main/report.json
          if-no-files-found: error
          retention-days: 90
      - name: Attach last green nightly SHA for bisection
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: nightly-main-last-green
          overwrite: true
          path: ${{ runner.temp }}/nightly-main/last-green-sha.txt
          if-no-files-found: error
          retention-days: 90

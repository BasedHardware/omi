name: Reconcile Firestore Indexes

on:
  # Push validates declarations locally. The release owner dispatches main;
  # reconciliation uses that immutable run SHA, possibly newer than this push.
  # The dependent release still proves its own source READY (R15 step 0).
  push:
    branches: [ "main" ]
    paths:
      - 'firestore.indexes.json'
      - 'backend/scripts/reconcile_firestore_field_exemptions.py'
      - '.github/workflows/gcp_firestore_indexes.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'backend/database/firestore_index_registry.py'
      - 'firestore.indexes.json'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the Firestore environment to reconcile'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - prod
      confirmation:
        description: 'Type APPLY_FIRESTORE_INDEXES or APPLY_FIRESTORE_FIELD_EXEMPTIONS for the selected operation'
        required: true
        type: string
      operation:
        description: 'Choose the schema operation; field exemptions must target prod'
        required: true
        default: 'composite-indexes'
        type: choice
        options:
          - composite-indexes
          - field-exemptions

# Only schema writer jobs acquire the environment lock. Read-only push/PR
# checks cannot occupy it while a release-pinned dispatch waits to reconcile.
env:
  # Abort a git HTTP transfer that stays under 1 KB/s for 60 s, so actions/checkout
  # retries instead of hanging 7-10 min until the TCP reset (#22890).
  GIT_HTTP_LOW_SPEED_LIMIT: "1000"
  GIT_HTTP_LOW_SPEED_TIME: "60"

jobs:
  plan_pr_indexes:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      eligible: ${{ steps.plan.outputs.eligible }}
      main_sha: ${{ steps.plan.outputs.main_sha }}
    steps:
      - name: Checkout trusted main controls
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Plan additions against current main without cloud credentials
        id: plan
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main "$HEAD_SHA"
          # Resolve main explicitly: FETCH_HEAD also contains the PR head.
          git fetch --no-tags origin refs/heads/main
          main_sha="$(git rev-parse FETCH_HEAD)"
          git show "$main_sha:firestore.indexes.json" > "$RUNNER_TEMP/base-indexes.json"
          git show "$HEAD_SHA:firestore.indexes.json" > "$RUNNER_TEMP/pr-indexes.json"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          python3 backend/scripts/reconcile_firestore_indexes.py \
            --manifest "$RUNNER_TEMP/pr-indexes.json" \
            --add-only-base "$RUNNER_TEMP/base-indexes.json" \
            --plan-additions | tee "$RUNNER_TEMP/index-plan.txt"
          sed -n '/^eligible=/p' "$RUNNER_TEMP/index-plan.txt" >> "$GITHUB_OUTPUT"

  check_pr_prod_indexes:
    needs: plan_pr_indexes
    if: >-
      needs.plan_pr_indexes.outputs.eligible == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main controls
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Read pinned declarations as data
        env:
          MAIN_SHA: ${{ needs.plan_pr_indexes.outputs.main_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$MAIN_SHA" "$HEAD_SHA"
          git show "$MAIN_SHA:firestore.indexes.json" > "$RUNNER_TEMP/base-indexes.json"
          git show "$HEAD_SHA:firestore.indexes.json" > "$RUNNER_TEMP/pr-indexes.json"
      # Recheck locally; never import or run candidate PR code.
      - name: Validate add-only declarations
        run: |
          set -euo pipefail
          python3 backend/scripts/reconcile_firestore_indexes.py \
            --manifest "$RUNNER_TEMP/pr-indexes.json" \
            --add-only-base "$RUNNER_TEMP/base-indexes.json" \
            --plan-additions | tee "$RUNNER_TEMP/index-plan.txt"
          grep -qx 'eligible=true' "$RUNNER_TEMP/index-plan.txt"
      - name: Report PR declarations pending production reconciliation
        run: |
          echo 'Declarations validated locally; production readiness is not established.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Owner: release owner for this change. Dispatch main for cumulative reconciliation, record its immutable run SHA, and prove named indexes READY for the dependent release source before deployment (R15 step 0).' >> "$GITHUB_STEP_SUMMARY"

  validate_merged_prod_indexes:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable merged declarations
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate generated manifest locally without cloud access
        run: |
          PYTHONPATH=backend python3 -c 'from pathlib import Path; from scripts.reconcile_firestore_indexes import verify_manifest_source; verify_manifest_source(Path("firestore.indexes.json"))'
      - name: Report production schema pending release-owner reconciliation
        run: |
          deadline="$(date -u -d '+2 hours' +%Y-%m-%dT%H:%M:%SZ)"
          receipt="SCHEMA_PENDING source=$GITHUB_SHA owner=release-owner deadline=$deadline"
          echo "$receipt"
          echo "$receipt" >> "$GITHUB_STEP_SUMMARY"
          echo 'Local validation only; production readiness is not established. Release owner: dispatch main for cumulative reconciliation and approve the owned run. If main advanced, the writer reconciles the newer immutable dispatch SHA, not this pending source. Record SCHEMA_SOURCE, then prove this pending source and the dependent release source READY with the existing source-pinned readiness gate (R15 step 0). A newer writer result does not close an older pending receipt by itself.' >> "$GITHUB_STEP_SUMMARY"

  reconcile_composite_indexes:
    # Only a confirmed dispatch may write production schema. The same job also
    # handles manual development under the automatic development writer's lock.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.operation == 'composite-indexes'
    environment: ${{ github.event.inputs.environment }}
    concurrency:
      group: firestore-schema-${{ github.event.inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Validate Firestore migration input
        env:
          EVENT_NAME: ${{ github.event_name }}
          RESOLVED_ENVIRONMENT: ${{ github.event.inputs.environment }}
          CONFIRMATION: ${{ github.event.inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$RESOLVED_ENVIRONMENT" != "development" && "$RESOLVED_ENVIRONMENT" != "prod" ]]; then
            echo "Invalid environment: $RESOLVED_ENVIRONMENT. Must be 'development' or 'prod'."
            exit 1
          fi
          if [[ "$EVENT_NAME" != "workflow_dispatch" || "$CONFIRMATION" != "APPLY_FIRESTORE_INDEXES" ]]; then
            echo "Refusing Firestore schema mutation without a confirmed workflow dispatch."
            exit 1
          fi
          echo "Reconciling Firestore indexes in $RESOLVED_ENVIRONMENT via $EVENT_NAME."

      - name: Checkout dispatched Firestore control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Verify dispatched Firestore control plane
        run: |
          checked_sha="$(git rev-parse HEAD)"
          if [[ "$checked_sha" != "$GITHUB_SHA" ]]; then
            echo "Expected dispatched commit $GITHUB_SHA, checked out $checked_sha."
            exit 1
          fi
          echo "Reconciling Firestore indexes from dispatched commit $checked_sha."
          receipt="SCHEMA_SOURCE source=$checked_sha operation=composite-indexes mode=cumulative-dispatch"
          echo "$receipt"
          echo "$receipt" >> "$GITHUB_STEP_SUMMARY"

      # Prod: GitHub WIF as omi-ci-schema-prod@ (index/field config only, no
      # document access; credential-hygiene WS-C). Development keeps JSON.
      - name: Google Auth for Firestore schema migration (prod WIF)
        if: ${{ github.event.inputs.environment == 'prod' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/208440318997/locations/global/workloadIdentityPools/omi-gha-deploy-prod/providers/github
          service_account: omi-ci-schema-prod@based-hardware.iam.gserviceaccount.com

      - name: Google Auth for Firestore schema migration
        if: ${{ github.event.inputs.environment != 'prod' }}
        uses: google-github-actions/auth@v3
        with:
          # Development: GitHub WIF as the dev deployer, no JSON key (credential hygiene WS-D).
          workload_identity_provider: projects/1031333818730/locations/global/workloadIdentityPools/omi-gha-deploy-dev/providers/github
          service_account: omi-ci-deployer-dev@based-hardware-dev.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Show create-only Firestore schema plan
        run: |
          python3 backend/scripts/reconcile_firestore_indexes.py \
            --project "${{ vars.RUNTIME_GCP_PROJECT_ID }}" \
            --dry-run

      - name: Apply approved Firestore schema plan and wait for readiness
        run: |
          python3 backend/scripts/reconcile_firestore_indexes.py \
            --project "${{ vars.RUNTIME_GCP_PROJECT_ID }}" \
            --provision-missing \
            --timeout-seconds 10800

      # Field overrides are deliberately not applied here: disabling automatic
      # indexes deletes their existing entries. Fail after monotone composite
      # repair so the unapplied saving is visible and points at the separately
      # confirmed operation without weakening create-only reconciliation.
      #
      # Scoped to prod for two independent reasons. `reject_nonprod_field_exemptions`
      # refuses the apply operation in every other environment, so unscoped this step
      # asserts a state a non-prod run is forbidden to reach and the development
      # reconcile fails here permanently no matter how healthy it is -- which is
      # exactly what happened once this landed. And there is only one data plane to
      # check: dev.overlay.yaml sets data_plane_project: based-hardware, so dev/beta
      # `screen_activity` documents live in prod. The development environment's
      # RUNTIME_GCP_PROJECT_ID is based-hardware-dev, so a non-prod run of this check
      # interrogates a project that holds none of the data the exemption is about.
      - name: Detect unapplied Firestore field exemptions
        if: ${{ github.event.inputs.environment == 'prod' }}
        run: |
          python3 backend/scripts/reconcile_firestore_field_exemptions.py \
            --project "${{ vars.RUNTIME_GCP_PROJECT_ID }}" \
            --check-only

  reconcile_development_composite_indexes:
    # Development converges automatically on merge. Manual development
    # composites share this exact lock with the dispatched job above.
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: development
    concurrency:
      group: firestore-schema-development
      cancel-in-progress: false
    permissions:
      id-token: 'write'
      contents: 'read'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout merged Firestore control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Verify merged Firestore control plane
        run: |
          checked_sha="$(git rev-parse HEAD)"
          if [[ "$checked_sha" != "$GITHUB_SHA" ]]; then
            echo "Expected merged commit $GITHUB_SHA, checked out $checked_sha."
            exit 1
          fi
          echo "Reconciling development Firestore indexes from merged commit $checked_sha."

      - name: Google Auth for development Firestore schema migration
        uses: google-github-actions/auth@v3
        with:
          # Development: GitHub WIF as the dev deployer, no JSON key (credential hygiene WS-D).
          workload_identity_provider: projects/1031333818730/locations/global/workloadIdentityPools/omi-gha-deploy-dev/providers/github
          service_account: omi-ci-deployer-dev@based-hardware-dev.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Show create-only development Firestore schema plan
        run: |
          python3 backend/scripts/reconcile_firestore_indexes.py \
            --project "${{ vars.RUNTIME_GCP_PROJECT_ID }}" \
            --dry-run

      - name: Apply create-only development Firestore schema plan
        run: |
          python3 backend/scripts/reconcile_firestore_indexes.py \
            --project "${{ vars.RUNTIME_GCP_PROJECT_ID }}" \
            --provision-missing \
            --timeout-seconds 10800

  reject_nonprod_field_exemptions:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.operation == 'field-exemptions' &&
      github.event.inputs.environment != 'prod'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Field exemptions affect the shared production data plane; select the prod environment."
          exit 1

  apply_field_exemptions:
    # This destructive operation is manual-only, prod-environment protected,
    # exact-confirmed, and targets only generated indexes: [] overrides.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.operation == 'field-exemptions' &&
      github.event.inputs.environment == 'prod'
    environment: prod
    concurrency:
      group: firestore-schema-prod
      cancel-in-progress: false
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    steps:
      - name: Validate destructive Firestore field-exemption input
        env:
          CONFIRMATION: ${{ github.event.inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "APPLY_FIRESTORE_FIELD_EXEMPTIONS" ]]; then
            echo "Refusing single-field index deletion without APPLY_FIRESTORE_FIELD_EXEMPTIONS confirmation."
            exit 1
          fi

      - name: Checkout dispatched Firestore control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Verify dispatched Firestore control plane
        run: |
          checked_sha="$(git rev-parse HEAD)"
          if [[ "$checked_sha" != "$GITHUB_SHA" ]]; then
            echo "Expected dispatched commit $GITHUB_SHA, checked out $checked_sha."
            exit 1
          fi
          echo "Applying Firestore field exemptions from dispatched commit $checked_sha."
          receipt="SCHEMA_SOURCE source=$checked_sha operation=field-exemptions mode=cumulative-dispatch"
          echo "$receipt"
          echo "$receipt" >> "$GITHUB_STEP_SUMMARY"

      - name: Google Auth for Firestore field exemptions
        uses: google-github-actions/auth@v3
        with:
          # Prod GitHub WIF (credential-hygiene WS-C); this job is prod-only.
          workload_identity_provider: projects/208440318997/locations/global/workloadIdentityPools/omi-gha-deploy-prod/providers/github
          service_account: omi-ci-schema-prod@based-hardware.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Show destructive Firestore field-exemption plan
        run: |
          python3 backend/scripts/reconcile_firestore_field_exemptions.py \
            --project "${{ vars.RUNTIME_GCP_PROJECT_ID }}" \
            --dry-run

      - name: Apply and verify approved Firestore field exemptions
        run: |
          python3 backend/scripts/reconcile_firestore_field_exemptions.py \
            --project "${{ vars.RUNTIME_GCP_PROJECT_ID }}" \
            --apply \
            --confirmation APPLY_FIRESTORE_FIELD_EXEMPTIONS

name: Backend Emulator Proofs

# The canonical-memory, JIT and record-admission emulator proofs. Memory proofs had no automatic coverage
# before 2026-08-30. They cover crash recovery, deletion races, generation
# contention, day rollover, overlapping runners and writer cutover against a
# real Firestore emulator -- the classes that fakes cannot reach and that a
# green deploy does not reveal.
#
# The daily-sweep crash-replay proof sat red on main from the day #12084
# introduced it until #12403 repaired it, undetected, while
# .github/failure-classes/FC-daily-memory-sweep-fence.json listed it as that
# class's canonical prevention artifact.
#
# This lane is not in branch protection, so it reports without blocking. Promote
# it to a required check once it has a stable green history.

on:
  # Nightly calls run these same jobs against one immutable main snapshot.
  workflow_call:
    inputs:
      nightly_main_sha:
        description: Main SHA pinned by the unfiltered nightly caller
        type: string
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - 'backend/utils/memory/**'
      - 'backend/database/**'
      - 'backend/models/memory_apply.py'
      - 'backend/models/daily_sweep_dispatch.py'
      - 'backend/utils/llm/memories.py'
      - 'backend/models/product_memory.py'
      - 'backend/scripts/*_emulator_test.py'
      - 'backend/tests/integration/test_record_custody_append_emulator.py'
      - 'backend/tests/integration/test_conversation_erasure_ledger_emulator.py'
      - 'backend/tests/unit/test_record_seal_nojob_emulator.py'
      - 'backend/testing/lifecycle_properties/**'
      - 'backend/testing/lifecycle_sim/**'
      - 'backend/scripts/run-emulator-proofs.sh'
      - 'backend/llm_gateway/**'
      - 'backend/tests/integration/test_llm_gateway_idempotency_firestore.py'
      - 'backend/tests/integration/test_summary_task_promotion_emulator.py'
      - 'backend/tests/integration/test_candidate_accept_expiry_emulator.py'
      - 'backend/testing/replay_harness/**'
      - 'backend/testing/hermetic_network.py'
      - 'backend/testing/store_fixtures.py'
      - 'backend/tests/integration/test_replay_harness_firestore.py'
      - 'backend/tests/unit/test_replay_harness*.py'
      - 'backend/utils/conversations/**'
      - 'backend/services/conversation_finalization.py'
      - 'backend/routers/conversation_finalization.py'
      - 'backend/tests/integration/test_replay_harness_titling_firestore.py'
      - 'backend/utils/batch_pipeline/**'
      - 'backend/config/record_*.py'
      - 'backend/config/batch_pipeline*.py'
      - 'backend/config/audio_archive.py'
      - 'backend/config/policy/**'
      - 'backend/utils/executors.py'
      - 'backend/testing/pipeline_sim/clock.py'
      - 'backend/utils/other/storage.py'
      - 'backend/utils/other/local_storage.py'
      - 'backend/utils/other/raw_audio*.py'
      - 'backend/pylock.toml'
      - 'firebase.json'
      - 'firestore.rules'
      - '.github/workflows/backend-emulator-proofs.yml'
  pull_request:
    paths:
      - 'backend/utils/memory/**'
      - 'backend/database/**'
      - 'backend/models/memory_apply.py'
      - 'backend/models/daily_sweep_dispatch.py'
      - 'backend/utils/llm/memories.py'
      - 'backend/models/product_memory.py'
      - 'backend/scripts/*_emulator_test.py'
      - 'backend/tests/integration/test_record_custody_append_emulator.py'
      - 'backend/tests/integration/test_conversation_erasure_ledger_emulator.py'
      - 'backend/tests/unit/test_record_seal_nojob_emulator.py'
      - 'backend/testing/lifecycle_properties/**'
      - 'backend/testing/lifecycle_sim/**'
      - 'backend/scripts/run-emulator-proofs.sh'
      - 'backend/llm_gateway/**'
      - 'backend/tests/integration/test_llm_gateway_idempotency_firestore.py'
      - 'backend/tests/integration/test_summary_task_promotion_emulator.py'
      - 'backend/tests/integration/test_candidate_accept_expiry_emulator.py'
      - 'backend/testing/replay_harness/**'
      - 'backend/testing/hermetic_network.py'
      - 'backend/testing/store_fixtures.py'
      - 'backend/tests/integration/test_replay_harness_firestore.py'
      - 'backend/tests/unit/test_replay_harness*.py'
      - 'backend/utils/conversations/**'
      - 'backend/services/conversation_finalization.py'
      - 'backend/routers/conversation_finalization.py'
      - 'backend/tests/integration/test_replay_harness_titling_firestore.py'
      - 'backend/utils/batch_pipeline/**'
      - 'backend/config/record_*.py'
      - 'backend/config/batch_pipeline*.py'
      - 'backend/config/audio_archive.py'
      - 'backend/config/policy/**'
      - 'backend/utils/executors.py'
      - 'backend/testing/pipeline_sim/clock.py'
      - 'backend/utils/other/storage.py'
      - 'backend/utils/other/local_storage.py'
      - 'backend/utils/other/raw_audio*.py'
      - 'backend/pylock.toml'
      - 'firebase.json'
      - 'firestore.rules'
      - '.github/workflows/backend-emulator-proofs.yml'

concurrency:
  group: backend-emulator-proofs-${{ github.ref }}-${{ inputs.nightly_main_sha != '' && format('nightly-{0}', github.run_id) || 'normal' }}
  cancel-in-progress: true

env:
  # Abort a git HTTP transfer that stays under 1 KB/s for 60 s, so actions/checkout
  # retries instead of hanging 7-10 min until the TCP reset (#22890).
  GIT_HTTP_LOW_SPEED_LIMIT: "1000"
  GIT_HTTP_LOW_SPEED_TIME: "60"

jobs:
  emulator-proofs:
    name: Backend emulator proofs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.nightly_main_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@ecd24dd710f2fb0dca1693a67af11fc4a5c5ec84
        with:
          enable-cache: true
          cache-dependency-glob: backend/pylock*.toml

      # The Firestore emulator is a Java process. The runner's default JDK is
      # not guaranteed, so pin one rather than inherit whatever the image ships.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          uv venv .venv
          uv pip sync pylock.toml --python .venv/bin/python
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Refresh lifecycle package indexes
        timeout-minutes: 2
        # Run 44575827290 stalled downloading FFmpeg dependencies from the
        # runner's regional EC2 mirror. Use the signed Ubuntu HTTPS archives,
        # as in Backend Unit Tests, without changing the runner's sources.
        run: |
          . /etc/os-release
          cat > "$RUNNER_TEMP/lifecycle-ubuntu.sources" <<EOF
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: ${VERSION_CODENAME:?} ${VERSION_CODENAME}-updates
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu
          Suites: ${VERSION_CODENAME}-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          cat > "$RUNNER_TEMP/lifecycle-apt.conf" <<EOF
          Dir::Etc::sourcelist "$RUNNER_TEMP/lifecycle-ubuntu.sources";
          Dir::Etc::sourceparts "-";
          APT::Install-Recommends "false";
          EOF
          cat "$RUNNER_TEMP/lifecycle-ubuntu.sources"
          sudo apt-get -c "$RUNNER_TEMP/lifecycle-apt.conf" -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Update::Error-Mode=any update

      - name: Download lifecycle packages
        timeout-minutes: 4
        run: |
          sudo apt-get -c "$RUNNER_TEMP/lifecycle-apt.conf" -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --download-only -y redis-server ffmpeg libopus0

      - name: Install lifecycle local services
        timeout-minutes: 2
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get -c "$RUNNER_TEMP/lifecycle-apt.conf" -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-download -y redis-server ffmpeg libopus0

      - name: Install firebase-tools
        run: npm install -g firebase-tools@15

      # emulators:exec starts the emulator, exports FIRESTORE_EMULATOR_HOST from
      # firebase.json (127.0.0.1:8085), runs the command, and shuts down -- so a
      # failing proof cannot leave a stray emulator holding the port.
      - name: Run emulator proofs
        env:
          # The runner passes this only to the PL-767 proof invocation.
          PL767_POSTGRES_DSN: "host=127.0.0.1 port=5432 dbname=postgres user=postgres password=postgres"
        run: |
          firebase emulators:exec \
            --only firestore \
            --project demo-omi-isolated-tests \
            'bash backend/scripts/run-emulator-proofs.sh'

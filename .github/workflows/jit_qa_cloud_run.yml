name: JIT isolated QA Cloud Run plane

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current main SHA with a successful first-attempt Release Eligibility proof
        required: true
        type: string
      run_once:
        description: Execute the two QA jobs once after deploying their gates closed
        required: true
        default: false
        type: boolean
      confirmation:
        description: Type RUN_ONCE only when the bounded QA execution is intended
        required: false
        default: ''
        type: string

env:
  QA_PROJECT: based-hardware-dev
  QA_REGION: us-central1
  QA_AUTH_PROJECT: based-hardware
  QA_SERVICE: backend-jit-qa
  QA_DESKTOP_SERVICE: desktop-backend-jit-qa
  QA_DRAIN_JOB: knowledge-ledger-drain-qa-job
  QA_SWEEP_JOB: daily-memory-sweep-qa-job
  QA_RUNTIME_SERVICE_ACCOUNT: jit-qa-runtime@based-hardware-dev.iam.gserviceaccount.com
  QA_UID: vi7SA9ckQCe4ccobWNxlbdcNdC23
  QA_DRAIN_DOCKERFILE: backend/modal/Dockerfile.knowledge_ledger_drain_job
  QA_SWEEP_DOCKERFILE: backend/modal/Dockerfile.daily_memory_sweep_job
  QA_BACKEND_DOCKERFILE: backend/Dockerfile
  QA_DESKTOP_DOCKERFILE: backend/Dockerfile.desktop_backend

concurrency:
  group: jit-isolated-qa-cloud-run-development
  cancel-in-progress: false

jobs:
  admit:
    name: Admit exact proven main source
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Checkout main for source admission
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Require current main and Release Eligibility proof
        id: source
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          printf '%s\n' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          [[ "$RELEASE_SHA" != "0000000000000000000000000000000000000000" ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          [[ "$RELEASE_SHA" == "$(git rev-parse --verify refs/remotes/origin/main)" ]]
          proof_path="${RUNNER_TEMP}/release-eligibility-${RELEASE_SHA}.json"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-eligibility.yml/runs?event=push&branch=main&status=completed&head_sha=${RELEASE_SHA}&per_page=100" \
            > "$proof_path"
          python3 .github/scripts/verify_backend_release_admission.py \
            --sha "$RELEASE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-runs "$proof_path" \
            --require-first-attempt
          git checkout --detach "$RELEASE_SHA"
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          echo "source_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish immutable QA images
    needs: admit
    environment: development
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      desktop_image: ${{ steps.images.outputs.desktop_image }}
      drain_image: ${{ steps.images.outputs.drain_image }}
      sweep_image: ${{ steps.images.outputs.sweep_image }}
    steps:
      - name: Checkout admitted source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.admit.outputs.source_sha }}
          fetch-depth: 0

      - name: Google Auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build QA images
        env:
          SOURCE_SHA: ${{ needs.admit.outputs.source_sha }}
        run: |
          set -euo pipefail
          if find backend -type f \( -name '.env' -o -name 'google-credentials.json' -o -name 'service-account*.json' \) -print -quit | grep -q .; then
            echo 'refusing to build a QA image from a credential or dotenv file' >&2
            exit 1
          fi
          docker build --file "$QA_BACKEND_DOCKERFILE" --tag "gcr.io/${QA_PROJECT}/${QA_SERVICE}:${SOURCE_SHA}" .
          docker build --file "$QA_DESKTOP_DOCKERFILE" --tag "gcr.io/${QA_PROJECT}/${QA_DESKTOP_SERVICE}:${SOURCE_SHA}" .
          docker build --file "$QA_DRAIN_DOCKERFILE" --tag "gcr.io/${QA_PROJECT}/${QA_DRAIN_JOB}:${SOURCE_SHA}" .
          docker build --file "$QA_SWEEP_DOCKERFILE" --tag "gcr.io/${QA_PROJECT}/${QA_SWEEP_JOB}:${SOURCE_SHA}" .

      - name: Smoke every QA image before publication
        env:
          SOURCE_SHA: ${{ needs.admit.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 backend/scripts/runtime_image_contracts.py smoke \
            --dockerfile "$QA_BACKEND_DOCKERFILE" \
            --image "gcr.io/${QA_PROJECT}/${QA_SERVICE}:${SOURCE_SHA}"
          python3 backend/scripts/runtime_image_contracts.py smoke \
            --dockerfile "$QA_DESKTOP_DOCKERFILE" \
            --image "gcr.io/${QA_PROJECT}/${QA_DESKTOP_SERVICE}:${SOURCE_SHA}"
          python3 backend/scripts/runtime_image_contracts.py smoke \
            --dockerfile "$QA_DRAIN_DOCKERFILE" \
            --image "gcr.io/${QA_PROJECT}/${QA_DRAIN_JOB}:${SOURCE_SHA}"
          python3 backend/scripts/runtime_image_contracts.py smoke \
            --dockerfile "$QA_SWEEP_DOCKERFILE" \
            --image "gcr.io/${QA_PROJECT}/${QA_SWEEP_JOB}:${SOURCE_SHA}"

      - name: Publish and resolve immutable image digests
        id: images
        env:
          SOURCE_SHA: ${{ needs.admit.outputs.source_sha }}
        run: |
          set -euo pipefail
          publish_image() {
            local name="$1"
            local output_name="$2"
            local tag="gcr.io/${QA_PROJECT}/${name}:${SOURCE_SHA}"
            docker push "$tag" >/dev/null
            local digest
            digest="$(gcloud container images describe "$tag" --format='value(image_summary.digest)')"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            echo "${output_name}=gcr.io/${QA_PROJECT}/${name}@${digest}" >> "$GITHUB_OUTPUT"
          }
          publish_image "$QA_SERVICE" backend_image
          publish_image "$QA_DESKTOP_SERVICE" desktop_image
          publish_image "$QA_DRAIN_JOB" drain_image
          publish_image "$QA_SWEEP_JOB" sweep_image

  deploy:
    name: Deploy gates-closed QA resources
    needs: [admit, build]
    environment: development
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout admitted source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.admit.outputs.source_sha }}
          fetch-depth: 0

      - name: Google Auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Validate immutable QA deployment contract
        env:
          SOURCE_SHA: ${{ needs.admit.outputs.source_sha }}
          BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}
          DESKTOP_IMAGE: ${{ needs.build.outputs.desktop_image }}
          DRAIN_IMAGE: ${{ needs.build.outputs.drain_image }}
          SWEEP_IMAGE: ${{ needs.build.outputs.sweep_image }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" == "$(git rev-parse HEAD)" ]]
          python3 backend/scripts/jit_qa_cloud_run_contract.py validate \
            --project "$QA_PROJECT" \
            --region "$QA_REGION" \
            --auth-project "$QA_AUTH_PROJECT" \
            --uid "$QA_UID" \
            --drain-enabled false \
            --sweep-enabled false \
            --sweep-kill-switch false \
            --run-once "${{ inputs.run_once && 'true' || 'false' }}" \
            --confirmation "${{ inputs.confirmation }}" \
            --image "backend=$BACKEND_IMAGE" \
            --image "desktop=$DESKTOP_IMAGE" \
            --image "drain=$DRAIN_IMAGE" \
            --image "sweep=$SWEEP_IMAGE"

      - name: Deploy isolated QA backend service
        env:
          IMAGE: ${{ needs.build.outputs.backend_image }}
        run: |
          set -euo pipefail
          gcloud run deploy "$QA_SERVICE" \
            --project "$QA_PROJECT" \
            --region "$QA_REGION" \
            --image "$IMAGE" \
            --service-account "$QA_RUNTIME_SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --set-env-vars "OMI_ENV_STAGE=dev,GOOGLE_CLOUD_PROJECT=${QA_PROJECT},OMI_FIRESTORE_DATA_PLANE_PROJECT=${QA_PROJECT},FIREBASE_AUTH_PROJECT_ID=${QA_AUTH_PROJECT},MEMORY_ENABLED=on,MEMORY_BELIEF_MODEL_ENABLED=true,OMI_LLM_GATEWAY_FEATURE_MODE=direct,OMI_LLM_CHAT_AGENT_ROUTE=direct" \
            --set-secrets "ENCRYPTION_SECRET=ENCRYPTION_SECRET:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest" \
            --labels "managed-by=github-actions,jit-qa=true,source-sha=${{ needs.admit.outputs.source_sha }}" \
            --quiet

      - name: Deploy isolated QA desktop companion service
        env:
          IMAGE: ${{ needs.build.outputs.desktop_image }}
        run: |
          set -euo pipefail
          gcloud run deploy "$QA_DESKTOP_SERVICE" \
            --project "$QA_PROJECT" \
            --region "$QA_REGION" \
            --image "$IMAGE" \
            --service-account "$QA_RUNTIME_SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --set-env-vars "OMI_ENV_STAGE=dev,GOOGLE_CLOUD_PROJECT=${QA_PROJECT},OMI_FIRESTORE_DATA_PLANE_PROJECT=${QA_PROJECT},FIREBASE_AUTH_PROJECT_ID=${QA_AUTH_PROJECT},MEMORY_ENABLED=on,MEMORY_BELIEF_MODEL_ENABLED=true,OMI_LLM_GATEWAY_FEATURE_MODE=direct,OMI_LLM_CHAT_AGENT_ROUTE=direct" \
            --set-secrets "ENCRYPTION_SECRET=ENCRYPTION_SECRET:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest" \
            --labels "managed-by=github-actions,jit-qa=true,source-sha=${{ needs.admit.outputs.source_sha }}" \
            --quiet

      - name: Deploy isolated QA ledger drain job with gate closed
        env:
          IMAGE: ${{ needs.build.outputs.drain_image }}
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$QA_DRAIN_JOB" \
            --project "$QA_PROJECT" \
            --region "$QA_REGION" \
            --image "$IMAGE" \
            --service-account "$QA_RUNTIME_SERVICE_ACCOUNT" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 1200s \
            --set-env-vars "OMI_ENV_STAGE=dev,GOOGLE_CLOUD_PROJECT=${QA_PROJECT},OMI_FIRESTORE_DATA_PLANE_PROJECT=${QA_PROJECT},FIREBASE_AUTH_PROJECT_ID=${QA_AUTH_PROJECT},KNOWLEDGE_LEDGER_DRAIN_ENABLED=false,KNOWLEDGE_LEDGER_DRAIN_UID_ALLOWLIST=${QA_UID}" \
            --set-secrets "ENCRYPTION_SECRET=ENCRYPTION_SECRET:latest" \
            --labels "managed-by=github-actions,jit-qa=true,source-sha=${{ needs.admit.outputs.source_sha }}" \
            --quiet

      - name: Deploy isolated QA daily sweep job with gates closed
        env:
          IMAGE: ${{ needs.build.outputs.sweep_image }}
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$QA_SWEEP_JOB" \
            --project "$QA_PROJECT" \
            --region "$QA_REGION" \
            --image "$IMAGE" \
            --service-account "$QA_RUNTIME_SERVICE_ACCOUNT" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 1200s \
            --set-env-vars "OMI_ENV_STAGE=dev,GOOGLE_CLOUD_PROJECT=${QA_PROJECT},OMI_FIRESTORE_DATA_PLANE_PROJECT=${QA_PROJECT},FIREBASE_AUTH_PROJECT_ID=${QA_AUTH_PROJECT},MEMORY_DAILY_MEMORY_SWEEP_ENABLED=false,MEMORY_DAILY_MEMORY_SWEEP_KILL_SWITCH=false,MEMORY_DAILY_MEMORY_SWEEP_MODEL_ENABLED=false,MEMORY_DAILY_MEMORY_SWEEP_MODEL_NAME=disabled,MEMORY_DAILY_MEMORY_SWEEP_MAX_MODEL_CANDIDATES=8,MEMORY_DAILY_MEMORY_SWEEP_MAX_MODEL_COST_USD=0,MEMORY_DAILY_MEMORY_SWEEP_COHORT_ENABLED=false,MEMORY_DAILY_MEMORY_SWEEP_COHORT_FLAG=" \
            --set-secrets "ENCRYPTION_SECRET=ENCRYPTION_SECRET:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest" \
            --labels "managed-by=github-actions,jit-qa=true,source-sha=${{ needs.admit.outputs.source_sha }}" \
            --quiet

      - name: Verify deployed QA resource contracts
        env:
          BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}
          DESKTOP_IMAGE: ${{ needs.build.outputs.desktop_image }}
          DRAIN_IMAGE: ${{ needs.build.outputs.drain_image }}
          SWEEP_IMAGE: ${{ needs.build.outputs.sweep_image }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/jit-qa-contract"
          gcloud run services describe "$QA_SERVICE" --project "$QA_PROJECT" --region "$QA_REGION" --format=json > "$RUNNER_TEMP/jit-qa-contract/service.json"
          gcloud run services describe "$QA_DESKTOP_SERVICE" --project "$QA_PROJECT" --region "$QA_REGION" --format=json > "$RUNNER_TEMP/jit-qa-contract/desktop.json"
          gcloud run jobs describe "$QA_DRAIN_JOB" --project "$QA_PROJECT" --region "$QA_REGION" --format=json > "$RUNNER_TEMP/jit-qa-contract/drain.json"
          gcloud run jobs describe "$QA_SWEEP_JOB" --project "$QA_PROJECT" --region "$QA_REGION" --format=json > "$RUNNER_TEMP/jit-qa-contract/sweep.json"
          python3 backend/scripts/jit_qa_cloud_run_contract.py resource --kind service --profile backend --expected-image "$BACKEND_IMAGE" --resource-json "$RUNNER_TEMP/jit-qa-contract/service.json" --expected-name "$QA_SERVICE"
          python3 backend/scripts/jit_qa_cloud_run_contract.py resource --kind service --profile desktop --expected-image "$DESKTOP_IMAGE" --resource-json "$RUNNER_TEMP/jit-qa-contract/desktop.json" --expected-name "$QA_DESKTOP_SERVICE"
          python3 backend/scripts/jit_qa_cloud_run_contract.py resource --kind job --profile drain --expected-image "$DRAIN_IMAGE" --resource-json "$RUNNER_TEMP/jit-qa-contract/drain.json" --expected-name "$QA_DRAIN_JOB"
          python3 backend/scripts/jit_qa_cloud_run_contract.py resource --kind job --profile sweep --expected-image "$SWEEP_IMAGE" --resource-json "$RUNNER_TEMP/jit-qa-contract/sweep.json" --expected-name "$QA_SWEEP_JOB"

      - name: Verify read-only execution permissions on QA jobs
        run: |
          set -euo pipefail
          token="$(gcloud auth print-access-token)"
          for job in "$QA_DRAIN_JOB" "$QA_SWEEP_JOB"; do
            response="$RUNNER_TEMP/jit-qa-contract/${job}-permissions.json"
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${token}" \
              -H 'Content-Type: application/json' \
              --data '{"permissions":["run.jobs.get","run.jobs.run","run.jobs.runWithOverrides"]}' \
              "https://run.googleapis.com/v2/projects/${QA_PROJECT}/locations/${QA_REGION}/jobs/${job}:testIamPermissions" \
              > "$response"
            python3 - "$response" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {"run.jobs.get", "run.jobs.run", "run.jobs.runWithOverrides"}
          granted = set(payload.get("permissions", []))
          missing = expected - granted
          if missing:
              raise SystemExit(f"missing QA execution permissions: {sorted(missing)}")
          PY
          done

      - name: Admit one bounded QA execution when explicitly confirmed
        if: inputs.run_once == true
        run: |
          set -euo pipefail
          python3 backend/scripts/jit_qa_cloud_run_contract.py execution \
            --run-once true \
            --confirmation "${{ inputs.confirmation }}" \
            --sweep-kill-switch false
          install -d -m 700 "$RUNNER_TEMP/jit-qa-receipt"
          receipt="$RUNNER_TEMP/jit-qa-receipt/executions.json"
          : > "$receipt"
          run_job() {
            local job="$1"
            shift
            local response="$RUNNER_TEMP/jit-qa-receipt/${job}-execution.json"
            gcloud run jobs execute "$job" \
              --project "$QA_PROJECT" \
              --region "$QA_REGION" \
              --update-env-vars "$*" \
              --format=json > "$response"
            python3 - "$response" "$job" "$receipt" <<'PY'
          import json
          import sys
          from pathlib import Path

          response_path, job, receipt_path = sys.argv[1:]
          payload = json.loads(Path(response_path).read_text(encoding="utf-8"))
          metadata = payload.get("metadata") if isinstance(payload, dict) else None
          execution_name = metadata.get("name") if isinstance(metadata, dict) else None
          if not isinstance(execution_name, str) or not execution_name.startswith(f"{job}-"):
              raise SystemExit("Cloud Run did not return the expected QA execution identity")
          Path(receipt_path).write_text(json.dumps({"job": job, "execution": execution_name}) + "\n", encoding="utf-8")
          print(execution_name)
          PY
          }
          drain_execution="$(run_job "$QA_DRAIN_JOB" "KNOWLEDGE_LEDGER_DRAIN_ENABLED=true,KNOWLEDGE_LEDGER_DRAIN_UID_ALLOWLIST=${QA_UID}")"
          sweep_execution="$(run_job "$QA_SWEEP_JOB" "MEMORY_DAILY_MEMORY_SWEEP_ENABLED=true,MEMORY_DAILY_MEMORY_SWEEP_KILL_SWITCH=false,MEMORY_DAILY_MEMORY_SWEEP_MODEL_ENABLED=true,MEMORY_DAILY_MEMORY_SWEEP_MODEL_NAME=gpt-5.6-luna,MEMORY_DAILY_MEMORY_SWEEP_MAX_MODEL_CANDIDATES=8,MEMORY_DAILY_MEMORY_SWEEP_MAX_MODEL_COST_USD=0.80,MEMORY_DAILY_MEMORY_SWEEP_COHORT_ENABLED=true,MEMORY_DAILY_MEMORY_SWEEP_COHORT_FLAG=jit-processing-v1")"
          export DRAIN_EXECUTION="$drain_execution"
          export SWEEP_EXECUTION="$sweep_execution"
          python3 - "$receipt" "$QA_DRAIN_JOB" "$QA_SWEEP_JOB" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          receipt_path, drain_job, sweep_job = sys.argv[1:]
          payload = {
              "schema_version": "jit-qa-cloud-run-execution.v1",
              "project": "based-hardware-dev",
              "region": "us-central1",
              "drain_job": drain_job,
              "drain_execution": os.environ["DRAIN_EXECUTION"],
              "sweep_job": sweep_job,
              "sweep_execution": os.environ["SWEEP_EXECUTION"],
          }
          Path(receipt_path).write_text(json.dumps(payload, sort_keys=True) + "\n", encoding="utf-8")
          PY
          poll_execution() {
            local job="$1"
            local execution="$2"
            local state_file="$RUNNER_TEMP/jit-qa-receipt/${job}-state.json"
            for _ in $(seq 1 80); do
              gcloud run jobs executions describe "$execution" --job "$job" --project "$QA_PROJECT" --region "$QA_REGION" --format=json > "$state_file"
              state="$(python3 - "$state_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          conditions = payload.get("status", {}).get("conditions", [])
          completed = next((item for item in conditions if item.get("type") == "Completed"), None)
          if completed is None or completed.get("status") not in {"True", "False"}:
              print("running")
          elif completed.get("status") == "True":
              print("succeeded")
          else:
              print("failed")
          PY
              )"
              case "$state" in
                succeeded) return 0 ;;
                failed) echo "QA execution failed for ${job}" >&2; return 1 ;;
              esac
              sleep 15
            done
            echo "QA execution exceeded the bounded 20-minute wait for ${job}" >&2
            return 1
          }
          poll_execution "$QA_DRAIN_JOB" "$drain_execution"
          poll_execution "$QA_SWEEP_JOB" "$sweep_execution"
          echo "QA drain and sweep executions completed; receipt is content-free." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload content-free QA execution receipt
        if: always() && inputs.run_once == true
        uses: actions/upload-artifact@v7
        with:
          name: jit-qa-cloud-run-execution-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/jit-qa-receipt/executions.json
          if-no-files-found: warn

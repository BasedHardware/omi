name: backend-worker-staging

on:
  push:
    branches: [main, v5]
  pull_request:
    branches: [main, v5]
  workflow_dispatch:

jobs:
  validate:
    name: Validate backend worker
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_WRITE_LOGS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Worker typechecking imports workspace packages whose declaration output is
      # intentionally not checked in. Build them before invoking worker-local gates.
      - name: Build workspace dependencies
        run: bun run build
      - name: Format check
        run: bun run --cwd apps/backend-worker format:check
      - name: Lint
        run: bun run --cwd apps/backend-worker lint
      - name: Typecheck
        run: bun run --cwd apps/backend-worker typecheck
      - name: Test
        run: bun run --cwd apps/backend-worker test
      - name: Dry run deploy
        run: bun run --cwd apps/backend-worker deploy:dry-run

  deploy:
    name: Deploy to staging
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    env:
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_WRITE_LOGS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Deploy
        run: bun run --cwd apps/backend-worker deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify /ready
        if: vars.STAGING_WORKER_URL != ''
        run: bun run --cwd apps/backend-worker verify:ready "${{ vars.STAGING_WORKER_URL }}/ready"

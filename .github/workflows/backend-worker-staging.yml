name: backend-worker-staging

on:
  push:
    branches: [main, v5]
  pull_request:
    branches: [main, v5]
  workflow_dispatch:

jobs:
  validate:
    name: Validate backend worker
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_WRITE_LOGS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install portable backend dependencies
        run: bun install --cwd backends/example-platform --frozen-lockfile
      # Worker typechecking imports workspace packages whose declaration output is
      # intentionally not checked in. Build those packages only — the root
      # `bun run build` also compiles the PWA and needs an optional Rollup
      # linux binary that `bun install --frozen-lockfile` does not fetch.
      - name: Build workspace dependencies
        run: bun run --cwd packages/contracts/ratified build && bun x tsc -b
      - name: Format check
        run: bun run --cwd apps/backend-worker format:check
      - name: Lint
        run: bun run --cwd apps/backend-worker lint
      - name: Typecheck
        run: bun run --cwd apps/backend-worker typecheck
      - name: Test
        run: bun run --cwd apps/backend-worker test
      - name: PWA tests
        run: bun run --cwd pwa test
      - name: Native C++ boundary suites
        run: bun run native:test
      - name: Portable backend contracts
        run: bun run platform:check
      - name: Portable PostgreSQL integration and runtime parity
        timeout-minutes: 20
        run: bun run --cwd backends/example-platform test:postgres
      - name: Dry run deploy
        run: bun run --cwd apps/backend-worker deploy:dry-run

  swift:
    name: Swift package build and test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build (runs the Skip skipstone transpilation)
        run: swift build
      - name: Test
        run: swift test

  deploy:
    name: Deploy to staging
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    env:
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_WRITE_LOGS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply D1 migrations
        run: |
          bun run --cwd apps/backend-worker migrate:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify D1 migration preflight
        run: |
          test -n "${{ vars.STAGING_D1_MIGRATION_EVIDENCE_URL }}"
          test -n "${{ vars.STAGING_D1_MIGRATION_EVIDENCE_ID }}"
          bun run --cwd apps/backend-worker verify:migrations "${{ vars.STAGING_D1_MIGRATION_EVIDENCE_URL }}" --evidence "${{ vars.STAGING_D1_MIGRATION_EVIDENCE_ID }}"
      - name: Deploy
        run: bun run --cwd apps/backend-worker deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify release gate
        run: |
          test -n "${{ vars.STAGING_WORKER_URL }}"
          test -n "${{ vars.STAGING_OBSERVABILITY_SINK_MODE }}"
          if [ "${{ vars.STAGING_OBSERVABILITY_SINK_MODE }}" = "better_stack" ]; then
            test -n "${{ vars.STAGING_BETTER_STACK_EVIDENCE_ID }}"
            bun run --cwd apps/backend-worker verify:release "${{ vars.STAGING_WORKER_URL }}/ready" --environment staging --observability-sink-mode "${{ vars.STAGING_OBSERVABILITY_SINK_MODE }}" --better-stack-evidence "${{ vars.STAGING_BETTER_STACK_EVIDENCE_ID }}"
          else
            bun run --cwd apps/backend-worker verify:release "${{ vars.STAGING_WORKER_URL }}/ready" --environment staging --observability-sink-mode "${{ vars.STAGING_OBSERVABILITY_SINK_MODE }}"
          fi

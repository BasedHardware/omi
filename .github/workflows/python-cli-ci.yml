name: Python CLI

on:
  push:
    branches: [main]
    paths:
      - 'sdks/python-cli/**'
      - '.github/workflows/python-cli-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sdks/python-cli/**'
      - '.github/workflows/python-cli-ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: sdks/python-cli

jobs:
  tests:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux / Python 3.13
            os: ubuntu-latest
            python-version: '3.13'
          - label: Windows ACL / Python 3.13
            os: windows-latest
            python-version: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@ecd24dd710f2fb0dca1693a67af11fc4a5c5ec84
        with:
          enable-cache: true
          cache-dependency-glob: sdks/python-cli/uv.lock

      - name: Install package and test dependencies
        run: |
          uv python install ${{ matrix.python-version }}
          uv sync --frozen --extra dev

      - name: Run tests
        run: uv run pytest -q

name: Python CLI

on:
  # Nightly calls run these same jobs against one immutable main snapshot.
  workflow_call:
    inputs:
      nightly_main_sha:
        description: Main SHA pinned by the unfiltered nightly caller
        type: string
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'sdks/python-cli/**'
      - '.github/actions/ci-tier/**'
      - '.github/workflows/python-cli-ci.yml'
      - '.github/workflows/publish_omi_cli.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sdks/python-cli/**'
      - '.github/actions/ci-tier/**'
      - '.github/workflows/python-cli-ci.yml'
      - '.github/workflows/publish_omi_cli.yml'

concurrency:
  # PRs cancel their own older runs. Main pushes share one ref-keyed group
  # with cancel-in-progress false: the running tests finish and only the
  # newest pending main SHA runs next — a burst of CLI merges no longer
  # queues a superseded suite for every intermediate SHA.
  group: python-cli-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}-${{ inputs.nightly_main_sha != '' && format('nightly-{0}', github.run_id) || 'normal' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: read

defaults:
  run:
    working-directory: sdks/python-cli

env:
  # Abort a git HTTP transfer that stays under 1 KB/s for 60 s, so actions/checkout
  # retries instead of hanging 7-10 min until the TCP reset (#22890).
  GIT_HTTP_LOW_SPEED_LIMIT: "1000"
  GIT_HTTP_LOW_SPEED_TIME: "60"

jobs:
  ci-tier:
    name: Resolve CI Tier
    runs-on: ubuntu-latest
    outputs:
      full_ci: ${{ inputs.nightly_main_sha != '' && 'true' || (steps.resolve.outputs.full_ci) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.nightly_main_sha || github.sha }}
      - id: resolve
        uses: ./.github/actions/ci-tier
      - name: Explain deferred Windows coverage
        if: steps.resolve.outputs.full_ci != 'true'
        run: |
          notice='fork PR — a maintainer adds label ci:full, then Re-run all jobs'
          echo "::notice title=Heavy CI deferred::$notice"
          echo "Heavy CI deferred: $notice" >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux / Python 3.10
            os: ubuntu-latest
            python-version: '3.10'
          - label: Linux / Python 3.12
            os: ubuntu-latest
            python-version: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.nightly_main_sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sdks/python-cli/pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  windows-acl:
    name: Windows ACL / Python 3.12
    needs: ci-tier
    if: needs.ci-tier.outputs.full_ci == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.nightly_main_sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sdks/python-cli/pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  install-smoke:
    name: Clean install smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 exercises the tomli dependency marker, 3.11 exercises the
        # stdlib tomllib path, and 3.12 is the newest advertised version.
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.nightly_main_sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Verify clean install of the built wheel
        run: bash verify-clean-install.sh dist

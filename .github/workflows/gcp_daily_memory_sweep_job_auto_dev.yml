name: Auto Deploy Daily Memory Sweep Job to Development

on:
  workflow_run:
    workflows: ["Release Eligibility"]
    branches: [main]
    types: [completed]

env:
  SERVICE: daily-memory-sweep-job
  SCHEDULER_JOB: daily-memory-sweep-hourly
  LEDGER_DRAIN_SERVICE: knowledge-ledger-drain-job
  LEDGER_DRAIN_SCHEDULER_JOB: knowledge-ledger-drain-hourly
  SCHEDULER_SERVICE_ACCOUNT: memory-maintenance-scheduler@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
  REGION: us-central1

# Share the lock with manual development deploys of this Cloud Run job.
concurrency:
  group: deploy-cloud-run-daily-memory-sweep-job-development
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    environment: development
    permissions:
      actions: 'read'
      contents: 'read'

    runs-on: ubuntu-latest
    steps:
      # Retain this until the summary shows it no longer buys enough headroom.
      - name: Measure runner disk cleanup
        run: |
          started_at=$SECONDS
          free_before=$(df -h / | awk 'NR == 2 { print $4 }')
          rm -rf /opt/hostedtoolcache
          free_after=$(df -h / | awk 'NR == 2 { print $4 }')
          {
            echo "### Runner disk cleanup"
            echo "- Duration: $((SECONDS - started_at))s"
            echo "- Free space: ${free_before} → ${free_after}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require successful first-attempt Release Eligibility push
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]] || {
            echo "ERROR: Release Eligibility did not succeed." >&2
            exit 1
          }
          [[ "${{ github.event.workflow_run.run_attempt }}" == "1" ]] || {
            echo "ERROR: only the first Release Eligibility attempt may admit deployment." >&2
            exit 1
          }
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "ERROR: Release Eligibility head SHA is not a full commit SHA." >&2
            exit 1
          }

      - name: Checkout current main for source admission
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact admitted main source
        id: admitted_source
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ || "$DEPLOY_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "ERROR: push SHA must be one non-zero, lowercase, full commit SHA." >&2
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          main_sha="$(git rev-parse --verify 'origin/main^{commit}')"
          [[ "$DEPLOY_SHA" == "$main_sha" ]] || {
            echo "ERROR: main advanced before source admission; refusing stale development deployment." >&2
            exit 1
          }
          proof_path="${RUNNER_TEMP}/release-eligibility-${DEPLOY_SHA}.json"
          gh api -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-eligibility.yml/runs?event=push&branch=main&status=completed&head_sha=${DEPLOY_SHA}&per_page=100" \
            > "$proof_path"
          python3 .github/scripts/verify_backend_release_admission.py \
            --sha "$DEPLOY_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-runs "$proof_path" \
            --require-first-attempt
          printf 'admitted_sha=%s\n' "$DEPLOY_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout admitted source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.admitted_source.outputs.admitted_sha }}
          fetch-depth: 0

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Login to GCR
        run: gcloud auth configure-docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute short SHA
        id: image-tag
        run: |
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Python deps for deploy scripts
        run: python3 -m pip install -q pyyaml

      - name: Get GKE credentials for gateway serving gate
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ env.REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Verify LLM Gateway serving data plane
        id: gateway-serving
        run: |
          python3 backend/scripts/verify-llm-gateway-serving.py \
            --environment=dev \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/modal/Dockerfile.daily_memory_sweep_job
          push: false
          load: true
          tags: |
            gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:latest
            gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${{ steps.image-tag.outputs.short_sha }}
          cache-from: type=registry,ref=gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:buildcache
          cache-to: type=registry,ref=gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:buildcache,mode=max

      - name: Build ledger drain runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/modal/Dockerfile.knowledge_ledger_drain_job
          push: false
          load: true
          tags: |
            gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.LEDGER_DRAIN_SERVICE }}:latest
            gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.LEDGER_DRAIN_SERVICE }}:${{ steps.image-tag.outputs.short_sha }}
          cache-from: type=registry,ref=gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.LEDGER_DRAIN_SERVICE }}:buildcache
          cache-to: type=registry,ref=gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.LEDGER_DRAIN_SERVICE }}:buildcache,mode=max

      - name: Verify built runtime image before publish
        run: |
          image=gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${{ steps.image-tag.outputs.short_sha }}
          python3 backend/scripts/runtime_image_contracts.py smoke \
            --dockerfile backend/modal/Dockerfile.daily_memory_sweep_job \
            --image "$image"
          ledger_image=gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.LEDGER_DRAIN_SERVICE }}:${{ steps.image-tag.outputs.short_sha }}
          python3 backend/scripts/runtime_image_contracts.py smoke \
            --dockerfile backend/modal/Dockerfile.knowledge_ledger_drain_job \
            --image "$ledger_image"

      - name: Recheck admitted main before image publication
        env:
          ADMITTED_SHA: ${{ steps.admitted_source.outputs.admitted_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_main_sha="$(git rev-parse --verify 'origin/main^{commit}')"
          [[ "$current_main_sha" == "$ADMITTED_SHA" ]] || {
            echo "ERROR: main advanced after source admission; refusing stale image publication." >&2
            exit 1
          }

      - name: Push verified runtime image
        run: |
          docker push gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:latest
          docker push gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${{ steps.image-tag.outputs.short_sha }}
          docker push gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.LEDGER_DRAIN_SERVICE }}:latest
          docker push gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.LEDGER_DRAIN_SERVICE }}:${{ steps.image-tag.outputs.short_sha }}

      - name: Probe memory L2 gateway lane from the Cloud Run VPC
        run: |
          bash backend/scripts/probe-llm-gateway-from-cloud-run.sh \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --image "gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${{ steps.image-tag.outputs.short_sha }}" \
            --gateway-url "${{ steps.gateway-serving.outputs.gateway_url }}" \
            --network "${{ vars.CLOUD_RUN_VPC_NETWORK }}" \
            --subnet "${{ vars.CLOUD_RUN_VPC_SUBNET }}" \
            --vpc-egress private-ranges-only \
            --lane omi:auto:memory-l2 \
            --name-suffix "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Render maintenance runtime env from the gated gateway endpoint
        id: runtime-env
        env:
          CLOUD_RUN_VPC_NETWORK: ${{ vars.CLOUD_RUN_VPC_NETWORK }}
          CLOUD_RUN_VPC_SUBNET: ${{ vars.CLOUD_RUN_VPC_SUBNET }}
          OMI_LLM_GATEWAY_URL: ${{ steps.gateway-serving.outputs.gateway_url }}
        run: |
          python3 backend/scripts/render_backend_runtime_env.py --env dev --job daily-memory-sweep-job >> "$GITHUB_OUTPUT"
          python3 backend/scripts/render_backend_runtime_env.py --env dev --job knowledge-ledger-drain-job >> "$GITHUB_OUTPUT"

      - name: Validate backend runtime env before deploy
        run: |
          python3 backend/scripts/validate-backend-runtime-env.py --env dev --check-workflows

      - name: Recheck admitted main before Cloud Run deployment
        env:
          ADMITTED_SHA: ${{ steps.admitted_source.outputs.admitted_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_main_sha="$(git rev-parse --verify 'origin/main^{commit}')"
          [[ "$current_main_sha" == "$ADMITTED_SHA" ]] || {
            echo "ERROR: main advanced after image publication; refusing stale Cloud Run deployment." >&2
            exit 1
          }

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          job: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          image: gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${{ steps.image-tag.outputs.short_sha }}
          flags: ${{ steps.runtime-env.outputs.cloud_run_flags }} ${{ steps.runtime-env.outputs.daily_memory_sweep_job_flags }}
          env_vars: ${{ steps.runtime-env.outputs.daily_memory_sweep_job_env_vars }}
          secrets: ${{ steps.runtime-env.outputs.daily_memory_sweep_job_secrets }}

      - name: Deploy independent ledger drain to Cloud Run
        id: deploy-ledger-drain
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          job: ${{ env.LEDGER_DRAIN_SERVICE }}
          region: ${{ env.REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          image: gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.LEDGER_DRAIN_SERVICE }}:${{ steps.image-tag.outputs.short_sha }}
          flags: ${{ steps.runtime-env.outputs.cloud_run_flags }} ${{ steps.runtime-env.outputs.knowledge_ledger_drain_job_flags }}
          env_vars: ${{ steps.runtime-env.outputs.knowledge_ledger_drain_job_env_vars }}
          secrets: ${{ steps.runtime-env.outputs.knowledge_ledger_drain_job_secrets }}

      - name: Authorize ledger drain Scheduler invocations
        run: |
          gcloud run jobs add-iam-policy-binding "$LEDGER_DRAIN_SERVICE" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="$REGION" \
            --member="serviceAccount:${SCHEDULER_SERVICE_ACCOUNT}" \
            --role="roles/run.invoker" \
            --quiet

      - name: Provision hourly Scheduler trigger from admitted source
        run: |
          python3 backend/scripts/provision_daily_memory_sweep_scheduler.py \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "$REGION" \
            --scheduler-job "$SCHEDULER_JOB" \
            --cloud-run-job "$SERVICE" \
            --service-account "$SCHEDULER_SERVICE_ACCOUNT"
          python3 backend/scripts/provision_daily_memory_sweep_scheduler.py \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "$REGION" \
            --scheduler-job "$LEDGER_DRAIN_SCHEDULER_JOB" \
            --cloud-run-job "$LEDGER_DRAIN_SERVICE" \
            --service-account "$SCHEDULER_SERVICE_ACCOUNT"

      - name: Validate hourly Scheduler trigger
        run: |
          scheduler_state_file=$(mktemp)
          ledger_scheduler_state_file=$(mktemp)
          trap 'rm -f "$scheduler_state_file" "$ledger_scheduler_state_file"' EXIT
          gcloud scheduler jobs describe "$SCHEDULER_JOB" \
            --location="$REGION" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --format=json > "$scheduler_state_file"
          python3 backend/scripts/validate_memory_maintenance_scheduler.py \
            --state-file "$scheduler_state_file" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "$REGION" \
            --scheduler-job "$SCHEDULER_JOB" \
            --cloud-run-job "$SERVICE"
          gcloud scheduler jobs describe "$LEDGER_DRAIN_SCHEDULER_JOB" \
            --location="$REGION" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --format=json > "$ledger_scheduler_state_file"
          python3 backend/scripts/validate_memory_maintenance_scheduler.py \
            --state-file "$ledger_scheduler_state_file" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "$REGION" \
            --scheduler-job "$LEDGER_DRAIN_SCHEDULER_JOB" \
            --cloud-run-job "$LEDGER_DRAIN_SERVICE"

      - name: Show Output
        run: echo ${{ steps.deploy.outputs.url }}

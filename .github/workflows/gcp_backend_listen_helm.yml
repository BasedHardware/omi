name: Upgrade Backend Listen Helm Chart

on:
  # Auto-apply when chart values or templates change on main, so new secret
  # bindings / env-var references ship to GKE without a manual workflow_dispatch.
  push:
    branches: [ "main" ]
    paths:
      - 'backend/charts/backend-listen/**'
      - 'backend/charts/backend-secrets/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - prod
      branch:
        description: 'Branch to deploy from'
        required: true
        default: 'main'
      mode:
        description: 'deploy applies the chart; rollback restores an earlier Helm revision'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback
      image_tag:
        description: 'Short-SHA image to deploy (blank builds or resolves the admitted source image). Prod requires an ancestor of main.'
        required: false
        default: ''
      helm_revision:
        description: 'Helm revision to roll back to (blank = previous). See the Helm history step output.'
        required: false
        default: ''
      gateway_feature_mode:
        # GitHub Actions rejects choice option literal "off" (422 on workflow_dispatch).
        # Use "disabled" in the UI/API; the resolve step maps it to env value "off".
        description: 'Optional OMI_LLM_GATEWAY_FEATURE_MODE override (chart-default = values file; disabled = off)'
        required: false
        default: chart-default
        type: choice
        options:
          - chart-default
          - disabled
          - gateway
      chat_agent_route:
        # Independent kill switch for managed agentic/desktop chat (Luna lane).
        # "direct" forces Anthropic direct without flipping FEATURE_MODE.
        description: 'Optional OMI_LLM_CHAT_AGENT_ROUTE override (chart-default = values file; direct = off Luna chat)'
        required: false
        default: chart-default
        type: choice
        options:
          - chart-default
          - direct
          - gateway
      allow_direct_model_exception:
        description: 'Optional OMI_LLM_GATEWAY_ALLOW_DIRECT_MODEL_EXCEPTION override (chart-default = values file)'
        required: false
        default: chart-default
        type: choice
        options:
          - chart-default
          - 'true'
          - 'false'
      stt_service_models:
        description: 'Optional STT_SERVICE_MODELS override (blank = chart values file)'
        required: false
        default: ''
        type: string
      translation_service_models:
        description: 'Optional TRANSLATION_SERVICE_MODELS override (blank = chart values file)'
        required: false
        default: ''
        type: string

# This chart path mutates backend-listen and shared backend-secrets, which are
# also applied by the full backend deploy for the same environment.
concurrency:
  group: deploy-backend-stack-${{ github.event.inputs.environment || 'development' }}
  cancel-in-progress: false

env:
  REGION: us-central1

jobs:
  backend_source:
    # Source admission and image identity are isolated from the deployment job so
    # the qualification job can consume one immutable source SHA.  Rollback is a
    # Helm-only recovery path and deliberately skips this job.
    if: >-
      github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'deploy'
    environment: ${{ github.event.inputs.environment == 'prod' && 'prod' || 'development' }}
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      image_tag: ${{ steps.image.outputs.image_tag }}
      image_ref: ${{ steps.image.outputs.image_ref }}
      image_digest: ${{ steps.image.outputs.image_digest }}
    steps:
      - name: Validate deployment input before source or registry work
        env:
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment || 'development' }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_ENVIRONMENT" != development && "$DEPLOY_ENVIRONMENT" != prod ]]; then
            echo "ERROR: environment must be development or prod, got $DEPLOY_ENVIRONMENT." >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push && "$DEPLOY_ENVIRONMENT" == prod ]]; then
            echo "ERROR: production deployment requires workflow_dispatch." >&2
            exit 1
          fi

      - name: Fetch requested source
        env:
          FETCH_REF: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod') && 'main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch --no-tags origin "$FETCH_REF"
          git checkout --detach FETCH_HEAD

      - name: Admit exact backend source
        id: source
        env:
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment || 'development' }}
          REQUESTED_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push && "$DEPLOY_ENVIRONMENT" == prod ]]; then
            echo "ERROR: production deployment requires workflow_dispatch." >&2
            exit 1
          fi
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          [[ "$CHECKED_OUT_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "ERROR: checkout did not resolve a full commit SHA." >&2
            exit 1
          }
          if [[ "$DEPLOY_ENVIRONMENT" == prod ]]; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          fi

          if [[ -n "$REQUESTED_IMAGE_TAG" ]]; then
            if ! git cat-file -e "${REQUESTED_IMAGE_TAG}^{commit}" 2>/dev/null; then
              echo "ERROR: image_tag $REQUESTED_IMAGE_TAG is not a commit in this repository." >&2
              exit 1
            fi
            SOURCE_SHA="$(git rev-parse "${REQUESTED_IMAGE_TAG}^{commit}")"
          else
            SOURCE_SHA="$CHECKED_OUT_SHA"
          fi
          if [[ "$DEPLOY_ENVIRONMENT" == prod ]] && ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "ERROR: admitted source $SOURCE_SHA is not an ancestor of fresh origin/main $(git rev-parse origin/main)." >&2
            exit 1
          fi
          printf 'source_sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Admitted backend source: $SOURCE_SHA"

      - name: Google Auth
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker auth
        run: gcloud auth configure-docker --quiet

      - name: Resolve or build exact backend image
        id: image
        env:
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment || 'development' }}
          REQUESTED_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          IMAGE_REPOSITORY="gcr.io/${GCP_PROJECT_ID}/backend"
          RESOLVED_IMAGE_TAG="$(git rev-parse --short=7 "$SOURCE_SHA")"
          IMAGE="${IMAGE_REPOSITORY}:${RESOLVED_IMAGE_TAG}"
          if [[ -n "$REQUESTED_IMAGE_TAG" ]]; then
            REQUESTED_RESOLVED="$(git rev-parse --short=7 "${REQUESTED_IMAGE_TAG}^{commit}")"
            [[ "$REQUESTED_RESOLVED" == "$RESOLVED_IMAGE_TAG" ]] || {
              echo "ERROR: requested image tag resolves to $REQUESTED_RESOLVED, admitted source resolves to $RESOLVED_IMAGE_TAG." >&2
              exit 1
            }
          fi

          DESCRIBE_ERROR="$RUNNER_TEMP/backend-image-describe.err"
          if gcloud container images describe "$IMAGE" --project "$GCP_PROJECT_ID" > /dev/null 2> "$DESCRIBE_ERROR"; then
            # A source-derived tag is the lineage contract.  Resolve the tag to
            # its immutable digest before passing identity to later jobs.
            DIGEST="$(gcloud container images describe "$IMAGE" --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
            TAGS="$(gcloud container images describe "$IMAGE" --project "$GCP_PROJECT_ID" --format='value(image_summary.tags)')"
            [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "ERROR: registry image $IMAGE did not resolve to a sha256 digest." >&2
              exit 1
            }
            grep -Eq "(^|[[:space:],])${RESOLVED_IMAGE_TAG}([[:space:],]|$)" <<<"$TAGS" || {
              echo "ERROR: registry image $IMAGE has no exact source-derived tag ${RESOLVED_IMAGE_TAG}." >&2
              exit 1
            }
            echo "Using existing immutable registry image ${IMAGE}@${DIGEST} for source ${SOURCE_SHA}."
          else
            if ! grep -Eiq "not found|does not exist|does not have" "$DESCRIBE_ERROR"; then
              echo "ERROR: could not determine whether registry image $IMAGE exists." >&2
              cat "$DESCRIBE_ERROR" >&2
              exit 1
            fi
            echo "No registry image for ${IMAGE}; building and smoking the admitted source."
            docker build --file backend/Dockerfile --tag "$IMAGE" .
            python3 backend/scripts/runtime_image_contracts.py smoke \
              --dockerfile backend/Dockerfile \
              --image "$IMAGE"
            docker push "$IMAGE"
            DIGEST="$(gcloud container images describe "$IMAGE" --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
            [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "ERROR: pushed image $IMAGE did not resolve to a sha256 digest." >&2
              exit 1
            }
          fi
          {
            printf 'image_tag=%s\n' "$RESOLVED_IMAGE_TAG"
            printf 'image_digest=%s\n' "$DIGEST"
            printf 'image_ref=%s@%s\n' "$IMAGE" "$DIGEST"
          } >> "$GITHUB_OUTPUT"

  parakeet_qualification:
    needs: backend_source
    if: >-
      needs.backend_source.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'deploy')
    uses: ./.github/workflows/parakeet_gpu_tests.yml
    with:
      source_sha: ${{ needs.backend_source.outputs.source_sha }}
      # The reusable job builds an image from this exact source SHA and exposes
      # its immutable digest plus the same-run capacity artifact.
      build_source: true
      stream_capacity: '25'
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  helm-upgrade:
    needs: [backend_source, parakeet_qualification]
    if: >-
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'rollback') ||
        (
          (github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'deploy') &&
          needs.backend_source.result == 'success' &&
          needs.parakeet_qualification.result == 'success'
        )
      )
    # On manual dispatch use the chosen environment; on auto push only deploy
    # to dev (prod still requires an explicit workflow_dispatch for safety).
    environment: ${{ github.event.inputs.environment == 'prod' && 'prod' || 'development' }}
    permissions:
      actions: 'read'
      contents: 'read'
      id-token: 'write'

    runs-on: ubuntu-latest
    steps:
      - name: Validate Environment Input
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${{ github.event.inputs.environment }}" != "development" && "${{ github.event.inputs.environment }}" != "prod" ]]; then
            echo "Invalid environment: ${{ github.event.inputs.environment }}. Must be 'development' or 'prod'."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.environment == 'prod' && 'main' || github.event.inputs.branch }}
          fetch-depth: 0

      - name: Select admitted backend source
        if: ${{ (github.event.inputs.mode || 'deploy') == 'deploy' }}
        env:
          ADMITTED_SOURCE_SHA: ${{ needs.backend_source.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$ADMITTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "ERROR: source admission did not return a full commit SHA." >&2
            exit 1
          }
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch --no-tags origin "$ADMITTED_SOURCE_SHA"
          git checkout --detach "$ADMITTED_SOURCE_SHA"

      - name: Admit checked-out production source and image identity
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          if [[ "${{ github.event.inputs.environment }}" == prod ]]; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor "$CHECKED_OUT_SHA" origin/main; then
              echo "ERROR: checked-out HEAD $CHECKED_OUT_SHA is not an ancestor of fresh origin/main $(git rev-parse origin/main)." >&2
              exit 1
            fi
          fi
          IMAGE_TAG=$(git rev-parse --short=7 "$CHECKED_OUT_SHA")
          echo "Admitted deployment source: $CHECKED_OUT_SHA"
          echo "CHECKED_OUT_SHA=$CHECKED_OUT_SHA" >> "$GITHUB_ENV"
          # Deploy mode is admitted by backend_source and its reusable GPU
          # qualification. Rollback keeps the old chart-only source path.
          if [[ "${{ github.event.inputs.mode || 'deploy' }}" == deploy ]]; then
            EXPECTED_SHA="${{ needs.backend_source.outputs.source_sha }}"
            [[ "$CHECKED_OUT_SHA" == "$EXPECTED_SHA" ]] || {
              echo "ERROR: listener checkout $CHECKED_OUT_SHA differs from admitted source $EXPECTED_SHA." >&2
              exit 1
            }
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ env.REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Show Helm release history
        run: |
          echo "Rollback targets for ${{ vars.ENV }}-omi-backend-listen:"
          helm -n ${{ vars.ENV }}-omi-backend history ${{ vars.ENV }}-omi-backend-listen --max 20 \
            || echo "No existing release found"

      - name: Download exact Parakeet GPU qualification artifact
        if: ${{ (github.event.inputs.mode || 'deploy') == 'deploy' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.parakeet_qualification.outputs.artifact_name }}
          path: ${{ runner.temp }}/parakeet-qualification

      - name: Resolve Parakeet qualification evidence path
        id: parakeet-qualification-evidence
        if: ${{ (github.event.inputs.mode || 'deploy') == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t evidence < <(find "$RUNNER_TEMP/parakeet-qualification" -type f -name 'stream-capacity-results.json' -print)
          [[ "${#evidence[@]}" == 1 ]] || {
            echo "Expected exactly one Parakeet stream qualification artifact, found ${#evidence[@]}." >&2
            exit 1
          }
          echo "path=${evidence[0]}" >> "$GITHUB_OUTPUT"

      - name: Provision and verify Parakeet stream fleet
        if: ${{ (github.event.inputs.mode || 'deploy') == 'deploy' }}
        env:
          QUALIFIED_IMAGE_REF: ${{ needs.parakeet_qualification.outputs.image_ref }}
          QUALIFIED_SOURCE_SHA: ${{ needs.parakeet_qualification.outputs.source_sha }}
          ADMITTED_SOURCE_SHA: ${{ needs.backend_source.outputs.source_sha }}
          QUALIFICATION_EVIDENCE: ${{ steps.parakeet-qualification-evidence.outputs.path }}
        run: |
          set -euo pipefail
          [[ "$QUALIFIED_SOURCE_SHA" == "$ADMITTED_SOURCE_SHA" ]] || {
            echo "ERROR: Parakeet qualification source $QUALIFIED_SOURCE_SHA differs from admitted backend source $ADMITTED_SOURCE_SHA." >&2
            exit 1
          }
          [[ "$QUALIFIED_IMAGE_REF" =~ ^([^@[:space:]]+)@(sha256:[0-9a-f]{64})$ ]] || {
            echo "ERROR: Parakeet qualification did not return an immutable image reference." >&2
            exit 1
          }
          IMAGE_REPOSITORY="${BASH_REMATCH[1]}"
          IMAGE_DIGEST="${BASH_REMATCH[2]}"
          test -s "$QUALIFICATION_EVIDENCE"
          python3 -m pip install -q pyyaml
          python3 backend/scripts/deploy_parakeet_stream.py \
            --environment "${{ vars.ENV }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --cluster "${{ vars.GKE_CLUSTER }}" \
            --region "${REGION}" \
            --image-repository "$IMAGE_REPOSITORY" \
            --image-digest "$IMAGE_DIGEST" \
            --adapter-values-file "backend/charts/monitoring/prometheus-adapter/${{ vars.ENV }}_omi_prometheus_adapter.yaml" \
            --adapter-release "${{ vars.ENV }}-omi-prometheus-adapter" \
            --qualification-evidence "$QUALIFICATION_EVIDENCE" \
            --source-sha "$ADMITTED_SOURCE_SHA" \
            --allow-node-pool-provision \
            --apply

      - name: Use admitted backend image tag
        if: ${{ (github.event.inputs.mode || 'deploy') == 'deploy' }}
        run: |
          set -euo pipefail
          ADMITTED_TAG="${{ needs.backend_source.outputs.image_tag }}"
          [[ "$ADMITTED_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || {
            echo "ERROR: source admission did not return a valid backend image tag." >&2
            exit 1
          }
          # The source job resolved or built this exact source-derived tag. Do
          # not retain a stale listener image when chart changes make Parakeet
          # primary.
          echo "Deploying admitted backend-listen image tag: $ADMITTED_TAG"
          echo "BACKEND_LISTEN_IMAGE_TAG=$ADMITTED_TAG" >> "$GITHUB_ENV"

      - name: Carry forward config this workflow does not own
        if: ${{ (github.event.inputs.mode || 'deploy') == 'deploy' }}
        run: |
          set -euo pipefail
          # deploy-backend-config.sh requires these in prod, but only the full backend
          # deploy derives them (from live Cloud Run state). This workflow refreshes the
          # same shared ConfigMap, so read the current values back rather than dropping
          # them or duplicating that derivation.
          CM=${{ vars.ENV }}-omi-backend-config
          NS=${{ vars.ENV }}-omi-backend
          for key in ACCOUNT_DELETION_HANDLER_URL SYNC_TASKS_HANDLER_URL SYNC_TASKS_INVOKER_SA; do
            value="$(kubectl -n "$NS" get configmap "$CM" -o jsonpath="{.data.$key}" 2>/dev/null || true)"
            if [[ -z "$value" ]]; then
              echo "ERROR: $key is absent from configmap $CM; run the full backend deploy first." >&2
              exit 1
            fi
            echo "$key=$value" >> "$GITHUB_ENV"
            echo "Carried $key"
          done

      - name: Apply non-secret backend runtime config
        if: ${{ (github.event.inputs.mode || 'deploy') == 'deploy' }}
        env:
          ENVIRONMENT: ${{ vars.ENV }}
          CONVERSATION_SUMMARIZED_APP_IDS: ${{ vars.CONVERSATION_SUMMARIZED_APP_IDS }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          MCP_AUTHORIZATION_SERVER_URL: ${{ vars.MCP_AUTHORIZATION_SERVER_URL }}
          MCP_OAUTH_CHATGPT_CLIENT_ID: ${{ vars.MCP_OAUTH_CHATGPT_CLIENT_ID }}
          MCP_OAUTH_CHATGPT_REDIRECT_URIS: ${{ vars.MCP_OAUTH_CHATGPT_REDIRECT_URIS }}
          MCP_OAUTH_CLAUDE_CLIENT_ID: ${{ vars.MCP_OAUTH_CLAUDE_CLIENT_ID }}
          MCP_OAUTH_CLAUDE_CLIENT_NAME: ${{ vars.MCP_OAUTH_CLAUDE_CLIENT_NAME }}
          MCP_OAUTH_CLAUDE_REDIRECT_URIS: ${{ vars.MCP_OAUTH_CLAUDE_REDIRECT_URIS }}
          MCP_OAUTH_PUBLIC_CLIENT_ID: ${{ vars.MCP_OAUTH_PUBLIC_CLIENT_ID }}
          MCP_OAUTH_PUBLIC_REDIRECT_URIS: ${{ vars.MCP_OAUTH_PUBLIC_REDIRECT_URIS }}
          MCP_RESOURCE_URL: ${{ vars.MCP_RESOURCE_URL }}
          RAPID_API_HOST: ${{ vars.RAPID_API_HOST }}
          REDIS_DB_HOST: ${{ vars.REDIS_DB_HOST }}
          ACCOUNT_DELETION_HANDLER_URL: ${{ env.ACCOUNT_DELETION_HANDLER_URL }}
          SYNC_TASKS_HANDLER_URL: ${{ env.SYNC_TASKS_HANDLER_URL }}
          SYNC_TASKS_INVOKER_SA: ${{ env.SYNC_TASKS_INVOKER_SA }}
          TYPESENSE_HOST: ${{ vars.TYPESENSE_HOST }}
          TWILIO_ACCOUNT_SID: ${{ vars.TWILIO_ACCOUNT_SID }}
          TWILIO_API_KEY_SID: ${{ vars.TWILIO_API_KEY_SID }}
          TWILIO_TWIML_APP_SID: ${{ vars.TWILIO_TWIML_APP_SID }}
          X_OAUTH_CLIENT_ID: ${{ vars.X_OAUTH_CLIENT_ID }}
          X_OAUTH_REDIRECT_URI: ${{ vars.X_OAUTH_REDIRECT_URI }}
        run: |
          python3 -m pip install -q pyyaml
          backend/scripts/deploy-backend-config.sh

      - name: Ensure dev parity-pack bucket (development only)
        if: ${{ (github.event.inputs.mode || 'deploy') == 'deploy' && (github.event.inputs.environment || 'development') == 'development' }}
        run: |
          set -euo pipefail
          python3 backend/scripts/ensure_dev_parity_pack_bucket.py

      - name: Resolve optional listen env overrides
        if: ${{ (github.event.inputs.mode || 'deploy') == 'deploy' }}
        env:
          VALUES_FILE: ./backend/charts/backend-listen/${{ vars.ENV }}_omi_backend_listen_values.yaml
          GATEWAY_FEATURE_MODE: ${{ github.event.inputs.gateway_feature_mode }}
          CHAT_AGENT_ROUTE: ${{ github.event.inputs.chat_agent_route }}
          ALLOW_DIRECT_MODEL_EXCEPTION: ${{ github.event.inputs.allow_direct_model_exception }}
          STT_SERVICE_MODELS: ${{ github.event.inputs.stt_service_models }}
          TRANSLATION_SERVICE_MODELS: ${{ github.event.inputs.translation_service_models }}
        run: |
          set -euo pipefail
          python3 -m pip install -q pyyaml
          ARGV_FILE="${RUNNER_TEMP}/listen-helm-env-overrides.argv"
          # workflow_dispatch choice cannot use literal "off" (GitHub 422); map UI token.
          FEATURE_MODE_VALUE="${GATEWAY_FEATURE_MODE:-}"
          if [[ "${FEATURE_MODE_VALUE}" == "disabled" ]]; then
            FEATURE_MODE_VALUE="off"
          fi
          CHAT_ROUTE_VALUE="${CHAT_AGENT_ROUTE:-}"
          if [[ "${CHAT_ROUTE_VALUE}" == "chart-default" ]]; then
            CHAT_ROUTE_VALUE=""
          fi
          python3 .github/scripts/listen_helm_env_overrides.py \
            --values-file "$VALUES_FILE" \
            --output-argv-file "$ARGV_FILE" \
            --set "OMI_LLM_GATEWAY_FEATURE_MODE=${FEATURE_MODE_VALUE}" \
            --set "OMI_LLM_CHAT_AGENT_ROUTE=${CHAT_ROUTE_VALUE}" \
            --set "OMI_LLM_GATEWAY_ALLOW_DIRECT_MODEL_EXCEPTION=${ALLOW_DIRECT_MODEL_EXCEPTION:-}" \
            --set "STT_SERVICE_MODELS=${STT_SERVICE_MODELS:-}" \
            --set "TRANSLATION_SERVICE_MODELS=${TRANSLATION_SERVICE_MODELS:-}"
          echo "LISTEN_HELM_ENV_OVERRIDES_ARGV=$ARGV_FILE" >> "$GITHUB_ENV"

      - name: Helm diff (dry run)
        if: ${{ (github.event.inputs.mode || 'deploy') == 'deploy' }}
        run: |
          set -euo pipefail
          LISTEN_ENV_OVERRIDES=()
          while IFS= read -r _tok || [[ -n "${_tok:-}" ]]; do
            [[ -z "${_tok}" ]] && continue
            LISTEN_ENV_OVERRIDES+=("$_tok")
          done < "${LISTEN_HELM_ENV_OVERRIDES_ARGV}"
          echo "=== Current release values ==="
          helm -n ${{ vars.ENV }}-omi-backend get values ${{ vars.ENV }}-omi-backend-listen || echo "No existing release found"
          echo ""
          echo "=== Dry run upgrade ==="
          helm -n ${{ vars.ENV }}-omi-backend upgrade --install ${{ vars.ENV }}-omi-backend-listen \
            ./backend/charts/backend-listen \
            -f ./backend/charts/backend-listen/${{ vars.ENV }}_omi_backend_listen_values.yaml \
            --set image.repository=gcr.io/${{ vars.GCP_PROJECT_ID }}/backend \
            --set gcpProjectId=${{ vars.GCP_PROJECT_ID }} \
            --set runtimeGcpProjectId=${{ vars.RUNTIME_GCP_PROJECT_ID }} \
            --set-string "image.tag=${BACKEND_LISTEN_IMAGE_TAG}" \
            ${LISTEN_ENV_OVERRIDES[@]+"${LISTEN_ENV_OVERRIDES[@]}"} \
            --dry-run

      # The ExternalSecret resource (which tells external-secrets which GCP
      # Secret Manager keys to sync into the K8s `*-omi-backend-secrets`
      # secret) lives in this chart. Without re-applying it, a new chart key
      # never reaches K8s, and the deployment's secretKeyRef resolves to an
      # empty value — code reads os.getenv(...) as None.
      - name: Upgrade backend-secrets Helm chart
        if: ${{ (github.event.inputs.mode || 'deploy') == 'deploy' }}
        env:
          ENVIRONMENT: ${{ vars.ENV }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
          REGION: ${{ env.REGION }}
        run: |
          python3 -m pip install -q pyyaml
          backend/scripts/deploy-backend-secrets.sh

      - name: Upgrade backend-listen Helm chart
        if: ${{ (github.event.inputs.mode || 'deploy') == 'deploy' }}
        run: |
          set -euo pipefail
          LISTEN_ENV_OVERRIDES=()
          while IFS= read -r _tok || [[ -n "${_tok:-}" ]]; do
            [[ -z "${_tok}" ]] && continue
            LISTEN_ENV_OVERRIDES+=("$_tok")
          done < "${LISTEN_HELM_ENV_OVERRIDES_ARGV}"
          helm -n ${{ vars.ENV }}-omi-backend upgrade --install ${{ vars.ENV }}-omi-backend-listen \
            ./backend/charts/backend-listen \
            -f ./backend/charts/backend-listen/${{ vars.ENV }}_omi_backend_listen_values.yaml \
            --set image.repository=gcr.io/${{ vars.GCP_PROJECT_ID }}/backend \
            --set gcpProjectId=${{ vars.GCP_PROJECT_ID }} \
            --set runtimeGcpProjectId=${{ vars.RUNTIME_GCP_PROJECT_ID }} \
            --set-string "image.tag=${BACKEND_LISTEN_IMAGE_TAG}" \
            ${LISTEN_ENV_OVERRIDES[@]+"${LISTEN_ENV_OVERRIDES[@]}"}

      - name: Roll back backend-listen Helm release
        if: ${{ github.event.inputs.mode == 'rollback' }}
        env:
          TARGET_REVISION: ${{ github.event.inputs.helm_revision }}
        run: |
          set -euo pipefail
          RELEASE=${{ vars.ENV }}-omi-backend-listen
          NS=${{ vars.ENV }}-omi-backend
          BEFORE="$(kubectl -n "$NS" get deploy/"$RELEASE" -o jsonpath='{.spec.template.spec.containers[0].image}')"
          echo "Image before rollback: $BEFORE"
          # Helm rollback, not kubectl rollout undo: undo reverts the pod template while
          # leaving Helm's stored release ahead of the cluster, so the next chart upgrade
          # would silently reapply the bad revision.
          if [[ -n "$TARGET_REVISION" ]]; then
            helm -n "$NS" rollback "$RELEASE" "$TARGET_REVISION" --wait --timeout 30m
          else
            helm -n "$NS" rollback "$RELEASE" --wait --timeout 30m
          fi
          AFTER="$(kubectl -n "$NS" get deploy/"$RELEASE" -o jsonpath='{.spec.template.spec.containers[0].image}')"
          echo "Image after rollback: $AFTER"
          helm -n "$NS" history "$RELEASE" --max 10

      - name: Verify rollout
        run: |
          # See gcp_backend.yml: 300s cannot cover a full backend-listen roll; a
          # stalled rollout still fails on progressDeadlineSeconds.
          if ! kubectl -n ${{ vars.ENV }}-omi-backend rollout status deploy/${{ vars.ENV }}-omi-backend-listen --timeout=1800s; then
            python3 backend/scripts/deploy_status_report.py --env ${{ vars.ENV }} --include-gke --gke-service backend-listen || true
            exit 1
          fi
          python3 backend/scripts/deploy_status_report.py --env ${{ vars.ENV }} --include-gke --gke-service backend-listen

      - name: Show pod status
        if: always()
        run: |
          kubectl -n ${{ vars.ENV }}-omi-backend get pods -l app.kubernetes.io/instance=${{ vars.ENV }}-omi-backend-listen --no-headers

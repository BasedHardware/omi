name: Deploy Frame Request Retention Job to Cloud Run

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        default: development
        type: choice
        options: [development, prod]
      release_sha:
        description: Exact current main SHA with a successful first-attempt Release Eligibility proof
        required: true
        default: ''
        type: string

env:
  SERVICE: frame-request-retention-job
  SCHEDULER_JOB: frame-request-retention-hourly
  REGION: us-central1

concurrency:
  group: deploy-frame-request-retention-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    environment: ${{ github.event.inputs.environment == 'prod' && 'prod' || 'development' }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Admit exact proven main source
        env:
          DEPLOY_SHA: ${{ github.event.inputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$DEPLOY_SHA" = "$(git rev-parse 'origin/main^{commit}')"
          proof_path="${RUNNER_TEMP}/release-eligibility-${DEPLOY_SHA}.json"
          gh api -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-eligibility.yml/runs?event=push&branch=main&status=completed&head_sha=${DEPLOY_SHA}&per_page=100" \
            > "$proof_path"
          python3 .github/scripts/verify_backend_release_admission.py \
            --sha "$DEPLOY_SHA" --repository "$GITHUB_REPOSITORY" \
            --workflow-runs "$proof_path" --require-first-attempt
          git checkout --detach "$DEPLOY_SHA"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      - run: gcloud auth configure-docker
      - uses: docker/setup-buildx-action@v4
      - name: Compute image tag
        id: image-tag
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install deploy dependencies
        run: python3 -m pip install -q pyyaml
      - name: Build retention image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/modal/Dockerfile.frame_request_retention_job
          push: false
          load: true
          tags: gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${{ steps.image-tag.outputs.short_sha }}
      - name: Verify retention image
        run: |
          image=gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${{ steps.image-tag.outputs.short_sha }}
          python3 backend/scripts/runtime_image_contracts.py smoke \
            --dockerfile backend/modal/Dockerfile.frame_request_retention_job --image "$image"
      - name: Require dedicated permanent and temporary bucket contracts from live GCP
        run: |
          permanent_bucket="${{ vars.ENV }}-omi-frame-requests"
          temporary_bucket="${{ vars.ENV }}-omi-frame-requests-temporary"
          permanent_state=$(mktemp)
          temporary_state=$(mktemp)
          trap 'rm -f "$permanent_state" "$temporary_state"' EXIT
          gcloud storage buckets describe "gs://$permanent_bucket" \
            --project="${{ vars.GCP_PROJECT_ID }}" --format=json > "$permanent_state"
          gcloud storage buckets describe "gs://$temporary_bucket" \
            --project="${{ vars.GCP_PROJECT_ID }}" --format=json > "$temporary_state"
          python3 backend/scripts/validate_frame_request_bucket_contract.py \
            --runtime-env backend/deploy/runtime_env.yaml \
            --contract backend/deploy/frame-request-bucket-contract.json \
            --bucket "$permanent_bucket" --lifecycle-json "$permanent_state" \
            --temporary-bucket "$temporary_bucket" --temporary-lifecycle-json "$temporary_state"
      - name: Recheck main immediately before publication
        env:
          DEPLOY_SHA: ${{ github.event.inputs.release_sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$DEPLOY_SHA" = "$(git rev-parse 'origin/main^{commit}')"
          test "$DEPLOY_SHA" = "$(git rev-parse HEAD)"
      - name: Publish retention image after live storage admission
        run: |
          image=gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${{ steps.image-tag.outputs.short_sha }}
          docker push "$image"
      - name: Render retention runtime env
        id: runtime-env
        run: python3 backend/scripts/render_backend_runtime_env.py --env ${{ vars.ENV }} --job frame-request-retention-job >> "$GITHUB_OUTPUT"
      - name: Validate runtime contracts
        run: python3 backend/scripts/validate-backend-runtime-env.py --env "${{ vars.ENV }}" --check-workflows
      - name: Recheck main immediately before Cloud Run deployment
        env:
          DEPLOY_SHA: ${{ github.event.inputs.release_sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$DEPLOY_SHA" = "$(git rev-parse 'origin/main^{commit}')"
          test "$DEPLOY_SHA" = "$(git rev-parse HEAD)"
      - name: Deploy retention job
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          job: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          image: gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${{ steps.image-tag.outputs.short_sha }}
          flags: ${{ steps.runtime-env.outputs.cloud_run_flags }} ${{ steps.runtime-env.outputs.frame_request_retention_job_flags }}
          env_vars: ${{ steps.runtime-env.outputs.frame_request_retention_job_env_vars }}
          secrets: ${{ steps.runtime-env.outputs.frame_request_retention_job_secrets }}
      - name: Verify exact admitted job image and recheck main
        env:
          DEPLOY_SHA: ${{ github.event.inputs.release_sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$DEPLOY_SHA" = "$(git rev-parse 'origin/main^{commit}')"
          expected="gcr.io/${{ vars.GCP_PROJECT_ID }}/${SERVICE}:${{ steps.image-tag.outputs.short_sha }}"
          actual=$(gcloud run jobs describe "$SERVICE" --region="$REGION" \
            --project="${{ vars.GCP_PROJECT_ID }}" --format='value(template.template.containers[0].image)')
          test "$actual" = "$expected"
      - name: Provision or update dedicated hourly Scheduler and validate
        env:
          SCHEDULER_SERVICE_ACCOUNT: ${{ vars.FRAME_REQUEST_RETENTION_SCHEDULER_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$SCHEDULER_SERVICE_ACCOUNT"
          target="https://run.googleapis.com/v2/projects/${{ vars.GCP_PROJECT_ID }}/locations/${REGION}/jobs/${SERVICE}:run"
          common=(--location="$REGION" --project="${{ vars.GCP_PROJECT_ID }}" --schedule='0 * * * *' \
            --time-zone='Etc/UTC' --uri="$target" --http-method=POST \
            --oauth-service-account-email="$SCHEDULER_SERVICE_ACCOUNT")
          if gcloud scheduler jobs describe "$SCHEDULER_JOB" --location="$REGION" \
            --project="${{ vars.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "$SCHEDULER_JOB" "${common[@]}"
          else
            gcloud scheduler jobs create http "$SCHEDULER_JOB" "${common[@]}"
          fi
          scheduler_state=$(gcloud scheduler jobs describe "$SCHEDULER_JOB" --location="$REGION" \
            --project="${{ vars.GCP_PROJECT_ID }}" --format='value(state)')
          if [[ "$scheduler_state" == "PAUSED" ]]; then
            gcloud scheduler jobs resume "$SCHEDULER_JOB" --location="$REGION" \
              --project="${{ vars.GCP_PROJECT_ID }}"
          elif [[ "$scheduler_state" != "ENABLED" ]]; then
            echo "ERROR: unexpected Scheduler state before validation: $scheduler_state" >&2
            exit 1
          fi
          state_file=$(mktemp)
          trap 'rm -f "$state_file"' EXIT
          gcloud scheduler jobs describe "$SCHEDULER_JOB" --location="$REGION" \
            --project="${{ vars.GCP_PROJECT_ID }}" --format=json > "$state_file"
          python3 backend/scripts/validate_memory_maintenance_scheduler.py \
            --state-file "$state_file" --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "$REGION" --scheduler-job "$SCHEDULER_JOB" --cloud-run-job "$SERVICE"

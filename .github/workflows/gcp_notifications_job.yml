name: Deploy Notifications Job to Cloud RUN

on:
  # push:
  #   branches: [ "main", "development" ]
  #   paths:
  #     - 'backend/modal/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - prod
      branch:
        description: 'Branch to deploy from'
        required: true
        default: 'main'
        type: string
      release_version:
        description: 'Release version (optional)'
        required: false
        default: ''

env:
  SERVICE: notifications-job
  REGION: us-central1

# Serialize writes to the selected Cloud Run job environment.
concurrency:
  group: deploy-cloud-run-notifications-job-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    environment: ${{ github.event.inputs.environment == 'prod' && 'prod' || 'development' }}
    permissions:
      contents: 'read'
      # Development WIF auth mints an OIDC token, which GitHub only grants with
      # id-token: write. It is needed here independently of the X Flex probe
      # that moved to gcp_x_connector_sync_job.yml, so it stays on this workflow.
      id-token: 'write'

    runs-on: ubuntu-latest
    steps:
      - name: Validate Environment Input
        env:
          INPUT_ENV: ${{ github.event.inputs.environment }}
        run: |
          if [[ "$INPUT_ENV" != "development" && "$INPUT_ENV" != "prod" ]]; then
            echo "Invalid environment: $INPUT_ENV. Must be 'development' or 'prod'."
            exit 1
          fi

      # To workaround "no space left on device" issue of GitHub-hosted runner
      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Resolve checked-out source identity
        run: |
          set -euo pipefail
          echo "CHECKED_OUT_SHA=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_ENV"

      - name: Checkout immutable Firestore gate controls
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .github/firestore-workflow
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            .github/actions/firestore-readiness
            backend/scripts
            backend/database

      - name: Verify serving Firestore indexes
        uses: ./.github/firestore-workflow/.github/actions/firestore-readiness
        with:
          source_sha: ${{ env.CHECKED_OUT_SHA }}
          project_id: ${{ vars.RUNTIME_GCP_PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_FIRESTORE_READONLY_CREDENTIALS }}

      - name: Google Auth (development WIF)
        id: auth-wif
        if: github.event.inputs.environment == 'development'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1031333818730/locations/global/workloadIdentityPools/omi-gha-notif-dev/providers/github
          service_account: omi-gha-notif-job-dev@based-hardware-dev.iam.gserviceaccount.com

      # Prod WIF (credential-hygiene WS-C, plan v2 Phase E). The pool's provider
      # pins this file on main + the prod environment + Omi's numeric repo/owner
      # ids; the deployer holds no Owner and no JSON key. Rollback: restore the
      # credentials_json step (secrets.GCP_CREDENTIALS stays until every prod
      # workflow is on WIF).
      - name: Google Auth (prod WIF)
        id: auth
        if: github.event.inputs.environment == 'prod'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/208440318997/locations/global/workloadIdentityPools/omi-gha-notif-prod/providers/github
          service_account: omi-gha-notif-job-prod@based-hardware.iam.gserviceaccount.com

      - name: Login to GCR
        run: gcloud auth configure-docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute short SHA
        id: image-tag
        run: |
          # Use checked-out HEAD so the image tag matches the branch input, not
          # the workflow-file ref (GITHUB_SHA), when they diverge.
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Python deps for deploy scripts
        run: python3 -m pip install -q pyyaml

      - name: Render backend runtime env
        id: runtime-env
        env:
          # Prod network flags are env_var-backed; without these the renderer
          # exits before notifications_job_* outputs are emitted (same as gcp_backend.yml).
          CLOUD_RUN_VPC_NETWORK: ${{ vars.CLOUD_RUN_VPC_NETWORK }}
          CLOUD_RUN_VPC_SUBNET: ${{ vars.CLOUD_RUN_VPC_SUBNET }}
        run: |
          python3 backend/scripts/render_backend_runtime_env.py --env ${{ vars.ENV }} --job notifications-job >> "$GITHUB_OUTPUT"

      - name: Validate backend runtime env before deploy
        run: |
          python3 backend/scripts/validate-backend-runtime-env.py --env ${{ vars.ENV }} --check-workflows

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/modal/Dockerfile.notifications_job
          push: false
          load: true
          tags: |
            gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:latest
            gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${{ steps.image-tag.outputs.short_sha }}
          cache-from: type=registry,ref=gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:buildcache
          cache-to: type=registry,ref=gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:buildcache,mode=max

      - name: Verify built runtime image before publish
        run: |
          image=gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${{ steps.image-tag.outputs.short_sha }}
          python3 backend/scripts/runtime_image_contracts.py smoke \
            --dockerfile backend/modal/Dockerfile.notifications_job \
            --image "$image"

      - name: Push verified runtime image
        run: |
          docker push gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:latest
          docker push gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${{ steps.image-tag.outputs.short_sha }}

      # The action appends custom flags after image/env/secrets. A --container
      # flag there violates gcloud ordering; without it gcloud needs a singleton.
      # Restore that shape before every deploy, then reattach the collector.
      - name: Detach Managed Prometheus sidecar before job deploy
        run: |
          python3 backend/scripts/attach_cloud_run_gmp_sidecar.py \
            --job --detach --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="$REGION" --service="$SERVICE"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          job: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          image: gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${{ steps.image-tag.outputs.short_sha }}
          env_vars: ${{ steps.runtime-env.outputs.notifications_job_env_vars }}
          secrets: ${{ steps.runtime-env.outputs.notifications_job_secrets }}
          # Strip retired maintenance/Pusher keys, the legacy key-path literal
          # GOOGLE_APPLICATION_CREDENTIALS (it makes a keyless process look for a
          # key file), plus any literal shadowing a Secret Manager binding (no-op
          # on a clean target).
          flags: >-
            ${{ steps.runtime-env.outputs.cloud_run_flags }}
            ${{ steps.runtime-env.outputs.notifications_job_flags }}
            --remove-env-vars=MEMORY_MODE,MEMORY_ENABLED_USERS,MEMORY_V3_GET_ENABLED,MEMORY_CANONICAL_MAINTENANCE_ENABLED,MEMORY_CANONICAL_CONSOLIDATION_ENABLED,MEMORY_CANONICAL_PROMOTION_CRON_ENABLED,MEMORY_CANONICAL_PROMOTION_CRON_INTERVAL_HOURS,MEMORY_CANONICAL_PROMOTION_FAST_TRACK_ENABLED,MEMORY_TYPESENSE_COLLECTION,TYPESENSE_HOST,TYPESENSE_HOST_PORT,TYPESENSE_API_KEY,HOSTED_PUSHER_API_URL,DAILY_SUMMARY_SELECTION_MODE,GOOGLE_APPLICATION_CREDENTIALS,${{ steps.runtime-env.outputs.notifications_job_secret_names }}

      - name: Attach Managed Prometheus sidecar to notifications job
        run: |
          python3 backend/scripts/attach_cloud_run_gmp_sidecar.py \
            --job --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="$REGION" --service="$SERVICE" \
            --config=backend/deploy/cloud_run_gmp_sidecar.yaml

      # If required, use the Cloud Run url output in later steps
      - name: Show Output
        run: echo ${{ steps.deploy.outputs.url }}

      - name: Provision chat-first materialization decision review
        if: github.event.inputs.environment == 'prod'
        env:
          ALERT_CHANNELS: ${{ vars.SYNC_BACKFILL_ALERT_NOTIFICATION_CHANNELS }}
        run: |
          set -euo pipefail
          test -n "$ALERT_CHANNELS"
          metric='chat_first_materialization_review_due'
          display_name='Chat-first materialization decision review due'
          documentation='The weekly read-only materialization verdict is ready. Inspect the notifications-job chat_first_materialization_health log entry for the delivered, dropped, in-flight, undated, and drop-rate aggregates, then run backend/scripts/chat_first_materialization_drop_rate.py --json for the source and block-type breakdown. This signal intentionally routes zero-drop verdicts too so the canonical server-materialization decision cannot disappear into silence.'
          log_filter='resource.type="cloud_run_job" resource.labels.job_name="notifications-job" "chat_first_materialization_health review=true"'

          if gcloud logging metrics describe "$metric" --project="${{ vars.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            gcloud logging metrics update "$metric" \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --description="$display_name" \
              --log-filter="$log_filter"
          else
            gcloud logging metrics create "$metric" \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --description="$display_name" \
              --log-filter="$log_filter"
          fi

          policy="$(
            gcloud monitoring policies list \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --filter="displayName=\"${display_name}\"" \
              --format='value(name)' \
              --limit=1
          )"
          if [[ -z "$policy" ]]; then
            policy="$(
              gcloud monitoring policies create \
                --project="${{ vars.GCP_PROJECT_ID }}" \
                --display-name="$display_name" \
                --condition-display-name="$display_name" \
                --condition-filter="metric.type=\"logging.googleapis.com/user/${metric}\" AND resource.type=\"cloud_run_job\"" \
                --duration=0s \
                --if='> 0' \
                --trigger-count=1 \
                --combiner=OR \
                --notification-channels="$ALERT_CHANNELS" \
                --documentation="$documentation" \
                --format='value(name)'
            )"
          else
            gcloud monitoring policies update "$policy" \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --enabled \
              --set-notification-channels="$ALERT_CHANNELS" \
              --documentation="$documentation"
          fi
          test -n "$policy"
          gcloud monitoring policies describe "$policy" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --format='value(notificationChannels)' | grep -q .

      - name: Provision prod Redis used_memory 90% alarm
        if: github.event.inputs.environment == 'prod'
        env:
          ALERT_CHANNELS: ${{ vars.SYNC_BACKFILL_ALERT_NOTIFICATION_CHANNELS }}
        run: |
          set -euo pipefail
          test -n "$ALERT_CHANNELS"
          metric='redis_memory_90'
          display_name='Prod Redis used_memory ≥ 90%'
          documentation='Prod Redis Cloud used_memory crossed 90% of the 12 GiB Essentials cap (INFO omits maxmemory). Writes fail closed under noeviction. Inspect notifications-job redis_memory_threshold logs. Same class as the unbounded users:{uid}:filters:* fill.'
          log_filter='resource.type="cloud_run_job" resource.labels.job_name="notifications-job" "redis_memory_threshold threshold=90"'

          if gcloud logging metrics describe "$metric" --project="${{ vars.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            gcloud logging metrics update "$metric" \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --description="$display_name" \
              --log-filter="$log_filter"
          else
            gcloud logging metrics create "$metric" \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --description="$display_name" \
              --log-filter="$log_filter"
          fi

          policy="$(
            gcloud monitoring policies list \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --filter="displayName=\"${display_name}\"" \
              --format='value(name)' \
              --limit=1
          )"
          if [[ -z "$policy" ]]; then
            policy="$(
              gcloud monitoring policies create \
                --project="${{ vars.GCP_PROJECT_ID }}" \
                --display-name="$display_name" \
                --condition-display-name="$display_name" \
                --condition-filter="metric.type=\"logging.googleapis.com/user/${metric}\" AND resource.type=\"cloud_run_job\"" \
                --duration=0s \
                --if='> 0' \
                --trigger-count=1 \
                --combiner=OR \
                --notification-channels="$ALERT_CHANNELS" \
                --documentation="$documentation" \
                --format='value(name)'
            )"
          else
            gcloud monitoring policies update "$policy" \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --enabled \
              --set-notification-channels="$ALERT_CHANNELS" \
              --documentation="$documentation"
          fi
          test -n "$policy"
          gcloud monitoring policies describe "$policy" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --format='value(notificationChannels)' | grep -q .

      - name: Provision daily_summary_cohort_incomplete
        if: github.event.inputs.environment == 'prod'
        env:
          ALERT_CHANNELS: ${{ vars.SYNC_BACKFILL_ALERT_NOTIFICATION_CHANNELS }}
        run: |
          set -euo pipefail
          test -n "$ALERT_CHANNELS"
          metric='daily_summary_cohort_incomplete'
          display_name='Daily recap cohort incomplete for 3 hours'
          documentation='Daily recaps may be stalled. See backend/docs/runbooks/daily-summary-cutover.md. Oct 3 cohort stayed pinned for six days by a persistently failing recipient; fix 071ff86cdc abandons any cohort older than 7200 seconds. Inspect incomplete summaries and cursor_age_seconds; require three hours of sustained incomplete ticks.'
          log_filter='resource.type="cloud_run_job" resource.labels.job_name="notifications-job" "daily_summary_job_summary" "complete=False"'
          if gcloud logging metrics describe "$metric" --project="${{ vars.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            gcloud logging metrics update "$metric" --project="${{ vars.GCP_PROJECT_ID }}" \
              --description="$display_name" --log-filter="$log_filter"
          else
            gcloud logging metrics create "$metric" --project="${{ vars.GCP_PROJECT_ID }}" \
              --description="$display_name" --log-filter="$log_filter"
          fi
          policy="$(gcloud monitoring policies list --project="${{ vars.GCP_PROJECT_ID }}" \
            --filter="displayName=\"${display_name}\"" --format='value(name)' --limit=1)"
          export RECAP_METRIC="$metric" RECAP_DISPLAY_NAME="$display_name" RECAP_DOCUMENTATION="$documentation" RECAP_POLICY="$policy"
          policy_file="$RUNNER_TEMP/daily_summary_cohort_incomplete.json"
          python3 - "$policy_file" <<'PY_POLICY'
          import json, os, sys
          metric_filter = 'metric.type="logging.googleapis.com/user/' + os.environ['RECAP_METRIC'] + '" AND resource.type="cloud_run_job"'
          condition = {'conditionThreshold': {
              'filter': metric_filter, 'comparison': 'COMPARISON_GT', 'thresholdValue': 0,
              'duration': '10800s', 'evaluationMissingData': 'EVALUATION_MISSING_DATA_INACTIVE',
              'aggregations': [{'alignmentPeriod': '900s', 'perSeriesAligner': 'ALIGN_RATE',
                                'crossSeriesReducer': 'REDUCE_SUM'}], 'trigger': {'count': 1}}}
          condition['displayName'] = os.environ['RECAP_DISPLAY_NAME']
          body = {'displayName': os.environ['RECAP_DISPLAY_NAME'], 'enabled': True, 'combiner': 'OR',
                  'notificationChannels': os.environ['ALERT_CHANNELS'].split(','),
                  'documentation': {'content': os.environ['RECAP_DOCUMENTATION'], 'mimeType': 'text/markdown'},
                  'conditions': [condition]}
          if os.environ['RECAP_POLICY']:
              body['name'] = os.environ['RECAP_POLICY']
          with open(sys.argv[1], 'w') as output:
              json.dump(body, output)
          PY_POLICY
          if [[ -z "$policy" ]]; then
            policy="$(gcloud monitoring policies create --project="${{ vars.GCP_PROJECT_ID }}" \
              --policy-from-file="$policy_file" --format='value(name)')"
          else
            gcloud monitoring policies update "$policy" --project="${{ vars.GCP_PROJECT_ID }}" \
              --policy-from-file="$policy_file"
          fi
          test -n "$policy"
          gcloud monitoring policies describe "$policy" --project="${{ vars.GCP_PROJECT_ID }}" \
            --format='value(notificationChannels)' | grep -q .

      - name: Provision daily_summary_job_heartbeat_missing
        if: github.event.inputs.environment == 'prod'
        env:
          ALERT_CHANNELS: ${{ vars.SYNC_BACKFILL_ALERT_NOTIFICATION_CHANNELS }}
        run: |
          set -euo pipefail
          test -n "$ALERT_CHANNELS"
          metric='daily_summary_job_heartbeat_missing'
          display_name='Daily recap job heartbeat missing for 60 minutes'
          documentation='Daily recaps may be stalled. See backend/docs/runbooks/daily-summary-cutover.md. Oct 3 cohort stayed pinned for six days by a persistently failing recipient; fix 071ff86cdc abandons any cohort older than 7200 seconds. Check notifications-job execution errors and the enabled every-15-minute Scheduler trigger.'
          log_filter='resource.type="cloud_run_job" resource.labels.job_name="notifications-job" "daily_summary_job_summary"'
          if gcloud logging metrics describe "$metric" --project="${{ vars.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            gcloud logging metrics update "$metric" --project="${{ vars.GCP_PROJECT_ID }}" \
              --description="$display_name" --log-filter="$log_filter"
          else
            gcloud logging metrics create "$metric" --project="${{ vars.GCP_PROJECT_ID }}" \
              --description="$display_name" --log-filter="$log_filter"
          fi
          policy="$(gcloud monitoring policies list --project="${{ vars.GCP_PROJECT_ID }}" \
            --filter="displayName=\"${display_name}\"" --format='value(name)' --limit=1)"
          export RECAP_METRIC="$metric" RECAP_DISPLAY_NAME="$display_name" RECAP_DOCUMENTATION="$documentation" RECAP_POLICY="$policy"
          policy_file="$RUNNER_TEMP/daily_summary_job_heartbeat_missing.json"
          python3 - "$policy_file" <<'PY_POLICY'
          import json, os, sys
          metric_filter = 'metric.type="logging.googleapis.com/user/' + os.environ['RECAP_METRIC'] + '" AND resource.type="cloud_run_job"'
          condition = {'conditionAbsent': {
              'filter': metric_filter, 'duration': '3600s',
              'aggregations': [{'alignmentPeriod': '900s', 'perSeriesAligner': 'ALIGN_SUM',
                                'crossSeriesReducer': 'REDUCE_SUM'}], 'trigger': {'count': 1}}}
          condition['displayName'] = os.environ['RECAP_DISPLAY_NAME']
          body = {'displayName': os.environ['RECAP_DISPLAY_NAME'], 'enabled': True, 'combiner': 'OR',
                  'notificationChannels': os.environ['ALERT_CHANNELS'].split(','),
                  'documentation': {'content': os.environ['RECAP_DOCUMENTATION'], 'mimeType': 'text/markdown'},
                  'conditions': [condition]}
          if os.environ['RECAP_POLICY']:
              body['name'] = os.environ['RECAP_POLICY']
          with open(sys.argv[1], 'w') as output:
              json.dump(body, output)
          PY_POLICY
          if [[ -z "$policy" ]]; then
            policy="$(gcloud monitoring policies create --project="${{ vars.GCP_PROJECT_ID }}" \
              --policy-from-file="$policy_file" --format='value(name)')"
          else
            gcloud monitoring policies update "$policy" --project="${{ vars.GCP_PROJECT_ID }}" \
              --policy-from-file="$policy_file"
          fi
          test -n "$policy"
          gcloud monitoring policies describe "$policy" --project="${{ vars.GCP_PROJECT_ID }}" \
            --format='value(notificationChannels)' | grep -q .

      - name: Reconcile notifications Scheduler trigger
        env:
          SCHEDULER_ENVIRONMENT: ${{ github.event.inputs.environment == 'prod' && 'prod' || 'dev' }}
        run: |
          python3 -m pip install -q PyYAML==6.0.1 google-auth==2.32.0 requests==2.33.1
          if [[ "$SCHEDULER_ENVIRONMENT" == prod ]]; then
            python3 backend/scripts/scheduler_reconcile.py \
              --environment prod --project "${{ vars.GCP_PROJECT_ID }}" \
              --apply --jobs notifications-job-scheduler-trigger
            python3 backend/scripts/scheduler_reconcile.py \
              --environment prod --project "${{ vars.GCP_PROJECT_ID }}" \
              --check --jobs notifications-job-scheduler-trigger
          fi

      - name: Generate deployment summary
        if: always() && github.event.inputs.environment == 'prod'
        uses: ./.github/actions/deployment-summary
        with:
          environment: ${{ github.event.inputs.environment }}
          release_version: ${{ github.event.inputs.release_version }}
          status: ${{ job.status }}
          service: ${{ env.SERVICE }}

      - name: Notify deployment status on Telegram
        if: always() && github.event.inputs.environment == 'prod'
        uses: ./.github/actions/deployment-notifier
        with:
          environment: ${{ github.event.inputs.environment }}
          release_version: ${{ github.event.inputs.release_version }}
          status: ${{ job.status }}
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

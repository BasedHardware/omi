name: Provision Grafana dashboards

# Custom dashboards under backend/charts/monitoring/dashboards/ are
# exported-from-Grafana JSON kept version-controlled here (repo-first). Until
# now the live boards were updated by manual import, so repo and Grafana
# drifted (omi-core-features sat 2 versions behind for 5 weeks). This
# workflow applies development dashboards on main. Production dashboards and
# alert rules require explicit environment=prod dispatch and Environment approval.

on:
  push:
    branches: [main]
    paths:
      - 'backend/charts/monitoring/dashboards/**'
      - 'backend/charts/monitoring/alerts/**'
      - 'backend/charts/monitoring/alert-rules.json'
      - 'backend/scripts/provision_monitoring_alerts.py'
      - 'backend/scripts/provision_grafana_dashboards.py'
      - '.github/workflows/grafana_dashboard_provisioning.yml'
      - '.github/scripts/provision_grafana_dashboards.py'
      - '.github/scripts/grafana_business.py'
      - 'web/admin/grafana/dashboards/omi-tv-v2.json'
      - 'web/admin/grafana/dashboards/omi-tv-funnel.json'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the Grafana to provision'
        type: choice
        options: [prod, dev]
        default: prod
        required: true

permissions:
  contents: read

concurrency:
  group: grafana-dashboard-provisioning-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  # Abort a git HTTP transfer that stays under 1 KB/s for 60 s, so actions/checkout
  # retries instead of hanging 7-10 min until the TCP reset (#22890).
  GIT_HTTP_LOW_SPEED_LIMIT: "1000"
  GIT_HTTP_LOW_SPEED_TIME: "60"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate dashboard JSON
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if ! python3 -m json.tool "$f" > /dev/null 2>&1; then
              echo "INVALID JSON: $f" >&2
              fail=1
            else
              uid=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('uid',''))" "$f")
              if [ -z "$uid" ]; then
                echo "MISSING UID: $f" >&2
                fail=1
              else
                echo "OK: $f (uid=$uid)"
              fi
            fi
          done < <(find backend/charts/monitoring/dashboards -name '*.json' -print0)
          python3 backend/scripts/provision_monitoring_alerts.py --lint
          exit $fail

  provision:
    if: github.ref == 'refs/heads/main'
    needs: validate
    environment: ${{ matrix.environment == 'prod' && 'prod' || 'development' }}
    concurrency:
      group: grafana-alert-provisioning-${{ matrix.environment }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: ["${{ github.event.inputs.environment || 'dev' }}"]
    steps:
      - uses: actions/checkout@v7
      - name: Provision dashboards
        env:
          # Ops Grafana service-account token (same secret family the pusher
          # auto-deploy uses for alert-route verification). The former TV
          # instance credential is reserved for the separate retirement tool.
          MONITOR_GRAFANA_TOKEN: ${{ secrets.MONITOR_GRAFANA_TOKEN }}
          GRAFANA_URL: ${{ matrix.environment == 'prod' && 'https://monitor.omi.me' || 'https://monitor.omiapi.com' }}
          GIT_SHORT_SHA: ${{ github.sha }}
          # First land provisions only the custom repo-first boards (string
          # uids). Community/helm-managed boards keep their manual flow.
          DASHBOARD_ALLOWLIST: ${{ matrix.environment == 'prod' && 'omi-core-features.json,omi-translation.json,resilience-fallbacks.json,omi-services-overview.json,fleet-telemetry.json' || 'omi-core-features.json,omi-translation.json,resilience-fallbacks.json,fleet-telemetry.json' }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$MONITOR_GRAFANA_TOKEN"
          python3 backend/scripts/provision_grafana_dashboards.py \
            --dashboards-dir backend/charts/monitoring/dashboards \
            --grafana-url "$GRAFANA_URL" \
            --token-env MONITOR_GRAFANA_TOKEN \
            --source-sha "$GIT_SHORT_SHA" \
            --backup-file "$RUNNER_TEMP/grafana-dashboard-backup.json" \
            --allowlist "$DASHBOARD_ALLOWLIST"
      - name: Provision private Business board (prod only)
        if: matrix.environment == 'prod'
        env:
          BUSINESS_GRAFANA_TOKEN: ${{ secrets.BUSINESS_GRAFANA_TOKEN }}
          GRAFANA_URL: ${{ matrix.environment == 'prod' && 'https://monitor.omi.me' || 'https://monitor.omiapi.com' }}
          GIT_SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          python3 .github/scripts/provision_grafana_dashboards.py \
            --dashboards-dir web/admin/grafana/dashboards \
            --grafana-url "$GRAFANA_URL" \
            --token-env BUSINESS_GRAFANA_TOKEN \
            --source-sha "$GIT_SHORT_SHA" \
            --allowlist omi-tv-v2.json,omi-tv-funnel.json \
            --folder-uid business
      - name: Apply production alert definitions and check drift
        # Dispatch-only: a push resolves to the dev environment anyway, so no
        # dashboard-path push can reach this prod step.
        if: github.event_name == 'workflow_dispatch' && matrix.environment == 'prod'
        env:
          MONITOR_GRAFANA_TOKEN: ${{ secrets.MONITOR_GRAFANA_TOKEN }}
        run: |
          set -euo pipefail
          python3 backend/scripts/provision_monitoring_alerts.py \
            --apply --backup-file "$RUNNER_TEMP/grafana-alert-backup.json"
      - name: Preserve pre-apply dashboard definitions for reviewed rollback
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: grafana-dashboard-backup-${{ matrix.environment }}-${{ github.run_id }}
          path: ${{ runner.temp }}/grafana-dashboard-backup.json
          if-no-files-found: ignore
          retention-days: 15
      - name: Preserve pre-apply alert definitions for reviewed rollback
        if: always() && matrix.environment == 'prod'
        uses: actions/upload-artifact@v7
        with:
          name: grafana-alert-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/grafana-alert-backup.json
          if-no-files-found: ignore
          retention-days: 15

  # Auto-apply for prod Ops dashboard JSON (David approved 2026-11-09). Every
  # push to main that matches the trigger paths applies the current Ops
  # dashboards to prod without a dispatch. The apply is idempotent and runs on
  # every surviving push, so a superseded push run cannot skip a dashboard
  # change (review P1). It uses the production Grafana token from the
  # grafana-dashboards-prod environment, which holds only that token and has no
  # required reviewers, so it runs without an approval tap. The repo-level
  # MONITOR_GRAFANA_TOKEN is the dev token and must never reach monitor.omi.me.
  # The Business TV boards (omi-tv-v2, omi-tv-funnel) apply here too once
  # BUSINESS_GRAFANA_TOKEN is added to the grafana-dashboards-prod environment
  # (David, 2026-11-12: dashboard deploys are automatic). Until that secret
  # exists the step warns and skips, and the boards still need the gated prod
  # dispatch: five dispatches between 2026-11-09 and 2026-11-11 expired unapproved
  # and two merged board fixes never reached monitor.omi.me. Alert rules and the
  # admin deploy keep their gates.
  provision-prod-ops-dashboards:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'BasedHardware/omi'
    needs: validate
    runs-on: ubuntu-latest
    environment: grafana-dashboards-prod
    # Same group as a prod dispatch run, so an approval-waiting dispatch and an
    # automatic apply never write the same Ops UIDs at once.
    concurrency:
      group: grafana-dashboard-provisioning-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Provision prod Ops dashboards (dashboard JSON only)
        env:
          MONITOR_GRAFANA_TOKEN: ${{ secrets.MONITOR_GRAFANA_TOKEN }}
          GIT_SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$MONITOR_GRAFANA_TOKEN"
          # A service-account token writes only to its own Grafana organization.
          # From 2026-11-10 to 2026-11-12 this job held a Business-org token as
          # MONITOR_GRAFANA_TOKEN, created stray copies of the Ops boards there and
          # passed its own read-back. Refuse to write unless the token's org matches.
          org_id=$(curl -fsS --max-time 20 -H "Authorization: Bearer $MONITOR_GRAFANA_TOKEN" https://monitor.omi.me/api/org | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          if [ "$org_id" != "1" ]; then
            echo "::error::MONITOR_GRAFANA_TOKEN belongs to Grafana org $org_id, expected 1; nothing was written."
            exit 1
          fi
          python3 backend/scripts/provision_grafana_dashboards.py \
            --dashboards-dir backend/charts/monitoring/dashboards \
            --grafana-url https://monitor.omi.me \
            --token-env MONITOR_GRAFANA_TOKEN \
            --source-sha "$GIT_SHORT_SHA" \
            --backup-file "$RUNNER_TEMP/grafana-dashboard-backup.json" \
            --allowlist 'omi-core-features.json,omi-translation.json,resilience-fallbacks.json,omi-services-overview.json,fleet-telemetry.json'
      - name: Provision prod Business boards (dashboard JSON only)
        env:
          BUSINESS_GRAFANA_TOKEN: ${{ secrets.BUSINESS_GRAFANA_TOKEN }}
          GIT_SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          # No repository- or organization-level BUSINESS_GRAFANA_TOKEN exists
          # (checked 2026-11-12; only the prod and monitoring-prod environments
          # hold one), so an empty value here means this environment has no token.
          # Never add one at repository scope: it would reach this step ungated.
          if [ -z "${BUSINESS_GRAFANA_TOKEN:-}" ]; then
            echo "::warning::BUSINESS_GRAFANA_TOKEN is not set in the grafana-dashboards-prod environment; the Omi TV boards were not applied and still need the gated prod dispatch."
            exit 0
          fi
          # A service-account token writes only to its own Grafana organization.
          # From 2026-11-10 to 2026-11-12 this job held a Business-org token as
          # MONITOR_GRAFANA_TOKEN, created stray copies of the Ops boards there and
          # passed its own read-back. Refuse to write unless the token's org matches.
          org_id=$(curl -fsS --max-time 20 -H "Authorization: Bearer $BUSINESS_GRAFANA_TOKEN" https://monitor.omi.me/api/org | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          if [ "$org_id" != "2" ]; then
            echo "::error::BUSINESS_GRAFANA_TOKEN belongs to Grafana org $org_id, expected 2; nothing was written."
            exit 1
          fi
          python3 .github/scripts/provision_grafana_dashboards.py \
            --dashboards-dir web/admin/grafana/dashboards \
            --grafana-url https://monitor.omi.me \
            --token-env BUSINESS_GRAFANA_TOKEN \
            --source-sha "$GIT_SHORT_SHA" \
            --allowlist omi-tv-v2.json,omi-tv-funnel.json \
            --folder-uid business
      - name: Preserve pre-apply dashboard definitions for reviewed rollback
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: grafana-dashboard-backup-prod-auto-${{ github.run_id }}
          path: ${{ runner.temp }}/grafana-dashboard-backup.json
          if-no-files-found: ignore
          retention-days: 15

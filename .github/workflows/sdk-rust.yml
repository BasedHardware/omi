name: Rust SDK

on:
  # Nightly calls run these same jobs against one immutable main snapshot.
  workflow_call:
    inputs:
      nightly_main_sha:
        description: Main SHA pinned by the unfiltered nightly caller
        type: string
        required: false
        default: ''
  pull_request:
    paths:
      - "sdks/rust/**"
      - ".github/workflows/sdk-rust.yml"
  push:
    branches: [main]
    paths:
      - "sdks/rust/**"
      - ".github/workflows/sdk-rust.yml"

env:
  # Abort a git HTTP transfer that stays under 1 KB/s for 60 s, so actions/checkout
  # retries instead of hanging 7-10 min until the TCP reset (#22890).
  GIT_HTTP_LOW_SPEED_LIMIT: "1000"
  GIT_HTTP_LOW_SPEED_TIME: "60"

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rust/omi-device
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.nightly_main_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/rust/omi-device
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test --locked

name: Promote Desktop Beta to Stable

# Stable is a protected distribution pointer, not a backend deployment. It
# promotes the exact signed artifact already served on beta; the existing
# backend deployment workflows remain independent.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Current beta v*-macos release tag'
        required: true
        type: string
      confirm:
        description: 'Type promote-stable to advance the stable pointer'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: desktop-stable-promotion
  cancel-in-progress: false

env:
  GCS_DESKTOP_UPDATES_BUCKET: ${{ vars.GCS_DESKTOP_UPDATES_BUCKET || 'gs://omi_macos_updates' }}

jobs:
  promote:
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout promotion controls
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Verify live desktop-backend chat compatibility
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 \
            https://desktop-backend-hhibjajaja-uc.a.run.app/health \
            > /tmp/desktop-backend-health.json
          jq -e '
            .status == "healthy"
            and .service == "omi-desktop-backend"
            and .chat_contract_version == "1"
          ' /tmp/desktop-backend-health.json >/dev/null
          if ! curl -fsS --max-time 15 https://api.omi.me/health > /tmp/api-backend-health.json; then
            echo '{}' > /tmp/api-backend-health.json
          fi

      - name: Report backend drift
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python3 .github/scripts/check_desktop_backend_drift.py \
            --desktop-backend-health /tmp/desktop-backend-health.json \
            --api-backend-health /tmp/api-backend-health.json \
            --base origin/main \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Validate stable promotion request
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = promote-stable || { echo 'confirm must be exactly: promote-stable' >&2; exit 1; }
          printf '%s\n' "$RELEASE_TAG" | grep -qE '^v[0-9]+\.[0-9]+(\.[0-9]+)?\+[0-9]+-macos$' || {
            echo "Invalid macOS release tag: $RELEASE_TAG" >&2; exit 1;
          }
          git fetch --force origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-list -n1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)" || {
            echo "Checked-out promotion controls do not match $RELEASE_TAG" >&2; exit 1;
          }

      - name: Generate Omi Bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.OMI_BOT_APP_ID }}
          private-key: ${{ secrets.OMI_BOT_PRIVATE_KEY }}

      - name: Google Auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Fetch exact retained Beta manifest
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          ADMIN_KEY=$(gcloud secrets versions access latest --secret=ADMIN_KEY --project "$PROJECT_ID")
          curl -fsS -H "secret-key: $ADMIN_KEY" "https://api.omi.me/v2/desktop/releases/$RELEASE_TAG" > /tmp/desktop-manifest-response.json
          jq '.manifest' /tmp/desktop-manifest-response.json > /tmp/desktop-release-manifest.json
          python3 - <<'PY'
          import hashlib, json
          response = json.load(open('/tmp/desktop-manifest-response.json'))
          manifest = json.load(open('/tmp/desktop-release-manifest.json'))
          if manifest.get('release_id') != __import__('os').environ['RELEASE_TAG']:
              raise SystemExit('retained manifest does not match requested release')
          actual = hashlib.sha256(json.dumps(manifest, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          if actual != response.get('manifest_sha256'):
              raise SystemExit('retained manifest canonical identity mismatch')
          PY

      - name: Read current pointers and capture workflow-owned CAS inputs
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          ACCESS_TOKEN=$(gcloud auth print-access-token)
          BASE="https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/desktop_update_channels"
          curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" "$BASE/macos-beta" > /tmp/macos-beta-pointer.json
          curl -sS -H "Authorization: Bearer $ACCESS_TOKEN" "$BASE/macos-stable" > /tmp/macos-stable-pointer.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          import os

          def fields(path):
              return json.load(open(path)).get("fields", {})

          def text(values, key):
              return values.get(key, {}).get("stringValue", "")

          beta, stable = fields("/tmp/macos-beta-pointer.json"), fields("/tmp/macos-stable-pointer.json")
          if text(beta, "release_id") != os.environ["RELEASE_TAG"]:
              raise SystemExit("Stable promotion requires the exact current Beta release ID")
          generation = stable.get("generation", {}).get("integerValue", "0")
          if not generation.isdigit():
              raise SystemExit("Stable pointer generation is invalid")
          print(f"EXPECTED_RELEASE_ID={text(stable, 'release_id')}")
          print(f"EXPECTED_GENERATION={generation}")
          PY

      - name: Publish immutable stable repair installer
        env:
          GCS_DESKTOP_UPDATES_BUCKET: ${{ env.GCS_DESKTOP_UPDATES_BUCKET }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python3 .github/scripts/desktop_repair_installer.py --manifest /tmp/desktop-release-manifest.json \
            --bucket "$GCS_DESKTOP_UPDATES_BUCKET" --output-dir /tmp/desktop-stable-repair
          REPAIR_SHA=$(sha256sum /tmp/desktop-stable-repair/repair.json | cut -d' ' -f1)
          target="$GCS_DESKTOP_UPDATES_BUCKET/stable/${RELEASE_TAG}/repair.json"
          if gcloud storage objects describe "$target" --format='value(metadata.sha256)' > /tmp/remote-sha.txt 2>/dev/null; then
            test "$(cat /tmp/remote-sha.txt)" = "$REPAIR_SHA" || { echo "Immutable stable repair metadata differs: $target" >&2; exit 1; }
          else
            gcloud storage cp --if-generation-match=0 --custom-metadata="sha256=$REPAIR_SHA" /tmp/desktop-stable-repair/repair.json "$target"
          fi

      - name: Advance explicit stable pointer
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          ADMIN_KEY=$(gcloud secrets versions access latest --secret=ADMIN_KEY --project "$PROJECT_ID")
          python3 - <<'PY' > /tmp/desktop-stable-pointer.json
          import json, os, re
          from datetime import datetime, timezone

          def sha(health):
              value = health.get("backend_release_sha")
              if isinstance(value, str) and re.fullmatch(r"[0-9a-f]{40}", value):
                  return value
              return None

          def optional_text(health, key):
              value = health.get(key)
              return value if isinstance(value, str) and value else None

          desktop = json.load(open("/tmp/desktop-backend-health.json"))
          try:
              api = json.load(open("/tmp/api-backend-health.json"))
          except OSError:
              api = {}
          payload = {"platform": "macos", "channel": "stable", "release_id": os.environ["RELEASE_TAG"],
                     "expected_generation": int(os.environ["EXPECTED_GENERATION"])}
          if os.environ["EXPECTED_RELEASE_ID"]:
              payload["expected_current_release_id"] = os.environ["EXPECTED_RELEASE_ID"]
          payload["serving_backends"] = {
              "desktop_backend": {
                  "release_sha": sha(desktop),
                  "release_channel": optional_text(desktop, "backend_release_channel"),
                  "chat_contract_version": optional_text(desktop, "chat_contract_version"),
                  "health_url": "https://desktop-backend-hhibjajaja-uc.a.run.app/health",
              },
              "api_backend": {
                  "release_sha": sha(api),
                  "health_url": "https://api.omi.me/health",
              },
              "captured_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          print(json.dumps(payload))
          PY
          curl -fsS -X POST -H 'Content-Type: application/json' -H "secret-key: $ADMIN_KEY" \
            --data-binary @/tmp/desktop-stable-pointer.json https://api.omi.me/v2/desktop/channels/promote \
            > /tmp/desktop-stable-pointer-response.json
          python3 -m json.tool /tmp/desktop-stable-pointer-response.json

      - name: Bridge stable for legacy desktop clients
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          SERVICE_URL=$(gcloud run services describe desktop-backend --region us-central1 --project "$PROJECT_ID" --format='value(status.url)')
          RELEASE_SECRET=$(gcloud secrets versions access latest --secret=RELEASE_SECRET --project "$PROJECT_ID")
          python3 - <<'PY' > /tmp/legacy-desktop-release.json
          import json
          manifest = json.load(open('/tmp/desktop-release-manifest.json'))
          print(json.dumps({"version": manifest["version"], "build_number": manifest["build_number"],
              "download_url": manifest["zip_url"], "ed_signature": manifest["ed_signature"], "changelog": manifest["changelog"],
              "is_live": True, "is_critical": manifest["mandatory"], "channel": "stable"}))
          PY
          RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST -H 'Content-Type: application/json' \
            -H "X-Release-Secret: $RELEASE_SECRET" --data-binary @/tmp/legacy-desktop-release.json "${SERVICE_URL%/}/updates/releases")
          CODE=$(printf '%s\n' "$RESPONSE" | tail -n1)
          test "$CODE" = 201 -o "$CODE" = 409 || { printf '%s\n' "$RESPONSE" >&2; exit 1; }

      - name: Publish latest stable repair route
        env:
          GCS_DESKTOP_UPDATES_BUCKET: ${{ env.GCS_DESKTOP_UPDATES_BUCKET }}
        run: |
          set -euo pipefail
          for file in latest.json index.html; do
            gcloud storage cp --cache-control='no-store,max-age=0' "/tmp/desktop-stable-repair/$file" "$GCS_DESKTOP_UPDATES_BUCKET/stable/$file"
          done

      - name: Mark GitHub release live stable
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$REPO" --json body -q .body > /tmp/release-body.md
          python3 .github/scripts/mark-desktop-release-stable.py --input /tmp/release-body.md --output /tmp/release-body-stable.md
          gh release edit "$RELEASE_TAG" --repo "$REPO" --title "Omi Desktop ${RELEASE_TAG#v}" --notes-file /tmp/release-body-stable.md

      - name: Verify exact pointer, hashes, and stable feed
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          ACCESS_TOKEN=$(gcloud auth print-access-token)
          BASE="https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents"
          # The workspace is the candidate tag, which can predate this workflow.
          # The validated tag grammar leaves '+' as the only path-reserved byte.
          ENCODED_RELEASE_TAG="${RELEASE_TAG/+/%2B}"
          curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" "$BASE/desktop_update_channels/macos-stable" > /tmp/final-stable-pointer.json
          curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" "$BASE/desktop_release_manifests/$ENCODED_RELEASE_TAG" > /tmp/final-stable-manifest.json
          python3 - <<'PY'
          import json, os, sys
          pointer = json.load(open('/tmp/final-stable-pointer.json')).get('fields', {})
          manifest = json.load(open('/tmp/final-stable-manifest.json')).get('fields', {})
          release_id = pointer.get('release_id', {}).get('stringValue')
          if release_id != os.environ['RELEASE_TAG']: sys.exit('stable pointer does not resolve to the requested release')
          expected = json.load(open('/tmp/desktop-release-manifest.json'))
          for key in ('zip_sha256', 'dmg_sha256'):
              if manifest.get(key, {}).get('stringValue') != expected[key]: sys.exit(f'manifest {key} mismatch')
          PY
          curl -fsS 'https://api.omi.me/v2/desktop/appcast.xml?identity=stable' > /tmp/stable-appcast.xml
          python3 .github/scripts/verify_stable_appcast.py --manifest /tmp/desktop-release-manifest.json --feed /tmp/stable-appcast.xml
          echo "Stable pointer, exact manifest hashes, and appcast verified for $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"

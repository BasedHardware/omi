name: Backend Unit Tests

on:
  # Nightly calls run these same jobs against one immutable main snapshot.
  workflow_call:
    inputs:
      nightly_main_sha:
        description: Main SHA pinned by the unfiltered nightly caller
        type: string
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - '.gitignore'
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'config/deployment-setting-classification.json'
      - 'firestore.indexes.json'
      - '.github/actions/detect-changes/**'
      - '.github/actions/ci-tier/**'
      - '.github/actions/deploy-backend-stack/**'
      - '.github/actions/sync-backfill-lifecycle/**'
      - '.github/actions/firestore-readiness/**'
      - '.github/actions/release-eligibility/action.yml'
      - '.github/actions/transcription-release-candidate-probe/**'
      - '.github/workflows/backend-checks.yml'
      - '.github/workflows/backend-hermetic-e2e.yml'
      - '.github/workflows/backend-unit-tests.yml'
      - '.github/workflows/desktop-checks.yml'
      - '.github/workflows/desktop-swift-ci.yml'
      - '.github/workflows/desktop_backend_auto_dev.yml'
      - '.github/workflows/desktop_backend_prod.yml'
      - '.github/workflows/repo-checks.yml'
      - '.github/workflows/release-eligibility.yml'
      - '.github/workflows/desktop_promote_beta.yml'
      - '.github/workflows/desktop_rollback_beta.yml'
      - '.github/workflows/desktop_breakglass_rollout_beta.yml'
      - '.github/workflows/desktop_beta_admission_control.yml'
      - '.github/workflows/desktop_promote_prod.yml'
      - '.github/workflows/gcp_backend.yml'
      - '.github/workflows/gcp_backend_auto_dev.yml'
      - '.github/workflows/gcp_cloud_run_metrics_egress.yml'
      - '.github/workflows/gcp_firestore_indexes.yml'
      - '.github/workflows/gcp_backend*.yml'
      - '.github/workflows/gcp_llm_gateway.yml'
      - '.github/workflows/gcp_notifications_job.yml'
      - '.github/workflows/gcp_x_connector_sync_job.yml'
      - '.github/scripts/check_backend_deploy_source_admission.py'
      - '.github/scripts/verify_auto_backend_release_admission.py'
      - '.github/scripts/verify_backend_release_admission.py'
      - '.github/scripts/verify_release_eligibility.py'
      - '.github/workflows/sync_ledger_fence_cutover.yml'
      - '.github/workflows/**'
      - 'scripts/changed-files'
      - 'scripts/install-git-hooks.sh'
      - 'scripts/pre-push'
      - 'scripts/pre-push-singleflight'
      - 'scripts/voice-provider-probe.sh'
  pull_request:
    paths:
      - '.gitignore'
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'config/deployment-setting-classification.json'
      - 'firestore.indexes.json'
      - '.github/actions/detect-changes/**'
      - '.github/actions/ci-tier/**'
      - '.github/actions/deploy-backend-stack/**'
      - '.github/actions/sync-backfill-lifecycle/**'
      - '.github/actions/firestore-readiness/**'
      - '.github/actions/release-eligibility/action.yml'
      - '.github/actions/transcription-release-candidate-probe/**'
      - '.github/workflows/backend-checks.yml'
      - '.github/workflows/backend-hermetic-e2e.yml'
      - '.github/workflows/backend-unit-tests.yml'
      - '.github/workflows/desktop-checks.yml'
      - '.github/workflows/desktop-swift-ci.yml'
      - '.github/workflows/desktop_backend_auto_dev.yml'
      - '.github/workflows/desktop_backend_prod.yml'
      - '.github/workflows/repo-checks.yml'
      - '.github/workflows/release-eligibility.yml'
      - '.github/workflows/desktop_promote_beta.yml'
      - '.github/workflows/desktop_rollback_beta.yml'
      - '.github/workflows/desktop_breakglass_rollout_beta.yml'
      - '.github/workflows/desktop_beta_admission_control.yml'
      - '.github/workflows/desktop_promote_prod.yml'
      - '.github/workflows/gcp_backend.yml'
      - '.github/workflows/gcp_backend_auto_dev.yml'
      - '.github/workflows/gcp_cloud_run_metrics_egress.yml'
      - '.github/workflows/gcp_firestore_indexes.yml'
      - '.github/workflows/gcp_backend*.yml'
      - '.github/workflows/gcp_llm_gateway.yml'
      - '.github/workflows/gcp_notifications_job.yml'
      - '.github/workflows/gcp_x_connector_sync_job.yml'
      - '.github/scripts/check_backend_deploy_source_admission.py'
      - '.github/scripts/verify_auto_backend_release_admission.py'
      - '.github/scripts/verify_backend_release_admission.py'
      - '.github/scripts/verify_release_eligibility.py'
      - '.github/workflows/sync_ledger_fence_cutover.yml'
      - '.github/workflows/**'
      - 'scripts/changed-files'
      - 'scripts/install-git-hooks.sh'
      - 'scripts/pre-push'
      - 'scripts/pre-push-singleflight'
      - 'scripts/voice-provider-probe.sh'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  # PR updates supersede earlier test runs. Main pushes share one ref-keyed
  # group with cancel-in-progress false: the running suite finishes and only
  # the newest pending main SHA runs next, so a burst of merges no longer
  # queues a full superseded suite for every intermediate SHA. Manual
  # dispatches keep per-run groups and an independent result: sharing the
  # push group would let a dispatch evict the newest pending push run, and a
  # cancelled push check fails scripts/pre_push_ci_verified.py for that SHA.
  group: backend-unit-tests-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && github.ref) || format('run-{0}', github.run_id) }}-${{ inputs.nightly_main_sha != '' && format('nightly-{0}', github.run_id) || 'normal' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Abort a git HTTP transfer that stays under 1 KB/s for 60 s, so actions/checkout
  # retries instead of hanging 7-10 min until the TCP reset (#22890).
  GIT_HTTP_LOW_SPEED_LIMIT: "1000"
  GIT_HTTP_LOW_SPEED_TIME: "60"

jobs:
  ci-tier:
    name: Resolve CI Tier
    runs-on: ubuntu-latest
    outputs:
      full_ci: ${{ inputs.nightly_main_sha != '' && 'true' || (steps.resolve.outputs.full_ci) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.nightly_main_sha || github.sha }}
      - id: resolve
        uses: ./.github/actions/ci-tier

  # The suite's measured cost is per-file pytest process startup (2026-09-10,
  # run 34430370667: 1126 files each in its own session, 19m18s of a 21m53s
  # run, only two files above 4.5s of test time), and sharing processes
  # across files is blocked by dense sys.modules contamination (see the
  # BACKEND_PYTEST_PARALLEL_SESSION measurement in backend/test.sh). So the
  # SAME selection fans out to six parallel shard jobs — standard runners
  # on this public repository are free — each executing an interleaved slice
  # of the sorted file list with the same per-file isolation. Union of the
  # shards is exactly the full selection. Run 38168319908 selected 1,727 files:
  # four shard contract walls were 710/472/772/651s. Shard 3's four Dream files
  # spanned only 17s including startup; it was not a Dream reasoning timeout.
  # Six shards reduce the per-runner selection from 432 to at most 288 files
  # while retaining process isolation and the unchanged 720s regression gate.
  backend-unit-shard:
    name: Backend unit shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    # This ceiling covers runner SETUP plus the 720s step budget, unlike the
    # step budget it must leave room for: setup measured 73-92s typical but
    # 227s worst (run 39741901310 attempt 2, 2026-10-22: checkout 72s, apt
    # 155s), and 227s + 720s = 947s > the old 900s line, so the job timeout
    # cancelled shards mid-run while their test step was still inside budget
    # (conclusion 'cancelled' → gate "backend unit shards result was
    # 'cancelled'"; four such 917-920s walls in the week to 2026-10-22:
    # 39741901310, 39739120103, 39676205452, 39668020536). 25m holds the
    # 720s budget plus worst-plausible setup with the apt step capped at 10m
    # (72s worst checkout + ~90s toolchain + ~570s apt cold allowance,
    # 2026-10-23) and teardown; slow TEST steps still fail loudly through
    # the step's own 720s budget check, so this ceiling stays a hang bound,
    # not the gate.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.nightly_main_sha || github.sha }}
          # Full history is required: the pull_request path resolves the merge base
          # live via scripts/changed-files. blob:none keeps the history without
          # downloading every historical file blob.
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@ecd24dd710f2fb0dca1693a67af11fc4a5c5ec84
        with:
          enable-cache: true
          cache-dependency-glob: backend/pylock*.toml

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Install backend dependencies
        working-directory: backend
        run: |
          uv venv .venv
          uv pip sync pylock.toml --python .venv/bin/python
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Identify native audio package cache
        id: native-audio-image
        run: echo "imageos=${ImageOS:?}" >> "$GITHUB_OUTPUT"

      - name: Restore native audio replay packages
        id: native-audio-apt
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/native-audio-apt/*.deb
          # The closure follows the distro, not the runner image patch. Keep
          # one shared main cache instead of an image key per PR merge ref.
          key: native-audio-apt-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-audio-image.outputs.imageos }}-ffmpeg-libopus0
          # Reuse an existing v1 closure while main seeds the stable key.
          restore-keys: |
            native-audio-apt-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-audio-image.outputs.imageos }}-

      - name: Install native audio replay dependencies
        # Run 40009383869 shards 3/4 exhausted repeated connections to
        # azure.archive.ubuntu.com. Cold downloads use Ubuntu's official
        # HTTPS archives via step-local sources, never the runner mirrorlist.
        # Slice downloads only: killing an install can interrupt dpkg.
        # 7m + 72s checkout + 90s toolchain + 720s test budget leaves 198s
        # inside the 25m job for cache save and post-job cleanup.
        timeout-minutes: 7
        run: |
          COLD_BUDGET=300
          SLICE=120
          cache_dir="$HOME/.cache/native-audio-apt"
          if compgen -G "$cache_dir/*.deb" > /dev/null; then
            # Warm replay stays entirely offline.
            if sudo dpkg -i "$cache_dir"/*.deb; then
              exit 0
            fi
            # Recover a failed replay before apt resolves missing deps. An
            # incomplete closure may still need the download/repair below.
            if ! sudo dpkg --configure -a; then
              echo "::warning::Cached replay needs apt dependency repair"
            fi
          fi
          sudo install -d -m 0755 "$cache_dir/partial"
          . /etc/os-release
          sources=$(mktemp --suffix=.sources)
          trap 'rm -f "$sources"' EXIT
          cat > "$sources" <<EOF
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: ${VERSION_CODENAME:?} ${VERSION_CODENAME}-updates
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu
          Suites: ${VERSION_CODENAME}-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          apt_options=(
            -o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=-
            -o "Dir::Cache::archives=$cache_dir" -o APT::Keep-Downloaded-Packages=true
          )
          recycle_download() {
            local rc=1 remaining slice
            while (( SECONDS < COLD_BUDGET )); do
              remaining=$((COLD_BUDGET - SECONDS))
              slice=$((remaining < SLICE ? remaining : SLICE))
              rc=0
              sudo timeout --signal=TERM --kill-after=5 "${slice}s" apt-get "${apt_options[@]}" -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@" || rc=$?
              if [ "$rc" -eq 0 ]; then return 0; fi
              echo "::warning::apt download exited $rc; $((COLD_BUDGET - SECONDS))s of cold budget left"
            done
            return "$rc"
          }
          recycle_download -o APT::Update::Error-Mode=any update -qq
          recycle_download install --download-only -y -f --no-install-recommends ffmpeg libopus0
          # No network or timeout slices during dpkg's transaction. Fail if
          # the downloaded closure is incomplete; never hide missing codecs.
          sudo apt-get "${apt_options[@]}" -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-download -y -f --no-install-recommends ffmpeg libopus0

      # Seed before tests even if a later test fails. Only main shard 1
      # writes: PR merge-ref copies cannot be shared and churn the cache quota
      # (2026-10-23: seven PR copies for one main entry). PRs restore from main.
      - name: Save native audio replay packages
        if: github.ref == 'refs/heads/main' && steps.native-audio-apt.outputs.cache-hit != 'true' && matrix.shard == 1
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/native-audio-apt/*.deb
          key: ${{ steps.native-audio-apt.outputs.cache-primary-key }}

      - name: Run authoritative backend unit contract
        working-directory: backend
        env:
          # Regression budget: a shard carries ~1/6 of the selection
          # and includes preflight/typecheck plus per-file sessions.
          # Setup is outside this timer. Main shard walls run 420-540s and
          # one fully green shard took 602s against the old 600s line, so
          # 720s holds that worst observed wall with 118s (19.6%) headroom
          # without assuming exactly which files grew. Raise only with
          # measured evidence.
          BACKEND_UNIT_STEP_BUDGET_SECONDS: "720"
        run: |
          step_started=$SECONDS
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Resolve the base live against the checkout (matching detect-changes)
            # rather than the event-payload base.sha, which can be stale for a
            # queued run (FC-stale-event-payload-diff-base, #10785).
            ../scripts/changed-files "origin/${{ github.base_ref }}"...HEAD > /tmp/backend-changed-files.txt
            bash scripts/run-unit-ci.sh --changed-files /tmp/backend-changed-files.txt --shard 6/${{ matrix.shard }}
          else
            bash scripts/run-unit-ci.sh --all --shard 6/${{ matrix.shard }}
          fi
          elapsed=$((SECONDS - step_started))
          echo "backend unit shard wall: ${elapsed}s (budget ${BACKEND_UNIT_STEP_BUDGET_SECONDS}s)"
          if [ "${BACKEND_UNIT_STEP_BUDGET_SECONDS}" -gt 0 ] && [ "$elapsed" -gt "${BACKEND_UNIT_STEP_BUDGET_SECONDS}" ]; then
            echo "FAIL: backend unit shard ${{ matrix.shard }} took ${elapsed}s, over its ${BACKEND_UNIT_STEP_BUDGET_SECONDS}s regression budget. The per-file duration summary above names the slow tail; fix the regression or raise the budget with measured evidence." >&2
            exit 1
          fi

  # `run-unit-ci.sh` runs `not integration and not slow`, which is correct
  # for PR latency but meant every `slow`-marked codebase guardrail in the
  # repository executed nowhere. This job runs exactly those, unselected
  # on internal PRs and main. Forks defer it until a maintainer marks ci:full;
  # a guardrail cannot be gated on the changed-file set alone.
  backend-unit-guardrails:
    name: Backend unit guardrails
    needs: ci-tier
    runs-on: ubuntu-latest
    if: needs.ci-tier.outputs.full_ci == 'true'
    # #21780: all 2040 assertions passed in 535s; setup exhausted the old 10m job ceiling.
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.nightly_main_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@ecd24dd710f2fb0dca1693a67af11fc4a5c5ec84
        with:
          enable-cache: true
          cache-dependency-glob: backend/pylock*.toml

      - name: Install backend dependencies
        working-directory: backend
        run: |
          uv venv .venv
          uv pip sync pylock.toml --python .venv/bin/python
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run slow-marked backend guardrails
        working-directory: backend
        run: PYTHON=.venv/bin/python bash scripts/run-slow-guardrails-ci.sh

  # Keep this name a literal and the sole required-check surface: GitHub
  # publishes matrix job names as separate checks, so the shards must never
  # carry the check name branch protection and humans watch. The gate fails
  # closed on any non-success shard or guardrail result.
  backend-unit-suite:
    name: Backend unit suite
    needs: [ci-tier, backend-unit-shard, backend-unit-guardrails]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard and the guardrails to pass
        env:
          # A matrix job's aggregate result is 'success' only when every
          # shard instance succeeded, which is exactly the fail-closed
          # verdict this gate exists to publish.
          SHARD_RESULT: ${{ needs.backend-unit-shard.result }}
          GUARDRAILS_RESULT: ${{ needs.backend-unit-guardrails.result }}
          TIER_RESULT: ${{ needs.ci-tier.result }}
          FULL_CI: ${{ needs.ci-tier.outputs.full_ci }}
        run: |
          failed=0
          if [ "$TIER_RESULT" != "success" ]; then
            echo "FAIL: CI tier resolution was '$TIER_RESULT'" >&2
            failed=1
          fi
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "FAIL: backend unit shards result was '$SHARD_RESULT'" >&2
            failed=1
          fi
          guardrails_required=success
          if [ "$FULL_CI" != true ]; then
            guardrails_required=skipped
            notice='fork PR — a maintainer adds label ci:full, then Re-run all jobs'
            echo "::notice title=Heavy CI deferred::$notice"
            echo "Heavy CI deferred: $notice" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$GUARDRAILS_RESULT" != "$guardrails_required" ]; then
            echo "FAIL: backend unit guardrails result was '$GUARDRAILS_RESULT' (expected $guardrails_required)" >&2
            failed=1
          fi
          exit "$failed"

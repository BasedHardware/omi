name: Deploy Cloud Run Metrics Egress

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/charts/monitoring/prometheus-stackdriver-exporter/*_omi_cloud_run_metrics_exporter.yaml'
      - 'backend/charts/monitoring/kube-prometheus-stack/*_omi_monitoring_values.yaml'
      - 'backend/charts/monitoring/alerts/live-stt.json'
      - 'backend/charts/monitoring/alerts/resilience.json'
      - 'backend/charts/monitoring/live-alert-gate.json'
      - 'backend/charts/monitoring/gmp/frontend-values.prod.yaml'
      - '.github/workflows/gcp_cloud_run_metrics_egress.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the monitoring environment to deploy'
        required: true
        default: development
        type: choice
        options:
          - development
          - prod

# Monitoring releases share one mutation domain per environment. Do not cancel
# an in-flight Helm upgrade because --atomic rollback must be allowed to finish.
concurrency:
  group: deploy-cloud-run-metrics-egress-${{ github.event.inputs.environment || 'development' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Abort a git HTTP transfer that stays under 1 KB/s for 60 s, so actions/checkout
  # retries instead of hanging 7-10 min until the TCP reset (#22890).
  GIT_HTTP_LOW_SPEED_LIMIT: "1000"
  GIT_HTTP_LOW_SPEED_TIME: "60"

jobs:
  deploy:
    # workflow_dispatch can be started from any ref in the UI. Only reviewed
    # main configuration may receive deployment credentials.
    if: github.ref == 'refs/heads/main'
    environment: ${{ github.event.inputs.environment == 'prod' && 'prod' || 'development' }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed monitoring configuration
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # Required repo or prod Environment variable; fail before credentials/Helm.
      - name: Validate prod dead-man notification channels
        if: github.event.inputs.environment == 'prod'
        env:
          ALERT_CHANNELS: ${{ vars.MONITORING_DEADMAN_NOTIFICATION_CHANNELS }}
        run: |
          set -euo pipefail
          if [[ -z "${ALERT_CHANNELS//[[:space:]]/}" ]]; then
            echo "MONITORING_DEADMAN_NOTIFICATION_CHANNELS must be created before running prod monitoring." >&2
            exit 1
          fi

      - name: Resolve environment-specific release contract
        env:
          ENV_SLUG: ${{ vars.ENV }}
        run: |
          set -euo pipefail
          stats_proxy_sha256=
          case "$ENV_SLUG" in
            dev)
              stack_release=dev-kube-prometheus-stack
              ;;
            prod)
              stack_release=prod-omi-kube-prometheus-stack
              # Prod Grafana mounts the parent-applied grafana-stats-proxy ConfigMap and
              # carries this hash as a pod annotation so a changed script rolls the pod.
              # The values file does not hold it; omitting it here would drop the
              # annotation and restart Grafana on every run of this workflow.
              stats_proxy_sha256="$(sha256sum backend/charts/monitoring/grafana/stats_proxy.py | cut -d' ' -f1)"
              if [[ ! "$stats_proxy_sha256" =~ ^[0-9a-f]{64}$ ]]; then
                echo "Could not hash backend/charts/monitoring/grafana/stats_proxy.py." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported monitoring environment slug: $ENV_SLUG" >&2
              exit 1
              ;;
          esac
          {
            echo "MONITORING_NAMESPACE=${ENV_SLUG}-omi-monitoring"
            echo "EXPORTER_RELEASE=${ENV_SLUG}-omi-cloud-run-metrics-exporter"
            echo "STACK_RELEASE=$stack_release"
            echo "EXPORTER_VALUES=backend/charts/monitoring/prometheus-stackdriver-exporter/${ENV_SLUG}_omi_cloud_run_metrics_exporter.yaml"
            echo "SYNC_EXPORTER_RELEASE=${ENV_SLUG}-omi-cloud-run-sync-metrics-exporter"
            echo "SYNC_EXPORTER_VALUES=backend/charts/monitoring/prometheus-stackdriver-exporter/${ENV_SLUG}_sync_omi_cloud_run_metrics_exporter.yaml"
            echo "STATS_PROXY_SHA256=$stats_proxy_sha256"
            echo "STACK_VALUES=backend/charts/monitoring/kube-prometheus-stack/${ENV_SLUG}_omi_monitoring_values.yaml"
          } >> "$GITHUB_ENV"

      - name: Install Helm
        uses: azure/setup-helm@v5

      # Prod: GitHub WIF as omi-ci-monitoring-prod@ (credential-hygiene WS-C, plan v2 Phase E).
      # Development keeps its JSON lane.
      - name: Google Auth (prod WIF)
        id: auth-wif
        if: github.event.inputs.environment == 'prod'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/208440318997/locations/global/workloadIdentityPools/omi-gha-deploy-prod/providers/github
          service_account: omi-ci-monitoring-prod@based-hardware.iam.gserviceaccount.com

      - name: Google Auth
        if: github.event.inputs.environment != 'prod'
        uses: google-github-actions/auth@v3
        with:
          # Development: GitHub WIF as omi-ci-monitoring-dev@, mirroring prod. The chart's
          # admission hooks create and delete ClusterRoles, which omi-ci-deployer-dev
          # (container.developer) cannot do; this identity holds container.admin and is
          # impersonable only from this workflow on main.
          workload_identity_provider: projects/1031333818730/locations/global/workloadIdentityPools/omi-gha-deploy-dev/providers/github
          service_account: omi-ci-monitoring-dev@based-hardware-dev.iam.gserviceaccount.com

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: us-central1
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Add pinned chart repository
        run: |
          set -euo pipefail
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
          helm repo update prometheus-community

      - name: Render Cloud Run metrics egress releases
        run: |
          set -euo pipefail
          helm template "$EXPORTER_RELEASE" prometheus-community/prometheus-stackdriver-exporter \
            --version 4.8.3 \
            --namespace "$MONITORING_NAMESPACE" \
            --values "$EXPORTER_VALUES" >/dev/null
          helm template "$SYNC_EXPORTER_RELEASE" prometheus-community/prometheus-stackdriver-exporter \
            --version 4.8.3 \
            --namespace "$MONITORING_NAMESPACE" \
            --values "$SYNC_EXPORTER_VALUES" >/dev/null
          stack_values=(--values "$STACK_VALUES")
          stack_flags=()
          if [[ -n "$STATS_PROXY_SHA256" ]]; then
            stack_flags=(--set-string "grafana.podAnnotations.omi-stats-proxy-sha256=$STATS_PROXY_SHA256")
          fi
          if [[ "$MONITORING_NAMESPACE" == prod-omi-monitoring ]]; then
            stack_values+=(--values backend/charts/monitoring/gmp/frontend-values.prod.yaml)
            umask 077
            helm template "$STACK_RELEASE" prometheus-community/kube-prometheus-stack \
              --version 75.15.1 --namespace "$MONITORING_NAMESPACE" \
              --values "$STACK_VALUES" "${stack_flags[@]}" > "$RUNNER_TEMP/monitoring-base.yaml"
            helm template "$STACK_RELEASE" prometheus-community/kube-prometheus-stack \
              --version 75.15.1 --namespace "$MONITORING_NAMESPACE" \
              "${stack_values[@]}" "${stack_flags[@]}" > "$RUNNER_TEMP/monitoring-gmp.yaml"
            python3 -m venv "$RUNNER_TEMP/monitoring-tools"
            "$RUNNER_TEMP/monitoring-tools/bin/pip" install --timeout 15 --retries 2 PyYAML==6.0.2
            "$RUNNER_TEMP/monitoring-tools/bin/python" backend/scripts/verify_gmp_frontend_render.py \
              --baseline "$RUNNER_TEMP/monitoring-base.yaml" --candidate "$RUNNER_TEMP/monitoring-gmp.yaml"
          fi
          helm template "$STACK_RELEASE" prometheus-community/kube-prometheus-stack \
            --version 75.15.1 \
            --namespace "$MONITORING_NAMESPACE" \
            "${stack_values[@]}" "${stack_flags[@]}" >/dev/null

      # The sync exporter goes first so the families it takes over from the main
      # exporter are being collected before the main exporter stops reading them.
      - name: Deploy isolated Cloud Run sync metrics exporter
        run: |
          set -euo pipefail
          helm upgrade --install "$SYNC_EXPORTER_RELEASE" prometheus-community/prometheus-stackdriver-exporter \
            --version 4.8.3 \
            --namespace "$MONITORING_NAMESPACE" \
            --values "$SYNC_EXPORTER_VALUES" \
            --atomic \
            --wait \
            --timeout 10m

      - name: Deploy isolated Cloud Run metrics exporter
        run: |
          set -euo pipefail
          helm upgrade --install "$EXPORTER_RELEASE" prometheus-community/prometheus-stackdriver-exporter \
            --version 4.8.3 \
            --namespace "$MONITORING_NAMESPACE" \
            --values "$EXPORTER_VALUES" \
            --atomic \
            --wait \
            --timeout 10m

      - name: Deploy Prometheus scrape configuration
        run: |
          set -euo pipefail
          stack_values=(--values "$STACK_VALUES")
          rollback_flags=(--atomic)
          if [[ "$MONITORING_NAMESPACE" == prod-omi-monitoring ]]; then
            # The previous revision scales down with PVC whenScaled=Delete.
            # Its automatic rollback could delete the new replica's history.
            # Parent reviews old values with Retain before a manual rollback.
            rollback_flags=()
            stack_values+=(--values backend/charts/monitoring/gmp/frontend-values.prod.yaml)
          fi
          stack_flags=()
          if [[ -n "$STATS_PROXY_SHA256" ]]; then
            # Keep the live annotation; the ConfigMap itself stays parent-applied.
            stack_flags=(--set-string "grafana.podAnnotations.omi-stats-proxy-sha256=$STATS_PROXY_SHA256")
          fi
          helm upgrade --install "$STACK_RELEASE" prometheus-community/kube-prometheus-stack \
            --version 75.15.1 \
            --namespace "$MONITORING_NAMESPACE" \
            "${stack_values[@]}" \
            "${stack_flags[@]}" \
            --skip-crds \
            "${rollback_flags[@]}" \
            --wait \
            --timeout 15m

      - name: Verify operator-created production Prometheus replicas
        if: github.event.inputs.environment == 'prod'
        run: |
          set -euo pipefail
          PROD_CONTEXT=gke_based-hardware_us-central1_prod-omi-gke
          PROD_NAMESPACE=prod-omi-monitoring
          PROMETHEUS_STS=prometheus-prod-omi-kube-prometheus-s-prometheus
          kubectl --context "$PROD_CONTEXT" --namespace "$PROD_NAMESPACE" \
            wait --for=jsonpath='{.spec.replicas}'=2 \
            "statefulset/$PROMETHEUS_STS" --timeout=5m
          kubectl --context "$PROD_CONTEXT" --namespace "$PROD_NAMESPACE" \
            rollout status "statefulset/$PROMETHEUS_STS" --timeout=10m
          umask 077
          kubectl --context "$PROD_CONTEXT" --namespace "$PROD_NAMESPACE" \
            get statefulset "$PROMETHEUS_STS" -o json > "$RUNNER_TEMP/prometheus-statefulset.json"
          kubectl --context "$PROD_CONTEXT" --namespace "$PROD_NAMESPACE" \
            get pods -l operator.prometheus.io/name=prod-omi-kube-prometheus-s-prometheus \
            -o json > "$RUNNER_TEMP/prometheus-pods.json"
          kubectl --context "$PROD_CONTEXT" --namespace "$PROD_NAMESPACE" \
            get persistentvolumeclaims -o json > "$RUNNER_TEMP/prometheus-pvcs.json"
          python3 backend/scripts/verify_prometheus_replica_readiness.py \
            --statefulset-json "$RUNNER_TEMP/prometheus-statefulset.json" \
            --pods-json "$RUNNER_TEMP/prometheus-pods.json" \
            --pvcs-json "$RUNNER_TEMP/prometheus-pvcs.json"

      - name: Verify deployed egress resources
        run: |
          set -euo pipefail
          helm status "$EXPORTER_RELEASE" --namespace "$MONITORING_NAMESPACE"
          helm status "$SYNC_EXPORTER_RELEASE" --namespace "$MONITORING_NAMESPACE"
          helm status "$STACK_RELEASE" --namespace "$MONITORING_NAMESPACE"
          for release in "$EXPORTER_RELEASE" "$SYNC_EXPORTER_RELEASE"; do
            kubectl rollout status "deployment/$release" \
              --namespace "$MONITORING_NAMESPACE" \
              --timeout=5m
            kubectl get service "$release" \
              --namespace "$MONITORING_NAMESPACE"
          done

      - name: Verify production GMP query path
        if: github.event.inputs.environment == 'prod'
        env:
          MONITOR_GRAFANA_TOKEN: ${{ secrets.MONITOR_GRAFANA_TOKEN }}
        run: |
          set -euo pipefail
          kubectl --context gke_based-hardware_us-central1_prod-omi-gke \
            --namespace prod-omi-monitoring rollout status deployment/prod-omi-gmp-query-frontend --timeout=5m
          # The datasource sidecar can reload shortly after Helm reports Ready.
          for attempt in 1 2 3; do
            if python3 backend/scripts/provision_monitoring_alerts.py --probe-datasources; then
              exit 0
            fi
            if [[ "$attempt" != 3 ]]; then sleep 5; fi
          done
          exit 1

      # Runs after Helm so a Monitoring permission gap cannot block the Grafana/Prometheus
      # rollout; it still fails the job (fail closed) when the dead-man cannot be reconciled.
      - name: Ensure external prod Grafana dead-man
        if: github.event.inputs.environment == 'prod'
        env:
          ALERT_CHANNELS: ${{ vars.MONITORING_DEADMAN_NOTIFICATION_CHANNELS }}
        run: |
          set -euo pipefail
          python3 .github/scripts/ensure_grafana_deadman.py \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --notification-channels="$ALERT_CHANNELS"

  provision-live-alerts:
    # Grafana alert provisioning is independent of Helm deploy health: a
    # Helm failure must not suppress live-STT alert updates.
    if: github.ref == 'refs/heads/main'
    environment: ${{ github.event.inputs.environment == 'prod' && 'prod' || 'development' }}
    concurrency:
      group: grafana-alert-provisioning-${{ github.event.inputs.environment == 'prod' && 'prod' || 'dev' }}
      cancel-in-progress: false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed monitoring configuration
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Import allowlisted live-STT Grafana alerts
        env:
          MONITOR_GRAFANA_TOKEN: ${{ secrets.MONITOR_GRAFANA_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          token_file="$(mktemp "$RUNNER_TEMP/omi-grafana-token.XXXXXX")"
          cleanup() { rm -f "$token_file"; unset MONITOR_GRAFANA_TOKEN; }
          trap cleanup EXIT
          test -n "$MONITOR_GRAFANA_TOKEN"
          case "${{ vars.ENV }}" in
            dev|development) grafana_url=https://monitor.omiapi.com ;;
            prod) grafana_url=https://monitor.omi.me ;;
            *) echo "Unsupported Grafana environment." >&2; exit 1 ;;
          esac
          printf '%s' "$MONITOR_GRAFANA_TOKEN" > "$token_file"
          python3 backend/scripts/verify_pusher_live_alert_route.py \
            --grafana-url "$grafana_url" \
            --token-file "$token_file" \
            --mode import

      - name: Verify imported live-STT Grafana alert coverage
        env:
          MONITOR_GRAFANA_TOKEN: ${{ secrets.MONITOR_GRAFANA_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          token_file="$(mktemp "$RUNNER_TEMP/omi-grafana-token.XXXXXX")"
          cleanup() { rm -f "$token_file"; unset MONITOR_GRAFANA_TOKEN; }
          trap cleanup EXIT
          test -n "$MONITOR_GRAFANA_TOKEN"
          case "${{ vars.ENV }}" in
            dev|development) grafana_url=https://monitor.omiapi.com ;;
            prod) grafana_url=https://monitor.omi.me ;;
            *) echo "Unsupported Grafana environment." >&2; exit 1 ;;
          esac
          printf '%s' "$MONITOR_GRAFANA_TOKEN" > "$token_file"
          python3 backend/scripts/verify_pusher_live_alert_route.py \
            --grafana-url "$grafana_url" \
            --token-file "$token_file" \
            --mode fleet \
            --alert-set live-stt \
            --fail-on gated

name: Deploy Parakeet ASR to GKE

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - prod
      branch:
        description: 'Branch to deploy from'
        required: true
        default: 'main'
      release_version:
        description: 'Release version (optional)'
        required: false
        default: ''
      break_glass_lock:
        description: 'Break-glass: skip the shared prod-train lock (still serialized per target; the actor is recorded)'
        required: false
        default: false
        type: boolean

# Serialize Helm writers to this environment's Parakeet release.
# B5 (named by David, 2026-10-19 fourth round #9): every prod deploy writer shares the
# prod-train lock, so trains, config-trains and GPU/listen deploys never overlap and the
# ramp controller can refuse while one runs (backend/scripts/prod_train_lock.py).
# Break-glass keeps the pre-B5 per-target lock. Development groups are unchanged.
concurrency:
  group: ${{ github.event.inputs.environment == 'prod' && github.event.inputs.break_glass_lock != 'true' && 'prod-train' || format('deploy-gke-parakeet-{0}', github.event.inputs.environment) }}
  cancel-in-progress: false

env:
  # Abort a git HTTP transfer that stays under 1 KB/s for 60 s, so actions/checkout
  # retries instead of hanging 7-10 min until the TCP reset (#22890).
  GIT_HTTP_LOW_SPEED_LIMIT: "1000"
  GIT_HTTP_LOW_SPEED_TIME: "60"
  SERVICE: parakeet
  REGION: us-central1

jobs:
  deploy:
    environment: ${{ github.event.inputs.environment == 'prod' && 'prod' || 'development' }}
    permissions:
      contents: 'read'
      id-token: 'write'

    runs-on: ubuntu-latest
    steps:
      - name: Validate Environment Input
        run: |
          if [[ "${{ github.event.inputs.environment }}" != "development" && "${{ github.event.inputs.environment }}" != "prod" ]]; then
            echo "Invalid environment: ${{ github.event.inputs.environment }}. Must be 'development' or 'prod'."
            exit 1
          fi

      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - name: Checkout
        uses: actions/checkout@v7

      # Prod: GitHub WIF as omi-ci-deployer-prod@ (credential-hygiene WS-C, plan v2 Phase E).
      # Development keeps its JSON lane.
      - name: Google Auth (prod WIF)
        id: auth-wif
        if: github.event.inputs.environment == 'prod'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/208440318997/locations/global/workloadIdentityPools/omi-gha-deploy-prod/providers/github
          service_account: omi-ci-deployer-prod@based-hardware.iam.gserviceaccount.com

      - name: Google Auth
        id: auth
        if: github.event.inputs.environment != 'prod'
        uses: google-github-actions/auth@v3
        with:
          # Development: GitHub WIF as the dev deployer, no JSON key (credential hygiene WS-D).
          workload_identity_provider: projects/1031333818730/locations/global/workloadIdentityPools/omi-gha-deploy-dev/providers/github
          service_account: omi-ci-deployer-dev@based-hardware-dev.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - run: gcloud auth configure-docker

      - name: Build and Push Docker image
        run: |
          docker build -t "gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${GITHUB_SHA::7}" -f backend/${{ env.SERVICE }}/Dockerfile .
          python3 backend/scripts/runtime_image_contracts.py smoke \
            --dockerfile backend/parakeet/Dockerfile \
            --image "gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${GITHUB_SHA::7}"
          docker push "gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${GITHUB_SHA::7}"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ env.REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Deploy Parakeet to GKE cluster using Helm
        run: |
          helm -n ${{ vars.ENV }}-omi-backend upgrade --install ${{ vars.ENV }}-omi-${{ env.SERVICE }} ./backend/charts/${{ env.SERVICE }} -f ./backend/charts/${{ env.SERVICE }}/${{ vars.ENV }}_omi_${{ env.SERVICE }}_values.yaml --set-string "image.tag=${GITHUB_SHA::7}"

      - name: Verify rollout
        run: |
          rollout_timeout=2100s
          kubectl_context=()
          if [[ "${{ github.event.inputs.environment }}" == "development" ]]; then
            rollout_timeout=2100s
            kubectl_context=(--context gke_based-hardware-dev_us-central1_dev-omi-gke)
          fi
          if ! kubectl "${kubectl_context[@]}" -n ${{ vars.ENV }}-omi-backend rollout status deploy/${{ vars.ENV }}-omi-${{ env.SERVICE }} --timeout="$rollout_timeout"; then
            python3 backend/scripts/deploy_status_report.py --env ${{ vars.ENV }} --include-gke --gke-service ${{ env.SERVICE }} || true
            exit 1
          fi
          python3 backend/scripts/deploy_status_report.py --env ${{ vars.ENV }} --include-gke --gke-service ${{ env.SERVICE }}

      - name: Canary deployed dev Parakeet batch transcription
        if: github.event.inputs.environment == 'development'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ vars.GCP_PROJECT_ID }}" != "based-hardware-dev" || "${{ vars.ENV }}" != "dev" || "${{ vars.GKE_CLUSTER }}" != "dev-omi-gke" ]]; then
            echo "::error::Refusing Parakeet canary outside the dev project and cluster"
            exit 1
          fi
          kubectl --context gke_based-hardware-dev_us-central1_dev-omi-gke \
            -n dev-omi-backend port-forward svc/dev-omi-parakeet 18080:8080 \
            > /tmp/parakeet-canary-port-forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          python3 backend/scripts/parakeet_dev_canary.py

      - name: Generate deployment summary
        if: always() && github.event.inputs.environment == 'prod'
        uses: ./.github/actions/deployment-summary
        with:
          environment: ${{ github.event.inputs.environment }}
          release_version: ${{ github.event.inputs.release_version }}
          status: ${{ job.status }}
          service: ${{ env.SERVICE }}

      - name: Notify deployment status on Telegram
        if: always() && github.event.inputs.environment == 'prod'
        uses: ./.github/actions/deployment-notifier
        with:
          environment: ${{ github.event.inputs.environment }}
          release_version: ${{ github.event.inputs.release_version }}
          status: ${{ job.status }}
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

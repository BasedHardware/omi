name: Deploy Memory Maintenance Job to Cloud RUN

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - prod
      branch:
        description: 'Branch to deploy from'
        required: true
        default: 'main'
        type: string
      release_version:
        description: 'Release version (optional)'
        required: false
        default: ''

env:
  SERVICE: memory-maintenance-job
  SCHEDULER_JOB: memory-maintenance-hourly
  REGION: us-central1

# Share the development lock with the auto-deploy workflow that writes this Cloud Run job.
concurrency:
  group: deploy-cloud-run-memory-maintenance-job-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    environment: ${{ github.event.inputs.environment == 'prod' && 'prod' || 'development' }}
    permissions:
      contents: 'read'

    runs-on: ubuntu-latest
    steps:
      - name: Validate Environment Input
        env:
          INPUT_ENV: ${{ github.event.inputs.environment }}
        run: |
          if [[ "$INPUT_ENV" != "development" && "$INPUT_ENV" != "prod" ]]; then
            echo "Invalid environment: $INPUT_ENV. Must be 'development' or 'prod'."
            exit 1
          fi

      # Retain this until the summary shows it no longer buys enough headroom.
      - name: Measure runner disk cleanup
        run: |
          started_at=$SECONDS
          free_before=$(df -h / | awk 'NR == 2 { print $4 }')
          rm -rf /opt/hostedtoolcache
          free_after=$(df -h / | awk 'NR == 2 { print $4 }')
          {
            echo "### Runner disk cleanup"
            echo "- Duration: $((SECONDS - started_at))s"
            echo "- Free space: ${free_before} → ${free_after}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Login to GCR
        run: gcloud auth configure-docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute short SHA
        id: image-tag
        run: |
          # Use checked-out HEAD so the image tag matches the branch input, not
          # the workflow-file ref (GITHUB_SHA), when they diverge.
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Python deps for deploy scripts
        run: python3 -m pip install -q pyyaml

      - name: Get GKE credentials for gateway serving gate
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ env.REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Verify LLM Gateway serving data plane
        id: gateway-serving
        run: |
          python3 backend/scripts/verify-llm-gateway-serving.py \
            --environment="${{ vars.ENV }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/modal/Dockerfile.memory_maintenance_job
          push: false
          load: true
          tags: |
            gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:latest
            gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${{ steps.image-tag.outputs.short_sha }}
          cache-from: type=registry,ref=gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:buildcache
          cache-to: type=registry,ref=gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:buildcache,mode=max

      - name: Verify built runtime image before publish
        run: |
          image=gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${{ steps.image-tag.outputs.short_sha }}
          python3 backend/scripts/runtime_image_contracts.py smoke \
            --dockerfile backend/modal/Dockerfile.memory_maintenance_job \
            --image "$image"

      - name: Push verified runtime image
        run: |
          docker push gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:latest
          docker push gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${{ steps.image-tag.outputs.short_sha }}

      - name: Probe memory L2 gateway lane from the Cloud Run VPC
        run: |
          bash backend/scripts/probe-llm-gateway-from-cloud-run.sh \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --image "gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${{ steps.image-tag.outputs.short_sha }}" \
            --gateway-url "${{ steps.gateway-serving.outputs.gateway_url }}" \
            --network "${{ vars.CLOUD_RUN_VPC_NETWORK }}" \
            --subnet "${{ vars.CLOUD_RUN_VPC_SUBNET }}" \
            --vpc-egress private-ranges-only \
            --lane omi:auto:memory-l2 \
            --name-suffix "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Render maintenance runtime env from the gated gateway endpoint
        id: runtime-env
        env:
          CLOUD_RUN_VPC_NETWORK: ${{ vars.CLOUD_RUN_VPC_NETWORK }}
          CLOUD_RUN_VPC_SUBNET: ${{ vars.CLOUD_RUN_VPC_SUBNET }}
          OMI_LLM_GATEWAY_URL: ${{ steps.gateway-serving.outputs.gateway_url }}
        run: |
          python3 backend/scripts/render_backend_runtime_env.py --env ${{ vars.ENV }} --job memory-maintenance-job >> "$GITHUB_OUTPUT"

      - name: Validate backend runtime env before deploy
        run: |
          python3 backend/scripts/validate-backend-runtime-env.py --env ${{ vars.ENV }} --check-workflows

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          job: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          image: gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${{ steps.image-tag.outputs.short_sha }}
          flags: ${{ steps.runtime-env.outputs.cloud_run_flags }} ${{ steps.runtime-env.outputs.memory_maintenance_job_flags }}
          env_vars: ${{ steps.runtime-env.outputs.memory_maintenance_job_env_vars }}
          secrets: ${{ steps.runtime-env.outputs.memory_maintenance_job_secrets }}

      - name: Validate hourly Scheduler trigger
        run: |
          scheduler_state_file=$(mktemp)
          trap 'rm -f "$scheduler_state_file"' EXIT
          gcloud scheduler jobs describe "$SCHEDULER_JOB" \
            --location="$REGION" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --format=json > "$scheduler_state_file"
          python3 backend/scripts/validate_memory_maintenance_scheduler.py \
            --state-file "$scheduler_state_file" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "$REGION" \
            --scheduler-job "$SCHEDULER_JOB" \
            --cloud-run-job "$SERVICE"

      # If required, use the Cloud Run url output in later steps
      - name: Show Output
        run: echo ${{ steps.deploy.outputs.url }}

      - name: Generate deployment summary
        if: always() && github.event.inputs.environment == 'prod'
        uses: ./.github/actions/deployment-summary
        with:
          environment: ${{ github.event.inputs.environment }}
          release_version: ${{ github.event.inputs.release_version }}
          status: ${{ job.status }}
          service: ${{ env.SERVICE }}

      - name: Notify deployment status on Telegram
        if: always() && github.event.inputs.environment == 'prod'
        uses: ./.github/actions/deployment-notifier
        with:
          environment: ${{ github.event.inputs.environment }}
          release_version: ${{ github.event.inputs.release_version }}
          status: ${{ job.status }}
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

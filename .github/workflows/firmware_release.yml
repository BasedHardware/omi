name: Firmware Build & Release (Omi CV1)

# Builds the Omi CV1 firmware (nRF5340, the consumer "Omi CV 1" device) and
# promotes the exact tested build-only artifacts to a GitHub Release for OTA.
# The publish path never builds. The backend serves it as an OTA
# update (backend/routers/firmware.py).
#
# Manual-only by design: firmware has no auto-version/changelog system like the
# desktop app, builds are heavy (~1.5GB SDK download, ~20-30 min cold), and the
# release metadata (min versions, changelog, OTA steps) is hand-curated. A
# human-gated dispatch with an explicit publish guard mirrors the spirit of
# desktop_promote_prod.yml.
#
# Release contract enforced here (verified against backend/routers/firmware.py):
#   - Tag:   Omi_CV1_v<ver>            (NO "OTA" in the tag)
#   - OTA asset name MUST contain "ota" and end in .zip  (e.g. Omi_CV1_OTA_v3.0.20.zip)
#   - Release MUST be published, non-draft, non-prerelease (else not served)
#   - Body MUST contain a KEY_VALUE block with release_firmware_version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override e.g. 3.0.20 (blank = read CONFIG_BT_DIS_FW_REV_STR from omi.conf)'
        type: string
        required: false
        default: ''
      publish:
        description: 'Type "publish" to create the GitHub Release. Anything else = build-only (artifacts uploaded to the run, no release).'
        type: string
        required: false
        default: ''
      changelog:
        description: 'Pipe-separated changelog e.g. "Fixed audio|Battery improvements"'
        type: string
        required: false
        default: 'Bug fixes and improvements'
      minimum_firmware_required:
        description: 'minimum_firmware_required e.g. 3.0.6 (blank = omit)'
        type: string
        required: false
        default: ''
      minimum_app_version:
        description: 'minimum_app_version e.g. 1.0.74 (blank = omit)'
        type: string
        required: false
        default: ''
      minimum_app_version_code:
        description: 'minimum_app_version_code e.g. 438 (blank = omit)'
        type: string
        required: false
        default: ''
      qa_run_id:
        description: 'Required for publish: successful build-only run of this workflow at the same SHA'
        type: string
        default: ''
      qa_run_attempt:
        description: 'Required for publish: exact bench-tested attempt of qa_run_id'
        type: string
        default: ''
      tested_signed_sha256:
        description: 'Required for publish: bench-reported SHA-256 of omi.signed.bin'
        type: string
        default: ''
      include_network_core:
        description: 'Explicitly include image 1 in OTA (must match the tested QA run)'
        type: boolean
        default: false
      rollout_percent:
        description: 'Initial cohort: 0 or 1 only (emergency_revert permits up to 100); expand by editing the body'
        type: number
        default: 1
      blocked:
        description: 'Kill switch: do not offer this release'
        type: boolean
        default: false
      emergency_revert:
        description: 'Explicitly authorize a reserved 3.0.90-3.0.99 emergency revert version'
        type: boolean
        default: false
      ota_update_steps:
        description: 'Comma-separated OTA prerequisites e.g. battery,internet (blank = omit)'
        type: string
        required: false
        default: 'battery,internet'

permissions:
  # Default token is read-only (checkout). The release/tag is created with the
  # separate, contents:write-scoped Omi Bot app token in the publish step.
  contents: read
  actions: read

env:
  # Abort a git HTTP transfer that stays under 1 KB/s for 60 s, so actions/checkout
  # retries instead of hanging 7-10 min until the TCP reset (#22890).
  GIT_HTTP_LOW_SPEED_LIMIT: "1000"
  GIT_HTTP_LOW_SPEED_TIME: "60"

jobs:
  build-cv1:
    name: Omi CV1 (nRF5340)
    runs-on: ubuntu-latest
    concurrency:
      group: firmware-release-cv1
      cancel-in-progress: false
    env:
      VERSION_INPUT: ${{ inputs.version }}
      PUBLISH: ${{ inputs.publish }}
      QA_RUN_ID: ${{ inputs.qa_run_id }}
      QA_RUN_ATTEMPT: ${{ inputs.qa_run_attempt }}
      TESTED_SIGNED_SHA256: ${{ inputs.tested_signed_sha256 }}
      INCLUDE_NETWORK_CORE: ${{ inputs.include_network_core }}
      EMERGENCY_REVERT: ${{ inputs.emergency_revert }}
      ROLLOUT_PERCENT: ${{ inputs.rollout_percent }}
      BLOCKED: ${{ inputs.blocked }}
      # Zephyr CI image blessed by omi/firmware/BUILD_AND_OTA_FLASH.md; bundles the
      # toolchain for the NCS 2.9.0 sysbuild + MCUboot signing build.
      # Pinned by digest for reproducible, supply-chain-safe builds (tag kept
      # for readability). Digest = the v0.26.13 multi-arch index; re-resolve with
      # `docker buildx imagetools inspect ghcr.io/zephyrproject-rtos/ci:<tag>`.
      CI_IMAGE: ghcr.io/zephyrproject-rtos/ci:v0.26.13@sha256:b0ac6334d1926cd0971a0a444f7adc6dd020e88ee3ce865aa070b6475a3ac4eb
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release inputs and prepare build version
        id: meta
        run: python3 omi/firmware/scripts/ci/cv1_release.py prepare

      - name: Cache nRF Connect SDK workspace (v2.9.0)
        if: ${{ inputs.publish != 'publish' }}
        uses: actions/cache@v6
        with:
          path: omi/firmware/v2.9.0
          key: ncs-v2.9.0-${{ runner.os }}

      - name: Build firmware (Docker)
        if: ${{ inputs.publish != 'publish' }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/omi/firmware:/omi/firmware" \
            -e CMAKE_PREFIX_PATH=/opt/toolchains \
            -e GITHUB_SHA -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            "$CI_IMAGE" \
            bash /omi/firmware/scripts/ci/build-cv1.sh

      - name: Upload failed MCUboot build diagnostics
        if: ${{ failure() && inputs.publish != 'publish' }}
        uses: actions/upload-artifact@v7
        with:
          name: cv1-bootloader-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            omi/firmware/v2.9.0/build/mcuboot/zephyr/zephyr.elf
            omi/firmware/v2.9.0/build/mcuboot/zephyr/zephyr.hex
            omi/firmware/v2.9.0/build/mcuboot/zephyr/zephyr.map
            omi/firmware/v2.9.0/build/mcuboot/zephyr/.config
            omi/firmware/v2.9.0/build/partitions.yml
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Fix workspace ownership
        if: ${{ inputs.publish != 'publish' }}
        run: sudo chown -R "$(id -u):$(id -g)" omi/firmware

      - name: Upload custom MCUboot qualification evidence (never release assets)
        if: ${{ inputs.publish != 'publish' }}
        uses: actions/upload-artifact@v7
        with:
          name: cv1-bootloader-${{ github.run_id }}-${{ github.run_attempt }}
          path: omi/firmware/v2.9.0/build/cv1-bootloader/*
          if-no-files-found: error

      # Release gate: the CV1 simulator suite plus a fuzz batch must pass for
      # this exact SHA before QA assets can be staged; stage refuses to package
      # without the passing sim-report.json, which travels in the QA artifact
      # and is revalidated at promote and publish.
      - name: Run CV1 simulator gate
        if: ${{ inputs.publish != 'publish' }}
        env:
          VER: ${{ steps.meta.outputs.ver }}
        run: |
          python3 omi/firmware/omi/sim/scenario_runner.py \
            --cache "$RUNNER_TEMP/cv1-sim" --jobs 4 --fuzz-seeds 40 \
            --firmware-version "$VER" --report "$RUNNER_TEMP/sim-report.json"

      # The simulator runs in Docker as root; its per-scenario flash images are
      # root-owned and unreadable to upload-artifact (EACCES) without this.
      - name: Fix simulator evidence ownership
        if: ${{ always() && inputs.publish != 'publish' }}
        run: |
          if [ -d "$RUNNER_TEMP/cv1-sim" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/cv1-sim"
          fi

      - name: Upload simulator evidence
        if: ${{ always() && inputs.publish != 'publish' }}
        uses: actions/upload-artifact@v7
        with:
          name: cv1-sim-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sim-report.json
            ${{ runner.temp }}/cv1-sim/runs/**
            ${{ runner.temp }}/cv1-sim/fuzz-failures/**
            !${{ runner.temp }}/cv1-sim/runs/**/sd.img
          if-no-files-found: ignore

      - name: Package QA release assets
        if: ${{ inputs.publish != 'publish' }}
        env:
          BUILD: omi/firmware/v2.9.0/build
          SIM_REPORT: ${{ runner.temp }}/sim-report.json
        run: python3 omi/firmware/scripts/ci/cv1_release.py stage

      - name: Download and validate tested QA assets
        if: ${{ inputs.publish == 'publish' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 omi/firmware/scripts/ci/cv1_release.py promote

      - name: Upload bench symbols (never a release asset)
        if: ${{ inputs.publish != 'publish' }}
        uses: actions/upload-artifact@v7
        with:
          name: cv1-bench-symbols-v${{ steps.meta.outputs.ver }}
          path: omi/firmware/v2.9.0/build/omi/zephyr/zephyr.elf
          if-no-files-found: error

      - name: Generate release body
        if: ${{ inputs.publish == 'publish' }}
        id: body
        env:
          TITLE: Omi CV1 Firmware v${{ steps.meta.outputs.ver }}
          VER: ${{ steps.meta.outputs.ver }}
          CHANGELOG: ${{ github.event.inputs.changelog }}
          MIN_FW: ${{ github.event.inputs.minimum_firmware_required }}
          MIN_APP: ${{ github.event.inputs.minimum_app_version }}
          MIN_APP_CODE: ${{ github.event.inputs.minimum_app_version_code }}
          OTA_STEPS: ${{ github.event.inputs.ota_update_steps }}
          # CV1 uses MCUboot (not legacy Adafruit secure DFU).
          IS_LEGACY_SECURE_DFU: 'False'
          HOW_TO_FLASH: |
            To update your device in the Omi app:
            1. Open the Omi app.
            2. Go to **Settings** > **Device Settings**.
            3. Select **Product Update**.
        run: |
          # The app's update check needs min_version: without it, it reports
          # "up to date" even when the backend offers the release (3.0.24).
          if [ -z "$MIN_FW" ]; then
            echo "::error::minimum_firmware_required is required to publish (every CV1 release so far: 3.0.6, with minimum_app_version 1.0.74 and minimum_app_version_code 438)"
            exit 1
          fi
          OUT="$RUNNER_TEMP/cv1-body.md"
          OUT="$OUT" bash omi/firmware/scripts/ci/make-release-body.sh
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        if: ${{ inputs.publish != 'publish' }}
        uses: actions/upload-artifact@v7
        with:
          name: cv1-qa-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cv1-assets/*
          if-no-files-found: error

      - name: Generate Omi Bot token
        id: app-token
        if: ${{ github.event.inputs.publish == 'publish' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.OMI_BOT_APP_ID }}
          private-key: ${{ secrets.OMI_BOT_PRIVATE_KEY }}
          # Least privilege: only what creating a release/tag needs.
          permission-contents: write

      - name: Publish GitHub Release
        if: ${{ inputs.publish == 'publish' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BODY_FILE: ${{ steps.body.outputs.file }}
        run: python3 omi/firmware/scripts/ci/cv1_release.py publish

name: C++ Device SDK

on:
  # Nightly calls run these same jobs against one immutable main snapshot.
  workflow_call:
    inputs:
      nightly_main_sha:
        description: Main SHA pinned by the unfiltered nightly caller
        type: string
        required: false
        default: ''
  pull_request:
    paths:
      - "sdks/device/cpp/**"
      - ".github/workflows/sdk-cpp.yml"
  push:
    branches: [main]
    paths:
      - "sdks/device/cpp/**"
      - ".github/workflows/sdk-cpp.yml"

env:
  # Abort a git HTTP transfer that stays under 1 KB/s for 60 s, so actions/checkout
  # retries instead of hanging 7-10 min until the TCP reset (#22890).
  GIT_HTTP_LOW_SPEED_LIMIT: "1000"
  GIT_HTTP_LOW_SPEED_TIME: "60"

jobs:
  cpp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/device/cpp
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.nightly_main_sha || github.sha }}
      # No third-party dependency step: the package must configure and build
      # from a bare checkout. A dependency that needs fetching fails here.
      - run: cmake -S . -B build -DOMI_DEVICE_BUILD_TESTS=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      # Consumers of the retired SimpleBLE flags must fail at configure time.
      - run: bash tests/retired-ble-flags.sh

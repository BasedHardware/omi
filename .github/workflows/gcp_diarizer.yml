name: Deploy Diarizer to GKE

on:
  # push:
  #  branches: [ "task/add-diarizer-with-pyannote-audio-model" ]
  #  paths:
  #    - 'backend/diarizer/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - prod
      branch:
        description: 'Branch to deploy from'
        required: true
        default: 'main'
      service:
        description: 'Select the GPU service to deploy'
        required: true
        default: 'diarizer'
        type: choice
        options:
          - diarizer
          - batch-pipeline-worker
      release_version:
        description: 'Release version (optional)'
        required: false
        default: ''
      image_digest:
        description: 'batch-pipeline-worker only: deploy this already-built gcr.io digest (sha256:...) instead of rebuilding; its omi.release.tree label must equal the source tree'
        required: false
        default: ''
      break_glass_lock:
        description: 'Break-glass: skip the shared prod-train lock (still serialized per target; the actor is recorded)'
        required: false
        default: false
        type: boolean

# Serialize Helm writers per GPU service and environment.
# B5 (named by David, 2026-10-19 fourth round #9): every prod deploy writer shares the
# prod-train lock, so trains, config-trains and GPU/listen deploys never overlap and the
# ramp controller can refuse while one runs (backend/scripts/prod_train_lock.py).
# Break-glass keeps the pre-B5 per-target lock. Development groups are unchanged.
concurrency:
  group: ${{ github.event.inputs.environment == 'prod' && github.event.inputs.break_glass_lock != 'true' && 'prod-train' || format('deploy-gke-{0}-{1}', github.event.inputs.service || 'diarizer', github.event.inputs.environment) }}
  cancel-in-progress: false

env:
  # Abort a git HTTP transfer that stays under 1 KB/s for 60 s, so actions/checkout
  # retries instead of hanging 7-10 min until the TCP reset (#22890).
  GIT_HTTP_LOW_SPEED_LIMIT: "1000"
  GIT_HTTP_LOW_SPEED_TIME: "60"
  SERVICE: ${{ github.event.inputs.service || 'diarizer' }}
  REGION: us-central1

jobs:
  deploy:
    environment: ${{ github.event.inputs.environment == 'prod' && 'prod' || 'development' }}
    permissions:
      contents: 'read'
      id-token: 'write'

    runs-on: ubuntu-latest
    # Healthy runs take ~14 min (build ~12, verify ~4). The cap leaves room for the
    # 45-minute verify backstop and still ends a wedged job with a verdict.
    timeout-minutes: 75
    steps:
      - name: Validate Environment Input
        run: |
          if [[ "${{ github.event.inputs.environment }}" != "development" && "${{ github.event.inputs.environment }}" != "prod" ]]; then
            echo "Invalid environment: ${{ github.event.inputs.environment }}. Must be 'development' or 'prod'."
            exit 1
          fi

      # To workaround "no space left on device" issue of GitHub-hosted runner
      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.environment == 'prod' && 'main' || github.event.inputs.branch }}
          fetch-depth: 0

      - name: Select merged production source and image tag
        id: vars
        env:
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment }}
          DEPLOY_REF: ${{ github.event.inputs.branch }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_ENVIRONMENT" == prod ]]; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            source_sha=$(git rev-parse origin/main)
            if [[ "$DEPLOY_REF" != main ]]; then
              [[ "$DEPLOY_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "Production source must be main or a full merged SHA" >&2; exit 1; }
              source_sha="$DEPLOY_REF"
            fi
            git merge-base --is-ancestor "$source_sha" origin/main
            git checkout --detach "$source_sha"
          fi
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve deployment target
        id: target
        shell: bash
        env:
          DEPLOY_ENV: ${{ vars.ENV }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          if [[ "$DEPLOY_ENV" != "dev" && "$DEPLOY_ENV" != "prod" ]]; then
            echo "Invalid deployment environment variable: $DEPLOY_ENV"
            exit 1
          fi
          case "$SERVICE" in
            diarizer)
              image_name=diarizer
              dockerfile=backend/diarizer/Dockerfile
              chart=backend/charts/diarizer
              values_file="backend/charts/diarizer/${DEPLOY_ENV}_omi_diarizer_values.yaml"
              ;;
            batch-pipeline-worker)
              image_name=batch-pipeline-worker
              dockerfile=backend/diarizer/Dockerfile.batch-pipeline
              chart=backend/charts/batch-pipeline-worker
              values_file="backend/charts/batch-pipeline-worker/${DEPLOY_ENV}_omi_batch-pipeline-worker_values.yaml"
              ;;
            *)
              echo "Unsupported service: $SERVICE"
              exit 1
              ;;
          esac
          if [[ ! -f "$dockerfile" || ! -f "$values_file" ]]; then
            echo "Deployment inputs are missing for $SERVICE in $DEPLOY_ENV"
            exit 1
          fi
          {
            echo "dockerfile=$dockerfile"
            echo "chart=$chart"
            echo "values_file=$values_file"
            echo "release_name=${DEPLOY_ENV}-omi-${SERVICE}"
            echo "image_repository=gcr.io/${GCP_PROJECT_ID}/${image_name}"
          } >> "$GITHUB_OUTPUT"

      # Prod: GitHub WIF as omi-ci-deployer-prod@ (credential-hygiene WS-C, plan v2 Phase E).
      # Development keeps its JSON lane.
      - name: Google Auth (prod WIF)
        id: auth-wif
        if: github.event.inputs.environment == 'prod'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/208440318997/locations/global/workloadIdentityPools/omi-gha-deploy-prod/providers/github
          service_account: omi-ci-deployer-prod@based-hardware.iam.gserviceaccount.com

      - name: Google Auth
        id: auth
        if: github.event.inputs.environment != 'prod'
        uses: google-github-actions/auth@v3
        with:
          # Development: GitHub WIF as the dev deployer, no JSON key (credential hygiene WS-D).
          workload_identity_provider: projects/1031333818730/locations/global/workloadIdentityPools/omi-gha-deploy-dev/providers/github
          service_account: omi-ci-deployer-dev@based-hardware-dev.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - run: gcloud auth configure-docker

      - name: Build and Push Docker image
        id: build
        if: github.event.inputs.image_digest == ''
        env:
          IMAGE_REPOSITORY: ${{ steps.target.outputs.image_repository }}
          DOCKERFILE: ${{ steps.target.outputs.dockerfile }}
        run: |
          image="${IMAGE_REPOSITORY}:${{ steps.vars.outputs.short_sha }}"
          # B7: every image names its source commit and tree, so a digest can be promoted by tree equality.
          docker build -t "$image" -f "$DOCKERFILE" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "omi.release.tree=$(git rev-parse 'HEAD^{tree}')" .
          python3 backend/scripts/runtime_image_contracts.py smoke --dockerfile "$DOCKERFILE" --image "$image"
          docker push "$image"
          if [[ "$SERVICE" == "batch-pipeline-worker" ]]; then
            image_digest="$(gcloud container images describe "$image" --format='value(image_summary.digest)')"
            if [[ ! "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "Registry did not return a valid image digest for $image"
              exit 1
            fi
            echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify promoted worker digest
        id: promote
        if: github.event.inputs.image_digest != ''
        env:
          IMAGE_REPOSITORY: ${{ steps.target.outputs.image_repository }}
          IMAGE_DIGEST: ${{ github.event.inputs.image_digest }}
        run: |
          set -euo pipefail
          # Digest promotion skips the 4.7 GB rebuild: the image must already be in this
          # environment's registry and carry the tree of the admitted source (contract (i)).
          if [[ "$SERVICE" != "batch-pipeline-worker" ]]; then
            echo "image_digest is supported only for batch-pipeline-worker" >&2
            exit 1
          fi
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "image_digest must be sha256:<64 hex>" >&2
            exit 1
          fi
          docker buildx imagetools inspect "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" \
            --format '{{ json .Image.Config.Labels }}' > "$RUNNER_TEMP/worker-labels.json"
          python3 backend/scripts/check_release_tree.py image \
            --labels-json "$RUNNER_TEMP/worker-labels.json" --sha "$(git rev-parse HEAD)"
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ env.REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Deploy Diarizer to GKE cluster using Helm
        env:
          DEPLOY_NAMESPACE: ${{ vars.ENV }}-omi-backend
          TARGET_CHART: ${{ steps.target.outputs.chart }}
          TARGET_VALUES: ${{ steps.target.outputs.values_file }}
          TARGET_RELEASE: ${{ steps.target.outputs.release_name }}
        run: |
          if [[ "$SERVICE" == "batch-pipeline-worker" ]]; then
            helm -n "$DEPLOY_NAMESPACE" upgrade --install "$TARGET_RELEASE" "./$TARGET_CHART" \
              -f "./$TARGET_VALUES" --set-string "image.digest=${{ steps.build.outputs.image_digest || steps.promote.outputs.image_digest }}"
          else
            helm -n "$DEPLOY_NAMESPACE" upgrade --install "$TARGET_RELEASE" "./$TARGET_CHART" \
              -f "./$TARGET_VALUES" --set-string "image.tag=${{ steps.vars.outputs.short_sha }}"
          fi

      # Every call here is bounded so the step always ends with a verdict and the
      # always() summary/notify steps run. batch-pipeline-worker is Recreate with a
      # 1500 s drain, so its wait covers drain plus GPU startup. A lost runner (run
      # 39456573983, 2026-10-20) still ends with no conclusion: re-run the job.
      - name: Verify rollout
        timeout-minutes: 45
        env:
          DEPLOY_NAMESPACE: ${{ vars.ENV }}-omi-backend
          DEPLOY_ENV: ${{ vars.ENV }}
          TARGET_RELEASE: ${{ steps.target.outputs.release_name }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.image_digest }}
        run: |
          rollout_timeout=600s
          if [[ "$SERVICE" == "batch-pipeline-worker" ]]; then
            rollout_timeout=2400s
          fi
          if ! kubectl -n "$DEPLOY_NAMESPACE" rollout status "deploy/$TARGET_RELEASE" --timeout="$rollout_timeout"; then
            timeout 120 python3 backend/scripts/deploy_status_report.py --env "$DEPLOY_ENV" --include-gke --gke-service "$SERVICE" || true
            exit 1
          fi
          if [[ -n "${EXPECTED_DIGEST:-}" ]]; then
            deployed_image="$(kubectl -n "$DEPLOY_NAMESPACE" get "deploy/$TARGET_RELEASE" --request-timeout=30s \
              -o jsonpath='{.spec.template.spec.containers[0].image}')"
            if [[ "$deployed_image" != *"@$EXPECTED_DIGEST" ]]; then
              echo "::error::deploy/$TARGET_RELEASE rolled out $deployed_image, not the built digest $EXPECTED_DIGEST"
              exit 1
            fi
            echo "deploy/$TARGET_RELEASE is ready on $EXPECTED_DIGEST"
          fi
          timeout 120 python3 backend/scripts/deploy_status_report.py --env "$DEPLOY_ENV" --include-gke --gke-service "$SERVICE"

      - name: Generate deployment summary
        if: always() && github.event.inputs.environment == 'prod'
        uses: BasedHardware/omi/.github/actions/deployment-summary@979b573718fd74b31edab3530adf2ed6082622dc
        with:
          deployment_tag: ${{ steps.vars.outputs.short_sha || 'unadmitted' }}
          environment: ${{ github.event.inputs.environment }}
          release_version: ${{ github.event.inputs.release_version }}
          status: ${{ job.status }}
          service: ${{ env.SERVICE }}

      - name: Notify deployment status on Telegram
        if: always() && github.event.inputs.environment == 'prod'
        uses: BasedHardware/omi/.github/actions/deployment-notifier@979b573718fd74b31edab3530adf2ed6082622dc
        with:
          deployment_tag: ${{ steps.vars.outputs.short_sha || 'unadmitted' }}
          environment: ${{ github.event.inputs.environment }}
          release_version: ${{ github.event.inputs.release_version }}
          status: ${{ job.status }}
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

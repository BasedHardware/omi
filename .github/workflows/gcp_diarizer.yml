name: Deploy Diarizer to GKE

on:
  # push:
  #  branches: [ "task/add-diarizer-with-pyannote-audio-model" ]
  #  paths:
  #    - 'backend/diarizer/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - prod
      branch:
        description: 'Branch to deploy from'
        required: true
        default: 'main'
      service:
        description: 'Select the GPU service to deploy'
        required: true
        default: 'diarizer'
        type: choice
        options:
          - diarizer
          - diarizer-batch
          - batch-pipeline-worker
      release_version:
        description: 'Release version (optional)'
        required: false
        default: ''
      image_digest:
        description: 'batch-pipeline-worker only: deploy this already-built gcr.io digest (sha256:...) instead of rebuilding; its omi.release.tree label must equal the source tree'
        required: false
        default: ''
      preserve_live_worker:
        description: 'Prod batch-pipeline-worker only: CAS image-only update, preserving the entire live runtime spec; siblings are verified but never rolled'
        required: false
        default: false
        type: boolean
      worker_live_baseline:
        description: 'Preserve-live only: admitted JSON from worker_image_only.py inventory (target identity/spec hash and all shared-image consumer bindings)'
        required: false
        default: ''
      worker_rollback_receipt:
        description: 'Preserve-live rollback only: saved safe receipt; requires its exact prior digest and full merged source SHA at or above f3902ec'
        required: false
        default: ''
      break_glass_lock:
        description: 'Break-glass: skip the shared prod-train lock (still serialized per target; the actor is recorded)'
        required: false
        default: false
        type: boolean
      worker_dry_run:
        description: 'Preserve-live only, under the shared lock; never writes, builds or pushes. Without a rollback receipt: forward admission plus a no-op prior-image admission (inverse not verified). With worker_rollback_receipt: server dry-run of the real inverse CAS'
        required: false
        default: false
        type: boolean
      mode:
        description: 'Use worker-depth-only for a production batch worker depth CAS'
        type: choice
        default: standard
        options:
          - standard
          - worker-depth-only
      depth_operation:
        description: 'Worker depth mode only: server rehearsal (plan), or rehearse and roll (apply)'
        type: choice
        default: plan
        options:
          - plan
          - apply
      target_depth:
        description: 'Worker depth mode only: target literal depth (3 or 4)'
        type: string
      expected_current_depth:
        description: 'Worker depth mode only: live literal depth (3 or 4)'
        type: string
      expected_worker_digest:
        description: 'Worker depth mode only: exact serving sha256 digest'
        type: string
      expected_worker_uid:
        description: 'Worker depth mode only: live primary Deployment UID'
        type: string
      expected_worker_resource_version:
        description: 'Worker depth mode only: live primary Deployment resourceVersion'
        type: string

# Serialize Helm writers per GPU service and environment.
# B5 (named by David, 2026-10-19 fourth round #9): every prod deploy writer shares the
# prod-train lock, so trains, config-trains and GPU/listen deploys never overlap and the
# ramp controller can refuse while one runs (backend/scripts/prod_train_lock.py).
# Break-glass keeps the pre-B5 per-target lock. Development groups are unchanged.
concurrency:
  group: ${{ github.event.inputs.environment == 'prod' && github.event.inputs.break_glass_lock != 'true' && 'prod-train' || format('deploy-gke-{0}-{1}', github.event.inputs.service || 'diarizer', github.event.inputs.environment) }}
  cancel-in-progress: false

env:
  # Abort a git HTTP transfer that stays under 1 KB/s for 60 s, so actions/checkout
  # retries instead of hanging 7-10 min until the TCP reset (#22890).
  GIT_HTTP_LOW_SPEED_LIMIT: "1000"
  GIT_HTTP_LOW_SPEED_TIME: "60"
  SERVICE: ${{ github.event.inputs.service || 'diarizer' }}
  REGION: us-central1

jobs:
  deploy:
    environment: ${{ github.event.inputs.environment == 'prod' && 'prod' || 'development' }}
    permissions:
      contents: 'read'
      id-token: 'write'

    runs-on: ubuntu-latest
    # Healthy runs take ~14 min (build ~12, verify ~4). The cap leaves room for the
    # 45-minute verify backstop and still ends a wedged job with a verdict.
    timeout-minutes: 75
    steps:
      # SCA-3748: the worker Helm upgrade writes record-seal-worker and
      # record-seal-repair lease env, so it binds the same four variables as
      # Sync, Listen and Pusher; prod values carry no vector of their own.
      # First step: a missing or invalid vector refuses before the image push,
      # the registry read or any GKE write.
      - name: Bind shared record token lease rollout inputs
        if: env.SERVICE == 'batch-pipeline-worker' && inputs.mode != 'worker-depth-only' && inputs.preserve_live_worker != true && inputs.worker_dry_run != true
        shell: bash
        env:
          RECORD_TOKEN_LEASE_ENVIRONMENT: ${{ github.event.inputs.environment == 'prod' && 'prod' || 'development' }}
          RECORD_TOKEN_LEASE_MODE: ${{ vars.RECORD_TOKEN_LEASE_MODE }}
          RECORD_TOKEN_LEASE_MODE_SERVE_PERCENT: ${{ vars.RECORD_TOKEN_LEASE_MODE_SERVE_PERCENT }}
          RECORD_TOKEN_LEASE_SECONDS: ${{ vars.RECORD_TOKEN_LEASE_SECONDS }}
          RECORD_TOKEN_LEASE_DEPLOYED_AT: ${{ vars.RECORD_TOKEN_LEASE_DEPLOYED_AT }}
        run: |
          python3 - <<'PYTHON'
          import math, os
          # SCA-3748: prod binds the four Actions variables verbatim. GitHub cannot tell a
          # missing variable from an empty one, and a blank mode is the runtime kill, so a
          # prod deploy refuses either instead of inventing serve. Only development keeps
          # the documented defaults; any other environment name fails closed like prod.
          keys = ('RECORD_TOKEN_LEASE_MODE', 'RECORD_TOKEN_LEASE_MODE_SERVE_PERCENT',
                  'RECORD_TOKEN_LEASE_SECONDS', 'RECORD_TOKEN_LEASE_DEPLOYED_AT')
          development_defaults = dict(zip(keys, ('serve', '100', '3600', '1795662310')))
          raw = {key: os.environ.get(key, '').strip() for key in keys}
          missing = [key for key in keys if not raw[key]]
          if missing and os.environ.get('RECORD_TOKEN_LEASE_ENVIRONMENT') != 'development':
              raise ValueError('set non-empty Actions variables before a prod deploy: ' + ', '.join(missing))
          raw.update({key: development_defaults[key] for key in missing})
          mode = raw['RECORD_TOKEN_LEASE_MODE']
          percent = int(raw['RECORD_TOKEN_LEASE_MODE_SERVE_PERCENT'])
          seconds = int(raw['RECORD_TOKEN_LEASE_SECONDS'])
          epoch = float(raw['RECORD_TOKEN_LEASE_DEPLOYED_AT'])
          if mode not in {'off', 'shadow', 'serve'} or not 0 <= percent <= 100 or not 1800 <= seconds <= 7200:
              raise ValueError('invalid record token lease rollout vector')
          if not math.isfinite(epoch) or epoch < 0 or (mode != 'off' and epoch <= 0):
              raise ValueError('enabled record token leases require a pinned release epoch')
          epoch_value = str(int(epoch)) if epoch.is_integer() else repr(epoch)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, value in {'RECORD_TOKEN_LEASE_MODE': mode, 'RECORD_TOKEN_LEASE_MODE_SERVE_PERCENT': percent,
                                 'RECORD_TOKEN_LEASE_SECONDS': seconds, 'RECORD_TOKEN_LEASE_DEPLOYED_AT': epoch_value}.items():
                  output.write(f'{key}={value}\n')
          PYTHON

      - name: Validate Environment Input
        env:
          PRESERVE_LIVE: ${{ inputs.preserve_live_worker }}
          LIVE_BASELINE: ${{ inputs.worker_live_baseline }}
          ROLLBACK_RECEIPT: ${{ inputs.worker_rollback_receipt }}
          SOURCE_REF: ${{ inputs.branch }}
          CANDIDATE_DIGEST: ${{ inputs.image_digest }}
          BREAK_GLASS_LOCK: ${{ inputs.break_glass_lock }}
          DRY_RUN: ${{ inputs.worker_dry_run }}
          MODE: ${{ inputs.mode || 'standard' }}
          DEPTH_OPERATION: ${{ inputs.depth_operation || 'plan' }}
          TARGET_DEPTH: ${{ inputs.target_depth }}
          EXPECTED_CURRENT_DEPTH: ${{ inputs.expected_current_depth }}
          EXPECTED_WORKER_DIGEST: ${{ inputs.expected_worker_digest }}
          EXPECTED_WORKER_UID: ${{ inputs.expected_worker_uid }}
          EXPECTED_WORKER_RESOURCE_VERSION: ${{ inputs.expected_worker_resource_version }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ "${{ github.event.inputs.environment }}" != "development" && "${{ github.event.inputs.environment }}" != "prod" ]]; then
            echo "Invalid environment: ${{ github.event.inputs.environment }}. Must be 'development' or 'prod'."
            exit 1
          fi
          if [[ "${MODE:-standard}" == worker-depth-only ]]; then
            [[ "${{ inputs.environment }}" == prod && "$SERVICE" == batch-pipeline-worker \
               && "$GITHUB_REF" == refs/heads/main && "$BREAK_GLASS_LOCK" != true ]] || {
              echo "Worker depth mode requires the main workflow, prod batch-pipeline-worker and the shared lock" >&2
              exit 1
            }
            [[ "$PRESERVE_LIVE" != true && "$DRY_RUN" != true \
               && -z "$LIVE_BASELINE$ROLLBACK_RECEIPT$CANDIDATE_DIGEST$RELEASE_VERSION" ]] || {
              echo "Worker depth mode cannot be combined with image deploy inputs" >&2
              exit 1
            }
            [[ "$SOURCE_REF" =~ ^[0-9abcdef]{40}$ && "$DEPTH_OPERATION" =~ ^(plan|apply)$ \
               && -n "$TARGET_DEPTH" && -n "$EXPECTED_CURRENT_DEPTH" && -n "$EXPECTED_WORKER_DIGEST" \
               && -n "$EXPECTED_WORKER_UID" && -n "$EXPECTED_WORKER_RESOURCE_VERSION" ]] || {
              echo "Worker depth mode requires a full reviewed branch SHA, operation and all five CAS inputs" >&2
              exit 1
            }
            exit 0
          fi
          [[ "${MODE:-standard}" == standard && "${DEPTH_OPERATION:-plan}" == plan \
             && -z "$TARGET_DEPTH$EXPECTED_CURRENT_DEPTH$EXPECTED_WORKER_DIGEST$EXPECTED_WORKER_UID$EXPECTED_WORKER_RESOURCE_VERSION" ]] || {
            echo "Worker depth inputs require worker-depth-only mode" >&2
            exit 1
          }
          if [[ "$PRESERVE_LIVE" == true ]]; then
            [[ "${{ inputs.environment }}" == prod && "$SERVICE" == batch-pipeline-worker && -n "$LIVE_BASELINE" ]] || {
              echo "preserve_live_worker requires prod, batch-pipeline-worker and an admitted inventory" >&2
              exit 1
            }
          elif [[ -n "$LIVE_BASELINE" ]]; then
            echo "worker_live_baseline requires preserve_live_worker" >&2
            exit 1
          fi
          if [[ "$DRY_RUN" == true ]]; then
            # A dry-run holds the shared prod-train lock and promotes an existing digest (no build or
            # push). With a rollback receipt it rehearses the real inverse; the rollback checks below apply.
            [[ "${{ inputs.environment }}" == prod && "$SERVICE" == batch-pipeline-worker && "$PRESERVE_LIVE" == true \
               && -n "$LIVE_BASELINE" && "$BREAK_GLASS_LOCK" != true \
               && "$CANDIDATE_DIGEST" =~ ^sha256:[abcdef0-9]{64}$ ]] || {
              echo "worker_dry_run requires prod preserve-live batch-pipeline-worker, the shared lock and an explicit digest" >&2
              exit 1
            }
          fi
          if [[ -n "$ROLLBACK_RECEIPT" ]]; then
            [[ "$PRESERVE_LIVE" == true && "$BREAK_GLASS_LOCK" != true && "$SOURCE_REF" =~ ^[abcdef0-9]{40}$ && "$CANDIDATE_DIGEST" =~ ^sha256:[abcdef0-9]{64}$ ]] || {
              echo "Rollback requires preserve-live, the shared lock, a full merged source SHA and an explicit prior digest" >&2
              exit 1
            }
          fi

      # To workaround "no space left on device" issue of GitHub-hosted runner
      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.environment == 'prod' && 'main' || github.event.inputs.branch }}
          fetch-depth: 0

      - name: Select merged production source and image tag
        id: vars
        env:
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment }}
          DEPLOY_REF: ${{ github.event.inputs.branch }}
          PRESERVE_LIVE: ${{ inputs.preserve_live_worker }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_ENVIRONMENT" == prod ]]; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            source_sha=$(git rev-parse origin/main)
            if [[ "$DEPLOY_REF" != main ]]; then
              [[ "$DEPLOY_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "Production source must be main or a full merged SHA" >&2; exit 1; }
              source_sha="$DEPLOY_REF"
            fi
            git merge-base --is-ancestor "$source_sha" origin/main
            if [[ "$PRESERVE_LIVE" == true ]]; then
              # Apply the same immutable source floor to forward and reverse image moves.
              git merge-base --is-ancestor f3902ec5435809d95ac7c15f6be7e9f056564d3d "$source_sha"
            fi
            git checkout --detach "$source_sha"
          fi
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable Firestore gate controls
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .github/firestore-workflow
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            .github/actions/firestore-readiness
            backend/scripts
            backend/database

      - name: Checkout immutable worker image-only control
        if: inputs.preserve_live_worker == true
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .github/worker-workflow
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/worker_image_only.py
            /.github/scripts/record_token_lease_live_guard.py

      - name: Verify serving Firestore indexes
        uses: ./.github/firestore-workflow/.github/actions/firestore-readiness
        with:
          source_sha: ${{ steps.vars.outputs.source_sha }}
          project_id: ${{ vars.RUNTIME_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ github.event.inputs.environment == 'prod' && 'projects/208440318997/locations/global/workloadIdentityPools/omi-gha-deploy-prod/providers/github' || 'projects/1031333818730/locations/global/workloadIdentityPools/omi-gha-deploy-dev/providers/github' }}
          service_account: omi-ci-index-check@based-hardware.iam.gserviceaccount.com

      - name: Resolve deployment target
        id: target
        shell: bash
        env:
          DEPLOY_ENV: ${{ vars.ENV }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          if [[ "$DEPLOY_ENV" != "dev" && "$DEPLOY_ENV" != "prod" ]]; then
            echo "Invalid deployment environment variable: $DEPLOY_ENV"
            exit 1
          fi
          values_overlay=""
          case "$SERVICE" in
            diarizer)
              image_name=diarizer
              dockerfile=backend/diarizer/Dockerfile
              chart=backend/charts/diarizer
              values_file="backend/charts/diarizer/${DEPLOY_ENV}_omi_diarizer_values.yaml"
              ;;
            # Separate batch release from the same chart and image: the batch overlay
            # stacks on the base values exactly as the lead-only install documents it
            # (backend/scripts/diarization_eval/batch_install.md); never install it
            # over prod-omi-diarizer. release_name stays ${DEPLOY_ENV}-omi-${SERVICE},
            # i.e. prod-omi-diarizer-batch / dev-omi-diarizer-batch.
            diarizer-batch)
              image_name=diarizer
              dockerfile=backend/diarizer/Dockerfile
              chart=backend/charts/diarizer
              values_file="backend/charts/diarizer/${DEPLOY_ENV}_omi_diarizer_values.yaml"
              values_overlay="backend/charts/diarizer/${DEPLOY_ENV}_omi_diarizer_batch_values.yaml"
              ;;
            batch-pipeline-worker)
              image_name=batch-pipeline-worker
              dockerfile=backend/diarizer/Dockerfile.batch-pipeline
              chart=backend/charts/batch-pipeline-worker
              values_file="backend/charts/batch-pipeline-worker/${DEPLOY_ENV}_omi_batch-pipeline-worker_values.yaml"
              ;;
            *)
              echo "Unsupported service: $SERVICE"
              exit 1
              ;;
          esac
          if [[ ! -f "$dockerfile" || ! -f "$values_file" ]]; then
            echo "Deployment inputs are missing for $SERVICE in $DEPLOY_ENV"
            exit 1
          fi
          if [[ -n "$values_overlay" && ! -f "$values_overlay" ]]; then
            echo "Deployment overlay is missing for $SERVICE in $DEPLOY_ENV: $values_overlay"
            exit 1
          fi
          {
            echo "dockerfile=$dockerfile"
            echo "chart=$chart"
            echo "values_file=$values_file"
            echo "values_overlay=$values_overlay"
            echo "release_name=${DEPLOY_ENV}-omi-${SERVICE}"
            echo "image_repository=gcr.io/${GCP_PROJECT_ID}/${image_name}"
          } >> "$GITHUB_OUTPUT"

      # Prod: GitHub WIF as omi-ci-deployer-prod@ (credential-hygiene WS-C, plan v2 Phase E).
      # Development keeps its JSON lane.
      - name: Google Auth (prod WIF)
        id: auth-wif
        if: github.event.inputs.environment == 'prod'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/208440318997/locations/global/workloadIdentityPools/omi-gha-deploy-prod/providers/github
          service_account: omi-ci-deployer-prod@based-hardware.iam.gserviceaccount.com

      - name: Google Auth
        id: auth
        if: github.event.inputs.environment != 'prod'
        uses: google-github-actions/auth@v3
        with:
          # Development: GitHub WIF as the dev deployer, no JSON key (credential hygiene WS-D).
          workload_identity_provider: projects/1031333818730/locations/global/workloadIdentityPools/omi-gha-deploy-dev/providers/github
          service_account: omi-ci-deployer-dev@based-hardware-dev.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ env.REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      # SCA-3748: preserve-live keeps the live env and swaps only the image, so the
      # four-variable binding cannot protect it. Before the image build and push and
      # before any GKE write, read the target's live lease env and refuse unless it
      # serves; new code over a live off/shadow vector would engage the kill.
      # Unset keys are the runtime's serve default (the chart renders none on this
      # Deployment). A rollback restores the recorded prior image and is not gated.
      - name: Refuse an image-only roll over a non-serving live lease env
        if: inputs.preserve_live_worker == true && inputs.worker_rollback_receipt == ''
        run: >-
          python3 .github/worker-workflow/.github/scripts/record_token_lease_live_guard.py
          --namespace prod-omi-backend --allow-unset deployment/prod-omi-batch-pipeline-worker

      - run: gcloud auth configure-docker
        if: inputs.mode != 'worker-depth-only'

      - name: Build and Push Docker image
        id: build
        if: inputs.mode != 'worker-depth-only' && github.event.inputs.image_digest == '' && inputs.worker_dry_run != true
        env:
          IMAGE_REPOSITORY: ${{ steps.target.outputs.image_repository }}
          DOCKERFILE: ${{ steps.target.outputs.dockerfile }}
        run: |
          image="${IMAGE_REPOSITORY}:${{ steps.vars.outputs.short_sha }}"
          # B7: every image names its source commit and tree, so a digest can be promoted by tree equality.
          docker build -t "$image" -f "$DOCKERFILE" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "omi.release.tree=$(git rev-parse 'HEAD^{tree}')" .
          python3 backend/scripts/runtime_image_contracts.py smoke --dockerfile "$DOCKERFILE" --image "$image"
          docker push "$image"
          # diarizer-batch deploys by digest with the tag emptied, matching the
          # batch install runbook; batch-pipeline-worker has always pinned its digest.
          if [[ "$SERVICE" == "batch-pipeline-worker" || "$SERVICE" == "diarizer-batch" ]]; then
            image_digest="$(gcloud container images describe "$image" --format='value(image_summary.digest)')"
            if [[ ! "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "Registry did not return a valid image digest for $image"
              exit 1
            fi
            echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify promoted worker digest
        id: promote
        if: inputs.mode != 'worker-depth-only' && github.event.inputs.image_digest != ''
        # Reachable in worker_dry_run mode, which holds prod-train: bound the registry read.
        timeout-minutes: 5
        env:
          IMAGE_REPOSITORY: ${{ steps.target.outputs.image_repository }}
          IMAGE_DIGEST: ${{ github.event.inputs.image_digest }}
        run: |
          set -euo pipefail
          # Digest promotion skips the 4.7 GB rebuild: the image must already be in this
          # environment's registry and carry the tree of the admitted source (contract (i)).
          if [[ "$SERVICE" != "batch-pipeline-worker" ]]; then
            echo "image_digest is supported only for batch-pipeline-worker" >&2
            exit 1
          fi
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "image_digest must be sha256:<64 hex>" >&2
            exit 1
          fi
          docker buildx imagetools inspect "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" \
            --format '{{ json .Image.Config.Labels }}' > "$RUNNER_TEMP/worker-labels.json"
          python3 backend/scripts/check_release_tree.py image \
            --labels-json "$RUNNER_TEMP/worker-labels.json" --sha "$(git rev-parse HEAD)"
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Rehearse or apply the production worker depth CAS
        if: inputs.mode == 'worker-depth-only' && inputs.worker_dry_run != true
        timeout-minutes: 55
        env:
          DEPLOY_ENV: ${{ vars.ENV }}
          REVIEWED_SOURCE: ${{ steps.vars.outputs.source_sha }}
          DEPTH_OPERATION: ${{ inputs.depth_operation }}
          TARGET_DEPTH: ${{ inputs.target_depth }}
          EXPECTED_CURRENT_DEPTH: ${{ inputs.expected_current_depth }}
          EXPECTED_WORKER_DIGEST: ${{ inputs.expected_worker_digest }}
          EXPECTED_WORKER_UID: ${{ inputs.expected_worker_uid }}
          EXPECTED_WORKER_RESOURCE_VERSION: ${{ inputs.expected_worker_resource_version }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_ENV" == prod ]] || { echo "Worker depth mode requires the production GKE environment" >&2; exit 1; }
          # Allow main to advance without changing the reviewed workflow or either control.
          git diff --exit-code --quiet "$GITHUB_WORKFLOW_SHA" "$REVIEWED_SOURCE" -- \
            .github/workflows/gcp_diarizer.yml .github/scripts/worker_depth_only.py .github/scripts/worker_image_only.py \
            backend/scripts/deploy_status_report.py \
            || { echo "The reviewed worker depth controls differ from the running workflow" >&2; exit 1; }
          python3 .github/scripts/worker_depth_only.py "$DEPTH_OPERATION" \
            --source "$REVIEWED_SOURCE" --current "$EXPECTED_CURRENT_DEPTH" --target "$TARGET_DEPTH" \
            --digest "$EXPECTED_WORKER_DIGEST" --uid "$EXPECTED_WORKER_UID" --version "$EXPECTED_WORKER_RESOURCE_VERSION"

      - name: Verify worker depth apply pod health
        if: inputs.mode == 'worker-depth-only' && inputs.depth_operation == 'apply' && inputs.worker_dry_run != true
        timeout-minutes: 3
        run: timeout 120 python3 backend/scripts/deploy_status_report.py --env prod --include-gke --gke-service batch-pipeline-worker

      - name: Deploy Diarizer to GKE cluster using Helm
        if: inputs.mode != 'worker-depth-only' && inputs.preserve_live_worker != true && inputs.worker_dry_run != true
        env:
          DEPLOY_NAMESPACE: ${{ vars.ENV }}-omi-backend
          TARGET_CHART: ${{ steps.target.outputs.chart }}
          TARGET_VALUES: ${{ steps.target.outputs.values_file }}
          TARGET_VALUES_OVERLAY: ${{ steps.target.outputs.values_overlay }}
          TARGET_RELEASE: ${{ steps.target.outputs.release_name }}
        run: |
          if [[ "$SERVICE" == "batch-pipeline-worker" ]]; then
            helm -n "$DEPLOY_NAMESPACE" upgrade --install "$TARGET_RELEASE" "./$TARGET_CHART" \
              -f "./$TARGET_VALUES" --set-string "image.digest=${{ steps.build.outputs.image_digest || steps.promote.outputs.image_digest }}" \
              --set-string "recordTokenLease.mode=${RECORD_TOKEN_LEASE_MODE:?bind step did not run}" \
              --set-string "recordTokenLease.servePercent=${RECORD_TOKEN_LEASE_MODE_SERVE_PERCENT:?bind step did not run}" \
              --set-string "recordTokenLease.seconds=${RECORD_TOKEN_LEASE_SECONDS:?bind step did not run}" \
              --set-string "recordTokenLease.deployedAt=${RECORD_TOKEN_LEASE_DEPLOYED_AT:?bind step did not run}"
          elif [[ "$SERVICE" == "diarizer-batch" ]]; then
            # Same invocation as the lead-only install (backend/scripts/diarization_eval/
            # batch_install.md): base values with the batch overlay stacked on top, the
            # published digest pinned and the tag explicitly emptied (the chart prefers
            # a validated digest), atomic so a failed upgrade rolls the release back.
            helm -n "$DEPLOY_NAMESPACE" upgrade --install "$TARGET_RELEASE" "./$TARGET_CHART" \
              -f "./$TARGET_VALUES" -f "./$TARGET_VALUES_OVERLAY" \
              --set-string image.tag= --set-string "image.digest=${{ steps.build.outputs.image_digest }}" \
              --atomic --wait --timeout 15m
          else
            helm -n "$DEPLOY_NAMESPACE" upgrade --install "$TARGET_RELEASE" "./$TARGET_CHART" \
              -f "./$TARGET_VALUES" --set-string "image.tag=${{ steps.vars.outputs.short_sha }}"
          fi

      # Uses workflow-owned controls even when the runtime source predates this mode.
      # Default success() is intentional: never write after a failed source/index/image gate.
      - name: Dry-run worker image preserving live runtime
        if: inputs.preserve_live_worker == true && inputs.worker_dry_run == true
        env:
          LIVE_BASELINE: ${{ inputs.worker_live_baseline }}
          ROLLBACK_RECEIPT: ${{ inputs.worker_rollback_receipt }}
          IMAGE_REPOSITORY: ${{ steps.target.outputs.image_repository }}
          IMAGE_DIGEST: ${{ steps.promote.outputs.image_digest }}
          # The helper refuses every API call other than a read or a server dry-run patch while set.
          WORKER_IMAGE_ONLY_DRY_RUN: "1"
        run: |
          set -euo pipefail
          umask 077
          echo "$LIVE_BASELINE" > "$RUNNER_TEMP/worker-live-baseline.json"
          rollback_args=()
          if [[ -n "$ROLLBACK_RECEIPT" ]]; then
            echo "$ROLLBACK_RECEIPT" > "$RUNNER_TEMP/worker-rollback-receipt.json"
            rollback_args=(--rollback-receipt "$RUNNER_TEMP/worker-rollback-receipt.json")
          fi
          python3 .github/worker-workflow/.github/scripts/worker_image_only.py dry-run \
            --baseline "$RUNNER_TEMP/worker-live-baseline.json" \
            --image "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" \
            "${rollback_args[@]}" \
            --receipt "$RUNNER_TEMP/worker-dry-run-receipt.json" | tee "$RUNNER_TEMP/worker-dry-run.json"
          {
            echo '### Worker preserve-live dry-run receipt (no write)'
            echo '```json'
            cat "$RUNNER_TEMP/worker-dry-run.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy worker image preserving live runtime
        if: inputs.preserve_live_worker == true && inputs.worker_dry_run != true
        env:
          LIVE_BASELINE: ${{ inputs.worker_live_baseline }}
          ROLLBACK_RECEIPT: ${{ inputs.worker_rollback_receipt }}
          IMAGE_REPOSITORY: ${{ steps.target.outputs.image_repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.image_digest || steps.promote.outputs.image_digest }}
        run: |
          set -euo pipefail
          umask 077
          echo "$LIVE_BASELINE" > "$RUNNER_TEMP/worker-live-baseline.json"
          rollback_args=()
          if [[ -n "$ROLLBACK_RECEIPT" ]]; then
            echo "$ROLLBACK_RECEIPT" > "$RUNNER_TEMP/worker-rollback-receipt.json"
            rollback_args=(--rollback-receipt "$RUNNER_TEMP/worker-rollback-receipt.json")
          fi
          python3 .github/worker-workflow/.github/scripts/worker_image_only.py deploy \
            --baseline "$RUNNER_TEMP/worker-live-baseline.json" \
            --image "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" \
            "${rollback_args[@]}" \
            --receipt "$RUNNER_TEMP/worker-image-receipt.json" | tee "$RUNNER_TEMP/worker-image-diff.json"
          {
            echo '### Worker image-only diff and rollback identity'
            echo '```json'
            cat "$RUNNER_TEMP/worker-image-diff.json"
            echo '```'
            echo 'Shared-image siblings remain on the admitted bindings. Existing repair-flags reapply and release canary gates remain required.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Every call here is bounded so the step always ends with a verdict and the
      # always() summary/notify steps run. batch-pipeline-worker is Recreate with a
      # 1500 s drain, so its wait covers drain plus GPU startup. A lost runner (run
      # 39456573983, 2026-10-20) still ends with no conclusion: re-run the job.
      - name: Verify rollout
        if: inputs.mode != 'worker-depth-only' && inputs.worker_dry_run != true
        timeout-minutes: 45
        env:
          DEPLOY_NAMESPACE: ${{ vars.ENV }}-omi-backend
          DEPLOY_ENV: ${{ vars.ENV }}
          TARGET_RELEASE: ${{ steps.target.outputs.release_name }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.image_digest || steps.promote.outputs.image_digest }}
          PRESERVE_LIVE: ${{ inputs.preserve_live_worker }}
        run: |
          rollout_timeout=600s
          if [[ "$SERVICE" == "batch-pipeline-worker" ]]; then
            rollout_timeout=2400s
          elif [[ "$SERVICE" == "diarizer-batch" ]]; then
            # Batch install runbook's rollout wait: one T4 replica on the dedicated pool.
            rollout_timeout=900s
          fi
          # Siblings start together; share the wait budget so two slow rollouts
          # cannot overrun this step's 45-minute deadline before diagnostics.
          rollout_deadline=$((SECONDS + ${rollout_timeout%s}))
          if ! kubectl -n "$DEPLOY_NAMESPACE" rollout status "deploy/$TARGET_RELEASE" --timeout="$rollout_timeout"; then
            timeout 120 python3 backend/scripts/deploy_status_report.py --env "$DEPLOY_ENV" --include-gke --gke-service "$SERVICE" || true
            exit 1
          fi
          if [[ -n "${EXPECTED_DIGEST:-}" ]]; then
            image_path='{.spec.template.spec.containers[0].image}'
            if [[ "$PRESERVE_LIVE" == true ]]; then
              image_path='{.spec.template.spec.containers[?(@.name=="worker")].image}'
            fi
            deployed_image="$(kubectl -n "$DEPLOY_NAMESPACE" get "deploy/$TARGET_RELEASE" --request-timeout=30s \
              -o "jsonpath=$image_path")"
            if [[ "$deployed_image" != *"@$EXPECTED_DIGEST" ]]; then
              echo "::error::deploy/$TARGET_RELEASE rolled out $deployed_image, not the expected digest $EXPECTED_DIGEST"
              exit 1
            fi
            echo "deploy/$TARGET_RELEASE is ready on $EXPECTED_DIGEST"
          fi
          # The T4 stockout fallback keeps its operator-set replicas across upgrades;
          # when it is serving, it must roll out the same digest too.
          if [[ "$SERVICE" == "batch-pipeline-worker" ]]; then
            fallback="$TARGET_RELEASE-t4"
            fallback_replicas="$(kubectl -n "$DEPLOY_NAMESPACE" get "deploy/$fallback" --request-timeout=30s \
              --ignore-not-found -o jsonpath='{.spec.replicas}')"
            if [[ -n "$fallback_replicas" && "$fallback_replicas" != "0" ]]; then
              fallback_remaining=$((rollout_deadline - SECONDS))
              if (( fallback_remaining <= 0 )); then
                echo "::error::rollout budget exhausted before verifying deploy/$fallback"
                exit 1
              fi
              kubectl -n "$DEPLOY_NAMESPACE" rollout status "deploy/$fallback" --timeout="${fallback_remaining}s" || exit 1
              if [[ -n "${EXPECTED_DIGEST:-}" ]]; then
                fallback_image="$(kubectl -n "$DEPLOY_NAMESPACE" get "deploy/$fallback" --request-timeout=30s \
                  -o jsonpath='{.spec.template.spec.containers[0].image}')"
                if [[ "$fallback_image" != *"@$EXPECTED_DIGEST" ]]; then
                  echo "::error::deploy/$fallback rolled out $fallback_image, not the expected digest $EXPECTED_DIGEST"
                  exit 1
                fi
              fi
              echo "deploy/$fallback ($fallback_replicas replicas) is ready"
            fi
          fi
          timeout 120 python3 backend/scripts/deploy_status_report.py --env "$DEPLOY_ENV" --include-gke --gke-service "$SERVICE"

      - name: Verify preserved worker runtime and sibling bindings
        if: inputs.preserve_live_worker == true && inputs.worker_dry_run != true
        run: |
          python3 .github/worker-workflow/.github/scripts/worker_image_only.py verify \
            --receipt "$RUNNER_TEMP/worker-image-receipt.json"

      - name: Generate deployment summary
        if: always() && github.event.inputs.environment == 'prod' && inputs.mode != 'worker-depth-only'
        uses: BasedHardware/omi/.github/actions/deployment-summary@979b573718fd74b31edab3530adf2ed6082622dc
        with:
          deployment_tag: ${{ steps.vars.outputs.short_sha || 'unadmitted' }}
          environment: ${{ github.event.inputs.environment }}
          release_version: ${{ inputs.worker_dry_run == true && 'DRY-RUN (no write)' || github.event.inputs.release_version }}
          status: ${{ job.status }}
          service: ${{ env.SERVICE }}

      - name: Notify deployment status on Telegram
        if: always() && github.event.inputs.environment == 'prod' && inputs.mode != 'worker-depth-only'
        uses: BasedHardware/omi/.github/actions/deployment-notifier@979b573718fd74b31edab3530adf2ed6082622dc
        with:
          deployment_tag: ${{ steps.vars.outputs.short_sha || 'unadmitted' }}
          environment: ${{ github.event.inputs.environment }}
          release_version: ${{ inputs.worker_dry_run == true && 'DRY-RUN (no write)' || github.event.inputs.release_version }}
          status: ${{ job.status }}
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

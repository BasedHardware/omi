name: Deploy Diarizer to GKE

on:
  # push:
  #  branches: [ "task/add-diarizer-with-pyannote-audio-model" ]
  #  paths:
  #    - 'backend/diarizer/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - prod
      branch:
        description: 'Branch to deploy from'
        required: true
        default: 'main'
      service:
        description: 'Select the GPU service to deploy'
        required: true
        default: 'diarizer'
        type: choice
        options:
          - diarizer
          - batch-pipeline-worker
      release_version:
        description: 'Release version (optional)'
        required: false
        default: ''

# Serialize Helm writers per GPU service and environment.
concurrency:
  group: deploy-gke-${{ github.event.inputs.service || 'diarizer' }}-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  SERVICE: ${{ github.event.inputs.service || 'diarizer' }}
  REGION: us-central1

jobs:
  deploy:
    environment: ${{ github.event.inputs.environment == 'prod' && 'prod' || 'development' }}
    permissions:
      contents: 'read'
      id-token: 'write'

    runs-on: ubuntu-latest
    steps:
      - name: Validate Environment Input
        run: |
          if [[ "${{ github.event.inputs.environment }}" != "development" && "${{ github.event.inputs.environment }}" != "prod" ]]; then
            echo "Invalid environment: ${{ github.event.inputs.environment }}. Must be 'development' or 'prod'."
            exit 1
          fi

      # To workaround "no space left on device" issue of GitHub-hosted runner
      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.environment == 'prod' && 'main' || github.event.inputs.branch }}
          fetch-depth: 0

      - name: Select merged production source and image tag
        id: vars
        env:
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment }}
          DEPLOY_REF: ${{ github.event.inputs.branch }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_ENVIRONMENT" == prod ]]; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            source_sha=$(git rev-parse origin/main)
            if [[ "$DEPLOY_REF" != main ]]; then
              [[ "$DEPLOY_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "Production source must be main or a full merged SHA" >&2; exit 1; }
              source_sha="$DEPLOY_REF"
            fi
            git merge-base --is-ancestor "$source_sha" origin/main
            git checkout --detach "$source_sha"
          fi
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve deployment target
        id: target
        shell: bash
        env:
          DEPLOY_ENV: ${{ vars.ENV }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          if [[ "$DEPLOY_ENV" != "dev" && "$DEPLOY_ENV" != "prod" ]]; then
            echo "Invalid deployment environment variable: $DEPLOY_ENV"
            exit 1
          fi
          case "$SERVICE" in
            diarizer)
              image_name=diarizer
              dockerfile=backend/diarizer/Dockerfile
              chart=backend/charts/diarizer
              values_file="backend/charts/diarizer/${DEPLOY_ENV}_omi_diarizer_values.yaml"
              ;;
            batch-pipeline-worker)
              image_name=batch-pipeline-worker
              dockerfile=backend/diarizer/Dockerfile.batch-pipeline
              chart=backend/charts/batch-pipeline-worker
              values_file="backend/charts/batch-pipeline-worker/${DEPLOY_ENV}_omi_batch-pipeline-worker_values.yaml"
              ;;
            *)
              echo "Unsupported service: $SERVICE"
              exit 1
              ;;
          esac
          if [[ ! -f "$dockerfile" || ! -f "$values_file" ]]; then
            echo "Deployment inputs are missing for $SERVICE in $DEPLOY_ENV"
            exit 1
          fi
          {
            echo "dockerfile=$dockerfile"
            echo "chart=$chart"
            echo "values_file=$values_file"
            echo "release_name=${DEPLOY_ENV}-omi-${SERVICE}"
            echo "image_repository=gcr.io/${GCP_PROJECT_ID}/${image_name}"
          } >> "$GITHUB_OUTPUT"

      # Prod: GitHub WIF as omi-ci-deployer-prod@ (credential-hygiene WS-C, plan v2 Phase E).
      # Development keeps its JSON lane.
      - name: Google Auth (prod WIF)
        id: auth-wif
        if: github.event.inputs.environment == 'prod'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/208440318997/locations/global/workloadIdentityPools/omi-gha-deploy-prod/providers/github
          service_account: omi-ci-deployer-prod@based-hardware.iam.gserviceaccount.com

      - name: Google Auth
        id: auth
        if: github.event.inputs.environment != 'prod'
        uses: google-github-actions/auth@v3
        with:
          # Development: GitHub WIF as the dev deployer, no JSON key (credential hygiene WS-D).
          workload_identity_provider: projects/1031333818730/locations/global/workloadIdentityPools/omi-gha-deploy-dev/providers/github
          service_account: omi-ci-deployer-dev@based-hardware-dev.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - run: gcloud auth configure-docker

      - name: Build and Push Docker image
        id: build
        env:
          IMAGE_REPOSITORY: ${{ steps.target.outputs.image_repository }}
          DOCKERFILE: ${{ steps.target.outputs.dockerfile }}
        run: |
          image="${IMAGE_REPOSITORY}:${{ steps.vars.outputs.short_sha }}"
          docker build -t "$image" -f "$DOCKERFILE" .
          python3 backend/scripts/runtime_image_contracts.py smoke --dockerfile "$DOCKERFILE" --image "$image"
          docker push "$image"
          if [[ "$SERVICE" == "batch-pipeline-worker" ]]; then
            image_digest="$(gcloud container images describe "$image" --format='value(image_summary.digest)')"
            if [[ ! "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "Registry did not return a valid image digest for $image"
              exit 1
            fi
            echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"
          fi

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ env.REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Deploy Diarizer to GKE cluster using Helm
        env:
          DEPLOY_NAMESPACE: ${{ vars.ENV }}-omi-backend
          TARGET_CHART: ${{ steps.target.outputs.chart }}
          TARGET_VALUES: ${{ steps.target.outputs.values_file }}
          TARGET_RELEASE: ${{ steps.target.outputs.release_name }}
        run: |
          if [[ "$SERVICE" == "batch-pipeline-worker" ]]; then
            helm -n "$DEPLOY_NAMESPACE" upgrade --install "$TARGET_RELEASE" "./$TARGET_CHART" \
              -f "./$TARGET_VALUES" --set-string "image.digest=${{ steps.build.outputs.image_digest }}"
          else
            helm -n "$DEPLOY_NAMESPACE" upgrade --install "$TARGET_RELEASE" "./$TARGET_CHART" \
              -f "./$TARGET_VALUES" --set-string "image.tag=${{ steps.vars.outputs.short_sha }}"
          fi

      - name: Verify rollout
        env:
          DEPLOY_NAMESPACE: ${{ vars.ENV }}-omi-backend
          DEPLOY_ENV: ${{ vars.ENV }}
          TARGET_RELEASE: ${{ steps.target.outputs.release_name }}
        run: |
          rollout_timeout=600s
          if [[ "$SERVICE" == "batch-pipeline-worker" ]]; then
            rollout_timeout=1800s
          fi
          if ! kubectl -n "$DEPLOY_NAMESPACE" rollout status "deploy/$TARGET_RELEASE" --timeout="$rollout_timeout"; then
            python3 backend/scripts/deploy_status_report.py --env "$DEPLOY_ENV" --include-gke --gke-service "$SERVICE" || true
            exit 1
          fi
          python3 backend/scripts/deploy_status_report.py --env "$DEPLOY_ENV" --include-gke --gke-service "$SERVICE"

      - name: Generate deployment summary
        if: always() && github.event.inputs.environment == 'prod'
        uses: BasedHardware/omi/.github/actions/deployment-summary@979b573718fd74b31edab3530adf2ed6082622dc
        with:
          deployment_tag: ${{ steps.vars.outputs.short_sha || 'unadmitted' }}
          environment: ${{ github.event.inputs.environment }}
          release_version: ${{ github.event.inputs.release_version }}
          status: ${{ job.status }}
          service: ${{ env.SERVICE }}

      - name: Notify deployment status on Telegram
        if: always() && github.event.inputs.environment == 'prod'
        uses: BasedHardware/omi/.github/actions/deployment-notifier@979b573718fd74b31edab3530adf2ed6082622dc
        with:
          deployment_tag: ${{ steps.vars.outputs.short_sha || 'unadmitted' }}
          environment: ${{ github.event.inputs.environment }}
          release_version: ${{ github.event.inputs.release_version }}
          status: ${{ job.status }}
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

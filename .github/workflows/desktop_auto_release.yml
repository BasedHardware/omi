name: Build Desktop Release Candidate

on:
  workflow_dispatch:
  # Continuous deployment: plan a beta candidate on every macOS-affecting merge to
  # main. The candidate flows through the two-machine qualification pipeline
  # (desktop_qualify_beta.yml: Codemagic primary lane + self-hosted qualify-m1-studio
  # and qualify-m4-mini fallbacks); on qualification success desktop_promote_beta.yml
  # advances the beta channel to the Codemagic-built, notarized, Sparkle-signed
  # artifact. The push filter is intentionally coarse (the planner does the precise
  # releasable-change check, excluding CHANGELOG/AGENTS/changelog/Backend-Rust); the
  # quiet-window, exact-SHA, and one-active-release fences still admit at most one
  # candidate at a time, so bursts collapse to the newest SHA. Keep these paths in
  # lockstep with DESKTOP_RELEASE_PATHS in plan-desktop-release.py; the alignment is
  # enforced by test_push_paths_cover_releasable_desktop_paths.
  push:
    branches: [main]
    paths:
      - 'desktop/macos/**'
      - 'codemagic.yaml'
      - 'scripts/dev-harness/dev_harness/qualification.py'
      - '.github/scripts/plan-desktop-release.py'
      - '.github/scripts/desktop-release-source-identity.py'
      - '.github/scripts/publish-desktop-candidate-tag.py'
      - '.github/scripts/verify-pre-tag-readiness.py'
      - '.github/workflows/desktop_auto_release.yml'
      - '.github/workflows/desktop_qualify_beta.yml'
      - '.github/workflows/desktop-swift-ci.yml'
  schedule:
    # Poll every 15 min. The push trigger fires immediately on merge, but at that
    # instant the change is inside the quiet window AND its required CI checks
    # (Build & Tests / Release Compile / Release Eligibility, ~10-20 min) are not
    # yet green, so the planner fail-closes. This frequent backstop re-evaluates
    # shortly after those checks settle and the active-release fence clears, so a
    # candidate reliably cuts without waiting for the next hour. Builds stay
    # serialized by the one-active-release fence, so this cannot pile up builds.
    - cron: '*/15 * * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  plan-release:
    runs-on: ubuntu-latest
    concurrency:
      group: desktop-release-planner-main
      cancel-in-progress: false
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      reason: ${{ steps.plan.outputs.reason }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Omi Bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.OMI_BOT_APP_ID }}
          private-key: ${{ secrets.OMI_BOT_PRIVATE_KEY }}

      - name: Plan desktop release
        id: plan
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python3 .github/scripts/plan-desktop-release.py \
            --repository "${{ github.repository }}" \
            --source-check-wait-seconds 1200 \
            --source-check-poll-seconds 30

      - name: Show release plan
        run: echo "${{ steps.plan.outputs.reason }}"

  # Candidate publication is one serialized trusted-M1 transaction: after the
  # immutable final-source binding it runs offline readiness, verifies that
  # receipt, then performs the only tag mutation. No cross-job handoff can leave
  # a stale receipt or duplicate M1 lifecycle in the gap.
  tag-release:
    needs: [plan-release]
    if: needs.plan-release.outputs.should_release == 'true'
    runs-on: [self-hosted, macos, omi-desktop-qualification, omi-qual-m1-studio]
    concurrency:
      group: desktop-auto-release-tag-main
      cancel-in-progress: false
    steps:
      - name: Generate Omi Bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.OMI_BOT_APP_ID }}
          private-key: ${{ secrets.OMI_BOT_PRIVATE_KEY }}

      # The native tag must be pushed by the Omi Bot installation, rather than
      # the workflow's GITHUB_TOKEN. GitHub suppresses recursively generated
      # events for GITHUB_TOKEN, which leaves Codemagic no tag webhook to build.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Recheck desktop release queue before tagging
        id: recheck
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Omi Bot token not available; cannot inspect previous release build status."
            exit 1
          fi

          python3 .github/scripts/plan-desktop-release.py \
            --repository "${{ github.repository }}" \
            --source-check-wait-seconds 1200 \
            --source-check-poll-seconds 30

      - name: Checkout exact releasable desktop source
        if: steps.recheck.outputs.should_release == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.recheck.outputs.source_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Compute next version and consolidate changelog
        if: steps.recheck.outputs.should_release == 'true'
        id: version
        run: |
          # Get latest desktop release tag
          LATEST=$(git tag -l 'v*-macos' | sort -V | tail -1)

          if [ -z "$LATEST" ]; then
            VERSION="0.0.1"
          else
            # Strip v prefix and +build-macos suffix  e.g. v0.11.11+11011-macos -> 0.11.11
            VER=$(echo "$LATEST" | sed -E 's/^v([0-9.]+)\+[0-9]+-macos$/\1/')
            MAJOR=$(echo "$VER" | cut -d. -f1)
            MINOR=$(echo "$VER" | cut -d. -f2)
            PATCH=$(echo "$VER" | cut -d. -f3)
            PATCH=$((${PATCH:-0} + 1))
            VERSION="$MAJOR.$MINOR.$PATCH"
          fi

          # Build number: 0.11.12 -> 11012  (each component * 1000, summed)
          BUILD_NUMBER=$(echo "$VERSION" | tr '.' '\n' | awk '{s=s*1000+$1}END{print s}')
          RELEASE_TAG="v${VERSION}+${BUILD_NUMBER}-macos"

          echo "Latest tag : ${LATEST:-none}"
          echo "New version: $VERSION"
          echo "New tag    : $RELEASE_TAG"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          # Consolidate unreleased changelog fragments into a versioned release
          TODAY=$(date -u +%Y-%m-%d)
          python3 .github/scripts/desktop-changelog.py consolidate \
            --version "$VERSION" \
            --date "$TODAY" \
            --write

      - name: Commit changelog and prepare sync branch
        if: steps.recheck.outputs.should_release == 'true'
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          PLANNED_SOURCE_SHA="${{ steps.recheck.outputs.source_sha }}"
          # A version-only changelog branch can belong to an earlier planner
          # source after a retry. Binding the branch to the immutable source
          # avoids rewriting that stale branch or confusing its PR with this
          # candidate; published tags are never touched by this recovery path.
          BRANCH="changelog/v${VERSION}-${PLANNED_SOURCE_SHA:0:12}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # A rerun for the same source must reuse its immutable branch commit.
          # The source-qualified branch name intentionally ignores stale legacy
          # `changelog/v<version>` branches from an older planner source.
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null; then
            git fetch --no-tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            CHANGELOG_COMMIT="$(git rev-parse "origin/$BRANCH^{commit}")"
            test "$(git rev-parse "${CHANGELOG_COMMIT}^1")" = "$PLANNED_SOURCE_SHA"
            git checkout -B "$BRANCH" "$CHANGELOG_COMMIT"
            {
              echo "changed=true"
              echo "commit=$CHANGELOG_COMMIT"
              echo "reused=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add desktop/macos/CHANGELOG.json desktop/macos/changelog
          if git diff --cached --quiet; then
            # Nothing needed to move through a PR. The direct tag path below
            # still requires the planner SHA to be the fresh main tip.
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: consolidate changelog for v${VERSION}"
          CHANGELOG_COMMIT="$(git rev-parse HEAD)"
          git checkout -B "$BRANCH" "$CHANGELOG_COMMIT"
          git push origin "$BRANCH"
          {
            echo "changed=true"
            echo "commit=$CHANGELOG_COMMIT"
            echo "reused=false"
          } >> "$GITHUB_OUTPUT"

      - name: Create and regular-merge PR to sync changelog back to main
        if: steps.recheck.outputs.should_release == 'true' && steps.changelog.outputs.changed == 'true'
        id: changelog-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Omi Bot token not available; cannot merge changelog PR."
            exit 1
          fi

          VERSION="${{ steps.version.outputs.version }}"
          PLANNED_SOURCE_SHA="${{ steps.recheck.outputs.source_sha }}"
          BRANCH="changelog/v${VERSION}-${PLANNED_SOURCE_SHA:0:12}"

          PR_NUMBER=$(gh pr list \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr list \
              --head "$BRANCH" \
              --base main \
              --state merged \
              --json number \
              --jq '.[0].number')
            if [ -z "$PR_NUMBER" ]; then
              PR_URL=$(gh pr create \
                --title "Update desktop changelog for v${VERSION} [skip ci]" \
                --body "Auto-generated: consolidates unreleased changelog fragments into v${VERSION} and regenerates CHANGELOG.json." \
                --base main \
                --head "$BRANCH")
              PR_NUMBER=$(echo "$PR_URL" | awk -F/ '{print $NF}')
            fi
          fi

          PR_STATE=$(gh pr view "$PR_NUMBER" --json state --jq '.state')
          if [ "$PR_STATE" != "MERGED" ]; then
            # This remains a regular merge. If the bot lacks the protected
            # branch override, the workflow must fail before it can create a
            # tag instead of tagging a side branch.
            gh pr merge "$PR_NUMBER" --merge --admin || gh pr merge "$PR_NUMBER" --merge
          fi

          PR_STATE=$(gh pr view "$PR_NUMBER" --json state --jq '.state')
          test "$PR_STATE" = "MERGED"
          MERGED_MAIN_SHA=$(gh pr view "$PR_NUMBER" --json mergeCommit --jq '.mergeCommit.oid')
          PR_URL=$(gh pr view "$PR_NUMBER" --json url --jq '.url')
          test -n "$MERGED_MAIN_SHA"
          {
            echo "number=$PR_NUMBER"
            echo "url=$PR_URL"
            echo "merged_main_sha=$MERGED_MAIN_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Replan release source after changelog sync
        # A newer releasable desktop change may merge while the changelog branch
        # is being prepared. The regular changelog merge must remain intact, but
        # its original planner source is then intentionally stale. Replan from
        # fresh main before binding evidence so this run either tags the newly
        # qualified source or defers cleanly without a stale-source failure.
        if: steps.recheck.outputs.should_release == 'true' && steps.changelog.outputs.changed == 'true'
        id: replan
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Omi Bot token not available; cannot replan after changelog sync."
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git checkout --detach origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          python3 .github/scripts/plan-desktop-release.py \
            --repository "${{ github.repository }}" \
            --source-check-wait-seconds 1200 \
            --source-check-poll-seconds 30

      - name: Select final release plan
        if: steps.recheck.outputs.should_release == 'true'
        id: final-plan
        run: |
          set -euo pipefail
          if [ "${{ steps.changelog.outputs.changed }}" = "true" ]; then
            # The merge above can advance main. Always use the post-merge plan,
            # even when it defers, so a stale initial plan cannot reach tagging.
            SHOULD_RELEASE="${{ steps.replan.outputs.should_release }}"
            SOURCE_SHA="${{ steps.replan.outputs.source_sha }}"
          else
            SHOULD_RELEASE="${{ steps.recheck.outputs.should_release }}"
            SOURCE_SHA="${{ steps.recheck.outputs.source_sha }}"
          fi
          {
            echo "should_release=$SHOULD_RELEASE"
            echo "source_sha=$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Bind immutable planner evidence to fresh main
        if: steps.final-plan.outputs.should_release == 'true'
        id: identity
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ steps.version.outputs.release_tag }}"
          PLANNED_SOURCE_SHA="${{ steps.final-plan.outputs.source_sha }}"
          CHANGELOG_CHANGED="${{ steps.changelog.outputs.changed }}"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          MAIN_SHA="$(git rev-parse 'origin/main^{commit}')"

          if [ "$CHANGELOG_CHANGED" = true ]; then
            CHANGELOG_COMMIT="${{ steps.changelog.outputs.commit }}"
            CHANGELOG_PR="${{ steps.changelog-pr.outputs.url }}"
            CHANGELOG_PARENT_SHA="$(git rev-parse "${CHANGELOG_COMMIT}^1")"
            CANDIDATE_SHA="$MAIN_SHA"
            python3 .github/scripts/desktop-release-source-identity.py \
              --release-tag "$RELEASE_TAG" \
              --planned-source-sha "$PLANNED_SOURCE_SHA" \
              --candidate-source-sha "$CANDIDATE_SHA" \
              --origin-main-sha "$MAIN_SHA" \
              --changelog-parent-sha "$CHANGELOG_PARENT_SHA" \
              --changelog-commit "$CHANGELOG_COMMIT" \
              --changelog-pr "$CHANGELOG_PR" \
              --output "$RUNNER_TEMP/desktop-release-source-identity.json"
          else
            CANDIDATE_SHA="$MAIN_SHA"
            python3 .github/scripts/desktop-release-source-identity.py \
              --release-tag "$RELEASE_TAG" \
              --planned-source-sha "$PLANNED_SOURCE_SHA" \
              --candidate-source-sha "$CANDIDATE_SHA" \
              --origin-main-sha "$MAIN_SHA" \
              --output "$RUNNER_TEMP/desktop-release-source-identity.json"
          fi

          {
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "evidence_path=$RUNNER_TEMP/desktop-release-source-identity.json"
          } >> "$GITHUB_OUTPUT"

      - name: Retain immutable planner source evidence
        if: steps.final-plan.outputs.should_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-planner-source-identity-${{ steps.version.outputs.release_tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.identity.outputs.evidence_path }}
          if-no-files-found: error
          overwrite: false

      - name: Run ownership-scoped M1 pre-tag readiness
        if: steps.final-plan.outputs.should_release == 'true'
        env:
          OMI_READINESS_LANE: ci
        run: |
          set -euo pipefail
          desktop/macos/scripts/pre-tag-readiness.sh \
            --source-repository "$GITHUB_WORKSPACE" \
            --evidence "$RUNNER_TEMP/desktop-pre-tag-readiness.json" \
            "${{ steps.identity.outputs.candidate_sha }}"

      - name: Verify M1 readiness receipt
        if: steps.final-plan.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-pre-tag-readiness.py verify \
            --evidence "$RUNNER_TEMP/desktop-pre-tag-readiness.json" \
            --source-sha "${{ steps.identity.outputs.candidate_sha }}"

      - name: Retain redacted M1 readiness receipt
        if: always() && steps.final-plan.outputs.should_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-pre-tag-readiness-${{ steps.version.outputs.release_tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-pre-tag-readiness.json
          if-no-files-found: error
          overwrite: false

      - name: Publish immutable tag from exact live main source
        if: steps.final-plan.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ steps.version.outputs.release_tag }}"
          CANDIDATE_SHA="${{ steps.identity.outputs.candidate_sha }}"
          EVIDENCE_PATH="${{ steps.identity.outputs.evidence_path }}"

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Omi Bot token not available; cannot publish a candidate tag." >&2
            exit 1
          fi
          # The publisher refetches GitHub's authoritative main immediately
          # before the native lightweight-tag push. A moved main or an existing
          # tag fails without creating or rewriting a candidate ref.
          python3 .github/scripts/publish-desktop-candidate-tag.py \
            --repository "${{ github.repository }}" \
            --release-tag "$RELEASE_TAG" \
            --candidate-sha "$CANDIDATE_SHA" \
            --evidence "$EVIDENCE_PATH"

          git fetch --no-tags origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$CANDIDATE_SHA"

      - name: Verify native Codemagic tag intake or dispatch fenced fallback
        if: steps.final-plan.outputs.should_release == 'true'
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
        run: |
          # The helper waits the complete native-intake budget first. It posts at
          # most one tag-bound fallback only after a final all-state same-tag
          # absence fence; any existing same-tag build remains canonical.
          python3 .github/scripts/check-codemagic-tag-intake.py \
            --app-id "66c95e6ec76853c447b8bcbb" \
            --workflow-id "omi-desktop-swift-release" \
            --release-tag "${{ steps.version.outputs.release_tag }}" \
            --source-sha "${{ steps.identity.outputs.candidate_sha }}" \
            --timeout-seconds 600 \
            --poll-seconds 15 \
            --dispatch-fallback-on-absence \
            --evidence "$RUNNER_TEMP/codemagic-native-tag-intake.json"

      - name: Retain native Codemagic tag intake evidence
        if: always() && steps.final-plan.outputs.should_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codemagic-native-tag-intake-${{ steps.version.outputs.release_tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codemagic-native-tag-intake.json
          if-no-files-found: error
          overwrite: false

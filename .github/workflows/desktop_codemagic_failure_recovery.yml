name: Desktop Release Recovery Required

# Manual dispatch only (David, 2026-11-04). A check_run trigger fired this workflow
# for every check completion on every commit (~100 runs per main SHA), which buried
# real runs in head_sha lookups. Dispatch from main with the failed Codemagic build ID.
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Exact failed Codemagic build ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-codemagic-recovery-${{ inputs.build_id }}
  cancel-in-progress: false

env:
  # Abort a git HTTP transfer that stays under 1 KB/s for 60 s, so actions/checkout
  # retries instead of hanging 7-10 min until the TCP reset (#22890).
  GIT_HTTP_LOW_SPEED_LIMIT: "1000"
  GIT_HTTP_LOW_SPEED_TIME: "60"

jobs:
  recovery-capsule:
    name: Agent recovery capsule
    # The check_run arm below is unreachable now that only workflow_dispatch triggers
    # this workflow; it is kept so the job definition (and its CI budget row) is unchanged.
    if: >-
      github.repository == 'BasedHardware/omi' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.check_run.name == 'Release OMI Desktop (Swift)' &&
        github.event.check_run.status == 'completed' &&
        github.event.check_run.conclusion == 'failure' &&
        github.event.check_run.app.slug == 'codemagic-ci-cd' &&
        startsWith(github.event.check_run.details_url, 'https://codemagic.io/app/66c95e6ec76853c447b8bcbb/build/')))
    # Dispatch from main: the release environment's branch policy is main-only, so a
    # dispatch from any other ref is refused at the environment.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout recovery controls
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Create credential-safe recovery capsule
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          MANUAL_BUILD_ID: ${{ inputs.build_id }}
        run: |
          args=(
            --profiles .github/scripts/desktop-codemagic-recovery-profiles.json
            --output "$RUNNER_TEMP/desktop-codemagic-recovery.json"
            --summary "$RUNNER_TEMP/desktop-codemagic-recovery.md"
          )
          args+=(--build-id "$MANUAL_BUILD_ID")
          for attempt in 1 2 3 4 5 6; do
            if python3 .github/scripts/desktop-codemagic-failure-recovery.py "${args[@]}"; then
              break
            fi
            if [[ "$attempt" == "6" ]]; then
              echo "Codemagic recovery metadata was not ready after six attempts" >&2
              exit 1
            fi
            sleep 10
          done
          cat "$RUNNER_TEMP/desktop-codemagic-recovery.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain recovery capsule
        uses: actions/upload-artifact@v7
        with:
          name: desktop-codemagic-recovery-${{ inputs.build_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/desktop-codemagic-recovery.json
          if-no-files-found: error
          overwrite: false

name: v5 Checks

on:
  pull_request:
    branches: [main]
    paths: ['v5/**', '.github/workflows/v5-checks.yml']
  push:
    branches: [main]
    paths: ['v5/**', '.github/workflows/v5-checks.yml']

permissions:
  contents: read

concurrency:
  group: v5-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate v5
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: v5
    env:
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install portable backend dependencies
        run: bun install --cwd backends/example-platform --frozen-lockfile
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android HTTP transport regression
        run: scripts/test-android-http
      - name: Build workspace dependencies
        run: bun run --cwd packages/contracts/ratified build && bun x tsc -b
      - name: Format check
        run: bun run --cwd apps/backend-worker format:check
      - name: Lint
        run: bun run --cwd apps/backend-worker lint
      - name: Typecheck
        run: bun run --cwd apps/backend-worker typecheck
      - name: Test
        run: bun run --cwd apps/backend-worker test
      - name: Client contract regressions
        run: bun run --cwd react-native test -- --runInBand && bun run --cwd pwa test
      - name: Portable backend contracts
        run: bun run platform:check
      - name: Portable PostgreSQL integration and runtime parity
        timeout-minutes: 20
        run: bun run --cwd backends/example-platform test:postgres
      - name: Dry run deploy
        run: bun run --cwd apps/backend-worker deploy:dry-run
      - name: Full v5 gate
        run: bun run check

  apple-auth:
    name: Apple host regressions
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: v5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Apple auth and host regression
        run: scripts/test-apple-auth

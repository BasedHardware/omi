name: Desktop Checks

on:
  # Nightly calls run these same jobs against one immutable main snapshot.
  workflow_call:
    inputs:
      nightly_main_sha:
        description: Main SHA pinned by the unfiltered nightly caller
        type: string
        required: false
        default: ''
  push:
    branches: main
  pull_request:
    branches: main

concurrency:
  group: desktop-checks-${{ github.event.pull_request.number || github.ref }}-${{ inputs.nightly_main_sha != '' && format('nightly-{0}', github.run_id) || 'normal' }}
  cancel-in-progress: true

env:
  # Abort a git HTTP transfer that stays under 1 KB/s for 60 s, so actions/checkout
  # retries instead of hanging 7-10 min until the TCP reset (#22890).
  GIT_HTTP_LOW_SPEED_LIMIT: "1000"
  GIT_HTTP_LOW_SPEED_TIME: "60"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      diff_base: ${{ steps.changes.outputs.diff_base }}
      has_desktop_agent_runtime: ${{ inputs.nightly_main_sha != '' && 'true' || (steps.changes.outputs.has_desktop_agent_runtime) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.nightly_main_sha || github.sha }}
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        uses: ./.github/actions/detect-changes

  agent-runtime:
    name: Agent Runtime
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.has_desktop_agent_runtime == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.nightly_main_sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js for desktop agent runtime
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            desktop/macos/agent/package-lock.json
            desktop/macos/pi-mono-extension/package-lock.json

      - name: Check desktop agent runtime
        run: desktop/macos/scripts/test-tool-surfaces.sh

name = "omi-edge-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[vars]
EDGE_PROVIDER = "cloudflare"
# Comma list: health,whoami,memory,conversation,tasks,search
# Enable peel gradually. memory|conversation|tasks mount Python path parity proxies.
EDGE_MODULES = "health,whoami,memory,conversation,tasks,search"
EDGE_PROXY_ORIGIN = "true"
ORIGIN_API_BASE = "https://api.omi.me"
FIREBASE_PROJECT_ID = "based-hardware"
TENANT_SHARD_COUNT = "64"

# Enable modules gradually, e.g.:
# EDGE_MODULES = "health,whoami,memory,search"

# [[kv_namespaces]]
# binding = "TENANT_KV"
# id = "replace-me"
